<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" font-family="Inter, sans-serif">
<title>Chain rule: multiply the two local slopes</title>
<desc>Block diagram x to u equals 3x plus 1 to y equals u squared at x equals 1, with slopes 3 and 8 and a step of 0.01 mapped to 0.03 and 0.24.</desc>
<rect width="900" height="430" rx="14" fill="#17181b"/>

<text x="32" y="44" font-size="22" font-weight="bold" fill="#e9e7e3">Chain rule: multiply the two local slopes</text>
<text x="32" y="92" font-size="17" font-weight="bold" fill="#e9e7e3">Values at x = 1</text>
<rect x="32" y="108" width="190" height="56" rx="10" fill="#22252a" stroke="#3d4148" stroke-width="1.5"/>
<text x="127" y="141" font-size="15" font-weight="600" text-anchor="middle" fill="#e9e7e3">x = 1</text>
<rect x="355" y="108" width="190" height="56" rx="10" fill="#22252a" stroke="#3d4148" stroke-width="1.5"/>
<text x="450" y="141" font-size="15" font-weight="600" text-anchor="middle" fill="#e9e7e3">u = 3x + 1 = 4</text>
<rect x="678" y="108" width="190" height="56" rx="10" fill="#22252a" stroke="#3d4148" stroke-width="1.5"/>
<text x="773" y="141" font-size="15" font-weight="600" text-anchor="middle" fill="#e9e7e3">y = u² = 16</text>
<text x="32" y="224" font-size="17" font-weight="bold" fill="#e9e7e3">A step of 0.01 in x</text>
<rect x="32" y="240" width="190" height="56" rx="10" fill="#22252a" stroke="#3d4148" stroke-width="1.5"/>
<text x="127" y="273" font-size="15" font-weight="600" text-anchor="middle" fill="#e9e7e3">Δx = 0.01</text>
<rect x="355" y="240" width="190" height="56" rx="10" fill="#22252a" stroke="#3d4148" stroke-width="1.5"/>
<text x="450" y="273" font-size="15" font-weight="600" text-anchor="middle" fill="#e9e7e3">Δu ≈ 3 × 0.01 = 0.03</text>
<rect x="678" y="240" width="190" height="56" rx="10" fill="#22252a" stroke="#3d4148" stroke-width="1.5"/>
<text x="773" y="273" font-size="15" font-weight="600" text-anchor="middle" fill="#e9e7e3">Δy ≈ 8 × 0.03 = 0.24</text>
<line x1="226" y1="136" x2="338.0" y2="136.0" stroke="#e0904f" stroke-width="2.5"/>
<polygon points="349.0,136.0 338.0,141.5 338.0,130.5" fill="#e0904f"/>
<line x1="549" y1="136" x2="661.0" y2="136.0" stroke="#e0904f" stroke-width="2.5"/>
<polygon points="672.0,136.0 661.0,141.5 661.0,130.5" fill="#e0904f"/>
<line x1="226" y1="268" x2="338.0" y2="268.0" stroke="#e0904f" stroke-width="2.5"/>
<polygon points="349.0,268.0 338.0,273.5 338.0,262.5" fill="#e0904f"/>
<line x1="549" y1="268" x2="661.0" y2="268.0" stroke="#e0904f" stroke-width="2.5"/>
<polygon points="672.0,268.0 661.0,273.5 661.0,262.5" fill="#e0904f"/>
<text x="289" y="126" font-size="15" font-weight="600" text-anchor="middle" fill="#e0904f">du/dx = 3</text>
<text x="611" y="126" font-size="15" font-weight="600" text-anchor="middle" fill="#e0904f">dy/du = 2u = 8</text>
<text x="611" y="160" font-size="14" text-anchor="middle" fill="#a7adb5">(at u = 4)</text>
<text x="289" y="258" font-size="15" font-weight="600" text-anchor="middle" fill="#e0904f">× 3</text>
<text x="611" y="258" font-size="15" font-weight="600" text-anchor="middle" fill="#e0904f">× 8</text>
<text x="868" y="316" font-size="14" text-anchor="end" fill="#a7adb5">exact 0.2409</text>
<rect x="32" y="336" width="836" height="72" rx="10" fill="#22252a"/>
<text x="52" y="366" font-size="17" font-weight="bold" fill="#6fc693">dy/dx = (dy/du)(du/dx) = 8 × 3 = 24</text>
<text x="52" y="392" font-size="15" fill="#e58a80">8 alone predicts Δy ≈ 0.08: three times too small</text>
</svg>
