<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" font-family="Inter, Arial, sans-serif" font-size="14">
<rect width="720" height="340" fill="#111827" rx="12"/>
<g fill="#e5e7eb">
<text x="30" y="36" font-size="15" font-weight="bold">std::vector&lt;double&gt; v{2.0, 4.0, 6.0}</text>
<text x="52" y="136" text-anchor="middle">v[0]</text><text x="122" y="136" text-anchor="middle">v[1]</text><text x="192" y="136" text-anchor="middle">v[2]</text>
<text x="262" y="136" text-anchor="middle" fill="#f97316">v[3]</text>
<text x="52" y="107" text-anchor="middle" font-size="16">2.0</text><text x="122" y="107" text-anchor="middle" font-size="16">4.0</text><text x="192" y="107" text-anchor="middle" font-size="16">6.0</text>
<text x="262" y="107" text-anchor="middle" fill="#f97316" font-size="16">?</text>
<text x="30" y="186" fill="#a3e635">size() = 3, valid indices 0 .. 2</text>
<text x="30" y="210" fill="#f97316">v[3] is undefined behaviour; v.at(3) throws</text>
<text x="30" y="260" fill="#38bdf8">last valid index = size() - 1</text>
<text x="30" y="284" fill="#e5e7eb">(size_t is unsigned: 0 - 1 wraps around)</text>
<text x="380" y="36" font-size="15" font-weight="bold">Division depends on operand types</text>
<text x="396" y="104">5 / 2</text><text x="396" y="124" fill="#38bdf8">int / int</text><text x="620" y="112" fill="#f97316" font-size="18">2</text>
<text x="396" y="174">5.0 / 2</text><text x="396" y="194" fill="#38bdf8">double / int</text><text x="620" y="182" fill="#a3e635" font-size="18">2.5</text>
<text x="396" y="244">double(5) / 2</text><text x="396" y="264" fill="#38bdf8">static_cast first</text><text x="620" y="252" fill="#a3e635" font-size="18">2.5</text>
<text x="396" y="304" font-size="13">double r = 5 / 2;  holds 2.0</text>
</g>
<g fill="none" stroke-width="2"><rect x="22" y="70" width="60" height="50" stroke="#38bdf8"/><rect x="92" y="70" width="60" height="50" stroke="#38bdf8"/><rect x="162" y="70" width="60" height="50" stroke="#38bdf8"/><rect x="232" y="70" width="60" height="50" stroke="#f97316" stroke-dasharray="5 4"/></g>
<g stroke="#e5e7eb" stroke-width="1" opacity="0.4"><line x1="350" y1="50" x2="350" y2="320"/></g>
<g stroke="#e5e7eb" stroke-width="2"><line x1="520" y1="108" x2="600" y2="108"/><line x1="520" y1="178" x2="600" y2="178"/><line x1="520" y1="248" x2="600" y2="248"/></g>
</svg>