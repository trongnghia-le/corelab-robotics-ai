<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" font-family="Inter, sans-serif">
<title>Floating-point numbers sit on a grid whose spacing grows</title>
<desc>Float32 values near 20000 m are spaced 2^-9 m = 1.953 mm apart. An increment of 0.5 mm is below the midpoint 0.977 mm and rounds back; 1.2 mm rounds up to the next grid point. A table lists the spacing for double at 1, 1.7e9 and 1e16 and for float32 at 1 and 20000.</desc>
<defs></defs>
<rect width="900" height="540" rx="14" fill="#17181b"/>
<text x="32" y="44" font-size="22" fill="#e9e7e3" text-anchor="start" font-weight="bold">Floating-point numbers sit on a grid whose spacing grows</text>
<rect x="32" y="64" width="836" height="206" rx="8" fill="#22252a" stroke="#3d4148" stroke-width="1.5"/>
<text x="48" y="94" font-size="17" fill="#e9e7e3" text-anchor="start" font-weight="bold">Float32 near x = 20 000 m (drawn to scale)</text>
<rect x="52.3438" y="136" width="195.312" height="64" rx="4" fill="#6cc6ba" fill-opacity="0.16"/>
<text x="150" y="158" font-size="15" fill="#6cc6ba" text-anchor="middle" font-weight="600">rounds to 20 000 m</text>
<line x1="247.656" y1="126" x2="247.656" y2="210" stroke="#a7adb5" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 4"/>
<text x="255.656" y="134" font-size="14" fill="#a7adb5" text-anchor="start">midpoint 0.977 mm</text>
<line x1="53" y1="210" x2="580" y2="210" stroke="#a7adb5" stroke-width="1.5" stroke-linecap="round"/>
<line x1="150" y1="198" x2="150" y2="218" stroke="#e9e7e3" stroke-width="2" stroke-linecap="round"/>
<text x="150" y="240" font-size="14" fill="#a7adb5" text-anchor="middle">20 000 m</text>
<line x1="345.312" y1="198" x2="345.312" y2="218" stroke="#e9e7e3" stroke-width="2" stroke-linecap="round"/>
<text x="345.312" y="240" font-size="14" fill="#a7adb5" text-anchor="middle">+1.953 mm</text>
<line x1="540.625" y1="198" x2="540.625" y2="218" stroke="#e9e7e3" stroke-width="2" stroke-linecap="round"/>
<text x="540.625" y="240" font-size="14" fill="#a7adb5" text-anchor="middle">+3.906 mm</text>
<circle cx="200" cy="210" r="6" fill="#e0904f"/>
<circle cx="270" cy="210" r="6" fill="#ae9ce6"/>
<text x="222" y="196" font-size="15" fill="#e0904f" text-anchor="end" font-weight="600">0.5 mm</text>
<text x="280" y="196" font-size="15" fill="#ae9ce6" text-anchor="start" font-weight="600">1.2 mm</text>
<text x="600" y="140" font-size="15" fill="#e0904f" text-anchor="start">+0.5 mm is below the midpoint:</text>
<text x="600" y="166" font-size="15" fill="#e0904f" text-anchor="start">the sum rounds back, the step is lost.</text>
<text x="600" y="192" font-size="15" fill="#ae9ce6" text-anchor="start">+1.2 mm is past it: the sum jumps</text>
<text x="600" y="218" font-size="15" fill="#ae9ce6" text-anchor="start">to +1.953 mm (error 0.75 mm).</text>
<rect x="32" y="286" width="836" height="234" rx="8" fill="#22252a" stroke="#3d4148" stroke-width="1.5"/>
<text x="48" y="316" font-size="17" fill="#e9e7e3" text-anchor="start" font-weight="bold">Spacing of the grid, 2^(e−p), at five values</text>
<text x="48" y="346" font-size="14" fill="#a7adb5" text-anchor="start">value</text>
<text x="300" y="346" font-size="14" fill="#a7adb5" text-anchor="start">format</text>
<text x="500" y="346" font-size="14" fill="#a7adb5" text-anchor="end">spacing</text>
<text x="540" y="346" font-size="14" fill="#a7adb5" text-anchor="start">what it means</text>
<line x1="48" y1="356" x2="852" y2="356" stroke="#3d4148" stroke-width="1.5" stroke-linecap="round"/>
<text x="48" y="382" font-size="15" fill="#e9e7e3" text-anchor="start">1</text>
<text x="300" y="382" font-size="15" fill="#e9e7e3" text-anchor="start">double</text>
<text x="500" y="382" font-size="15" fill="#e0904f" text-anchor="end" font-weight="600">2.22×10⁻¹⁶</text>
<text x="540" y="382" font-size="15" fill="#e9e7e3" text-anchor="start">ε: about 16 decimal digits</text>
<text x="48" y="410" font-size="15" fill="#e9e7e3" text-anchor="start">1.7×10⁹ s (Unix time)</text>
<text x="300" y="410" font-size="15" fill="#e9e7e3" text-anchor="start">double</text>
<text x="500" y="410" font-size="15" fill="#e0904f" text-anchor="end" font-weight="600">2.38×10⁻⁷ s</text>
<text x="540" y="410" font-size="15" fill="#e9e7e3" text-anchor="start">0.24 µs: fine for timestamps</text>
<text x="48" y="438" font-size="15" fill="#e9e7e3" text-anchor="start">10¹⁶</text>
<text x="300" y="438" font-size="15" fill="#e9e7e3" text-anchor="start">double</text>
<text x="500" y="438" font-size="15" fill="#e0904f" text-anchor="end" font-weight="600">2</text>
<text x="540" y="438" font-size="15" fill="#e9e7e3" text-anchor="start">10¹⁶ + 1 rounds back to 10¹⁶</text>
<text x="48" y="466" font-size="15" fill="#e9e7e3" text-anchor="start">1</text>
<text x="300" y="466" font-size="15" fill="#e9e7e3" text-anchor="start">float32</text>
<text x="500" y="466" font-size="15" fill="#e0904f" text-anchor="end" font-weight="600">1.19×10⁻⁷</text>
<text x="540" y="466" font-size="15" fill="#e9e7e3" text-anchor="start">ε of float32: 7 digits</text>
<text x="48" y="494" font-size="15" fill="#e9e7e3" text-anchor="start">20 000 m</text>
<text x="300" y="494" font-size="15" fill="#e9e7e3" text-anchor="start">float32</text>
<text x="500" y="494" font-size="15" fill="#e0904f" text-anchor="end" font-weight="600">1.95×10⁻³ m</text>
<text x="540" y="494" font-size="15" fill="#e9e7e3" text-anchor="start">2 mm: 0.5 mm steps vanish</text>
</svg>
