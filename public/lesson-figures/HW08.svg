<polygon points="694.0,356.0 690.5,347.0 697.5,347.0" fill="#f97316"/>
<line x1="130" y1="386" x2="720" y2="386" stroke="#374151" stroke-width="1"/>
<text x="170" y="408" font-size="12" fill="#a3e635" text-anchor="middle" font-weight="bold">0</text>
<text x="220" y="408" font-size="12" fill="#a3e635" text-anchor="middle" font-weight="bold">1</text>
<text x="320" y="408" font-size="12" fill="#a3e635" text-anchor="middle" font-weight="bold">2</text>
<text x="360" y="408" font-size="12" fill="#a3e635" text-anchor="middle" font-weight="bold">3</text>
<text x="590" y="408" font-size="12" fill="#a3e635" text-anchor="middle" font-weight="bold">4</text>
<text x="660" y="408" font-size="12" fill="#a3e635" text-anchor="middle" font-weight="bold">5</text>
<text x="710" y="408" font-size="12" fill="#a3e635" text-anchor="middle" font-weight="bold">6</text>
<text x="470" y="358" font-size="11" fill="#f97316" text-anchor="middle">ISR: read A, B, look up step, count += step</text>
<text x="470" y="374" font-size="11" fill="#f97316" text-anchor="middle">(microseconds; no Serial, no delay)</text>
<text x="380" y="448" font-size="12" fill="#e5e7eb" text-anchor="middle">A reader in loop() must copy a multi-byte count with interrupts off (AVR) so it is never half updated.</text>
<text x="380" y="466" font-size="12" fill="#e5e7eb" text-anchor="middle">Illegal jumps appear when the ISR cannot keep up with the edge rate.</text>
</svg>
