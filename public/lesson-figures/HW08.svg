<polygon points="632.0,177.0 623.0,180.5 623.0,173.5" fill="#38bdf8"/>
<line x1="492" y1="128" x2="492" y2="167" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4 3"/>
<polygon points="492.0,167.0 488.5,158.0 495.5,158.0" fill="#38bdf8"/>
<text x="570" y="94" font-size="12" fill="#a3e635" text-anchor="middle">+1</text>
<text x="692" y="152" font-size="12" fill="#a3e635" text-anchor="middle">+1</text>
<text x="570" y="212" font-size="12" fill="#a3e635" text-anchor="middle">+1</text>
<text x="450" y="152" font-size="12" fill="#a3e635" text-anchor="middle">+1</text>
<text x="570" y="134" font-size="11" fill="#38bdf8" text-anchor="middle">-1 (reverse)</text>
<line x1="506" y1="126" x2="634" y2="170" stroke="#f97316" stroke-width="1.5" stroke-dasharray="3 3"/>
<line x1="634" y1="126" x2="506" y2="170" stroke="#f97316" stroke-width="1.5" stroke-dasharray="3 3"/>
<text x="570" y="236" font-size="11" fill="#f97316" text-anchor="middle">dashed orange diagonals: two bits changed at once = a missed edge</text>
<text x="24" y="268" font-size="14" fill="#f97316" text-anchor="start" font-weight="bold">3  Interrupt timeline</text>
<rect x="24" y="282" width="712" height="150" rx="8" fill="#111827" stroke="#374151" stroke-width="1"/>
<text x="30" y="312" font-size="12" fill="#e5e7eb" text-anchor="start">main loop</text>
<text x="30" y="372" font-size="12" fill="#e5e7eb" text-anchor="start">ISR</text>
<text x="30" y="408" font-size="12" fill="#e5e7eb" text-anchor="start">count</text>
<rect x="130" y="296" width="590" height="26" rx="4" fill="#0c4a6e" stroke="#38bdf8" stroke-width="1"/>
<text x="455" y="313" font-size="11" fill="#e5e7eb" text-anchor="middle">loop(): print every 100 ms, other tasks</text>
<rect x="200" y="296" width="8" height="26" rx="2" fill="#f97316" stroke="#f97316" stroke-width="1"/>
<rect x="200" y="356" width="8" height="26" rx="2" fill="#7c2d12" stroke="#f97316" stroke-width="1"/>
<line x1="204" y1="339" x2="204" y2="356" stroke="#f97316" stroke-width="1.5"/>
