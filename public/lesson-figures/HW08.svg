<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" font-family="Inter, Arial, sans-serif" role="img">
<title>Quadrature waveforms with the four-state decoder, and an interrupt timeline</title>
<desc>Top left: channels A and B of a quadrature encoder, 90 degrees apart, with the state sequence 00, 10, 11, 01 for forward motion. Top right: the four states as a ring with forward and reverse arrows and the illegal diagonal jumps. Bottom: a timeline where the main loop is interrupted by short ISR bars, each reading A and B and updating a volatile counter.</desc>
<rect width="760" height="480" fill="#111827" rx="12"/>
<text x="380" y="28" font-size="17" fill="#e5e7eb" text-anchor="middle" font-weight="bold">Edges become interrupts; interrupts must be short</text>
<text x="24" y="58" font-size="14" fill="#38bdf8" text-anchor="start" font-weight="bold">1  Quadrature, forward: A leads B</text>
<text x="24" y="104" font-size="13" fill="#a3e635" text-anchor="start" font-weight="bold">A</text>
<path d="M 70 114 L 110 114 L 110 86 L 150 86 L 190 86 L 190 114 L 230 114 L 270 114 L 270 86 L 310 86 L 350 86 L 350 114 L 390 114 " fill="none" stroke="#a3e635" stroke-width="2"/>
<text x="24" y="154" font-size="13" fill="#38bdf8" text-anchor="start" font-weight="bold">B</text>
<path d="M 70 164 L 110 164 L 150 164 L 150 136 L 190 136 L 230 136 L 230 164 L 270 164 L 310 164 L 310 136 L 350 136 L 390 136 " fill="none" stroke="#38bdf8" stroke-width="2"/>
<line x1="70" y1="76" x2="70" y2="172" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="2 3"/>
<text x="90" y="190" font-size="13" fill="#f97316" text-anchor="middle" font-weight="bold">00</text>
<line x1="110" y1="76" x2="110" y2="172" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="2 3"/>
<text x="130" y="190" font-size="13" fill="#f97316" text-anchor="middle" font-weight="bold">10</text>
<line x1="150" y1="76" x2="150" y2="172" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="2 3"/>
<text x="170" y="190" font-size="13" fill="#f97316" text-anchor="middle" font-weight="bold">11</text>
<line x1="190" y1="76" x2="190" y2="172" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="2 3"/>
<text x="210" y="190" font-size="13" fill="#f97316" text-anchor="middle" font-weight="bold">01</text>
<line x1="230" y1="76" x2="230" y2="172" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="2 3"/>
<text x="250" y="190" font-size="13" fill="#f97316" text-anchor="middle" font-weight="bold">00</text>
<line x1="270" y1="76" x2="270" y2="172" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="2 3"/>
<text x="290" y="190" font-size="13" fill="#f97316" text-anchor="middle" font-weight="bold">10</text>
<line x1="310" y1="76" x2="310" y2="172" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="2 3"/>
<text x="330" y="190" font-size="13" fill="#f97316" text-anchor="middle" font-weight="bold">11</text>
<line x1="350" y1="76" x2="350" y2="172" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="2 3"/>
<text x="370" y="190" font-size="13" fill="#f97316" text-anchor="middle" font-weight="bold">01</text>
<line x1="390" y1="76" x2="390" y2="172" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="2 3"/>
<text x="24" y="190" font-size="12" fill="#f97316" text-anchor="start">AB</text>
<text x="150.0" y="208" font-size="12" fill="#e5e7eb" text-anchor="middle">every edge of A or B is one count (x4 decoding)</text>
<text x="430" y="58" font-size="14" fill="#a3e635" text-anchor="start" font-weight="bold">2  State ring (A leads B)</text>
<rect x="456" y="94" width="48" height="32" rx="6" fill="#1f2937" stroke="#f97316" stroke-width="2"/>
<text x="480" y="115" font-size="14" fill="#e5e7eb" text-anchor="middle" font-weight="bold">00</text>
<rect x="636" y="94" width="48" height="32" rx="6" fill="#1f2937" stroke="#f97316" stroke-width="2"/>
<text x="660" y="115" font-size="14" fill="#e5e7eb" text-anchor="middle" font-weight="bold">10</text>
<rect x="636" y="169" width="48" height="32" rx="6" fill="#1f2937" stroke="#f97316" stroke-width="2"/>
<text x="660" y="190" font-size="14" fill="#e5e7eb" text-anchor="middle" font-weight="bold">11</text>
