<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" font-family="Inter, Arial, sans-serif" font-size="14">
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#e5e7eb"/></marker><marker id="ao" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#d97936"/></marker></defs>
<rect width="720" height="340" fill="#191b1f" rx="12"/>

<text x="360" y="28" fill="#e5e7eb" font-size="16" text-anchor="middle" font-weight="bold">Counting degrees of freedom: a planar four-bar linkage</text>
<line x1="60" y1="260" x2="340" y2="260" stroke="#70747b" stroke-width="2"/>
<line x1="60" y1="260" x2="50" y2="274" stroke="#70747b" stroke-width="1.5"/>
<line x1="80" y1="260" x2="70" y2="274" stroke="#70747b" stroke-width="1.5"/>
<line x1="100" y1="260" x2="90" y2="274" stroke="#70747b" stroke-width="1.5"/>
<line x1="120" y1="260" x2="110" y2="274" stroke="#70747b" stroke-width="1.5"/>
<line x1="140" y1="260" x2="130" y2="274" stroke="#70747b" stroke-width="1.5"/>
<line x1="160" y1="260" x2="150" y2="274" stroke="#70747b" stroke-width="1.5"/>
<line x1="180" y1="260" x2="170" y2="274" stroke="#70747b" stroke-width="1.5"/>
<line x1="200" y1="260" x2="190" y2="274" stroke="#70747b" stroke-width="1.5"/>
<line x1="220" y1="260" x2="210" y2="274" stroke="#70747b" stroke-width="1.5"/>
<line x1="240" y1="260" x2="230" y2="274" stroke="#70747b" stroke-width="1.5"/>
<line x1="260" y1="260" x2="250" y2="274" stroke="#70747b" stroke-width="1.5"/>
<line x1="280" y1="260" x2="270" y2="274" stroke="#70747b" stroke-width="1.5"/>
<line x1="300" y1="260" x2="290" y2="274" stroke="#70747b" stroke-width="1.5"/>
<line x1="320" y1="260" x2="310" y2="274" stroke="#70747b" stroke-width="1.5"/>
<line x1="100" y1="260" x2="140" y2="184" stroke="#53b2dd" stroke-width="5"/>
<line x1="140" y1="184" x2="260" y2="170" stroke="#9ccd4e" stroke-width="5"/>
<line x1="300" y1="260" x2="260" y2="170" stroke="#d97936" stroke-width="5"/>
<circle cx="100" cy="260" r="7" fill="#191b1f" stroke="#e5e7eb" stroke-width="2"/>
<circle cx="140" cy="184" r="7" fill="#191b1f" stroke="#e5e7eb" stroke-width="2"/>
<circle cx="260" cy="170" r="7" fill="#191b1f" stroke="#e5e7eb" stroke-width="2"/>
<circle cx="300" cy="260" r="7" fill="#191b1f" stroke="#e5e7eb" stroke-width="2"/>
<text x="86" y="292" fill="#e5e7eb" font-size="14" text-anchor="start">A</text>
<text x="298" y="292" fill="#e5e7eb" font-size="14" text-anchor="start">D</text>
<text x="118" y="180" fill="#e5e7eb" font-size="14" text-anchor="start">B</text>
<text x="268" y="160" fill="#e5e7eb" font-size="14" text-anchor="start">C</text>
<text x="100" y="228" fill="#53b2dd" font-size="13" text-anchor="end">crank</text>
<text x="200" y="162" fill="#9ccd4e" font-size="13" text-anchor="middle">coupler</text>
<text x="290" y="225" fill="#d97936" font-size="13" text-anchor="start">rocker</text>
<text x="200" y="310" fill="#e5e7eb" font-size="13" text-anchor="middle">ground link (fixed)</text>
<rect x="380" y="52" width="310" height="250" fill="#272a2f" stroke="#53b2dd" stroke-width="2" rx="6"/>
<text x="396" y="80" fill="#e5e7eb" font-size="14" text-anchor="start" font-weight="bold">Gruebler's formula (planar, m = 3)</text>
<text x="396" y="108" fill="#9ccd4e" font-size="14" text-anchor="start">dof = m (N - 1 - J) + sum f_i</text>
<text x="396" y="140" fill="#e5e7eb" font-size="13" text-anchor="start">links N = 4 (incl. ground)</text>
<text x="396" y="162" fill="#e5e7eb" font-size="13" text-anchor="start">joints J = 4, each revolute, f = 1</text>
<text x="396" y="190" fill="#9ccd4e" font-size="14" text-anchor="start">dof = 3 (4 - 1 - 4) + 4 = 1</text>
<text x="396" y="222" fill="#e5e7eb" font-size="13" text-anchor="start">One input angle fixes the pose.</text>
<text x="396" y="248" fill="#e5e7eb" font-size="13" text-anchor="start">Spatial: m = 6. Check special geometry:</text>
<text x="396" y="268" fill="#e5e7eb" font-size="13" text-anchor="start">equal parallel bars can add motion the</text>
<text x="396" y="288" fill="#e5e7eb" font-size="13" text-anchor="start">formula does not predict.</text>
</svg>
