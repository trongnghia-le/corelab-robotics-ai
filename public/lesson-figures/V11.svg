<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" font-family="Inter, Arial, sans-serif" font-size="14">
<rect width="760" height="340" fill="#111827" rx="12"/>
<text x="20" y="28" fill="#e5e7eb" font-size="16" font-weight="bold">Epipolar plane (top view)</text>
<text x="440" y="28" fill="#e5e7eb" font-size="16" font-weight="bold">Short baseline: near-parallel rays</text>
<polygon points="70,270 90,270 80,255" fill="#38bdf8"/>
<polygon points="230,270 250,270 240,255" fill="#f97316"/>
<text x="38" y="295" fill="#38bdf8">camera 1</text>
<text x="205" y="295" fill="#f97316">camera 2</text>
<line x1="80" y1="262" x2="80" y2="262" stroke="#e5e7eb"/>
<line x1="55" y1="225" x2="105" y2="225" stroke="#38bdf8" stroke-width="3"/>
<line x1="215" y1="225" x2="265" y2="225" stroke="#f97316" stroke-width="3"/>
<text x="28" y="218" fill="#38bdf8" font-size="13">image 1</text>
<text x="268" y="218" fill="#f97316" font-size="13">image 2</text>
<circle cx="170" cy="70" r="7" fill="#e5e7eb"/>
<text x="182" y="66" fill="#e5e7eb">3-D point P</text>
<line x1="80" y1="262" x2="170" y2="70" stroke="#38bdf8" stroke-width="2"/>
<line x1="240" y1="262" x2="170" y2="70" stroke="#f97316" stroke-width="2"/>
<line x1="80" y1="268" x2="240" y2="268" stroke="#e5e7eb" stroke-dasharray="5 4"/>
<text x="140" y="320" fill="#e5e7eb">baseline B</text>
<circle cx="97" cy="225" r="4" fill="#38bdf8"/>
<circle cx="232" cy="225" r="4" fill="#f97316"/>
<text x="15" y="100" fill="#a3e635" font-size="13">ray 1 seen in</text>
<text x="15" y="116" fill="#a3e635" font-size="13">image 2 is the</text>
<text x="15" y="132" fill="#a3e635" font-size="13">epipolar line</text>
<polygon points="520,270 540,270 530,255" fill="#38bdf8"/>
<polygon points="550,270 570,270 560,255" fill="#f97316"/>
<line x1="530" y1="262" x2="545" y2="70" stroke="#38bdf8" stroke-width="2"/>
<line x1="560" y1="262" x2="545" y2="70" stroke="#f97316" stroke-width="2"/>
<ellipse cx="545" cy="110" rx="6" ry="38" fill="none" stroke="#a3e635" stroke-width="2" stroke-dasharray="4 3"/>
<text x="580" y="105" fill="#a3e635">depth uncertainty</text>
<text x="580" y="125" fill="#a3e635">along the ray</text>
<text x="440" y="300" fill="#e5e7eb">sigma_Z = Z^2 sigma_d / (f B)</text>
<text x="440" y="322" fill="#e5e7eb">halve B: double the error</text>
<text x="440" y="60" fill="#e5e7eb" font-size="13">B small, parallax angle ~ B/Z small</text>
</svg>
