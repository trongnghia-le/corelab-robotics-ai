<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" font-family="Inter, sans-serif">
<title>Two-link arm: relative joint angles</title>
<desc>A planar two-link arm with joint angle q1 from the x-axis, relative angle q2 from the line of link 1, and the world angle q1+q2 of link 2.</desc>
<defs><marker id="R04enarr-6cc6ba" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 z" fill="#6cc6ba"/></marker><marker id="R04enarr-6fc693" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 z" fill="#6fc693"/></marker><marker id="R04enarr-86abe2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 z" fill="#86abe2"/></marker><marker id="R04enarr-a7adb5" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 z" fill="#a7adb5"/></marker><marker id="R04enarr-ae9ce6" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 z" fill="#ae9ce6"/></marker><marker id="R04enarr-e08db5" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 z" fill="#e08db5"/></marker><marker id="R04enarr-e0904f" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 z" fill="#e0904f"/></marker><marker id="R04enarr-e0c169" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 z" fill="#e0c169"/></marker><marker id="R04enarr-e58a80" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 z" fill="#e58a80"/></marker><marker id="R04enarr-e9e7e3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 z" fill="#e9e7e3"/></marker></defs>
<rect width="900" height="540" rx="14" fill="#17181b"/>
