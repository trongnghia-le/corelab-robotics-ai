<line x1="100.0" y1="490.0" x2="500.0" y2="490.0" stroke="#3d4148" stroke-width="2" stroke-linecap="round"/>
<text x="505.0" y="495.0" font-size="15" fill="#a7adb5" text-anchor="start" font-weight="normal">x</text>
<line x1="100.0" y1="490.0" x2="100.0" y2="90.0" stroke="#3d4148" stroke-width="2" stroke-linecap="round"/>
<text x="95.0" y="82.0" font-size="15" fill="#a7adb5" text-anchor="end" font-weight="normal">y</text>
<line x1="337.6" y1="323.7" x2="507.6" y2="323.7" stroke="#3d4148" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 6"/>
<line x1="337.6" y1="323.7" x2="456.3" y2="240.5" stroke="#a7adb5" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 6"/>
<line x1="100.0" y1="490.0" x2="337.6" y2="323.7" stroke="#86abe2" stroke-width="6" stroke-linecap="round"/>
<line x1="337.6" y1="323.7" x2="355.2" y2="121.4" stroke="#e0904f" stroke-width="6" stroke-linecap="round"/>
<path d="M190.0 490.0 A90.0 90.0 0 0 0 173.7 438.4" fill="none" stroke="#86abe2" stroke-width="2.5"/>
<text x="204.0" y="468.0" font-size="15" fill="#86abe2" text-anchor="start" font-weight="bold">q₁</text>
<path d="M382.6 292.1 A55.0 55.0 0 0 0 342.3 268.9" fill="none" stroke="#e0904f" stroke-width="2.5"/>
<path d="M447.6 323.7 A110.0 110.0 0 0 0 347.1 214.1" fill="none" stroke="#e0c169" stroke-width="2.5"/>
<text x="458.0" y="274.0" font-size="15" fill="#e0c169" text-anchor="start" font-weight="bold">q₁ + q₂</text>
