<circle cx="337.6" cy="323.7" r="7.0" fill="#17181b" stroke="#e9e7e3" stroke-width="2.5" />
<circle cx="355.2" cy="121.4" r="8.0" fill="#6fc693" />
<text x="88.0" y="520.0" font-size="15" fill="#a7adb5" text-anchor="end" font-weight="normal">base</text>
<text x="352.0" y="354.0" font-size="15" fill="#a7adb5" text-anchor="start" font-weight="normal">elbow</text>
<text x="369.0" y="109.0" font-size="15" fill="#6fc693" text-anchor="start" font-weight="normal">tip (x, y)</text>
<text x="147.0" y="373.0" font-size="15" fill="#86abe2" text-anchor="start" font-weight="normal">link 1, l₁</text>
<text x="332.0" y="219.0" font-size="15" fill="#e0904f" text-anchor="end" font-weight="normal">link 2, l₂</text>
<text x="466.0" y="236.0" font-size="14" fill="#a7adb5" text-anchor="start" font-weight="normal">line of link 1</text>
<rect x="640" y="80" width="228" height="420" rx="10" fill="#22252a"/>
<text x="658.0" y="115.0" font-size="17" fill="#a7adb5" text-anchor="start" font-weight="bold">Encoders report</text>
<text x="658.0" y="145.0" font-size="15" fill="#86abe2" text-anchor="start" font-weight="normal">q₁: link 1 vs. x-axis</text>
<text x="658.0" y="172.0" font-size="15" fill="#e0904f" text-anchor="start" font-weight="normal">q₂: link 2 vs. link 1</text>
<text x="658.0" y="222.0" font-size="17" fill="#a7adb5" text-anchor="start" font-weight="bold">World orientation</text>
<text x="658.0" y="252.0" font-size="15" fill="#86abe2" text-anchor="start" font-weight="normal">link 1: q₁</text>
<text x="658.0" y="279.0" font-size="15" fill="#e0c169" text-anchor="start" font-weight="normal">link 2: q₁ + q₂</text>
<text x="658.0" y="329.0" font-size="17" fill="#a7adb5" text-anchor="start" font-weight="bold">Tip position</text>
<text x="658.0" y="359.0" font-size="15" fill="#e9e7e3" text-anchor="start" font-weight="normal">x = l₁cos q₁ + l₂cos(q₁+q₂)</text>
<text x="658.0" y="386.0" font-size="15" fill="#e9e7e3" text-anchor="start" font-weight="normal">y = l₁sin q₁ + l₂sin(q₁+q₂)</text>
<text x="658.0" y="424.0" font-size="15" fill="#a7adb5" text-anchor="start" font-weight="normal" font-style="italic">illustrative values</text>
<text x="658.0" y="450.0" font-size="15" fill="#a7adb5" text-anchor="start" font-weight="normal">q₁ = 35°, q₂ = 50°, l₂ = 0.7 l₁</text>
<text x="658.0" y="478.0" font-size="15" fill="#6fc693" text-anchor="start" font-weight="normal">→ (x, y) = (0.880, 1.271) l₁</text>
</svg>
