<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" font-family="Inter, sans-serif">
<title>Probe order 1, 6, 7, 4 in a table of eight slots where slots 0, 1, 2, 6 and 7 are taken</title>
<desc>Eight slots in a row; arcs with numbers show the probes 1 to 4; the key is stored in free slot 4.</desc>
<rect width="900" height="440" rx="14" fill="#17181b"/>

<text x="32" y="44" font-size="22" font-weight="bold" fill="#e9e7e3">Probing in an 8-slot table: j ← (5j + 1) mod 8</text>
<rect x="32" y="72" width="18" height="18" rx="4" fill="#e0904f" fill-opacity="0.3" stroke="#e0904f" stroke-width="2"/>
<text x="58" y="87" font-size="15" fill="#e9e7e3">taken slot</text>
<rect x="250" y="72" width="18" height="18" rx="4" fill="#22252a" stroke="#a7adb5" stroke-width="2"/>
<text x="276" y="87" font-size="15" fill="#e9e7e3">free slot</text>
<circle cx="470.0" cy="81.0" r="10" fill="#22252a" stroke="#e0c169" stroke-width="2"/>
<text x="490" y="87" font-size="15" fill="#e9e7e3">probe number</text>
<rect x="72" y="196" width="84" height="56" rx="8" fill="#e0904f" fill-opacity="0.3" stroke="#e0904f" stroke-width="2"/>
<text x="114" y="230" font-size="15" text-anchor="middle" fill="#e9e7e3">taken</text>
<text x="114" y="274" font-size="14" text-anchor="middle" fill="#a7adb5">0</text>
<rect x="168" y="196" width="84" height="56" rx="8" fill="#e0904f" fill-opacity="0.3" stroke="#e0904f" stroke-width="2"/>
<text x="210" y="230" font-size="15" text-anchor="middle" fill="#e9e7e3">taken</text>
<text x="210" y="274" font-size="14" text-anchor="middle" fill="#a7adb5">1</text>
<rect x="264" y="196" width="84" height="56" rx="8" fill="#e0904f" fill-opacity="0.3" stroke="#e0904f" stroke-width="2"/>
<text x="306" y="230" font-size="15" text-anchor="middle" fill="#e9e7e3">taken</text>
<text x="306" y="274" font-size="14" text-anchor="middle" fill="#a7adb5">2</text>
<rect x="360" y="196" width="84" height="56" rx="8" fill="#22252a" stroke="#a7adb5" stroke-width="2"/>
<text x="402" y="230" font-size="15" text-anchor="middle" fill="#a7adb5">free</text>
<text x="402" y="274" font-size="14" text-anchor="middle" fill="#a7adb5">3</text>
<rect x="456" y="196" width="84" height="56" rx="8" fill="#6fc693" fill-opacity="0.3" stroke="#6fc693" stroke-width="2.5"/>
<text x="498" y="230" font-size="15" font-weight="600" text-anchor="middle" fill="#e9e7e3">new key</text>
<text x="498" y="274" font-size="14" text-anchor="middle" fill="#a7adb5">4</text>
<rect x="552" y="196" width="84" height="56" rx="8" fill="#22252a" stroke="#a7adb5" stroke-width="2"/>
<text x="594" y="230" font-size="15" text-anchor="middle" fill="#a7adb5">free</text>
<text x="594" y="274" font-size="14" text-anchor="middle" fill="#a7adb5">5</text>
<rect x="648" y="196" width="84" height="56" rx="8" fill="#e0904f" fill-opacity="0.3" stroke="#e0904f" stroke-width="2"/>
<text x="690" y="230" font-size="15" text-anchor="middle" fill="#e9e7e3">taken</text>
<text x="690" y="274" font-size="14" text-anchor="middle" fill="#a7adb5">6</text>
<rect x="744" y="196" width="84" height="56" rx="8" fill="#e0904f" fill-opacity="0.3" stroke="#e0904f" stroke-width="2"/>
<text x="786" y="230" font-size="15" text-anchor="middle" fill="#e9e7e3">taken</text>
<text x="786" y="274" font-size="14" text-anchor="middle" fill="#a7adb5">7</text>
<path d="M210.0,136 Q450.0,70 690.0,134" fill="none" stroke="#e0c169" stroke-width="2"/>
<polygon points="690.0,134.0 678.0,136.5 680.8,125.9" fill="#e0c169"/>
<path d="M690.0,136 Q738.0,112 786.0,134" fill="none" stroke="#e0c169" stroke-width="2"/>
<polygon points="786.0,134.0 773.7,134.4 778.3,124.4" fill="#e0c169"/>
<path d="M786.0,136 Q642.0,92 498.0,134" fill="none" stroke="#e0c169" stroke-width="2"/>
<polygon points="498.0,134.0 507.0,125.6 510.1,136.2" fill="#e0c169"/>
<circle cx="210.0" cy="150.0" r="14" fill="#22252a" stroke="#e0c169" stroke-width="2"/>
<text x="210" y="155" font-size="15" font-weight="bold" text-anchor="middle" fill="#e9e7e3">1</text>
<circle cx="690.0" cy="150.0" r="14" fill="#22252a" stroke="#e0c169" stroke-width="2"/>
<text x="690" y="155" font-size="15" font-weight="bold" text-anchor="middle" fill="#e9e7e3">2</text>
<circle cx="786.0" cy="150.0" r="14" fill="#22252a" stroke="#e0c169" stroke-width="2"/>
<text x="786" y="155" font-size="15" font-weight="bold" text-anchor="middle" fill="#e9e7e3">3</text>
<circle cx="498.0" cy="150.0" r="14" fill="#22252a" stroke="#6fc693" stroke-width="2"/>
<text x="498" y="155" font-size="15" font-weight="bold" text-anchor="middle" fill="#e9e7e3">4</text>
<text x="72" y="326" font-size="15" fill="#e9e7e3">probe 1: home slot 1 is taken</text>
<text x="72" y="354" font-size="15" fill="#e9e7e3">probe 2: j = 5·1 + 1 = 6, slot 6 is taken</text>
<text x="72" y="382" font-size="15" fill="#e9e7e3">probe 3: j = 5·6 + 1 = 31 mod 8 = 7, slot 7 is taken</text>
<text x="72" y="410" font-size="15" font-weight="600" fill="#6fc693">probe 4: j = 5·7 + 1 = 36 mod 8 = 4, slot 4 is free: store the key here</text>
</svg>
