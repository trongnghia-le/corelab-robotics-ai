<rect x="190" y="220" width="40" height="40" fill="none" fill-opacity="0.35" stroke="#e5e7eb" stroke-width="1"/>
<rect x="70" y="100" width="120" height="120" fill="none" stroke="#f97316" stroke-width="3"/>
<text x="130" y="165" text-anchor="middle" fill="#e5e7eb">3x3 kernel</text>
<text x="30" y="285" fill="#e5e7eb">out(y,x) = sum k(i,j) * I(y+i, x+j)</text>
<text x="30" y="310" fill="#a3e635">weights sum to 1: mean kept</text>
<text x="380" y="62" fill="#38bdf8">original, period 3 px (0.33 cycles/px)</text>
<rect x="380" y="72" width="30" height="34" fill="#e5e7eb" stroke="#e5e7eb" stroke-opacity="0.5"/>
<rect x="410" y="72" width="30" height="34" fill="#1f2937" stroke="#e5e7eb" stroke-opacity="0.5"/>
