<rect x="590" y="72" width="30" height="34" fill="#1f2937" stroke="#e5e7eb" stroke-opacity="0.5"/>
<rect x="620" y="72" width="30" height="34" fill="#1f2937" stroke="#e5e7eb" stroke-opacity="0.5"/>
<rect x="650" y="72" width="30" height="34" fill="#e5e7eb" stroke="#e5e7eb" stroke-opacity="0.5"/>
<rect x="680" y="72" width="30" height="34" fill="#1f2937" stroke="#e5e7eb" stroke-opacity="0.5"/>
<rect x="710" y="72" width="30" height="34" fill="#1f2937" stroke="#e5e7eb" stroke-opacity="0.5"/>
<text x="380" y="140" fill="#f97316">keep every 2nd pixel (no smoothing)</text>
<rect x="380" y="150" width="60" height="34" fill="#e5e7eb" stroke="#f97316" stroke-width="1.5"/>
<rect x="440" y="150" width="60" height="34" fill="#1f2937" stroke="#f97316" stroke-width="1.5"/>
<rect x="500" y="150" width="60" height="34" fill="#1f2937" stroke="#f97316" stroke-width="1.5"/>
<rect x="560" y="150" width="60" height="34" fill="#e5e7eb" stroke="#f97316" stroke-width="1.5"/>
<rect x="620" y="150" width="60" height="34" fill="#1f2937" stroke="#f97316" stroke-width="1.5"/>
<rect x="680" y="150" width="60" height="34" fill="#1f2937" stroke="#f97316" stroke-width="1.5"/>
<text x="380" y="212" fill="#e5e7eb">new period = 3 new px = 6 original px</text>
<text x="380" y="234" fill="#f97316">a false slow stripe (aliasing)</text>
<text x="380" y="272" fill="#a3e635">Fix: low-pass (blur) first,</text>
<text x="380" y="294" fill="#a3e635">then subsample. Nyquist after /2:</text>
<text x="380" y="316" fill="#a3e635">0.25 cycles per original pixel</text>
</svg>
