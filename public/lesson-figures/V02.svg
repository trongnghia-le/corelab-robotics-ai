<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" font-family="Inter, Arial, sans-serif" font-size="14">
<rect width="760" height="340" fill="#111827" rx="12"/>
<text x="20" y="30" fill="#e5e7eb" font-size="16" font-weight="bold">Filtering: a sliding weighted sum</text>
<text x="380" y="30" fill="#e5e7eb" font-size="16" font-weight="bold">Sampling: keep every 2nd pixel</text>
<rect x="30" y="60" width="40" height="40" fill="none" fill-opacity="0.35" stroke="#e5e7eb" stroke-width="1"/>
