<rect x="190" y="180" width="40" height="40" fill="none" fill-opacity="0.35" stroke="#e5e7eb" stroke-width="1"/>
<rect x="30" y="220" width="40" height="40" fill="none" fill-opacity="0.35" stroke="#e5e7eb" stroke-width="1"/>
<rect x="70" y="220" width="40" height="40" fill="none" fill-opacity="0.35" stroke="#e5e7eb" stroke-width="1"/>
