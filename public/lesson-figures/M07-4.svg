<text x="72" y="429" font-size="15" font-weight="600" fill="#6fc693">semi-implicit, Ẽ = 0.5</text>
<text x="580" y="100" font-size="17" font-weight="bold" fill="#e9e7e3">Step h = 0.5</text>
<line x1="580" y1="132" x2="602.0" y2="132.0" stroke="#6fc693" stroke-width="3"/>
<text x="612" y="137" font-size="15" font-weight="600" fill="#6fc693">semi-implicit: det = 1</text>
<text x="580" y="164" font-size="15" fill="#e9e7e3">Ẽ = ½(v² + q² − h q v) = 0.5</text>
<text x="580" y="188" font-size="15" fill="#e9e7e3">semi-axis 1.155 along q = v</text>
<text x="580" y="212" font-size="15" fill="#e9e7e3">semi-axis 0.894 along q = −v</text>
