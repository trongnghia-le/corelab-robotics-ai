<text x="580" y="282" font-size="15" fill="#e9e7e3">radius × √1.25 = 1.118 per step</text>
<line x1="580" y1="322" x2="602.0" y2="322.0" stroke="#a7adb5" stroke-width="2" stroke-dasharray="6 4"/>
<text x="612" y="327" font-size="15" font-weight="600" fill="#a7adb5">true energy: q² + v² = 1</text>
