<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" font-family="Inter, Arial, sans-serif">
<rect width="760" height="380" fill="#111827" rx="12"/>
<text x="20" y="30" font-size="16" font-weight="bold" fill="#e5e7eb">Least squares = projection</text>
<polygon points="40,300 300,300 340,230 80,230" fill="#1f2937" stroke="#38bdf8" stroke-width="2"/>
<text x="60" y="320" font-size="13" fill="#38bdf8">column space of A</text>
<circle cx="200" cy="265" r="4" fill="#a3e635"/>
<text x="210" y="285" font-size="13" fill="#a3e635">A x (best fit)</text>
<circle cx="200" cy="110" r="4" fill="#f97316"/>
<text x="212" y="108" font-size="14" fill="#f97316">b</text>
<line x1="200" y1="114" x2="200" y2="261" stroke="#f97316" stroke-width="2" stroke-dasharray="5 4"/>
<text x="120" y="190" font-size="13" fill="#f97316">r = b - A x</text>
<path d="M200 252 H212 V263" fill="none" stroke="#e5e7eb" stroke-width="1.5"/>
<text x="20" y="352" font-size="13" fill="#e5e7eb">r is perpendicular to the columns: A^T r = 0</text>
<line x1="395" y1="20" x2="395" y2="360" stroke="#374151" stroke-width="2"/>
<text x="420" y="30" font-size="16" font-weight="bold" fill="#e5e7eb">Error vs degree (log scale)</text>
<line x1="440" y1="320" x2="740" y2="320" stroke="#e5e7eb" stroke-width="2"/>
<line x1="440" y1="320" x2="440" y2="50" stroke="#e5e7eb" stroke-width="2"/>
<g font-size="13" fill="#e5e7eb">
<g text-anchor="end"><text x="430" y="324">1e-15</text><text x="430" y="240">1e-10</text><text x="430" y="155">1e-5</text><text x="430" y="71">1</text></g>
<text x="440" y="340" text-anchor="middle">3</text><text x="515" y="340" text-anchor="middle">6</text><text x="590" y="340" text-anchor="middle">9</text><text x="665" y="340" text-anchor="middle">12</text>
<text x="590" y="362" text-anchor="middle">polynomial degree</text>
</g>
<polyline points="440,268 515,196 590,122 665,57" fill="none" stroke="#f97316" stroke-width="3"/>
<polyline points="440,310 515,275 590,246 665,193" fill="none" stroke="#a3e635" stroke-width="3"/>
<g fill="#f97316"><circle cx="440" cy="268" r="4"/><circle cx="515" cy="196" r="4"/><circle cx="590" cy="122" r="4"/><circle cx="665" cy="57" r="4"/></g>
<g fill="#a3e635"><circle cx="440" cy="310" r="4"/><circle cx="515" cy="275" r="4"/><circle cx="590" cy="246" r="4"/><circle cx="665" cy="193" r="4"/></g>
<text x="450" y="74" font-size="13" fill="#f97316">normal eq: cond^2 x 1e-16</text>
<text x="450" y="94" font-size="13" fill="#a3e635">QR: cond x 1e-16</text>
</svg>
