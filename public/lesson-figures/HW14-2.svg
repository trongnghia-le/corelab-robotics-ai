<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 516" font-family="Inter, sans-serif">
<title>Derived values against printed values</title>
<desc>Five rows of the 3257 G 024 CR sheet recomputed from resistance, torque constant and no-load current, and their percentage deviation from the printed value on a plus or minus 6 percent scale; all lie inside the 5 percent audit limit.</desc>
<defs><marker id="HW14-2a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#a7adb5"/></marker></defs>
<rect width="900" height="516" rx="14" fill="#17181b"/>
<text x="32.0" y="44.0" font-size="22" fill="#e9e7e3" text-anchor="start" font-weight="bold">Recompute a row, then compare it with the printed one</text>
<text x="32.0" y="70.0" font-size="15" fill="#a7adb5" text-anchor="start">3257 G 024 CR: R = 1.63 Ω, kt = 38.3 mNm/A, I0 = 0.133 A, U = 24 V</text>
<text x="32.0" y="100.0" font-size="15" fill="#a7adb5" text-anchor="start">Row and formula</text>
<text x="360.0" y="100.0" font-size="15" fill="#a7adb5" text-anchor="start">derived | printed</text>
<text x="730.0" y="100.0" font-size="15" fill="#a7adb5" text-anchor="middle">deviation (derived − printed) / printed</text>
<rect x="590.0" y="116.0" width="23.3" height="310.0" rx="0" fill="#e58a80" stroke="none" stroke-width="1.5" fill-opacity="0.15"/>
<rect x="846.7" y="116.0" width="23.3" height="310.0" rx="0" fill="#e58a80" stroke="none" stroke-width="1.5" fill-opacity="0.15"/>
<line x1="590.0" y1="426.0" x2="590.0" y2="431.0" stroke="#a7adb5" stroke-width="1.5"/>
<text x="590.0" y="448.0" font-size="14" fill="#a7adb5" text-anchor="middle">-6 %</text>
<line x1="636.7" y1="426.0" x2="636.7" y2="431.0" stroke="#a7adb5" stroke-width="1.5"/>
<text x="636.7" y="448.0" font-size="14" fill="#a7adb5" text-anchor="middle">-4 %</text>
<line x1="683.3" y1="426.0" x2="683.3" y2="431.0" stroke="#a7adb5" stroke-width="1.5"/>
<text x="683.3" y="448.0" font-size="14" fill="#a7adb5" text-anchor="middle">-2 %</text>
<line x1="730.0" y1="116.0" x2="730.0" y2="426.0" stroke="#a7adb5" stroke-width="1.5"/>
<text x="730.0" y="448.0" font-size="14" fill="#a7adb5" text-anchor="middle">0 %</text>
<line x1="776.7" y1="426.0" x2="776.7" y2="431.0" stroke="#a7adb5" stroke-width="1.5"/>
<text x="776.7" y="448.0" font-size="14" fill="#a7adb5" text-anchor="middle">+2 %</text>
<line x1="823.3" y1="426.0" x2="823.3" y2="431.0" stroke="#a7adb5" stroke-width="1.5"/>
<text x="823.3" y="448.0" font-size="14" fill="#a7adb5" text-anchor="middle">+4 %</text>
<line x1="870.0" y1="426.0" x2="870.0" y2="431.0" stroke="#a7adb5" stroke-width="1.5"/>
<text x="870.0" y="448.0" font-size="14" fill="#a7adb5" text-anchor="middle">+6 %</text>
<text x="32.0" y="138.0" font-size="17" fill="#e9e7e3" text-anchor="start" font-weight="bold">No-load speed</text>
<text x="32.0" y="160.0" font-size="15" fill="#a7adb5" text-anchor="start">n0 = (U − I0·R)·kn</text>
<text x="360.0" y="138.0" font-size="15" fill="#e9e7e3" text-anchor="start">5946  |  6010</text>
<text x="360.0" y="160.0" font-size="14" fill="#a7adb5" text-anchor="start">min⁻¹</text>
<circle cx="705.1" cy="144.0" r="8" fill="#86abe2" stroke="#17181b" stroke-width="2"/>
<text x="691.1" y="149.0" font-size="14" fill="#e9e7e3" text-anchor="end">−1.1 %</text>
<line x1="24.0" y1="178.0" x2="870.0" y2="178.0" stroke="#3d4148" stroke-width="1"/>
<text x="32.0" y="200.0" font-size="17" fill="#e9e7e3" text-anchor="start" font-weight="bold">Stall torque</text>
<text x="32.0" y="222.0" font-size="15" fill="#a7adb5" text-anchor="start">MH ≈ kt·U/R − MR</text>
<text x="360.0" y="200.0" font-size="15" fill="#e9e7e3" text-anchor="start">559  |  548</text>
<text x="360.0" y="222.0" font-size="14" fill="#a7adb5" text-anchor="start">mNm</text>
<circle cx="776.9" cy="206.0" r="8" fill="#6fc693" stroke="#17181b" stroke-width="2"/>
<text x="790.9" y="211.0" font-size="14" fill="#e9e7e3" text-anchor="start">+2.0 %</text>
<line x1="24.0" y1="240.0" x2="870.0" y2="240.0" stroke="#3d4148" stroke-width="1"/>
<text x="32.0" y="262.0" font-size="17" fill="#e9e7e3" text-anchor="start" font-weight="bold">Max. efficiency</text>
<text x="32.0" y="284.0" font-size="15" fill="#a7adb5" text-anchor="start">η = (1 − √(I0·R/U))²</text>
<text x="360.0" y="262.0" font-size="15" fill="#e9e7e3" text-anchor="start">82  |  80</text>
<text x="360.0" y="284.0" font-size="14" fill="#a7adb5" text-anchor="start">%</text>
<circle cx="785.3" cy="268.0" r="8" fill="#e0c169" stroke="#17181b" stroke-width="2"/>
<text x="799.3" y="273.0" font-size="14" fill="#e9e7e3" text-anchor="start">+2.4 %</text>
<line x1="24.0" y1="302.0" x2="870.0" y2="302.0" stroke="#3d4148" stroke-width="1"/>
<text x="32.0" y="324.0" font-size="17" fill="#e9e7e3" text-anchor="start" font-weight="bold">Slope</text>
<text x="32.0" y="346.0" font-size="15" fill="#a7adb5" text-anchor="start">Δn/ΔM = R/kt² · 60/2π</text>
<text x="360.0" y="324.0" font-size="15" fill="#e9e7e3" text-anchor="start">10.6  |  10.6</text>
<text x="360.0" y="346.0" font-size="14" fill="#a7adb5" text-anchor="start">min⁻¹/mNm</text>
<circle cx="732.4" cy="330.0" r="8" fill="#ae9ce6" stroke="#17181b" stroke-width="2"/>
<text x="746.4" y="335.0" font-size="14" fill="#e9e7e3" text-anchor="start">+0.1 %</text>
<line x1="24.0" y1="364.0" x2="870.0" y2="364.0" stroke="#3d4148" stroke-width="1"/>
<text x="32.0" y="386.0" font-size="17" fill="#e9e7e3" text-anchor="start" font-weight="bold">kM · kn</text>
<text x="32.0" y="408.0" font-size="15" fill="#a7adb5" text-anchor="start">≈ 60000/2π = 9549</text>
<text x="360.0" y="386.0" font-size="15" fill="#e9e7e3" text-anchor="start">9575  |  9549</text>
<text x="360.0" y="408.0" font-size="14" fill="#a7adb5" text-anchor="start"></text>
<circle cx="736.4" cy="392.0" r="8" fill="#6cc6ba" stroke="#17181b" stroke-width="2"/>
<text x="750.4" y="397.0" font-size="14" fill="#e9e7e3" text-anchor="start">+0.3 %</text>
<text x="870.0" y="470.0" font-size="14" fill="#e58a80" text-anchor="end">outside ±5 %</text>
<text x="590.0" y="470.0" font-size="14" fill="#e58a80" text-anchor="start">outside ±5 %</text>
<text x="32.0" y="494.0" font-size="15" fill="#a7adb5" text-anchor="start">Beyond about 5 %, suspect a typo, a different condition or a unit slip (HW14, audit checklist).</text>
</svg>
