<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" font-family="Inter, Arial, sans-serif" font-size="14">
<rect width="720" height="440" fill="#191b1f" rx="12"/>
<text x="360" y="30" fill="#e5e7eb" font-size="16" text-anchor="middle">Same 5-state value function, three function classes</text>
<line x1="70" y1="340" x2="660" y2="340" stroke="#e5e7eb"/><line x1="70" y1="340" x2="70" y2="60" stroke="#e5e7eb"/>
<text x="365" y="395" fill="#e5e7eb" text-anchor="middle">state index i (random-walk position, 0 = next to left exit)</text>
<text x="22" y="200" fill="#e5e7eb" text-anchor="middle" transform="rotate(-90 22 200)">value V(i)</text>
<line x1="66" y1="340" x2="70" y2="340" stroke="#e5e7eb"/><text x="60" y="345" fill="#e5e7eb" text-anchor="end">0</text>
<line x1="66" y1="260" x2="70" y2="260" stroke="#e5e7eb"/><text x="60" y="265" fill="#e5e7eb" text-anchor="end">0.2</text>
<line x1="66" y1="180" x2="70" y2="180" stroke="#e5e7eb"/><text x="60" y="185" fill="#e5e7eb" text-anchor="end">0.4</text>
<line x1="66" y1="100" x2="70" y2="100" stroke="#e5e7eb"/><text x="60" y="105" fill="#e5e7eb" text-anchor="end">0.6</text>
<text x="110" y="360" fill="#e5e7eb" text-anchor="middle">0</text>
<text x="240" y="360" fill="#e5e7eb" text-anchor="middle">1</text>
<text x="370" y="360" fill="#e5e7eb" text-anchor="middle">2</text>
<text x="500" y="360" fill="#e5e7eb" text-anchor="middle">3</text>
<text x="630" y="360" fill="#e5e7eb" text-anchor="middle">4</text>
<polyline fill="none" stroke="#9ccd4e" stroke-width="3" points="80,292 305,292 305,237 435,237 435,134 660,134"/>
<polyline fill="none" stroke="#d97936" stroke-width="3" points="110,342 240,282 370,221 500,160 630,100"/>
<polyline fill="none" stroke="#53b2dd" stroke-width="2" stroke-dasharray="5 4" points="110,314 240,282 370,237 500,169 630,63"/>
<circle cx="110" cy="314" r="6" fill="#53b2dd"/>
<circle cx="240" cy="282" r="6" fill="#53b2dd"/>
<circle cx="370" cy="237" r="6" fill="#53b2dd"/>
<circle cx="500" cy="169" r="6" fill="#53b2dd"/>
<circle cx="630" cy="63" r="6" fill="#53b2dd"/>
<text x="90" y="70" fill="#53b2dd">exact V = tabular fit (blue dots)</text>
<text x="90" y="90" fill="#d97936">linear [1, i] projection (orange)</text>
<text x="90" y="110" fill="#9ccd4e">3-group aggregation (green)</text>
<text x="300" y="328" fill="#e5e7eb">linear estimate dips below 0 at i = 0</text>
</svg>