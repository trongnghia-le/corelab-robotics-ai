<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" font-family="Inter, Arial, sans-serif">
<rect width="720" height="380" fill="#191b1f" rx="12"/>
<text x="24" y="30" fill="#e5e7eb" font-size="16" font-weight="bold">Flight: internal force only</text>
<text x="400" y="30" fill="#e5e7eb" font-size="16" font-weight="bold">Stance: ground force</text>
<rect x="130" y="80" width="80" height="50" fill="#3b414d" stroke="#53b2dd" stroke-width="2"/>
<text x="170" y="110" fill="#e5e7eb" font-size="13" text-anchor="middle">body m_b</text>
<rect x="150" y="220" width="40" height="30" fill="#3b414d" stroke="#9ccd4e" stroke-width="2"/>
<text x="170" y="240" fill="#e5e7eb" font-size="13" text-anchor="middle">leg</text>
<line x1="170" y1="130" x2="170" y2="220" stroke="#e5e7eb" stroke-width="4"/>
<g stroke="#d97936" stroke-width="3"><line x1="120" y1="130" x2="120" y2="85"/><line x1="120" y1="220" x2="120" y2="265"/></g>
<polygon points="114,92 126,92 120,80" fill="#d97936"/><polygon points="114,258 126,258 120,270" fill="#d97936"/>
<text x="106" y="160" fill="#d97936" font-size="13" text-anchor="end">+u on body</text><text x="106" y="205" fill="#d97936" font-size="13" text-anchor="end">-u on leg</text>
<circle cx="170" cy="190" r="6" fill="#e5e7eb"/><text x="184" y="194" fill="#e5e7eb" font-size="13">COM</text>
<line x1="260" y1="150" x2="260" y2="230" stroke="#e5e7eb" stroke-width="3"/><polygon points="254,224 266,224 260,236" fill="#e5e7eb"/>
<text x="270" y="190" fill="#e5e7eb" font-size="13">m g only</text>
<text x="40" y="320" fill="#e5e7eb" font-size="13">COM acceleration = -g for any u</text>
<text x="40" y="344" fill="#9ccd4e" font-size="13">+u and -u cancel in the total</text>
<line x1="380" y1="300" x2="700" y2="300" stroke="#e5e7eb" stroke-width="3"/>
<rect x="510" y="80" width="80" height="50" fill="#3b414d" stroke="#53b2dd" stroke-width="2"/>
<text x="550" y="110" fill="#e5e7eb" font-size="13" text-anchor="middle">body m_b</text>
<rect x="518" y="260" width="64" height="30" fill="#3b414d" stroke="#9ccd4e" stroke-width="2"/>
<text x="550" y="280" fill="#e5e7eb" font-size="13" text-anchor="middle">leg m_l</text>
<line x1="550" y1="130" x2="550" y2="260" stroke="#e5e7eb" stroke-width="4"/>
<g stroke="#d97936" stroke-width="3"><line x1="500" y1="130" x2="500" y2="85"/></g><polygon points="494,92 506,92 500,80" fill="#d97936"/>
<text x="488" y="112" fill="#d97936" font-size="13" text-anchor="end">u</text>
<line x1="640" y1="345" x2="640" y2="296" stroke="#9ccd4e" stroke-width="3"/><polygon points="634,304 646,304 640,292" fill="#9ccd4e"/>
<text x="632" y="326" fill="#9ccd4e" font-size="13" text-anchor="end">f = u + m_l g</text>
<text x="400" y="344" fill="#e5e7eb" font-size="13">COM accel = (f - m g)/m, needs f &gt;= 0</text>
<text x="400" y="364" fill="#e5e7eb" font-size="13">ground is the only way u reaches the COM</text>
</svg>
