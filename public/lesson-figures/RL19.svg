<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" font-family="Inter, Arial, sans-serif">
<rect width="760" height="330" fill="#111827" rx="12"/>
<g fill="#e5e7eb" font-size="14">
<text x="30" y="32" font-size="16" font-weight="bold">Error vs rollout step</text>
<text x="60" y="305">1</text><text x="190" y="305">5</text><text x="320" y="305">10</text>
<text x="165" y="324">rollout step k</text>
<text x="20" y="265">0</text><text x="8" y="170">0.15</text><text x="8" y="85">0.30</text>
<text x="40" y="58" font-size="13">RMSE</text>
</g>
<g stroke="#e5e7eb" stroke-width="1.5" fill="none"><line x1="60" y1="260" x2="360" y2="260"/><line x1="60" y1="260" x2="60" y2="70"/></g>
<polyline points="60.0,246.3 90.0,225.9 120.0,203.4 150.0,176.2 180.0,155.3 210.0,130.2 240.0,110.3 270.0,95.6 300.0,89.3 330.0,88.5" fill="none" stroke="#f97316" stroke-width="3"/>
<polyline points="60.0,246.4 90.0,246.4 120.0,246.4 150.0,246.4 180.0,246.4 210.0,246.4 240.0,246.4 270.0,246.4 300.0,246.4 330.0,246.4" fill="none" stroke="#38bdf8" stroke-width="3"/>
<g font-size="14"><text x="72" y="100" fill="#f97316">open-loop rollout error</text><text x="130" y="240" fill="#38bdf8">one-step error (teacher forced)</text></g>
<g fill="#e5e7eb" font-size="14"><text x="420" y="32" font-size="16" font-weight="bold">Where the model can be trusted</text></g>
<line x1="420" y1="200" x2="730" y2="200" stroke="#e5e7eb" stroke-width="1.5"/>
<text x="425" y="230" fill="#e5e7eb" font-size="14">-3</text><text x="522" y="230" fill="#e5e7eb" font-size="14">-1</text><text x="578" y="230" fill="#e5e7eb" font-size="14">0</text><text x="636" y="230" fill="#e5e7eb" font-size="14">+1</text><text x="684" y="230" fill="#e5e7eb" font-size="14">+2</text>
<text x="560" y="252" fill="#e5e7eb" font-size="14">state s</text>
<rect x="525" y="150" width="112" height="50" fill="#a3e635" fill-opacity="0.35" stroke="#a3e635"/>
<text x="530" y="140" fill="#a3e635" font-size="14">training data</text>
<rect x="664" y="150" width="56" height="50" fill="#f97316" fill-opacity="0.35" stroke="#f97316"/>
<text x="622" y="95" fill="#f97316" font-size="14">planner drifts here:</text>
<text x="622" y="113" fill="#f97316" font-size="14">error 50x larger</text>
<path d="M692 120 L692 148" stroke="#f97316" stroke-width="2"/>
<text x="420" y="285" fill="#e5e7eb" font-size="13">replanning from the real state resets the error each step</text>
</svg>