<text x="575" y="232" font-size="13" fill="#f97316" text-anchor="middle">publish</text>
<text x="365" y="300" font-size="13" fill="#a3e635" text-anchor="middle">Same name + same type + compatible QoS = connected</text>
<text x="365" y="320" font-size="13" fill="#f97316" text-anchor="middle">Different type on the same name = no data, no error</text>
<text x="40" y="358" font-size="13" fill="#e5e7eb" text-anchor="start" font-weight="bold">Units live in the contract (REP 103):</text>
<text x="40" y="380" font-size="13" fill="#e5e7eb" text-anchor="start">linear.x in m/s, forward +x;  angular.z in rad/s, counter-clockwise +</text>
<text x="40" y="400" font-size="13" fill="#e5e7eb" text-anchor="start">stamp in integer nanoseconds;  range in m, measured from frame_id</text>
