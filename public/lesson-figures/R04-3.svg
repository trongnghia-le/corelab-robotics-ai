<text x="608.0" y="390.0" font-size="15" fill="#6fc693" text-anchor="start" font-weight="bold">p = (0.53245, 0.08604) m</text>
<text x="608.0" y="416.0" font-size="15" fill="#6fc693" text-anchor="start" font-weight="normal">same tip for both</text>
<text x="608.0" y="452.0" font-size="15" fill="#a7adb5" text-anchor="start" font-weight="normal">A controller needs a rule to pick one:</text>
<text x="608.0" y="474.0" font-size="15" fill="#a7adb5" text-anchor="start" font-weight="normal">current posture, joint limits</text>
