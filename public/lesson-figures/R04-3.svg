<title>Two joint vectors, one tip</title>
<desc>The pose q=(35°,-70°) and the mirrored pose q=(-16.64°,70°) of an arm with l1=0.4 m, l2=0.25 m reach the same tip (0.53245, 0.08604) m.</desc>
