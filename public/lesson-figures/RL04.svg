<polyline points="480.0,73.8 493.7,80.2 507.4,85.2 521.1,100.7 534.7,105.7 548.4,121.2 562.1,126.2 575.8,141.8 589.5,146.8 603.2,162.3 616.8,167.3 630.5,182.8 644.2,187.8 657.9,203.3 671.6,208.3 685.3,223.9 698.9,228.9 712.6,244.4 726.3,249.4 740.0,264.9" fill="none" stroke="#38bdf8" stroke-width="3"/>
<text x="590" y="150" font-size="14" fill="#f97316">bound 7.8 * 0.9^k</text>
<text x="500" y="240" font-size="14" fill="#38bdf8">actual residual</text>
<text x="430" y="344" font-size="13" fill="#e5e7eb">contraction: error shrinks by at most gamma per sweep</text>
</svg>
