<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 360" font-family="Inter, Arial, sans-serif">
<rect width="780" height="360" fill="#111827" rx="12"/>
<text x="30" y="34" font-size="16" fill="#e5e7eb" font-weight="bold">A. Corridor MDP and V* (gamma = 0.9)</text>
<text x="430" y="34" font-size="16" fill="#e5e7eb" font-weight="bold">B. Value-iteration residual per sweep</text>
<g stroke="#e5e7eb" stroke-width="2" fill="none"><rect x="30" y="90" width="64" height="64"/><rect x="100" y="90" width="64" height="64"/><rect x="170" y="90" width="64" height="64"/><rect x="240" y="90" width="64" height="64"/><rect x="310" y="90" width="64" height="64"/></g>
<rect x="30" y="90" width="64" height="64" fill="#f97316" opacity="0.35"/><rect x="310" y="90" width="64" height="64" fill="#a3e635" opacity="0.35"/>
<g font-size="14" fill="#e5e7eb" text-anchor="middle"><text x="62" y="126">pit</text><text x="342" y="126">goal</text><text x="132" y="118">s=1</text><text x="202" y="118">s=2</text><text x="272" y="118">s=3</text>
<text x="132" y="142" fill="#38bdf8">1.20</text><text x="202" y="142" fill="#38bdf8">5.55</text><text x="272" y="142" fill="#38bdf8">8.80</text>
<text x="62" y="176">-10 on entry</text><text x="342" y="176">+10 on entry</text></g>
<text x="30" y="214" font-size="14" fill="#e5e7eb">each step costs -1; the move slips (goes the other way)</text>
<text x="30" y="236" font-size="14" fill="#e5e7eb">with probability 0.2; the best policy is right everywhere</text>
<text x="30" y="276" font-size="14" fill="#a3e635">first sweep from V = 0: (-2.8, -1.0, 7.8)</text>
<text x="30" y="298" font-size="14" fill="#a3e635">second sweep: (-3.52, 4.112, 7.62)</text>
<text x="30" y="330" font-size="14" fill="#e5e7eb">stop at residual &lt; theta: error &lt;= gamma theta/(1-gamma)</text>
<line x1="470" y1="280" x2="750" y2="280" stroke="#e5e7eb" stroke-width="1.5"/><line x1="470" y1="280" x2="470" y2="60" stroke="#e5e7eb" stroke-width="1.5"/>
<text x="430" y="52" font-size="14" fill="#e5e7eb">residual (log)</text>
<text x="600" y="312" font-size="14" fill="#e5e7eb">sweep k</text>
<text x="472" y="300" font-size="13" fill="#e5e7eb">0</text><text x="728" y="300" font-size="13" fill="#e5e7eb">19</text>
