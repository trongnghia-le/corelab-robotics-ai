<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 360" font-family="Inter, Arial, sans-serif">
<rect width="780" height="360" fill="#191b1f" rx="12"/>
<text x="30" y="34" font-size="16" fill="#e5e7eb" font-weight="bold">A. Rendering one ray</text>
<text x="430" y="34" font-size="16" fill="#e5e7eb" font-weight="bold">B. Same colour, different geometry</text>
<line x1="40" y1="110" x2="380" y2="110" stroke="#e5e7eb" stroke-width="2"/>
<polygon points="388,110 376,104 376,116" fill="#e5e7eb"/>
<text x="40" y="92" font-size="14" fill="#e5e7eb">camera</text><text x="300" y="92" font-size="14" fill="#e5e7eb">ray t</text>
<g fill="#53b2dd"><circle cx="80" cy="110" r="5"/><circle cx="130" cy="110" r="5"/><circle cx="180" cy="110" r="5"/><circle cx="230" cy="110" r="5"/><circle cx="280" cy="110" r="5"/><circle cx="330" cy="110" r="5"/></g>
<text x="40" y="150" font-size="14" fill="#53b2dd">samples: sigma_i (density), c_i (colour)</text>
<text x="40" y="190" font-size="14" fill="#e5e7eb">alpha_i = 1 - exp(-sigma_i delta_i)</text>
<text x="40" y="214" font-size="14" fill="#e5e7eb">T_i = product of (1 - alpha_j), j before i</text>
<text x="40" y="238" font-size="14" fill="#d97936">w_i = T_i alpha_i   (weights sum to 1 - T_end)</text>
<text x="40" y="262" font-size="14" fill="#9ccd4e">pixel C = sum w_i c_i</text>
<text x="40" y="300" font-size="14" fill="#e5e7eb">worked example: sigma = (0, 2, 5), delta = 0.5</text>
<text x="40" y="322" font-size="14" fill="#e5e7eb">w = (0, 0.632, 0.338), C = 0.620</text>
<line x1="450" y1="130" x2="750" y2="130" stroke="#e5e7eb" stroke-width="1.5"/>
<text x="450" y="112" font-size="14" fill="#e5e7eb">thin surface at depth 2.5</text>
<rect x="580" y="118" width="14" height="24" fill="#d97936"/>
<line x1="450" y1="230" x2="750" y2="230" stroke="#e5e7eb" stroke-width="1.5"/>
<text x="450" y="212" font-size="14" fill="#e5e7eb">uniform fog, same opacity 0.9</text>
<rect x="470" y="218" width="260" height="24" fill="#53b2dd" opacity="0.35"/>
<text x="450" y="280" font-size="14" fill="#9ccd4e">both render colour 0.72 on this ray</text>
<text x="450" y="304" font-size="14" fill="#e5e7eb">expected depth: 2.50 versus 2.05</text>
<text x="450" y="328" font-size="14" fill="#e5e7eb">other viewpoints break the tie</text>
</svg>
