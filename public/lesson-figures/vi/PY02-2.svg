<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="Inter, sans-serif">
<title>Hai ô log-log so sánh tra cứu trong list và bảng băm với n từ 100 đến một triệu</title>
<desc>Trái: số so sánh n so với tối đa 1.67. Phải: thời gian đo từ 707 ns đến 7.7 ms với list và 33 đến 37 ns với set.</desc>
<rect width="900" height="500" rx="14" fill="#17181b"/>

<text x="32" y="44" font-size="22" font-weight="bold" fill="#e9e7e3">Tra cứu thất bại: list tăng theo n, bảng băm phẳng</text>
<rect x="32" y="64" width="406" height="412" rx="10" fill="#22252a"/>
<rect x="462" y="64" width="406" height="412" rx="10" fill="#22252a"/>
<text x="52" y="96" font-size="17" font-weight="bold" fill="#e9e7e3">Mô hình: số so sánh mỗi lần tra thất bại</text>
<text x="482" y="96" font-size="17" font-weight="bold" fill="#e9e7e3">Đo thật: thời gian mỗi lần tra thất bại</text>
<line x1="100" y1="390" x2="400.0" y2="390.0" stroke="#3d4148" stroke-width="1"/>
<text x="92" y="395" font-size="14" text-anchor="end" fill="#a7adb5">10⁰</text>
<line x1="100" y1="319" x2="400.0" y2="319.0" stroke="#3d4148" stroke-width="1"/>
<text x="92" y="324" font-size="14" text-anchor="end" fill="#a7adb5">10²</text>
<line x1="100" y1="248" x2="400.0" y2="248.0" stroke="#3d4148" stroke-width="1"/>
<text x="92" y="253" font-size="14" text-anchor="end" fill="#a7adb5">10⁴</text>
<line x1="100" y1="176.9" x2="400.0" y2="176.9" stroke="#3d4148" stroke-width="1"/>
<text x="92" y="181.9" font-size="14" text-anchor="end" fill="#a7adb5">10⁶</text>
<line x1="100" y1="160" x2="100.0" y2="390.0" stroke="#3d4148" stroke-width="1"/>
<text x="100" y="410" font-size="14" text-anchor="middle" fill="#a7adb5">10²</text>
<line x1="250" y1="160" x2="250.0" y2="390.0" stroke="#3d4148" stroke-width="1"/>
<text x="250" y="410" font-size="14" text-anchor="middle" fill="#a7adb5">10⁴</text>
<line x1="400" y1="160" x2="400.0" y2="390.0" stroke="#3d4148" stroke-width="1"/>
<text x="400" y="410" font-size="14" text-anchor="middle" fill="#a7adb5">10⁶</text>
<line x1="100" y1="390" x2="400.0" y2="390.0" stroke="#a7adb5" stroke-width="1.5"/>
<line x1="100" y1="160" x2="100.0" y2="390.0" stroke="#a7adb5" stroke-width="1.5"/>
<text x="100" y="146" font-size="15" fill="#e9e7e3">số so sánh</text>
<line x1="100" y1="319" x2="400.0" y2="176.9" stroke="#e0904f" stroke-width="2.5"/>
<line x1="100" y1="382.1" x2="400.0" y2="382.1" stroke="#86abe2" stroke-width="2.5"/>
<text x="321" y="196.5" font-size="15" font-weight="600" text-anchor="end" fill="#e0904f">list: n</text>
<text x="135.8" y="370.1" font-size="15" font-weight="600" fill="#86abe2">bảng băm ≤ 1.67</text>
<circle cx="400.0" cy="176.9" r="5" fill="#e0904f"/>
<circle cx="400.0" cy="382.1" r="5" fill="#86abe2"/>
<text x="400" y="432" font-size="15" text-anchor="end" fill="#e9e7e3">n (số phần tử đã lưu)</text>
<text x="52" y="456" font-size="14" fill="#a7adb5">mô hình: set ≤ 1 + α với α ≤ 2/3 (MIT 6.006)</text>
<line x1="530" y1="390" x2="830.0" y2="390.0" stroke="#3d4148" stroke-width="1"/>
<text x="522" y="395" font-size="14" text-anchor="end" fill="#a7adb5">10¹</text>
<line x1="530" y1="319" x2="830.0" y2="319.0" stroke="#3d4148" stroke-width="1"/>
<text x="522" y="324" font-size="14" text-anchor="end" fill="#a7adb5">10³</text>
<line x1="530" y1="248" x2="830.0" y2="248.0" stroke="#3d4148" stroke-width="1"/>
<text x="522" y="253" font-size="14" text-anchor="end" fill="#a7adb5">10⁵</text>
<line x1="530" y1="176.9" x2="830.0" y2="176.9" stroke="#3d4148" stroke-width="1"/>
<text x="522" y="181.9" font-size="14" text-anchor="end" fill="#a7adb5">10⁷</text>
<line x1="530" y1="160" x2="530.0" y2="390.0" stroke="#3d4148" stroke-width="1"/>
<text x="530" y="410" font-size="14" text-anchor="middle" fill="#a7adb5">10²</text>
<line x1="680" y1="160" x2="680.0" y2="390.0" stroke="#3d4148" stroke-width="1"/>
<text x="680" y="410" font-size="14" text-anchor="middle" fill="#a7adb5">10⁴</text>
<line x1="830" y1="160" x2="830.0" y2="390.0" stroke="#3d4148" stroke-width="1"/>
<text x="830" y="410" font-size="14" text-anchor="middle" fill="#a7adb5">10⁶</text>
<line x1="530" y1="390" x2="830.0" y2="390.0" stroke="#a7adb5" stroke-width="1.5"/>
<line x1="530" y1="160" x2="530.0" y2="390.0" stroke="#a7adb5" stroke-width="1.5"/>
<text x="530" y="146" font-size="15" fill="#e9e7e3">thời gian (ns)</text>
<polyline points="530.0,324.3 605.0,289.2 680.0,253.8 755.0,218.4 830.0,181.0" fill="none" stroke="#e0904f" stroke-width="2.5" stroke-linejoin="round"/>
<polyline points="530.0,371.6 605.0,371.4 680.0,371.1 755.0,370.9 830.0,369.7" fill="none" stroke="#86abe2" stroke-width="2.5" stroke-linejoin="round"/>
<circle cx="530.0" cy="324.3" r="5" fill="#e0904f"/>
<circle cx="605.0" cy="289.2" r="5" fill="#e0904f"/>
<circle cx="680.0" cy="253.8" r="5" fill="#e0904f"/>
<circle cx="755.0" cy="218.4" r="5" fill="#e0904f"/>
<circle cx="830.0" cy="181.0" r="5" fill="#e0904f"/>
<circle cx="530.0" cy="371.6" r="5" fill="#86abe2"/>
<circle cx="605.0" cy="371.4" r="5" fill="#86abe2"/>
<circle cx="680.0" cy="371.1" r="5" fill="#86abe2"/>
<circle cx="755.0" cy="370.9" r="5" fill="#86abe2"/>
<circle cx="830.0" cy="369.7" r="5" fill="#86abe2"/>
<text x="820" y="169" font-size="15" font-weight="600" text-anchor="end" fill="#e0904f">7.7 ms</text>
<text x="820" y="355.7" font-size="15" font-weight="600" text-anchor="end" fill="#86abe2">37 ns</text>
<text x="830" y="432" font-size="15" text-anchor="end" fill="#e9e7e3">n (số phần tử đã lưu)</text>
<text x="482" y="456" font-size="14" fill="#a7adb5">tại n = 10⁶ tra trong list chậm hơn khoảng 2×10⁵ lần</text>
</svg>
