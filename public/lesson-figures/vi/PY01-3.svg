<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="Inter, sans-serif">
<title>Hai phiên bản first_negative trên [4, 7, −3, 5]: bất biến trên values[:i] và nơi mỗi vòng lặp trả về</title>
<desc>Hai hàng bốn ô chứa 4, 7, trừ 3, 5: vòng lặp đúng trả 2 tại chỉ số 2; vòng lặp lỗi trả trừ 1 tại chỉ số 0.</desc>
<rect width="900" height="470" rx="14" fill="#17181b"/>

<text x="32" y="44" font-size="22" font-weight="bold" fill="#e9e7e3">Bất biến vòng lặp biện minh cho từng lệnh return</text>
<rect x="32" y="64" width="836" height="166" rx="10" fill="#22252a"/>
<text x="56" y="96" font-size="17" font-weight="bold" fill="#e9e7e3">Đúng: return -1 chỉ sau vòng lặp</text>
<rect x="56" y="124" width="90" height="44" rx="6" fill="#6fc693" fill-opacity="0.22" stroke="#6fc693" stroke-width="2"/>
<text x="101" y="152" font-size="17" font-weight="bold" text-anchor="middle" fill="#e9e7e3">4</text>
<text x="101" y="188" font-size="14" text-anchor="middle" fill="#a7adb5">i = 0</text>
<rect x="152" y="124" width="90" height="44" rx="6" fill="#6fc693" fill-opacity="0.22" stroke="#6fc693" stroke-width="2"/>
<text x="197" y="152" font-size="17" font-weight="bold" text-anchor="middle" fill="#e9e7e3">7</text>
<text x="197" y="188" font-size="14" text-anchor="middle" fill="#a7adb5">i = 1</text>
<rect x="248" y="124" width="90" height="44" rx="6" fill="#e0904f" fill-opacity="0.22" stroke="#e0904f" stroke-width="2"/>
<text x="293" y="152" font-size="17" font-weight="bold" text-anchor="middle" fill="#e9e7e3">−3</text>
<text x="293" y="188" font-size="14" text-anchor="middle" fill="#a7adb5">i = 2</text>
<rect x="344" y="124" width="90" height="44" rx="6" fill="#22252a" stroke="#a7adb5" stroke-width="2" stroke-dasharray="5 4"/>
<text x="389" y="152" font-size="17" font-weight="bold" text-anchor="middle" fill="#e9e7e3">5</text>
<text x="389" y="188" font-size="14" text-anchor="middle" fill="#a7adb5">i = 3</text>
<text x="476" y="150" font-size="15" font-weight="600" fill="#e9e7e3">i = 2: values[2] = −3 &lt; 0, nên return 2</text>
<text x="476" y="178" font-size="15" fill="#e9e7e3">bất biến: values[:2] không có số âm,</text>
<text x="476" y="202" font-size="15" fill="#e9e7e3">nên 2 là chỉ số âm đầu tiên</text>
<rect x="32" y="250" width="836" height="166" rx="10" fill="#22252a"/>
<text x="56" y="282" font-size="17" font-weight="bold" fill="#e9e7e3">Lỗi: nhánh else trả -1 ngay trong vòng lặp</text>
<rect x="56" y="310" width="90" height="44" rx="6" fill="#e58a80" fill-opacity="0.22" stroke="#e58a80" stroke-width="2"/>
<text x="101" y="338" font-size="17" font-weight="bold" text-anchor="middle" fill="#e9e7e3">4</text>
<text x="101" y="374" font-size="14" text-anchor="middle" fill="#a7adb5">i = 0</text>
<rect x="152" y="310" width="90" height="44" rx="6" fill="#22252a" stroke="#a7adb5" stroke-width="2" stroke-dasharray="5 4"/>
<text x="197" y="338" font-size="17" font-weight="bold" text-anchor="middle" fill="#e9e7e3">7</text>
<text x="197" y="374" font-size="14" text-anchor="middle" fill="#a7adb5">i = 1</text>
<rect x="248" y="310" width="90" height="44" rx="6" fill="#22252a" stroke="#a7adb5" stroke-width="2" stroke-dasharray="5 4"/>
<text x="293" y="338" font-size="17" font-weight="bold" text-anchor="middle" fill="#e9e7e3">−3</text>
<text x="293" y="374" font-size="14" text-anchor="middle" fill="#a7adb5">i = 2</text>
<rect x="344" y="310" width="90" height="44" rx="6" fill="#22252a" stroke="#a7adb5" stroke-width="2" stroke-dasharray="5 4"/>
<text x="389" y="338" font-size="17" font-weight="bold" text-anchor="middle" fill="#e9e7e3">5</text>
<text x="389" y="374" font-size="14" text-anchor="middle" fill="#a7adb5">i = 3</text>
<text x="476" y="336" font-size="15" font-weight="600" fill="#e9e7e3">i = 0: 4 &lt; 0 sai, nên else: return -1</text>
<text x="476" y="364" font-size="15" fill="#e9e7e3">thoát sau một lần thử; bất biến chỉ phủ</text>
<text x="476" y="388" font-size="15" fill="#e9e7e3">values[:1], nên −3 ở chỉ số 2 bị bỏ sót</text>
<rect x="32" y="435" width="16" height="16" rx="3" fill="#6fc693" fill-opacity="0.22" stroke="#6fc693" stroke-width="2"/>
<text x="56" y="448" font-size="14" fill="#a7adb5">đã kiểm: không âm</text>
<rect x="250" y="435" width="16" height="16" rx="3" fill="#e0904f" fill-opacity="0.22" stroke="#e0904f" stroke-width="2"/>
<text x="274" y="448" font-size="14" fill="#a7adb5">tìm thấy số âm</text>
<rect x="440" y="435" width="16" height="16" rx="3" fill="#e58a80" fill-opacity="0.22" stroke="#e58a80" stroke-width="2"/>
<text x="464" y="448" font-size="14" fill="#a7adb5">đã thử, thoát sai</text>
<rect x="660" y="435" width="16" height="16" rx="3" fill="#22252a" stroke="#a7adb5" stroke-width="2" stroke-dasharray="4 3"/>
<text x="684" y="448" font-size="14" fill="#a7adb5">chưa được xét</text>
</svg>
