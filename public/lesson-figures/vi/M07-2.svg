<text x="288" y="157.8" font-size="15" font-weight="600" fill="#6fc693">2.83 i</text>
<text x="224" y="286" font-size="15" font-weight="600" text-anchor="middle" fill="#86abe2">Euler</text>
<text x="224" y="324" font-size="14" text-anchor="middle" fill="#86abe2">|1 + z| &lt; 1</text>
<text x="224" y="388.4" font-size="15" font-weight="600" text-anchor="middle" fill="#6fc693">RK4</text>
<text x="580" y="100" font-size="17" font-weight="bold" fill="#e9e7e3">Một bước là x_{n+1} = R(z) x_n</text>
<line x1="580" y1="128" x2="602.0" y2="128.0" stroke="#86abe2" stroke-width="3"/>
<text x="612" y="133" font-size="15" fill="#e9e7e3">Euler: R = 1 + z</text>
<line x1="580" y1="156" x2="602.0" y2="156.0" stroke="#6fc693" stroke-width="3"/>
<text x="612" y="161" font-size="15" fill="#e9e7e3">RK4: R = 1 + z + z²/2 + …</text>
<line x1="580" y1="184" x2="602.0" y2="184.0" stroke="#e58a80" stroke-width="3" stroke-dasharray="6 4"/>
<text x="612" y="189" font-size="15" fill="#e9e7e3">Euler lùi: R = 1/(1 − z)</text>
<text x="580" y="236" font-size="17" font-weight="bold" fill="#e9e7e3">Giới hạn ổn định</text>
<text x="580" y="264" font-size="14" fill="#a7adb5">phương pháp</text>
<text x="672" y="264" font-size="14" fill="#a7adb5">trục thực</text>
<text x="756" y="264" font-size="14" fill="#a7adb5">trục ảo</text>
<line x1="580" y1="274" x2="844.0" y2="274.0" stroke="#3d4148" stroke-width="1"/>
<text x="580" y="302" font-size="15" font-weight="600" fill="#86abe2">Euler</text>
<text x="672" y="302" font-size="15" fill="#e9e7e3">z &gt; −2</text>
<text x="756" y="302" font-size="15" fill="#e9e7e3">không bao giờ</text>
<text x="580" y="334" font-size="15" font-weight="600" fill="#6fc693">RK4</text>
<text x="672" y="334" font-size="15" fill="#e9e7e3">z &gt; −2.785</text>
<text x="756" y="334" font-size="15" fill="#e9e7e3">|z| &lt; 2.83</text>
<text x="580" y="366" font-size="15" font-weight="600" fill="#e58a80">Euler lùi</text>
<text x="672" y="366" font-size="15" fill="#e9e7e3">mọi z &lt; 0</text>
<text x="756" y="366" font-size="15" fill="#e9e7e3">luôn luôn</text>
<line x1="580" y1="400" x2="844.0" y2="400.0" stroke="#3d4148" stroke-width="1"/>
<text x="580" y="430" font-size="15" font-weight="600" fill="#e0c169">Motor cứng: λ = −1000 s⁻¹, h = 0.01 s</text>
<text x="580" y="454" font-size="15" fill="#e0c169">z = −10 nằm ngoài cả hai miền hiện</text>
