<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 516" font-family="Inter, sans-serif">
<title>Một lớp ReLU gấp mặt phẳng</title>
<desc>Trái: mặt phẳng đầu vào với các nếp z1 = 0 và z2 = 0 và bốn điểm A đến D. Phải: ảnh sau h = relu(Wx + b): A vẫn ở góc phần tư thứ nhất, B và C rơi lên trục h2 và h1, D co về gốc tọa độ.</desc>
<defs><marker id="m1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs>
<rect width="900" height="516" rx="14" fill="#17181b"/>
<text x="32" y="44" font-size="22" fill="#e9e7e3" text-anchor="start" font-weight="bold">Một lớp ReLU gấp mặt phẳng</text>
<rect x="32" y="68" width="406" height="380" rx="8" fill="#22252a" stroke="#3d4148" stroke-width="1.5"/>
<text x="48" y="98" font-size="17" fill="#e9e7e3" text-anchor="start" font-weight="bold">Đầu vào x: ô (nơ-ron 1, nơ-ron 2)</text>
<rect x="462" y="68" width="406" height="380" rx="8" fill="#22252a" stroke="#3d4148" stroke-width="1.5"/>
<text x="478" y="98" font-size="17" fill="#e9e7e3" text-anchor="start" font-weight="bold">Sau h = relu(Wx + b)</text>
<polygon points="382,178 382,108 172,108 242,248" fill="#86abe2" fill-opacity="0.16" stroke="none"/>
<polygon points="242,248 172,108 102,108 102,318" fill="#6cc6ba" fill-opacity="0.16" stroke="none"/>
<polygon points="312,388 382,388 382,178 242,248" fill="#e0c169" fill-opacity="0.16" stroke="none"/>
<polygon points="102,388 312,388 242,248 102,318" fill="#e08db5" fill-opacity="0.16" stroke="none"/>
<rect x="102" y="108" width="280" height="280" fill="none" stroke="#3d4148" stroke-width="1.5"/>
<line x1="102" y1="248" x2="382" y2="248" stroke="#3d4148" stroke-width="1.2" stroke-linecap="round"/>
<line x1="242" y1="388" x2="242" y2="108" stroke="#3d4148" stroke-width="1.2" stroke-linecap="round"/>
<text x="102" y="408" font-size="14" fill="#a7adb5" text-anchor="middle">−2</text>
<text x="94" y="393" font-size="14" fill="#a7adb5" text-anchor="end">−2</text>
<text x="172" y="408" font-size="14" fill="#a7adb5" text-anchor="middle">−1</text>
<text x="94" y="323" font-size="14" fill="#a7adb5" text-anchor="end">−1</text>
<text x="242" y="408" font-size="14" fill="#a7adb5" text-anchor="middle">0</text>
<text x="94" y="253" font-size="14" fill="#a7adb5" text-anchor="end">0</text>
<text x="312" y="408" font-size="14" fill="#a7adb5" text-anchor="middle">1</text>
<text x="94" y="183" font-size="14" fill="#a7adb5" text-anchor="end">1</text>
<text x="382" y="408" font-size="14" fill="#a7adb5" text-anchor="middle">2</text>
<text x="94" y="113" font-size="14" fill="#a7adb5" text-anchor="end">2</text>
<text x="242" y="430" font-size="15" fill="#a7adb5" text-anchor="middle">x1</text>
<text x="56" y="248" transform="rotate(-90 56 248)" font-size="15" fill="#a7adb5" text-anchor="middle">x2</text>
<line x1="172" y1="108" x2="312" y2="388" stroke="#e0904f" stroke-width="2.5" stroke-linecap="round"/>
<line x1="102" y1="318" x2="382" y2="178" stroke="#ae9ce6" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="7 5"/>
<text x="164" y="126" font-size="14" fill="#e0904f" text-anchor="end">z1 = 0</text>
<text x="376" y="164" font-size="14" fill="#ae9ce6" text-anchor="end">z2 = 0</text>
<circle cx="312" cy="178" r="6" fill="#86abe2"/>
<text x="302" y="169" font-size="15" fill="#86abe2" text-anchor="end" font-weight="bold">A</text>
<circle cx="137" cy="178" r="6" fill="#6cc6ba"/>
<text x="147" y="169" font-size="15" fill="#6cc6ba" text-anchor="start" font-weight="bold">B</text>
<circle cx="347" cy="318" r="6" fill="#e0c169"/>
<text x="357" y="309" font-size="15" fill="#e0c169" text-anchor="start" font-weight="bold">C</text>
<circle cx="172" cy="318" r="6" fill="#e08db5"/>
<text x="182" y="309" font-size="15" fill="#e08db5" text-anchor="start" font-weight="bold">D</text>
<text x="378.5" y="125.5" font-size="14" fill="#a7adb5" text-anchor="end">(bật, bật)</text>
<text x="105.5" y="276" font-size="14" fill="#a7adb5" text-anchor="start">(tắt, bật)</text>
<text x="378.5" y="370.5" font-size="14" fill="#a7adb5" text-anchor="end">(bật, tắt)</text>
<text x="105.5" y="374" font-size="14" fill="#a7adb5" text-anchor="start">(tắt, tắt)</text>
<polygon points="578.7,341.3 812,341.3 812,108 578.7,108" fill="#86abe2" fill-opacity="0.16" stroke="none"/>
<rect x="532" y="108" width="280" height="280" fill="none" stroke="#3d4148" stroke-width="1.5"/>
<line x1="532" y1="341.3" x2="812" y2="341.3" stroke="#3d4148" stroke-width="1.2" stroke-linecap="round"/>
<line x1="578.7" y1="388" x2="578.7" y2="108" stroke="#3d4148" stroke-width="1.2" stroke-linecap="round"/>
<line x1="578.7" y1="341.3" x2="812" y2="341.3" stroke="#e0c169" stroke-width="4" stroke-linecap="round"/>
<line x1="578.7" y1="341.3" x2="578.7" y2="108" stroke="#6cc6ba" stroke-width="4" stroke-linecap="round"/>
<text x="578.7" y="408" font-size="14" fill="#a7adb5" text-anchor="middle">0</text>
<text x="524" y="346.3" font-size="14" fill="#a7adb5" text-anchor="end">0</text>
<text x="672" y="408" font-size="14" fill="#a7adb5" text-anchor="middle">1</text>
<text x="524" y="253" font-size="14" fill="#a7adb5" text-anchor="end">1</text>
<text x="765.3" y="408" font-size="14" fill="#a7adb5" text-anchor="middle">2</text>
<text x="524" y="159.7" font-size="14" fill="#a7adb5" text-anchor="end">2</text>
<text x="672" y="430" font-size="15" fill="#a7adb5" text-anchor="middle">h1</text>
<text x="486" y="248" transform="rotate(-90 486 248)" font-size="15" fill="#a7adb5" text-anchor="middle">h2</text>
<circle cx="718.7" cy="294.7" r="6" fill="#86abe2"/>
<circle cx="578.7" cy="178" r="6" fill="#6cc6ba"/>
<circle cx="672" cy="341.3" r="6" fill="#e0c169"/>
<circle cx="578.7" cy="341.3" r="6" fill="#e08db5"/>
<text x="728.7" y="284.7" font-size="15" fill="#86abe2" text-anchor="start" font-weight="600">A (1.5, 0.5)</text>
<text x="590.7" y="183" font-size="15" fill="#6cc6ba" text-anchor="start" font-weight="600">B (0, 1.75)</text>
<text x="672" y="327.3" font-size="15" fill="#e0c169" text-anchor="middle" font-weight="600">C (1, 0)</text>
<text x="590.7" y="363.3" font-size="15" fill="#e08db5" text-anchor="start" font-weight="600">D (0, 0)</text>
<line x1="442" y1="258" x2="458" y2="258" stroke="#a7adb5" stroke-width="2.5" stroke-linecap="round" marker-end="url(#m1)"/>
<text x="32" y="476" font-size="14" fill="#a7adb5" text-anchor="start">W = [[1, 0.5], [−0.5, 1]], b = 0 (số minh họa). Đầu vào: A = (1, 1), B = (−1.5, 1), C = (1.5, −1), D = (−1, −1).</text>
<text x="32" y="498" font-size="14" fill="#a7adb5" text-anchor="start">Nửa mặt phẳng sau một nếp bị ép phẳng lên nếp đó: B và C mất một tọa độ, D mất cả hai.</text>
</svg>
