<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" font-family="Inter, sans-serif">
<title>Đòn bẩy: sai số góc nhỏ làm điểm xa lệch rất nhiều</title>
<desc>Các đường độ lệch 2 r sin(eps/2) tính bằng centimet theo khoảng cách r từ 0 đến 10 m, với sai số quay 0.5, 1 và 2 độ. Tại 2 m và 1 độ độ lệch là 3.49 cm; tại 10 m là 8.7, 17.5 và 34.9 cm.</desc>
<defs></defs>
<rect width="900" height="540" rx="14" fill="#17181b"/>
<text x="32" y="44" font-size="22" fill="#e9e7e3" text-anchor="start" font-weight="bold">Đòn bẩy: sai số góc nhỏ làm điểm xa lệch rất nhiều</text>
<rect x="32" y="64" width="836" height="452" rx="8" fill="#22252a" stroke="#3d4148" stroke-width="1.5"/>
<text x="48" y="94" font-size="17" fill="#e9e7e3" text-anchor="start" font-weight="bold">Độ lệch của một điểm phát hiện do sai số quay ε</text>
<line x1="110" y1="450" x2="720" y2="450" stroke="#a7adb5" stroke-width="1.5" stroke-linecap="round"/>
<line x1="110" y1="450" x2="110" y2="140" stroke="#a7adb5" stroke-width="1.5" stroke-linecap="round"/>
<line x1="110" y1="450" x2="110" y2="456" stroke="#a7adb5" stroke-width="1.5" stroke-linecap="round"/>
<text x="110" y="474" font-size="14" fill="#a7adb5" text-anchor="middle">0</text>
<line x1="230" y1="450" x2="230" y2="456" stroke="#a7adb5" stroke-width="1.5" stroke-linecap="round"/>
<text x="230" y="474" font-size="14" fill="#a7adb5" text-anchor="middle">2</text>
<line x1="350" y1="450" x2="350" y2="456" stroke="#a7adb5" stroke-width="1.5" stroke-linecap="round"/>
<text x="350" y="474" font-size="14" fill="#a7adb5" text-anchor="middle">4</text>
<line x1="470" y1="450" x2="470" y2="456" stroke="#a7adb5" stroke-width="1.5" stroke-linecap="round"/>
<text x="470" y="474" font-size="14" fill="#a7adb5" text-anchor="middle">6</text>
<line x1="590" y1="450" x2="590" y2="456" stroke="#a7adb5" stroke-width="1.5" stroke-linecap="round"/>
<text x="590" y="474" font-size="14" fill="#a7adb5" text-anchor="middle">8</text>
<line x1="710" y1="450" x2="710" y2="456" stroke="#a7adb5" stroke-width="1.5" stroke-linecap="round"/>
<text x="710" y="474" font-size="14" fill="#a7adb5" text-anchor="middle">10</text>
<line x1="104" y1="450" x2="110" y2="450" stroke="#a7adb5" stroke-width="1.5" stroke-linecap="round"/>
<text x="98" y="455" font-size="14" fill="#a7adb5" text-anchor="end">0</text>
<line x1="104" y1="375" x2="110" y2="375" stroke="#a7adb5" stroke-width="1.5" stroke-linecap="round"/>
<text x="98" y="380" font-size="14" fill="#a7adb5" text-anchor="end">10</text>
<line x1="104" y1="300" x2="110" y2="300" stroke="#a7adb5" stroke-width="1.5" stroke-linecap="round"/>
<text x="98" y="305" font-size="14" fill="#a7adb5" text-anchor="end">20</text>
<line x1="104" y1="225" x2="110" y2="225" stroke="#a7adb5" stroke-width="1.5" stroke-linecap="round"/>
<text x="98" y="230" font-size="14" fill="#a7adb5" text-anchor="end">30</text>
<line x1="104" y1="150" x2="110" y2="150" stroke="#a7adb5" stroke-width="1.5" stroke-linecap="round"/>
<text x="98" y="155" font-size="14" fill="#a7adb5" text-anchor="end">40</text>
<line x1="110" y1="375" x2="710" y2="375" stroke="#3d4148" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="3 5"/>
<line x1="110" y1="300" x2="710" y2="300" stroke="#3d4148" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="3 5"/>
<line x1="110" y1="225" x2="710" y2="225" stroke="#3d4148" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="3 5"/>
<line x1="110" y1="150" x2="710" y2="150" stroke="#3d4148" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="3 5"/>
<text x="410" y="500" font-size="15" fill="#a7adb5" text-anchor="middle">khoảng cách r tới gốc frame (m)</text>
<text x="110" y="128" font-size="14" fill="#a7adb5" text-anchor="start">độ lệch (cm)</text>
<text x="130" y="187.5" font-size="15" fill="#e9e7e3" text-anchor="start" font-weight="600">độ lệch = 2 r sin(ε/2) ≈ r·ε</text>
<path d="M110.0,450.0 L125.0,443.5 L140.0,436.9 L155.0,430.4 L170.0,423.8 L185.0,417.3 L200.0,410.7 L215.0,404.2 L230.0,397.6 L245.0,391.1 L260.0,384.6 L275.0,378.0 L290.0,371.5 L305.0,364.9 L320.0,358.4 L335.0,351.8 L350.0,345.3 L365.0,338.7 L380.0,332.2 L395.0,325.7 L410.0,319.1 L425.0,312.6 L440.0,306.0 L455.0,299.5 L470.0,292.9 L485.0,286.4 L500.0,279.8 L515.0,273.3 L530.0,266.7 L545.0,260.2 L560.0,253.7 L575.0,247.1 L590.0,240.6 L605.0,234.0 L620.0,227.5 L635.0,220.9 L650.0,214.4 L665.0,207.8 L680.0,201.3 L695.0,194.8 L710.0,188.2" fill="none" stroke="#e58a80" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="722" y="193.214" font-size="15" fill="#e58a80" text-anchor="start" font-weight="600">2°  →  34.9 cm</text>
<path d="M110.0,450.0 L125.0,446.7 L140.0,443.5 L155.0,440.2 L170.0,436.9 L185.0,433.6 L200.0,430.4 L215.0,427.1 L230.0,423.8 L245.0,420.5 L260.0,417.3 L275.0,414.0 L290.0,410.7 L305.0,407.5 L320.0,404.2 L335.0,400.9 L350.0,397.6 L365.0,394.4 L380.0,391.1 L395.0,387.8 L410.0,384.6 L425.0,381.3 L440.0,378.0 L455.0,374.7 L470.0,371.5 L485.0,368.2 L500.0,364.9 L515.0,361.6 L530.0,358.4 L545.0,355.1 L560.0,351.8 L575.0,348.6 L590.0,345.3 L605.0,342.0 L620.0,338.7 L635.0,335.5 L650.0,332.2 L665.0,328.9 L680.0,325.6 L695.0,322.4 L710.0,319.1" fill="none" stroke="#e0904f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="722" y="324.102" font-size="15" fill="#e0904f" text-anchor="start" font-weight="600">1°  →  17.5 cm</text>
<path d="M110.0,450.0 L125.0,448.4 L140.0,446.7 L155.0,445.1 L170.0,443.5 L185.0,441.8 L200.0,440.2 L215.0,438.5 L230.0,436.9 L245.0,435.3 L260.0,433.6 L275.0,432.0 L290.0,430.4 L305.0,428.7 L320.0,427.1 L335.0,425.5 L350.0,423.8 L365.0,422.2 L380.0,420.5 L395.0,418.9 L410.0,417.3 L425.0,415.6 L440.0,414.0 L455.0,412.4 L470.0,410.7 L485.0,409.1 L500.0,407.5 L515.0,405.8 L530.0,404.2 L545.0,402.5 L560.0,400.9 L575.0,399.3 L590.0,397.6 L605.0,396.0 L620.0,394.4 L635.0,392.7 L650.0,391.1 L665.0,389.5 L680.0,387.8 L695.0,386.2 L710.0,384.6" fill="none" stroke="#e0c169" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="722" y="389.55" font-size="15" fill="#e0c169" text-anchor="start" font-weight="600">0.5°  →  8.7 cm</text>
<circle cx="230" cy="423.82" r="6" fill="#e0904f"/>
<line x1="230" y1="415.82" x2="230" y2="285" stroke="#e0904f" stroke-width="1.5" stroke-linecap="round"/>
<text x="130" y="270" font-size="15" fill="#e0904f" text-anchor="start" font-weight="600">r = 2 m, ε = 1°: 3.49 cm</text>
</svg>
