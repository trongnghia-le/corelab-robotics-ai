<text x="597" y="149" font-size="15" font-weight="600" text-anchor="middle" fill="#e9e7e3">m5</text>
<text x="32" y="268" font-size="17" font-weight="bold" fill="#e9e7e3">deque.popleft(): O(1), chỉ con trỏ đầu di chuyển</text>
