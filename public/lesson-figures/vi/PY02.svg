<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="Inter, sans-serif">
<title>Lấy thông điệp cũ nhất ra: list so với deque (n = 6)</title>
<desc>Sáu thông điệp m0 đến m5. Với list.pop(0) năm phần tử còn lại mỗi cái dịch trái một chỗ; với deque.popleft() chỉ con trỏ đầu tiến lên.</desc>
<rect width="900" height="470" rx="14" fill="#17181b"/>

