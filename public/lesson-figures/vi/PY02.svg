<rect x="32" y="404" width="836" height="48" rx="10" fill="#22252a"/>
<text x="52" y="425" font-size="15" font-weight="600" fill="#e9e7e3">Xả n thông điệp: list tốn n(n − 1)/2 phép dịch phần tử, deque tốn n lần cập nhật con trỏ</text>
<text x="52" y="444" font-size="14" fill="#a7adb5">n = 6: 15 phép dịch so với 6 lần cập nhật.   n = 10,000: 49,995,000 so với 10,000.</text>
