<text x="92" y="177.85714285714283" font-size="14" fill="#a7adb5" text-anchor="end">1e6</text>
<text x="328.0" y="474" font-size="15" fill="#a7adb5" text-anchor="middle">n (số tham số)</text>
<text x="48" y="120" font-size="15" fill="#a7adb5" text-anchor="start">chi phí / một lượt forward</text>
