<text x="316.0" y="293.5086825795729" font-size="14" fill="#a7adb5" text-anchor="end">n = 1000</text>
<rect x="616" y="68" width="252" height="424" rx="8" fill="#22252a" stroke="#3d4148" stroke-width="1.5"/>
<text x="632" y="96" font-size="17" fill="#e9e7e3" text-anchor="start" font-weight="bold">Đếm trên đồ thị</text>
<text x="632" y="122" font-size="14" fill="#a7adb5" text-anchor="start">nơ-ron sigmoid, n đầu vào</text>
<text x="632" y="152" font-size="15" fill="#e9e7e3" text-anchor="start" font-weight="600">n = 1000 tham số:</text>
<text x="632" y="180" font-size="15" fill="#e08db5" text-anchor="start">sai phân HH   2002</text>
<text x="632" y="204" font-size="15" fill="#86abe2" text-anchor="start">forward mode  2001</text>
<text x="632" y="228" font-size="15" fill="#6fc693" text-anchor="start">reverse mode  4.0</text>
<text x="632" y="252" font-size="14" fill="#a7adb5" text-anchor="start">(đơn vị: một lượt forward)</text>
<line x1="632" y1="276" x2="852" y2="276" stroke="#3d4148" stroke-width="1.5" stroke-linecap="round"/>
<text x="632" y="306" font-size="15" fill="#e9e7e3" text-anchor="start" font-weight="600">Trường hợp ngược lại:</text>
<text x="632" y="330" font-size="15" fill="#e9e7e3" text-anchor="start">1 đầu vào, m = 1000</text>
<text x="632" y="352" font-size="15" fill="#e9e7e3" text-anchor="start">đầu ra trong một chuỗi</text>
<text x="632" y="382" font-size="15" fill="#86abe2" text-anchor="start">forward mode  4 000</text>
<text x="632" y="406" font-size="15" fill="#6fc693" text-anchor="start">reverse mode  3 003 000</text>
<text x="632" y="430" font-size="14" fill="#a7adb5" text-anchor="start">flop: một lượt quét cho</text>
<text x="632" y="450" font-size="14" fill="#a7adb5" text-anchor="start">mỗi đầu ra, chuỗi phải</text>
<text x="632" y="470" font-size="14" fill="#a7adb5" text-anchor="start">đi ngược m lần</text>
</svg>
