<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="Inter, sans-serif">
<title>Chi phí của cả gradient: reverse mode không phụ thuộc n</title>
<desc>Đồ thị log-log chi phí gradient của nơ-ron sigmoid n đầu vào, tính theo một lượt forward, cho sai phân hữu hạn, forward mode và reverse mode, kèm số đếm tại n=1000.</desc>
<defs><marker id="mml052" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs>
<rect width="900" height="520" rx="14" fill="#17181b"/>
<text x="32" y="44" font-size="22" fill="#e9e7e3" text-anchor="start" font-weight="bold">Chi phí của cả gradient: reverse mode không phụ thuộc n</text>
<rect x="32" y="68" width="560" height="424" rx="8" fill="#22252a" stroke="#3d4148" stroke-width="1.5"/>
<text x="48" y="96" font-size="17" fill="#e9e7e3" text-anchor="start" font-weight="bold">Chi phí theo số tham số n</text>
