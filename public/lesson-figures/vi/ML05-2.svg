<text x="288.26121535869436" y="362.8922323122447" font-size="15" fill="#86abe2" text-anchor="start">forward mode ≈ 2(n+1)</text>
<text x="360.8782796704626" y="392.19742894308735" font-size="15" fill="#6fc693" text-anchor="start">reverse mode ≈ 4</text>
