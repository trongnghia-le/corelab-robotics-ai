<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420">
<rect width="760" height="420" fill="#191b1f" rx="12"/>
<g font-family="Inter, Arial, sans-serif" fill="#e5e7eb" font-size="14">
<text x="380" y="28" text-anchor="middle" font-size="16" font-weight="bold" style="font-size:14.22px">Tiêu chí bác bỏ được chốt trước khi có dữ liệu</text>
<line x1="330" y1="60" x2="330" y2="335" stroke="#d97936" stroke-width="2" stroke-dasharray="7 5"/>
<text x="330" y="52" text-anchor="middle" fill="#d97936">hiệu ứng tối thiểu = 5 điểm</text>
<text x="345" y="92" font-size="13">Được ủng hộ: cả khoảng từ 5 trở lên</text>
<line x1="390.0" y1="120" x2="530.0" y2="120" stroke="#9ccd4e" stroke-width="4"/>
<line x1="390.0" y1="112" x2="390.0" y2="128" stroke="#9ccd4e" stroke-width="4"/><line x1="530.0" y1="112" x2="530.0" y2="128" stroke="#9ccd4e" stroke-width="4"/>
<circle cx="460.0" cy="120" r="6" fill="#9ccd4e" stroke="#191b1f"/>
<text x="345" y="172" font-size="13" style="font-size:11.15px">Chưa kết luận: khoảng bao quanh 5 (thử nghiệm, n=10)</text>
<line x1="167.0" y1="200" x2="373.0" y2="200" stroke="#53b2dd" stroke-width="4"/>
<line x1="167.0" y1="192" x2="167.0" y2="208" stroke="#53b2dd" stroke-width="4"/><line x1="373.0" y1="192" x2="373.0" y2="208" stroke="#53b2dd" stroke-width="4"/>
<circle cx="270.0" cy="200" r="6" fill="#53b2dd" stroke="#191b1f"/>
<text x="345" y="252" font-size="13">Bị bác bỏ: cả khoảng dưới 5</text>
<line x1="100.0" y1="280" x2="235.0" y2="280" stroke="#e5e7eb" stroke-width="4"/>
<line x1="100.0" y1="272" x2="100.0" y2="288" stroke="#e5e7eb" stroke-width="4"/><line x1="235.0" y1="272" x2="235.0" y2="288" stroke="#e5e7eb" stroke-width="4"/>
<circle cx="167.5" cy="280" r="6" fill="#e5e7eb" stroke="#191b1f"/>
<line x1="80" y1="335" x2="690" y2="335" stroke="#e5e7eb"/>
<line x1="80" y1="335" x2="80" y2="341" stroke="#e5e7eb"/><text x="80" y="360" text-anchor="middle">0</text>
<line x1="180" y1="335" x2="180" y2="341" stroke="#e5e7eb"/><text x="180" y="360" text-anchor="middle">2</text>
<line x1="280" y1="335" x2="280" y2="341" stroke="#e5e7eb"/><text x="280" y="360" text-anchor="middle">4</text>
<line x1="380" y1="335" x2="380" y2="341" stroke="#e5e7eb"/><text x="380" y="360" text-anchor="middle">6</text>
<line x1="480" y1="335" x2="480" y2="341" stroke="#e5e7eb"/><text x="480" y="360" text-anchor="middle">8</text>
<line x1="580" y1="335" x2="580" y2="341" stroke="#e5e7eb"/><text x="580" y="360" text-anchor="middle">10</text>
<line x1="680" y1="335" x2="680" y2="341" stroke="#e5e7eb"/><text x="680" y="360" text-anchor="middle">12</text>
<text x="385" y="384" text-anchor="middle">giảm tỉ lệ thất bại, baseline trừ mới (điểm phần trăm), kèm 95% CI</text>
<text x="385" y="404" text-anchor="middle" font-size="13" fill="#d97936" style="font-size:10.69px">Trường hợp chưa kết luận cũng là kết quả: cho biết cần lên kế hoạch thêm bao nhiêu lần chạy.</text>
</g></svg>