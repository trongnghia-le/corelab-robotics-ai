<text x="170" y="408" font-size="12" fill="#9ccd4e" text-anchor="middle" font-weight="bold">0</text>
<text x="220" y="408" font-size="12" fill="#9ccd4e" text-anchor="middle" font-weight="bold">1</text>
<text x="320" y="408" font-size="12" fill="#9ccd4e" text-anchor="middle" font-weight="bold">2</text>
<text x="360" y="408" font-size="12" fill="#9ccd4e" text-anchor="middle" font-weight="bold">3</text>
<text x="590" y="408" font-size="12" fill="#9ccd4e" text-anchor="middle" font-weight="bold">4</text>
<text x="660" y="408" font-size="12" fill="#9ccd4e" text-anchor="middle" font-weight="bold">5</text>
<text x="710" y="408" font-size="12" fill="#9ccd4e" text-anchor="middle" font-weight="bold">6</text>
<text x="470" y="358" font-size="11" fill="#d97936" text-anchor="middle">ISR: đọc A, B, tra bước, count += step</text>
<text x="470" y="374" font-size="11" fill="#d97936" text-anchor="middle" style="font-size:10.57px">(micro giây; không Serial, không delay)</text>
<text x="380" y="448" font-size="12" fill="#e5e7eb" text-anchor="middle" style="font-size:10.51px">Phần đọc trong loop() phải sao chép count nhiều byte khi tắt ngắt (AVR) để không bao giờ đọc phải giá trị cập nhật dở.</text>
<text x="380" y="466" font-size="12" fill="#e5e7eb" text-anchor="middle">Bước nhảy không hợp lệ xuất hiện khi ISR không theo kịp tốc độ cạnh.</text>
</svg>
