<text x="570" y="94" font-size="12" fill="#9ccd4e" text-anchor="middle">+1</text>
<text x="692" y="152" font-size="12" fill="#9ccd4e" text-anchor="middle">+1</text>
<text x="570" y="212" font-size="12" fill="#9ccd4e" text-anchor="middle">+1</text>
<text x="450" y="152" font-size="12" fill="#9ccd4e" text-anchor="middle">+1</text>
<text x="570" y="134" font-size="11" fill="#53b2dd" text-anchor="middle">-1 (lùi)</text>
<line x1="506" y1="126" x2="634" y2="170" stroke="#d97936" stroke-width="1.5" stroke-dasharray="3 3"/>
<line x1="634" y1="126" x2="506" y2="170" stroke="#d97936" stroke-width="1.5" stroke-dasharray="3 3"/>
<text x="570" y="236" font-size="11" fill="#d97936" text-anchor="middle">đường chéo cam nét đứt: hai bit đổi cùng lúc = bỏ lỡ một cạnh</text>
<text x="24" y="268" font-size="14" fill="#d97936" text-anchor="start" font-weight="bold" style="font-size:12.94px">3  Dòng thời gian ngắt</text>
<rect x="24" y="282" width="712" height="150" rx="8" fill="#191b1f" stroke="#3b414d" stroke-width="1"/>
<text x="30" y="312" font-size="12" fill="#e5e7eb" text-anchor="start" style="font-size:9.36px">vòng lặp chính</text>
<text x="30" y="372" font-size="12" fill="#e5e7eb" text-anchor="start">ISR</text>
<text x="30" y="408" font-size="12" fill="#e5e7eb" text-anchor="start">count</text>
<rect x="130" y="296" width="590" height="26" rx="4" fill="#1a4660" stroke="#53b2dd" stroke-width="1"/>
<text x="455" y="313" font-size="11" fill="#e5e7eb" text-anchor="middle">loop(): in mỗi 100 ms, các tác vụ khác</text>
