<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" font-family="Inter, Arial, sans-serif" role="img">
<title>Dạng sóng quadrature với bộ giải mã bốn trạng thái, và dòng thời gian ngắt</title>
<desc>Trên trái: kênh A và B của encoder quadrature lệch nhau 90 độ, với chuỗi trạng thái 00, 10, 11, 01 khi quay tiến. Trên phải: bốn trạng thái xếp thành vòng với mũi tên tiến, lùi và các bước nhảy chéo không hợp lệ. Dưới: dòng thời gian trong đó vòng lặp chính bị ngắt bởi các thanh ISR ngắn, mỗi ISR đọc A và B rồi cập nhật bộ đếm volatile.</desc>
<rect width="760" height="480" fill="#191b1f" rx="12"/>
<text x="380" y="28" font-size="17" fill="#e5e7eb" text-anchor="middle" font-weight="bold">Cạnh tín hiệu thành ngắt; ngắt phải ngắn</text>
<text x="24" y="58" font-size="14" fill="#53b2dd" text-anchor="start" font-weight="bold" style="font-size:13.17px">1  Quadrature, tiến: A sớm pha hơn B</text>
<text x="24" y="104" font-size="13" fill="#9ccd4e" text-anchor="start" font-weight="bold">A</text>
<path d="M 70 114 L 110 114 L 110 86 L 150 86 L 190 86 L 190 114 L 230 114 L 270 114 L 270 86 L 310 86 L 350 86 L 350 114 L 390 114 " fill="none" stroke="#9ccd4e" stroke-width="2"/>
<text x="24" y="154" font-size="13" fill="#53b2dd" text-anchor="start" font-weight="bold">B</text>
<path d="M 70 164 L 110 164 L 150 164 L 150 136 L 190 136 L 230 136 L 230 164 L 270 164 L 310 164 L 310 136 L 350 136 L 390 136 " fill="none" stroke="#53b2dd" stroke-width="2"/>
<line x1="70" y1="76" x2="70" y2="172" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="2 3"/>
<text x="90" y="190" font-size="13" fill="#d97936" text-anchor="middle" font-weight="bold">00</text>
<line x1="110" y1="76" x2="110" y2="172" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="2 3"/>
<text x="130" y="190" font-size="13" fill="#d97936" text-anchor="middle" font-weight="bold">10</text>
<line x1="150" y1="76" x2="150" y2="172" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="2 3"/>
<text x="170" y="190" font-size="13" fill="#d97936" text-anchor="middle" font-weight="bold">11</text>
<line x1="190" y1="76" x2="190" y2="172" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="2 3"/>
<text x="210" y="190" font-size="13" fill="#d97936" text-anchor="middle" font-weight="bold">01</text>
<line x1="230" y1="76" x2="230" y2="172" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="2 3"/>
<text x="250" y="190" font-size="13" fill="#d97936" text-anchor="middle" font-weight="bold">00</text>
<line x1="270" y1="76" x2="270" y2="172" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="2 3"/>
<text x="290" y="190" font-size="13" fill="#d97936" text-anchor="middle" font-weight="bold">10</text>
<line x1="310" y1="76" x2="310" y2="172" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="2 3"/>
<text x="330" y="190" font-size="13" fill="#d97936" text-anchor="middle" font-weight="bold">11</text>
<line x1="350" y1="76" x2="350" y2="172" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="2 3"/>
<text x="370" y="190" font-size="13" fill="#d97936" text-anchor="middle" font-weight="bold">01</text>
<line x1="390" y1="76" x2="390" y2="172" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="2 3"/>
<text x="24" y="190" font-size="12" fill="#d97936" text-anchor="start">AB</text>
<text x="150.0" y="208" font-size="12" fill="#e5e7eb" text-anchor="middle">mỗi cạnh của A hoặc B là một count (giải mã x4)</text>
<text x="430" y="58" font-size="14" fill="#9ccd4e" text-anchor="start" font-weight="bold" style="font-size:10.92px">2  Vòng trạng thái (A sớm pha hơn B)</text>
<rect x="456" y="94" width="48" height="32" rx="6" fill="#272a2f" stroke="#d97936" stroke-width="2"/>
