<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 530" font-family="Inter, sans-serif">
<title>Phép quay 3D không giao hoán</title>
<desc>Khung x_b y_b z_b sau Rx(90) Rz(90) và sau Rz(90) Rx(90). Ảnh của e1 là (0,0,1) và (0,1,0).</desc>
<defs><marker id="R03ba86abe2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 z" fill="#86abe2"/></marker><marker id="R03ba6fc693" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 z" fill="#6fc693"/></marker><marker id="R03baae9ce6" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 z" fill="#ae9ce6"/></marker></defs>
<rect width="900" height="530" rx="14" fill="#17181b"/>
