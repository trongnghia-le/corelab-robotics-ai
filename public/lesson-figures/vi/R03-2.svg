<text x="753.5" y="405.2" font-size="15" fill="#e0904f" text-anchor="middle" font-weight="600">p′ = (0, 1, 0)</text>
<circle cx="665" cy="330" r="4" fill="#e9e7e3"/>
<text x="52" y="482" font-size="14" fill="#a7adb5" text-anchor="start" font-weight="normal">p = x_a = (1, 0, 0) được đưa tới p′ = x_b</text>
<text x="52" y="506" font-size="14" fill="#a7adb5" text-anchor="start" font-weight="normal">nét liền: khung {b} = các cột của tích; đứt nét xám: các trục thế giới {a}</text>
