<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="Inter, sans-serif">
<title>Lệnh gọi virtual chọn override nào khi đối tượng đang được xây</title>
<desc>Bốn cột cho việc xây và hủy một Lidar: Sensor() thấy generic, Lidar() thấy lidar, ~Lidar() thấy lidar, ~Sensor() thấy generic. Member label của Lidar chỉ tồn tại từ khi khởi tạo xong tới khi ~Lidar kết thúc.</desc>
<defs><marker id="ahCPP042via7adb5" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1 L9 5 L1 9 z" fill="#a7adb5"/></marker></defs>
<rect width="900" height="470" rx="14" fill="#17181b"/>
<text x="32" y="44" font-size="22" fill="#e9e7e3" text-anchor="start" font-weight="bold">Lệnh gọi virtual chọn override nào khi đối tượng đang được xây</text>
<text x="32" y="84" font-size="14" fill="#a7adb5" text-anchor="start">thời gian, từ trái sang phải</text>
<rect x="32" y="100" width="176" height="44" rx="8" fill="#22252a" stroke="#3d4148" stroke-width="1.5"/>
<text x="120.0" y="128" font-size="15" fill="#e9e7e3" text-anchor="middle" font-weight="600" font-family="ui-monospace, Menlo, Consolas, monospace">Sensor()</text>
<line x1="208" y1="122" x2="252" y2="122" stroke="#a7adb5" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ahCPP042via7adb5)"/>
<rect x="252" y="100" width="176" height="44" rx="8" fill="#22252a" stroke="#3d4148" stroke-width="1.5"/>
<text x="340.0" y="128" font-size="15" fill="#e9e7e3" text-anchor="middle" font-weight="600" font-family="ui-monospace, Menlo, Consolas, monospace">Lidar()</text>
<line x1="428" y1="122" x2="472" y2="122" stroke="#a7adb5" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ahCPP042via7adb5)"/>
<rect x="472" y="100" width="176" height="44" rx="8" fill="#22252a" stroke="#3d4148" stroke-width="1.5"/>
<text x="560.0" y="128" font-size="15" fill="#e9e7e3" text-anchor="middle" font-weight="600" font-family="ui-monospace, Menlo, Consolas, monospace">~Lidar()</text>
<line x1="648" y1="122" x2="692" y2="122" stroke="#a7adb5" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ahCPP042via7adb5)"/>
<rect x="692" y="100" width="176" height="44" rx="8" fill="#22252a" stroke="#3d4148" stroke-width="1.5"/>
<text x="780.0" y="128" font-size="15" fill="#e9e7e3" text-anchor="middle" font-weight="600" font-family="ui-monospace, Menlo, Consolas, monospace">~Sensor()</text>
<text x="32" y="186" font-size="17" fill="#e9e7e3" text-anchor="start" font-weight="bold">kiểu động của đối tượng trong lúc gọi</text>
<rect x="32" y="202" width="176" height="70" rx="8" fill="#22252a" stroke="#6fc693" stroke-width="2"/>
<text x="120.0" y="228" font-size="15" fill="#6fc693" text-anchor="middle" font-weight="600" font-family="ui-monospace, Menlo, Consolas, monospace">Sensor::name</text>
<text x="120.0" y="254" font-size="15" fill="#e9e7e3" text-anchor="middle">in generic</text>
<rect x="252" y="202" width="176" height="70" rx="8" fill="#22252a" stroke="#86abe2" stroke-width="2"/>
<text x="340.0" y="228" font-size="15" fill="#86abe2" text-anchor="middle" font-weight="600" font-family="ui-monospace, Menlo, Consolas, monospace">Lidar::name</text>
<text x="340.0" y="254" font-size="15" fill="#e9e7e3" text-anchor="middle">in lidar</text>
<rect x="472" y="202" width="176" height="70" rx="8" fill="#22252a" stroke="#86abe2" stroke-width="2"/>
<text x="560.0" y="228" font-size="15" fill="#86abe2" text-anchor="middle" font-weight="600" font-family="ui-monospace, Menlo, Consolas, monospace">Lidar::name</text>
<text x="560.0" y="254" font-size="15" fill="#e9e7e3" text-anchor="middle">in lidar</text>
<rect x="692" y="202" width="176" height="70" rx="8" fill="#22252a" stroke="#6fc693" stroke-width="2"/>
<text x="780.0" y="228" font-size="15" fill="#6fc693" text-anchor="middle" font-weight="600" font-family="ui-monospace, Menlo, Consolas, monospace">Sensor::name</text>
<text x="780.0" y="254" font-size="15" fill="#e9e7e3" text-anchor="middle">in generic</text>
<text x="32" y="320" font-size="17" fill="#e9e7e3" text-anchor="start" font-weight="bold">member Lidar::label có còn sống không?</text>
<rect x="32" y="336" width="176" height="44" rx="8" fill="none" stroke="#a7adb5" stroke-width="2" stroke-dasharray="6 4"/>
<text x="120" y="364" font-size="15" fill="#a7adb5" text-anchor="middle">chưa được xây</text>
<rect x="252" y="336" width="396" height="44" rx="8" fill="#22252a" stroke="#6fc693" stroke-width="2"/>
<text x="450" y="364" font-size="15" fill="#6fc693" text-anchor="middle" font-weight="600">còn sống: thân Lidar() và thân ~Lidar()</text>
<rect x="692" y="336" width="176" height="44" rx="8" fill="none" stroke="#a7adb5" stroke-width="2" stroke-dasharray="6 4"/>
<text x="780" y="364" font-size="15" fill="#a7adb5" text-anchor="middle">đã bị hủy</text>
<text x="32" y="420" font-size="14" fill="#a7adb5" text-anchor="start">Lệnh gọi trong Sensor() hoặc ~Sensor() không thể tới Lidar::name: member dữ liệu của nó không còn sống ([class.cdtor]).</text>
<text x="32" y="442" font-size="14" fill="#a7adb5" text-anchor="start">Cách sửa: truyền dữ liệu xuống qua đối số constructor.</text>
</svg>
