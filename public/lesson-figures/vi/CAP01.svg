<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="Inter, Arial, sans-serif" role="img">
<title>CAP01: đặc tả, mô hình và ba bộ động học khớp nhau</title>
<desc>Bảng đặc tả cấp dữ liệu cho thế giới và mô hình robot có seed. FK của bạn, mô hình MJCF trong MuJoCo và URDF phải khớp trong 1 mm, và các test nghiệm thu kiểm tra tính xác định, ổn định khi nghỉ và khả năng với tới.</desc>
<rect width="900" height="470" fill="#191b1f" rx="12"/>
<text x="450" y="28" font-size="18" fill="#e5e7eb" text-anchor="middle" font-weight="bold">CAP01: đặc tả đo được vào, ba bộ động học phải khớp nhau ra</text>
<rect x="30" y="60" width="230" height="90" rx="8" fill="#272a2f" stroke="#ae9bea" stroke-width="2"/>
<text x="145.0" y="94.2" font-size="12" fill="#e5e7eb" text-anchor="middle" font-weight="bold">SPEC.md</text>
<text x="145.0" y="109.2" font-size="12" fill="#e5e7eb" text-anchor="middle">SR1..SR10: chỉ số,</text>
<text x="145.0" y="124.2" font-size="12" fill="#e5e7eb" text-anchor="middle">ngưỡng, tên test</text>
<rect x="335" y="60" width="230" height="90" rx="8" fill="#272a2f" stroke="#53b2dd" stroke-width="2"/>
<text x="450.0" y="94.2" font-size="12" fill="#e5e7eb" text-anchor="middle" font-weight="bold">Env có seed</text>
<text x="450.0" y="109.2" font-size="12" fill="#e5e7eb" text-anchor="middle">reset(seed), step()</text>
<text x="450.0" y="124.2" font-size="12" fill="#e5e7eb" text-anchor="middle">np.random.default_rng</text>
<rect x="640" y="60" width="230" height="90" rx="8" fill="#272a2f" stroke="#9ccd4e" stroke-width="2"/>
<text x="755.0" y="94.2" font-size="12" fill="#e5e7eb" text-anchor="middle" font-weight="bold">Test nghiệm thu</text>
<text x="755.0" y="109.2" font-size="12" fill="#e5e7eb" text-anchor="middle">pytest tests/acceptance</text>
<text x="755.0" y="124.2" font-size="12" fill="#e5e7eb" text-anchor="middle">đọc kết quả</text>
<line x1="260" y1="105" x2="335" y2="105" stroke="#e5e7eb" stroke-width="2"/>
<polygon points="335,105 326.0,108.5 326.0,101.5" fill="#e5e7eb"/>
<line x1="565" y1="105" x2="640" y2="105" stroke="#e5e7eb" stroke-width="2"/>
<polygon points="640,105 631.0,108.5 631.0,101.5" fill="#e5e7eb"/>
<rect x="30" y="210" width="230" height="90" rx="8" fill="#272a2f" stroke="#d97936" stroke-width="2"/>
<text x="145.0" y="244.2" font-size="12" fill="#e5e7eb" text-anchor="middle" font-weight="bold" style="font-size:9.36px">FK của bạn</text>
<text x="145.0" y="259.2" font-size="12" fill="#e5e7eb" text-anchor="middle">manipulation/</text>
<text x="145.0" y="274.2" font-size="12" fill="#e5e7eb" text-anchor="middle">kinematics.py</text>
<rect x="335" y="210" width="230" height="90" rx="8" fill="#272a2f" stroke="#d97936" stroke-width="2"/>
<text x="450.0" y="244.2" font-size="12" fill="#e5e7eb" text-anchor="middle" font-weight="bold" style="font-size:10.55px">MJCF trong MuJoCo</text>
<text x="450.0" y="259.2" font-size="12" fill="#e5e7eb" text-anchor="middle">corebot.xml</text>
<text x="450.0" y="274.2" font-size="12" fill="#e5e7eb" text-anchor="middle">vị trí site</text>
<rect x="640" y="210" width="230" height="90" rx="8" fill="#272a2f" stroke="#d97936" stroke-width="2"/>
<text x="755.0" y="244.2" font-size="12" fill="#e5e7eb" text-anchor="middle" font-weight="bold">URDF</text>
<text x="755.0" y="259.2" font-size="12" fill="#e5e7eb" text-anchor="middle">corebot.urdf</text>
<text x="755.0" y="274.2" font-size="12" fill="#e5e7eb" text-anchor="middle">yourdfpy / pinocchio</text>
<line x1="145" y1="300" x2="145" y2="345" stroke="#d97936" stroke-width="2"/>
<polygon points="145,345 141.5,336.0 148.5,336.0" fill="#d97936"/>
<line x1="450" y1="300" x2="450" y2="345" stroke="#d97936" stroke-width="2"/>
<polygon points="450,345 446.5,336.0 453.5,336.0" fill="#d97936"/>
<line x1="755" y1="300" x2="755" y2="345" stroke="#d97936" stroke-width="2"/>
<polygon points="755,345 751.5,336.0 758.5,336.0" fill="#d97936"/>
<rect x="30" y="345" width="840" height="50" rx="8" fill="#272a2f" stroke="#e5e7eb" stroke-width="2"/>
<text x="450.0" y="374.6" font-size="13" fill="#e5e7eb" text-anchor="middle" font-weight="bold">max |p_FK - p_MuJoCo| &lt; 1 mm  và  |p_URDF - p_MJCF| &lt; 1 mm  (20 cấu hình ngẫu nhiên)</text>
<text x="450" y="425" font-size="13" fill="#ddb242" text-anchor="middle" style="font-size:11.84px">Cũng kiểm tra: cùng tên và giới hạn khớp, khối lượng sai lệch dưới 2 %, trôi khi nghỉ 5 s, 95 % điểm trên bàn với tới được</text>
<text x="450" y="448" font-size="13" fill="#ddb242" text-anchor="middle">Kiểm tra cổng (in đậm trong bài): tính xác định và động học thuận</text>
<line x1="450" y1="150" x2="450" y2="210" stroke="#e5e7eb" stroke-width="2" stroke-dasharray="5 4"/>
<polygon points="450,210 446.5,201.0 453.5,201.0" fill="#e5e7eb"/>
</svg>
