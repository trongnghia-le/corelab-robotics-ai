<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" font-family="Inter, Arial, sans-serif" role="img">
<title>delay() bỏ đói tác vụ thứ hai; millis() cho cả hai chạy; máy trạng thái nút 3 trạng thái</title>
<desc>Trên trái: dòng thời gian trong đó hai lệnh delay(500) giữ loop() ngủ nên lần nhấn nút 300 ms không bao giờ được thấy. Dưới trái: vòng lặp millis() chạy nhiều lượt mỗi mili giây, đảo LED ở 500 ms và 1000 ms và thấy lần nhấn ngay. Phải: máy trạng thái IDLE, PRESSED, HELD cùng các chuyển tiếp.</desc>
