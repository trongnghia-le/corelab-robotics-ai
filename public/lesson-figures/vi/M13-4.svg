<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="Inter, sans-serif">
<title>Giá của một cận là độ dốc của đường chi phí</title>
<desc>Đồ thị nỗ lực tối ưu p* theo cận của thruster 1: giảm với độ dốc trừ 1.5 tại cận 2, đường giá nét đứt nằm dưới đường cong, và đường cong phẳng từ cận 3.</desc>
<rect width="900" height="520" rx="14" fill="#17181b"/>

<text x="32" y="44" font-size="22" font-weight="bold" fill="#e9e7e3">Giá của một cận là độ dốc của đường chi phí</text>
<rect x="32" y="72" width="564" height="424" rx="10" fill="#22252a"/>
<rect x="620" y="72" width="248" height="424" rx="10" fill="#22252a"/>
<text x="52" y="102" font-size="17" font-weight="bold" fill="#e9e7e3">Nỗ lực tối ưu theo cận ū₁ (Trường hợp 1)</text>
<text x="640" y="102" font-size="17" font-weight="bold" fill="#e9e7e3">Cách đọc đường cong</text>
<line x1="100" y1="150" x2="100.0" y2="440.0" stroke="#3d4148" stroke-width="1"/>
<text x="100" y="460" font-size="14" text-anchor="middle" fill="#a7adb5">0</text>
<line x1="210" y1="150" x2="210.0" y2="440.0" stroke="#3d4148" stroke-width="1"/>
<text x="210" y="460" font-size="14" text-anchor="middle" fill="#a7adb5">1</text>
<line x1="320" y1="150" x2="320.0" y2="440.0" stroke="#3d4148" stroke-width="1"/>
<text x="320" y="460" font-size="14" text-anchor="middle" fill="#a7adb5">2</text>
<line x1="430" y1="150" x2="430.0" y2="440.0" stroke="#3d4148" stroke-width="1"/>
<text x="430" y="460" font-size="14" text-anchor="middle" fill="#a7adb5">3</text>
<line x1="540" y1="150" x2="540.0" y2="440.0" stroke="#3d4148" stroke-width="1"/>
<text x="540" y="460" font-size="14" text-anchor="middle" fill="#a7adb5">4</text>
<line x1="100" y1="411" x2="540.0" y2="411.0" stroke="#3d4148" stroke-width="1"/>
<text x="92" y="416" font-size="14" text-anchor="end" fill="#a7adb5">12</text>
<line x1="100" y1="353" x2="540.0" y2="353.0" stroke="#3d4148" stroke-width="1"/>
<text x="92" y="358" font-size="14" text-anchor="end" fill="#a7adb5">14</text>
<line x1="100" y1="295" x2="540.0" y2="295.0" stroke="#3d4148" stroke-width="1"/>
<text x="92" y="300" font-size="14" text-anchor="end" fill="#a7adb5">16</text>
<line x1="100" y1="237" x2="540.0" y2="237.0" stroke="#3d4148" stroke-width="1"/>
<text x="92" y="242" font-size="14" text-anchor="end" fill="#a7adb5">18</text>
<line x1="100" y1="179" x2="540.0" y2="179.0" stroke="#3d4148" stroke-width="1"/>
<text x="92" y="184" font-size="14" text-anchor="end" fill="#a7adb5">20</text>
<line x1="100" y1="440" x2="540.0" y2="440.0" stroke="#a7adb5" stroke-width="1.5"/>
<line x1="100" y1="150" x2="100.0" y2="440.0" stroke="#a7adb5" stroke-width="1.5"/>
<text x="540" y="482" font-size="15" text-anchor="end" fill="#e9e7e3">cận ū₁</text>
<text x="100" y="138" font-size="15" fill="#e9e7e3">nỗ lực tối ưu p*(ū₁)</text>
<polyline points="100.0,171.8 105.5,178.2 111.0,184.6 116.5,190.8 122.0,197.0 127.5,203.0 133.0,208.9 138.5,214.8 144.0,220.5 149.5,226.1 155.0,231.6 160.5,236.9 166.0,242.2 171.5,247.4 177.0,252.4 182.5,257.4 188.0,262.2 193.5,267.0 199.0,271.6 204.5,276.1 210.0,280.5 215.5,284.8 221.0,289.0 226.5,293.1 232.0,297.0 237.5,300.9 243.0,304.6 248.5,308.3 254.0,311.8 259.5,315.2 265.0,318.6 270.5,321.8 276.0,324.9 281.5,327.9 287.0,330.7 292.5,333.5 298.0,336.2 303.5,338.7 309.0,341.2 314.5,343.5 320.0,345.8 325.5,347.9 331.0,349.9 336.5,351.8 342.0,353.6 347.5,355.3 353.0,356.8 358.5,358.3 364.0,359.7 369.5,360.9 375.0,362.1 380.5,363.1 386.0,364.0 391.5,364.8 397.0,365.5 402.5,366.1 408.0,366.6 413.5,367.0 419.0,367.3 424.5,367.4 430.0,367.5 435.5,367.5 441.0,367.5 446.5,367.5 452.0,367.5 457.5,367.5 463.0,367.5 468.5,367.5 474.0,367.5 479.5,367.5 485.0,367.5 490.5,367.5 496.0,367.5 501.5,367.5 507.0,367.5 512.5,367.5 518.0,367.5 523.5,367.5 529.0,367.5 534.5,367.5 540.0,367.5" fill="none" stroke="#86abe2" stroke-width="3" stroke-linejoin="round"/>
<polyline points="210.0,302.2 452.0,398.0" fill="none" stroke="#e0904f" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="7 5"/>
<circle cx="320.0" cy="345.8" r="6" fill="#e0904f"/>
<circle cx="375.0" cy="362.1" r="5" fill="#86abe2"/>
<circle cx="375.0" cy="367.5" r="5" fill="#17181b" stroke="#e0904f" stroke-width="2"/>
<circle cx="430.0" cy="367.5" r="5" fill="#e9e7e3"/>
<text x="310" y="371.9" font-size="15" font-weight="600" text-anchor="end" fill="#e0904f">ū₁ = 2: 14.25</text>
<text x="387" y="348.1" font-size="15" font-weight="600" fill="#86abe2">chính xác 13.6875</text>
<text x="413.5" y="405.2" font-size="15" font-weight="600" text-anchor="end" fill="#e0904f">đường giá</text>
<text x="413.5" y="425.2" font-size="15" font-weight="600" text-anchor="end" fill="#e0904f">độ dốc −1.5</text>
<text x="463" y="391.5" font-size="15" fill="#e9e7e3">μ₁ = 0</text>
<text x="463" y="411.5" font-size="15" fill="#e9e7e3">khi ū₁ ≥ 3</text>
<text x="640" y="142" font-size="15" fill="#e9e7e3">p*(ū₁) = ½[ū₁² + (9 − ū₁)²/2]</text>
<text x="640" y="164" font-size="14" fill="#a7adb5">khi ū₁ ≤ 3, và 13.5 khi ū₁ ≥ 3</text>
<text x="640" y="186" font-size="15" fill="#e9e7e3">μ₁(ū₁) = (9 − 3ū₁)/2</text>
<text x="640" y="208" font-size="15" fill="#e9e7e3">μ₁(2) = 1.5, μ₁(2.5) = 0.75</text>
<text x="640" y="290" font-size="15" font-weight="600" fill="#e9e7e3">Nâng ū₁ từ 2 lên 2.5:</text>
<text x="640" y="314" font-size="15" font-weight="600" fill="#e9e7e3">đường giá tiết kiệm 0.75,</text>
<text x="640" y="338" font-size="15" font-weight="600" fill="#e9e7e3">tiết kiệm thật 0.5625</text>
<text x="640" y="362" font-size="14" fill="#a7adb5">(đường cong phẳng dần, Bài 7)</text>
</svg>
