<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 580" font-family="Inter, sans-serif">
<title>Thông điệp giữa caller, generator ngoài và coroutine trong</title>
<desc>Sơ đồ tuần tự: next, send 10 và send 5 được wrapper chuyển tiếp cho acc và trả về 0, 10 và 15; send None làm acc return 15, trở thành t trong wrapper, và wrapper yield sum=15.</desc>
<rect width="900" height="580" rx="14" fill="#17181b"/>

<text x="32" y="44" font-size="22" font-weight="bold" fill="#e9e7e3">send và yield from: ai nói chuyện với ai</text>
<rect x="32" y="72" width="836" height="484" rx="10" fill="#22252a"/>
<text x="140" y="104" font-size="17" font-weight="bold" text-anchor="middle" fill="#86abe2">caller</text>
<line x1="140" y1="116" x2="140.0" y2="540.0" stroke="#3d4148" stroke-width="1.5" stroke-dasharray="4 4"/>
<text x="450" y="104" font-size="17" font-weight="bold" text-anchor="middle" fill="#ae9ce6">wrapper (generator ngoài)</text>
<line x1="450" y1="116" x2="450.0" y2="540.0" stroke="#3d4148" stroke-width="1.5" stroke-dasharray="4 4"/>
<text x="760" y="104" font-size="17" font-weight="bold" text-anchor="middle" fill="#6cc6ba">acc (coroutine trong)</text>
<line x1="760" y1="116" x2="760.0" y2="540.0" stroke="#3d4148" stroke-width="1.5" stroke-dasharray="4 4"/>
<line x1="146" y1="150" x2="433.0" y2="150.0" stroke="#86abe2" stroke-width="2"/>
<polygon points="444.0,150.0 433.0,155.5 433.0,144.5" fill="#86abe2"/>
<text x="295" y="140" font-size="15" font-weight="600" text-anchor="middle" fill="#e9e7e3">next(g)</text>
<line x1="456" y1="150" x2="743.0" y2="150.0" stroke="#ae9ce6" stroke-width="2"/>
<polygon points="754.0,150.0 743.0,155.5 743.0,144.5" fill="#ae9ce6"/>
<text x="605" y="140" font-size="15" text-anchor="middle" fill="#a7adb5">chuyển tiếp</text>
<line x1="754" y1="186" x2="467.0" y2="186.0" stroke="#6cc6ba" stroke-width="2" stroke-dasharray="6 4"/>
<polygon points="456.0,186.0 467.0,180.5 467.0,191.5" fill="#6cc6ba"/>
<text x="605" y="178" font-size="15" text-anchor="middle" fill="#e9e7e3">yield total = 0</text>
<line x1="444" y1="186" x2="157.0" y2="186.0" stroke="#6cc6ba" stroke-width="2" stroke-dasharray="6 4"/>
<polygon points="146.0,186.0 157.0,180.5 157.0,191.5" fill="#6cc6ba"/>
<text x="295" y="178" font-size="15" font-weight="600" text-anchor="middle" fill="#e9e7e3">0</text>
<line x1="146" y1="250" x2="433.0" y2="250.0" stroke="#86abe2" stroke-width="2"/>
<polygon points="444.0,250.0 433.0,255.5 433.0,244.5" fill="#86abe2"/>
<text x="295" y="240" font-size="15" font-weight="600" text-anchor="middle" fill="#e9e7e3">g.send(10)</text>
<line x1="456" y1="250" x2="743.0" y2="250.0" stroke="#ae9ce6" stroke-width="2"/>
<polygon points="754.0,250.0 743.0,255.5 743.0,244.5" fill="#ae9ce6"/>
<text x="605" y="240" font-size="15" text-anchor="middle" fill="#a7adb5">chuyển tiếp</text>
<line x1="754" y1="286" x2="467.0" y2="286.0" stroke="#6cc6ba" stroke-width="2" stroke-dasharray="6 4"/>
<polygon points="456.0,286.0 467.0,280.5 467.0,291.5" fill="#6cc6ba"/>
<text x="605" y="278" font-size="15" text-anchor="middle" fill="#e9e7e3">yield total = 10</text>
<line x1="444" y1="286" x2="157.0" y2="286.0" stroke="#6cc6ba" stroke-width="2" stroke-dasharray="6 4"/>
<polygon points="146.0,286.0 157.0,280.5 157.0,291.5" fill="#6cc6ba"/>
<text x="295" y="278" font-size="15" font-weight="600" text-anchor="middle" fill="#e9e7e3">10</text>
<line x1="146" y1="350" x2="433.0" y2="350.0" stroke="#86abe2" stroke-width="2"/>
<polygon points="444.0,350.0 433.0,355.5 433.0,344.5" fill="#86abe2"/>
<text x="295" y="340" font-size="15" font-weight="600" text-anchor="middle" fill="#e9e7e3">g.send(5)</text>
<line x1="456" y1="350" x2="743.0" y2="350.0" stroke="#ae9ce6" stroke-width="2"/>
<polygon points="754.0,350.0 743.0,355.5 743.0,344.5" fill="#ae9ce6"/>
<text x="605" y="340" font-size="15" text-anchor="middle" fill="#a7adb5">chuyển tiếp</text>
<line x1="754" y1="386" x2="467.0" y2="386.0" stroke="#6cc6ba" stroke-width="2" stroke-dasharray="6 4"/>
<polygon points="456.0,386.0 467.0,380.5 467.0,391.5" fill="#6cc6ba"/>
<text x="605" y="378" font-size="15" text-anchor="middle" fill="#e9e7e3">yield total = 15</text>
<line x1="444" y1="386" x2="157.0" y2="386.0" stroke="#6cc6ba" stroke-width="2" stroke-dasharray="6 4"/>
<polygon points="146.0,386.0 157.0,380.5 157.0,391.5" fill="#6cc6ba"/>
<text x="295" y="378" font-size="15" font-weight="600" text-anchor="middle" fill="#e9e7e3">15</text>
<line x1="146" y1="450" x2="433.0" y2="450.0" stroke="#86abe2" stroke-width="2"/>
<polygon points="444.0,450.0 433.0,455.5 433.0,444.5" fill="#86abe2"/>
<text x="295" y="440" font-size="15" font-weight="600" text-anchor="middle" fill="#e9e7e3">g.send(None)</text>
<line x1="456" y1="450" x2="743.0" y2="450.0" stroke="#ae9ce6" stroke-width="2"/>
<polygon points="754.0,450.0 743.0,455.5 743.0,444.5" fill="#ae9ce6"/>
<text x="605" y="440" font-size="15" text-anchor="middle" fill="#a7adb5">chuyển tiếp</text>
<line x1="754" y1="486" x2="467.0" y2="486.0" stroke="#6cc6ba" stroke-width="2" stroke-dasharray="6 4"/>
<polygon points="456.0,486.0 467.0,480.5 467.0,491.5" fill="#6cc6ba"/>
<text x="605" y="478" font-size="15" text-anchor="middle" fill="#e9e7e3">return total = 15</text>
<text x="462" y="510" font-size="15" font-weight="600" fill="#e08db5">StopIteration(15): t = 15</text>
<line x1="444" y1="530" x2="157.0" y2="530.0" stroke="#6cc6ba" stroke-width="2" stroke-dasharray="6 4"/>
<polygon points="146.0,530.0 157.0,524.5 157.0,535.5" fill="#6cc6ba"/>
<text x="295" y="522" font-size="15" font-weight="600" text-anchor="middle" fill="#e9e7e3">'sum=15'</text>
</svg>
