<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="Inter, sans-serif">
<title>Sai số toàn cục của Euler (bậc 1) và RK4 (bậc 4)</title>
<desc>Đồ thị log-log sai số toàn cục tại t bằng 1 của Euler và RK4 cho x' bằng trừ x, với ước lượng sắc nét và cận đã chứng minh, cùng bảng cho h bằng 0.1, 0.05, 0.025.</desc>
<rect width="900" height="520" rx="14" fill="#17181b"/>

<text x="32" y="44" font-size="22" font-weight="bold" fill="#e9e7e3">Sai số toàn cục của Euler (bậc 1) và RK4 (bậc 4)</text>
<rect x="32" y="72" width="520" height="424" rx="10" fill="#22252a"/>
<rect x="576" y="72" width="292" height="424" rx="10" fill="#22252a"/>
<text x="52" y="100" font-size="17" font-weight="bold" fill="#e9e7e3">x' = −x, x(0) = 1, sai số tại t = 1</text>
<line x1="120" y1="435" x2="120.0" y2="440.0" stroke="#a7adb5" stroke-width="1.5"/>
<text x="120" y="460" font-size="14" text-anchor="middle" fill="#a7adb5">0.01</text>
<line x1="230.5" y1="435" x2="230.5" y2="440.0" stroke="#a7adb5" stroke-width="1.5"/>
<text x="230.5" y="460" font-size="14" text-anchor="middle" fill="#a7adb5">0.025</text>
<line x1="314" y1="435" x2="314.0" y2="440.0" stroke="#a7adb5" stroke-width="1.5"/>
<text x="314" y="460" font-size="14" text-anchor="middle" fill="#a7adb5">0.05</text>
<line x1="397.6" y1="435" x2="397.6" y2="440.0" stroke="#a7adb5" stroke-width="1.5"/>
<text x="397.6" y="460" font-size="14" text-anchor="middle" fill="#a7adb5">0.1</text>
<line x1="481.1" y1="435" x2="481.1" y2="440.0" stroke="#a7adb5" stroke-width="1.5"/>
<text x="481.1" y="460" font-size="14" text-anchor="middle" fill="#a7adb5">0.2</text>
<line x1="120" y1="140" x2="125.0" y2="140.0" stroke="#a7adb5" stroke-width="1.5"/>
<text x="112" y="145" font-size="14" text-anchor="end" fill="#a7adb5">1</text>
<line x1="120" y1="200" x2="125.0" y2="200.0" stroke="#a7adb5" stroke-width="1.5"/>
<text x="112" y="205" font-size="14" text-anchor="end" fill="#a7adb5">10⁻²</text>
<line x1="120" y1="260" x2="125.0" y2="260.0" stroke="#a7adb5" stroke-width="1.5"/>
<text x="112" y="265" font-size="14" text-anchor="end" fill="#a7adb5">10⁻⁴</text>
<line x1="120" y1="320" x2="125.0" y2="320.0" stroke="#a7adb5" stroke-width="1.5"/>
<text x="112" y="325" font-size="14" text-anchor="end" fill="#a7adb5">10⁻⁶</text>
<line x1="120" y1="380" x2="125.0" y2="380.0" stroke="#a7adb5" stroke-width="1.5"/>
<text x="112" y="385" font-size="14" text-anchor="end" fill="#a7adb5">10⁻⁸</text>
<line x1="120" y1="440" x2="125.0" y2="440.0" stroke="#a7adb5" stroke-width="1.5"/>
<text x="112" y="445" font-size="14" text-anchor="end" fill="#a7adb5">10⁻¹⁰</text>
<line x1="120" y1="440" x2="530.0" y2="440.0" stroke="#a7adb5" stroke-width="1.5"/>
<line x1="120" y1="140" x2="120.0" y2="440.0" stroke="#a7adb5" stroke-width="1.5"/>
<text x="530" y="482" font-size="15" text-anchor="end" fill="#e9e7e3">bước h (s)</text>
<text x="120" y="128" font-size="15" fill="#e9e7e3">|sai số tại t = 1|</text>
<polyline points="146.9,199.1 481.1,162.9" fill="none" stroke="#e0c169" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 4"/>
<polyline points="146.9,219.2 481.1,183.0" fill="none" stroke="#6cc6ba" stroke-width="2" stroke-linejoin="round" stroke-dasharray="2 4"/>
<polyline points="481.1,181.9 397.6,191.5 314.0,200.8 230.5,210.0 146.9,219.1" fill="none" stroke="#e0904f" stroke-width="2.5" stroke-linejoin="round"/>
<polyline points="481.1,297.1 397.6,334.3 314.0,371.0 230.5,407.4 146.9,443.6" fill="none" stroke="#86abe2" stroke-width="2.5" stroke-linejoin="round"/>
<circle cx="481.1" cy="181.9" r="4.5" fill="#e0904f"/>
<circle cx="397.6" cy="191.5" r="4.5" fill="#e0904f"/>
<circle cx="314.0" cy="200.8" r="4.5" fill="#e0904f"/>
<circle cx="230.5" cy="210.0" r="4.5" fill="#e0904f"/>
<circle cx="146.9" cy="219.1" r="4.5" fill="#e0904f"/>
<circle cx="481.1" cy="297.1" r="4.5" fill="#86abe2"/>
<circle cx="397.6" cy="334.3" r="4.5" fill="#86abe2"/>
<circle cx="314.0" cy="371.0" r="4.5" fill="#86abe2"/>
<circle cx="230.5" cy="407.4" r="4.5" fill="#86abe2"/>
<circle cx="146.9" cy="443.6" r="4.5" fill="#86abe2"/>
<circle cx="397.6" cy="172.0" r="5" fill="#e0c169"/>
<text x="389.6" y="160" font-size="14" text-anchor="end" fill="#e0c169">0.0859</text>
<text x="405.6" y="215.5" font-size="14" fill="#e0904f">0.0192</text>
<text x="405.6" y="360.3" font-size="14" fill="#86abe2">3.3e-07</text>
<text x="154.9" y="259.2" font-size="15" font-weight="600" fill="#e0904f">độ dốc 1</text>
<text x="166.9" y="320" font-size="15" font-weight="600" fill="#86abe2">độ dốc 4</text>
<text x="598" y="100" font-size="17" font-weight="bold" fill="#e9e7e3">h = 0.1, 0.05, 0.025</text>
<text x="598" y="130" font-size="14" fill="#a7adb5">h</text>
<text x="654" y="130" font-size="14" fill="#a7adb5">sai số</text>
<text x="726" y="130" font-size="14" fill="#a7adb5">tỉ số</text>
<text x="794" y="130" font-size="14" fill="#a7adb5">cận</text>
<line x1="598" y1="140" x2="854.0" y2="140.0" stroke="#3d4148" stroke-width="1"/>
<text x="598" y="168" font-size="15" font-weight="600" fill="#e9e7e3">0.1</text>
<text x="708" y="168" font-size="15" text-anchor="end" fill="#e9e7e3">0.0192</text>
<text x="762" y="168" font-size="15" text-anchor="end" fill="#e9e7e3">–</text>
<text x="848" y="168" font-size="15" text-anchor="end" fill="#e0c169">0.0859</text>
<text x="598" y="196" font-size="15" font-weight="600" fill="#e9e7e3">0.05</text>
<text x="708" y="196" font-size="15" text-anchor="end" fill="#e9e7e3">0.0094</text>
<text x="762" y="196" font-size="15" text-anchor="end" fill="#e9e7e3">2.04</text>
<text x="848" y="196" font-size="15" text-anchor="end" fill="#e0c169">0.0430</text>
<text x="598" y="224" font-size="15" font-weight="600" fill="#e9e7e3">0.025</text>
<text x="708" y="224" font-size="15" text-anchor="end" fill="#e9e7e3">0.0046</text>
<text x="762" y="224" font-size="15" text-anchor="end" fill="#e9e7e3">2.02</text>
<text x="848" y="224" font-size="15" text-anchor="end" fill="#e0c169">0.0215</text>
<line x1="598" y1="258" x2="854.0" y2="258.0" stroke="#3d4148" stroke-width="1"/>
<text x="598" y="288" font-size="15" font-weight="600" fill="#e0904f">Giảm nửa h: sai số Euler giảm nửa</text>
<text x="598" y="310" font-size="14" fill="#a7adb5">(tỉ số 2.04, 2.02); RK4 giảm 16 lần.</text>
<line x1="598" y1="332" x2="854.0" y2="332.0" stroke="#3d4148" stroke-width="1"/>
<line x1="598" y1="359" x2="628.0" y2="359.0" stroke="#e0c169" stroke-width="2.5" stroke-dasharray="6 4"/>
<text x="638" y="364" font-size="15" fill="#e9e7e3">cận đã chứng minh (h/2)(e − 1)</text>
<line x1="598" y1="389" x2="628.0" y2="389.0" stroke="#6cc6ba" stroke-width="2.5" stroke-dasharray="2 4"/>
<text x="638" y="394" font-size="15" fill="#e9e7e3">Euler, ước lượng (h/2)e⁻¹</text>
<line x1="598" y1="419" x2="628.0" y2="419.0" stroke="#e0904f" stroke-width="2.5"/>
<text x="638" y="424" font-size="15" fill="#e9e7e3">Euler, sai số chính xác</text>
<line x1="598" y1="449" x2="628.0" y2="449.0" stroke="#86abe2" stroke-width="2.5"/>
<text x="638" y="454" font-size="15" fill="#e9e7e3">RK4</text>
</svg>
