<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="Inter, sans-serif">
<title>Kiểu quyết định số học và chỉ số hợp lệ</title>
<desc>Trái: vector ba số double trong bộ nhớ, ô sau phần tử cuối được đánh dấu là ngoài vector; phải: ba phép chia và kiểu mà mỗi phép dùng.</desc>
<rect width="900" height="420" rx="14" fill="#17181b"/>
<defs><marker id="c01-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs>
<text x="32" y="44" font-size="22" fill="#e9e7e3" font-weight="700">Kiểu quyết định số học và chỉ số hợp lệ</text>
<rect x="32" y="72" width="420" height="316" rx="10" fill="#22252a" stroke="#3d4148" stroke-width="1.5"/>
<rect x="476" y="72" width="392" height="316" rx="10" fill="#22252a" stroke="#3d4148" stroke-width="1.5"/>
<text x="52" y="104" font-size="17" fill="#e9e7e3" font-weight="700">std::vector&lt;double&gt; v{2.0, 4.0, 6.0}</text>
<text x="496" y="104" font-size="17" fill="#e9e7e3" font-weight="700">Phép chia theo kiểu của toán hạng</text>
<rect x="52" y="150" width="88" height="56" rx="0" fill="none" stroke="#86abe2" stroke-width="2"/>
<text x="96" y="184" font-size="15" fill="#e9e7e3" font-weight="600" text-anchor="middle">2.0</text>
<text x="96" y="140" font-size="14" fill="#a7adb5" text-anchor="middle">+0 B</text>
<text x="96" y="230" font-size="15" fill="#86abe2" text-anchor="middle">v[0]</text>
<rect x="140" y="150" width="88" height="56" rx="0" fill="none" stroke="#86abe2" stroke-width="2"/>
<text x="184" y="184" font-size="15" fill="#e9e7e3" font-weight="600" text-anchor="middle">4.0</text>
<text x="184" y="140" font-size="14" fill="#a7adb5" text-anchor="middle">+8 B</text>
<text x="184" y="230" font-size="15" fill="#86abe2" text-anchor="middle">v[1]</text>
<rect x="228" y="150" width="88" height="56" rx="0" fill="none" stroke="#86abe2" stroke-width="2"/>
<text x="272" y="184" font-size="15" fill="#e9e7e3" font-weight="600" text-anchor="middle">6.0</text>
<text x="272" y="140" font-size="14" fill="#a7adb5" text-anchor="middle">+16 B</text>
<text x="272" y="230" font-size="15" fill="#86abe2" text-anchor="middle">v[2]</text>
<rect x="316" y="150" width="88" height="56" rx="0" fill="none" stroke="#e58a80" stroke-width="2" stroke-dasharray="6 4"/>
<text x="360" y="184" font-size="15" fill="#e58a80" font-weight="600" text-anchor="middle">?</text>
<text x="360" y="140" font-size="14" fill="#a7adb5" text-anchor="middle">+24 B</text>
<text x="360" y="230" font-size="15" fill="#e58a80" text-anchor="middle">v[3]</text>
<text x="360" y="250" font-size="14" fill="#e58a80" text-anchor="middle">ngoài</text>
<line x1="52" y1="262" x2="316" y2="262" stroke="#6fc693" stroke-width="2"/>
<text x="52" y="290" font-size="15" fill="#6fc693">size() = 3, chỉ số hợp lệ 0 .. 2</text>
<text x="52" y="316" font-size="15" fill="#e58a80">v[3]: hành vi không xác định, v.at(3) ném ngoại lệ</text>
<text x="52" y="342" font-size="15" fill="#e9e7e3">chỉ số hợp lệ cuối = size() - 1</text>
<text x="52" y="368" font-size="14" fill="#a7adb5">size() không dấu: 0 - 1 quay vòng thành 2^64 - 1</text>
<text x="496" y="150" font-size="15" fill="#e9e7e3" font-weight="600" font-family="ui-monospace, Menlo, monospace">5 / 2</text>
<text x="496" y="172" font-size="14" fill="#a7adb5">int / int</text>
<text x="844" y="158" font-size="15" fill="#e0904f" font-weight="700" text-anchor="end">2</text>
<line x1="496" y1="190" x2="844" y2="190" stroke="#2c3036" stroke-width="1"/>
<text x="496" y="218" font-size="15" fill="#e9e7e3" font-weight="600" font-family="ui-monospace, Menlo, monospace">5.0 / 2</text>
<text x="496" y="240" font-size="14" fill="#a7adb5">double / int</text>
<text x="844" y="226" font-size="15" fill="#6fc693" font-weight="700" text-anchor="end">2.5</text>
<line x1="496" y1="258" x2="844" y2="258" stroke="#2c3036" stroke-width="1"/>
<text x="496" y="286" font-size="15" fill="#e9e7e3" font-weight="600" font-family="ui-monospace, Menlo, monospace">double(5) / 2</text>
<text x="496" y="308" font-size="14" fill="#a7adb5">ép kiểu trước, rồi chia</text>
<text x="844" y="294" font-size="15" fill="#6fc693" font-weight="700" text-anchor="end">2.5</text>
<text x="496" y="362" font-size="14" fill="#a7adb5">double r = 5 / 2;  lưu 2.0, không phải 2.5</text>
</svg>
