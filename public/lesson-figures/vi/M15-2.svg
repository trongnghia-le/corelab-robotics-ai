<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="Inter, sans-serif">
<title>Vì sao logarithm nhảy tại góc π</title>
<desc>Một hình đĩa bán kính pi trong không gian rotation vector; các điểm đối cực trên biên là cùng một phép quay. Phép quay π−ε và π+ε quanh cùng một trục gần nhau trên nhóm nhưng cách nhau khoảng 2π khi xét như vector.</desc>
<defs><marker id="ahm15b6cc6ba" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6cc6ba"/></marker></defs>
<rect width="900" height="470" rx="14" fill="#17181b"/>
<text x="32" y="44" font-size="22" font-weight="bold" fill="#e9e7e3">Vì sao logarithm nhảy tại góc π</text>
<rect x="32" y="72" width="436" height="366" rx="10" fill="#22252a"/>
<rect x="492" y="72" width="376" height="366" rx="10" fill="#22252a"/>
<circle cx="250.0" cy="250.0" r="130" fill="none" stroke="#e0c169" stroke-width="2.5"/>
<line x1="114.0" y1="250.0" x2="386.0" y2="250.0" stroke="#3d4148" stroke-width="1.5"/>
<line x1="250.0" y1="250.0" x2="315.0" y2="250.0" stroke="#6cc6ba" stroke-width="3" marker-end="url(#ahm15b6cc6ba)"/>
<text x="282.5" y="274" font-size="15" text-anchor="middle" fill="#6cc6ba">trục ω̂</text>
<circle cx="367.6" cy="250.0" r="6" fill="#e0904f"/>
<circle cx="132.4" cy="250.0" r="6" fill="#86abe2"/>
<text x="357.586" y="236" font-size="15" font-weight="600" text-anchor="end" fill="#e0904f">Log R(π−ε)</text>
<text x="142.414" y="236" font-size="15" font-weight="600" fill="#86abe2">Log R(π+ε)</text>
<text x="250" y="106" font-size="15" text-anchor="middle" fill="#e0c169">‖ω‖ = π</text>
<line x1="132.4" y1="296.0" x2="367.6" y2="296.0" stroke="#a7adb5" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="250" y="322" font-size="14" text-anchor="middle" fill="#a7adb5">khoảng cách vector ≈ 2π − 2ε</text>
<text x="250" y="344" font-size="14" text-anchor="middle" fill="#a7adb5">khoảng cách trên nhóm = 2ε</text>
<text x="250" y="408" font-size="14" text-anchor="middle" fill="#a7adb5">lát cắt của hình cầu ‖ω‖ ≤ π (khác tỉ lệ: ε vẽ là 0.3 rad)</text>
<line x1="132.4" y1="290.0" x2="132.4" y2="302.0" stroke="#a7adb5" stroke-width="1.5"/>
<line x1="367.6" y1="290.0" x2="367.6" y2="302.0" stroke="#a7adb5" stroke-width="1.5"/>
<text x="516" y="104" font-size="17" font-weight="bold" fill="#e9e7e3">Số liệu với ε = 0.01 rad</text>
<text x="516" y="126" font-size="14" fill="#a7adb5">ω̂ = (1,−2,2)/3</text>
<text x="516" y="168" font-size="15" fill="#e9e7e3">‖Log R(π−ε)‖</text>
<text x="844" y="168" font-size="15" font-weight="600" text-anchor="end" fill="#e9e7e3">3.1316 rad</text>
<text x="516" y="204" font-size="15" fill="#e9e7e3">‖Log R(π+ε)‖</text>
<text x="844" y="204" font-size="15" font-weight="600" text-anchor="end" fill="#e9e7e3">3.1316 rad</text>
<text x="516" y="240" font-size="15" fill="#e9e7e3">bước nhảy của Log</text>
<text x="844" y="240" font-size="15" font-weight="600" text-anchor="end" fill="#e0904f">6.2632 rad</text>
<text x="516" y="276" font-size="15" fill="#e9e7e3">2π − 2ε</text>
<text x="844" y="276" font-size="15" font-weight="600" text-anchor="end" fill="#e9e7e3">6.2632 rad</text>
<text x="516" y="312" font-size="15" fill="#e9e7e3">góc giữa hai phép quay</text>
<text x="844" y="312" font-size="15" font-weight="600" text-anchor="end" fill="#e9e7e3">0.0200 rad</text>
<text x="516" y="362" font-size="14" fill="#a7adb5">exp là 2-một trên mặt cầu ‖ω‖ = π</text>
</svg>
