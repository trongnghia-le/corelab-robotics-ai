<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" font-family="Inter, sans-serif">
<title>Một danh sách xếp hạng, ba định nghĩa AP</title>
<desc>Các điểm precision-recall của cờ [1,0,0,0,0,1] với N=5, bậc thang nội suy, mười một mức mẫu của quy tắc VOC 2007, và ba giá trị AP 0.2667 (all-point), 0.3333 (11 điểm) và 0.2739 (COCO 101 điểm).</desc>
<rect width="900" height="540" rx="14" fill="#17181b"/>
<defs><marker id="v08f4a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs>
<text x="32" y="44" font-size="22" fill="#e9e7e3" font-weight="bold" text-anchor="start">Một danh sách xếp hạng, ba định nghĩa AP</text>
