<text x="346.96000000000004" y="241.39999999999998" font-size="14" fill="#a7adb5" font-weight="normal" text-anchor="start">các mức mẫu của 11 điểm</text>
<rect x="325.96000000000004" y="261.79999999999995" width="14" height="14" rx="0" fill="#86abe2" fill-opacity="0.28" stroke="#86abe2" stroke-width="1"/>
<text x="346.96000000000004" y="273.79999999999995" font-size="14" fill="#a7adb5" font-weight="normal" text-anchor="start">vùng tô = AP all-point</text>
<text x="624" y="164" font-size="17" fill="#e9e7e3" font-weight="bold" text-anchor="start">all-point</text>
<text x="624" y="192" font-size="15" fill="#a7adb5" font-weight="normal" text-anchor="start">0.2·1 + 0.2·0.333</text>
<text x="624" y="218" font-size="15" fill="#86abe2" font-weight="bold" text-anchor="start">AP = 0.2667</text>
<text x="624" y="262" font-size="17" fill="#e9e7e3" font-weight="bold" text-anchor="start">VOC 2007, 11 điểm</text>
<text x="624" y="290" font-size="15" fill="#a7adb5" font-weight="normal" text-anchor="start">(3·1 + 2·0.333) / 11</text>
<text x="624" y="316" font-size="15" fill="#ae9ce6" font-weight="bold" text-anchor="start">AP = 0.3333</text>
<text x="624" y="360" font-size="17" fill="#e9e7e3" font-weight="bold" text-anchor="start">COCO, 101 điểm</text>
<text x="624" y="388" font-size="15" fill="#a7adb5" font-weight="normal" text-anchor="start">(21·1 + 20·0.333) / 101</text>
<text x="624" y="414" font-size="15" fill="#e0904f" font-weight="bold" text-anchor="start">AP = 0.2739</text>
