<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 490" font-family="Inter, sans-serif">
<title>Trường hợp 2 đúng tỉ lệ: điểm triệt tiêu và méo</title>
<desc>Ảnh 640 × 480 vẽ đúng tỉ lệ. Hai mép song song qua A1 = (70, 340) và A2 = (403.3, 390) gặp nhau tại điểm triệt tiêu (720, 290) ngoài ảnh. Điểm Q dời từ (620, 390) tới (585.6, 372.8) do méo k1 = -0.30, k2 = 0.10.</desc>
<defs><marker id="V03eae9e7e3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 z" fill="#e9e7e3"/></marker></defs>
<rect width="900" height="490" rx="14" fill="#17181b"/>
<text x="32" y="44" font-size="22" fill="#e9e7e3" text-anchor="start" font-weight="bold">Trường hợp 2 đúng tỉ lệ: điểm triệt tiêu và méo</text>
<rect x="32" y="70" width="544" height="388" rx="10" fill="#22252a"/>
<rect x="60" y="112" width="396.8" height="297.6" rx="4" fill="#22252a" stroke="#3d4148" stroke-width="1.5"/>
<text x="68" y="431.6" font-size="14" fill="#a7adb5" text-anchor="start" font-weight="normal">ảnh 640 × 480 px</text>
<line x1="103.4" y1="322.8" x2="506.4" y2="291.8" stroke="#86abe2" stroke-width="2.5" stroke-linecap="round"/>
<line x1="310.1" y1="353.8" x2="506.4" y2="291.8" stroke="#ae9ce6" stroke-width="2.5" stroke-linecap="round"/>
<circle cx="103.4" cy="322.8" r="6" fill="#86abe2"/>
<circle cx="310.1" cy="353.8" r="6" fill="#ae9ce6"/>
<text x="99.4" y="346.8" font-size="14" fill="#86abe2" text-anchor="start" font-weight="600">A1 (70, 340)</text>
<text x="298.1" y="358.8" font-size="14" fill="#ae9ce6" text-anchor="end" font-weight="600">A2 (403.3, 390)</text>
<circle cx="506.4" cy="291.8" r="8" fill="#e0904f"/>
<text x="566" y="96" font-size="15" fill="#e0904f" text-anchor="end" font-weight="600">điểm triệt tiêu K d = (720, 290)</text>
<line x1="506.4" y1="104" x2="506.4" y2="279.8" stroke="#e0904f" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="3 4"/>
<circle cx="444.4" cy="353.8" r="6" fill="#6fc693"/>
<circle cx="423.1" cy="343.1" r="6" fill="#e08db5"/>
<line x1="444.4" y1="353.8" x2="427.1" y2="345.1" stroke="#e9e7e3" stroke-width="1.5" stroke-linecap="round" marker-end="url(#V03eae9e7e3)"/>
<text x="430.4" y="375.8" font-size="15" fill="#6fc693" text-anchor="start" font-weight="600">Q</text>
<text x="413.1" y="363.1" font-size="15" fill="#e08db5" text-anchor="end" font-weight="600">Q′</text>
<circle cx="236" cy="425" r="5" fill="#6fc693"/>
<text x="250" y="430" font-size="14" fill="#6fc693" text-anchor="start" font-weight="600">Q lý tưởng (620, 390)</text>
<circle cx="236" cy="444" r="5" fill="#e08db5"/>
<text x="250" y="449" font-size="14" fill="#e08db5" text-anchor="start" font-weight="600">Q đã méo (585.6, 372.8), dời 38.5 px</text>
<rect x="600" y="70" width="268" height="388" rx="10" fill="#22252a"/>
<text x="620" y="100" font-size="17" fill="#e9e7e3" text-anchor="start" font-weight="bold">Phép lặp khử méo</text>
<text x="620" y="134" font-size="14" fill="#a7adb5" text-anchor="start" font-weight="normal">bước n</text>
<text x="848" y="134" font-size="14" fill="#a7adb5" text-anchor="end" font-weight="normal">sai số (px)</text>
<text x="620" y="168" font-size="15" fill="#e9e7e3" text-anchor="start" font-weight="normal">1</text>
<text x="848" y="168" font-size="15" fill="#e9e7e3" text-anchor="end" font-weight="normal">7.9</text>
<text x="620" y="198" font-size="15" fill="#e9e7e3" text-anchor="start" font-weight="normal">2</text>
<text x="848" y="198" font-size="15" fill="#e9e7e3" text-anchor="end" font-weight="normal">1.7</text>
<text x="620" y="228" font-size="15" fill="#e9e7e3" text-anchor="start" font-weight="normal">3</text>
<text x="848" y="228" font-size="15" fill="#e9e7e3" text-anchor="end" font-weight="normal">0.36</text>
<text x="620" y="258" font-size="15" fill="#e9e7e3" text-anchor="start" font-weight="normal">4</text>
<text x="848" y="258" font-size="15" fill="#e9e7e3" text-anchor="end" font-weight="normal">0.076</text>
<text x="620" y="288" font-size="15" fill="#e9e7e3" text-anchor="start" font-weight="normal">5</text>
<text x="848" y="288" font-size="15" fill="#e9e7e3" text-anchor="end" font-weight="normal">0.016</text>
<line x1="620" y1="322" x2="848" y2="322" stroke="#3d4148" stroke-width="1.5" stroke-linecap="round"/>
<text x="620" y="350" font-size="14" fill="#a7adb5" text-anchor="start" font-weight="normal">tỉ số sai số 0.213 = g′ dự đoán</text>
<text x="620" y="376" font-size="14" fill="#a7adb5" text-anchor="start" font-weight="normal">g′ = −(2k₁r² + 4k₂r⁴)/c = 0.2135</text>
<text x="620" y="410" font-size="15" fill="#e0904f" text-anchor="start" font-weight="600">d = (0.8, 0.1, 1)</text>
</svg>
