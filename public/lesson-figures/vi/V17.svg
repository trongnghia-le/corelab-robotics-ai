<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 360" font-family="Inter, Arial, sans-serif">
<rect width="780" height="360" fill="#191b1f" rx="12"/>
<text x="30" y="34" font-size="16" fill="#e5e7eb" font-weight="bold">A. Drift trên vòng vuông</text>
<text x="450" y="34" font-size="16" fill="#e5e7eb" font-weight="bold">B. Mỗi sai số đo điều gì</text>
<rect x="70" y="80" width="200" height="200" fill="none" stroke="#9ccd4e" stroke-width="3"/>
<polyline points="70,280 270,280 270,80 70,76 52,100 60,150 85,200" fill="none" stroke="#d97936" stroke-width="3"/>
<circle cx="70" cy="280" r="6" fill="#e5e7eb"/>
<text x="76" y="304" font-size="14" fill="#e5e7eb" style="font-size:10.92px">bắt đầu</text>
<text x="40" y="332" font-size="14" fill="#9ccd4e">ground truth (vòng kín)</text>
<text x="40" y="352" font-size="14" fill="#d97936">ước lượng: kết thúc xa điểm đầu</text>
<text x="450" y="76" font-size="14" fill="#53b2dd">RPE (khoảng d)</text>
<text x="450" y="98" font-size="14" fill="#e5e7eb" style="font-size:12.55px">sai số từng chuyển động cục bộ; bỏ qua pose toàn cục;</text>
<text x="450" y="118" font-size="14" fill="#e5e7eb">d nhỏ che mất drift hướng chậm</text>
<text x="450" y="160" font-size="14" fill="#d97936">ATE (sau căn chỉnh cứng)</text>
<text x="450" y="182" font-size="14" fill="#e5e7eb">sai số vị trí RMS của cả đường đi;</text>
<text x="450" y="202" font-size="14" fill="#e5e7eb">căn chỉnh loại bỏ pose toàn cục tự do</text>
<text x="450" y="244" font-size="14" fill="#9ccd4e">Loop closure</text>
<text x="450" y="266" font-size="14" fill="#e5e7eb">Nhận ra nơi đã thấy thêm một ràng buộc,</text>
<text x="450" y="286" font-size="14" fill="#e5e7eb" style="font-size:12.8px">nên sai số điểm cuối được phân bổ ngược</text>
<text x="450" y="306" font-size="14" fill="#e5e7eb">dọc theo quỹ đạo</text>
</svg>
