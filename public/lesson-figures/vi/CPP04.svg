<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" font-family="Inter, sans-serif">
<title>Class bảo vệ invariant; interface che giấu phần cài đặt</title>
<desc>Trái: class JointState với member private và các thao tác public là cổng duy nhất; ghi trực tiếp q = 99 bị chặn và một cập nhật bị từ chối không đổi gì. Phải: Controller trừu tượng với PController và một cài đặt khác, được hàm tự do step sử dụng.</desc>
<defs><marker id="ahCPP04vi6fc693" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1 L9 5 L1 9 z" fill="#6fc693"/></marker></defs>
