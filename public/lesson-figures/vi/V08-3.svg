<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" font-family="Inter, sans-serif">
<title>NMS cứng xóa người thứ hai, Soft-NMS giữ cả hai</title>
<desc>Trái: các box b1 (điểm 0.90) và b2 (điểm 0.80) của hai người với IoU 0.609 và một box lạc b3 (0.30). Phải: điểm mới của b2 dưới NMS cứng (0), Soft-NMS tuyến tính (0.312) và Soft-NMS Gauss (0.381) so với box nền 0.30.</desc>
