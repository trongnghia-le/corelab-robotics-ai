<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" font-family="Inter, Arial, sans-serif" role="img">
<title>CAP08: thế giới danh định và bản sinh đôi niêm phong, một stack, thống kê trung thực</title>
<desc>Cùng một stack CoreBot chạy trên thế giới danh định và trên bản sinh đôi nhiễu loạn được niêm phong. Các episode ghi vào episodes.jsonl. metrics.py tính lại cận Wilson, kiểm định McNemar ghép cặp, khoảng bootstrap và bảng lỗi. Seed tinh chỉnh tách khỏi seed đánh giá, và vòng nhận dạng hệ thống hiệu chuẩn lại theo thí nghiệm twin.</desc>
<rect width="900" height="480" fill="#191b1f" rx="12"/>
<text x="450" y="28" font-size="18" fill="#e5e7eb" text-anchor="middle" font-weight="bold">CAP08: một stack, hai thế giới, số liệu tính lại từ log</text>
<rect x="30" y="60" width="230" height="80" rx="8" fill="#272a2f" stroke="#53b2dd" stroke-width="2"/>
<text x="145.0" y="89.2" font-size="12" fill="#e5e7eb" text-anchor="middle" font-weight="bold" style="font-size:9.75px">Thế giới danh định</text>
<text x="145.0" y="104.2" font-size="12" fill="#e5e7eb" text-anchor="middle">seed 1000-1119 (n=120)</text>
<text x="145.0" y="119.2" font-size="12" fill="#e5e7eb" text-anchor="middle">ablation: 30 seed ghép cặp</text>
<rect x="30" y="170" width="230" height="80" rx="8" fill="#272a2f" stroke="#d97936" stroke-width="2" stroke-dasharray="5 4"/>
<text x="145.0" y="191.7" font-size="12" fill="#e5e7eb" text-anchor="middle" font-weight="bold" style="font-size:9.36px">Bản sinh đôi niêm phong (ẩn)</text>
<text x="145.0" y="206.7" font-size="12" fill="#e5e7eb" text-anchor="middle">seed 2000-2079 (n=80)</text>
<text x="145.0" y="221.7" font-size="12" fill="#e5e7eb" text-anchor="middle" style="font-size:9.85px">bán kính, track, khối lượng, ma sát,</text>
<text x="145.0" y="236.7" font-size="12" fill="#e5e7eb" text-anchor="middle">độ trễ, nhiễu lidar</text>
<rect x="330" y="100" width="200" height="110" rx="8" fill="#272a2f" stroke="#9ccd4e" stroke-width="2"/>
<text x="430.0" y="136.7" font-size="12" fill="#e5e7eb" text-anchor="middle" font-weight="bold" style="font-size:11.39px">Toàn stack</text>
<text x="430.0" y="151.7" font-size="12" fill="#e5e7eb" text-anchor="middle" style="font-size:9.36px">phân tích, định vị, lập kế hoạch,</text>
<text x="430.0" y="166.7" font-size="12" fill="#e5e7eb" text-anchor="middle">nhận thức, gắp, đặt</text>
<text x="430.0" y="181.7" font-size="12" fill="#e5e7eb" text-anchor="middle" style="font-size:10.95px">bộ giám sát an toàn</text>
<line x1="260" y1="100" x2="330" y2="140" stroke="#e5e7eb" stroke-width="2"/>
<polygon points="330,140 320.4,138.6 323.9,132.5" fill="#e5e7eb"/>
<line x1="260" y1="210" x2="330" y2="170" stroke="#e5e7eb" stroke-width="2"/>
<polygon points="330,170 323.9,177.5 320.4,171.4" fill="#e5e7eb"/>
<rect x="600" y="60" width="270" height="70" rx="8" fill="#272a2f" stroke="#e5e7eb" stroke-width="2"/>
<text x="735.0" y="84.2" font-size="12" fill="#e5e7eb" text-anchor="middle" font-weight="bold">runs/final/episodes.jsonl</text>
<text x="735.0" y="99.2" font-size="12" fill="#e5e7eb" text-anchor="middle" style="font-size:9.36px">seed, split, thành công, nguyên nhân,</text>
<text x="735.0" y="114.2" font-size="12" fill="#e5e7eb" text-anchor="middle" style="font-size:11.16px">thời gian, an toàn, git hash</text>
<line x1="530" y1="150" x2="600" y2="110" stroke="#e5e7eb" stroke-width="2"/>
<polygon points="600,110 593.9,117.5 590.4,111.4" fill="#e5e7eb"/>
<rect x="600" y="170" width="270" height="110" rx="8" fill="#272a2f" stroke="#ae9bea" stroke-width="2"/>
<text x="735.0" y="206.7" font-size="12" fill="#e5e7eb" text-anchor="middle" font-weight="bold">bench/metrics.py</text>
<text x="735.0" y="221.7" font-size="12" fill="#e5e7eb" text-anchor="middle">cận Wilson, McNemar (Holm),</text>
<text x="735.0" y="236.7" font-size="12" fill="#e5e7eb" text-anchor="middle" style="font-size:10.26px">CI bootstrap, chênh lệch Newcombe,</text>
<text x="735.0" y="251.7" font-size="12" fill="#e5e7eb" text-anchor="middle">bảng lỗi, trung vị độ trễ</text>
<line x1="735" y1="130" x2="735" y2="170" stroke="#e5e7eb" stroke-width="2"/>
<polygon points="735,170 731.5,161.0 738.5,161.0" fill="#e5e7eb"/>
<rect x="600" y="320" width="270" height="64" rx="8" fill="#272a2f" stroke="#e5e7eb" stroke-width="2"/>
<text x="735.0" y="356.2" font-size="12" fill="#e5e7eb" text-anchor="middle" font-weight="bold">metrics.json  -&gt;  báo cáo, test</text>
<line x1="735" y1="280" x2="735" y2="320" stroke="#e5e7eb" stroke-width="2"/>
<polygon points="735,320 731.5,311.0 738.5,311.0" fill="#e5e7eb"/>
<rect x="30" y="310" width="230" height="70" rx="8" fill="#272a2f" stroke="#d75c5c" stroke-width="2"/>
<text x="145.0" y="341.7" font-size="12" fill="#e5e7eb" text-anchor="middle" font-weight="bold" style="font-size:11.32px">Seed tinh chỉnh 0-99</text>
<text x="145.0" y="356.7" font-size="12" fill="#e5e7eb" text-anchor="middle" style="font-size:9.36px">không bao giờ dùng để đánh giá</text>
<rect x="330" y="310" width="200" height="70" rx="8" fill="#272a2f" stroke="#d97936" stroke-width="2"/>
<text x="430.0" y="341.7" font-size="12" fill="#e5e7eb" text-anchor="middle" font-weight="bold">Sysid trên thí nghiệm twin</text>
<text x="430.0" y="356.7" font-size="12" fill="#e5e7eb" text-anchor="middle" style="font-size:11.25px">bán kính, track, ma sát</text>
<line x1="130" y1="250" x2="330" y2="330" stroke="#d97936" stroke-width="2" stroke-dasharray="5 4"/>
<polygon points="330,330 320.3,329.9 322.9,323.4" fill="#d97936"/>
<line x1="530" y1="345" x2="600" y2="345" stroke="#d97936" stroke-width="2" stroke-dasharray="5 4"/>
<polygon points="600,345 591.0,348.5 591.0,341.5" fill="#d97936"/>
<text x="450" y="430" font-size="13" fill="#e5e7eb" text-anchor="middle">Chênh lệch twin ước lượng độ nhạy với một họ sai số, không phải thực tế. Seed là đơn vị thí nghiệm.</text>
<text x="450" y="452" font-size="12" fill="#a0a4ab" text-anchor="middle">Cam nét đứt: chỉ được phép như thí nghiệm, không bao giờ đọc tham số ẩn.</text>
</svg>
