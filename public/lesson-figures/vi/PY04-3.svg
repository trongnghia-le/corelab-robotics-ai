<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" font-family="Inter, sans-serif">
<title>Stride: một khối bộ nhớ, nhiều view</title>
<desc>Mảng float64 shape (2,3,4) chiếm 24 số trong một khối. Các stride 96, 32 và 8 byte cho bước nhảy của từng trục. Phần tử a[1,2,3] nằm ở byte 184. Slice a[:, ::2, 1:] chọn 12 số mà không copy.</desc>
