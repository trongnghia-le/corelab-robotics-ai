<text x="360" y="30" font-size="15" font-weight="bold" style="font-size:13.84px">Chia trước (theo robot, chi tiết hoặc thời gian), rồi mới fit</text>
<text x="360" y="76" style="font-size:12.37px">toàn bộ dữ liệu, nhóm theo robot hoặc chi tiết thật</text>
<text x="125" y="166">Train 60%</text><text x="125" y="188" font-size="13">fit scaler và model</text>
<text x="360" y="166">Validation 20%</text><text x="360" y="188" font-size="13">chọn model, ngưỡng, lr</text>
<text x="595" y="166">Test 20%</text><text x="595" y="188" font-size="13">báo cáo một lần, ở cuối</text>
<text x="360" y="296" fill="#9ccd4e">Thống kê tiền xử lý chỉ lấy từ Train và dùng lại nguyên vẹn</text>
<text x="360" y="320" fill="#d97936" style="font-size:12.36px">Thông tin Test không bao giờ được lọt vào fit hoặc chọn model</text>
</g>
