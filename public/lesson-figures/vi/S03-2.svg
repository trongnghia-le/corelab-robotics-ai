<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="Inter, sans-serif">
<title>Tốc độ dữ liệu B = S × f của năm message</title>
<desc>Các thanh ngang trên trục logarit từ 1 kB/s đến 1 GB/s cho Twist ở 50 Hz, LaserScan 450 range ở 15 Hz, Imu ở 200 Hz, Image 640x480 ở 30 Hz và Image 1920x1080 ở 30 Hz, cùng một đường dọc tại 125 MB/s của đường truyền gigabit; chỉ thanh cuối vượt qua nó.</desc>
<defs><marker id="s03m2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs>
<rect width="900" height="500" rx="14" fill="#17181b"/>
<text x="32" y="44" font-size="22" fill="#e9e7e3" font-weight="bold" text-anchor="start">Tốc độ dữ liệu B = S × f của năm message</text>
<rect x="32" y="64" width="836" height="392" rx="10" fill="#22252a"/>
<line x1="300" y1="140" x2="300" y2="400" stroke="#2c3036" stroke-width="1" stroke-linecap="round"/>
<text x="300" y="420" font-size="14" fill="#a7adb5" font-weight="normal" text-anchor="middle">1 kB/s</text>
<line x1="373.333" y1="140" x2="373.333" y2="400" stroke="#2c3036" stroke-width="1" stroke-linecap="round"/>
<text x="373.333" y="420" font-size="14" fill="#a7adb5" font-weight="normal" text-anchor="middle">10 kB/s</text>
<line x1="446.667" y1="140" x2="446.667" y2="400" stroke="#2c3036" stroke-width="1" stroke-linecap="round"/>
<text x="446.667" y="420" font-size="14" fill="#a7adb5" font-weight="normal" text-anchor="middle">100 kB/s</text>
<line x1="520" y1="140" x2="520" y2="400" stroke="#2c3036" stroke-width="1" stroke-linecap="round"/>
<text x="520" y="420" font-size="14" fill="#a7adb5" font-weight="normal" text-anchor="middle">1 MB/s</text>
<line x1="593.333" y1="140" x2="593.333" y2="400" stroke="#2c3036" stroke-width="1" stroke-linecap="round"/>
<text x="593.333" y="420" font-size="14" fill="#a7adb5" font-weight="normal" text-anchor="middle">10 MB/s</text>
<line x1="666.667" y1="140" x2="666.667" y2="400" stroke="#2c3036" stroke-width="1" stroke-linecap="round"/>
<text x="666.667" y="420" font-size="14" fill="#a7adb5" font-weight="normal" text-anchor="middle">100 MB/s</text>
<line x1="740" y1="140" x2="740" y2="400" stroke="#2c3036" stroke-width="1" stroke-linecap="round"/>
<text x="740" y="420" font-size="14" fill="#a7adb5" font-weight="normal" text-anchor="middle">1 GB/s</text>
<text x="520" y="444" font-size="15" fill="#e9e7e3" font-weight="normal" text-anchor="middle">tốc độ dữ liệu B (byte mỗi giây, thang logarit)</text>
<line x1="673.773" y1="132" x2="673.773" y2="400" stroke="#e58a80" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="7 5"/>
<text x="673.773" y="122" font-size="15" fill="#e58a80" font-weight="600" text-anchor="middle">đường truyền 1 Gbit/s = 125 MB/s</text>
<text x="48" y="170" font-size="15" fill="#e9e7e3" font-weight="600" text-anchor="start">Twist</text>
<text x="48" y="189" font-size="14" fill="#a7adb5" font-weight="normal" text-anchor="start">S = 52 B, f = 50 Hz</text>
<rect x="300" y="154" width="30.4314" height="26" rx="3" fill="#6cc6ba" fill-opacity="0.9"/>
<text x="852" y="173" font-size="15" fill="#e9e7e3" font-weight="600" text-anchor="end">2.6 kB/s</text>
<text x="48" y="220" font-size="15" fill="#e9e7e3" font-weight="600" text-anchor="start">LaserScan, 450 range</text>
<text x="48" y="239" font-size="14" fill="#a7adb5" font-weight="normal" text-anchor="start">S = 1 860 B, f = 15 Hz</text>
<rect x="300" y="204" width="106.011" height="26" rx="3" fill="#6cc6ba" fill-opacity="0.9"/>
<text x="852" y="223" font-size="15" fill="#e9e7e3" font-weight="600" text-anchor="end">27.9 kB/s</text>
<text x="48" y="270" font-size="15" fill="#e9e7e3" font-weight="600" text-anchor="start">Imu</text>
<text x="48" y="289" font-size="14" fill="#a7adb5" font-weight="normal" text-anchor="start">S = 324 B, f = 200 Hz</text>
<rect x="300" y="254" width="132.849" height="26" rx="3" fill="#6cc6ba" fill-opacity="0.9"/>
<text x="852" y="273" font-size="15" fill="#e9e7e3" font-weight="600" text-anchor="end">64.8 kB/s</text>
<text x="48" y="320" font-size="15" fill="#e9e7e3" font-weight="600" text-anchor="start">Image 640×480 rgb8</text>
<text x="48" y="339" font-size="14" fill="#a7adb5" font-weight="normal" text-anchor="start">S = 921 652 B, f = 30 Hz</text>
<rect x="300" y="304" width="325.724" height="26" rx="3" fill="#e0904f" fill-opacity="0.9"/>
<text x="852" y="323" font-size="15" fill="#e9e7e3" font-weight="600" text-anchor="end">27.6 MB/s</text>
<text x="48" y="370" font-size="15" fill="#e9e7e3" font-weight="600" text-anchor="start">Image 1920×1080 rgb8</text>
<text x="48" y="389" font-size="14" fill="#a7adb5" font-weight="normal" text-anchor="start">S = 6 220 852 B, f = 30 Hz</text>
<rect x="300" y="354" width="386.538" height="26" rx="3" fill="#e0904f" fill-opacity="0.9"/>
<text x="852" y="373" font-size="15" fill="#e9e7e3" font-weight="600" text-anchor="end">186.6 MB/s</text>
<text x="852" y="391" font-size="14" fill="#e58a80" font-weight="normal" text-anchor="end">vượt đường truyền</text>
<text x="32" y="482" font-size="14" fill="#a7adb5" font-weight="normal" text-anchor="start">S theo quy tắc CDR của bài, kiểm tra bằng rclpy trên ROS 2 Humble; độ dài frame_id như trong bảng.</text>
</svg>
