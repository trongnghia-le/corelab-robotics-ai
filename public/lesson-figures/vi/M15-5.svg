<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" font-family="Inter, sans-serif">
<title>Bước Euler so với mũ chính xác cho gyro</title>
<desc>Độ dài một cột của ma trận quay theo số bước: cập nhật chính xác giữ nó bằng 1, cập nhật Euler nhân nó với căn của 1 cộng theta bình phương mỗi bước và đạt 1.0513 sau 1000 bước ở 1 rad/s và 100 Hz.</desc>
<defs></defs>
