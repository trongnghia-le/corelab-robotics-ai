<text x="112" y="372" font-size="14" text-anchor="middle" fill="#a7adb5">0</text>
<line x1="230.0" y1="120.0" x2="230.0" y2="350.0" stroke="#3d4148" stroke-width="1"/>
<text x="230" y="372" font-size="14" text-anchor="middle" fill="#a7adb5">250</text>
<line x1="348.0" y1="120.0" x2="348.0" y2="350.0" stroke="#3d4148" stroke-width="1"/>
<text x="348" y="372" font-size="14" text-anchor="middle" fill="#a7adb5">500</text>
<line x1="466.0" y1="120.0" x2="466.0" y2="350.0" stroke="#3d4148" stroke-width="1"/>
