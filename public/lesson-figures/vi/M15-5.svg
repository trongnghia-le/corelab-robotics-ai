<text x="576" y="337.667" font-size="15" font-weight="600" text-anchor="end" fill="#6fc693">chính xác: R exp([ω]× Δt) giữ bằng 1</text>
<text x="588" y="258.361" font-size="15" font-weight="600" text-anchor="end" fill="#e0904f">1.0513</text>
<text x="588" y="127.962" font-size="15" font-weight="600" text-anchor="end" fill="#86abe2">1.2213</text>
<text x="122" y="158.333" font-size="15" font-weight="600" fill="#86abe2">Euler, ω = 2 rad/s, Δt = 0.01 s</text>
<text x="122" y="189" font-size="15" font-weight="600" fill="#e0904f">Euler, ω = 1 rad/s, Δt = 0.01 s</text>
<text x="348" y="400" font-size="14" text-anchor="middle" fill="#a7adb5">bước k</text>
<text x="48" y="104" font-size="14" fill="#a7adb5">độ dài cột ‖R e₁‖</text>
<text x="656" y="104" font-size="17" font-weight="bold" fill="#e9e7e3">Mỗi bước</text>
<text x="656" y="140" font-size="15" fill="#e9e7e3">Euler nhân độ dài cột</text>
<text x="656" y="170" font-size="15" fill="#e9e7e3">với √(1 + θ²), θ = ‖ω‖Δt.</text>
<text x="656" y="200" font-size="15" fill="#e9e7e3">Sau k bước: (1 + θ²)^(k/2).</text>
<text x="656" y="230" font-size="15" fill="#e9e7e3">ω = 1, Δt = 0.01, k = 1000:</text>
<text x="656" y="260" font-size="15" fill="#e9e7e3">1.0001^500 = 1.0513.</text>
<text x="656" y="290" font-size="15" fill="#e9e7e3">exp chính xác giữ ‖R e₁‖ = 1.</text>
</svg>
