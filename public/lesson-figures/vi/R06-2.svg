<path d="M307.0,440.0 L306.9,433.9 L306.7,427.7 L306.3,421.6 L305.7,415.5 L305.0,409.4 L304.1,403.3 L303.0,397.3 L301.8,391.3 L300.4,385.3 L298.9,379.4 L297.2,373.5 L295.4,367.6 L293.4,361.8 L291.2,356.1 L288.9,350.4 L286.5,344.8 L283.9,339.2 L281.1,333.7 L278.2,328.3 L275.2,323.0 L272.0,317.7 L268.7,312.6 L265.2,307.5" fill="none" stroke="#e0c169" stroke-width="2.5" stroke-linejoin="round"/>
<path d="M135.4,440.0 L135.3,436.7 L135.0,433.4 L134.6,430.1 L133.9,426.9 L133.1,423.7 L132.1,420.6 L131.0,417.5 L129.6,414.5 L128.1,411.5 L126.5,408.7 L124.7,405.9" fill="none" stroke="#e9e7e3" stroke-width="1.5" stroke-linejoin="round"/>
<circle cx="307.0" cy="440.0" r="7.0" fill="none" stroke="#a7adb5" stroke-width="2" stroke-dasharray="3 3"/>
<circle cx="76.0" cy="440.0" r="7.0" fill="#17181b" stroke="#e9e7e3" stroke-width="2.5"/>
<circle cx="265.2" cy="307.5" r="7.0" fill="#17181b" stroke="#e9e7e3" stroke-width="2.5"/>
<circle cx="253.7" cy="176.0" r="5.0" fill="#e9e7e3" stroke="#e9e7e3" stroke-width="1"/>
<line x1="253.7" y1="176.0" x2="173.7" y2="122.2" stroke="#e0904f" stroke-width="3" stroke-linecap="round" marker-end="url(#R062vi-e0904f)"/>
<line x1="253.7" y1="176.0" x2="213.9" y2="179.5" stroke="#e08db5" stroke-width="3" stroke-linecap="round" marker-end="url(#R062vi-e08db5)"/>
<text x="168" y="114" font-size="15" fill="#e0904f" font-weight="600" text-anchor="end">J₁</text>
<text x="206" y="201" font-size="15" fill="#e08db5" font-weight="600" text-anchor="end">J₂</text>
<text x="268" y="166" font-size="15" fill="#e9e7e3">đầu mút p = (0.539, 0.800)</text>
<text x="301" y="470" font-size="14" fill="#a7adb5" text-anchor="middle">trục 2 khi q = 0: (0.7, 0)</text>
<text x="281" y="318" font-size="14" fill="#e9e7e3">trục 2 hiện tại: (0.573, 0.402)</text>
<text x="373" y="426" font-size="14" fill="#a7adb5" text-anchor="middle">tư thế không (q = 0)</text>
<text x="310" y="387" font-size="14" fill="#e0c169">quay q₁ quanh đế</text>
<text x="72" y="470" font-size="14" fill="#a7adb5">trục khớp 1</text>
<text x="156" y="426" font-size="14" fill="#e9e7e3">q₁ = 35°</text>
<text x="550" y="484" font-size="14" fill="#a7adb5">vận tốc đầu mút: 1 m/s = 100 px</text>
<text x="550" y="132" font-size="15" fill="#e9e7e3" font-weight="600">J_s1 = S₁ = (1; 0, 0)</text>
<text x="550" y="158" font-size="15" fill="#e9e7e3" font-weight="600">J_s2 = Ad S₂ = (1; 0.402, −0.573)</text>
<text x="550" y="184" font-size="14" fill="#a7adb5">(ω ; vₓ, v_y) với v = −ω × q</text>
<line x1="550.0" y1="208.0" x2="852.0" y2="208.0" stroke="#3d4148" stroke-width="1" stroke-linecap="round"/>
<text x="550" y="238" font-size="15" fill="#e9e7e3" font-weight="600">Tại đầu mút, ṗ = v + ω × p:</text>
<text x="550" y="270" font-size="15" fill="#e0904f" font-weight="600">J₁ = (0 − 0.800, 0 + 0.539)</text>
<text x="566" y="292" font-size="15" fill="#e0904f">= (−0.800, 0.539)</text>
<text x="550" y="328" font-size="15" fill="#e08db5" font-weight="600">J₂ = (0.402 − 0.800, −0.573 + 0.539)</text>
<text x="566" y="350" font-size="15" fill="#e08db5">= (−0.398, −0.035) m/s trên rad/s</text>
</svg>
