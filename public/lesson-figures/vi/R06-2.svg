<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="Inter, sans-serif">
<title>Cột i của space Jacobian là trục khớp i, bị các khớp phía trước dời đi</title>
<desc>Tay máy 2R phẳng với l=(0.7,0.4) m tại q=(35,60) độ. Trục khớp 2 nằm ở (0.7,0) ở tư thế không và được quay của khớp 1 đưa tới (0.573,0.402), cho cột space Jacobian J_s2=(1; 0.402, -0.573). Các cột vận tốc đầu mút suy ra từ v + omega x p.</desc>
<defs><marker id="R062vi-e08db5" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 z" fill="#e08db5"/></marker><marker id="R062vi-e0904f" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 z" fill="#e0904f"/></marker></defs>
<rect width="900" height="520" rx="14" fill="#17181b"/>
<text x="32" y="44" font-size="22" fill="#e9e7e3" font-weight="700">Cột i của space Jacobian là trục khớp i, bị các khớp phía trước dời đi</text>
<rect x="32" y="70" width="478" height="430" rx="10" fill="#22252a" stroke="none" stroke-width="1.5" />
<rect x="534" y="70" width="334" height="430" rx="10" fill="#22252a" stroke="none" stroke-width="1.5" />
<text x="48" y="98" font-size="17" fill="#e9e7e3" font-weight="700">Hình học, l = (0.7, 0.4) m, q = (35°, 60°)</text>
<text x="550" y="98" font-size="17" fill="#e9e7e3" font-weight="700">Các cột và kiểm tra tại đầu mút</text>
<line x1="76.0" y1="440.0" x2="307.0" y2="440.0" stroke="#a7adb5" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 6"/>
<line x1="307.0" y1="440.0" x2="439.0" y2="440.0" stroke="#a7adb5" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 6"/>
