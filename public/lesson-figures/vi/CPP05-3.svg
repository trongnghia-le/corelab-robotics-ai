<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="Inter, sans-serif">
<title>Tìm kiếm nhị phân: log2(n) phép so sánh và chúng đi đâu</title>
<desc>Trái: số phép so sánh tệ nhất floor(log2 n)+1 theo n trên trục log với các điểm 10, 14, 17, 20 tại 10^3 đến 10^6. Phải: kích thước cửa sổ sau mỗi phép so sánh với n = 45 và đích 0 và 44.</desc>
<defs><marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a7adb5"/></marker></defs>
<rect width="900" height="500" rx="14" fill="#17181b"/>
<text x="32" y="44" font-size="22" font-weight="bold" fill="#e9e7e3">Tìm kiếm nhị phân: log2(n) phép so sánh và chúng đi đâu</text>
<rect x="32" y="64" width="430" height="404" rx="10" fill="#22252a"/>
<rect x="486" y="64" width="382" height="404" rx="10" fill="#22252a"/>
<text x="52" y="96" font-size="17" font-weight="bold" fill="#e9e7e3">Trường hợp xấu nhất, vector đã sắp xếp bất kỳ</text>
<line x1="104" y1="140" x2="104" y2="380" stroke="#3d4148" stroke-width="1"/>
<text x="104" y="400" font-size="14" text-anchor="middle" fill="#a7adb5">10⁰</text>
<line x1="159" y1="140" x2="159" y2="380" stroke="#3d4148" stroke-width="1"/>
<text x="159" y="400" font-size="14" text-anchor="middle" fill="#a7adb5">10¹</text>
<line x1="215" y1="140" x2="215" y2="380" stroke="#3d4148" stroke-width="1"/>
<text x="215" y="400" font-size="14" text-anchor="middle" fill="#a7adb5">10²</text>
<line x1="270" y1="140" x2="270" y2="380" stroke="#3d4148" stroke-width="1"/>
<text x="270" y="400" font-size="14" text-anchor="middle" fill="#a7adb5">10³</text>
<line x1="325" y1="140" x2="325" y2="380" stroke="#3d4148" stroke-width="1"/>
<text x="325" y="400" font-size="14" text-anchor="middle" fill="#a7adb5">10⁴</text>
<line x1="381" y1="140" x2="381" y2="380" stroke="#3d4148" stroke-width="1"/>
<text x="381" y="400" font-size="14" text-anchor="middle" fill="#a7adb5">10⁵</text>
<line x1="436" y1="140" x2="436" y2="380" stroke="#3d4148" stroke-width="1"/>
<text x="436" y="400" font-size="14" text-anchor="middle" fill="#a7adb5">10⁶</text>
<line x1="104" y1="380" x2="436" y2="380" stroke="#3d4148" stroke-width="1"/>
<text x="96" y="385" font-size="14" text-anchor="end" fill="#a7adb5">0</text>
<line x1="104" y1="320" x2="436" y2="320" stroke="#3d4148" stroke-width="1"/>
<text x="96" y="325" font-size="14" text-anchor="end" fill="#a7adb5">6</text>
<line x1="104" y1="260" x2="436" y2="260" stroke="#3d4148" stroke-width="1"/>
<text x="96" y="265" font-size="14" text-anchor="end" fill="#a7adb5">12</text>
<line x1="104" y1="200" x2="436" y2="200" stroke="#3d4148" stroke-width="1"/>
<text x="96" y="205" font-size="14" text-anchor="end" fill="#a7adb5">18</text>
<line x1="104" y1="140" x2="436" y2="140" stroke="#3d4148" stroke-width="1"/>
<text x="96" y="145" font-size="14" text-anchor="end" fill="#a7adb5">24</text>
<line x1="104" y1="380" x2="436" y2="380" stroke="#a7adb5" stroke-width="1.5"/>
<line x1="104" y1="380" x2="104" y2="140" stroke="#a7adb5" stroke-width="1.5"/>
<text x="436" y="424" font-size="15" text-anchor="end" fill="#e9e7e3">n (phần tử, thang log)</text>
<text x="52" y="122" font-size="15" fill="#e9e7e3">số phép so sánh</text>
<polyline points="104.0,370.0 120.7,370.0 120.7,360.0 137.3,360.0 137.3,350.0 154.0,350.0 154.0,340.0 170.6,340.0 170.6,330.0 187.3,330.0 187.3,320.0 203.9,320.0 203.9,310.0 220.6,310.0 220.6,300.0 237.3,300.0 237.3,290.0 253.9,290.0 253.9,280.0 270.6,280.0 270.6,270.0 287.2,270.0 287.2,260.0 303.9,260.0 303.9,250.0 320.5,250.0 320.5,240.0 337.2,240.0 337.2,230.0 353.9,230.0 353.9,220.0 370.5,220.0 370.5,210.0 387.2,210.0 387.2,200.0 403.8,200.0 403.8,190.0 420.5,190.0 420.5,180.0 436.0,180.0" fill="none" stroke="#6fc693" stroke-width="2.5"/>
<circle cx="270" cy="280" r="5" fill="#6fc693"/>
<text x="260" y="268" font-size="15" font-weight="600" text-anchor="end" fill="#6fc693">10</text>
<circle cx="325" cy="240" r="5" fill="#6fc693"/>
<text x="315" y="228" font-size="15" font-weight="600" text-anchor="end" fill="#6fc693">14</text>
<circle cx="381" cy="210" r="5" fill="#6fc693"/>
<text x="371" y="198" font-size="15" font-weight="600" text-anchor="end" fill="#6fc693">17</text>
<circle cx="436" cy="180" r="5" fill="#6fc693"/>
<text x="426" y="168" font-size="15" font-weight="600" text-anchor="end" fill="#6fc693">20</text>
<text x="114" y="156" font-size="14" fill="#e0904f">quét tuyến tính: n (ngoài biểu đồ)</text>
<text x="52" y="452" font-size="14" fill="#a7adb5">W(n) = floor(log2 n) + 1; n = 10^3, 10^4, 10^5, 10^6</text>
<text x="506" y="96" font-size="17" font-weight="bold" fill="#e9e7e3">Cửa sổ sau mỗi phép so sánh, n = 45</text>
<text x="506" y="132" font-size="15" font-weight="600" fill="#86abe2">đích 0 (không bao giờ nhỏ hơn): xấu nhất</text>
<rect x="506" y="146" width="270" height="16" rx="3" fill="#86abe2"/>
<text x="784" y="159" font-size="14" fill="#e9e7e3">45</text>
<rect x="506" y="168" width="132" height="16" rx="3" fill="#86abe2"/>
<text x="646" y="181" font-size="14" fill="#e9e7e3">22</text>
<rect x="506" y="190" width="66" height="16" rx="3" fill="#86abe2"/>
<text x="580" y="203" font-size="14" fill="#e9e7e3">11</text>
<rect x="506" y="212" width="30" height="16" rx="3" fill="#86abe2"/>
<text x="544" y="225" font-size="14" fill="#e9e7e3">5</text>
<rect x="506" y="234" width="12" height="16" rx="3" fill="#86abe2"/>
<text x="526" y="247" font-size="14" fill="#e9e7e3">2</text>
<rect x="506" y="256" width="6" height="16" rx="3" fill="#86abe2"/>
<text x="520" y="269" font-size="14" fill="#e9e7e3">1</text>
<text x="506" y="294" font-size="14" fill="#a7adb5">6 phép so sánh</text>
<text x="506" y="316" font-size="15" font-weight="600" fill="#e0904f">đích 44 (luôn nhỏ hơn)</text>
<rect x="506" y="330" width="270" height="16" rx="3" fill="#e0904f"/>
<text x="784" y="343" font-size="14" fill="#e9e7e3">45</text>
<rect x="506" y="352" width="132" height="16" rx="3" fill="#e0904f"/>
<text x="646" y="365" font-size="14" fill="#e9e7e3">22</text>
<rect x="506" y="374" width="60" height="16" rx="3" fill="#e0904f"/>
<text x="574" y="387" font-size="14" fill="#e9e7e3">10</text>
<rect x="506" y="396" width="24" height="16" rx="3" fill="#e0904f"/>
<text x="538" y="409" font-size="14" fill="#e9e7e3">4</text>
<rect x="506" y="418" width="6" height="16" rx="3" fill="#e0904f"/>
<text x="520" y="431" font-size="14" fill="#e9e7e3">1</text>
<text x="506" y="456" font-size="14" fill="#a7adb5">5 phép so sánh</text>
</svg>
