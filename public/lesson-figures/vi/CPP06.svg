<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="Inter, sans-serif">
<title>Một template, nhiều hàm; constexpr lúc biên dịch hoặc lúc chạy</title>
<desc>Trái: template clamp_to là một khuôn tạo ra clamp_to&lt;int&gt; và clamp_to&lt;double&gt;, và bị static_assert chặn với std::string. Phải: những gì trình biên dịch tính (giá trị constexpr, static_assert) so với những gì chương trình đang chạy tính.</desc>
<defs><marker id="b1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a7adb5"/></marker></defs>
<rect width="900" height="500" rx="14" fill="#17181b"/>
<text x="32" y="44" font-size="22" font-weight="bold" fill="#e9e7e3">Một template, nhiều hàm; constexpr lúc biên dịch hoặc lúc chạy</text>
<rect x="32" y="64" width="430" height="404" rx="10" fill="#22252a"/>
<rect x="486" y="64" width="382" height="404" rx="10" fill="#22252a"/>
<text x="52" y="96" font-size="17" font-weight="bold" fill="#e9e7e3">Template = khuôn, mỗi kiểu một hàm</text>
<rect x="52" y="150" width="130" height="250" rx="8" fill="#2a2d33" stroke="#a7adb5" stroke-width="2"/>
<text x="117" y="196" font-size="15" font-weight="600" text-anchor="middle" fill="#e9e7e3">template</text>
<text x="117" y="226" font-size="15" font-weight="600" text-anchor="middle" fill="#e9e7e3">&lt;class T&gt;</text>
<text x="117" y="256" font-size="15" text-anchor="middle" fill="#e9e7e3">T clamp_to</text>
<text x="117" y="286" font-size="15" text-anchor="middle" fill="#e9e7e3">(T x, T lo,</text>
<text x="117" y="316" font-size="15" text-anchor="middle" fill="#e9e7e3">T hi)</text>
<rect x="232" y="118" width="210" height="92" rx="8" fill="#17181b" stroke="#86abe2" stroke-width="2"/>
<text x="244" y="142" font-size="14" fill="#a7adb5">clamp_to(5, 0, 3)</text>
<text x="244" y="170" font-size="15" font-weight="600" fill="#86abe2">clamp_to&lt;int&gt;</text>
<text x="244" y="196" font-size="14" fill="#e9e7e3">biên dịch cho int</text>
<line x1="182" y1="275" x2="230" y2="164" stroke="#a7adb5" stroke-width="2" marker-end="url(#b1)"/>
<rect x="232" y="228" width="210" height="92" rx="8" fill="#17181b" stroke="#6fc693" stroke-width="2"/>
<text x="244" y="252" font-size="14" fill="#a7adb5">clamp_to(0.5, 0.0, 1.0)</text>
<text x="244" y="280" font-size="15" font-weight="600" fill="#6fc693">clamp_to&lt;double&gt;</text>
<text x="244" y="306" font-size="14" fill="#e9e7e3">biên dịch cho double</text>
<line x1="182" y1="275" x2="230" y2="274" stroke="#a7adb5" stroke-width="2" marker-end="url(#b1)"/>
<rect x="232" y="338" width="210" height="92" rx="8" fill="#17181b" stroke="#e58a80" stroke-width="2" stroke-dasharray="6 4"/>
<text x="244" y="362" font-size="14" fill="#a7adb5">clamp_to(name, a, b)</text>
<text x="244" y="390" font-size="15" font-weight="600" fill="#e58a80">T = std::string</text>
<text x="244" y="416" font-size="14" fill="#e9e7e3">static_assert dừng build</text>
<line x1="182" y1="275" x2="230" y2="384" stroke="#a7adb5" stroke-width="2" marker-end="url(#b1)"/>
<text x="506" y="96" font-size="17" font-weight="bold" fill="#e9e7e3">constexpr: ai tính giá trị?</text>
<rect x="506" y="118" width="342" height="150" rx="8" fill="#1f3b37" stroke="#6cc6ba" stroke-width="2"/>
<text x="522" y="146" font-size="15" font-weight="600" fill="#6cc6ba">Lúc biên dịch: trình biên dịch</text>
<text x="522" y="176" font-size="14" fill="#e9e7e3">constexpr int a = 4 * 2;   // 8</text>
<text x="522" y="202" font-size="14" fill="#e9e7e3">std::array&lt;int, a&gt; arr;   // size 8</text>
<text x="522" y="228" font-size="14" fill="#e9e7e3">static_assert(sq[5] == 25);</text>
<text x="522" y="254" font-size="14" fill="#a7adb5">giá trị nằm sẵn trong file nhị phân</text>
<rect x="506" y="288" width="342" height="150" rx="8" fill="#4a3a26" stroke="#e0904f" stroke-width="2"/>
<text x="522" y="316" font-size="15" font-weight="600" fill="#e0904f">Lúc chạy: chương trình</text>
<text x="522" y="346" font-size="14" fill="#e9e7e3">int n = read_from_sensor();</text>
<text x="522" y="372" font-size="14" fill="#e9e7e3">const int c = n * 2;   // chưa biết trước</text>
<text x="522" y="398" font-size="14" fill="#e9e7e3">clamp_to(n, 0, 3);   // chạy bình thường</text>
<text x="522" y="424" font-size="14" fill="#a7adb5">cùng hàm constexpr, chạy ở đây</text>
</svg>
