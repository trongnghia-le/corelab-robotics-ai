<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="Inter, sans-serif">
<title>Trường hợp 1: thứ tự hai chuyển động cứng làm đổi kết quả</title>
<desc>T1 là phép quay 90 độ kèm tịnh tiến (1,0); T2 là tịnh tiến (2,0). T1T2 đặt khung tại (1,2); T2T1 đặt khung tại (3,0). Cả hai kết thúc với cùng hướng Rot(90).</desc>
<defs><marker id="R03daa7adb5" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 z" fill="#a7adb5"/></marker><marker id="R03da86abe2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 z" fill="#86abe2"/></marker><marker id="R03dae0904f" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 z" fill="#e0904f"/></marker></defs>
<rect width="900" height="520" rx="14" fill="#17181b"/>
<text x="32" y="44" font-size="22" fill="#e9e7e3" text-anchor="start" font-weight="bold">Trường hợp 1: thứ tự hai chuyển động cứng làm đổi kết quả</text>
<rect x="32" y="70" width="540" height="430" rx="10" fill="#22252a"/>
<rect x="596" y="70" width="272" height="430" rx="10" fill="#22252a"/>
<text x="52" y="100" font-size="17" fill="#e9e7e3" text-anchor="start" font-weight="bold">Mỗi tích đặt khung ở đâu (m)</text>
<text x="616" y="100" font-size="17" fill="#e9e7e3" text-anchor="start" font-weight="bold">Trường hợp 1 bằng số</text>
<line x1="110" y1="474" x2="110" y2="148.4" stroke="#2c3036" stroke-width="1" stroke-linecap="round"/>
<line x1="198" y1="474" x2="198" y2="148.4" stroke="#2c3036" stroke-width="1" stroke-linecap="round"/>
<line x1="286" y1="474" x2="286" y2="148.4" stroke="#2c3036" stroke-width="1" stroke-linecap="round"/>
<line x1="374" y1="474" x2="374" y2="148.4" stroke="#2c3036" stroke-width="1" stroke-linecap="round"/>
<line x1="462" y1="474" x2="462" y2="148.4" stroke="#2c3036" stroke-width="1" stroke-linecap="round"/>
<line x1="66" y1="430" x2="506" y2="430" stroke="#2c3036" stroke-width="1" stroke-linecap="round"/>
<line x1="66" y1="342" x2="506" y2="342" stroke="#2c3036" stroke-width="1" stroke-linecap="round"/>
<line x1="66" y1="254" x2="506" y2="254" stroke="#2c3036" stroke-width="1" stroke-linecap="round"/>
<line x1="66" y1="166" x2="506" y2="166" stroke="#2c3036" stroke-width="1" stroke-linecap="round"/>
<text x="110" y="496" font-size="14" fill="#a7adb5" text-anchor="middle" font-weight="normal">0</text>
<text x="286" y="496" font-size="14" fill="#a7adb5" text-anchor="middle" font-weight="normal">2</text>
<text x="462" y="496" font-size="14" fill="#a7adb5" text-anchor="middle" font-weight="normal">4</text>
<text x="56" y="435" font-size="14" fill="#a7adb5" text-anchor="end" font-weight="normal">0</text>
<text x="56" y="259" font-size="14" fill="#a7adb5" text-anchor="end" font-weight="normal">2</text>
<text x="506" y="420" font-size="15" fill="#a7adb5" text-anchor="end" font-weight="normal">x (m)</text>
<text x="52" y="152.4" font-size="15" fill="#a7adb5" text-anchor="start" font-weight="normal">y (m)</text>
<line x1="66" y1="430" x2="506" y2="430" stroke="#a7adb5" stroke-width="2" stroke-linecap="round" marker-end="url(#R03daa7adb5)"/>
<line x1="110" y1="474" x2="110" y2="148.4" stroke="#a7adb5" stroke-width="2" stroke-linecap="round" marker-end="url(#R03daa7adb5)"/>
<line x1="110" y1="430" x2="198" y2="430" stroke="#86abe2" stroke-width="2" stroke-linecap="round" stroke-dasharray="7 6"/>
<line x1="198" y1="430" x2="198" y2="254" stroke="#86abe2" stroke-width="2" stroke-linecap="round" stroke-dasharray="7 6"/>
