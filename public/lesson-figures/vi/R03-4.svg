<line x1="198" y1="254" x2="198" y2="201.2" stroke="#86abe2" stroke-width="3.5" stroke-linecap="round" marker-end="url(#R03da86abe2)"/>
<line x1="198" y1="254" x2="145.2" y2="254" stroke="#86abe2" stroke-width="2" stroke-linecap="round" marker-end="url(#R03da86abe2)"/>
<circle cx="198" cy="254" r="5" fill="#86abe2"/>
<line x1="374" y1="430" x2="374" y2="377.2" stroke="#e0904f" stroke-width="3.5" stroke-linecap="round" marker-end="url(#R03dae0904f)"/>
<line x1="374" y1="430" x2="321.2" y2="430" stroke="#e0904f" stroke-width="2" stroke-linecap="round" marker-end="url(#R03dae0904f)"/>
<circle cx="374" cy="430" r="5" fill="#e0904f"/>
<text x="210" y="244" font-size="15" fill="#86abe2" text-anchor="start" font-weight="600">T1 T2 → (1, 2)</text>
<text x="386" y="360" font-size="15" fill="#e0904f" text-anchor="start" font-weight="600">T2 T1 → (3, 0)</text>
<text x="210" y="458" font-size="15" fill="#a7adb5" text-anchor="start" font-weight="600">T1: 1 m theo x, quay 90°</text>
<text x="210" y="342" font-size="14" fill="#86abe2" text-anchor="start" font-weight="normal">trước 1 m, rồi 2 m theo x₁</text>
<text x="616" y="140" font-size="15" fill="#e9e7e3" text-anchor="start" font-weight="normal">T1: R1 = Rot(90°), t1 = (1, 0)</text>
<text x="616" y="174" font-size="15" fill="#e9e7e3" text-anchor="start" font-weight="normal">T2: R2 = I, t2 = (2, 0)</text>
<text x="616" y="220" font-size="15" fill="#86abe2" text-anchor="start" font-weight="normal">T1 T2: R1 t2 + t1</text>
<text x="616" y="254" font-size="15" fill="#86abe2" text-anchor="start" font-weight="600">= (0, 2) + (1, 0) = (1, 2)</text>
<text x="616" y="300" font-size="15" fill="#e0904f" text-anchor="start" font-weight="normal">T2 T1: I t1 + t2</text>
<text x="616" y="334" font-size="15" fill="#e0904f" text-anchor="start" font-weight="600">= (1, 0) + (2, 0) = (3, 0)</text>
<text x="616" y="380" font-size="15" fill="#e9e7e3" text-anchor="start" font-weight="600">(1, 2) ≠ (3, 0): thứ tự quan trọng</text>
</svg>
