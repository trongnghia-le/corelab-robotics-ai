<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" font-family="Inter, Arial, sans-serif" role="img">
<title>CAP02 đường dữ liệu firmware-in-the-loop</title>
<desc>Host gửi lệnh vào vòng tốc độ PI viết bằng C, PWM điều khiển động cơ mô phỏng, bộ giải mã quadrature trả số đếm 16-bit, frame CRC-8 đưa chúng về driver và odometry của host; watchdog ép PWM về 0 khi lệnh ngừng.</desc>
<rect width="900" height="440" fill="#191b1f" rx="12"/>
<text x="450" y="28" font-size="17" fill="#e5e7eb" text-anchor="middle" font-weight="bold" style="font-size:16.02px">Lệnh đi xuống, số đếm đi lên, watchdog xuyên suốt</text>
<text x="20" y="62" font-size="12" fill="#53b2dd" text-anchor="start" font-weight="bold">HOST (Python, 100 Hz)</text>
<rect x="20" y="72" width="150" height="56" rx="8" fill="#272a2f" stroke="#53b2dd" stroke-width="2"/>
<text x="95.0" y="96.7" font-size="12" fill="#e5e7eb" text-anchor="middle" font-weight="bold">Lệnh</text>
<text x="95.0" y="111.7" font-size="12" fill="#e5e7eb" text-anchor="middle">v, w -&gt; rad/s bánh</text>
<rect x="365" y="72" width="170" height="56" rx="8" fill="#272a2f" stroke="#53b2dd" stroke-width="2"/>
<text x="450.0" y="96.7" font-size="12" fill="#e5e7eb" text-anchor="middle" font-weight="bold">Driver</text>
<text x="450.0" y="111.7" font-size="12" fill="#e5e7eb" text-anchor="middle" style="font-size:11.96px">unwrap, đơn vị SI, tuổi</text>
<rect x="730" y="72" width="150" height="56" rx="8" fill="#272a2f" stroke="#53b2dd" stroke-width="2"/>
<text x="805.0" y="96.7" font-size="12" fill="#e5e7eb" text-anchor="middle" font-weight="bold">Odometry</text>
<text x="805.0" y="111.7" font-size="12" fill="#e5e7eb" text-anchor="middle">x, y, theta (b, r)</text>
<line x1="535" y1="100" x2="730" y2="100" stroke="#e5e7eb" stroke-width="2"/>
<polygon points="730,100 721.0,103.5 721.0,96.5" fill="#e5e7eb"/>
<text x="20" y="180" font-size="12" fill="#9ccd4e" text-anchor="start" font-weight="bold" style="font-size:11.29px">LIÊN KẾT SERIAL 115200 baud: 0x7E + frame nhồi byte + 0x7E</text>
<rect x="20" y="190" width="150" height="50" rx="8" fill="#272a2f" stroke="#9ccd4e" stroke-width="2"/>
<text x="95.0" y="211.7" font-size="12" fill="#e5e7eb" text-anchor="middle" font-weight="bold">frame lệnh</text>
<text x="95.0" y="226.7" font-size="12" fill="#e5e7eb" text-anchor="middle">CRC-8, 100 Hz</text>
<rect x="365" y="190" width="170" height="50" rx="8" fill="#272a2f" stroke="#9ccd4e" stroke-width="2"/>
<text x="450.0" y="211.7" font-size="12" fill="#e5e7eb" text-anchor="middle" font-weight="bold" style="font-size:9.36px">frame trạng thái</text>
<text x="450.0" y="226.7" font-size="12" fill="#e5e7eb" text-anchor="middle" style="font-size:10.71px">số đếm, trạng thái, CRC-8</text>
<line x1="95" y1="128" x2="95" y2="190" stroke="#e5e7eb" stroke-width="2"/>
<polygon points="95,190 91.5,181.0 98.5,181.0" fill="#e5e7eb"/>
<line x1="450" y1="190" x2="450" y2="128" stroke="#e5e7eb" stroke-width="2"/>
<polygon points="450,128 453.5,137.0 446.5,137.0" fill="#e5e7eb"/>
<text x="250" y="166" font-size="11" fill="#9ccd4e" text-anchor="middle">rớt, trễ, lật bit (có seed)</text>
<text x="20" y="284" font-size="12" fill="#d97936" text-anchor="start" font-weight="bold">FIRMWARE (C, tick 1 kHz, cùng mã nguồn build cho ESP32)</text>
<rect x="20" y="294" width="130" height="60" rx="8" fill="#272a2f" stroke="#d97936" stroke-width="2"/>
<text x="85.0" y="320.7" font-size="12" fill="#e5e7eb" text-anchor="middle" font-weight="bold" style="font-size:11.81px">Vòng tốc độ PI</text>
<text x="85.0" y="335.7" font-size="12" fill="#e5e7eb" text-anchor="middle">anti-windup</text>
<rect x="190" y="294" width="110" height="60" rx="8" fill="#272a2f" stroke="#d97936" stroke-width="2"/>
<text x="245.0" y="320.7" font-size="12" fill="#e5e7eb" text-anchor="middle" font-weight="bold">PWM</text>
<text x="245.0" y="335.7" font-size="12" fill="#e5e7eb" text-anchor="middle">[-1, 1]</text>
<rect x="340" y="294" width="130" height="60" rx="8" fill="#272a2f" stroke="#e5e7eb" stroke-width="2"/>
<text x="405.0" y="320.7" font-size="12" fill="#e5e7eb" text-anchor="middle" font-weight="bold" style="font-size:11.17px">Động cơ + bánh</text>
<text x="405.0" y="335.7" font-size="12" fill="#e5e7eb" text-anchor="middle">K=20, tau=80 ms</text>
<rect x="510" y="294" width="130" height="60" rx="8" fill="#272a2f" stroke="#d97936" stroke-width="2"/>
<text x="575.0" y="320.7" font-size="12" fill="#e5e7eb" text-anchor="middle" font-weight="bold" style="font-size:11.07px">Bộ giải mã quad</text>
<text x="575.0" y="335.7" font-size="12" fill="#e5e7eb" text-anchor="middle">x4, tràn uint16</text>
<rect x="680" y="294" width="200" height="60" rx="8" fill="#272a2f" stroke="#d97936" stroke-width="2"/>
<text x="780.0" y="320.7" font-size="12" fill="#e5e7eb" text-anchor="middle" font-weight="bold">Codec frame</text>
<text x="780.0" y="335.7" font-size="12" fill="#e5e7eb" text-anchor="middle">CRC-8, nhồi byte</text>
<line x1="150" y1="324" x2="190" y2="324" stroke="#e5e7eb" stroke-width="2"/>
<polygon points="190,324 181.0,327.5 181.0,320.5" fill="#e5e7eb"/>
<line x1="300" y1="324" x2="340" y2="324" stroke="#e5e7eb" stroke-width="2"/>
<polygon points="340,324 331.0,327.5 331.0,320.5" fill="#e5e7eb"/>
<line x1="470" y1="324" x2="510" y2="324" stroke="#e5e7eb" stroke-width="2"/>
<polygon points="510,324 501.0,327.5 501.0,320.5" fill="#e5e7eb"/>
<line x1="640" y1="324" x2="680" y2="324" stroke="#e5e7eb" stroke-width="2"/>
<polygon points="680,324 671.0,327.5 671.0,320.5" fill="#e5e7eb"/>
<line x1="95" y1="240" x2="95" y2="294" stroke="#e5e7eb" stroke-width="2"/>
<polygon points="95,294 91.5,285.0 98.5,285.0" fill="#e5e7eb"/>
<line x1="780" y1="294" x2="525" y2="225" stroke="#e5e7eb" stroke-width="2"/>
<polygon points="525,225 534.6,224.0 532.8,230.7" fill="#e5e7eb"/>
<rect x="20" y="376" width="200" height="44" rx="8" fill="#272a2f" stroke="#d75c5c" stroke-width="2" stroke-dasharray="5 4"/>
<text x="120.0" y="394.7" font-size="12" fill="#e5e7eb" text-anchor="middle" font-weight="bold">Watchdog</text>
<text x="120.0" y="409.7" font-size="12" fill="#e5e7eb" text-anchor="middle" style="font-size:11.76px">im lặng &gt; 80 ms -&gt; PWM 0</text>
<line x1="120" y1="376" x2="230" y2="354" stroke="#d75c5c" stroke-width="2" stroke-dasharray="5 4"/>
<polygon points="230,354 221.9,359.2 220.5,352.3" fill="#d75c5c"/>
<text x="560" y="404" font-size="12" fill="#e5e7eb" text-anchor="middle">Đặc tả: ổn định &lt; 0.35 s, vọt lố &lt; 10 %, bắt được 96/96 lật bit, PWM về 0 &lt;= 100 ms</text>
</svg>
