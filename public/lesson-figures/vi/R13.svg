<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" font-family="Inter, Arial, sans-serif">
<rect width="720" height="380" fill="#191b1f" rx="12"/>
<text x="24" y="30" fill="#e5e7eb" font-size="16" font-weight="bold">Con lắc ngược và capture point</text>
<text x="400" y="30" fill="#e5e7eb" font-size="16" font-weight="bold">Bảng tiếp xúc (đi bộ, duty 0.6)</text>
<line x1="30" y1="310" x2="370" y2="310" stroke="#e5e7eb" stroke-width="2"/>
<rect x="110" y="310" width="90" height="10" fill="#9ccd4e"/><text x="155" y="338" fill="#9ccd4e" font-size="13" text-anchor="middle" style="font-size:10.27px">bàn chân [gót, mũi]</text>
<line x1="155" y1="310" x2="190" y2="120" stroke="#53b2dd" stroke-width="4"/>
<circle cx="190" cy="120" r="14" fill="#53b2dd"/><text x="212" y="108" fill="#53b2dd" font-size="13">COM (x, z0)</text>
<line x1="190" y1="120" x2="270" y2="120" stroke="#d97936" stroke-width="3"/><polygon points="262,114 274,120 262,126" fill="#d97936"/>
<text x="232" y="140" fill="#d97936" font-size="13" text-anchor="middle">v</text>
<line x1="155" y1="310" x2="155" y2="302" stroke="#e5e7eb"/><text x="150" y="294" fill="#e5e7eb" font-size="13" text-anchor="end">p</text>
<circle cx="285" cy="310" r="7" fill="#d97936"/><text x="285" y="296" fill="#d97936" font-size="13" text-anchor="middle">xi</text>
<line x1="190" y1="320" x2="285" y2="320" stroke="#d97936" stroke-dasharray="4 3"/>
<text x="238" y="354" fill="#d97936" font-size="13" text-anchor="middle">v / w</text>
<text x="40" y="70" fill="#e5e7eb" font-size="13">x'' = w^2 (x - p),  w = sqrt(g / z0)</text>
<text x="40" y="90" fill="#e5e7eb" font-size="13" style="font-size:10.23px">xi = x + v / w;  xi nằm trong bàn chân: dừng được</text>
<text x="420" y="75" fill="#e5e7eb" font-size="13" style="font-size:11.13px">thời gian (phần của chu kỳ)</text>
<g fill="none" stroke="#e5e7eb"><line x1="420" y1="85" x2="700" y2="85"/></g>
<text x="400" y="132" fill="#e5e7eb" font-size="13" text-anchor="end">L</text><text x="400" y="182" fill="#e5e7eb" font-size="13" text-anchor="end">R</text>
<rect x="420" y="112" width="168" height="28" fill="#53b2dd"/><rect x="560" y="162" width="140" height="28" fill="#9ccd4e"/><rect x="420" y="162" width="28" height="28" fill="#9ccd4e"/>
<rect x="560" y="112" width="28" height="28" fill="#d97936" fill-opacity="0.0"/>
<rect x="560" y="206" width="28" height="12" fill="#d97936"/><text x="574" y="236" fill="#d97936" font-size="13" text-anchor="middle">hai chân chống</text>
<rect x="420" y="206" width="28" height="12" fill="#d97936"/>
<text x="420" y="268" fill="#e5e7eb" font-size="13">duty beta = t_stance / T = 0.6</text>
<text x="420" y="290" fill="#e5e7eb" font-size="13">hai chân chống = 2 beta - 1 = 0.2</text>
<text x="420" y="312" fill="#e5e7eb" font-size="13">beta &lt; 0.5: chạy (có pha bay)</text>
<text x="420" y="334" fill="#e5e7eb" font-size="13">Chế độ đổi khi chạm đất / rời đất</text>
</svg>
