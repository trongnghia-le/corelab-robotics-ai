<text x="32" y="430" font-size="14" fill="#a7adb5">Liên kết private với A tĩnh vẫn tới main dưới dạng $&lt;LINK_ONLY:B&gt;: B được link, thư mục include không truyền đi (CMake 3.22).</text>
