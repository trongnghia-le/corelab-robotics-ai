<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" font-family="Inter, sans-serif">
<title>PUBLIC, PRIVATE và INTERFACE truyền gì</title>
<desc>Với thư viện tĩnh A liên kết B: yêu cầu sử dụng của B tới được A và tới main như thế nào.</desc>
<rect width="900" height="440" rx="14" fill="#17181b"/>
<defs><marker id="ahc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#a7adb5"/></marker></defs>
<text x="32" y="44" font-size="22" font-weight="700" fill="#e9e7e3">PUBLIC, PRIVATE và INTERFACE truyền gì</text>
<text x="32" y="70" font-size="14" fill="#a7adb5">main liên kết A, A liên kết B, B có thư mục include inc_b. A là thư viện tĩnh. Scope viết trong target_link_libraries(A &lt;scope&gt; B):</text>
<text x="450" y="108" font-size="17" font-weight="700" fill="#e9e7e3">A biên dịch</text>
<text x="450" y="128" font-size="17" font-weight="700" fill="#e9e7e3">với -I inc_b</text>
<text x="596" y="108" font-size="17" font-weight="700" fill="#e9e7e3">main biên dịch</text>
<text x="596" y="128" font-size="17" font-weight="700" fill="#e9e7e3">với -I inc_b</text>
<text x="742" y="108" font-size="17" font-weight="700" fill="#e9e7e3">main liên kết</text>
<text x="742" y="128" font-size="17" font-weight="700" fill="#e9e7e3">libB.a</text>
