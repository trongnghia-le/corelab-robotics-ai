<text x="490" y="158" font-size="15" fill="#e0904f" text-anchor="start" font-weight="600">b = (3, 7)</text>
<text x="612" y="231" font-size="15" fill="#6fc693" text-anchor="start" font-weight="600">A x̂ = (3.4, 6.8)</text>
<text x="532" y="228" font-size="15" fill="#e08db5" text-anchor="end" font-weight="600">r = b − A x̂</text>
<text x="412" y="342" font-size="15" fill="#e9e7e3" text-anchor="start">Hình chiếu: A x̂ = 3.4 · (1, 2) = (3.4, 6.8)</text>
<text x="412" y="366" font-size="15" fill="#e9e7e3" text-anchor="start">Phần dư: r = (−0.4, 0.2), |r| = 0.447</text>
<text x="412" y="390" font-size="15" fill="#e08db5" text-anchor="start" font-weight="600">Vuông góc: r · (1, 2) = −0.4 + 0.4 = 0</text>
<text x="412" y="414" font-size="15" fill="#e9e7e3" text-anchor="start">Mọi x có x₁ + x₂ = 3.4 đều cho cùng A x̂</text>
