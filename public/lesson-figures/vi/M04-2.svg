<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="Inter, sans-serif">
<title>Bình phương tối thiểu là phép chiếu lên không gian cột</title>
<desc>Các cột của A=[[1,1],[2,2]] sinh ra đường thẳng qua (1,2). Mục tiêu b=(3,7) nằm ngoài đường; hình chiếu của nó là (3.4,6.8) và phần dư (-0.4,0.2) vuông góc với đường.</desc>
<defs><marker id="M042arr-6fc693" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 z" fill="#6fc693"/></marker><marker id="M042arr-e08db5" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 z" fill="#e08db5"/></marker><marker id="M042arr-e0904f" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 z" fill="#e0904f"/></marker></defs>
