<circle cx="180" cy="148" r="5" fill="#e0904f"/>
<circle cx="194.4" cy="155.2" r="5" fill="#6fc693"/>
<text x="166" y="144" font-size="15" fill="#e0904f" text-anchor="end" font-weight="600">b = (3, 7)</text>
