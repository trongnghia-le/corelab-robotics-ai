<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" font-family="Inter, sans-serif">
<title>Sàn không thể giảm của sai số chung</title>
<desc>Phương sai của trung bình n cảm biến khoảng cách bằng nhau với sai số chung phương sai 0.03 m² và nhiễu độc lập phương sai 0.09 m² mỗi cái: phương sai tuyên bố (0.12/n) cứ giảm, phương sai thật 0.03 + 0.09/n dừng ở sàn 0.03 m².</desc>
