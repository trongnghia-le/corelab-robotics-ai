<text x="315.0" y="102.9" font-size="14" fill="#e5e7eb" text-anchor="middle" font-weight="bold" style="font-size:13.93px">Biên dịch: MjModel</text>
<text x="315.0" y="119.9" font-size="14" fill="#e5e7eb" text-anchor="middle" style="font-size:10.92px">khối lượng, quán tính, dt,</text>
<text x="315.0" y="136.9" font-size="14" fill="#e5e7eb" text-anchor="middle" style="font-size:10.92px">trọng lực, giới hạn</text>
