<line x1="640" y1="205" x2="640" y2="260" stroke="#d97936" stroke-width="2"/>
<polygon points="640.0,260.0 636.5,251.7 643.5,251.7" fill="#d97936"/>
<text x="690" y="238" font-size="13" fill="#d97936" text-anchor="middle">quỹ đạo</text>
<text x="25" y="385" font-size="13" fill="#e5e7eb" text-anchor="start">Contact là ràng buộc mềm: hằng số thời gian solref có sàn là 2*dt.</text>
