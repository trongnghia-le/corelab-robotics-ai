<rect x="80.0" y="70" width="200.0" height="250" fill="#9ccd4e" opacity="0.12"/>
<line x1="280.0" y1="70" x2="280.0" y2="320" stroke="#9ccd4e" stroke-width="2" stroke-dasharray="6,4"/>
<text x="165.00000000000003" y="100" fill="#9ccd4e" font-size="14" text-anchor="middle" font-family="Inter, Arial, sans-serif">V̇ &lt; 0 trong |x| &lt; 1</text>
<text x="286.0" y="300" fill="#9ccd4e" font-size="13" text-anchor="start" font-family="Inter, Arial, sans-serif">x = 1</text>
<text x="288" y="150" fill="#d97936" font-size="13" text-anchor="start" font-family="Inter, Arial, sans-serif">V̇ &gt; 0</text>
<text x="288" y="166" fill="#d97936" font-size="13" text-anchor="start" font-family="Inter, Arial, sans-serif" style="font-size:12.16px">vượt quá x = 1</text>
<text x="55.00000000000001" y="250" fill="#d97936" font-size="13" text-anchor="start" font-family="Inter, Arial, sans-serif">V̇ = −x²(1−x)</text>
<text x="80.0" y="143.69230769230768" fill="#e5e7eb" font-size="13" text-anchor="middle" font-family="Inter, Arial, sans-serif">-1</text>
<text x="180.0" y="143.69230769230768" fill="#e5e7eb" font-size="13" text-anchor="middle" font-family="Inter, Arial, sans-serif">0</text>
<text x="280.0" y="143.69230769230768" fill="#e5e7eb" font-size="13" text-anchor="middle" font-family="Inter, Arial, sans-serif">1</text>
<text x="380.0" y="143.69230769230768" fill="#e5e7eb" font-size="13" text-anchor="middle" font-family="Inter, Arial, sans-serif">2</text>
<text x="215.0" y="344" fill="#e5e7eb" font-size="13" text-anchor="middle" font-family="Inter, Arial, sans-serif" style="font-size:10.84px">trạng thái x (V = x²/2)</text>
<rect x="420" y="100" width="110" height="50" rx="6" fill="none" stroke="#53b2dd" stroke-width="2"/>
<text x="475.0" y="122.0" fill="#53b2dd" font-size="13" text-anchor="middle" font-family="Inter, Arial, sans-serif" style="font-size:12.53px">vòng ngoài</text>
<text x="475.0" y="138.0" fill="#53b2dd" font-size="13" text-anchor="middle" font-family="Inter, Arial, sans-serif">v = −k1 θ − k2 ω</text>
<rect x="560" y="100" width="150" height="50" rx="6" fill="none" stroke="#d97936" stroke-width="2"/>
<text x="635.0" y="122.0" fill="#d97936" font-size="13" text-anchor="middle" font-family="Inter, Arial, sans-serif">khử trọng lực</text>
<text x="635.0" y="138.0" fill="#d97936" font-size="13" text-anchor="middle" font-family="Inter, Arial, sans-serif">a = v − g/l·sin θ + bω</text>
<rect x="560" y="210" width="150" height="50" rx="6" fill="none" stroke="#e5e7eb" stroke-width="2"/>
<text x="635.0" y="240.0" fill="#e5e7eb" font-size="14" text-anchor="middle" font-family="Inter, Arial, sans-serif" style="font-size:10.92px">giới hạn a trong ±a_max</text>
<rect x="400" y="210" width="140" height="50" rx="6" fill="none" stroke="#9ccd4e" stroke-width="2"/>
<text x="470.0" y="232.5" fill="#9ccd4e" font-size="12" text-anchor="middle" font-family="Inter, Arial, sans-serif" style="font-size:9.36px">đối tượng</text>
<text x="470.0" y="247.5" fill="#9ccd4e" font-size="12" text-anchor="middle" font-family="Inter, Arial, sans-serif">θ''=g/l·sinθ−bω+a</text>
<line x1="530" y1="125" x2="558" y2="125" stroke="#e5e7eb" stroke-width="2" marker-end="url(#a)"/>
<line x1="635" y1="150" x2="635" y2="208" stroke="#e5e7eb" stroke-width="2" marker-end="url(#a)"/>
<line x1="560" y1="235" x2="532" y2="235" stroke="#e5e7eb" stroke-width="2" marker-end="url(#a)"/>
<path d="M400,235 L385,235 L385,125 L418,125" fill="none" stroke="#e5e7eb" stroke-width="2" marker-end="url(#a)"/>
<text x="430" y="290" fill="#e5e7eb" font-size="13" text-anchor="start" font-family="Inter, Arial, sans-serif" style="font-size:10.53px">mô-men không giới hạn: θ'' = v với mọi θ</text>
<text x="430" y="312" fill="#d97936" font-size="13" text-anchor="start" font-family="Inter, Arial, sans-serif" style="font-size:10.94px">giới hạn mô-men: vùng hút thu hẹp (0.95 rad cho 8)</text>
<text x="412" y="345" fill="#e5e7eb" font-size="13" text-anchor="start" font-family="Inter, Arial, sans-serif" style="font-size:12.56px">sai số mô hình ε: θ'' = ε g/l sin θ + v</text>
</svg>