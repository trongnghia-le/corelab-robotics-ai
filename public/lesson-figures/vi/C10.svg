<text x="24" y="30" fill="#e5e7eb" font-size="16" text-anchor="start" font-family="Inter, Arial, sans-serif" style="font-size:15.89px">Kiểm tra Lyapunov cho x' = −x + x²  và  tuyến tính hóa phản hồi</text>
