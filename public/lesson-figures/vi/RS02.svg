<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" font-family="Inter, Arial, sans-serif">
<rect width="760" height="360" fill="#191b1f" rx="12"/>
<defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#e5e7eb"/></marker></defs>
<text x="20" y="30" fill="#e5e7eb" font-size="16" font-weight="bold" style="font-size:14.7px">Factorial 2x2: trung bình ô (độ chính xác %)</text>
<text x="215" y="62" fill="#e5e7eb" font-size="14" text-anchor="middle">A tắt</text><text x="365" y="62" fill="#e5e7eb" font-size="14" text-anchor="middle">A bật (augmentation)</text>
<text x="130" y="127" fill="#e5e7eb" font-size="14" text-anchor="end">B tắt</text><text x="130" y="237" fill="#e5e7eb" font-size="14" text-anchor="end" style="font-size:12.6px">B bật (thêm dữ liệu)</text>
<g stroke-width="2" fill="none">
<rect x="150" y="75" width="130" height="80" rx="8" stroke="#53b2dd"/><rect x="300" y="75" width="130" height="80" rx="8" stroke="#53b2dd"/>
<rect x="150" y="185" width="130" height="80" rx="8" stroke="#53b2dd"/><rect x="300" y="185" width="130" height="80" rx="8" stroke="#9ccd4e"/>
</g>
<g fill="#e5e7eb" font-size="22" text-anchor="middle"><text x="215" y="125">70.0</text><text x="365" y="125">73.0</text><text x="215" y="235">74.0</text><text x="365" y="235">79.0</text></g>
<g stroke="#d97936" stroke-width="2" fill="none" marker-end="url(#ar)"><path d="M282 115 L298 115"/><path d="M282 225 L298 225"/><path d="M215 157 L215 183"/><path d="M365 157 L365 183"/></g>
<text x="20" y="300" fill="#d97936" font-size="14">E_A = (3 + 5)/2 = 4.0    E_B = (4 + 6)/2 = 5.0    E_AB = 1.0</text>
<text x="20" y="324" fill="#e5e7eb" font-size="14">SE mỗi hiệu ứng = sigma / sqrt(r) = 1.58 / sqrt(5) = 0.71</text>
<text x="500" y="30" fill="#e5e7eb" font-size="16" font-weight="bold">Thiết kế bị nhiễu</text>
<g stroke-width="2" fill="none"><rect x="510" y="75" width="100" height="60" rx="8" stroke="#53b2dd"/><rect x="640" y="75" width="100" height="60" rx="8" stroke="#9ccd4e"/></g>
<text x="560" y="110" fill="#e5e7eb" font-size="14" text-anchor="middle">A=0, B=0</text><text x="690" y="110" fill="#e5e7eb" font-size="14" text-anchor="middle">A=1, B=1</text>
<path d="M612 105 L638 105" stroke="#d97936" stroke-width="2" fill="none" marker-end="url(#ar)"/>
<text x="500" y="175" fill="#d97936" font-size="14" style="font-size:13.25px">+9 điểm, nhưng do đâu?</text>
<text x="500" y="200" fill="#e5e7eb" font-size="13">cột A và B giống hệt:</text><text x="500" y="220" fill="#e5e7eb" font-size="13" style="font-size:11.94px">tương quan = 1, không tách được.</text>
<text x="500" y="262" fill="#9ccd4e" font-size="13">Factorial: tương quan = 0,</text><text x="500" y="282" fill="#9ccd4e" font-size="13" style="font-size:12.69px">thứ tự chạy ngẫu nhiên.</text>
</svg>
