<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 510" font-family="Inter, sans-serif">
<title>Bisect 200 commit: 8 lần chạy test tìm ra commit 137</title>
<desc>Tám hàng, mỗi hàng một lần thăm dò của git bisect, trên các commit từ 1 đến 200 theo thang tuyến tính: khoảng có thể chứa commit xấu đầu tiên giảm một nửa mỗi lần, với các lần thăm dò 100 tốt, 150 xấu, 125 tốt, 137 xấu, 131 tốt, 134 tốt, 135 tốt, 136 tốt, nên commit xấu đầu tiên là 137.</desc>
