<text x="192" y="358" font-size="15" fill="#e9e7e3" text-anchor="start" font-weight="600">θ = 53.13°</text>
<text x="209" y="283" font-size="15" fill="#86abe2" text-anchor="end" font-weight="600">u = (3, 4)</text>
<text x="231" y="412" font-size="15" fill="#6fc693" text-anchor="start" font-weight="600">proj = (3, 0)</text>
<text x="188" y="412" font-size="15" fill="#e0904f" text-anchor="end" font-weight="600">v = (1, 0)</text>
<text x="308" y="293" font-size="15" fill="#e58a80" text-anchor="start" font-weight="600">r = (0, 4)</text>
<rect x="480" y="70" width="388" height="430" rx="10" fill="#22252a"/>
<text x="500" y="100" font-size="17" fill="#a7adb5" text-anchor="start" font-weight="bold">Các con số của Trường hợp 1</text>
<text x="500" y="136" font-size="17" fill="#e9e7e3" text-anchor="start" font-weight="bold">Tích vô hướng và góc</text>
<text x="500" y="168" font-size="15" fill="#e9e7e3" text-anchor="start" font-weight="normal">u·v = 3·1 + 4·0 = 3</text>
<text x="500" y="196" font-size="15" fill="#e9e7e3" text-anchor="start" font-weight="normal">‖u‖ = √(9 + 16) = 5 m</text>
<text x="500" y="224" font-size="15" fill="#e9e7e3" text-anchor="start" font-weight="normal">cos θ = 3 / (5·1) = 0.6</text>
<text x="500" y="252" font-size="15" fill="#e9e7e3" text-anchor="start" font-weight="normal">θ = arccos 0.6 = 53.13°</text>
<text x="500" y="300" font-size="17" fill="#e9e7e3" text-anchor="start" font-weight="bold">Hình chiếu và phần dư</text>
<text x="500" y="332" font-size="15" fill="#6fc693" text-anchor="start" font-weight="normal">t = u·v / v·v = 3 / 1 = 3</text>
<text x="500" y="360" font-size="15" fill="#6fc693" text-anchor="start" font-weight="normal">proj = 3v = (3, 0)</text>
<text x="500" y="388" font-size="15" fill="#e58a80" text-anchor="start" font-weight="normal">r = u − proj = (0, 4)</text>
<text x="500" y="416" font-size="15" fill="#e58a80" text-anchor="start" font-weight="normal">r·v = 0·1 + 4·0 = 0</text>
<text x="500" y="458" font-size="15" fill="#e9e7e3" text-anchor="start" font-weight="600">‖u‖² = 25 = 3² + 4² = ‖proj‖² + ‖r‖²</text>
