<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="Inter, Arial, sans-serif" role="img">
<title>CAP07 lớp tác vụ ngôn ngữ và bộ giám sát an toàn độc lập</title>
<desc>Một lệnh đi qua parser trả về mục tiêu, yêu cầu làm rõ hoặc kết quả không phân tích được. Planner và behaviour tree gọi kỹ năng điều hướng và gắp. Bộ giám sát an toàn riêng đọc heartbeat và đầu vào hazard, có thể chặn chuyển động và dừng firmware trực tiếp.</desc>
<rect width="900" height="470" fill="#191b1f" rx="12"/>
<text x="450" y="28" font-size="17" fill="#e5e7eb" text-anchor="middle" font-weight="bold" style="font-size:14.57px">Văn bản thành mục tiêu thành kế hoạch thành kỹ năng, với bộ giám sát không tin ai trong số đó</text>
<rect x="20" y="70" width="150" height="64" rx="8" fill="#272a2f" stroke="#c095eb" stroke-width="2"/>
<text x="95.0" y="91.8" font-size="11" fill="#e5e7eb" text-anchor="middle" font-weight="bold">Lệnh</text>
<text x="95.0" y="105.8" font-size="11" fill="#e5e7eb" text-anchor="middle">"đặt khối đỏ</text>
<text x="95.0" y="119.8" font-size="11" fill="#e5e7eb" text-anchor="middle" style="font-size:10.67px">vào thùng xanh"</text>
<rect x="215" y="70" width="150" height="64" rx="8" fill="#272a2f" stroke="#c095eb" stroke-width="2"/>
<text x="290.0" y="91.2" font-size="12" fill="#e5e7eb" text-anchor="middle" font-weight="bold">Parser</text>
<text x="290.0" y="106.2" font-size="12" fill="#e5e7eb" text-anchor="middle" style="font-size:10.97px">slot + từ đồng nghĩa</text>
<text x="290.0" y="121.2" font-size="12" fill="#e5e7eb" text-anchor="middle" style="font-size:10.84px">nền không dùng LLM</text>
<rect x="410" y="70" width="150" height="64" rx="8" fill="#272a2f" stroke="#c095eb" stroke-width="2"/>
<text x="485.0" y="91.2" font-size="12" fill="#e5e7eb" text-anchor="middle" font-weight="bold">TaskGoal</text>
<text x="485.0" y="106.2" font-size="12" fill="#e5e7eb" text-anchor="middle">on(cube_red,</text>
<text x="485.0" y="121.2" font-size="12" fill="#e5e7eb" text-anchor="middle">bin_blue)</text>
<rect x="605" y="70" width="130" height="64" rx="8" fill="#272a2f" stroke="#9ccd4e" stroke-width="2"/>
<text x="670.0" y="91.2" font-size="12" fill="#e5e7eb" text-anchor="middle" font-weight="bold">Planner</text>
<text x="670.0" y="106.2" font-size="12" fill="#e5e7eb" text-anchor="middle">BFS / STRIPS</text>
<text x="670.0" y="121.2" font-size="12" fill="#e5e7eb" text-anchor="middle" style="font-size:9.36px">ít hành động nhất</text>
<rect x="770" y="70" width="110" height="64" rx="8" fill="#272a2f" stroke="#9ccd4e" stroke-width="2"/>
<text x="825.0" y="91.2" font-size="12" fill="#e5e7eb" text-anchor="middle" font-weight="bold">Behaviour</text>
<text x="825.0" y="106.2" font-size="12" fill="#e5e7eb" text-anchor="middle">tree</text>
<text x="825.0" y="121.2" font-size="12" fill="#e5e7eb" text-anchor="middle" style="font-size:10.76px">thử lại &lt;= 2</text>
<line x1="170" y1="102" x2="215" y2="102" stroke="#e5e7eb" stroke-width="2"/>
<polygon points="215,102 206.0,105.5 206.0,98.5" fill="#e5e7eb"/>
<line x1="365" y1="102" x2="410" y2="102" stroke="#e5e7eb" stroke-width="2"/>
<polygon points="410,102 401.0,105.5 401.0,98.5" fill="#e5e7eb"/>
<line x1="560" y1="102" x2="605" y2="102" stroke="#e5e7eb" stroke-width="2"/>
<polygon points="605,102 596.0,105.5 596.0,98.5" fill="#e5e7eb"/>
<line x1="735" y1="102" x2="770" y2="102" stroke="#e5e7eb" stroke-width="2"/>
<polygon points="770,102 761.0,105.5 761.0,98.5" fill="#e5e7eb"/>
<rect x="215" y="175" width="150" height="50" rx="8" fill="#272a2f" stroke="#d3952d" stroke-width="2"/>
<text x="290.0" y="196.8" font-size="11" fill="#e5e7eb" text-anchor="middle" font-weight="bold" style="font-size:8.58px">Làm rõ / Không phân tích được</text>
<text x="290.0" y="210.8" font-size="11" fill="#e5e7eb" text-anchor="middle">hỏi, không đoán</text>
<line x1="290" y1="134" x2="290" y2="175" stroke="#e5e7eb" stroke-width="2" stroke-dasharray="5 4"/>
<polygon points="290,175 286.5,166.0 293.5,166.0" fill="#e5e7eb"/>
<line x1="215" y1="200" x2="95" y2="200" stroke="#e5e7eb" stroke-width="2" stroke-dasharray="5 4"/>
<polygon points="95,200 104.0,196.5 104.0,203.5" fill="#e5e7eb"/>
<line x1="95" y1="200" x2="95" y2="134" stroke="#e5e7eb" stroke-width="2" stroke-dasharray="5 4"/>
<polygon points="95,134 98.5,143.0 91.5,143.0" fill="#e5e7eb"/>
<rect x="770" y="175" width="110" height="50" rx="8" fill="#272a2f" stroke="#53b2dd" stroke-width="2"/>
<text x="825.0" y="196.8" font-size="11" fill="#e5e7eb" text-anchor="middle" font-weight="bold" style="font-size:8.58px">Kỹ năng</text>
<text x="825.0" y="210.8" font-size="11" fill="#e5e7eb" text-anchor="middle">nav, grasp</text>
<line x1="825" y1="134" x2="825" y2="175" stroke="#e5e7eb" stroke-width="2"/>
<polygon points="825,175 821.5,166.0 828.5,166.0" fill="#e5e7eb"/>
<rect x="20" y="285" width="640" height="120" rx="8" fill="#272a2f" stroke="#e58484" stroke-width="2" stroke-dasharray="5 4"/>
<text x="340.0" y="326.7" font-size="12" fill="#e5e7eb" text-anchor="middle" font-weight="bold">Bộ giám sát an toàn (process riêng, 100 Hz, chỉ stdlib)</text>
<text x="340.0" y="341.7" font-size="12" fill="#e5e7eb" text-anchor="middle"></text>
<text x="340.0" y="356.7" font-size="12" fill="#e5e7eb" text-anchor="middle" style="font-size:11.83px">đầu vào: khoảng cách người, tuổi link, tuổi perception, heartbeat planner,</text>
<text x="340.0" y="371.7" font-size="12" fill="#e5e7eb" text-anchor="middle">cờ estimator, mô-men, pin, e-stop, tốc độ lệnh, không gian làm việc</text>
<rect x="700" y="285" width="180" height="56" rx="8" fill="#272a2f" stroke="#e58484" stroke-width="2"/>
<text x="790.0" y="309.9" font-size="11" fill="#e5e7eb" text-anchor="middle" font-weight="bold" style="font-size:10.62px">Lệnh được chuyển tiếp</text>
<text x="790.0" y="323.9" font-size="11" fill="#e5e7eb" text-anchor="middle">v = 0, giữ tay khi HOLD</text>
<rect x="700" y="355" width="180" height="50" rx="8" fill="#272a2f" stroke="#d3952d" stroke-width="2"/>
<text x="790.0" y="376.9" font-size="11" fill="#e5e7eb" text-anchor="middle" font-weight="bold">Watchdog firmware</text>
<text x="790.0" y="390.9" font-size="11" fill="#e5e7eb" text-anchor="middle" style="font-size:9.52px">frame dừng trực tiếp</text>
<line x1="660" y1="313" x2="700" y2="313" stroke="#e5e7eb" stroke-width="2"/>
<polygon points="700,313 691.0,316.5 691.0,309.5" fill="#e5e7eb"/>
<line x1="660" y1="380" x2="700" y2="380" stroke="#e5e7eb" stroke-width="2"/>
<polygon points="700,380 691.0,383.5 691.0,376.5" fill="#e5e7eb"/>
<line x1="825" y1="225" x2="825" y2="285" stroke="#e5e7eb" stroke-width="2" stroke-dasharray="5 4"/>
<polygon points="825,285 821.5,276.0 828.5,276.0" fill="#e5e7eb"/>
<text x="832" y="258" font-size="11" fill="#a0a4ab" text-anchor="start">cmd</text>
<rect x="20" y="420" width="860" height="34" rx="8" fill="#272a2f" stroke="#a0a4ab" stroke-width="2"/>
<text x="450.0" y="440.9" font-size="11" fill="#e5e7eb" text-anchor="middle" font-weight="bold" style="font-size:9.31px">Test chèn hazard: 10 hazard x thời gian về trạng thái an toàn (150 ms e-stop, 300 ms các loại khác). Bảo vệ một MÔ PHỎNG. Không phải an toàn được chứng nhận.</text>
</svg>
