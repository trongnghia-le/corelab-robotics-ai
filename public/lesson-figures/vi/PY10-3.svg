<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="Inter, sans-serif">
<title>Thứ tự các sự kiện khi một class được tạo</title>
<desc>Sáu bước đánh số: chọn metaclass, __prepare__, chạy thân class, type.__new__ với __set_name__ rồi __init_subclass__, meta.__init__, decorator của class; kèm trace của ví dụ cho các bước xuất hiện trong đó.</desc>
<rect width="900" height="560" rx="14" fill="#17181b"/>

<text x="32" y="44" font-size="22" font-weight="bold" fill="#e9e7e3">Câu lệnh class làm gì, theo thứ tự</text>
<rect x="32" y="72" width="836" height="468" rx="10" fill="#22252a"/>
<text x="52" y="102" font-size="17" font-weight="bold" fill="#e9e7e3">điều xảy ra</text>
<text x="640" y="102" font-size="17" font-weight="bold" fill="#e9e7e3">trace của ví dụ trong bài</text>
<circle cx="66.0" cy="152.0" r="16" fill="#22252a" stroke="#ae9ce6" stroke-width="2"/>
<text x="66" y="158" font-size="15" font-weight="bold" text-anchor="middle" fill="#ae9ce6">1</text>
<text x="96" y="148" font-size="15" font-weight="600" fill="#e9e7e3">chọn metaclass</text>
<text x="96" y="170" font-size="14" fill="#a7adb5">từ metaclass= và các base</text>
<text x="640" y="158" font-size="15" fill="#a7adb5">-</text>
<line x1="66" y1="168" x2="66.0" y2="176.0" stroke="#a7adb5" stroke-width="2"/>
<circle cx="66.0" cy="220.0" r="16" fill="#22252a" stroke="#ae9ce6" stroke-width="2"/>
<text x="66" y="226" font-size="15" font-weight="bold" text-anchor="middle" fill="#ae9ce6">2</text>
<text x="96" y="216" font-size="15" font-weight="600" fill="#e9e7e3">__prepare__</text>
<text x="96" y="238" font-size="14" fill="#a7adb5">trả về namespace rỗng</text>
<text x="640" y="226" font-size="15" fill="#a7adb5">-</text>
<line x1="66" y1="236" x2="66.0" y2="244.0" stroke="#a7adb5" stroke-width="2"/>
<circle cx="66.0" cy="288.0" r="16" fill="#22252a" stroke="#6cc6ba" stroke-width="2"/>
<text x="66" y="294" font-size="15" font-weight="bold" text-anchor="middle" fill="#6cc6ba">3</text>
<text x="96" y="284" font-size="15" font-weight="600" fill="#e9e7e3">chạy thân class</text>
<text x="96" y="306" font-size="14" fill="#a7adb5">điền vào namespace</text>
<text x="640" y="294" font-size="15" fill="#e9e7e3">body</text>
<line x1="66" y1="304" x2="66.0" y2="312.0" stroke="#a7adb5" stroke-width="2"/>
<circle cx="66.0" cy="356.0" r="16" fill="#22252a" stroke="#e0904f" stroke-width="2"/>
<text x="66" y="362" font-size="15" font-weight="bold" text-anchor="middle" fill="#e0904f">4</text>
<text x="96" y="352" font-size="15" font-weight="600" fill="#e9e7e3">type.__new__</text>
<text x="96" y="374" font-size="14" fill="#a7adb5">__set_name__ cho từng thuộc tính, rồi __init_subclass__ của cha</text>
<text x="640" y="362" font-size="15" fill="#e9e7e3">set_name x, init_subclass Pose</text>
<line x1="66" y1="372" x2="66.0" y2="380.0" stroke="#a7adb5" stroke-width="2"/>
<circle cx="66.0" cy="424.0" r="16" fill="#22252a" stroke="#e0904f" stroke-width="2"/>
<text x="66" y="430" font-size="15" font-weight="bold" text-anchor="middle" fill="#e0904f">5</text>
<text x="96" y="420" font-size="15" font-weight="600" fill="#e9e7e3">meta.__init__</text>
<text x="96" y="442" font-size="14" fill="#a7adb5">chạy trên class đã hoàn chỉnh</text>
<text x="640" y="430" font-size="15" fill="#a7adb5">-</text>
<line x1="66" y1="440" x2="66.0" y2="448.0" stroke="#a7adb5" stroke-width="2"/>
<circle cx="66.0" cy="492.0" r="16" fill="#22252a" stroke="#e0c169" stroke-width="2"/>
<text x="66" y="498" font-size="15" font-weight="bold" text-anchor="middle" fill="#e0c169">6</text>
<text x="96" y="488" font-size="15" font-weight="600" fill="#e9e7e3">decorator của class</text>
<text x="96" y="510" font-size="14" fill="#a7adb5">rồi tên được gán</text>
<text x="640" y="498" font-size="15" fill="#e9e7e3">decorator Pose</text>
<line x1="620" y1="116" x2="620.0" y2="524.0" stroke="#3d4148" stroke-width="1.5"/>
</svg>
