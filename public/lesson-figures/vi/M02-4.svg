<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" font-family="Inter, sans-serif">
<title>Điểm gần nhất trên một đoạn thẳng</title>
<desc>Đoạn từ a=(1,1) đến b=(7,5): p=(6,1) chiếu xuống q với sai số ngang 2.77 m; p2=(10,6) có theta sao 1.42 và bị chặn về b cách 3.16 m.</desc>
<rect width="900" height="480" rx="14" fill="#17181b"/>
<text x="32" y="44" font-size="22" fill="#e9e7e3" text-anchor="start" font-weight="bold">Điểm gần nhất trên một đoạn thẳng</text>
<rect x="32" y="70" width="424" height="380" rx="10" fill="#22252a"/>
<text x="52" y="100" font-size="17" fill="#a7adb5" text-anchor="start" font-weight="bold">Trường hợp 2 vẽ đúng tỉ lệ</text>
<line x1="88.0" y1="368.0" x2="88.0" y2="374.0" stroke="#a7adb5" stroke-width="2" stroke-linecap="round"/>
<text x="88" y="388" font-size="14" fill="#a7adb5" text-anchor="middle" font-weight="normal">0</text>
<line x1="140.0" y1="368.0" x2="140.0" y2="374.0" stroke="#a7adb5" stroke-width="2" stroke-linecap="round"/>
<text x="140" y="388" font-size="14" fill="#a7adb5" text-anchor="middle" font-weight="normal">2</text>
<line x1="192.0" y1="368.0" x2="192.0" y2="374.0" stroke="#a7adb5" stroke-width="2" stroke-linecap="round"/>
<text x="192" y="388" font-size="14" fill="#a7adb5" text-anchor="middle" font-weight="normal">4</text>
<line x1="244.0" y1="368.0" x2="244.0" y2="374.0" stroke="#a7adb5" stroke-width="2" stroke-linecap="round"/>
<text x="244" y="388" font-size="14" fill="#a7adb5" text-anchor="middle" font-weight="normal">6</text>
<line x1="296.0" y1="368.0" x2="296.0" y2="374.0" stroke="#a7adb5" stroke-width="2" stroke-linecap="round"/>
<text x="296" y="388" font-size="14" fill="#a7adb5" text-anchor="middle" font-weight="normal">8</text>
<line x1="348.0" y1="368.0" x2="348.0" y2="374.0" stroke="#a7adb5" stroke-width="2" stroke-linecap="round"/>
<text x="348" y="388" font-size="14" fill="#a7adb5" text-anchor="middle" font-weight="normal">10</text>
<line x1="82.0" y1="342.0" x2="88.0" y2="342.0" stroke="#a7adb5" stroke-width="2" stroke-linecap="round"/>
<text x="78" y="347" font-size="14" fill="#a7adb5" text-anchor="end" font-weight="normal">0</text>
<line x1="82.0" y1="290.0" x2="88.0" y2="290.0" stroke="#a7adb5" stroke-width="2" stroke-linecap="round"/>
<text x="78" y="295" font-size="14" fill="#a7adb5" text-anchor="end" font-weight="normal">2</text>
<line x1="82.0" y1="238.0" x2="88.0" y2="238.0" stroke="#a7adb5" stroke-width="2" stroke-linecap="round"/>
<text x="78" y="243" font-size="14" fill="#a7adb5" text-anchor="end" font-weight="normal">4</text>
<line x1="82.0" y1="186.0" x2="88.0" y2="186.0" stroke="#a7adb5" stroke-width="2" stroke-linecap="round"/>
<text x="78" y="191" font-size="14" fill="#a7adb5" text-anchor="end" font-weight="normal">6</text>
<line x1="82.0" y1="134.0" x2="88.0" y2="134.0" stroke="#a7adb5" stroke-width="2" stroke-linecap="round"/>
<text x="78" y="139" font-size="14" fill="#a7adb5" text-anchor="end" font-weight="normal">8</text>
<line x1="88.0" y1="368.0" x2="374.0" y2="368.0" stroke="#a7adb5" stroke-width="2" stroke-linecap="round"/>
<line x1="88.0" y1="134.0" x2="88.0" y2="368.0" stroke="#a7adb5" stroke-width="2" stroke-linecap="round"/>
<text x="374" y="410" font-size="15" fill="#a7adb5" text-anchor="end" font-weight="normal">x (m)</text>
<text x="88" y="122" font-size="15" fill="#a7adb5" text-anchor="start" font-weight="normal">y (m)</text>
<line x1="270.0" y1="212.0" x2="336.0" y2="168.0" stroke="#a7adb5" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="3 5"/>
<line x1="114.0" y1="316.0" x2="270.0" y2="212.0" stroke="#86abe2" stroke-width="3.5" stroke-linecap="round"/>
<line x1="244.0" y1="316.0" x2="204.0" y2="256.0" stroke="#e58a80" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="7 6"/>
<line x1="348.0" y1="186.0" x2="270.0" y2="212.0" stroke="#e0c169" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="7 6"/>
<path d="M213.2 249.9 L219.3 259.1 L210.1 265.2" fill="none" stroke="#e9e7e3" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="114.0" cy="316.0" r="6" fill="#86abe2"/>
<circle cx="270.0" cy="212.0" r="6" fill="#86abe2"/>
<circle cx="244.0" cy="316.0" r="7" fill="#e0904f"/>
<circle cx="204.0" cy="256.0" r="7" fill="#6fc693"/>
<circle cx="348.0" cy="186.0" r="7" fill="#e0c169"/>
<circle cx="336.0" cy="168.0" r="6" fill="#22252a" stroke="#a7adb5" stroke-width="2"/>
<text x="120" y="340" font-size="15" fill="#86abe2" text-anchor="start" font-weight="normal">a (1, 1)</text>
<text x="260" y="200" font-size="15" fill="#86abe2" text-anchor="end" font-weight="normal">b (7, 5)</text>
<text x="254" y="340" font-size="15" fill="#e0904f" text-anchor="start" font-weight="normal">p (6, 1)</text>
<text x="190" y="246" font-size="15" fill="#6fc693" text-anchor="end" font-weight="600">q (4.46, 3.31)</text>
<text x="236" y="292" font-size="15" fill="#e58a80" text-anchor="start" font-weight="600">2.77 m</text>
<text x="358" y="191" font-size="15" fill="#e0c169" text-anchor="start" font-weight="normal">p₂ (10, 6)</text>
<text x="319" y="223" font-size="15" fill="#e0c169" text-anchor="start" font-weight="600">3.16 m</text>
<text x="324" y="162" font-size="14" fill="#a7adb5" text-anchor="end" font-weight="normal">chân, θ* = 1.42</text>
<rect x="480" y="70" width="388" height="380" rx="10" fill="#22252a"/>
<text x="500" y="100" font-size="17" fill="#a7adb5" text-anchor="start" font-weight="bold">Các con số của Trường hợp 2</text>
<text x="500" y="128" font-size="15" fill="#e9e7e3" text-anchor="start" font-weight="600">d = b − a = (6, 4),  d·d = 52</text>
<text x="500" y="160" font-size="17" fill="#e0904f" text-anchor="start" font-weight="bold">p = (6, 1)</text>
<text x="500" y="190" font-size="15" fill="#e9e7e3" text-anchor="start" font-weight="normal">θ* = (p−a)·d / d·d = 30/52 = 0.577</text>
<text x="500" y="216" font-size="15" fill="#e9e7e3" text-anchor="start" font-weight="normal">q = a + θ* d = (4.46, 3.31)</text>
<text x="500" y="242" font-size="15" fill="#e9e7e3" text-anchor="start" font-weight="normal">‖p − q‖ = 2.77 m</text>
<text x="500" y="268" font-size="15" fill="#e9e7e3" text-anchor="start" font-weight="normal">(p − q)·d = 0</text>
<text x="500" y="300" font-size="17" fill="#e0c169" text-anchor="start" font-weight="bold">p₂ = (10, 6)</text>
<text x="500" y="330" font-size="15" fill="#e9e7e3" text-anchor="start" font-weight="normal">θ* = 74/52 = 1.42 &gt; 1</text>
<text x="500" y="354" font-size="15" fill="#e9e7e3" text-anchor="start" font-weight="normal">chặn θ = 1: điểm gần nhất là b</text>
<text x="500" y="378" font-size="15" fill="#e9e7e3" text-anchor="start" font-weight="normal">‖p₂ − b‖ = 3.16 m</text>
<text x="500" y="402" font-size="15" fill="#e9e7e3" text-anchor="start" font-weight="normal">khoảng cách đến đường thẳng: 0.83 m</text>
<text x="500" y="426" font-size="15" fill="#e9e7e3" text-anchor="start" font-weight="normal">(không phải đáp án)</text>
</svg>
