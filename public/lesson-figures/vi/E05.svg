<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" font-family="Inter, Arial, sans-serif">
<rect width="760" height="380" fill="#191b1f" rx="12"/>
<text x="30" y="30" fill="#e5e7eb" font-size="16" font-weight="bold">Bắt đầu (robot ở A, tay trống)</text>
<rect x="30" y="50" width="120" height="90" rx="8" fill="#272a2f" stroke="#53b2dd" stroke-width="2"/><text x="90" y="72" text-anchor="middle" fill="#e5e7eb" font-size="15" font-weight="bold">A</text><text x="90" y="96" text-anchor="middle" fill="#9ccd4e" font-size="14">cốc</text><text x="90" y="116" text-anchor="middle" fill="#9ccd4e" font-size="14">robot</text><rect x="170" y="50" width="120" height="90" rx="8" fill="#272a2f" stroke="#53b2dd" stroke-width="2"/><text x="230" y="72" text-anchor="middle" fill="#e5e7eb" font-size="15" font-weight="bold">B</text><text x="230" y="96" text-anchor="middle" fill="#9ccd4e" font-size="14">hộp</text><rect x="310" y="50" width="120" height="90" rx="8" fill="#272a2f" stroke="#9ccd4e" stroke-width="2"/><text x="370" y="72" text-anchor="middle" fill="#e5e7eb" font-size="15" font-weight="bold">C</text><text x="370" y="96" text-anchor="middle" fill="#9ccd4e" font-size="14" style="font-size:11.22px">trống</text>
<text x="30" y="185" fill="#e5e7eb" font-size="16" font-weight="bold" style="font-size:12.48px">Mục tiêu</text>
<rect x="30" y="200" width="120" height="90" rx="8" fill="#272a2f" stroke="#9ccd4e" stroke-width="2"/><text x="90" y="222" text-anchor="middle" fill="#e5e7eb" font-size="15" font-weight="bold">A</text><text x="90" y="246" text-anchor="middle" fill="#9ccd4e" font-size="14" style="font-size:11.22px">trống</text><rect x="170" y="200" width="120" height="90" rx="8" fill="#272a2f" stroke="#53b2dd" stroke-width="2"/><text x="230" y="222" text-anchor="middle" fill="#e5e7eb" font-size="15" font-weight="bold">B</text><text x="230" y="246" text-anchor="middle" fill="#9ccd4e" font-size="14">cốc</text><rect x="310" y="200" width="120" height="90" rx="8" fill="#272a2f" stroke="#53b2dd" stroke-width="2"/><text x="370" y="222" text-anchor="middle" fill="#e5e7eb" font-size="15" font-weight="bold">C</text><text x="370" y="246" text-anchor="middle" fill="#9ccd4e" font-size="14">hộp</text>
<text x="470" y="30" fill="#e5e7eb" font-size="16" font-weight="bold" style="font-size:13.71px">Kế hoạch ngắn nhất (BFS, 8 bước)</text>
<text x="470" y="88" fill="#e5e7eb" font-size="15"><tspan fill="#d97936">1.</tspan> move(A,B)</text><text x="470" y="116" fill="#e5e7eb" font-size="15"><tspan fill="#d97936">2.</tspan> pick(box,B)</text><text x="470" y="144" fill="#e5e7eb" font-size="15"><tspan fill="#d97936">3.</tspan> move(B,C)</text><text x="470" y="172" fill="#e5e7eb" font-size="15"><tspan fill="#d97936">4.</tspan> place(box,C)</text><text x="470" y="200" fill="#e5e7eb" font-size="15"><tspan fill="#d97936">5.</tspan> move(C,A)</text><text x="470" y="228" fill="#e5e7eb" font-size="15"><tspan fill="#d97936">6.</tspan> pick(cup,A)</text><text x="470" y="256" fill="#e5e7eb" font-size="15"><tspan fill="#d97936">7.</tspan> move(A,B)</text><text x="470" y="284" fill="#e5e7eb" font-size="15"><tspan fill="#d97936">8.</tspan> place(cup,B)</text>
<text x="30" y="335" fill="#e5e7eb" font-size="14" style="font-size:12.13px">Áp dụng toán tử: trạng thái mới = (trạng thái trừ danh sách xóa) cộng danh sách thêm.</text>
<text x="30" y="358" fill="#e5e7eb" font-size="14">pick(box,B): cần at_robot(B), at(box,B), handempty; thêm holding(box), free(B).</text>
</svg>