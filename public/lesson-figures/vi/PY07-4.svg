<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 410" font-family="Inter, sans-serif">
<title>Test nào giết mutant nào? (ca giải 1)</title>
<desc>Ma trận bốn test với bốn phiên bản lỗi của mean: [0, 0] không giết cái nào, [2, 4] giết bản tổng và bản phần tử đầu, [1, 3, 8] giết ba bản, và test danh sách rỗng chỉ giết bản trả về 0.</desc>
<defs></defs>
<rect width="900" height="410" rx="14" fill="#17181b"/>
<text x="32" y="44" font-size="22" fill="#e9e7e3" text-anchor="start" font-weight="bold">Test nào giết mutant nào? (ca giải 1)</text>
<text x="32" y="104" font-size="14" fill="#a7adb5" text-anchor="start">đầu vào → kỳ vọng</text>
<text x="308" y="92" font-size="17" fill="#e0904f" text-anchor="middle" font-weight="bold">A</text>
<text x="308" y="112" font-size="14" fill="#a7adb5" text-anchor="middle">tổng</text>
<text x="432" y="92" font-size="17" fill="#e0904f" text-anchor="middle" font-weight="bold">B</text>
<text x="432" y="112" font-size="14" fill="#a7adb5" text-anchor="middle">phần tử đầu</text>
<text x="556" y="92" font-size="17" fill="#e0904f" text-anchor="middle" font-weight="bold">C</text>
<text x="556" y="112" font-size="14" fill="#a7adb5" text-anchor="middle">(đầu+cuối)/2</text>
<text x="680" y="92" font-size="17" fill="#e0904f" text-anchor="middle" font-weight="bold">D</text>
<text x="680" y="112" font-size="14" fill="#a7adb5" text-anchor="middle">0 khi rỗng</text>
<text x="868" y="104" font-size="14" fill="#a7adb5" text-anchor="end">giết</text>
<text x="32" y="162" font-size="15" fill="#e9e7e3" text-anchor="start" font-weight="600">[0, 0] → 0</text>
<rect x="250" y="128" width="116" height="48" rx="6" fill="#22252a" stroke="#3d4148" stroke-width="1.5"/>
<text x="308" y="158" font-size="15" fill="#a7adb5" text-anchor="middle">qua</text>
<rect x="374" y="128" width="116" height="48" rx="6" fill="#22252a" stroke="#3d4148" stroke-width="1.5"/>
<text x="432" y="158" font-size="15" fill="#a7adb5" text-anchor="middle">qua</text>
<rect x="498" y="128" width="116" height="48" rx="6" fill="#22252a" stroke="#3d4148" stroke-width="1.5"/>
<text x="556" y="158" font-size="15" fill="#a7adb5" text-anchor="middle">qua</text>
<rect x="622" y="128" width="116" height="48" rx="6" fill="#22252a" stroke="#3d4148" stroke-width="1.5"/>
<text x="680" y="158" font-size="15" fill="#a7adb5" text-anchor="middle">qua</text>
<text x="868" y="162" font-size="17" fill="#e9e7e3" text-anchor="end" font-weight="bold">0</text>
<text x="32" y="222" font-size="15" fill="#e9e7e3" text-anchor="start" font-weight="600">[2, 4] → 3</text>
<rect x="250" y="188" width="116" height="48" rx="6" fill="#3a2a28" stroke="#e58a80" stroke-width="2"/>
<text x="308" y="218" font-size="15" fill="#e58a80" text-anchor="middle" font-weight="600">trả 6</text>
<rect x="374" y="188" width="116" height="48" rx="6" fill="#3a2a28" stroke="#e58a80" stroke-width="2"/>
<text x="432" y="218" font-size="15" fill="#e58a80" text-anchor="middle" font-weight="600">trả 2</text>
<rect x="498" y="188" width="116" height="48" rx="6" fill="#22252a" stroke="#3d4148" stroke-width="1.5"/>
<text x="556" y="218" font-size="15" fill="#a7adb5" text-anchor="middle">qua</text>
<rect x="622" y="188" width="116" height="48" rx="6" fill="#22252a" stroke="#3d4148" stroke-width="1.5"/>
<text x="680" y="218" font-size="15" fill="#a7adb5" text-anchor="middle">qua</text>
<text x="868" y="222" font-size="17" fill="#e9e7e3" text-anchor="end" font-weight="bold">2</text>
<text x="32" y="282" font-size="15" fill="#e9e7e3" text-anchor="start" font-weight="600">[1, 3, 8] → 4</text>
<rect x="250" y="248" width="116" height="48" rx="6" fill="#3a2a28" stroke="#e58a80" stroke-width="2"/>
<text x="308" y="278" font-size="15" fill="#e58a80" text-anchor="middle" font-weight="600">trả 12</text>
<rect x="374" y="248" width="116" height="48" rx="6" fill="#3a2a28" stroke="#e58a80" stroke-width="2"/>
<text x="432" y="278" font-size="15" fill="#e58a80" text-anchor="middle" font-weight="600">trả 1</text>
<rect x="498" y="248" width="116" height="48" rx="6" fill="#3a2a28" stroke="#e58a80" stroke-width="2"/>
<text x="556" y="278" font-size="15" fill="#e58a80" text-anchor="middle" font-weight="600">trả 4.5</text>
<rect x="622" y="248" width="116" height="48" rx="6" fill="#22252a" stroke="#3d4148" stroke-width="1.5"/>
<text x="680" y="278" font-size="15" fill="#a7adb5" text-anchor="middle">qua</text>
<text x="868" y="282" font-size="17" fill="#e9e7e3" text-anchor="end" font-weight="bold">3</text>
<text x="32" y="342" font-size="15" fill="#e9e7e3" text-anchor="start" font-weight="600">[] → ValueError</text>
<rect x="250" y="308" width="116" height="48" rx="6" fill="#22252a" stroke="#3d4148" stroke-width="1.5"/>
<text x="308" y="338" font-size="15" fill="#a7adb5" text-anchor="middle">qua</text>
<rect x="374" y="308" width="116" height="48" rx="6" fill="#22252a" stroke="#3d4148" stroke-width="1.5"/>
<text x="432" y="338" font-size="15" fill="#a7adb5" text-anchor="middle">qua</text>
<rect x="498" y="308" width="116" height="48" rx="6" fill="#22252a" stroke="#3d4148" stroke-width="1.5"/>
<text x="556" y="338" font-size="15" fill="#a7adb5" text-anchor="middle">qua</text>
<rect x="622" y="308" width="116" height="48" rx="6" fill="#3a2a28" stroke="#e58a80" stroke-width="2"/>
<text x="680" y="338" font-size="15" fill="#e58a80" text-anchor="middle" font-weight="600">trả 0</text>
<text x="868" y="342" font-size="17" fill="#e9e7e3" text-anchor="end" font-weight="bold">1</text>
<text x="32" y="402" font-size="15" fill="#6fc693" text-anchor="start" font-weight="600">Bộ nhỏ nhất giết cả bốn: [1, 3, 8] → 4 và [] → ValueError.</text>
</svg>
