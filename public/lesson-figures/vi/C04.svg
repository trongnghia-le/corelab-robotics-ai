<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400">
<rect width="760" height="400" fill="#191b1f" rx="12"/>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#e5e7eb"/></marker></defs>
<text x="24" y="32" fill="#e5e7eb" font-size="16" text-anchor="start" font-family="Inter, Arial, sans-serif">Hai bể nối tiếp: x1' = −x1 + u,  x2' = x1 − 2·x2</text>
<rect x="60" y="110" width="130" height="120" rx="6" fill="none" stroke="#53b2dd" stroke-width="2"/>
<text x="125.0" y="166.5" fill="#53b2dd" font-size="14" text-anchor="middle" font-family="Inter, Arial, sans-serif">bể 1</text>
<text x="125.0" y="183.5" fill="#53b2dd" font-size="14" text-anchor="middle" font-family="Inter, Arial, sans-serif">x1</text>
<rect x="300" y="170" width="130" height="120" rx="6" fill="none" stroke="#9ccd4e" stroke-width="2"/>
<text x="365.0" y="226.5" fill="#9ccd4e" font-size="14" text-anchor="middle" font-family="Inter, Arial, sans-serif">bể 2</text>
<text x="365.0" y="243.5" fill="#9ccd4e" font-size="14" text-anchor="middle" font-family="Inter, Arial, sans-serif">x2</text>
<line x1="125" y1="50" x2="125" y2="108" stroke="#d97936" stroke-width="2" marker-end="url(#a)"/>
<text x="135" y="70" fill="#d97936" font-size="14" text-anchor="start" font-family="Inter, Arial, sans-serif">bơm u</text>
<line x1="190" y1="200" x2="298" y2="230" stroke="#e5e7eb" stroke-width="2" marker-end="url(#a)"/>
<text x="200" y="196" fill="#e5e7eb" font-size="13" text-anchor="start" font-family="Inter, Arial, sans-serif" style="font-size:10.14px">lưu lượng x1</text>
<line x1="430" y1="250" x2="500" y2="250" stroke="#e5e7eb" stroke-width="2" marker-end="url(#a)"/>
<text x="436" y="244" fill="#e5e7eb" font-size="13" text-anchor="start" font-family="Inter, Arial, sans-serif">ra 2·x2</text>
<text x="60" y="258" fill="#d97936" font-size="13" text-anchor="start" font-family="Inter, Arial, sans-serif">cảm biến ở bể 1: y = x1</text>
<text x="60" y="278" fill="#d97936" font-size="13" text-anchor="start" font-family="Inter, Arial, sans-serif" style="font-size:11.15px">x2 không bao giờ đến y</text>
<text x="300" y="318" fill="#9ccd4e" font-size="13" text-anchor="start" font-family="Inter, Arial, sans-serif">cảm biến ở bể 2: y = x2</text>
<text x="300" y="338" fill="#9ccd4e" font-size="13" text-anchor="start" font-family="Inter, Arial, sans-serif" style="font-size:10.8px">x1 rò sang x2: quan sát được</text>
<rect x="520" y="60" width="220" height="300" rx="8" fill="none" stroke="#e5e7eb" stroke-width="2"/>
<text x="630" y="86" fill="#e5e7eb" font-size="15" text-anchor="middle" font-family="Inter, Arial, sans-serif" style="font-size:13.37px">Kiểm tra hạng (n = 2)</text>
<text x="536" y="118" fill="#53b2dd" font-size="14" text-anchor="start" font-family="Inter, Arial, sans-serif" style="font-size:12.88px">Điều khiển được  [B  AB]</text>
<text x="536" y="142" fill="#e5e7eb" font-size="14" text-anchor="start" font-family="Inter, Arial, sans-serif">=  [[1, −1], [0, 1]]</text>
<text x="536" y="164" fill="#9ccd4e" font-size="14" text-anchor="start" font-family="Inter, Arial, sans-serif">det = 1  →  hạng 2</text>
<text x="536" y="204" fill="#53b2dd" font-size="14" text-anchor="start" font-family="Inter, Arial, sans-serif" style="font-size:13.33px">Quan sát được, y = x2</text>
<text x="536" y="228" fill="#e5e7eb" font-size="14" text-anchor="start" font-family="Inter, Arial, sans-serif">[[0, 1], [1, −2]]  det = −1</text>
<text x="536" y="250" fill="#9ccd4e" font-size="14" text-anchor="start" font-family="Inter, Arial, sans-serif">→  hạng 2</text>
<text x="536" y="290" fill="#53b2dd" font-size="14" text-anchor="start" font-family="Inter, Arial, sans-serif" style="font-size:13.33px">Quan sát được, y = x1</text>
<text x="536" y="314" fill="#e5e7eb" font-size="14" text-anchor="start" font-family="Inter, Arial, sans-serif">[[1, 0], [−1, 0]]  det = 0</text>
<text x="536" y="336" fill="#d97936" font-size="14" text-anchor="start" font-family="Inter, Arial, sans-serif">→  hạng 1 (x2 bị ẩn)</text>
</svg>