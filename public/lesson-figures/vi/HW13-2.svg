<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="Inter, sans-serif">
<title>Quán tính phản chiếu tăng theo N², tổn hao đồng giảm theo 1/N²</title>
<desc>Hai đồ thị log-log theo tỉ số truyền N: quán tính rotor quy đổi J = 3.33e-6 N^2 kg m^2 tại 5.8, 20, 100 và 160:1 (1.12e-4 đến 8.52e-2 kg m^2), và tổn hao đồng ở mô-men đầu ra cố định so với 5.8:1, (5.8/N)^2.</desc>
<defs></defs>
<rect width="900" height="500" rx="14" fill="#17181b"/>
<text x="32" y="44" font-size="22" fill="#e9e7e3" text-anchor="start" font-weight="bold">Quán tính phản chiếu tăng theo N², tổn hao đồng giảm theo 1/N²</text>
<text x="32" y="70" font-size="15" fill="#a7adb5" text-anchor="start">Rotor 3.33×10⁻⁶ kg m² (Wensing và cs.), mô-men đầu ra và điện trở cuộn dây cố định</text>
<text x="32" y="108" font-size="17" fill="#e9e7e3" text-anchor="start" font-weight="bold">J = N² Jr</text>
<text x="32" y="134" font-size="15" fill="#e9e7e3" text-anchor="start">quán tính phản chiếu J (kg m²)</text>
