<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="Inter, sans-serif">
<title>Sai số làm tròn của một tổng đúng có thể lớn đến đâu?</title>
<desc>Đồ thị log-log của sai số tuyệt đối khi cộng n giá trị triệt tiêu về đúng 0, theo n: cận bậc nhất (n-1)u nhân tổng giá trị tuyệt đối, cận bù trừ 2u nhân tổng giá trị tuyệt đối, và sai số quan sát của vòng lặp từ trái sang phải và numpy sum, đều thấp hơn cận rất nhiều; Kahan và fsum cho 0.</desc>
<defs></defs>
<rect width="900" height="520" rx="14" fill="#17181b"/>
<text x="32" y="44" font-size="22" fill="#e9e7e3" text-anchor="start" font-weight="bold">Sai số làm tròn của một tổng đúng có thể lớn đến đâu?</text>
<rect x="100" y="84" width="500" height="300" rx="0" fill="#1c1e22" stroke="#3d4148" stroke-width="1.5"/>
<line x1="100" y1="376" x2="600" y2="376" stroke="#2c3036" stroke-width="1" stroke-linecap="round"/>
<text x="92" y="381" font-size="14" fill="#a7adb5" text-anchor="end">1e-16</text>
<line x1="100" y1="319" x2="600" y2="319" stroke="#2c3036" stroke-width="1" stroke-linecap="round"/>
<text x="92" y="324" font-size="14" fill="#a7adb5" text-anchor="end">1e-14</text>
<line x1="100" y1="262" x2="600" y2="262" stroke="#2c3036" stroke-width="1" stroke-linecap="round"/>
<text x="92" y="267" font-size="14" fill="#a7adb5" text-anchor="end">1e-12</text>
<line x1="100" y1="206" x2="600" y2="206" stroke="#2c3036" stroke-width="1" stroke-linecap="round"/>
<text x="92" y="211" font-size="14" fill="#a7adb5" text-anchor="end">1e-10</text>
<line x1="100" y1="149" x2="600" y2="149" stroke="#2c3036" stroke-width="1" stroke-linecap="round"/>
<text x="92" y="154" font-size="14" fill="#a7adb5" text-anchor="end">1e-8</text>
<line x1="100" y1="92" x2="600" y2="92" stroke="#2c3036" stroke-width="1" stroke-linecap="round"/>
<text x="92" y="97" font-size="14" fill="#a7adb5" text-anchor="end">1e-6</text>
<line x1="133" y1="84" x2="133" y2="384" stroke="#2c3036" stroke-width="1" stroke-linecap="round"/>
<text x="133" y="406" font-size="14" fill="#a7adb5" text-anchor="middle">10</text>
<line x1="241" y1="84" x2="241" y2="384" stroke="#2c3036" stroke-width="1" stroke-linecap="round"/>
<text x="241" y="406" font-size="14" fill="#a7adb5" text-anchor="middle">100</text>
<line x1="350" y1="84" x2="350" y2="384" stroke="#2c3036" stroke-width="1" stroke-linecap="round"/>
<text x="350" y="406" font-size="14" fill="#a7adb5" text-anchor="middle">1000</text>
<line x1="459" y1="84" x2="459" y2="384" stroke="#2c3036" stroke-width="1" stroke-linecap="round"/>
<text x="459" y="406" font-size="14" fill="#a7adb5" text-anchor="middle">1e4</text>
<line x1="567" y1="84" x2="567" y2="384" stroke="#2c3036" stroke-width="1" stroke-linecap="round"/>
<text x="567" y="406" font-size="14" fill="#a7adb5" text-anchor="middle">1e5</text>
<line x1="350" y1="84" x2="350" y2="384" stroke="#a7adb5" stroke-width="1.5" stroke-dasharray="5 4" stroke-linecap="round"/>
<text x="356" y="104" font-size="14" fill="#a7adb5" text-anchor="start">n = 1000</text>
<polyline points="133.0,326.0 241.0,270.0 350.0,213.0 459.0,156.0 567.0,100.0" fill="none" stroke="#e0904f" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
<polyline points="133.0,344.0 241.0,318.0 350.0,289.0 459.0,261.0 567.0,233.0" fill="none" stroke="#6cc6ba" stroke-width="2.5" stroke-dasharray="8 5" stroke-linejoin="round" stroke-linecap="round"/>
<polyline points="133.0,366.0 241.0,347.0 350.0,323.0 459.0,281.0 567.0,281.0" fill="none" stroke="#86abe2" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<polyline points="133.0,374.0 241.0,361.0 350.0,344.0 459.0,306.0 567.0,298.0" fill="none" stroke="#ae9ce6" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="133" cy="366" r="5" fill="#86abe2" stroke="#86abe2" stroke-width="1.5"/>
<rect x="128" y="369" width="10" height="10" fill="#ae9ce6"/>
<circle cx="241" cy="347" r="5" fill="#86abe2" stroke="#86abe2" stroke-width="1.5"/>
<rect x="236" y="356" width="10" height="10" fill="#ae9ce6"/>
<circle cx="350" cy="323" r="5" fill="#86abe2" stroke="#86abe2" stroke-width="1.5"/>
<rect x="345" y="339" width="10" height="10" fill="#ae9ce6"/>
<circle cx="459" cy="281" r="5" fill="#86abe2" stroke="#86abe2" stroke-width="1.5"/>
<rect x="454" y="301" width="10" height="10" fill="#ae9ce6"/>
<circle cx="567" cy="281" r="5" fill="#86abe2" stroke="#86abe2" stroke-width="1.5"/>
<rect x="562" y="293" width="10" height="10" fill="#ae9ce6"/>
<text x="614" y="105" font-size="15" fill="#e0904f" text-anchor="start" font-weight="600">cận (n-1)·u·Σ|x|</text>
<text x="614" y="238" font-size="15" fill="#6cc6ba" text-anchor="start" font-weight="600">cận bù trừ 2u·Σ|x|</text>
<text x="614" y="282" font-size="15" fill="#86abe2" text-anchor="start" font-weight="600">vòng lặp trái sang phải</text>
<text x="614" y="315" font-size="15" fill="#ae9ce6" text-anchor="start" font-weight="600">np.sum</text>
<text x="350" y="434" font-size="15" fill="#a7adb5" text-anchor="middle">số số hạng n</text>
<text x="32" y="70" font-size="15" fill="#a7adb5" text-anchor="start">sai số tuyệt đối |tính được - 0|</text>
<text x="614" y="360" font-size="17" fill="#e9e7e3" text-anchor="start" font-weight="bold">Tại n = 1000 (seed 7)</text>
<text x="614" y="388" font-size="15" fill="#e9e7e3" text-anchor="start">cận</text>
<text x="868" y="388" font-size="15" fill="#e9e7e3" text-anchor="end" font-weight="600">5.7e-11</text>
<text x="614" y="412" font-size="15" fill="#e9e7e3" text-anchor="start">cận bù trừ</text>
<text x="868" y="412" font-size="15" fill="#e9e7e3" text-anchor="end" font-weight="600">1.1e-13</text>
<text x="614" y="436" font-size="15" fill="#e9e7e3" text-anchor="start">trái sang phải</text>
<text x="868" y="436" font-size="15" fill="#e9e7e3" text-anchor="end" font-weight="600">7.4e-15</text>
<text x="614" y="460" font-size="15" fill="#e9e7e3" text-anchor="start">np.sum</text>
<text x="868" y="460" font-size="15" fill="#e9e7e3" text-anchor="end" font-weight="600">1.3e-15</text>
<text x="614" y="484" font-size="15" fill="#e9e7e3" text-anchor="start">Kahan, math.fsum</text>
<text x="868" y="484" font-size="15" fill="#e9e7e3" text-anchor="end" font-weight="600">0.0</text>
</svg>
