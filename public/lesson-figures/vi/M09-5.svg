<text x="98.33" y="265" font-size="15" fill="#86abe2" text-anchor="start" font-weight="600">camera</text>
<text x="98.33" y="285" font-size="14" fill="#a7adb5" text-anchor="start">10.0 m, σ² = 4 m²</text>
<text x="473.33" y="236" font-size="15" fill="#e0904f" text-anchor="start" font-weight="600">odometry</text>
<text x="473.33" y="256" font-size="14" fill="#a7adb5" text-anchor="start">12.0 m, σ² = 1 m²</text>
<text x="390" y="134.5" font-size="15" fill="#6fc693" text-anchor="end" font-weight="600">hợp nhất</text>
<text x="390" y="154.5" font-size="14" fill="#a7adb5" text-anchor="end">11.6 m, σ² = 0.8 m²</text>
<text x="656" y="94" font-size="17" fill="#e9e7e3" text-anchor="start" font-weight="bold">Số liệu</text>
<text x="656" y="132" font-size="15" fill="#e9e7e3" text-anchor="start">w₁ = ¼ / (¼ + 1) = 0.2</text>
<text x="656" y="162" font-size="15" fill="#e9e7e3" text-anchor="start">w₂ = 0.8</text>
<text x="656" y="192" font-size="15" fill="#e9e7e3" text-anchor="start">m = 0.2·10 + 0.8·12</text>
<text x="656" y="222" font-size="15" fill="#e9e7e3" text-anchor="start">  = 11.6 m</text>
