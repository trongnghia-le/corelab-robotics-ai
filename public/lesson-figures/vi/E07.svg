<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" font-family="Inter, Arial, sans-serif">
<rect width="720" height="360" fill="#191b1f" rx="12"/>
<text x="20" y="30" fill="#e5e7eb" font-size="16" font-weight="bold" style="font-size:12.48px">Dịch chuyển rollout</text>
<text x="400" y="30" fill="#e5e7eb" font-size="16" font-weight="bold" style="font-size:15.98px">Hành động đa mode</text>
<!-- left panel -->
<path d="M30 150 L360 150 L360 210 L30 210 Z" fill="#53b2dd" fill-opacity="0.18" stroke="#53b2dd" stroke-dasharray="5 4"/>
<text x="40" y="140" fill="#53b2dd" font-size="14">ống demo (trạng thái huấn luyện)</text>
<path d="M30 180 L360 180" stroke="#9ccd4e" stroke-width="3"/>
<text x="260" y="203" fill="#9ccd4e" font-size="14" style="font-size:10.92px">chuyên gia</text>
<path d="M30 180 C90 176 130 196 170 206 C210 222 250 250 300 285 C320 300 340 318 355 325" fill="none" stroke="#d97936" stroke-width="3"/>
<circle cx="170" cy="206" r="5" fill="#d97936"/>
<text x="178" y="238" fill="#d97936" font-size="14">sai số nhỏ</text>
<text x="240" y="318" fill="#d97936" font-size="14" style="font-size:10.92px">không có dữ liệu ở đây</text>
<text x="30" y="345" fill="#e5e7eb" font-size="13" style="font-size:10.14px">thời gian t</text>
<text x="200" y="345" fill="#e5e7eb" font-size="13" style="font-size:12.84px">sai số tăng, chi phí ~ eps*T^2</text>
<path d="M30 100 L30 120" stroke="#e5e7eb"/>
<text x="30" y="75" fill="#e5e7eb" font-size="13">trạng thái x (dọc), learner = cam</text>
<!-- right panel -->
<line x1="410" y1="290" x2="690" y2="290" stroke="#e5e7eb"/>
<text x="420" y="315" fill="#e5e7eb" font-size="13">-1 (trái)</text>
<text x="535" y="315" fill="#e5e7eb" font-size="13">0</text>
<text x="630" y="315" fill="#e5e7eb" font-size="13">+1 (phải)</text>
<text x="400" y="345" fill="#e5e7eb" font-size="13">hành động a tại cùng quan sát</text>
<rect x="430" y="140" width="30" height="150" fill="#53b2dd"/>
<rect x="640" y="140" width="30" height="150" fill="#53b2dd"/>
<text x="400" y="125" fill="#53b2dd" font-size="14">50% demo</text>
<text x="615" y="125" fill="#53b2dd" font-size="14">50% demo</text>
<line x1="550" y1="150" x2="550" y2="290" stroke="#d97936" stroke-width="3"/>
<text x="470" y="110" fill="#d97936" font-size="14" style="font-size:12.05px">đầu ra MSE = trung bình</text>
<text x="470" y="200" fill="#d97936" font-size="14" style="font-size:10.92px">chướng ngại vật!</text>
<line x1="550" y1="105" x2="550" y2="150" stroke="#d97936" stroke-dasharray="3 3"/>
<line x1="365" y1="45" x2="365" y2="350" stroke="#3b414d"/>
</svg>
