<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="Inter, sans-serif">
<title>Trạng thái của descriptor theo từng instance so với trên descriptor</title>
<desc>Trái: một đối tượng Degrees trên class Wheel dùng chung cho hai wheel, mỗi wheel giữ giá trị radian riêng trong dictionary. Phải: phiên bản lỗi lưu giá trị trên descriptor nên cả hai wheel đọc ra 45 độ.</desc>
<rect width="900" height="560" rx="14" fill="#17181b"/>

<text x="32" y="44" font-size="22" font-weight="bold" fill="#e9e7e3">Descriptor giữ trạng thái ở đâu</text>
<rect x="32" y="72" width="408" height="460" rx="10" fill="#22252a"/>
<rect x="464" y="72" width="404" height="460" rx="10" fill="#22252a"/>
<text x="52" y="102" font-size="17" font-weight="bold" fill="#e9e7e3">Đúng: giá trị nằm trong từng instance</text>
<text x="484" y="102" font-size="17" font-weight="bold" fill="#e9e7e3">Lỗi: giá trị nằm trên descriptor</text>
<rect x="52" y="122" width="368" height="64" rx="8" fill="#2c3036" stroke="#3d4148" stroke-width="1.5"/>
<text x="64" y="148" font-size="15" font-weight="600" fill="#e9e7e3">class Wheel</text>
<text x="64" y="172" font-size="15" fill="#e9e7e3">heading = Degrees()</text>
<rect x="52" y="214" width="368" height="66" rx="8" fill="#22252a" stroke="#ae9ce6" stroke-width="2"/>
<text x="64" y="240" font-size="15" font-weight="600" fill="#ae9ce6">đối tượng Degrees (dùng chung cho mọi wheel)</text>
<text x="64" y="264" font-size="15" fill="#e9e7e3">không lưu giá trị ở đây</text>
<line x1="236" y1="186" x2="236.0" y2="203.0" stroke="#a7adb5" stroke-width="2"/>
<polygon points="236.0,214.0 230.5,203.0 241.5,203.0" fill="#a7adb5"/>
<rect x="52" y="300" width="368" height="64" rx="8" fill="#22252a" stroke="#6cc6ba" stroke-width="2"/>
<text x="64" y="326" font-size="15" font-weight="600" fill="#6cc6ba">w1  (heading = 90)</text>
<text x="64" y="350" font-size="15" fill="#e9e7e3">__dict__: _heading = 1.5708</text>
<rect x="52" y="380" width="368" height="64" rx="8" fill="#22252a" stroke="#6cc6ba" stroke-width="2"/>
<text x="64" y="406" font-size="15" font-weight="600" fill="#6cc6ba">w2  (heading = 45)</text>
<text x="64" y="430" font-size="15" fill="#e9e7e3">__dict__: _heading = 0.7854</text>
<rect x="484" y="122" width="368" height="64" rx="8" fill="#2c3036" stroke="#3d4148" stroke-width="1.5"/>
<text x="496" y="148" font-size="15" font-weight="600" fill="#e9e7e3">class Wheel</text>
<text x="496" y="172" font-size="15" fill="#e9e7e3">heading = Degrees()</text>
<rect x="484" y="214" width="368" height="96" rx="8" fill="#22252a" stroke="#ae9ce6" stroke-width="2"/>
<text x="496" y="240" font-size="15" font-weight="600" fill="#ae9ce6">đối tượng Degrees (dùng chung cho mọi wheel)</text>
<text x="496" y="264" font-size="15" fill="#e58a80">value = 0.7854 (lần ghi cuối)</text>
<line x1="668" y1="186" x2="668.0" y2="203.0" stroke="#a7adb5" stroke-width="2"/>
<polygon points="668.0,214.0 662.5,203.0 673.5,203.0" fill="#a7adb5"/>
<rect x="484" y="330" width="368" height="64" rx="8" fill="#22252a" stroke="#6cc6ba" stroke-width="2"/>
<text x="496" y="356" font-size="15" font-weight="600" fill="#6cc6ba">w1  (heading = 90)</text>
<text x="496" y="380" font-size="15" fill="#e9e7e3">w1.__dict__: rỗng</text>
<rect x="484" y="410" width="368" height="64" rx="8" fill="#22252a" stroke="#6cc6ba" stroke-width="2"/>
<text x="496" y="436" font-size="15" font-weight="600" fill="#6cc6ba">w2  (heading = 45)</text>
<text x="496" y="460" font-size="15" fill="#e9e7e3">w2.__dict__: rỗng</text>
<text x="52" y="512" font-size="14" fill="#6fc693">w1.heading đọc ra 90.0   |   w2.heading đọc ra 45.0</text>
<text x="484" y="512" font-size="14" fill="#e58a80">w1.heading đọc ra 45.0 (sai)   |   w2.heading đọc ra 45.0</text>
</svg>
