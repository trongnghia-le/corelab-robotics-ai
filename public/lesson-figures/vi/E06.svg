<circle cx="190" cy="198" r="156.0" fill="#53b2dd" fill-opacity="0.10" stroke="#53b2dd" stroke-width="2" stroke-dasharray="6 4"/><circle cx="190" cy="198" r="54.2" fill="#191b1f" stroke="#53b2dd" stroke-width="2" stroke-dasharray="3 3"/><circle cx="298.0" cy="198" r="156.0" fill="#9ccd4e" fill-opacity="0.10" stroke="#9ccd4e" stroke-width="2" stroke-dasharray="6 4"/><circle cx="298.0" cy="198" r="54.2" fill="#191b1f" stroke="#9ccd4e" stroke-width="2" stroke-dasharray="3 3"/>
<circle cx="190" cy="198" r="6" fill="#53b2dd"/><text x="180" y="222" fill="#53b2dd" font-size="14" text-anchor="end">B0</text>
<circle cx="298.0" cy="198" r="6" fill="#9ccd4e"/><text x="302.0" y="222" fill="#9ccd4e" font-size="14">B1</text>
<rect x="207.0" y="179.0" width="14" height="14" fill="#d97936"/><text x="214.0" y="172.0" fill="#d97936" font-size="14" text-anchor="middle">hộp</text>
<polygon points="346.0,237.0 355.0,253.0 337.0,253.0" fill="#d97936"/><text x="360.0" y="251.0" fill="#d97936" font-size="14">khe S</text>
<g fill="#e5e7eb" font-size="14">
<text x="530" y="70" font-weight="bold">Từ B0</text>
<text x="530" y="92">hộp r=0.224: trong lỗ</text>
<text x="530" y="112" style="font-size:13.78px">khe r=1.360: vượt quá 1.3</text>
<text x="530" y="150" font-weight="bold">Từ B1</text>
<text x="530" y="172" style="font-size:13.36px">hộp r=0.707: với tới được</text>
<text x="530" y="192" style="font-size:13.35px">khe r=0.566: với tới được</text>
<text x="530" y="230" font-weight="bold" style="font-size:10.92px">Kế hoạch được chọn</text>
<text x="530" y="252">move_base(B1)</text><text x="530" y="272">pick(box)</text><text x="530" y="292">place(box,S)</text></g>
<text x="30" y="376" fill="#e5e7eb" font-size="13">l1 = 0.8 m, l2 = 0.5 m, giới hạn khuỷu |q2| &lt;= 2.6 rad. Vòng nét đứt: tầm với ngoài 1.3 và tầm với trong 0.452.</text>
