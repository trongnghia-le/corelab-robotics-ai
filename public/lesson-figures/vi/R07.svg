<text x="90" y="56" fill="#e5e7eb" font-size="13" text-anchor="start" style="font-size:10.14px">trục quay, mô-men tau</text>
<text x="30" y="290" fill="#9ccd4e" font-size="14" text-anchor="start">m l^2 q'' + b q' + m g l sin q = tau</text>
<text x="30" y="314" fill="#e5e7eb" font-size="13" text-anchor="start">E = (1/2) m l^2 q'^2 + m g l (1 - cos q)</text>
<text x="30" y="336" fill="#e5e7eb" font-size="13" text-anchor="start">dE/dt = tau q' - b q'^2</text>
