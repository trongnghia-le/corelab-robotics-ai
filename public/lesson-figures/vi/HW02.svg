<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 400" font-family="Inter, Arial, sans-serif">
<title>Điện cho người làm robot: định luật Ohm và LED, cầu chia áp có tải, cách mắc đồng hồ</title>
<desc>Ba bảng. Trái: tam giác định luật Ohm và mạch 5 V, 330 ohm, LED mang 9 mA. Giữa: cầu chia 10k trên 20k cho 3.33 V, giảm còn 2.92 V khi có tải 47k. Phải: đồng hồ đo điện áp song song và dòng nối tiếp.</desc>
<rect width="780" height="400" fill="#191b1f" rx="12"/>
<text x="390" y="28" font-size="16" fill="#e5e7eb" text-anchor="middle" font-weight="bold">Ba mạch và một đồng hồ đo bao quát hầu hết lỗi người mới</text>
<line x1="260" y1="48" x2="260" y2="382" stroke="#3b414d" stroke-width="1" stroke-dasharray="4 4"/>
<line x1="520" y1="48" x2="520" y2="382" stroke="#3b414d" stroke-width="1" stroke-dasharray="4 4"/>
<text x="130" y="56" font-size="13" fill="#9ccd4e" text-anchor="middle" font-weight="bold" style="font-size:11.84px">1  Định luật Ohm, điện trở LED</text>
<polygon points="130,72 70,160 190,160" fill="#272a2f" stroke="#9ccd4e" stroke-width="2"/>
<line x1="85" y1="136" x2="175" y2="136" stroke="#9ccd4e" stroke-width="1"/>
<line x1="130" y1="136" x2="130" y2="160" stroke="#9ccd4e" stroke-width="1"/>
<text x="130" y="115" font-size="18" fill="#e5e7eb" text-anchor="middle" font-weight="bold">V</text>
<text x="100" y="154" font-size="16" fill="#e5e7eb" text-anchor="middle" font-weight="bold">I</text>
<text x="160" y="154" font-size="16" fill="#e5e7eb" text-anchor="middle" font-weight="bold">R</text>
<text x="130" y="178" font-size="11" fill="#e5e7eb" text-anchor="middle">V = I R    P = V I = I^2 R</text>
<line x1="40" y1="230" x2="40" y2="330" stroke="#e5e7eb" stroke-width="2"/>
<line x1="40" y1="230" x2="95" y2="230" stroke="#e5e7eb" stroke-width="2"/>
<line x1="145" y1="230" x2="225" y2="230" stroke="#e5e7eb" stroke-width="2"/>
<line x1="225" y1="230" x2="225" y2="258" stroke="#e5e7eb" stroke-width="2"/>
<line x1="225" y1="284" x2="225" y2="330" stroke="#e5e7eb" stroke-width="2"/>
<line x1="40" y1="330" x2="225" y2="330" stroke="#e5e7eb" stroke-width="2"/>
<line x1="30" y1="262" x2="50" y2="262" stroke="#e5e7eb" stroke-width="2"/>
<line x1="34" y1="270" x2="46" y2="270" stroke="#e5e7eb" stroke-width="2"/>
<line x1="40" y1="262" x2="40" y2="230" stroke="#e5e7eb" stroke-width="2"/>
<line x1="40" y1="270" x2="40" y2="330" stroke="#e5e7eb" stroke-width="2"/>
<text x="30" y="258" font-size="11" fill="#d97936" text-anchor="end">5 V</text>
<rect x="95" y="220" width="50" height="20" rx="3" fill="#272a2f" stroke="#53b2dd" stroke-width="2"/>
<text x="120.0" y="234.0" font-size="11" fill="#e5e7eb" text-anchor="middle">330 ohm</text>
<polygon points="213,258 237,258 225,278" fill="#272a2f" stroke="#d9b836" stroke-width="2"/>
<line x1="213" y1="280" x2="237" y2="280" stroke="#d9b836" stroke-width="2"/>
<text x="246" y="272" font-size="11" fill="#e5e7eb" text-anchor="start">LED</text>
<text x="246" y="286" font-size="10" fill="#e5e7eb" text-anchor="start">Vf ~ 2 V</text>
<text x="120" y="210" font-size="11" fill="#53b2dd" text-anchor="middle">sụt 3 V</text>
<text x="130" y="352" font-size="12" fill="#9ccd4e" text-anchor="middle">I = (5 - 2) / 330 = 9 mA</text>
<text x="130" y="372" font-size="10" fill="#e5e7eb" text-anchor="middle">P(R) = 27 mW: linh kiện 1/4 W là đủ</text>
<text x="390" y="56" font-size="13" fill="#9ccd4e" text-anchor="middle" font-weight="bold">2  Cầu chia áp và tải</text>
<text x="330" y="80" font-size="12" fill="#d97936" text-anchor="end">5 V</text>
<line x1="335" y1="76" x2="370" y2="76" stroke="#d97936" stroke-width="2"/>
<line x1="370" y1="76" x2="370" y2="98" stroke="#e5e7eb" stroke-width="2"/>
<rect x="360" y="98" width="20" height="50" rx="3" fill="#272a2f" stroke="#53b2dd" stroke-width="2"/>
<text x="348" y="127" font-size="11" fill="#e5e7eb" text-anchor="end">10k</text>
<line x1="370" y1="148" x2="370" y2="168" stroke="#e5e7eb" stroke-width="2"/>
<circle cx="370" cy="168" r="3.5" fill="#e5e7eb"/>
<rect x="360" y="190" width="20" height="50" rx="3" fill="#272a2f" stroke="#53b2dd" stroke-width="2"/>
<text x="348" y="219" font-size="11" fill="#e5e7eb" text-anchor="end">20k</text>
<line x1="370" y1="168" x2="370" y2="190" stroke="#e5e7eb" stroke-width="2"/>
<line x1="370" y1="240" x2="370" y2="262" stroke="#e5e7eb" stroke-width="2"/>
<line x1="358" y1="262" x2="382" y2="262" stroke="#e5e7eb" stroke-width="2"/>
<line x1="363" y1="268" x2="377" y2="268" stroke="#e5e7eb" stroke-width="2"/>
<line x1="367" y1="274" x2="373" y2="274" stroke="#e5e7eb" stroke-width="2"/>
<line x1="370" y1="168" x2="470" y2="168" stroke="#e5e7eb" stroke-width="2"/>
<rect x="470" y="154" width="40" height="28" rx="5" fill="#272a2f" stroke="#9ccd4e" stroke-width="2"/>
<text x="490" y="173" font-size="12" fill="#e5e7eb" text-anchor="middle">ADC</text>
<text x="420" y="160" font-size="11" fill="#e5e7eb" text-anchor="middle">Vout</text>
<line x1="420" y1="168" x2="420" y2="190" stroke="#e5e7eb" stroke-width="2"/>
<circle cx="420" cy="168" r="3.5" fill="#e5e7eb"/>
<rect x="410" y="190" width="20" height="50" rx="3" fill="#272a2f" stroke="#c095eb" stroke-width="2"/>
<text x="438" y="219" font-size="11" fill="#e5e7eb" text-anchor="start">47k</text>
<line x1="420" y1="240" x2="420" y2="262" stroke="#e5e7eb" stroke-width="2"/>
<line x1="370" y1="262" x2="420" y2="262" stroke="#e5e7eb" stroke-width="2"/>
<text x="390" y="300" font-size="11" fill="#e5e7eb" text-anchor="middle">không tải:  5 x 20/30 = 3.33 V</text>
<text x="390" y="320" font-size="11" fill="#e5e7eb" text-anchor="middle">có tải 47k: 20k || 47k = 14.0k</text>
<text x="390" y="340" font-size="12" fill="#d97936" text-anchor="middle" font-weight="bold">Vout = 2.92 V  (-12 %)</text>
<text x="390" y="362" font-size="10" fill="#e5e7eb" text-anchor="middle">giữ tải &gt;= 10 x R2</text>
<text x="640" y="56" font-size="13" fill="#9ccd4e" text-anchor="middle" font-weight="bold" style="font-size:10.14px">3  Đồng hồ vạn năng: song song hay nối tiếp</text>
<line x1="545" y1="95" x2="545" y2="165" stroke="#e5e7eb" stroke-width="2"/>
<line x1="545" y1="95" x2="590" y2="95" stroke="#e5e7eb" stroke-width="2"/>
<line x1="650" y1="95" x2="735" y2="95" stroke="#e5e7eb" stroke-width="2"/>
<line x1="735" y1="95" x2="735" y2="165" stroke="#e5e7eb" stroke-width="2"/>
<line x1="545" y1="165" x2="735" y2="165" stroke="#e5e7eb" stroke-width="2"/>
<rect x="590" y="85" width="60" height="20" rx="3" fill="#272a2f" stroke="#53b2dd" stroke-width="2"/>
<text x="620.0" y="99.0" font-size="11" fill="#e5e7eb" text-anchor="middle">R</text>
<text x="540" y="134" font-size="10" fill="#e5e7eb" text-anchor="end">nguồn</text>
<circle cx="620" cy="132" r="17" fill="#272a2f" stroke="#9ccd4e" stroke-width="2"/>
<text x="620" y="137" font-size="14" fill="#e5e7eb" text-anchor="middle" font-weight="bold">V</text>
<line x1="612" y1="117" x2="598" y2="95" stroke="#9ccd4e" stroke-width="2"/>
<line x1="628" y1="117" x2="642" y2="95" stroke="#9ccd4e" stroke-width="2"/>
<circle cx="598" cy="95" r="3.5" fill="#9ccd4e"/>
<circle cx="642" cy="95" r="3.5" fill="#9ccd4e"/>
<text x="640" y="200" font-size="11" fill="#9ccd4e" text-anchor="middle" style="font-size:10.33px">điện áp: ĐO TRÊN linh kiện (song song)</text>
<line x1="545" y1="245" x2="545" y2="325" stroke="#e5e7eb" stroke-width="2"/>
<line x1="545" y1="245" x2="606" y2="245" stroke="#e5e7eb" stroke-width="2"/>
<line x1="670" y1="245" x2="735" y2="245" stroke="#e5e7eb" stroke-width="2"/>
<line x1="735" y1="245" x2="735" y2="325" stroke="#e5e7eb" stroke-width="2"/>
<line x1="545" y1="325" x2="590" y2="325" stroke="#e5e7eb" stroke-width="2"/>
<line x1="650" y1="325" x2="735" y2="325" stroke="#e5e7eb" stroke-width="2"/>
<rect x="590" y="315" width="60" height="20" rx="3" fill="#272a2f" stroke="#53b2dd" stroke-width="2"/>
<text x="620.0" y="329.0" font-size="11" fill="#e5e7eb" text-anchor="middle">R</text>
<circle cx="638" cy="245" r="17" fill="#272a2f" stroke="#d97936" stroke-width="2"/>
<text x="638" y="250" font-size="14" fill="#e5e7eb" text-anchor="middle" font-weight="bold">A</text>
<text x="640" y="365" font-size="11" fill="#d97936" text-anchor="middle">dòng điện: NỐI TIẾP (cắt mạch vòng)</text>
<text x="640" y="382" font-size="10" fill="#e5e7eb" text-anchor="middle" style="font-size:9.71px">Chế độ A đo qua pin = đoản mạch, cháy cầu chì</text>
</svg>
