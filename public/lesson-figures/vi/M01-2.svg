<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 510" font-family="Inter, sans-serif">
<title>Affine: hai phép đo xác định đường thẳng, không xác định mặt phẳng</title>
<desc>Hàm affine psi của hai biến với psi(0,0)=1 và psi(1,0)=3 được xác định trên đường x2=0 nhờ chồng chập bị hạn chế (tổng hệ số bằng một); tại (0,1) giá trị là tự do.</desc>
<rect width="900" height="510" rx="14" fill="#17181b"/>
<text x="32" y="44" font-size="22" fill="#e9e7e3" text-anchor="start" font-weight="bold">Affine: hai phép đo xác định đường thẳng, không xác định mặt phẳng</text>
<rect x="32" y="70" width="406" height="420" rx="10" fill="#22252a"/>
<text x="52" y="100" font-size="17" fill="#a7adb5" text-anchor="start" font-weight="bold">Dọc theo đường đã đo</text>
<line x1="132.0" y1="390.0" x2="132.0" y2="396.0" stroke="#a7adb5" stroke-width="2" stroke-linecap="round"/>
<text x="132" y="410" font-size="14" fill="#a7adb5" text-anchor="middle" font-weight="normal">−1</text>
<line x1="212.0" y1="390.0" x2="212.0" y2="396.0" stroke="#a7adb5" stroke-width="2" stroke-linecap="round"/>
<text x="212" y="410" font-size="14" fill="#a7adb5" text-anchor="middle" font-weight="normal">0</text>
<line x1="292.0" y1="390.0" x2="292.0" y2="396.0" stroke="#a7adb5" stroke-width="2" stroke-linecap="round"/>
<text x="292" y="410" font-size="14" fill="#a7adb5" text-anchor="middle" font-weight="normal">1</text>
<line x1="372.0" y1="390.0" x2="372.0" y2="396.0" stroke="#a7adb5" stroke-width="2" stroke-linecap="round"/>
<text x="372" y="410" font-size="14" fill="#a7adb5" text-anchor="middle" font-weight="normal">2</text>
<line x1="86.0" y1="361.1" x2="92.0" y2="361.1" stroke="#a7adb5" stroke-width="2" stroke-linecap="round"/>
<text x="82" y="366" font-size="14" fill="#a7adb5" text-anchor="end" font-weight="normal">−2</text>
<line x1="86.0" y1="303.3" x2="92.0" y2="303.3" stroke="#a7adb5" stroke-width="2" stroke-linecap="round"/>
<text x="82" y="308" font-size="14" fill="#a7adb5" text-anchor="end" font-weight="normal">0</text>
<line x1="86.0" y1="245.6" x2="92.0" y2="245.6" stroke="#a7adb5" stroke-width="2" stroke-linecap="round"/>
<text x="82" y="251" font-size="14" fill="#a7adb5" text-anchor="end" font-weight="normal">2</text>
<line x1="86.0" y1="187.8" x2="92.0" y2="187.8" stroke="#a7adb5" stroke-width="2" stroke-linecap="round"/>
<text x="82" y="193" font-size="14" fill="#a7adb5" text-anchor="end" font-weight="normal">4</text>
<line x1="86.0" y1="130.0" x2="92.0" y2="130.0" stroke="#a7adb5" stroke-width="2" stroke-linecap="round"/>
<text x="82" y="135" font-size="14" fill="#a7adb5" text-anchor="end" font-weight="normal">6</text>
<line x1="92.0" y1="390.0" x2="412.0" y2="390.0" stroke="#a7adb5" stroke-width="2" stroke-linecap="round"/>
<line x1="92.0" y1="130.0" x2="92.0" y2="390.0" stroke="#a7adb5" stroke-width="2" stroke-linecap="round"/>
<text x="412" y="432" font-size="15" fill="#a7adb5" text-anchor="end" font-weight="normal">x₁ (với x₂ = 0)</text>
<text x="92" y="118" font-size="15" fill="#a7adb5" text-anchor="start" font-weight="normal">ψ(x₁, 0)</text>
<line x1="112.0" y1="346.7" x2="392.0" y2="144.4" stroke="#86abe2" stroke-width="2.5" stroke-linecap="round"/>
<text x="100" y="153" font-size="15" fill="#86abe2" text-anchor="start" font-weight="600">ψ = 1 + 2x₁</text>
<circle cx="212.0" cy="274.4" r="7" fill="#e0904f"/>
<circle cx="292.0" cy="216.7" r="7" fill="#e0904f"/>
<text x="224" y="296" font-size="15" fill="#e0904f" text-anchor="start" font-weight="normal">(0, 1) đã đo</text>
<text x="304" y="239" font-size="15" fill="#e0904f" text-anchor="start" font-weight="normal">(1, 3) đã đo</text>
<circle cx="252.0" cy="245.6" r="7" fill="#22252a" stroke="#6cc6ba" stroke-width="2.5"/>
<circle cx="372.0" cy="158.9" r="7" fill="#22252a" stroke="#6cc6ba" stroke-width="2.5"/>
<circle cx="132.0" cy="332.2" r="7" fill="#22252a" stroke="#6cc6ba" stroke-width="2.5"/>
<text x="240" y="234" font-size="15" fill="#6cc6ba" text-anchor="end" font-weight="normal">(½, 2)  α=β=½</text>
<text x="360" y="164" font-size="15" fill="#6cc6ba" text-anchor="end" font-weight="normal">(2, 5)  α=2, β=−1</text>
<text x="144" y="342" font-size="15" fill="#6cc6ba" text-anchor="start" font-weight="normal">(−1, −1)  α=−1, β=2</text>
<text x="52" y="462" font-size="14" fill="#a7adb5" text-anchor="start" font-weight="normal">α, β = trọng số của các điểm (0,0) và (1,0); α+β = 1</text>
<rect x="462" y="70" width="406" height="420" rx="10" fill="#22252a"/>
<text x="482" y="100" font-size="17" fill="#a7adb5" text-anchor="start" font-weight="bold">Ngoài đường thẳng: chưa xác định</text>
<line x1="522.0" y1="390.0" x2="522.0" y2="396.0" stroke="#a7adb5" stroke-width="2" stroke-linecap="round"/>
<text x="522" y="410" font-size="14" fill="#a7adb5" text-anchor="middle" font-weight="normal">−1</text>
<line x1="625.3" y1="390.0" x2="625.3" y2="396.0" stroke="#a7adb5" stroke-width="2" stroke-linecap="round"/>
<text x="625" y="410" font-size="14" fill="#a7adb5" text-anchor="middle" font-weight="normal">0</text>
<line x1="728.7" y1="390.0" x2="728.7" y2="396.0" stroke="#a7adb5" stroke-width="2" stroke-linecap="round"/>
<text x="729" y="410" font-size="14" fill="#a7adb5" text-anchor="middle" font-weight="normal">1</text>
<line x1="832.0" y1="390.0" x2="832.0" y2="396.0" stroke="#a7adb5" stroke-width="2" stroke-linecap="round"/>
<text x="832" y="410" font-size="14" fill="#a7adb5" text-anchor="middle" font-weight="normal">2</text>
<line x1="516.0" y1="364.0" x2="522.0" y2="364.0" stroke="#a7adb5" stroke-width="2" stroke-linecap="round"/>
<text x="512" y="369" font-size="14" fill="#a7adb5" text-anchor="end" font-weight="normal">−4</text>
<line x1="516.0" y1="312.0" x2="522.0" y2="312.0" stroke="#a7adb5" stroke-width="2" stroke-linecap="round"/>
<text x="512" y="317" font-size="14" fill="#a7adb5" text-anchor="end" font-weight="normal">−2</text>
<line x1="516.0" y1="260.0" x2="522.0" y2="260.0" stroke="#a7adb5" stroke-width="2" stroke-linecap="round"/>
<text x="512" y="265" font-size="14" fill="#a7adb5" text-anchor="end" font-weight="normal">0</text>
<line x1="516.0" y1="208.0" x2="522.0" y2="208.0" stroke="#a7adb5" stroke-width="2" stroke-linecap="round"/>
<text x="512" y="213" font-size="14" fill="#a7adb5" text-anchor="end" font-weight="normal">2</text>
<line x1="516.0" y1="156.0" x2="522.0" y2="156.0" stroke="#a7adb5" stroke-width="2" stroke-linecap="round"/>
<text x="512" y="161" font-size="14" fill="#a7adb5" text-anchor="end" font-weight="normal">4</text>
<line x1="522.0" y1="390.0" x2="832.0" y2="390.0" stroke="#a7adb5" stroke-width="2" stroke-linecap="round"/>
<line x1="522.0" y1="130.0" x2="522.0" y2="390.0" stroke="#a7adb5" stroke-width="2" stroke-linecap="round"/>
<text x="832" y="432" font-size="15" fill="#a7adb5" text-anchor="end" font-weight="normal">x₂ (với x₁ = 0)</text>
<text x="522" y="118" font-size="15" fill="#a7adb5" text-anchor="start" font-weight="normal">ψ(0, x₂)</text>
<line x1="522.0" y1="260.0" x2="728.7" y2="208.0" stroke="#86abe2" stroke-width="2.5" stroke-linecap="round"/>
<line x1="522.0" y1="234.0" x2="728.7" y2="234.0" stroke="#6cc6ba" stroke-width="2.5" stroke-linecap="round"/>
<line x1="522.0" y1="156.0" x2="780.3" y2="351.0" stroke="#e0904f" stroke-width="2.5" stroke-linecap="round"/>
<circle cx="625.3" cy="234.0" r="7" fill="#e9e7e3"/>
<circle cx="728.7" cy="208.0" r="6" fill="#86abe2"/>
<text x="741" y="213" font-size="15" fill="#86abe2" text-anchor="start" font-weight="600">c = 1 → 2</text>
<circle cx="728.7" cy="234.0" r="6" fill="#6cc6ba"/>
<text x="741" y="239" font-size="15" fill="#6cc6ba" text-anchor="start" font-weight="600">c = 0 → 1</text>
<circle cx="728.7" cy="312.0" r="6" fill="#e0904f"/>
<text x="741" y="317" font-size="15" fill="#e0904f" text-anchor="start" font-weight="600">c = −3 → −2</text>
<text x="542" y="462" font-size="14" fill="#a7adb5" text-anchor="start" font-weight="normal">ψ = 1 + 2x₁ + c·x₂ khớp cả hai phép đo với mọi c;</text>
<text x="482" y="482" font-size="14" fill="#a7adb5" text-anchor="start" font-weight="normal">phép đo thứ ba ψ(0,1) = −2 chọn c = −3.</text>
</svg>
