<text x="120" y="312" font-size="14" fill="#a7adb5" font-weight="normal" text-anchor="end">1e-12</text>
<line x1="130" y1="370" x2="820" y2="370" stroke="#3d4148" stroke-width="1"/>
<text x="120" y="375" font-size="14" fill="#a7adb5" font-weight="normal" text-anchor="end">1e-16</text>
