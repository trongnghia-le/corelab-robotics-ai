<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="Inter, sans-serif">
<title>Newton: bậc hai ở trong, tuyến tính ở mép</title>
<desc>Residual theo vòng lặp Newton, thang log, cánh tay 0.8 m và 0.5 m, điểm đầu (0.3; 0.6): mục tiêu (1.2; 0) hội tụ bậc hai, mục tiêu (1.3; 0) ở mép ngoài hội tụ tuyến tính.</desc>
<defs><marker id="a3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#a7adb5"/></marker></defs>
<rect width="900" height="470" rx="14" fill="#17181b"/>
