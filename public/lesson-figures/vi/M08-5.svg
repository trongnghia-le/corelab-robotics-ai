<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" font-family="Inter, sans-serif">
<title>Trường hợp 2: đếm trùng bằng chứng</title>
<desc>Ba cột: xác suất lỗi hậu nghiệm 0.166 sau một lần báo, 0.952 sau hai lần báo độc lập, và 0.166 sau hai lần báo cùng một nguồn sai số.</desc>
<rect width="900" height="440" rx="14" fill="#17181b"/>

<text x="32" y="44" font-size="22" font-weight="bold" fill="#e9e7e3">Trường hợp 2: đếm trùng bằng chứng</text>
<rect x="32" y="72" width="836" height="340" rx="10" fill="#22252a"/>
<line x1="470" y1="330" x2="470.0" y2="336.0" stroke="#a7adb5" stroke-width="1.5"/>
<text x="470" y="356" font-size="14" text-anchor="middle" fill="#a7adb5">0</text>
<line x1="550" y1="330" x2="550.0" y2="336.0" stroke="#a7adb5" stroke-width="1.5"/>
<text x="550" y="356" font-size="14" text-anchor="middle" fill="#a7adb5">0.25</text>
<line x1="630" y1="330" x2="630.0" y2="336.0" stroke="#a7adb5" stroke-width="1.5"/>
<text x="630" y="356" font-size="14" text-anchor="middle" fill="#a7adb5">0.5</text>
<line x1="710" y1="330" x2="710.0" y2="336.0" stroke="#a7adb5" stroke-width="1.5"/>
<text x="710" y="356" font-size="14" text-anchor="middle" fill="#a7adb5">0.75</text>
<line x1="790" y1="330" x2="790.0" y2="336.0" stroke="#a7adb5" stroke-width="1.5"/>
<text x="790" y="356" font-size="14" text-anchor="middle" fill="#a7adb5">1</text>
<line x1="470" y1="330" x2="790.0" y2="330.0" stroke="#a7adb5" stroke-width="1.5"/>
<line x1="470" y1="120" x2="470.0" y2="330.0" stroke="#a7adb5" stroke-width="1.5"/>
<text x="790" y="382" font-size="15" text-anchor="end" fill="#e9e7e3">hậu nghiệm P(lỗi | các lần báo)</text>
<text x="56" y="158" font-size="15" font-weight="600" fill="#86abe2">một lần báo</text>
<text x="56" y="180" font-size="14" fill="#a7adb5">odds 0.002 × 99 = 0.198</text>
<rect x="471" y="136" width="53.0" height="40" rx="4" fill="#86abe2" fill-opacity="0.85"/>
<text x="533" y="162" font-size="15" font-weight="600" fill="#86abe2">0.166</text>
<text x="56" y="222" font-size="15" font-weight="600" fill="#6fc693">hai lần báo, sai số độc lập</text>
<text x="56" y="244" font-size="14" fill="#a7adb5">odds 0.002 × 99 × 99 = 19.6</text>
<rect x="471" y="200" width="304.5" height="40" rx="4" fill="#6fc693" fill-opacity="0.85"/>
<text x="764.5" y="226" font-size="15" font-weight="600" text-anchor="end" fill="#17181b">0.952</text>
<text x="56" y="286" font-size="15" font-weight="600" fill="#e0904f">hai lần báo, cùng nguồn sai số (bản sao)</text>
<text x="56" y="308" font-size="14" fill="#a7adb5">odds 0.002 × 99 = 0.198</text>
<rect x="471" y="264" width="53.0" height="40" rx="4" fill="#e0904f" fill-opacity="0.85"/>
<text x="533" y="290" font-size="15" font-weight="600" fill="#e0904f">0.166</text>
<text x="56" y="104" font-size="14" fill="#a7adb5">tiên nghiệm 0.2 %, độ nhạy 99 %, báo nhầm 1 %: hệ số Bayes 99 mỗi lần báo độc lập</text>
</svg>
