<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="Inter, sans-serif">
<title>Đạo hàm theo hướng so với hướng đi</title>
<desc>Đường cosin của đạo hàm theo hướng theo góc so với gradient, với cực đại 4.472, bằng 0 tại 90 độ, cực tiểu trừ 4.472, và giá trị 2 cho hướng (1,0).</desc>
