<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="Inter, sans-serif">
<title>Trường hợp 3: biên pull-out của stepper trục Z</title>
<desc>Các điểm mô-men pull-out đọc bằng mắt từ đường cong SY42STH38-1684A (24 V, 1.68 A, nửa bước) so với T_M cần 17.3 N cm ở 1000 xung mỗi giây (20 mm/s), biên 1.6, và cùng đường cong thu về 1 A, giảm còn khoảng 17 N cm và trượt.</desc>
<defs></defs>
<rect width="900" height="520" rx="14" fill="#17181b"/>
<text x="32" y="44" font-size="22" fill="#e9e7e3" text-anchor="start" font-weight="bold">Trường hợp 3: biên pull-out của stepper trục Z</text>
<text x="32" y="70" font-size="15" fill="#a7adb5" text-anchor="start">Các điểm đọc từ datasheet bằng mắt, khoảng ±2 N cm; đoạn thẳng nối chúng chỉ để dẫn mắt</text>
<rect x="88" y="128" width="752" height="292" rx="4" fill="#22252a"/>
