<line x1="388" y1="390" x2="424" y2="390" stroke="#e58a80" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 5"/>
<text x="434" y="395" font-size="14" fill="#e9e7e3" text-anchor="start">1 A (A4988, không tản nhiệt), ×1/1.68, bậc nhất</text>
</svg>
