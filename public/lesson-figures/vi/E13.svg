<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" font-family="Inter, Arial, sans-serif">
<rect width="760" height="340" fill="#191b1f" rx="12"/>
<text x="20" y="32" fill="#e5e7eb" font-size="16" font-weight="bold" style="font-size:14.18px">Các giai đoạn như cổng, mỗi cổng có một kiểm tra</text>
<g fill="none" stroke-width="2">
<rect x="20" y="55" width="80" height="44" rx="8" stroke="#53b2dd"/><rect x="130" y="55" width="80" height="44" rx="8" stroke="#53b2dd"/>
<rect x="240" y="55" width="80" height="44" rx="8" stroke="#53b2dd"/><rect x="350" y="55" width="80" height="44" rx="8" stroke="#53b2dd"/>
<rect x="460" y="55" width="80" height="44" rx="8" stroke="#53b2dd"/>
</g>
<g fill="#e5e7eb" font-size="14" text-anchor="middle"><text x="60" y="82">gắp</text><text x="170" y="82" style="font-size:10.92px">nhấc</text><text x="280" y="82" style="font-size:10.92px">di chuyển</text><text x="390" y="82">đặt</text><text x="500" y="82">thả</text></g>
<g stroke="#e5e7eb" stroke-width="2"><path d="M100 77 L130 77"/><path d="M210 77 L240 77"/><path d="M320 77 L350 77"/><path d="M430 77 L460 77"/></g>
<g fill="#9ccd4e" font-size="13" text-anchor="middle"><text x="115" y="48">p</text><text x="225" y="48">p</text><text x="335" y="48">p</text><text x="445" y="48">p</text></g>
<path d="M170 105 L170 135 L60 135 L60 105" fill="none" stroke="#d97936" stroke-width="2" stroke-dasharray="5 4"/>
<text x="75" y="153" fill="#d97936" font-size="13" style="font-size:11.97px">lỗi được phát hiện (xác suất d): thử lại, tối đa R lần</text>
<text x="20" y="185" fill="#e5e7eb" font-size="13" style="font-size:11.34px">lỗi không phát hiện (1-d): âm thầm, tác vụ hỏng về sau</text>
<text x="20" y="208" fill="#e5e7eb" font-size="13" style="font-size:11.96px">đầu-cuối = tích xác suất thành công thật mỗi giai đoạn</text>
<line x1="590" y1="290" x2="740" y2="290" stroke="#e5e7eb"/><line x1="590" y1="290" x2="590" y2="60" stroke="#e5e7eb"/>
<text x="600" y="318" fill="#e5e7eb" font-size="13" style="font-size:10.14px">số giai đoạn n (1 đến 10)</text>
<text x="596" y="56" fill="#e5e7eb" font-size="13" style="font-size:10.14px">thành công tác vụ</text>
<path d="M590 83 C620 120 660 170 740 210" fill="none" stroke="#d97936" stroke-width="3"/>
<path d="M590 65 C640 75 690 90 740 106" fill="none" stroke="#9ccd4e" stroke-width="3"/>
<text x="620" y="232" fill="#d97936" font-size="13" style="font-size:11.4px">không phục hồi 0.35</text>
<text x="640" y="124" fill="#9ccd4e" font-size="13">d=0.8, R=3: 0.80</text>
<text x="20" y="262" fill="#e5e7eb" font-size="14" style="font-size:12.09px">p = 0.9 mỗi giai đoạn:</text>
<text x="20" y="284" fill="#d97936" font-size="14">0.9^10 = 0.349 không phục hồi</text>
<text x="20" y="306" fill="#9ccd4e" font-size="14">0.978^10 = 0.799 với d=0.8, R=3</text>
</svg>
