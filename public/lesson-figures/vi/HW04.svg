<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 450" font-family="Inter, Arial, sans-serif">
<title>Biểu đồ họ cảm biến</title>
<desc>Cảm biến nhóm theo thứ chúng đo: chuyển động của chính nó bên trái (encoder, IMU, đo dòng, công tắc giới hạn) và môi trường xung quanh bên phải (siêu âm, time-of-flight, LiDAR, camera, load cell), kèm giao tiếp và lỗi điển hình.</desc>
<rect width="760" height="450" fill="#191b1f" rx="12"/>
<text x="380" y="26" font-size="16" fill="#e5e7eb" text-anchor="middle" font-weight="bold">Biểu đồ họ cảm biến: đo gì, đọc thế nào, hỏng ra sao</text>
<text x="195" y="56" font-size="14" fill="#53b2dd" text-anchor="middle" font-weight="bold" style="font-size:10.92px">Chuyển động của chính nó (proprioceptive)</text>
<text x="565" y="56" font-size="14" fill="#9ccd4e" text-anchor="middle" font-weight="bold">Thế giới (exteroceptive)</text>
<rect x="20" y="70" width="350" height="58" rx="8" fill="#272a2f" stroke="#53b2dd" stroke-width="2"/>
<text x="195.0" y="87.0" font-size="11" fill="#e5e7eb" text-anchor="middle" font-weight="bold">Encoder</text>
<text x="195.0" y="103.0" font-size="11" fill="#e5e7eb" text-anchor="middle" style="font-size:10.57px">bánh hoặc khớp quay, dạng số đếm | xung A/B, giải mã x4</text>
<text x="195.0" y="119.0" font-size="11" fill="#e5e7eb" text-anchor="middle">lỗi: mất số đếm, trượt ở hạ nguồn</text>
<rect x="20" y="136" width="350" height="58" rx="8" fill="#272a2f" stroke="#53b2dd" stroke-width="2"/>
<text x="195.0" y="153.0" font-size="11" fill="#e5e7eb" text-anchor="middle" font-weight="bold">IMU (accel, gyro, mag)</text>
<text x="195.0" y="169.0" font-size="11" fill="#e5e7eb" text-anchor="middle">tốc độ quay, gia tốc | I2C hoặc SPI, thô 16-bit</text>
<text x="195.0" y="185.0" font-size="11" fill="#e5e7eb" text-anchor="middle">lỗi: gyro drift, nhiễu rung</text>
<rect x="20" y="202" width="350" height="58" rx="8" fill="#272a2f" stroke="#53b2dd" stroke-width="2"/>
<text x="195.0" y="219.0" font-size="11" fill="#e5e7eb" text-anchor="middle" font-weight="bold">Đo dòng / áp</text>
<text x="195.0" y="235.0" font-size="11" fill="#e5e7eb" text-anchor="middle" style="font-size:10.94px">dòng động cơ, điện áp pin | shunt + khuếch đại vào ADC</text>
<text x="195.0" y="251.0" font-size="11" fill="#e5e7eb" text-anchor="middle">lỗi: offset, sai gain</text>
<rect x="20" y="268" width="350" height="58" rx="8" fill="#272a2f" stroke="#53b2dd" stroke-width="2"/>
<text x="195.0" y="285.0" font-size="11" fill="#e5e7eb" text-anchor="middle" font-weight="bold" style="font-size:9.23px">Công tắc giới hạn / bumper</text>
<text x="195.0" y="301.0" font-size="11" fill="#e5e7eb" text-anchor="middle">chạm, cuối hành trình | ngõ vào số, chống dội</text>
<text x="195.0" y="317.0" font-size="11" fill="#e5e7eb" text-anchor="middle">lỗi: dội, đứt dây nếu NO</text>
<rect x="390" y="70" width="350" height="58" rx="8" fill="#272a2f" stroke="#9ccd4e" stroke-width="2"/>
<text x="565.0" y="87.0" font-size="11" fill="#e5e7eb" text-anchor="middle" font-weight="bold">Siêu âm (HC-SR04)</text>
<text x="565.0" y="103.0" font-size="11" fill="#e5e7eb" text-anchor="middle" style="font-size:10.67px">khoảng cách 2 đến 400 cm, nón 15 độ | xung trigger, độ rộng echo</text>
<text x="565.0" y="119.0" font-size="11" fill="#e5e7eb" text-anchor="middle" style="font-size:10.84px">lỗi: bề mặt mềm hoặc nghiêng</text>
<rect x="390" y="136" width="350" height="58" rx="8" fill="#272a2f" stroke="#9ccd4e" stroke-width="2"/>
<text x="565.0" y="153.0" font-size="11" fill="#e5e7eb" text-anchor="middle" font-weight="bold">IR Time-of-flight</text>
<text x="565.0" y="169.0" font-size="11" fill="#e5e7eb" text-anchor="middle" style="font-size:9.98px">khoảng cách theo trễ ánh sáng | I2C, tầm ngắn</text>
<text x="565.0" y="185.0" font-size="11" fill="#e5e7eb" text-anchor="middle">lỗi: ánh nắng, bề mặt tối</text>
<rect x="390" y="202" width="350" height="58" rx="8" fill="#272a2f" stroke="#9ccd4e" stroke-width="2"/>
<text x="565.0" y="219.0" font-size="11" fill="#e5e7eb" text-anchor="middle" font-weight="bold">LiDAR 2D</text>
<text x="565.0" y="235.0" font-size="11" fill="#e5e7eb" text-anchor="middle" style="font-size:9.86px">khoảng cách quanh robot | quét qua UART hoặc USB</text>
<text x="565.0" y="251.0" font-size="11" fill="#e5e7eb" text-anchor="middle">lỗi: kính, màu đen, gương</text>
<rect x="390" y="268" width="350" height="58" rx="8" fill="#272a2f" stroke="#9ccd4e" stroke-width="2"/>
<text x="565.0" y="285.0" font-size="11" fill="#e5e7eb" text-anchor="middle" font-weight="bold" style="font-size:10.9px">Camera RGB / độ sâu</text>
<text x="565.0" y="301.0" font-size="11" fill="#e5e7eb" text-anchor="middle">ảnh, độ sâu mỗi pixel | USB hoặc CSI</text>
<text x="565.0" y="317.0" font-size="11" fill="#e5e7eb" text-anchor="middle" style="font-size:9.88px">lỗi: ánh sáng, thiếu texture (V03, V04)</text>
<rect x="390" y="334" width="350" height="58" rx="8" fill="#272a2f" stroke="#9ccd4e" stroke-width="2"/>
<text x="565.0" y="351.0" font-size="11" fill="#e5e7eb" text-anchor="middle" font-weight="bold">Load cell + HX711</text>
<text x="565.0" y="367.0" font-size="11" fill="#e5e7eb" text-anchor="middle" style="font-size:10.36px">lực hoặc khối lượng | serial 2 dây, 24-bit</text>
<text x="565.0" y="383.0" font-size="11" fill="#e5e7eb" text-anchor="middle">lỗi: creep, trôi theo nhiệt độ</text>
<text x="195" y="388" font-size="12" fill="#d97936" text-anchor="middle" style="font-size:9.81px">Hợp nhất bằng bộ lọc trong C08</text>
<line x1="195" y1="330" x2="195" y2="372" stroke="#d97936" stroke-width="2" stroke-dasharray="5 4"/>
<text x="380" y="432" font-size="11" fill="#e5e7eb" text-anchor="middle">Đọc datasheet để biết tầm, tốc độ, trường nhìn, giao tiếp và sai số có thể gặp, không chỉ tầm ghi trên đầu trang</text>
</svg>
