<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="Inter, sans-serif">
<title>Hàm là quy tắc cộng với miền xác định đã khai báo</title>
<desc>Trái: x bình phương đưa hai đầu vào về cùng một đầu ra, nên không có hàm ngược trên toàn số thực. Phải: hiệu chuẩn m(n)=0.02(n-10) chỉ xác định với n từ 10 đến 1023.</desc>
<defs><marker id="M01arr6fc693" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 z" fill="#6fc693"/></marker><marker id="M01arr86abe2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 z" fill="#86abe2"/></marker><marker id="M01arre58a80" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 z" fill="#e58a80"/></marker></defs>
<rect width="900" height="420" rx="14" fill="#17181b"/>
<text x="32" y="44" font-size="22" fill="#e9e7e3" text-anchor="start" font-weight="bold">Hàm là quy tắc cộng với miền xác định đã khai báo</text>
<rect x="32" y="70" width="406" height="320" rx="10" fill="#22252a"/>
<text x="52" y="100" font-size="17" fill="#a7adb5" text-anchor="start" font-weight="bold">Mỗi đầu vào đúng một đầu ra</text>
<text x="92" y="136" font-size="15" fill="#a7adb5" text-anchor="middle" font-weight="normal">miền D</text>
<text x="372" y="136" font-size="15" fill="#a7adb5" text-anchor="middle" font-weight="normal">đầu ra</text>
<circle cx="92.0" cy="170.0" r="17" fill="#22252a" stroke="#86abe2" stroke-width="2"/>
<text x="92" y="175" font-size="15" fill="#e9e7e3" text-anchor="middle" font-weight="600">−2</text>
<circle cx="92.0" cy="214.0" r="17" fill="#22252a" stroke="#86abe2" stroke-width="2"/>
<text x="92" y="219" font-size="15" fill="#e9e7e3" text-anchor="middle" font-weight="600">2</text>
<circle cx="92.0" cy="258.0" r="17" fill="#22252a" stroke="#86abe2" stroke-width="2"/>
<text x="92" y="263" font-size="15" fill="#e9e7e3" text-anchor="middle" font-weight="600">3</text>
<circle cx="372.0" cy="192.0" r="17" fill="#22252a" stroke="#6fc693" stroke-width="2"/>
<text x="372" y="197" font-size="15" fill="#e9e7e3" text-anchor="middle" font-weight="600">4</text>
<circle cx="372.0" cy="258.0" r="17" fill="#22252a" stroke="#6fc693" stroke-width="2"/>
<text x="372" y="263" font-size="15" fill="#e9e7e3" text-anchor="middle" font-weight="600">9</text>
<line x1="111.0" y1="172.0" x2="353.0" y2="191.0" stroke="#86abe2" stroke-width="2" stroke-linecap="round" marker-end="url(#M01arr86abe2)"/>
<line x1="109.0" y1="212.0" x2="353.0" y2="193.0" stroke="#86abe2" stroke-width="2" stroke-linecap="round" marker-end="url(#M01arr86abe2)"/>
<line x1="111.0" y1="258.0" x2="353.0" y2="258.0" stroke="#86abe2" stroke-width="2" stroke-linecap="round" marker-end="url(#M01arr86abe2)"/>
<text x="232" y="152" font-size="15" fill="#e9e7e3" text-anchor="middle" font-weight="600">f(x) = x²</text>
<text x="52" y="316" font-size="14" fill="#a7adb5" text-anchor="start" font-weight="normal">−2 và 2 cùng ánh xạ về 4: hàm cho phép điều đó,</text>
<text x="52" y="338" font-size="14" fill="#a7adb5" text-anchor="start" font-weight="normal">nhưng đầu ra 4 không cho biết đầu vào nào.</text>
<text x="52" y="366" font-size="14" fill="#6fc693" text-anchor="start" font-weight="normal">Trên D = [0, ∞) hàm ngược là √y.</text>
<rect x="462" y="70" width="406" height="320" rx="10" fill="#22252a"/>
<text x="482" y="100" font-size="17" fill="#a7adb5" text-anchor="start" font-weight="bold">Hiệu chuẩn: hợp đồng đầu vào</text>
<text x="482" y="128" font-size="15" fill="#e9e7e3" text-anchor="start" font-weight="600">m(n) = 0.02 (n − 10),  n ∈ {10, …, 1023}</text>
<text x="560" y="164" font-size="15" fill="#a7adb5" text-anchor="end" font-weight="normal">n</text>
<text x="612" y="164" font-size="15" fill="#a7adb5" text-anchor="start" font-weight="normal">kết quả</text>
<line x1="482.0" y1="174.0" x2="848.0" y2="174.0" stroke="#3d4148" stroke-width="1.5" stroke-linecap="round"/>
<text x="560" y="204" font-size="15" fill="#e9e7e3" text-anchor="end" font-weight="600">9</text>
<line x1="574.0" y1="199.0" x2="600.0" y2="199.0" stroke="#e58a80" stroke-width="2" stroke-linecap="round" marker-end="url(#M01arre58a80)"/>
<text x="612" y="204" font-size="15" fill="#e58a80" text-anchor="start" font-weight="normal">lỗi: nhỏ hơn 10</text>
<text x="560" y="236" font-size="15" fill="#e9e7e3" text-anchor="end" font-weight="600">10</text>
<line x1="574.0" y1="231.0" x2="600.0" y2="231.0" stroke="#6fc693" stroke-width="2" stroke-linecap="round" marker-end="url(#M01arr6fc693)"/>
<text x="612" y="236" font-size="15" fill="#6fc693" text-anchor="start" font-weight="normal">0.00 m</text>
<text x="560" y="268" font-size="15" fill="#e9e7e3" text-anchor="end" font-weight="600">110</text>
<line x1="574.0" y1="263.0" x2="600.0" y2="263.0" stroke="#6fc693" stroke-width="2" stroke-linecap="round" marker-end="url(#M01arr6fc693)"/>
<text x="612" y="268" font-size="15" fill="#6fc693" text-anchor="start" font-weight="normal">2.00 m</text>
<text x="560" y="300" font-size="15" fill="#e9e7e3" text-anchor="end" font-weight="600">1023</text>
<line x1="574.0" y1="295.0" x2="600.0" y2="295.0" stroke="#6fc693" stroke-width="2" stroke-linecap="round" marker-end="url(#M01arr6fc693)"/>
<text x="612" y="300" font-size="15" fill="#6fc693" text-anchor="start" font-weight="normal">20.26 m</text>
<text x="560" y="332" font-size="15" fill="#e9e7e3" text-anchor="end" font-weight="600">1024</text>
<line x1="574.0" y1="327.0" x2="600.0" y2="327.0" stroke="#e58a80" stroke-width="2" stroke-linecap="round" marker-end="url(#M01arre58a80)"/>
<text x="612" y="332" font-size="15" fill="#e58a80" text-anchor="start" font-weight="normal">lỗi: lớn hơn 1023</text>
<text x="482" y="370" font-size="14" fill="#a7adb5" text-anchor="start" font-weight="normal">Kiểm thử cả hai biên và một giá trị ngoài mỗi biên.</text>
</svg>
