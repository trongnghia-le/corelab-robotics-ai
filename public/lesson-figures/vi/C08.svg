<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="Inter, sans-serif">
<title>Sai số chung: phương sai tuyên bố giảm, phương sai thật thì không</title>
<desc>Trái: hai cảm biến đo x và cả hai chứa cùng một sai số s. Phải: phương sai của trung bình hai cảm biến bằng nhau, tuyên bố 0.5 v cho sai số độc lập so với thật (1+rho)/2 v, khi tương quan rho của sai số tăng từ 0 đến 1.</desc>
<rect width="900" height="470" rx="14" fill="#17181b"/>
<defs><marker id="C08viarr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs>
<text x="32" y="44" font-size="22" font-weight="700" fill="#e9e7e3" text-anchor="start">Sai số chung: phương sai tuyên bố giảm, phương sai thật thì không</text>
<rect x="32" y="64" width="380" height="374" rx="10" fill="#22252a"/>
<rect x="436" y="64" width="432" height="374" rx="10" fill="#22252a"/>
<text x="52" y="92" font-size="17" font-weight="700" fill="#e9e7e3" text-anchor="start">Mô hình: m_i = x + s + n_i</text>
<rect x="52" y="116" width="340" height="56" rx="8" fill="none" stroke="#6cc6ba" stroke-width="2"/>
<text x="222" y="150" font-size="15" font-weight="600" fill="#6cc6ba" text-anchor="middle">sai số chung s  (Var s = σs²)</text>
<rect x="52" y="252" width="150" height="56" rx="8" fill="none" stroke="#86abe2" stroke-width="2"/>
<text x="127" y="276" font-size="15" font-weight="600" fill="#86abe2" text-anchor="middle">cảm biến 1</text>
<text x="127" y="298" font-size="14" font-weight="400" fill="#e9e7e3" text-anchor="middle">m₁ = x + s + n₁</text>
<rect x="242" y="252" width="150" height="56" rx="8" fill="none" stroke="#e0904f" stroke-width="2"/>
<text x="317" y="276" font-size="15" font-weight="600" fill="#e0904f" text-anchor="middle">cảm biến 2</text>
<text x="317" y="298" font-size="14" font-weight="400" fill="#e9e7e3" text-anchor="middle">m₂ = x + s + n₂</text>
<line x1="127.0" y1="172.0" x2="127.0" y2="250.0" stroke="#6cc6ba" stroke-width="2" marker-end="url(#C08viarr)"/>
<line x1="317.0" y1="172.0" x2="317.0" y2="250.0" stroke="#6cc6ba" stroke-width="2" marker-end="url(#C08viarr)"/>
<text x="142" y="218" font-size="15" font-weight="400" fill="#a7adb5" text-anchor="start">cùng s ở cả hai</text>
<text x="52" y="340" font-size="15" font-weight="400" fill="#e9e7e3" text-anchor="start">nhiễu độc lập n₁, n₂ triệt tiêu khi lấy trung bình;</text>
<text x="52" y="364" font-size="15" font-weight="400" fill="#e9e7e3" text-anchor="start">sai số chung s còn nguyên trong giá trị trung bình.</text>
<text x="52" y="396" font-size="14" font-weight="400" fill="#a7adb5" text-anchor="start">ρ = σs² / √(v₁v₂); hai cảm biến bằng nhau, v = σs² + ν</text>
<text x="52" y="420" font-size="14" font-weight="400" fill="#a7adb5" text-anchor="start">Trường hợp 1 của ví dụ: v = 0.04 m², ρ = 0.8</text>
<text x="456" y="92" font-size="17" font-weight="700" fill="#e9e7e3" text-anchor="start">Phương sai của (m₁ + m₂)/2, theo đơn vị v</text>
<text x="500" y="365" font-size="14" font-weight="400" fill="#a7adb5" text-anchor="end">0</text>
<line x1="508.0" y1="254.5" x2="840.0" y2="254.5" stroke="#2c3036" stroke-width="1"/>
<text x="500" y="259.545" font-size="14" font-weight="400" fill="#a7adb5" text-anchor="end">0.5</text>
<line x1="508.0" y1="149.1" x2="840.0" y2="149.1" stroke="#2c3036" stroke-width="1"/>
<text x="500" y="154.091" font-size="14" font-weight="400" fill="#a7adb5" text-anchor="end">1</text>
<line x1="508.0" y1="360.0" x2="508.0" y2="365.0" stroke="#a7adb5" stroke-width="1.5"/>
<text x="508" y="382" font-size="14" font-weight="400" fill="#a7adb5" text-anchor="middle">0</text>
<line x1="591.0" y1="360.0" x2="591.0" y2="365.0" stroke="#a7adb5" stroke-width="1.5"/>
<text x="591" y="382" font-size="14" font-weight="400" fill="#a7adb5" text-anchor="middle">0.25</text>
<line x1="674.0" y1="360.0" x2="674.0" y2="365.0" stroke="#a7adb5" stroke-width="1.5"/>
<text x="674" y="382" font-size="14" font-weight="400" fill="#a7adb5" text-anchor="middle">0.5</text>
<line x1="757.0" y1="360.0" x2="757.0" y2="365.0" stroke="#a7adb5" stroke-width="1.5"/>
<text x="757" y="382" font-size="14" font-weight="400" fill="#a7adb5" text-anchor="middle">0.75</text>
<line x1="840.0" y1="360.0" x2="840.0" y2="365.0" stroke="#a7adb5" stroke-width="1.5"/>
<text x="840" y="382" font-size="14" font-weight="400" fill="#a7adb5" text-anchor="middle">1</text>
<line x1="508.0" y1="360.0" x2="840.0" y2="360.0" stroke="#a7adb5" stroke-width="1.5"/>
<line x1="508.0" y1="360.0" x2="508.0" y2="128.0" stroke="#a7adb5" stroke-width="1.5"/>
<text x="840" y="406" font-size="15" font-weight="400" fill="#a7adb5" text-anchor="end">tương quan sai số ρ (không thứ nguyên)</text>
<text x="508" y="114" font-size="15" font-weight="400" fill="#a7adb5" text-anchor="start">phương sai / v</text>
<line x1="508.0" y1="254.5" x2="840.0" y2="254.5" stroke="#86abe2" stroke-width="2.5" stroke-dasharray="8 5"/>
