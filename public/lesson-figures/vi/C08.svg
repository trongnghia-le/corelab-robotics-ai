<text x="514.64" y="278.545" font-size="15" font-weight="400" fill="#86abe2" text-anchor="start">tuyên bố (độc lập): 0.5</text>
<text x="514.64" y="242.545" font-size="15" font-weight="400" fill="#86abe2" text-anchor="start"></text>
<circle cx="773.6" cy="170.2" r="6" fill="#e0904f" stroke="#17181b" stroke-width="1.5"/>
<text x="761.6" y="156.182" font-size="15" font-weight="600" fill="#e0904f" text-anchor="end">thật ở ρ = 0.8: 0.9</text>
<circle cx="840.0" cy="149.1" r="5" fill="#e0904f" stroke="#17181b" stroke-width="1.5"/>
<text x="514.64" y="191.273" font-size="15" font-weight="400" fill="#e0904f" text-anchor="start">thật = (1 + ρ)/2</text>
