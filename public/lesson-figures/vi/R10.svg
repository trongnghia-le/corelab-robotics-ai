<polygon points="404,120 404,66 464,66" fill="#d97936" fill-opacity="0.7" stroke="#d97936"/>
<polygon points="400,120 400,174 340,174" fill="#53b2dd" fill-opacity="0.6" stroke="#53b2dd"/>
<text x="470" y="82" fill="#d97936" font-size="13">kéo</text>
<text x="330" y="192" fill="#53b2dd" font-size="13" text-anchor="end">nén</text>
<text x="410" y="205" fill="#e5e7eb" font-size="13" style="font-size:12px">sigma = M y / I, lớn nhất tại y = h/2</text>
<g fill="none" stroke="#e5e7eb"><rect x="420" y="250" width="280" height="120"/><line x1="420" y1="280" x2="700" y2="280"/><line x1="520" y1="250" x2="520" y2="370"/><line x1="610" y1="250" x2="610" y2="370"/></g>
<g fill="#e5e7eb" font-size="13"><text x="430" y="271" style="font-size:10.14px">trường hợp</text><text x="530" y="271">F (N)</text><text x="620" y="271">FoS</text>
<text x="430" y="301">A tĩnh 1 g</text><text x="530" y="301">29</text><text x="620" y="301" fill="#9ccd4e">11.3</text>
<text x="430" y="326" style="font-size:12.26px">B gia tốc 4 g</text><text x="530" y="326">118</text><text x="620" y="326" fill="#9ccd4e">2.8</text>
