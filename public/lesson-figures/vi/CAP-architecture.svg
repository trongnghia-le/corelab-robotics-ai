<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" font-family="Inter, Arial, sans-serif" role="img">
<title>Kiến trúc hệ thống CoreBot Tidy</title>
<desc>Năm tầng từ vật lý ở dưới đến lớp tác vụ ở trên: thế giới MuJoCo, firmware in the loop, ước lượng và nhận thức của host, kỹ năng, lớp tác vụ; bộ giám sát an toàn xuyên qua mọi tầng và bộ đánh giá chạy bên dưới.</desc>
<rect width="1200" height="760" fill="#191b1f" rx="12"/>
<text x="600" y="28" font-size="20" fill="#e5e7eb" text-anchor="middle" font-weight="bold">CoreBot Tidy: một kiến trúc, chín milestone</text>
