<text x="330.0" y="111.7" font-size="12" fill="#e5e7eb" text-anchor="middle" style="font-size:11.87px">ngữ pháp, làm rõ</text>
<rect x="460" y="70" width="190" height="60" rx="8" fill="#272a2f" stroke="#ae9bea" stroke-width="2"/>
<text x="555.0" y="96.7" font-size="12" fill="#e5e7eb" text-anchor="middle" font-weight="bold">TaskGoal</text>
<text x="555.0" y="111.7" font-size="12" fill="#e5e7eb" text-anchor="middle">on(obj, bin)</text>
