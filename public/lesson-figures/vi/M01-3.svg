<text x="696" y="299" font-size="15" fill="#6fc693" text-anchor="start" font-weight="600">f⁻¹: (y − 1)/2</text>
<line x1="682.0" y1="226.0" x2="682.0" y2="170.0" stroke="#6fc693" stroke-width="2.5" stroke-linecap="round" marker-end="url(#M013arr6fc693)"/>
<text x="696" y="203" font-size="15" fill="#6fc693" text-anchor="start" font-weight="600">g⁻¹: (y + 4)/3</text>
<text x="482" y="402" font-size="14" fill="#a7adb5" text-anchor="start" font-weight="normal">(f ∘ g)(x) = 6x − 7;  hàm ngược: (y + 7)/6</text>
<text x="482" y="424" font-size="14" fill="#a7adb5" text-anchor="start" font-weight="normal">Kiểm tra: (23 + 7)/6 = 5</text>
