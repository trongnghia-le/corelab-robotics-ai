<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="Inter, sans-serif">
<title>Hàm ngược: một-một, và hoàn tác theo thứ tự ngược</title>
<desc>Đường nằm ngang cắt x bình phương hai lần nhưng cắt đường 3x-5 một lần; với f(g(x)), g=3x-4, f=2x+1 hàm ngược áp dụng f ngược trước, rồi g ngược.</desc>
