<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" font-family="Inter, sans-serif">
<title>Ví dụ 2: tay máy 3R dư bậc đổi khớp trong khi đầu mút đứng yên</title>
<desc>Tay máy 3R phẳng khâu đơn vị tại q=(0.3,0.6,0.9) rad, đầu mút ở (1.350,2.053) m. Trái: các tư thế tự chuyển động theo không gian null của J giữ đầu mút cố định. Phải: tốc độ khớp cho vận tốc đầu mút (0.1,0.05) m/s theo nghiệm chuẩn nhỏ nhất và khi thêm tác vụ phụ kéo về không.</desc>
<defs></defs>
<rect width="900" height="540" rx="14" fill="#17181b"/>
<text x="32" y="44" font-size="22" fill="#e9e7e3" font-weight="700">Ví dụ 2: tay máy 3R dư bậc đổi khớp trong khi đầu mút đứng yên</text>
<rect x="32" y="70" width="430" height="450" rx="10" fill="#22252a" stroke="none" stroke-width="1.5" />
<rect x="486" y="70" width="382" height="450" rx="10" fill="#22252a" stroke="none" stroke-width="1.5" />
<text x="48" y="98" font-size="17" fill="#e9e7e3" font-weight="700">Tư thế trong không gian null, đầu mút cố định</text>
<text x="502" y="98" font-size="17" fill="#e9e7e3" font-weight="700">Tốc độ khớp cho v = (0.1, 0.05) m/s</text>
<path d="M170.0,436.0 L319.5,423.4 L344.5,275.5 L372.5,128.1" fill="none" stroke="#ae9ce6" stroke-width="2" stroke-dasharray="5 4" stroke-linejoin="round"/>
<path d="M170.0,436.0 L318.4,414.4 L380.6,277.9 L372.5,128.1" fill="none" stroke="#ae9ce6" stroke-width="2" stroke-dasharray="5 4" stroke-linejoin="round"/>
<path d="M170.0,436.0 L300.7,362.5 L419.3,270.6 L372.5,128.1" fill="none" stroke="#ae9ce6" stroke-width="2" stroke-dasharray="5 4" stroke-linejoin="round"/>
<path d="M170.0,436.0 L278.3,332.2 L415.6,271.8 L372.5,128.1" fill="none" stroke="#ae9ce6" stroke-width="2" stroke-dasharray="5 4" stroke-linejoin="round"/>
<path d="M170.0,436.0 L313.3,391.7 L406.5,274.2 L372.5,128.1" fill="none" stroke="#e9e7e3" stroke-width="5" stroke-linejoin="round"/>
<circle cx="170.0" cy="436.0" r="7.0" fill="#17181b" stroke="#e9e7e3" stroke-width="2.5"/>
<circle cx="313.3" cy="391.7" r="7.0" fill="#17181b" stroke="#e9e7e3" stroke-width="2.5"/>
<circle cx="406.5" cy="274.2" r="7.0" fill="#17181b" stroke="#e9e7e3" stroke-width="2.5"/>
<circle cx="372.5" cy="128.1" r="6.0" fill="#e0904f" stroke="#e0904f" stroke-width="1"/>
<text x="358" y="133" font-size="15" fill="#e9e7e3" text-anchor="end">đầu mút p = (1.350, 2.053) m</text>
<line x1="48.0" y1="482.0" x2="78.0" y2="482.0" stroke="#e9e7e3" stroke-width="4" stroke-linecap="round"/>
<text x="86" y="487" font-size="14" fill="#a7adb5">q cho trước = (0.3, 0.6, 0.9) rad</text>
<line x1="48.0" y1="504.0" x2="78.0" y2="504.0" stroke="#ae9ce6" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 4"/>
<text x="86" y="509" font-size="14" fill="#a7adb5">tự chuyển động, cùng đầu mút</text>
<line x1="510.0" y1="262.0" x2="850.0" y2="262.0" stroke="#3d4148" stroke-width="1.5" stroke-linecap="round"/>
<text x="510" y="126" font-size="14" fill="#a7adb5">tốc độ khớp (rad/s)</text>
<rect x="524" y="238" width="34" height="24" rx="2" fill="#86abe2" stroke="none" stroke-width="1.5" />
<text x="541" y="230" font-size="14" fill="#e9e7e3" text-anchor="middle">+0.039</text>
<rect x="574" y="260" width="34" height="2" rx="2" fill="#e0904f" stroke="none" stroke-width="1.5" />
<text x="591" y="252" font-size="14" fill="#e9e7e3" text-anchor="middle">+0.003</text>
<text x="566" y="410" font-size="15" fill="#e9e7e3" font-weight="600" text-anchor="middle">q̇₁</text>
<rect x="634" y="262" width="34" height="34" rx="2" fill="#86abe2" stroke="none" stroke-width="1.5" />
<text x="651" y="316" font-size="14" fill="#e9e7e3" text-anchor="middle">-0.056</text>
<rect x="684" y="247" width="34" height="15" rx="2" fill="#e0904f" stroke="none" stroke-width="1.5" />
<text x="701" y="239" font-size="14" fill="#e9e7e3" text-anchor="middle">+0.026</text>
<text x="676" y="410" font-size="15" fill="#e9e7e3" font-weight="600" text-anchor="middle">q̇₂</text>
<rect x="744" y="262" width="34" height="50" rx="2" fill="#86abe2" stroke="none" stroke-width="1.5" />
<text x="761" y="332" font-size="14" fill="#e9e7e3" text-anchor="middle">-0.084</text>
<rect x="794" y="262" width="34" height="93" rx="2" fill="#e0904f" stroke="none" stroke-width="1.5" />
<text x="811" y="375" font-size="14" fill="#e9e7e3" text-anchor="middle">-0.156</text>
<text x="786" y="410" font-size="15" fill="#e9e7e3" font-weight="600" text-anchor="middle">q̇₃</text>
<rect x="502" y="448" width="14" height="14" rx="2" fill="#86abe2" stroke="none" stroke-width="1.5" />
<text x="524" y="461" font-size="14" fill="#a7adb5">J⁺v (chuẩn nhỏ nhất)   ‖q̇‖ = 0.1085</text>
<rect x="502" y="472" width="14" height="14" rx="2" fill="#e0904f" stroke="none" stroke-width="1.5" />
<text x="524" y="485" font-size="14" fill="#a7adb5">J⁺v + 0.5 (I − J⁺J)(−q)   ‖q̇‖ = 0.1579</text>
<text x="502" y="508" font-size="14" fill="#a7adb5">cả hai cho J q̇ = (0.1, 0.05) m/s</text>
</svg>
