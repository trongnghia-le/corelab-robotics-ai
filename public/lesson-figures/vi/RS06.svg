<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420">
  <rect width="760" height="420" fill="#191b1f" rx="12"/>
  <g font-family="Inter, Arial, sans-serif" fill="#e5e7eb" font-size="14">
    <text x="380" y="30" text-anchor="middle" font-size="16" font-weight="bold">Kết luận chỉ mạnh bằng bằng chứng và giả định bên dưới</text>
    <text x="110" y="64" text-anchor="middle" fill="#d97936" font-weight="bold" style="font-size:11.25px">KẾT LUẬN</text>
    <text x="380" y="64" text-anchor="middle" fill="#53b2dd" font-weight="bold" style="font-size:10.92px">BẰNG CHỨNG</text>
    <text x="650" y="64" text-anchor="middle" fill="#9ccd4e" font-weight="bold">GIẢ ĐỊNH</text>
    <!-- claims -->
    <rect x="20" y="80" width="180" height="70" rx="8" fill="none" stroke="#d97936" stroke-width="2"/>
    <text x="110" y="108" text-anchor="middle">C1: tỉ lệ thành công</text>
    <text x="110" y="128" text-anchor="middle">cao hơn baseline</text>
    <rect x="20" y="180" width="180" height="70" rx="8" fill="none" stroke="#d97936" stroke-width="2"/>
    <text x="110" y="208" text-anchor="middle">C2: chạy trên</text>
    <text x="110" y="228" text-anchor="middle">robot thật</text>
    <rect x="20" y="280" width="180" height="70" rx="8" fill="none" stroke="#d97936" stroke-width="2"/>
    <text x="110" y="308" text-anchor="middle">C3: cải thiện đến từ</text>
    <text x="110" y="328" text-anchor="middle">cost map đã học</text>
    <!-- evidence -->
    <rect x="290" y="80" width="180" height="70" rx="8" fill="none" stroke="#53b2dd" stroke-width="2"/>
    <text x="380" y="108" text-anchor="middle">Bảng 2: 5 seed,</text>
    <text x="380" y="128" text-anchor="middle">+1.8 điểm, t = 1.4</text>
    <rect x="290" y="180" width="180" height="70" rx="8" fill="none" stroke="#53b2dd" stroke-width="2"/>
    <text x="380" y="208" text-anchor="middle" style="font-size:13.52px">Hình 6: một video,</text>
    <text x="380" y="228" text-anchor="middle" style="font-size:10.92px">n = 1 lần chạy</text>
    <rect x="290" y="280" width="180" height="70" rx="8" fill="none" stroke="#53b2dd" stroke-width="2" stroke-dasharray="6 5"/>
    <text x="380" y="308" text-anchor="middle" style="font-size:10.92px">không có ablation</text>
    <text x="380" y="328" text-anchor="middle" style="font-size:10.92px">được báo cáo</text>
    <!-- assumptions -->
    <rect x="560" y="80" width="180" height="70" rx="8" fill="none" stroke="#9ccd4e" stroke-width="2"/>
    <text x="650" y="108" text-anchor="middle">map test lấy từ</text>
    <text x="650" y="128" text-anchor="middle" style="font-size:12.65px">cùng họ với map huấn luyện</text>
    <rect x="560" y="180" width="180" height="70" rx="8" fill="none" stroke="#9ccd4e" stroke-width="2"/>
    <text x="650" y="208" text-anchor="middle">định vị hoàn hảo,</text>
    <text x="650" y="228" text-anchor="middle">nhiễu lidar Gaussian</text>
    <rect x="560" y="280" width="180" height="70" rx="8" fill="none" stroke="#9ccd4e" stroke-width="2"/>
    <text x="650" y="308" text-anchor="middle" style="font-size:13.07px">cùng ngân sách tính toán</text>
    <text x="650" y="328" text-anchor="middle" style="font-size:10.92px">cho cả hai phương pháp</text>
    <!-- arrows -->
    <line x1="200" y1="115" x2="288" y2="115" stroke="#e5e7eb" stroke-width="2"/>
    <polygon points="288,115 278,110 278,120" fill="#e5e7eb"/>
    <line x1="200" y1="215" x2="288" y2="215" stroke="#e5e7eb" stroke-width="2"/>
    <polygon points="288,215 278,210 278,220" fill="#e5e7eb"/>
    <line x1="200" y1="315" x2="288" y2="315" stroke="#e5e7eb" stroke-width="2" stroke-dasharray="6 5"/>
    <line x1="560" y1="115" x2="472" y2="115" stroke="#e5e7eb" stroke-width="2"/>
    <polygon points="472,115 482,110 482,120" fill="#e5e7eb"/>
    <line x1="560" y1="215" x2="472" y2="215" stroke="#e5e7eb" stroke-width="2"/>
    <polygon points="472,215 482,210 482,220" fill="#e5e7eb"/>
    <line x1="560" y1="315" x2="472" y2="315" stroke="#e5e7eb" stroke-width="2"/>
    <polygon points="472,315 482,310 482,320" fill="#e5e7eb"/>
    <text x="244" y="104" text-anchor="middle" font-size="13">yếu</text>
    <text x="244" y="204" text-anchor="middle" font-size="13">n = 1</text>
    <text x="244" y="304" text-anchor="middle" font-size="13" style="font-size:10.14px">không có</text>
    <text x="380" y="385" text-anchor="middle" font-size="14" fill="#d97936">Mỗi hàng: bằng chứng có phủ hết kết luận không, và điều gì phải đúng?</text>
  </g>
</svg>
