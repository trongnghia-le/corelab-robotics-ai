<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="Inter, sans-serif">
<title>Forwarding reference: từ lời gọi đến giá trị forward trả về</title>
<desc>Ba lời gọi f(i), f(ci), f(0) của template &lt;class T&gt; void f(T&amp;&amp;): T được suy ra, kiểu tham số sau khi reference collapsing, và value category mà std::forward&lt;T&gt;(x) khôi phục. Một dải liệt kê bốn quy tắc collapsing.</desc>
<defs><marker id="b2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a7adb5"/></marker></defs>
<rect width="900" height="500" rx="14" fill="#17181b"/>
<text x="32" y="44" font-size="22" font-weight="bold" fill="#e9e7e3">Forwarding reference: từ lời gọi đến giá trị forward trả về</text>
<rect x="32" y="64" width="836" height="404" rx="10" fill="#22252a"/>
<text x="52" y="100" font-size="17" font-weight="bold" fill="#e9e7e3">lời gọi  f(e)</text>
<text x="296" y="100" font-size="17" font-weight="bold" fill="#e9e7e3">T suy ra</text>
<text x="496" y="100" font-size="17" font-weight="bold" fill="#e9e7e3">tham số T&amp;&amp;</text>
<text x="696" y="100" font-size="17" font-weight="bold" fill="#e9e7e3">std::forward&lt;T&gt;(x)</text>
<rect x="52" y="120" width="200" height="52" rx="8" fill="#17181b" stroke="#3d4148" stroke-width="2"/>
<text x="66" y="152" font-size="15" fill="#e9e7e3">f(i)   int i;</text>
<line x1="252" y1="146" x2="296" y2="146" stroke="#a7adb5" stroke-width="2" marker-end="url(#b2)"/>
<rect x="296" y="120" width="150" height="52" rx="8" fill="#17181b" stroke="#86abe2" stroke-width="2"/>
<text x="310" y="152" font-size="15" font-weight="600" fill="#86abe2">int&amp;</text>
<line x1="446" y1="146" x2="496" y2="146" stroke="#a7adb5" stroke-width="2" marker-end="url(#b2)"/>
<rect x="496" y="120" width="160" height="52" rx="8" fill="#17181b" stroke="#86abe2" stroke-width="2"/>
<text x="510" y="152" font-size="15" font-weight="600" fill="#86abe2">int&amp;</text>
<line x1="656" y1="146" x2="696" y2="146" stroke="#a7adb5" stroke-width="2" marker-end="url(#b2)"/>
<rect x="696" y="120" width="156" height="52" rx="8" fill="#17181b" stroke="#86abe2" stroke-width="2"/>
<text x="710" y="152" font-size="15" font-weight="600" fill="#86abe2">lvalue</text>
<rect x="52" y="192" width="200" height="52" rx="8" fill="#17181b" stroke="#3d4148" stroke-width="2"/>
<text x="66" y="224" font-size="15" fill="#e9e7e3">f(ci)   const int ci;</text>
<line x1="252" y1="218" x2="296" y2="218" stroke="#a7adb5" stroke-width="2" marker-end="url(#b2)"/>
<rect x="296" y="192" width="150" height="52" rx="8" fill="#17181b" stroke="#6fc693" stroke-width="2"/>
<text x="310" y="224" font-size="15" font-weight="600" fill="#6fc693">const int&amp;</text>
<line x1="446" y1="218" x2="496" y2="218" stroke="#a7adb5" stroke-width="2" marker-end="url(#b2)"/>
<rect x="496" y="192" width="160" height="52" rx="8" fill="#17181b" stroke="#6fc693" stroke-width="2"/>
<text x="510" y="224" font-size="15" font-weight="600" fill="#6fc693">const int&amp;</text>
<line x1="656" y1="218" x2="696" y2="218" stroke="#a7adb5" stroke-width="2" marker-end="url(#b2)"/>
<rect x="696" y="192" width="156" height="52" rx="8" fill="#17181b" stroke="#6fc693" stroke-width="2"/>
<text x="710" y="224" font-size="15" font-weight="600" fill="#6fc693">lvalue (const)</text>
<rect x="52" y="264" width="200" height="52" rx="8" fill="#17181b" stroke="#3d4148" stroke-width="2"/>
<text x="66" y="296" font-size="15" fill="#e9e7e3">f(0)</text>
<line x1="252" y1="290" x2="296" y2="290" stroke="#a7adb5" stroke-width="2" marker-end="url(#b2)"/>
