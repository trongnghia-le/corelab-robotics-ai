<rect x="496" y="264" width="160" height="52" rx="8" fill="#17181b" stroke="#e0904f" stroke-width="2"/>
<text x="510" y="296" font-size="15" font-weight="600" fill="#e0904f">int&amp;&amp;</text>
<line x1="656" y1="290" x2="696" y2="290" stroke="#a7adb5" stroke-width="2" marker-end="url(#b2)"/>
<rect x="696" y="264" width="156" height="52" rx="8" fill="#17181b" stroke="#e0904f" stroke-width="2"/>
<text x="710" y="296" font-size="15" font-weight="600" fill="#e0904f">rvalue</text>
<text x="52" y="368" font-size="17" font-weight="bold" fill="#e9e7e3">Reference collapsing</text>
<rect x="52" y="384" width="180" height="50" rx="8" fill="#17181b" stroke="#3d4148" stroke-width="2"/>
<text x="66" y="415" font-size="15" fill="#e9e7e3">&amp; &amp;   →   &amp;</text>
<rect x="252" y="384" width="180" height="50" rx="8" fill="#17181b" stroke="#3d4148" stroke-width="2"/>
<text x="266" y="415" font-size="15" fill="#e9e7e3">&amp; &amp;&amp;   →   &amp;</text>
<rect x="452" y="384" width="180" height="50" rx="8" fill="#17181b" stroke="#3d4148" stroke-width="2"/>
<text x="466" y="415" font-size="15" fill="#e9e7e3">&amp;&amp; &amp;   →   &amp;</text>
<rect x="652" y="384" width="180" height="50" rx="8" fill="#17181b" stroke="#e0904f" stroke-width="2"/>
<text x="666" y="415" font-size="15" font-weight="600" fill="#e0904f">&amp;&amp; &amp;&amp;   →   &amp;&amp;</text>
<text x="52" y="456" font-size="14" fill="#a7adb5">chỉ &amp;&amp; &amp;&amp; còn là rvalue reference; T = int&amp; cho int&amp; &amp;&amp; = int&amp;</text>
</svg>
