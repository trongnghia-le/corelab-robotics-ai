<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="Inter, sans-serif">
<title>Mỗi archive chỉ quét một lần: tập U</title>
<desc>Vết của tập U các symbol chưa định nghĩa cho ba dòng lệnh link với libA.a và libB.a.</desc>
<rect width="900" height="470" rx="14" fill="#17181b"/>
<defs><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#a7adb5"/></marker></defs>
<text x="32" y="44" font-size="22" font-weight="700" fill="#e9e7e3">Mỗi archive chỉ quét một lần: tập U</text>
<text x="32" y="70" font-size="14" fill="#a7adb5">main.o cần fa1. libA.a = {a1.o: định nghĩa fa1, cần fb1; a2.o: định nghĩa fa2}. libB.a = {b1.o: định nghĩa fb1, cần fa2}.</text>
<text x="32" y="110" font-size="17" font-weight="700" fill="#e9e7e3">dòng link</text>
<text x="190" y="110" font-size="17" font-weight="700" fill="#e9e7e3">bắt đầu</text>
<text x="338" y="110" font-size="17" font-weight="700" fill="#e9e7e3">quét 1</text>
<text x="486" y="110" font-size="17" font-weight="700" fill="#e9e7e3">quét 2</text>
<text x="634" y="110" font-size="17" font-weight="700" fill="#e9e7e3">quét 3</text>
<text x="786" y="110" font-size="17" font-weight="700" fill="#e9e7e3">kết quả</text>
<text x="32" y="168" font-size="15" fill="#e9e7e3" font-family="monospace">-lA -lB</text>
<rect x="190" y="130" width="124" height="60" rx="8" fill="#22252a" stroke="#3d4148" stroke-width="1.5"/>
<text x="204" y="156" font-size="15" fill="#e9e7e3" font-family="monospace">U = {fa1}</text>
<text x="204" y="178" font-size="14" fill="#a7adb5">main.o</text>
<line x1="317" y1="160" x2="337" y2="160" stroke="#a7adb5" stroke-width="2" marker-end="url(#ahb)"/>
<rect x="338" y="130" width="124" height="60" rx="8" fill="#22252a" stroke="#86abe2" stroke-width="1.5"/>
<text x="352" y="156" font-size="15" fill="#e9e7e3" font-family="monospace">U = {fb1}</text>
<text x="352" y="178" font-size="14" fill="#a7adb5">libA: +a1.o</text>
<line x1="465" y1="160" x2="485" y2="160" stroke="#a7adb5" stroke-width="2" marker-end="url(#ahb)"/>
<rect x="486" y="130" width="124" height="60" rx="8" fill="#22252a" stroke="#86abe2" stroke-width="1.5"/>
<text x="500" y="156" font-size="15" fill="#e9e7e3" font-family="monospace">U = {fa2}</text>
<text x="500" y="178" font-size="14" fill="#a7adb5">libB: +b1.o</text>
<rect x="634" y="130" width="124" height="60" rx="8" fill="none" stroke="#3d4148" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="696" y="166" font-size="14" fill="#a7adb5" text-anchor="middle">không quét</text>
<rect x="786" y="130" width="82" height="60" rx="8" fill="#22252a" stroke="#e58a80" stroke-width="2"/>
<text x="827" y="156" font-size="14" font-weight="600" fill="#e58a80" text-anchor="middle">thiếu</text>
<text x="827" y="176" font-size="14" fill="#e58a80" text-anchor="middle" font-family="monospace">fa2</text>
<text x="32" y="268" font-size="15" fill="#e9e7e3" font-family="monospace">-lB -lA</text>
<rect x="190" y="230" width="124" height="60" rx="8" fill="#22252a" stroke="#3d4148" stroke-width="1.5"/>
<text x="204" y="256" font-size="15" fill="#e9e7e3" font-family="monospace">U = {fa1}</text>
<text x="204" y="278" font-size="14" fill="#a7adb5">main.o</text>
<line x1="317" y1="260" x2="337" y2="260" stroke="#a7adb5" stroke-width="2" marker-end="url(#ahb)"/>
<rect x="338" y="230" width="124" height="60" rx="8" fill="#22252a" stroke="#86abe2" stroke-width="1.5"/>
<text x="352" y="256" font-size="15" fill="#e9e7e3" font-family="monospace">U = {fa1}</text>
<text x="352" y="278" font-size="14" fill="#a7adb5">libB: không gì</text>
<line x1="465" y1="260" x2="485" y2="260" stroke="#a7adb5" stroke-width="2" marker-end="url(#ahb)"/>
<rect x="486" y="230" width="124" height="60" rx="8" fill="#22252a" stroke="#86abe2" stroke-width="1.5"/>
<text x="500" y="256" font-size="15" fill="#e9e7e3" font-family="monospace">U = {fb1}</text>
<text x="500" y="278" font-size="14" fill="#a7adb5">libA: +a1.o</text>
<rect x="634" y="230" width="124" height="60" rx="8" fill="none" stroke="#3d4148" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="696" y="266" font-size="14" fill="#a7adb5" text-anchor="middle">không quét</text>
<rect x="786" y="230" width="82" height="60" rx="8" fill="#22252a" stroke="#e58a80" stroke-width="2"/>
<text x="827" y="256" font-size="14" font-weight="600" fill="#e58a80" text-anchor="middle">thiếu</text>
<text x="827" y="276" font-size="14" fill="#e58a80" text-anchor="middle" font-family="monospace">fb1</text>
<text x="32" y="368" font-size="15" fill="#e9e7e3" font-family="monospace">-lA -lB -lA</text>
<rect x="190" y="330" width="124" height="60" rx="8" fill="#22252a" stroke="#3d4148" stroke-width="1.5"/>
<text x="204" y="356" font-size="15" fill="#e9e7e3" font-family="monospace">U = {fa1}</text>
<text x="204" y="378" font-size="14" fill="#a7adb5">main.o</text>
<line x1="317" y1="360" x2="337" y2="360" stroke="#a7adb5" stroke-width="2" marker-end="url(#ahb)"/>
<rect x="338" y="330" width="124" height="60" rx="8" fill="#22252a" stroke="#86abe2" stroke-width="1.5"/>
<text x="352" y="356" font-size="15" fill="#e9e7e3" font-family="monospace">U = {fb1}</text>
<text x="352" y="378" font-size="14" fill="#a7adb5">libA: +a1.o</text>
<line x1="465" y1="360" x2="485" y2="360" stroke="#a7adb5" stroke-width="2" marker-end="url(#ahb)"/>
<rect x="486" y="330" width="124" height="60" rx="8" fill="#22252a" stroke="#86abe2" stroke-width="1.5"/>
<text x="500" y="356" font-size="15" fill="#e9e7e3" font-family="monospace">U = {fa2}</text>
<text x="500" y="378" font-size="14" fill="#a7adb5">libB: +b1.o</text>
<line x1="613" y1="360" x2="633" y2="360" stroke="#a7adb5" stroke-width="2" marker-end="url(#ahb)"/>
<rect x="634" y="330" width="124" height="60" rx="8" fill="#22252a" stroke="#86abe2" stroke-width="1.5"/>
<text x="648" y="356" font-size="15" fill="#e9e7e3" font-family="monospace">U = { }</text>
<text x="648" y="378" font-size="14" fill="#a7adb5">libA: +a2.o</text>
<rect x="786" y="330" width="82" height="60" rx="8" fill="#22252a" stroke="#6fc693" stroke-width="2"/>
<text x="827" y="356" font-size="14" font-weight="600" fill="#6fc693" text-anchor="middle">link được</text>
<text x="827" y="376" font-size="14" fill="#6fc693" text-anchor="middle" font-family="monospace"></text>
<text x="32" y="440" font-size="14" fill="#a7adb5">U = các symbol còn chưa định nghĩa. Archive chỉ quét một lần, tại vị trí của nó, và chỉ lấy member định nghĩa symbol trong U.</text>
</svg>
