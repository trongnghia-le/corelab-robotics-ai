<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="Inter, sans-serif">
<title>Đối số mặc định: một list cho mọi lời gọi</title>
<desc>Trái: add(x, acc=[]) giữ một list trong __defaults__; add(1) rồi add(2) làm lớn cùng list đó và print hiện [1, 2] hai lần. Phải: acc=None tạo list mới mỗi lời gọi và in [1] [2].</desc>
<defs><marker id="ahP3de0904f" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 z" fill="#e0904f"/></marker></defs>
<rect width="900" height="520" rx="14" fill="#17181b"/>
<text x="32" y="44" font-size="22" fill="#e9e7e3" text-anchor="start" font-weight="bold">Đối số mặc định: một list cho mọi lời gọi</text>
<rect x="32" y="72" width="406" height="400" rx="6" fill="#22252a" stroke="#3d4148" stroke-width="1.5"/>
<text x="48" y="102" font-size="17" fill="#e0904f" text-anchor="start" font-weight="bold">def add(x, acc=[])</text>
<text x="48" y="126" font-size="14" fill="#a7adb5" text-anchor="start">add.__defaults__ = ([],)</text>
<rect x="462" y="72" width="406" height="400" rx="6" fill="#22252a" stroke="#3d4148" stroke-width="1.5"/>
<text x="478" y="102" font-size="17" fill="#6fc693" text-anchor="start" font-weight="bold">def add(x, acc=None)</text>
<text x="478" y="126" font-size="14" fill="#a7adb5" text-anchor="start">add.__defaults__ = (None,)</text>
<text x="48" y="175" font-size="15" fill="#e9e7e3" text-anchor="start">sau def</text>
<text x="48" y="275" font-size="15" fill="#e9e7e3" text-anchor="start">add(1)</text>
<text x="48" y="375" font-size="15" fill="#e9e7e3" text-anchor="start">add(2)</text>
<text x="478" y="175" font-size="15" fill="#e9e7e3" text-anchor="start">sau def</text>
<text x="478" y="275" font-size="15" fill="#e9e7e3" text-anchor="start">add(1)</text>
<text x="478" y="375" font-size="15" fill="#e9e7e3" text-anchor="start">add(2)</text>
<rect x="176" y="152" width="110" height="36" rx="6" fill="#3a2a1e" stroke="#e0904f" stroke-width="2"/>
<text x="231" y="175" font-size="15" fill="#e9e7e3" text-anchor="middle" font-weight="600">[ ]</text>
<rect x="176" y="252" width="110" height="36" rx="6" fill="#3a2a1e" stroke="#e0904f" stroke-width="2"/>
<text x="231" y="275" font-size="15" fill="#e9e7e3" text-anchor="middle" font-weight="600">[1]</text>
<rect x="176" y="352" width="110" height="36" rx="6" fill="#3a2a1e" stroke="#e0904f" stroke-width="2"/>
<text x="231" y="375" font-size="15" fill="#e9e7e3" text-anchor="middle" font-weight="600">[1, 2]</text>
<line x1="231" y1="188" x2="231" y2="250" stroke="#e0904f" stroke-width="2" marker-end="url(#ahP3de0904f)" stroke-linecap="round"/>
<text x="246" y="226" font-size="14" fill="#a7adb5" text-anchor="start">append(1) tại chỗ</text>
<line x1="231" y1="288" x2="231" y2="350" stroke="#e0904f" stroke-width="2" marker-end="url(#ahP3de0904f)" stroke-linecap="round"/>
<text x="246" y="326" font-size="14" fill="#a7adb5" text-anchor="start">append(2) tại chỗ</text>
<text x="48" y="416" font-size="14" fill="#a7adb5" text-anchor="start">print(add(1), add(2))</text>
<text x="48" y="442" font-size="17" fill="#e0904f" text-anchor="start" font-weight="bold">[1, 2] [1, 2]</text>
<text x="190" y="442" font-size="14" fill="#a7adb5" text-anchor="start">hai kết quả là cùng một list</text>
<rect x="606" y="152" width="110" height="36" rx="6" fill="#22252a" stroke="#a7adb5" stroke-width="2" stroke-dasharray="5 4"/>
<text x="661" y="175" font-size="15" fill="#a7adb5" text-anchor="middle" font-weight="600">None</text>
<text x="728" y="175" font-size="14" fill="#a7adb5" text-anchor="start">bất biến</text>
<rect x="606" y="252" width="110" height="36" rx="6" fill="#1f3329" stroke="#6fc693" stroke-width="2"/>
<text x="661" y="275" font-size="15" fill="#e9e7e3" text-anchor="middle" font-weight="600">[1]</text>
<rect x="606" y="352" width="110" height="36" rx="6" fill="#1f3329" stroke="#6fc693" stroke-width="2"/>
<text x="661" y="375" font-size="15" fill="#e9e7e3" text-anchor="middle" font-weight="600">[2]</text>
<text x="728" y="275" font-size="14" fill="#a7adb5" text-anchor="start">list mới mỗi lời gọi</text>
<text x="478" y="416" font-size="14" fill="#a7adb5" text-anchor="start">print(add(1), add(2))</text>
<text x="478" y="442" font-size="17" fill="#6fc693" text-anchor="start" font-weight="bold">[1] [2]</text>
<text x="580" y="442" font-size="14" fill="#a7adb5" text-anchor="start">hai list riêng biệt</text>
</svg>
