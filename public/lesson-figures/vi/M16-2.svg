<text x="636" y="190" font-size="17" font-weight="bold" fill="#e9e7e3">Vì sao có khoảng cách</text>
<text x="636" y="226" font-size="15" fill="#e9e7e3">cận = Lⁿ/(1−L) · 0.3776,</text>
<text x="636" y="256" font-size="15" fill="#e9e7e3">dùng độ dốc xấu nhất</text>
<text x="636" y="286" font-size="15" fill="#e9e7e3">L = sin 1 = 0.8415.</text>
<text x="636" y="316" font-size="15" fill="#e9e7e3">Gần x* độ dốc chỉ là</text>
<text x="636" y="346" font-size="15" fill="#e9e7e3">sin 0.7391 = 0.6736, nên</text>
<text x="636" y="376" font-size="15" fill="#e9e7e3">sai số thật giảm nhanh hơn.</text>
