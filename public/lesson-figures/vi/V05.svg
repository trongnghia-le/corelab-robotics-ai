<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" font-family="Inter, Arial, sans-serif" font-size="14">
<rect width="760" height="340" fill="#191b1f" rx="12"/>
<text x="20" y="28" fill="#e5e7eb" font-size="16" font-weight="bold" style="font-size:13.27px">Kiểm tra góc: năng lượng khi dịch cửa sổ</text>
<text x="420" y="28" fill="#e5e7eb" font-size="16" font-weight="bold">Ratio test</text>
<rect x="20" y="50" width="100" height="100" fill="#3b414d" stroke="#e5e7eb"/>
<text x="70" y="175" text-anchor="middle" fill="#e5e7eb" style="font-size:10.92px">phẳng</text>
<text x="70" y="197" text-anchor="middle" fill="#e5e7eb">cả hai nhỏ</text>
<text x="70" y="219" text-anchor="middle" fill="#e5e7eb">R gần 0</text>
<rect x="140" y="50" width="100" height="100" fill="#3b414d" stroke="#e5e7eb"/>
<rect x="190" y="50" width="50" height="100" fill="#e5e7eb"/>
<text x="190" y="175" text-anchor="middle" fill="#53b2dd">cạnh</text>
<text x="190" y="197" text-anchor="middle" fill="#e5e7eb">một lớn</text>
<text x="190" y="219" text-anchor="middle" fill="#53b2dd">R &lt; 0</text>
<rect x="260" y="50" width="100" height="100" fill="#3b414d" stroke="#e5e7eb"/>
<rect x="310" y="50" width="50" height="50" fill="#e5e7eb"/>
<text x="310" y="175" text-anchor="middle" fill="#d97936">góc</text>
<text x="310" y="197" text-anchor="middle" fill="#e5e7eb">cả hai lớn</text>
<text x="310" y="219" text-anchor="middle" fill="#d97936">R &gt;&gt; 0</text>
<text x="20" y="262" fill="#e5e7eb">R = det M - k (tr M)^2</text>
<text x="20" y="290" fill="#9ccd4e">gain g: R nhân g^4;  offset: R không đổi</text>
<text x="20" y="318" fill="#9ccd4e">xoay: giữ trị riêng, R không đổi</text>
<line x1="420" y1="120" x2="740" y2="120" stroke="#e5e7eb"/>
<text x="420" y="145" fill="#e5e7eb">0</text>
<text x="600" y="145" fill="#e5e7eb" style="font-size:13.1px">khoảng cách tới ứng viên</text>
<circle cx="420" cy="120" r="6" fill="#e5e7eb"/>
<text x="425" y="100" fill="#e5e7eb">query</text>
<circle cx="500" cy="120" r="6" fill="#9ccd4e"/>
<circle cx="620" cy="120" r="6" fill="#53b2dd"/>
<text x="470" y="82" fill="#9ccd4e">d1 = 1</text>
<text x="590" y="82" fill="#53b2dd">d2 = 3</text>
<text x="420" y="185" fill="#9ccd4e">1 &lt; 0.8 x 3: nhận (rõ ràng)</text>
<circle cx="500" cy="230" r="6" fill="#9ccd4e"/>
<circle cx="508" cy="258" r="6" fill="#d97936"/>
<text x="525" y="236" fill="#9ccd4e">d1 = 1.0</text>
<text x="525" y="264" fill="#d97936">d2 = 1.1</text>
<text x="420" y="300" fill="#d97936">1.0 &gt; 0.8 x 1.1: loại (mơ hồ)</text>
</svg>
