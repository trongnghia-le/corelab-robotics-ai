<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" font-family="Inter, Arial, sans-serif" role="img">
<title>Lưu đồ bring-up với các lỗi kinh điển</title>
<desc>Luồng dọc từ nguồn, đến reset và clock, giao tiếp, cảm biến, cơ cấu chấp hành công suất thấp, rồi vòng kín. Mỗi bước nêu cách kiểm tra và một nhánh phụ liệt kê lỗi kinh điển ở đó: brownout, chân vào thả nổi, thiếu chung mass, sai baud hoặc mức điện áp, code chặn, và xung đột địa chỉ I2C.</desc>
<rect width="760" height="480" fill="#191b1f" rx="12"/>
<text x="380" y="28" font-size="17" fill="#e5e7eb" text-anchor="middle" font-weight="bold">Bring-up: từng bước một, nguồn trước, motor sau cùng</text>
<rect x="40" y="46" width="300" height="52" rx="8" fill="#272a2f" stroke="#d97936" stroke-width="2"/>
<text x="190.0" y="68.5" font-size="13" fill="#e5e7eb" text-anchor="middle" font-weight="bold">1 Nguồn</text>
<text x="190.0" y="84.5" font-size="13" fill="#e5e7eb" text-anchor="middle" style="font-size:10.14px">DMM: các đường rail, không chập, giới hạn dòng</text>
<line x1="190" y1="98" x2="190" y2="116" stroke="#e5e7eb" stroke-width="2"/>
<polygon points="190,116 186.5,107.0 193.5,107.0" fill="#e5e7eb"/>
<rect x="40" y="116" width="300" height="52" rx="8" fill="#272a2f" stroke="#d97936" stroke-width="2"/>
<text x="190.0" y="138.6" font-size="13" fill="#e5e7eb" text-anchor="middle" font-weight="bold">2 Reset và clock</text>
<text x="190.0" y="154.6" font-size="13" fill="#e5e7eb" text-anchor="middle" style="font-size:12.4px">banner khởi động, lý do reset, nhịp LED</text>
<line x1="190" y1="168" x2="190" y2="186" stroke="#e5e7eb" stroke-width="2"/>
<polygon points="190,186 186.5,177.0 193.5,177.0" fill="#e5e7eb"/>
<rect x="40" y="186" width="300" height="52" rx="8" fill="#272a2f" stroke="#53b2dd" stroke-width="2"/>
<text x="190.0" y="208.6" font-size="13" fill="#e5e7eb" text-anchor="middle" font-weight="bold" style="font-size:12.13px">3 Giao tiếp</text>
<text x="190.0" y="224.6" font-size="13" fill="#e5e7eb" text-anchor="middle">serial echo, baud, quét I2C</text>
<line x1="190" y1="238" x2="190" y2="256" stroke="#e5e7eb" stroke-width="2"/>
<polygon points="190,256 186.5,247.0 193.5,247.0" fill="#e5e7eb"/>
<rect x="40" y="256" width="300" height="52" rx="8" fill="#272a2f" stroke="#53b2dd" stroke-width="2"/>
<text x="190.0" y="278.6" font-size="13" fill="#e5e7eb" text-anchor="middle" font-weight="bold" style="font-size:12.35px">4 Cảm biến</text>
<text x="190.0" y="294.6" font-size="13" fill="#e5e7eb" text-anchor="middle">WHO_AM_I, encoder quay tay</text>
<line x1="190" y1="308" x2="190" y2="326" stroke="#e5e7eb" stroke-width="2"/>
<polygon points="190,326 186.5,317.0 193.5,317.0" fill="#e5e7eb"/>
<rect x="40" y="326" width="300" height="52" rx="8" fill="#272a2f" stroke="#9ccd4e" stroke-width="2"/>
<text x="190.0" y="348.6" font-size="13" fill="#e5e7eb" text-anchor="middle" font-weight="bold" style="font-size:10.14px">5 Cơ cấu chấp hành</text>
<text x="190.0" y="364.6" font-size="13" fill="#e5e7eb" text-anchor="middle" style="font-size:12.57px">bánh nhấc khỏi mặt đất, duty 10 %</text>
<line x1="190" y1="378" x2="190" y2="396" stroke="#e5e7eb" stroke-width="2"/>
<polygon points="190,396 186.5,387.0 193.5,387.0" fill="#e5e7eb"/>
<rect x="40" y="396" width="300" height="52" rx="8" fill="#272a2f" stroke="#9ccd4e" stroke-width="2"/>
<text x="190.0" y="418.6" font-size="13" fill="#e5e7eb" text-anchor="middle" font-weight="bold" style="font-size:11.4px">6 Vòng lặp và an toàn</text>
<text x="190.0" y="434.6" font-size="13" fill="#e5e7eb" text-anchor="middle">bước PI, watchdog, E-stop</text>
<line x1="340" y1="72.0" x2="400" y2="72.0" stroke="#e5e7eb" stroke-width="2" stroke-dasharray="5 4"/>
<polygon points="400,72.0 391.0,75.5 391.0,68.5" fill="#e5e7eb"/>
<rect x="400" y="46" width="320" height="52" rx="8" fill="#272a2f" stroke="#e5e7eb" stroke-width="2" stroke-dasharray="5 4"/>
<text x="560.0" y="61.2" font-size="12" fill="#e5e7eb" text-anchor="middle" font-weight="bold">Brownout</text>
<text x="560.0" y="76.2" font-size="12" fill="#e5e7eb" text-anchor="middle">rail sụt khi motor khởi động</text>
<text x="560.0" y="91.2" font-size="12" fill="#e5e7eb" text-anchor="middle">nguồn riêng, tụ bulk</text>
<line x1="340" y1="142.0" x2="400" y2="142.0" stroke="#e5e7eb" stroke-width="2" stroke-dasharray="5 4"/>
<polygon points="400,142.0 391.0,145.5 391.0,138.5" fill="#e5e7eb"/>
<rect x="400" y="116" width="320" height="52" rx="8" fill="#272a2f" stroke="#e5e7eb" stroke-width="2" stroke-dasharray="5 4"/>
<text x="560.0" y="131.2" font-size="12" fill="#e5e7eb" text-anchor="middle" font-weight="bold">Code chặn</text>
<text x="560.0" y="146.2" font-size="12" fill="#e5e7eb" text-anchor="middle" style="font-size:10.61px">watchdog reset, vòng lặp quá chậm</text>
<text x="560.0" y="161.2" font-size="12" fill="#e5e7eb" text-anchor="middle" style="font-size:10.55px">không delay(), đo thời gian vòng lặp</text>
<line x1="340" y1="212.0" x2="400" y2="212.0" stroke="#e5e7eb" stroke-width="2" stroke-dasharray="5 4"/>
<polygon points="400,212.0 391.0,215.5 391.0,208.5" fill="#e5e7eb"/>
<rect x="400" y="186" width="320" height="52" rx="8" fill="#272a2f" stroke="#e5e7eb" stroke-width="2" stroke-dasharray="5 4"/>
<text x="560.0" y="201.2" font-size="12" fill="#e5e7eb" text-anchor="middle" font-weight="bold" style="font-size:9.38px">Sai baud hoặc mức điện áp</text>
<text x="560.0" y="216.2" font-size="12" fill="#e5e7eb" text-anchor="middle">ký tự rác, 5 V vào 3.3 V</text>
<text x="560.0" y="231.2" font-size="12" fill="#e5e7eb" text-anchor="middle" style="font-size:11.87px">kiểm tra bộ chia, dịch mức</text>
<line x1="340" y1="282.0" x2="400" y2="282.0" stroke="#e5e7eb" stroke-width="2" stroke-dasharray="5 4"/>
<polygon points="400,282.0 391.0,285.5 391.0,278.5" fill="#e5e7eb"/>
<rect x="400" y="256" width="320" height="52" rx="8" fill="#272a2f" stroke="#e5e7eb" stroke-width="2" stroke-dasharray="5 4"/>
<text x="560.0" y="271.2" font-size="12" fill="#e5e7eb" text-anchor="middle" font-weight="bold">Xung đột địa chỉ I2C</text>
<text x="560.0" y="286.2" font-size="12" fill="#e5e7eb" text-anchor="middle" style="font-size:11.82px">hai thiết bị cùng 0x68</text>
<text x="560.0" y="301.2" font-size="12" fill="#e5e7eb" text-anchor="middle">chân AD0, mux, bus thứ hai</text>
<line x1="340" y1="352.0" x2="400" y2="352.0" stroke="#e5e7eb" stroke-width="2" stroke-dasharray="5 4"/>
<polygon points="400,352.0 391.0,355.5 391.0,348.5" fill="#e5e7eb"/>
<rect x="400" y="326" width="320" height="52" rx="8" fill="#272a2f" stroke="#e5e7eb" stroke-width="2" stroke-dasharray="5 4"/>
<text x="560.0" y="341.2" font-size="12" fill="#e5e7eb" text-anchor="middle" font-weight="bold">Không chung mass</text>
<text x="560.0" y="356.2" font-size="12" fill="#e5e7eb" text-anchor="middle">chân vào thả nổi, nhiễu mass</text>
<text x="560.0" y="371.2" font-size="12" fill="#e5e7eb" text-anchor="middle">một điểm sao, pull-up</text>
<line x1="340" y1="422.0" x2="400" y2="422.0" stroke="#e5e7eb" stroke-width="2" stroke-dasharray="5 4"/>
<polygon points="400,422.0 391.0,425.5 391.0,418.5" fill="#e5e7eb"/>
<rect x="400" y="396" width="320" height="52" rx="8" fill="#272a2f" stroke="#e5e7eb" stroke-width="2" stroke-dasharray="5 4"/>
<text x="560.0" y="411.2" font-size="12" fill="#e5e7eb" text-anchor="middle" font-weight="bold">Công tắc dead-man</text>
<text x="560.0" y="426.2" font-size="12" fill="#e5e7eb" text-anchor="middle">mất liên kết, motor vẫn chạy</text>
<text x="560.0" y="441.2" font-size="12" fill="#e5e7eb" text-anchor="middle" style="font-size:11.15px">timeout dừng các đầu ra</text>
<text x="380" y="466" font-size="12.5" fill="#e5e7eb" text-anchor="middle">Một bước lỗi: dừng, ghi lại bằng chứng, đổi một thứ, rồi chạy lại checklist từ bước đó.</text>
</svg>
