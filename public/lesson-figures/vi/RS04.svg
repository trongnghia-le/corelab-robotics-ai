<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" font-family="Inter, Arial, sans-serif">
<rect width="760" height="360" fill="#191b1f" rx="12"/>
<defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#e5e7eb"/></marker></defs>
<text x="20" y="30" fill="#e5e7eb" font-size="16" font-weight="bold">Từ số đo thô đến hình đã kiểm chứng</text>
<g fill="none" stroke-width="2">
<rect x="20" y="55" width="150" height="56" rx="8" stroke="#53b2dd"/><rect x="20" y="130" width="150" height="56" rx="8" stroke="#53b2dd"/>
<rect x="215" y="90" width="150" height="56" rx="8" stroke="#d97936"/><rect x="410" y="90" width="150" height="56" rx="8" stroke="#9ccd4e"/>
<rect x="600" y="90" width="140" height="56" rx="8" stroke="#9ccd4e"/>
</g>
<g fill="#e5e7eb" font-size="14" text-anchor="middle">
<text x="95" y="80" style="font-size:13.12px">dữ liệu thô (CSV)</text><text x="95" y="100" font-size="12" style="font-size:9.36px">không bao giờ sửa</text>
<text x="95" y="155" style="font-size:13.71px">env + code đã khóa</text><text x="95" y="175" font-size="12">lock file, git commit</text>
<text x="290" y="115" style="font-size:13.74px">script phân tích</text><text x="290" y="135" font-size="12">config + seed</text>
<text x="485" y="115" style="font-size:13.84px">bảng kết quả</text><text x="485" y="135" font-size="12" style="font-size:10.38px">trung bình, n mỗi điều kiện</text>
<text x="670" y="115">hình</text><text x="670" y="135" font-size="12">sinh lại bằng script</text>
</g>
<g stroke="#e5e7eb" stroke-width="2" fill="none" marker-end="url(#ar)"><path d="M170 83 L213 108"/><path d="M170 158 L213 128"/><path d="M365 118 L408 118"/><path d="M560 118 L598 118"/></g>
<rect x="20" y="215" width="720" height="60" rx="8" fill="none" stroke="#d97936" stroke-width="2" stroke-dasharray="5 4"/>
<text x="30" y="240" fill="#d97936" font-size="14">MANIFEST.sha256: một SHA-256 cho mỗi ô trên (đầu vào, code, config, đầu ra)</text>
<text x="30" y="262" fill="#e5e7eb" font-size="13">kiểm trước; lệch bất kỳ sẽ dừng lần chạy trước khi tin hình</text>
<text x="20" y="305" fill="#9ccd4e" font-size="14">Kiểm tra chạy lại: |new - reported| &lt;= 1.96 * sqrt(2) * sigma / sqrt(n)</text>
<text x="20" y="328" fill="#e5e7eb" font-size="13">sigma = 2, n = 5 seed cho dung sai 2.48; cùng seed, cùng máy phải khớp tuyệt đối</text>
</svg>
