<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" font-family="Inter, Arial, sans-serif" font-size="14">
<rect width="760" height="340" fill="#191b1f" rx="12"/>
<text x="20" y="28" fill="#e5e7eb" font-size="16" font-weight="bold">IoU = giao / hợp</text>
<text x="420" y="28" fill="#e5e7eb" font-size="16" font-weight="bold" style="font-size:15.17px">Precision-recall (detection đã xếp hạng)</text>
<rect x="40" y="60" width="150" height="120" fill="#53b2dd" fill-opacity="0.2" stroke="#53b2dd" stroke-width="2"/>
<rect x="120" y="110" width="150" height="120" fill="#d97936" fill-opacity="0.2" stroke="#d97936" stroke-width="2"/>
<rect x="120" y="110" width="70" height="70" fill="#9ccd4e" fill-opacity="0.5" stroke="#9ccd4e" stroke-width="2"/>
<text x="46" y="80" fill="#53b2dd">ground truth A</text>
<text x="150" y="250" fill="#d97936">detection B</text>
<text x="124" y="150" fill="#e5e7eb">A và B</text>
<text x="20" y="285" fill="#e5e7eb">IoU = |A and B| / (|A| + |B| - |A and B|)</text>
<text x="20" y="310" fill="#9ccd4e" style="font-size:11.97px">IoU 1 = trùng nhau, 0 = rời nhau, không đơn vị</text>
<line x1="440" y1="270" x2="740" y2="270" stroke="#e5e7eb"/>
<line x1="440" y1="270" x2="440" y2="60" stroke="#e5e7eb"/>
<text x="560" y="300" fill="#e5e7eb">recall</text>
<text x="408" y="170" fill="#e5e7eb" transform="rotate(-90 408 170)">precision</text>
<text x="436" y="288" fill="#e5e7eb" text-anchor="end">0</text>
<text x="740" y="288" fill="#e5e7eb" text-anchor="end">1</text>
<text x="430" y="272" fill="#e5e7eb" text-anchor="end">0</text>
<text x="430" y="68" fill="#e5e7eb" text-anchor="end">1</text>
<polygon fill="#9ccd4e" fill-opacity="0.25" stroke="#9ccd4e" stroke-width="2" stroke-dasharray="5 4" points="440,270 440,60 590,60 590,112 665,112 665,270"/>
<polyline fill="none" stroke="#53b2dd" stroke-width="2.5" points="515,60 590,60 590,130 665,112 665,144"/>
<circle cx="515" cy="60" r="4" fill="#53b2dd"/><circle cx="590" cy="60" r="4" fill="#53b2dd"/><circle cx="590" cy="130" r="4" fill="#53b2dd"/><circle cx="665" cy="112" r="4" fill="#53b2dd"/><circle cx="665" cy="144" r="4" fill="#53b2dd"/>
<text x="460" y="200" fill="#9ccd4e" style="font-size:12.26px">AP = 0.6875 (diện tích)</text>
<text x="680" y="130" fill="#53b2dd">thô</text>
<text x="680" y="100" fill="#9ccd4e" style="font-size:12.19px">đường bao</text>
<text x="450" y="228" fill="#e5e7eb" font-size="13">cờ 1,1,0,1,0 với N = 4</text>
</svg>
