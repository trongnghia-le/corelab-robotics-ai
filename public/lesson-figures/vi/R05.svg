<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="Inter, sans-serif">
<title>Hai nhánh khuỷu và vành khuyên với tới</title>
<desc>Cánh tay phẳng 2R, l1 = 1.0 m, l2 = 0.6 m, mục tiêu (0.7, 0.9) m: hai nghiệm khuỷu đối xứng gương, và vành khuyên 0.4 đến 1.6 m của các mục tiêu với tới được.</desc>
<defs><marker id="a1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#a7adb5"/></marker></defs>
<rect width="900" height="500" rx="14" fill="#17181b"/>
<text x="32" y="44" font-size="22" fill="#e9e7e3" font-weight="bold" text-anchor="start">Hai nhánh khuỷu và vành khuyên với tới</text>
<rect x="32" y="64" width="424" height="404" rx="10" fill="#22252a"/>
<rect x="480" y="64" width="388" height="404" rx="10" fill="#22252a"/>
<text x="48" y="92" font-size="17" fill="#e9e7e3" font-weight="bold" text-anchor="start">Một mục tiêu, hai khuỷu</text>
<text x="496" y="92" font-size="17" fill="#e9e7e3" font-weight="bold" text-anchor="start">Vành khuyên với tới</text>
<polyline points="84.0,440.0 346.4,342.3 280.0,188.0" fill="none" stroke="#86abe2" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="346.4" cy="342.3" r="6" fill="#86abe2"/>
<polyline points="84.0,440.0 114.1,161.6 280.0,188.0" fill="none" stroke="#6fc693" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="114.1" cy="161.6" r="6" fill="#6fc693"/>
<line x1="84.0" y1="440.0" x2="280.0" y2="188.0" stroke="#a7adb5" stroke-width="1.5" stroke-dasharray="6 4" stroke-linecap="round"/>
<circle cx="84.0" cy="440.0" r="7" fill="#e9e7e3"/>
<circle cx="280.0" cy="188.0" r="8" fill="#e0904f"/>
<text x="80" y="462" font-size="14" fill="#a7adb5" font-weight="normal" text-anchor="start">gốc</text>
<text x="294" y="192" font-size="15" fill="#e0904f" font-weight="normal" text-anchor="start">mục tiêu (0.7, 0.9)</text>
<text x="334" y="376" font-size="15" fill="#86abe2" font-weight="normal" text-anchor="start">A: q2 = +1.621</text>
<text x="126" y="150" font-size="15" fill="#6fc693" font-weight="normal" text-anchor="start">B: q2 = -1.621</text>
<text x="174" y="333" font-size="15" fill="#a7adb5" font-weight="normal" text-anchor="start">r = 1.140 m</text>
<circle cx="674" cy="266" r="141" fill="#2a2e35" stroke="#86abe2" stroke-width="2.5"/>
<circle cx="674" cy="266" r="35" fill="#22252a" stroke="#e0904f" stroke-width="2.5"/>
<circle cx="674.0" cy="266.0" r="5" fill="#e9e7e3"/>
<line x1="674.0" y1="266.0" x2="814.8" y2="266.0" stroke="#e9e7e3" stroke-width="1.5" stroke-linecap="round"/>
<text x="806" y="290" font-size="14" fill="#e9e7e3" font-weight="normal" text-anchor="end">l1 + l2 = 1.6 m</text>
<line x1="674.0" y1="266.0" x2="647.1" y2="288.7" stroke="#e0904f" stroke-width="2" stroke-linecap="round"/>
<text x="674" y="325" font-size="14" fill="#e0904f" font-weight="normal" text-anchor="middle">|l1 - l2| = 0.4 m</text>
<circle cx="735.6" cy="186.8" r="7" fill="#6fc693"/>
<text x="724" y="173" font-size="15" fill="#6fc693" font-weight="normal" text-anchor="end">2 nghiệm</text>
<text x="674" y="221" font-size="14" fill="#e0904f" font-weight="normal" text-anchor="middle">lỗ: 0</text>
<text x="674" y="437" font-size="15" fill="#e58a80" font-weight="normal" text-anchor="middle">ngoài vành khuyên: 0 nghiệm</text>
<text x="674" y="459" font-size="15" fill="#a7adb5" font-weight="normal" text-anchor="middle">trên mỗi mép: 1 nghiệm</text>
</svg>
