<text x="672" y="384" font-size="14" fill="#a7adb5" text-anchor="start">Nét chấm: ½ L log₁₀ c.</text>
<text x="32" y="456" font-size="14" fill="#a7adb5" text-anchor="start">Độ rộng n = 256, ReLU, không bias, đầu vào N(0, 1) với RMS 1. Mỗi lớp nhân bình phương trung bình với c = n Var(w)/2;</text>
<text x="32" y="478" font-size="14" fill="#a7adb5" text-anchor="start">chỉ c = 1 (He) giữ được thang. Cùng hệ số này chi phối gradient chạy ngược.</text>
