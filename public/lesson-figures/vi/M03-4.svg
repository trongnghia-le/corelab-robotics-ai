<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" font-family="Inter, sans-serif">
<title>Trường hợp 2: hình vuông đơn vị qua S, rồi A, rồi R</title>
<desc>Hình vuông đơn vị được kéo giãn bởi S=diag(2,1), trượt bởi A=[[1,2],[0,1]] và quay R(90°). Đỉnh (1,1) đi qua (2,1), (4,1), (-1,4); ma trận tổng là [[0,-1],[2,2]] với định thức 2.</desc>
<defs></defs>
<rect width="900" height="450" rx="14" fill="#17181b"/>
<text x="32" y="44" font-size="22" fill="#e9e7e3" text-anchor="start" font-weight="bold">Trường hợp 2: hình vuông đơn vị qua S, rồi A, rồi R</text>
<rect x="32" y="64" width="268" height="330" rx="8" fill="#22252a" stroke="#3d4148" stroke-width="1.5"/>
<text x="48" y="94" font-size="17" fill="#e9e7e3" text-anchor="start" font-weight="bold">① S = diag(2, 1)</text>
<line x1="52" y1="304" x2="272" y2="304" stroke="#a7adb5" stroke-width="1.5" stroke-linecap="round"/>
<line x1="96" y1="304" x2="96" y2="132" stroke="#a7adb5" stroke-width="1.5" stroke-linecap="round"/>
<polygon points="96,304 136,304 136,264 96,264" fill="none" stroke="#a7adb5" stroke-width="1.5" stroke-dasharray="4 4" stroke-linejoin="round"/>
<polygon points="96,304 176,304 176,264 96,264" fill="#6cc6ba" fill-opacity="0.22" stroke="#6cc6ba" stroke-width="2" stroke-linejoin="round"/>
<circle cx="176" cy="264" r="6" fill="#e0904f"/>
<circle cx="136" cy="264" r="4" fill="#a7adb5"/>
<text x="188" y="269" font-size="15" fill="#e0904f" text-anchor="start" font-weight="600">(2, 1)</text>
<text x="48" y="338" font-size="14" fill="#a7adb5" text-anchor="start">các đỉnh: (0,0) (2,0) (2,1) (0,1)</text>
<text x="48" y="362" font-size="14" fill="#a7adb5" text-anchor="start">[[2,0],[0,1]]</text>
<rect x="316" y="64" width="268" height="330" rx="8" fill="#22252a" stroke="#3d4148" stroke-width="1.5"/>
<text x="332" y="94" font-size="17" fill="#e9e7e3" text-anchor="start" font-weight="bold">② A (trượt)</text>
<line x1="336" y1="304" x2="556" y2="304" stroke="#a7adb5" stroke-width="1.5" stroke-linecap="round"/>
<line x1="380" y1="304" x2="380" y2="132" stroke="#a7adb5" stroke-width="1.5" stroke-linecap="round"/>
<polygon points="380,304 460,304 460,264 380,264" fill="none" stroke="#a7adb5" stroke-width="1.5" stroke-dasharray="4 4" stroke-linejoin="round"/>
<polygon points="380,304 460,304 540,264 460,264" fill="#ae9ce6" fill-opacity="0.22" stroke="#ae9ce6" stroke-width="2" stroke-linejoin="round"/>
<circle cx="540" cy="264" r="6" fill="#e0904f"/>
<circle cx="460" cy="264" r="4" fill="#a7adb5"/>
<text x="540" y="250" font-size="15" fill="#e0904f" text-anchor="middle" font-weight="600">(4, 1)</text>
<text x="332" y="338" font-size="14" fill="#a7adb5" text-anchor="start">các đỉnh: (0,0) (2,0) (4,1) (2,1)</text>
<text x="332" y="362" font-size="14" fill="#a7adb5" text-anchor="start">[[1,2],[0,1]]</text>
<rect x="600" y="64" width="268" height="330" rx="8" fill="#22252a" stroke="#3d4148" stroke-width="1.5"/>
<text x="616" y="94" font-size="17" fill="#e9e7e3" text-anchor="start" font-weight="bold">③ R = R(90°)</text>
<line x1="620" y1="304" x2="840" y2="304" stroke="#a7adb5" stroke-width="1.5" stroke-linecap="round"/>
<line x1="664" y1="304" x2="664" y2="132" stroke="#a7adb5" stroke-width="1.5" stroke-linecap="round"/>
<polygon points="664,304 744,304 824,264 744,264" fill="none" stroke="#a7adb5" stroke-width="1.5" stroke-dasharray="4 4" stroke-linejoin="round"/>
<polygon points="664,304 664,224 624,144 624,224" fill="#e08db5" fill-opacity="0.22" stroke="#e08db5" stroke-width="2" stroke-linejoin="round"/>
<circle cx="624" cy="144" r="6" fill="#e0904f"/>
<circle cx="824" cy="264" r="4" fill="#a7adb5"/>
<text x="634" y="130" font-size="15" fill="#e0904f" text-anchor="start" font-weight="600">(−1, 4)</text>
<text x="616" y="338" font-size="14" fill="#a7adb5" text-anchor="start">các đỉnh: (0,0) (0,2) (−1,4) (−1,2)</text>
<text x="616" y="362" font-size="14" fill="#a7adb5" text-anchor="start">[[0,−1],[1,0]]</text>
<text x="32" y="424" font-size="15" fill="#e9e7e3" text-anchor="start" font-weight="600">M = R A S = [[0, −1], [2, 2]];  det M = 2, nên diện tích 1 thành 2</text>
</svg>
