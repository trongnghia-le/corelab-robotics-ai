<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" font-family="Inter, sans-serif">
<title>Phương sai hậu nghiệm với mọi hệ số khuếch đại có thể</title>
<desc>Phương sai P(K) = (1-K)^2 P- + K^2 R vẽ cho K từ 0 đến 1 với P- = 1.5 và R = 0.5, cùng hai thành phần của nó. Cực tiểu 0.375 tại K = 0.75; K = 0 cho 1.5 và K = 1 cho 0.5.</desc>
