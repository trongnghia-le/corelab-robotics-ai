<text x="104" y="159.75" font-size="15" font-weight="600" fill="#6fc693" text-anchor="start">K = 0: 1.5 (bỏ qua phép đo)</text>
<text x="570" y="271.25" font-size="15" font-weight="600" fill="#6fc693" text-anchor="end">K = 1: 0.5</text>
<text x="570" y="291.25" font-size="15" font-weight="600" fill="#6fc693" text-anchor="end">(chỉ phép đo)</text>
<text x="435" y="278.438" font-size="15" font-weight="600" fill="#e0c169" text-anchor="end">K* = 0.75</text>
<text x="435" y="298.438" font-size="15" font-weight="600" fill="#e0c169" text-anchor="end">cực tiểu 0.375</text>
<text x="636" y="130" font-size="15" font-weight="600" fill="#e9e7e3" text-anchor="start">P(K) = P⁺ + (P⁻ + R)(K − K*)²</text>
<text x="636" y="160" font-size="15" font-weight="400" fill="#a7adb5" text-anchor="start">P⁺ = P⁻R/(P⁻ + R) = 0.375 m²</text>
<text x="636" y="190" font-size="15" font-weight="400" fill="#a7adb5" text-anchor="start">P⁻ + R = S = 2.0 m²</text>
<text x="636" y="220" font-size="15" font-weight="400" fill="#a7adb5" text-anchor="start">K* = P⁻/(P⁻ + R) = 0.75</text>
<text x="636" y="260" font-size="14" font-weight="400" fill="#a7adb5" text-anchor="start">Parabol phẳng ở cực tiểu:</text>
<text x="636" y="282" font-size="14" font-weight="400" fill="#a7adb5" text-anchor="start">K = 0.5 hoặc 1.0 chỉ tệ hơn</text>
<text x="636" y="304" font-size="14" font-weight="400" fill="#a7adb5" text-anchor="start">0.125 m².</text>
