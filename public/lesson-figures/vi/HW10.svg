<rect x="460" y="250" width="280" height="150" rx="8" fill="#191b1f" stroke="#e5e7eb" stroke-width="1"/>
<text x="474" y="272" font-size="13" fill="#e5e7eb" text-anchor="start" font-weight="bold">Đọc gì từ phép thử bước</text>
<text x="474" y="298" font-size="12" fill="#e5e7eb" text-anchor="start" style="font-size:9.96px">thời gian lên: 10 % đến 90 % của r</text>
<text x="474" y="318" font-size="12" fill="#e5e7eb" text-anchor="start">vọt lố: đỉnh vượt r, tính theo %</text>
<text x="474" y="338" font-size="12" fill="#e5e7eb" text-anchor="start">sai số xác lập: r trừ trung bình đoạn cuối</text>
<text x="474" y="358" font-size="12" fill="#e5e7eb" text-anchor="start">thời gian xác lập: ở trong dải 2 %</text>
<text x="474" y="378" font-size="12" fill="#e5e7eb" text-anchor="start">nếu windup: đầu ra kẹt ở 255 sau khi r giảm</text>
<text x="380" y="458" font-size="12.5" fill="#e5e7eb" text-anchor="middle" style="font-size:10.46px">Đơn vị trước (counts -&gt; rad/s), dt cố định sau, chỉnh thông số thứ ba, an toàn luôn luôn.</text>
</svg>