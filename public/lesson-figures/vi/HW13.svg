<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" font-family="Inter, sans-serif">
<title>Họ động cơ nào hợp với việc nào</title>
<desc>Ma trận tám họ động cơ (hàng) theo chín công việc của robot (cột). Chấm đặc là lựa chọn đầu tiên thường gặp, vòng tròn là lựa chọn khả dĩ có điều kiện. Đánh giá tóm tắt từ bảng quyết định của bài.</desc>
<defs></defs>
<rect width="900" height="540" rx="14" fill="#17181b"/>
<text x="32" y="44" font-size="22" fill="#e9e7e3" text-anchor="start" font-weight="bold">Họ động cơ nào hợp với việc nào</text>
<text x="312" y="100" font-size="15" fill="#e9e7e3" text-anchor="middle" font-weight="600">Bánh xe</text>
<text x="376" y="84" font-size="15" fill="#e9e7e3" text-anchor="middle" font-weight="600">Khớp</text>
<text x="376" y="102" font-size="15" fill="#e9e7e3" text-anchor="middle" font-weight="600">tay</text>
<text x="440" y="100" font-size="15" fill="#e9e7e3" text-anchor="middle" font-weight="600">Tay kẹp</text>
<text x="504" y="100" font-size="15" fill="#e9e7e3" text-anchor="middle" font-weight="600">Gimbal</text>
<text x="568" y="84" font-size="15" fill="#e9e7e3" text-anchor="middle" font-weight="600">Trục</text>
<text x="568" y="102" font-size="15" fill="#e9e7e3" text-anchor="middle" font-weight="600">3D/CNC</text>
<text x="632" y="84" font-size="15" fill="#e9e7e3" text-anchor="middle" font-weight="600">Cánh</text>
<text x="632" y="102" font-size="15" fill="#e9e7e3" text-anchor="middle" font-weight="600">quạt</text>
<text x="696" y="100" font-size="15" fill="#e9e7e3" text-anchor="middle" font-weight="600">Pan-tilt</text>
<text x="760" y="84" font-size="15" fill="#e9e7e3" text-anchor="middle" font-weight="600">Trục</text>
<text x="760" y="102" font-size="15" fill="#e9e7e3" text-anchor="middle" font-weight="600">nâng</text>
<text x="824" y="100" font-size="15" fill="#e9e7e3" text-anchor="middle" font-weight="600">Chân</text>
<rect x="32" y="116" width="824" height="38" rx="6" fill="#22252a"/>
