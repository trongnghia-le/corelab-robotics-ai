<circle cx="568" cy="401" r="8" fill="none" stroke="#e58a80" stroke-width="2.5"/>
<circle cx="760" cy="401" r="9" fill="#e58a80"/>
<circle cx="52" cy="449" r="8" fill="#a7adb5"/>
<text x="70" y="454" font-size="15" fill="#a7adb5" text-anchor="start">lựa chọn đầu tiên thường gặp</text>
<circle cx="340" cy="449" r="7" fill="none" stroke="#a7adb5" stroke-width="2.5"/>
<text x="358" y="454" font-size="15" fill="#a7adb5" text-anchor="start">khả dĩ, có điều kiện</text>
<text x="32" y="488" font-size="14" fill="#a7adb5" text-anchor="start">Đánh giá của tác giả, tóm từ bảng quyết định trong bài; bộ truyền được chọn riêng.</text>
