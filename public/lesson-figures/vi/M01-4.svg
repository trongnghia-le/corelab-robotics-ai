<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="Inter, sans-serif">
<title>Trường hợp 1 và 2, vẽ đúng tỉ lệ</title>
<desc>Trái: d(t)=2+3t với d(4)=14 m và hệ số góc 3 m mỗi giây. Phải: f(x)=2x^2-1 với f(-3)=17, f(3)=17 và giá trị sai do mất ngoặc là -19.</desc>
