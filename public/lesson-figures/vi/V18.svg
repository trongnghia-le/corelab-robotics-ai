<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 360" font-family="Inter, Arial, sans-serif">
<rect width="780" height="360" fill="#191b1f" rx="12"/>
<text x="30" y="34" font-size="16" fill="#e5e7eb" font-weight="bold">A. Dự đoán zero-shot</text>
<text x="440" y="34" font-size="16" fill="#e5e7eb" font-weight="bold">B. Đúng 34 trên 40, kết luận được gì?</text>
<rect x="24" y="70" width="124" height="46" rx="8" fill="none" stroke="#53b2dd" stroke-width="2"/><text x="34" y="99" font-size="14" fill="#e5e7eb">image encoder</text>
<rect x="24" y="170" width="124" height="46" rx="8" fill="none" stroke="#9ccd4e" stroke-width="2"/><text x="34" y="199" font-size="14" fill="#e5e7eb">text encoder</text>
<text x="30" y="238" font-size="13" fill="#e5e7eb">prompt: "a photo of a {class}"</text>
<line x1="148" y1="93" x2="250" y2="130" stroke="#e5e7eb" stroke-width="2"/><line x1="148" y1="193" x2="250" y2="150" stroke="#e5e7eb" stroke-width="2"/>
<rect x="250" y="112" width="140" height="56" rx="8" fill="none" stroke="#d97936" stroke-width="2"/>
<text x="262" y="136" font-size="14" fill="#e5e7eb">cosine / tau</text><text x="262" y="156" font-size="14" fill="#e5e7eb">rồi softmax</text>

<text x="30" y="290" font-size="14" fill="#e5e7eb">Riêng prompt A chọn can (0.848); riêng prompt B</text>
<text x="30" y="310" font-size="14" fill="#e5e7eb">chọn mug (0.997); ensemble chọn mug (0.899).</text>
<line x1="470" y1="270" x2="750" y2="270" stroke="#e5e7eb" stroke-width="1.5"/>
<text x="470" y="296" font-size="13" fill="#e5e7eb">0.5</text><text x="602" y="296" font-size="13" fill="#e5e7eb">0.75</text><text x="740" y="296" font-size="13" fill="#e5e7eb">1</text>
<text x="500" y="320" font-size="14" fill="#e5e7eb">accuracy (ngẫu nhiên 0.5 cho hai lớp)</text>
<line x1="587" y1="200" x2="710" y2="200" stroke="#d97936" stroke-width="5"/>
<circle cx="665" cy="200" r="7" fill="#d97936"/>
<text x="590" y="184" font-size="14" fill="#d97936" style="font-size:13.29px">ước lượng điểm 0.85</text>
<text x="470" y="236" font-size="14" fill="#d97936" style="font-size:12.93px">khoảng Wilson 95% từ 0.71 đến 0.93</text>
<text x="470" y="115" font-size="14" fill="#e5e7eb">Với 40 ảnh khoảng này rộng:</text>
<text x="470" y="135" font-size="14" fill="#e5e7eb" style="font-size:13.23px">+-0.11, quá rộng để xếp hạng hai model.</text>
</svg>
