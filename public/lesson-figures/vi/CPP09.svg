<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="Inter, sans-serif">
<title>Cache line quyết định chi phí của một phần tử</title>
<desc>Trên: vector dùng hết 8 double của một cache line 64 byte còn danh sách xáo trộn dùng 2 trên 8 ô mỗi node. Dưới: đồ thị log-log ns mỗi phần tử đo được cho n = 1,000, 100,000 và 4,000,000: vector giữ quanh 0.8 ns, danh sách xáo trộn tăng từ 1.88 lên 14.4 rồi 140 ns.</desc>
<defs><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a7adb5"/></marker></defs>
<rect width="900" height="600" rx="14" fill="#17181b"/>
