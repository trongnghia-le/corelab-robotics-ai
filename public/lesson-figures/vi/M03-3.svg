<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="Inter, sans-serif">
<title>Cùng một tích, năm cách đặt ngoặc, chi phí rất khác</title>
<desc>Số flop của năm cách đặt ngoặc ABCD: 9.68 M, 11.2 M, 24 M, 328 M và 968 M; cách tệ nhất đắt gấp 100 lần cách tốt nhất.</desc>
<defs></defs>
<rect width="900" height="470" rx="14" fill="#17181b"/>
<text x="32" y="44" font-size="22" fill="#e9e7e3" text-anchor="start" font-weight="bold">Cùng một tích, năm cách đặt ngoặc, chi phí rất khác</text>
<text x="32" y="76" font-size="15" fill="#a7adb5" text-anchor="start">A 20×2000, B 2000×20, C 20×2000, D 2000×100; mỗi tích (m×n)(n×p) tốn 2mnp flop</text>
<rect x="32" y="96" width="836" height="340" rx="8" fill="#22252a" stroke="#3d4148" stroke-width="1.5"/>
<line x1="330" y1="120" x2="330" y2="370" stroke="#3d4148" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 4"/>
<text x="330" y="394" font-size="14" fill="#a7adb5" text-anchor="middle">1 M</text>
<line x1="470" y1="120" x2="470" y2="370" stroke="#3d4148" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 4"/>
<text x="470" y="394" font-size="14" fill="#a7adb5" text-anchor="middle">10 M</text>
<line x1="610" y1="120" x2="610" y2="370" stroke="#3d4148" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 4"/>
<text x="610" y="394" font-size="14" fill="#a7adb5" text-anchor="middle">100 M</text>
<line x1="750" y1="120" x2="750" y2="370" stroke="#3d4148" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 4"/>
<text x="750" y="394" font-size="14" fill="#a7adb5" text-anchor="middle">1000 M</text>
<text x="540" y="420" font-size="15" fill="#a7adb5" text-anchor="middle">flop (trục logarit)</text>
<text x="56" y="145" font-size="15" fill="#e9e7e3" text-anchor="start" font-weight="600">(AB)(CD)</text>
<line x1="330" y1="140" x2="468.023" y2="140" stroke="#6fc693" stroke-width="2.5" stroke-linecap="round"/>
<circle cx="468.023" cy="140" r="7" fill="#6fc693"/>
<text x="482.023" y="145" font-size="15" fill="#6fc693" text-anchor="start" font-weight="600">9.68 M · rẻ nhất</text>
<text x="56" y="197" font-size="15" fill="#e9e7e3" text-anchor="start" font-weight="600">((AB)C)D</text>
<line x1="330" y1="192" x2="476.891" y2="192" stroke="#86abe2" stroke-width="2.5" stroke-linecap="round"/>
<circle cx="476.891" cy="192" r="7" fill="#86abe2"/>
<text x="490.891" y="197" font-size="15" fill="#86abe2" text-anchor="start" font-weight="600">11.2 M</text>
<text x="56" y="249" font-size="15" fill="#e9e7e3" text-anchor="start" font-weight="600">A(B(CD))</text>
<line x1="330" y1="244" x2="523.23" y2="244" stroke="#86abe2" stroke-width="2.5" stroke-linecap="round"/>
<circle cx="523.23" cy="244" r="7" fill="#86abe2"/>
<text x="537.23" y="249" font-size="15" fill="#86abe2" text-anchor="start" font-weight="600">24 M</text>
<text x="56" y="301" font-size="15" fill="#e9e7e3" text-anchor="start" font-weight="600">(A(BC))D</text>
<line x1="330" y1="296" x2="682.222" y2="296" stroke="#86abe2" stroke-width="2.5" stroke-linecap="round"/>
<circle cx="682.222" cy="296" r="7" fill="#86abe2"/>
<text x="696.222" y="301" font-size="15" fill="#86abe2" text-anchor="start" font-weight="600">328 M</text>
<text x="56" y="353" font-size="15" fill="#e9e7e3" text-anchor="start" font-weight="600">A((BC)D)</text>
<line x1="330" y1="348" x2="748.023" y2="348" stroke="#e58a80" stroke-width="2.5" stroke-linecap="round"/>
<circle cx="748.023" cy="348" r="7" fill="#e58a80"/>
<text x="762.023" y="353" font-size="15" fill="#e58a80" text-anchor="start" font-weight="600">968 M</text>
<text x="852" y="420" font-size="14" fill="#a7adb5" text-anchor="end">1 M = 10⁶ flop</text>
<text x="48" y="418" font-size="15" fill="#e9e7e3" text-anchor="start" font-weight="600">tệ nhất ÷ tốt nhất = 968 M ÷ 9.68 M = 100</text>
</svg>
