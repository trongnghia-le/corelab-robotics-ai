<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="Inter, sans-serif">
<title>Ca 2: ứng viên nào giữ 1.5 N m ở 30 rpm?</title>
<desc>Các đường tốc độ-mô-men hai điểm của bốn ứng viên so với điểm làm việc 1.5 N m ở 30 rpm: chỉ XM430-W350 ở 14.8 V giữ tải dưới một phần ba mô-men kẹt và trên 30 rpm.</desc>
<defs></defs>
<rect width="900" height="520" rx="14" fill="#17181b"/>
<text x="32" y="44" font-size="22" fill="#e9e7e3" text-anchor="start" font-weight="bold">Ca 2: ứng viên nào giữ 1.5 N m ở 30 rpm?</text>
<text x="32" y="70" font-size="15" fill="#a7adb5" text-anchor="start">Đường từ tốc độ không tải đến mô-men kẹt; khớp vai 1.5 N m ở 30 rpm</text>
<rect x="80" y="124" width="390" height="308" rx="4" fill="#22252a"/>
<line x1="75" y1="432" x2="80" y2="432" stroke="#a7adb5" stroke-width="1.5" stroke-linecap="round"/>
<text x="70" y="437" font-size="14" fill="#a7adb5" text-anchor="end">0</text>
<line x1="75" y1="285.333" x2="80" y2="285.333" stroke="#a7adb5" stroke-width="1.5" stroke-linecap="round"/>
<text x="70" y="290.333" font-size="14" fill="#a7adb5" text-anchor="end">100</text>
<line x1="75" y1="138.667" x2="80" y2="138.667" stroke="#a7adb5" stroke-width="1.5" stroke-linecap="round"/>
<text x="70" y="143.667" font-size="14" fill="#a7adb5" text-anchor="end">200</text>
<line x1="80" y1="432" x2="80" y2="437" stroke="#a7adb5" stroke-width="1.5" stroke-linecap="round"/>
<text x="80" y="454" font-size="14" fill="#a7adb5" text-anchor="middle">0</text>
<line x1="158" y1="432" x2="158" y2="437" stroke="#a7adb5" stroke-width="1.5" stroke-linecap="round"/>
<text x="158" y="454" font-size="14" fill="#a7adb5" text-anchor="middle">1</text>
<line x1="236" y1="432" x2="236" y2="437" stroke="#a7adb5" stroke-width="1.5" stroke-linecap="round"/>
<text x="236" y="454" font-size="14" fill="#a7adb5" text-anchor="middle">2</text>
<line x1="314" y1="432" x2="314" y2="437" stroke="#a7adb5" stroke-width="1.5" stroke-linecap="round"/>
<text x="314" y="454" font-size="14" fill="#a7adb5" text-anchor="middle">3</text>
<line x1="392" y1="432" x2="392" y2="437" stroke="#a7adb5" stroke-width="1.5" stroke-linecap="round"/>
<text x="392" y="454" font-size="14" fill="#a7adb5" text-anchor="middle">4</text>
<line x1="470" y1="432" x2="470" y2="437" stroke="#a7adb5" stroke-width="1.5" stroke-linecap="round"/>
<text x="470" y="454" font-size="14" fill="#a7adb5" text-anchor="middle">5</text>
<line x1="80" y1="432" x2="470" y2="432" stroke="#a7adb5" stroke-width="1.5" stroke-linecap="round"/>
<line x1="80" y1="124" x2="80" y2="432" stroke="#a7adb5" stroke-width="1.5" stroke-linecap="round"/>
<text x="275" y="480" font-size="15" fill="#e9e7e3" text-anchor="middle">mô-men ở đầu ra (N m)</text>
<text x="80" y="112" font-size="15" fill="#e9e7e3" text-anchor="start">tốc độ (rpm)</text>
<line x1="197" y1="124" x2="197" y2="432" stroke="#a7adb5" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="6 5"/>
<line x1="80" y1="388" x2="470" y2="388" stroke="#a7adb5" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="6 5"/>
<text x="205" y="168" font-size="14" fill="#e9e7e3" text-anchor="start" font-weight="600">1.5 N m</text>
<text x="462" y="380" font-size="14" fill="#e9e7e3" text-anchor="end" font-weight="600">30 rpm</text>
<line x1="80" y1="364.533" x2="399.8" y2="432" stroke="#86abe2" stroke-width="3" stroke-linecap="round"/>
<circle cx="197" cy="389.216" r="5" fill="#86abe2"/>
<line x1="80" y1="348.4" x2="454.4" y2="432" stroke="#6cc6ba" stroke-width="3" stroke-linecap="round" stroke-dasharray="10 4"/>
<circle cx="197" cy="374.525" r="5" fill="#6cc6ba"/>
<line x1="80" y1="355.733" x2="229.159" y2="432" stroke="#e0c169" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 5"/>
<circle cx="197" cy="415.557" r="5" fill="#e0c169"/>
<line x1="80" y1="138.667" x2="240.633" y2="432" stroke="#e08db5" stroke-width="3" stroke-linecap="round" stroke-dasharray="3 4"/>
<circle cx="197" cy="352.321" r="5" fill="#e08db5"/>
<circle cx="197" cy="388" r="11" fill="none" stroke="#e0904f" stroke-width="2.5"/>
<rect x="506" y="94" width="362" height="338" rx="8" fill="#22252a"/>
<text x="522" y="124" font-size="17" fill="#e9e7e3" text-anchor="start" font-weight="bold">Ở 1.5 N m</text>
<text x="742" y="124" font-size="15" fill="#a7adb5" text-anchor="end" font-weight="600">rpm</text>
<text x="808" y="124" font-size="15" fill="#a7adb5" text-anchor="end" font-weight="600">% kẹt</text>
<text x="852" y="124" font-size="15" fill="#a7adb5" text-anchor="end" font-weight="600">đạt?</text>
<line x1="522" y1="138" x2="852" y2="138" stroke="#3d4148" stroke-width="1.5" stroke-linecap="round"/>
<line x1="522" y1="169" x2="558" y2="169" stroke="#86abe2" stroke-width="3" stroke-linecap="round"/>
<text x="568" y="174" font-size="15" fill="#e9e7e3" text-anchor="start" font-weight="600">XM430 12 V</text>
<text x="742" y="174" font-size="15" fill="#e9e7e3" text-anchor="end">29.2</text>
<text x="808" y="174" font-size="15" fill="#e9e7e3" text-anchor="end">36.6</text>
<text x="852" y="174" font-size="15" fill="#e58a80" text-anchor="end" font-weight="bold">không</text>
<line x1="522" y1="215" x2="558" y2="215" stroke="#6cc6ba" stroke-width="3" stroke-linecap="round" stroke-dasharray="10 4"/>
<text x="568" y="220" font-size="15" fill="#e9e7e3" text-anchor="start" font-weight="600">XM430 14.8 V</text>
<text x="742" y="220" font-size="15" fill="#e9e7e3" text-anchor="end">39.2</text>
<text x="808" y="220" font-size="15" fill="#e9e7e3" text-anchor="end">31.2</text>
<text x="852" y="220" font-size="15" fill="#6fc693" text-anchor="end" font-weight="bold">đạt</text>
<line x1="522" y1="261" x2="558" y2="261" stroke="#e0c169" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 5"/>
<text x="568" y="266" font-size="15" fill="#e9e7e3" text-anchor="start" font-weight="600">STS3215 7.4 V</text>
<text x="742" y="266" font-size="15" fill="#e9e7e3" text-anchor="end">11.2</text>
<text x="808" y="266" font-size="15" fill="#e9e7e3" text-anchor="end">78.4</text>
<text x="852" y="266" font-size="15" fill="#e58a80" text-anchor="end" font-weight="bold">không</text>
<line x1="522" y1="307" x2="558" y2="307" stroke="#e08db5" stroke-width="3" stroke-linecap="round" stroke-dasharray="3 4"/>
<text x="568" y="312" font-size="15" fill="#e9e7e3" text-anchor="start" font-weight="600">Pololu 37D 12 V</text>
<text x="742" y="312" font-size="15" fill="#e9e7e3" text-anchor="end">54.3</text>
<text x="808" y="312" font-size="15" fill="#e9e7e3" text-anchor="end">72.8</text>
<text x="852" y="312" font-size="15" fill="#e58a80" text-anchor="end" font-weight="bold">không</text>
<text x="522" y="386" font-size="14" fill="#a7adb5" text-anchor="start">đạt = tối đa 33.3 % mô-men kẹt</text>
<text x="522" y="408" font-size="14" fill="#a7adb5" text-anchor="start">và tối thiểu 30 rpm (ước lượng hai điểm)</text>
</svg>
