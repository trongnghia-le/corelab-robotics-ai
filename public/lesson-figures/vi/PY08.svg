<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="Inter, sans-serif">
<title>Một thí nghiệm là hàm của mọi thứ nó đọc vào</title>
<desc>Năm đầu vào được ghim (code, config, seed, dữ liệu, môi trường) đi vào một bước chạy, bước này ghi result.json, run.log và env.json. Bài kiểm tra clean-checkout chạy lại từ một bản clone mới và so sánh hash của result.json.</desc>
<defs><marker id="m8a6cc6ba" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 z" fill="#6cc6ba"/></marker><marker id="m8a6fc693" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 z" fill="#6fc693"/></marker><marker id="m8a86abe2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 z" fill="#86abe2"/></marker><marker id="m8aae9ce6" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 z" fill="#ae9ce6"/></marker><marker id="m8ae08db5" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 z" fill="#e08db5"/></marker><marker id="m8ae0c169" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 z" fill="#e0c169"/></marker></defs>
<rect width="900" height="470" rx="14" fill="#17181b"/>
<text x="32" y="44" font-size="22" fill="#e9e7e3" text-anchor="start" font-weight="bold">Một thí nghiệm là hàm của mọi thứ nó đọc vào</text>
<text x="32" y="84" font-size="17" fill="#e9e7e3" text-anchor="start" font-weight="bold">Đầu vào được ghim</text>
<text x="618" y="84" font-size="17" fill="#e9e7e3" text-anchor="start" font-weight="bold">Lưu cho mỗi lần chạy</text>
<rect x="32" y="104" width="264" height="46" rx="6" fill="#22252a" stroke="#86abe2" stroke-width="2"/>
<text x="48" y="124" font-size="15" fill="#e9e7e3" text-anchor="start" font-weight="600">code</text>
<text x="48" y="142" font-size="14" fill="#a7adb5" text-anchor="start">git commit, cây sạch</text>
<line x1="296" y1="127" x2="352" y2="206" stroke="#86abe2" stroke-width="2" marker-end="url(#m8a86abe2)" stroke-linecap="round"/>
<rect x="32" y="158" width="264" height="46" rx="6" fill="#22252a" stroke="#ae9ce6" stroke-width="2"/>
<text x="48" y="178" font-size="15" fill="#e9e7e3" text-anchor="start" font-weight="600">config</text>
<text x="48" y="196" font-size="14" fill="#a7adb5" text-anchor="start">JSON đã giải quyết + hash</text>
<line x1="296" y1="181" x2="352" y2="218" stroke="#ae9ce6" stroke-width="2" marker-end="url(#m8aae9ce6)" stroke-linecap="round"/>
<rect x="32" y="212" width="264" height="46" rx="6" fill="#22252a" stroke="#e0c169" stroke-width="2"/>
<text x="48" y="232" font-size="15" fill="#e9e7e3" text-anchor="start" font-weight="600">seed</text>
<text x="48" y="250" font-size="14" fill="#a7adb5" text-anchor="start">một số nguyên, generator cục bộ</text>
<line x1="296" y1="235" x2="352" y2="230" stroke="#e0c169" stroke-width="2" marker-end="url(#m8ae0c169)" stroke-linecap="round"/>
<rect x="32" y="266" width="264" height="46" rx="6" fill="#22252a" stroke="#6cc6ba" stroke-width="2"/>
<text x="48" y="286" font-size="15" fill="#e9e7e3" text-anchor="start" font-weight="600">dữ liệu</text>
<text x="48" y="304" font-size="14" fill="#a7adb5" text-anchor="start">tên file + sha256</text>
<line x1="296" y1="289" x2="352" y2="242" stroke="#6cc6ba" stroke-width="2" marker-end="url(#m8a6cc6ba)" stroke-linecap="round"/>
<rect x="32" y="320" width="264" height="46" rx="6" fill="#22252a" stroke="#e08db5" stroke-width="2"/>
<text x="48" y="340" font-size="15" fill="#e9e7e3" text-anchor="start" font-weight="600">môi trường</text>
<text x="48" y="358" font-size="14" fill="#a7adb5" text-anchor="start">lock file, phiên bản Python</text>
<line x1="296" y1="343" x2="352" y2="254" stroke="#e08db5" stroke-width="2" marker-end="url(#m8ae08db5)" stroke-linecap="round"/>
<rect x="354" y="170" width="172" height="120" rx="6" fill="#2b2f35" stroke="#e0904f" stroke-width="2.5"/>
<text x="440" y="226" font-size="17" fill="#e9e7e3" text-anchor="middle" font-weight="bold">chạy</text>
<text x="440" y="252" font-size="14" fill="#a7adb5" text-anchor="middle">không có đầu vào ẩn</text>
<rect x="618" y="120" width="250" height="64" rx="6" fill="#22252a" stroke="#6fc693" stroke-width="2"/>
<text x="634" y="146" font-size="15" fill="#e9e7e3" text-anchor="start" font-weight="600">result.json</text>
<text x="634" y="168" font-size="14" fill="#a7adb5" text-anchor="start">chỉ phần phải khớp: được hash</text>
<line x1="526" y1="230" x2="616" y2="152" stroke="#6fc693" stroke-width="2" marker-end="url(#m8a6fc693)" stroke-linecap="round"/>
<rect x="618" y="204" width="250" height="64" rx="6" fill="#22252a" stroke="#6fc693" stroke-width="2"/>
<text x="634" y="230" font-size="15" fill="#e9e7e3" text-anchor="start" font-weight="600">run.log</text>
<text x="634" y="252" font-size="14" fill="#a7adb5" text-anchor="start">mức log, hash config, số đo</text>
<line x1="526" y1="230" x2="616" y2="236" stroke="#6fc693" stroke-width="2" marker-end="url(#m8a6fc693)" stroke-linecap="round"/>
<rect x="618" y="288" width="250" height="64" rx="6" fill="#22252a" stroke="#6fc693" stroke-width="2"/>
<text x="634" y="314" font-size="15" fill="#e9e7e3" text-anchor="start" font-weight="600">env.json</text>
<text x="634" y="336" font-size="14" fill="#a7adb5" text-anchor="start">máy, giờ, phiên bản: không hash</text>
<line x1="526" y1="230" x2="616" y2="320" stroke="#6fc693" stroke-width="2" marker-end="url(#m8a6fc693)" stroke-linecap="round"/>
<rect x="32" y="392" width="836" height="48" rx="6" fill="#22252a" stroke="#e0904f" stroke-width="2"/>
<text x="450" y="422" font-size="15" fill="#e9e7e3" text-anchor="middle" font-weight="600">Kiểm tra clean-checkout: git clone mới, chạy, rồi sha256sum result.json bằng hash ban đầu.</text>
</svg>
