<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" font-family="Inter, sans-serif">
<title>Ba mẫu phụ thuộc</title>
<desc>Ba đồ thị nhỏ: nguyên nhân chung, chuỗi và collider, mỗi cái kèm điều gì độc lập và điều gì phụ thuộc khi biết nút tô đặc, với số liệu từ ví dụ cảm biến.</desc>
<rect width="900" height="480" rx="14" fill="#17181b"/>

<text x="32" y="44" font-size="22" font-weight="bold" fill="#e9e7e3">Ba mẫu phụ thuộc</text>
<rect x="32" y="72" width="262" height="384" rx="10" fill="#22252a"/>
<rect x="318" y="72" width="262" height="384" rx="10" fill="#22252a"/>
<rect x="604" y="72" width="262" height="384" rx="10" fill="#22252a"/>
<text x="52" y="102" font-size="17" font-weight="bold" fill="#e9e7e3">Nguyên nhân chung</text>
<text x="338" y="102" font-size="17" font-weight="bold" fill="#e9e7e3">Chuỗi</text>
<text x="624" y="102" font-size="17" font-weight="bold" fill="#e9e7e3">Collider</text>
<circle cx="163" cy="150" r="24" fill="#e0904f" fill-opacity="0.35" stroke="#e0904f" stroke-width="2.5"/>
<text x="163" y="155" font-size="15" font-weight="600" text-anchor="middle" fill="#e9e7e3">Z</text>
<circle cx="99" cy="250" r="24" fill="none" stroke="#86abe2" stroke-width="2.5"/>
<text x="99" y="255" font-size="15" font-weight="600" text-anchor="middle" fill="#e9e7e3">S₁</text>
<circle cx="227" cy="250" r="24" fill="none" stroke="#86abe2" stroke-width="2.5"/>
<text x="227" y="255" font-size="15" font-weight="600" text-anchor="middle" fill="#e9e7e3">S₂</text>
<line x1="149" y1="171.9" x2="118.9" y2="218.8" stroke="#a7adb5" stroke-width="2.5"/>
<polygon points="113.0,228.1 114.3,215.9 123.6,221.8" fill="#a7adb5"/>
<line x1="177" y1="171.9" x2="207.1" y2="218.8" stroke="#a7adb5" stroke-width="2.5"/>
<polygon points="213.0,228.1 202.4,221.8 211.7,215.9" fill="#a7adb5"/>
<text x="52" y="326" font-size="15" font-weight="600" fill="#e9e7e3">Biết Z (tô đặc): độc lập</text>
<text x="52" y="352" font-size="14" fill="#a7adb5">P(1,1 | Z) = 0.9·0.9 = 0.81</text>
<text x="52" y="378" font-size="15" font-weight="600" fill="#e9e7e3">Không biết Z: phụ thuộc</text>
<text x="52" y="404" font-size="14" fill="#a7adb5">0.41 ≠ 0.5·0.5 = 0.25</text>
<circle cx="369" cy="200" r="24" fill="none" stroke="#86abe2" stroke-width="2.5"/>
<text x="369" y="205" font-size="15" font-weight="600" text-anchor="middle" fill="#e9e7e3">A</text>
<circle cx="449" cy="200" r="24" fill="#e0904f" fill-opacity="0.35" stroke="#e0904f" stroke-width="2.5"/>
<text x="449" y="205" font-size="15" font-weight="600" text-anchor="middle" fill="#e9e7e3">B</text>
<circle cx="529" cy="200" r="24" fill="none" stroke="#86abe2" stroke-width="2.5"/>
<text x="529" y="205" font-size="15" font-weight="600" text-anchor="middle" fill="#e9e7e3">C</text>
<line x1="395" y1="200" x2="412.0" y2="200.0" stroke="#a7adb5" stroke-width="2.5"/>
<polygon points="423.0,200.0 412.0,205.5 412.0,194.5" fill="#a7adb5"/>
<line x1="475" y1="200" x2="492.0" y2="200.0" stroke="#a7adb5" stroke-width="2.5"/>
<polygon points="503.0,200.0 492.0,205.5 492.0,194.5" fill="#a7adb5"/>
<text x="369" y="252" font-size="14" text-anchor="middle" fill="#a7adb5">quá khứ</text>
<text x="449" y="252" font-size="14" text-anchor="middle" fill="#a7adb5">hiện tại</text>
<text x="529" y="252" font-size="14" text-anchor="middle" fill="#a7adb5">tương lai</text>
<text x="338" y="326" font-size="15" font-weight="600" fill="#e9e7e3">Tính chất Markov: A ⟂ C | B</text>
<text x="338" y="352" font-size="14" fill="#a7adb5">Biết B: quá khứ không cho</text>
<text x="338" y="378" font-size="14" fill="#a7adb5">thêm gì về tương lai</text>
<circle cx="671" cy="150" r="24" fill="none" stroke="#86abe2" stroke-width="2.5"/>
<text x="671" y="155" font-size="15" font-weight="600" text-anchor="middle" fill="#e9e7e3">Z₁</text>
<circle cx="799" cy="150" r="24" fill="none" stroke="#86abe2" stroke-width="2.5"/>
<text x="799" y="155" font-size="15" font-weight="600" text-anchor="middle" fill="#e9e7e3">Z₂</text>
<circle cx="735" cy="250" r="24" fill="#e0904f" fill-opacity="0.35" stroke="#e0904f" stroke-width="2.5"/>
<text x="735" y="255" font-size="15" font-weight="600" text-anchor="middle" fill="#e9e7e3">S</text>
<line x1="685" y1="171.9" x2="715.1" y2="218.8" stroke="#a7adb5" stroke-width="2.5"/>
<polygon points="721.0,228.1 710.4,221.8 719.7,215.9" fill="#a7adb5"/>
<line x1="785" y1="171.9" x2="754.9" y2="218.8" stroke="#a7adb5" stroke-width="2.5"/>
<polygon points="749.0,228.1 750.3,215.9 759.6,221.8" fill="#a7adb5"/>
<text x="624" y="326" font-size="15" font-weight="600" fill="#e9e7e3">Z₁ ⟂ Z₂: độc lập</text>
<text x="624" y="352" font-size="15" font-weight="600" fill="#e9e7e3">Biết S = 1: phụ thuộc</text>
<text x="624" y="378" font-size="14" fill="#a7adb5">P(Z₁=1 | S=1) = 0.667</text>
<text x="624" y="404" font-size="14" fill="#a7adb5">P(Z₁=1 | S=1, Z₂=1) = 0.5</text>
<text x="624" y="436" font-size="14" fill="#e0904f">giải thích lẫn nhau</text>
<text x="32" y="474" font-size="14" fill="#a7adb5"></text>
<text x="52" y="436" font-size="14" fill="#a7adb5">nút tô đặc = đã biết (điều kiện hóa)</text>
</svg>
