<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="Inter, sans-serif">
<title>Các cột của tám giá trị với cực đại cửa sổ 4, 4, 6, 6, 6, 7 được đánh dấu, và deque các chỉ số sau mỗi bước</title>
<desc>Tám cột; chấm cam ở độ cao 4, 4, 6, 6, 6, 7 cho i = 2 đến 7; bên dưới là nội dung deque sau mỗi bước và hàng kết quả.</desc>
<rect width="900" height="520" rx="14" fill="#17181b"/>

<text x="32" y="44" font-size="22" font-weight="bold" fill="#e9e7e3">Trường hợp 4: cực đại cửa sổ trượt, x = [2, 1, 4, 3, 6, 5, 2, 7], k = 3</text>
<circle cx="40.0" cy="86.0" r="6" fill="#e0904f"/>
<text x="54" y="91" font-size="15" fill="#e9e7e3">cực đại cửa sổ (phần tử đầu deque)</text>
<line x1="32" y1="270" x2="868.0" y2="270.0" stroke="#a7adb5" stroke-width="1.5"/>
<rect x="56" y="230" width="56" height="40" rx="4" fill="#86abe2" fill-opacity="0.3" stroke="#86abe2" stroke-width="2"/>
<text x="84" y="292" font-size="15" font-weight="600" text-anchor="middle" fill="#e9e7e3">2</text>
<text x="84" y="312" font-size="14" text-anchor="middle" fill="#a7adb5">i = 0</text>
<rect x="160" y="250" width="56" height="20" rx="4" fill="#86abe2" fill-opacity="0.3" stroke="#86abe2" stroke-width="2"/>
<text x="188" y="292" font-size="15" font-weight="600" text-anchor="middle" fill="#e9e7e3">1</text>
<text x="188" y="312" font-size="14" text-anchor="middle" fill="#a7adb5">i = 1</text>
<rect x="264" y="190" width="56" height="80" rx="4" fill="#86abe2" fill-opacity="0.3" stroke="#86abe2" stroke-width="2"/>
<text x="292" y="292" font-size="15" font-weight="600" text-anchor="middle" fill="#e9e7e3">4</text>
<text x="292" y="312" font-size="14" text-anchor="middle" fill="#a7adb5">i = 2</text>
<rect x="368" y="210" width="56" height="60" rx="4" fill="#86abe2" fill-opacity="0.3" stroke="#86abe2" stroke-width="2"/>
<text x="396" y="292" font-size="15" font-weight="600" text-anchor="middle" fill="#e9e7e3">3</text>
<text x="396" y="312" font-size="14" text-anchor="middle" fill="#a7adb5">i = 3</text>
<rect x="472" y="150" width="56" height="120" rx="4" fill="#86abe2" fill-opacity="0.3" stroke="#86abe2" stroke-width="2"/>
<text x="500" y="292" font-size="15" font-weight="600" text-anchor="middle" fill="#e9e7e3">6</text>
<text x="500" y="312" font-size="14" text-anchor="middle" fill="#a7adb5">i = 4</text>
<rect x="576" y="170" width="56" height="100" rx="4" fill="#86abe2" fill-opacity="0.3" stroke="#86abe2" stroke-width="2"/>
<text x="604" y="292" font-size="15" font-weight="600" text-anchor="middle" fill="#e9e7e3">5</text>
<text x="604" y="312" font-size="14" text-anchor="middle" fill="#a7adb5">i = 5</text>
<rect x="680" y="230" width="56" height="40" rx="4" fill="#86abe2" fill-opacity="0.3" stroke="#86abe2" stroke-width="2"/>
<text x="708" y="292" font-size="15" font-weight="600" text-anchor="middle" fill="#e9e7e3">2</text>
<text x="708" y="312" font-size="14" text-anchor="middle" fill="#a7adb5">i = 6</text>
<rect x="784" y="130" width="56" height="140" rx="4" fill="#86abe2" fill-opacity="0.3" stroke="#86abe2" stroke-width="2"/>
<text x="812" y="292" font-size="15" font-weight="600" text-anchor="middle" fill="#e9e7e3">7</text>
<text x="812" y="312" font-size="14" text-anchor="middle" fill="#a7adb5">i = 7</text>
<polyline points="292.0,190.0 396.0,190.0 500.0,150.0 604.0,150.0 708.0,150.0 812.0,130.0" fill="none" stroke="#e0904f" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 5"/>
<circle cx="292.0" cy="190.0" r="6" fill="#e0904f"/>
<circle cx="396.0" cy="190.0" r="6" fill="#e0904f"/>
<circle cx="500.0" cy="150.0" r="6" fill="#e0904f"/>
<circle cx="604.0" cy="150.0" r="6" fill="#e0904f"/>
<circle cx="708.0" cy="150.0" r="6" fill="#e0904f"/>
<circle cx="812.0" cy="130.0" r="6" fill="#e0904f"/>
<text x="32" y="340" font-size="17" font-weight="bold" fill="#e9e7e3">deque các chỉ số sau bước i (phần tử đầu trước)</text>
<rect x="32" y="354" width="836" height="40" rx="8" fill="#22252a"/>
<text x="84" y="381" font-size="15" text-anchor="middle" fill="#e9e7e3">0</text>
<text x="188" y="381" font-size="15" text-anchor="middle" fill="#e9e7e3">0, 1</text>
<text x="292" y="381" font-size="15" text-anchor="middle" fill="#e9e7e3">2</text>
<text x="396" y="381" font-size="15" text-anchor="middle" fill="#e9e7e3">2, 3</text>
<text x="500" y="381" font-size="15" text-anchor="middle" fill="#e9e7e3">4</text>
<text x="604" y="381" font-size="15" text-anchor="middle" fill="#e9e7e3">4, 5</text>
<text x="708" y="381" font-size="15" text-anchor="middle" fill="#e9e7e3">4, 5, 6</text>
<text x="812" y="381" font-size="15" text-anchor="middle" fill="#e9e7e3">7</text>
<text x="32" y="420" font-size="17" font-weight="bold" fill="#e9e7e3">kết quả: cực đại của cửa sổ kết thúc tại i</text>
<rect x="32" y="434" width="836" height="40" rx="8" fill="#22252a"/>
<text x="84" y="461" font-size="15" text-anchor="middle" fill="#a7adb5">–</text>
<text x="188" y="461" font-size="15" text-anchor="middle" fill="#a7adb5">–</text>
<text x="292" y="461" font-size="17" font-weight="bold" text-anchor="middle" fill="#e0904f">4</text>
<text x="396" y="461" font-size="17" font-weight="bold" text-anchor="middle" fill="#e0904f">4</text>
<text x="500" y="461" font-size="17" font-weight="bold" text-anchor="middle" fill="#e0904f">6</text>
<text x="604" y="461" font-size="17" font-weight="bold" text-anchor="middle" fill="#e0904f">6</text>
<text x="708" y="461" font-size="17" font-weight="bold" text-anchor="middle" fill="#e0904f">6</text>
<text x="812" y="461" font-size="17" font-weight="bold" text-anchor="middle" fill="#e0904f">7</text>
<text x="32" y="500" font-size="14" fill="#a7adb5">8 lần push, 7 lần pop: chỉ chỉ số 7 ở lại; nhiều nhất 2n thao tác</text>
</svg>
