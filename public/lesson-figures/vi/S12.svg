<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" font-family="Inter, Arial, sans-serif" font-size="14">
<rect width="760" height="330" fill="#191b1f" rx="12"/>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#e5e7eb"/></marker></defs>
<text x="380" y="30" text-anchor="middle" fill="#e5e7eb" font-size="16" font-weight="bold">Chuỗi sensor đến lệnh: cận tuổi = tổng (chờ + phản hồi)</text>
<rect x="20" y="60" width="130" height="70" rx="8" fill="none" stroke="#53b2dd" stroke-width="2.5"/>
<text x="85" y="82" text-anchor="middle" fill="#53b2dd" font-weight="bold">Camera</text>
<text x="85" y="104" text-anchor="middle" fill="#e5e7eb" style="font-size:12.84px">tuần hoàn T=40</text>
<text x="85" y="122" text-anchor="middle" fill="#e5e7eb">trễ d=15</text>
<text x="85" y="156" text-anchor="middle" fill="#e5e7eb">cộng 55 ms</text>
<rect x="175" y="60" width="130" height="70" rx="8" fill="none" stroke="#9ccd4e" stroke-width="2.5"/>
<text x="240" y="82" text-anchor="middle" fill="#9ccd4e" font-weight="bold">Detector</text>
<text x="240" y="104" text-anchor="middle" fill="#e5e7eb">theo sự kiện</text>
<text x="240" y="122" text-anchor="middle" fill="#e5e7eb">R=30</text>
<text x="240" y="156" text-anchor="middle" fill="#e5e7eb">cộng 30 ms</text>
<rect x="330" y="60" width="130" height="70" rx="8" fill="none" stroke="#d97936" stroke-width="2.5"/>
<text x="395" y="82" text-anchor="middle" fill="#d97936" font-weight="bold">Controller</text>
<text x="395" y="104" text-anchor="middle" fill="#e5e7eb">timer T=20</text>
<text x="395" y="122" text-anchor="middle" fill="#e5e7eb">R=4</text>
<text x="395" y="156" text-anchor="middle" fill="#e5e7eb">cộng 24 ms</text>
<rect x="485" y="60" width="130" height="70" rx="8" fill="none" stroke="#53b2dd" stroke-width="2.5"/>
<text x="550" y="82" text-anchor="middle" fill="#53b2dd" font-weight="bold">Driver</text>
<text x="550" y="104" text-anchor="middle" fill="#e5e7eb">timer T=5</text>
<text x="550" y="122" text-anchor="middle" fill="#e5e7eb">R=1</text>
<text x="550" y="156" text-anchor="middle" fill="#e5e7eb">cộng 6 ms</text>
<line x1="150" y1="95" x2="172" y2="95" stroke="#e5e7eb" stroke-width="2" marker-end="url(#a)"/>
<line x1="305" y1="95" x2="327" y2="95" stroke="#e5e7eb" stroke-width="2" marker-end="url(#a)"/>
<line x1="460" y1="95" x2="482" y2="95" stroke="#e5e7eb" stroke-width="2" marker-end="url(#a)"/>
<line x1="615" y1="95" x2="637" y2="95" stroke="#e5e7eb" stroke-width="2" marker-end="url(#a)"/>
<rect x="640" y="60" width="100" height="70" rx="8" fill="none" stroke="#d97936" stroke-width="2.5" stroke-dasharray="6 4"/>
<text x="690" y="84" text-anchor="middle" fill="#d97936" font-weight="bold" style="font-size:13.43px">Cổng tuổi</text>
<text x="690" y="104" text-anchor="middle" fill="#e5e7eb">0 &lt;= tuổi</text>
<text x="690" y="122" text-anchor="middle" fill="#e5e7eb">&lt;= max_age</text>
<text x="20" y="200" fill="#e5e7eb">Tuổi của số đo (ms), trường hợp xấu nhất:</text>
<rect x="20" y="215" width="275.0" height="30" fill="#53b2dd" opacity="0.85"/>
<text x="157.5" y="236" text-anchor="middle" fill="#191b1f" font-weight="bold">55</text>
<rect x="295.0" y="215" width="150.0" height="30" fill="#9ccd4e" opacity="0.85"/>
<text x="370.0" y="236" text-anchor="middle" fill="#191b1f" font-weight="bold">30</text>
<rect x="445.0" y="215" width="120.0" height="30" fill="#d97936" opacity="0.85"/>
<text x="505.0" y="236" text-anchor="middle" fill="#191b1f" font-weight="bold">24</text>
<rect x="565.0" y="215" width="30.0" height="30" fill="#53b2dd" opacity="0.85"/>
<text x="580.0" y="236" text-anchor="middle" fill="#191b1f" font-weight="bold">6</text>
<text x="605.0" y="236" fill="#e5e7eb">= 115</text>
<line x1="20" y1="262" x2="595.0" y2="262" stroke="#e5e7eb"/>
<text x="20" y="284" fill="#e5e7eb">0</text>
<text x="595.0" y="284" text-anchor="end" fill="#e5e7eb">L_max = 115</text>
<line x1="720.0" y1="205" x2="720.0" y2="262" stroke="#d97936" stroke-width="2" stroke-dasharray="5 4"/>
<text x="712" y="204" text-anchor="end" fill="#d97936">max_age = 140 (dư)</text>
<text x="380" y="316" text-anchor="middle" fill="#e5e7eb" style="font-size:12.89px">Dữ liệu cũ hơn max_age: giữ, giảm dần hoặc dừng. Giai đoạn không có số hạng chờ là theo sự kiện.</text>
</svg>
