<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" font-family="Inter, Arial, sans-serif">
<rect width="720" height="380" fill="#191b1f" rx="12"/>
<text x="24" y="30" fill="#e5e7eb" font-size="16" font-weight="bold" style="font-size:12.48px">Đường đặc tính motor DC</text>
<text x="420" y="30" fill="#e5e7eb" font-size="16" font-weight="bold">Motor, hộp số, tải</text>
<line x1="60" y1="310" x2="360" y2="310" stroke="#e5e7eb"/><line x1="60" y1="310" x2="60" y2="50" stroke="#e5e7eb"/>
<text x="120" y="350" fill="#e5e7eb" font-size="13" text-anchor="middle">tốc độ (rad/s)</text>
<text x="18" y="180" fill="#e5e7eb" font-size="13" transform="rotate(-90 18 180)" text-anchor="middle" style="font-size:10.14px">mô-men / công suất</text>
<line x1="60" y1="80" x2="330" y2="310" stroke="#53b2dd" stroke-width="3"/>
<line x1="60" y1="130" x2="150" y2="130" stroke="#d97936" stroke-width="2" stroke-dasharray="5 3"/>
<text x="160" y="124" fill="#d97936" font-size="13" style="font-size:12.77px">giới hạn dòng đỉnh</text>
<text x="66" y="72" fill="#53b2dd" font-size="13">mô-men kẹt (kt V / R)</text>
<text x="372" y="342" fill="#53b2dd" font-size="13" text-anchor="end" style="font-size:12.77px">tốc độ không tải V / ke</text><line x1="330" y1="310" x2="330" y2="316" stroke="#e5e7eb"/>
<line x1="60" y1="190" x2="330" y2="190" stroke="#9ccd4e" stroke-width="2" stroke-dasharray="2 4"/>
<text x="66" y="183" fill="#9ccd4e" font-size="12">mô-men liên tục</text>
<path d="M 60 310 Q 195 150 330 310" fill="none" stroke="#9ccd4e" stroke-width="2"/>
<text x="195" y="222" fill="#9ccd4e" font-size="13" text-anchor="middle" style="font-size:10.14px">công suất</text>
<line x1="195" y1="230" x2="195" y2="316" stroke="#e5e7eb" stroke-dasharray="3 3"/><text x="195" y="328" fill="#e5e7eb" font-size="12" text-anchor="middle">nửa tốc độ</text>
<rect x="400" y="120" width="90" height="70" fill="none" stroke="#e5e7eb" stroke-width="2"/>
<text x="445" y="150" fill="#e5e7eb" font-size="13" text-anchor="middle">motor</text><text x="445" y="170" fill="#e5e7eb" font-size="13" text-anchor="middle">tau_m, w_m</text>
<rect x="540" y="120" width="70" height="70" fill="none" stroke="#53b2dd" stroke-width="2"/>
<text x="575" y="150" fill="#53b2dd" font-size="13" text-anchor="middle" style="font-size:10.14px">hộp số</text><text x="575" y="170" fill="#53b2dd" font-size="13" text-anchor="middle">N, eta</text>
<rect x="640" y="120" width="60" height="70" fill="none" stroke="#9ccd4e" stroke-width="2"/>
<text x="670" y="160" fill="#9ccd4e" font-size="13" text-anchor="middle">tải</text>
<line x1="490" y1="155" x2="540" y2="155" stroke="#e5e7eb" stroke-width="2"/><line x1="610" y1="155" x2="640" y2="155" stroke="#e5e7eb" stroke-width="2"/>
<text x="560" y="230" fill="#d97936" font-size="13" text-anchor="middle">tau_out = eta N tau_m</text>
<text x="560" y="254" fill="#53b2dd" font-size="13" text-anchor="middle">w_out = w_m / N</text>
<text x="560" y="278" fill="#e5e7eb" font-size="13" text-anchor="middle">J_refl = J_m + J_l / N^2</text>
<text x="560" y="302" fill="#e5e7eb" font-size="13" text-anchor="middle" style="font-size:10.4px">V = R I + ke w_m (sức phản điện động)</text>
</svg>
