<text x="380" y="272" fill="#9ccd4e" style="font-size:10.92px">Cách sửa: low-pass (làm mờ) trước,</text>
<text x="380" y="294" fill="#9ccd4e" style="font-size:13.24px">rồi mới lấy mẫu thưa. Nyquist sau /2:</text>
