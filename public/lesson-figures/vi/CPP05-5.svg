<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="Inter, sans-serif">
<title>Vector đã sắp xếp và std::map: thời gian và bộ nhớ</title>
<desc>Trái: trung vị của ba lần chạy, vector 53, 104 và 180 ns mỗi truy vấn, map 59, 208 và 691 ns cho N = 10^3, 10^5, 10^6, đo trên một máy. Phải: dung lượng dữ liệu 16 B mỗi mẫu của vector và 48 B mỗi node của map so với kích thước cache.</desc>
<defs><marker id="a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a7adb5"/></marker></defs>
<rect width="900" height="500" rx="14" fill="#17181b"/>
<text x="32" y="44" font-size="22" font-weight="bold" fill="#e9e7e3">Vector đã sắp xếp và std::map: thời gian và bộ nhớ</text>
<rect x="32" y="64" width="420" height="404" rx="10" fill="#22252a"/>
<rect x="476" y="64" width="392" height="404" rx="10" fill="#22252a"/>
<text x="52" y="96" font-size="17" font-weight="bold" fill="#e9e7e3">Đo được: ns mỗi truy vấn (-O2)</text>
<line x1="104" y1="380" x2="432" y2="380" stroke="#3d4148" stroke-width="1"/>
<text x="96" y="385" font-size="14" text-anchor="end" fill="#a7adb5">0</text>
<line x1="104" y1="320" x2="432" y2="320" stroke="#3d4148" stroke-width="1"/>
<text x="96" y="325" font-size="14" text-anchor="end" fill="#a7adb5">200</text>
<line x1="104" y1="260" x2="432" y2="260" stroke="#3d4148" stroke-width="1"/>
<text x="96" y="265" font-size="14" text-anchor="end" fill="#a7adb5">400</text>
<line x1="104" y1="200" x2="432" y2="200" stroke="#3d4148" stroke-width="1"/>
<text x="96" y="205" font-size="14" text-anchor="end" fill="#a7adb5">600</text>
<line x1="104" y1="140" x2="432" y2="140" stroke="#3d4148" stroke-width="1"/>
<text x="96" y="145" font-size="14" text-anchor="end" fill="#a7adb5">800</text>
<line x1="104" y1="380" x2="432" y2="380" stroke="#a7adb5" stroke-width="1.5"/>
<line x1="104" y1="380" x2="104" y2="140" stroke="#a7adb5" stroke-width="1.5"/>
<rect x="134" y="364" width="36" height="16" rx="0" fill="#86abe2"/>
<rect x="174" y="362" width="36" height="18" rx="0" fill="#e0904f"/>
<text x="152" y="358" font-size="14" text-anchor="middle" fill="#e9e7e3">53</text>
<text x="192" y="356" font-size="14" text-anchor="middle" fill="#e9e7e3">59</text>
<text x="172" y="400" font-size="15" text-anchor="middle" fill="#e9e7e3">N = 10³</text>
<rect x="238" y="349" width="36" height="31" rx="0" fill="#86abe2"/>
<rect x="278" y="318" width="36" height="62" rx="0" fill="#e0904f"/>
<text x="256" y="343" font-size="14" text-anchor="middle" fill="#e9e7e3">104</text>
<text x="296" y="312" font-size="14" text-anchor="middle" fill="#e9e7e3">208</text>
<text x="276" y="400" font-size="15" text-anchor="middle" fill="#e9e7e3">N = 10⁵</text>
<rect x="342" y="326" width="36" height="54" rx="0" fill="#86abe2"/>
<rect x="382" y="173" width="36" height="207" rx="0" fill="#e0904f"/>
<text x="360" y="320" font-size="14" text-anchor="middle" fill="#e9e7e3">180</text>
<text x="400" y="167" font-size="14" text-anchor="middle" fill="#e9e7e3">691</text>
<text x="380" y="400" font-size="15" text-anchor="middle" fill="#e9e7e3">N = 10⁶</text>
<text x="134" y="122" font-size="15" fill="#e9e7e3">ns mỗi truy vấn</text>
<rect x="114" y="142" width="14" height="14" rx="0" fill="#86abe2"/>
<text x="134" y="154" font-size="14" fill="#e9e7e3">vector + lower_bound</text>
<rect x="114" y="166" width="14" height="14" rx="0" fill="#e0904f"/>
<text x="134" y="178" font-size="14" fill="#e9e7e3">map::lower_bound</text>
<text x="52" y="432" font-size="14" fill="#a7adb5">tỉ lệ 1.1x, 2.0x, 3.8x; 2 x 10^6 truy vấn ngẫu nhiên, 5 lần lặp</text>
<text x="52" y="452" font-size="14" fill="#e0c169">trung vị của 3 lần chạy, i5-12500H, g++ 11.4: phụ thuộc máy</text>
<text x="496" y="96" font-size="17" font-weight="bold" fill="#e9e7e3">Dung lượng dữ liệu so với cache</text>
<line x1="520" y1="130" x2="520" y2="380" stroke="#3d4148" stroke-width="1"/>
<text x="520" y="400" font-size="14" text-anchor="middle" fill="#a7adb5">10 KB</text>
<line x1="601" y1="130" x2="601" y2="380" stroke="#3d4148" stroke-width="1"/>
<text x="601" y="400" font-size="14" text-anchor="middle" fill="#a7adb5">100 KB</text>
<line x1="682" y1="130" x2="682" y2="380" stroke="#3d4148" stroke-width="1"/>
<text x="682" y="400" font-size="14" text-anchor="middle" fill="#a7adb5">1 MB</text>
<line x1="763" y1="130" x2="763" y2="380" stroke="#3d4148" stroke-width="1"/>
<text x="763" y="400" font-size="14" text-anchor="middle" fill="#a7adb5">10 MB</text>
<line x1="844" y1="130" x2="844" y2="380" stroke="#3d4148" stroke-width="1"/>
<text x="844" y="400" font-size="14" text-anchor="middle" fill="#a7adb5">100 MB</text>
<line x1="698" y1="122" x2="698" y2="380" stroke="#6cc6ba" stroke-width="2" stroke-dasharray="6 4"/>
<line x1="785" y1="122" x2="785" y2="380" stroke="#ae9ce6" stroke-width="2" stroke-dasharray="6 4"/>
<text x="692" y="116" font-size="14" text-anchor="end" fill="#6cc6ba">L2 1.5 MiB</text>
<text x="791" y="116" font-size="14" fill="#ae9ce6">L3 18 MiB</text>
<text x="520" y="134" font-size="15" font-weight="600" fill="#e9e7e3">N = 10³:  16 KB  |  48 KB</text>
<rect x="520" y="140" width="17" height="20" rx="0" fill="#86abe2"/>
<rect x="520" y="166" width="55" height="20" rx="0" fill="#e0904f"/>
<text x="520" y="214" font-size="15" font-weight="600" fill="#e9e7e3">N = 10⁵:  1.6 MB  |  4.8 MB</text>
<rect x="520" y="220" width="179" height="20" rx="0" fill="#86abe2"/>
<rect x="520" y="246" width="217" height="20" rx="0" fill="#e0904f"/>
<text x="520" y="294" font-size="15" font-weight="600" fill="#e9e7e3">N = 10⁶:  16 MB  |  48 MB</text>
<rect x="520" y="300" width="260" height="20" rx="0" fill="#86abe2"/>
<rect x="520" y="326" width="298" height="20" rx="0" fill="#e0904f"/>
<text x="496" y="430" font-size="14" fill="#a7adb5">vector 16 B mỗi mẫu, node của map 48 B (libstdc++)</text>
<text x="496" y="450" font-size="14" fill="#a7adb5">kích thước L2/L3 của CPU này (lscpu)</text>
</svg>
