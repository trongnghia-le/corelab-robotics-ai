<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" font-family="Inter, sans-serif">
<title>Từ điểm thế giới tới pixel (Trường hợp 1, bước 4)</title>
<desc>Điểm thế giới (2.1, 0.2, 0.4) m thành điểm camera (-0.2, 0.1, 2.0) m sau R và t, điểm chuẩn hóa (-0.1, 0.05) sau khi chia cho Z = 2, và pixel (270, 265) sau K.</desc>
<defs><marker id="V03bae9e7e3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 z" fill="#e9e7e3"/></marker></defs>
<rect width="900" height="440" rx="14" fill="#17181b"/>
<text x="32" y="44" font-size="22" fill="#e9e7e3" text-anchor="start" font-weight="bold">Từ điểm thế giới tới pixel (Trường hợp 1, bước 4)</text>
<rect x="32" y="84" width="176" height="120" rx="10" fill="#22252a" stroke="#86abe2" stroke-width="1.5"/>
<text x="48" y="114" font-size="17" fill="#e9e7e3" text-anchor="start" font-weight="bold">điểm thế giới</text>
<text x="48" y="154" font-size="15" fill="#86abe2" text-anchor="start" font-weight="600">p_w = (2.1, 0.2, 0.4) m</text>
<text x="48" y="182" font-size="14" fill="#a7adb5" text-anchor="start" font-weight="normal">x tới, y trái, z lên</text>
<rect x="252" y="84" width="176" height="120" rx="10" fill="#22252a" stroke="#6fc693" stroke-width="1.5"/>
<text x="268" y="114" font-size="17" fill="#e9e7e3" text-anchor="start" font-weight="bold">điểm camera</text>
<text x="268" y="154" font-size="15" fill="#6fc693" text-anchor="start" font-weight="600">p_c = (−0.2, 0.1, 2.0) m</text>
<text x="268" y="182" font-size="14" fill="#a7adb5" text-anchor="start" font-weight="normal">x phải, y xuống, z tới</text>
<rect x="472" y="84" width="176" height="120" rx="10" fill="#22252a" stroke="#ae9ce6" stroke-width="1.5"/>
<text x="488" y="114" font-size="17" fill="#e9e7e3" text-anchor="start" font-weight="bold">điểm chuẩn hóa</text>
<text x="488" y="154" font-size="15" fill="#ae9ce6" text-anchor="start" font-weight="600">(x, y) = (−0.1, 0.05)</text>
<text x="488" y="182" font-size="14" fill="#a7adb5" text-anchor="start" font-weight="normal">Z = 2.0 m</text>
<rect x="692" y="84" width="176" height="120" rx="10" fill="#22252a" stroke="#e0904f" stroke-width="1.5"/>
<text x="708" y="114" font-size="17" fill="#e9e7e3" text-anchor="start" font-weight="bold">pixel</text>
<text x="708" y="154" font-size="15" fill="#e0904f" text-anchor="start" font-weight="600">(u, v) = (270, 265) px</text>
<text x="708" y="182" font-size="14" fill="#a7adb5" text-anchor="start" font-weight="normal">fx = fy = 500</text>
<line x1="212" y1="144" x2="248" y2="144" stroke="#e9e7e3" stroke-width="2.5" stroke-linecap="round" marker-end="url(#V03bae9e7e3)"/>
<line x1="432" y1="144" x2="468" y2="144" stroke="#e9e7e3" stroke-width="2.5" stroke-linecap="round" marker-end="url(#V03bae9e7e3)"/>
<line x1="652" y1="144" x2="688" y2="144" stroke="#e9e7e3" stroke-width="2.5" stroke-linecap="round" marker-end="url(#V03bae9e7e3)"/>
<text x="230" y="234" font-size="14" fill="#a7adb5" text-anchor="middle" font-weight="normal">p_c = R p_w + t</text>
<text x="450" y="234" font-size="14" fill="#a7adb5" text-anchor="middle" font-weight="normal">÷ Z</text>
<text x="670" y="234" font-size="14" fill="#a7adb5" text-anchor="middle" font-weight="normal">u = fx x + cx</text>
<rect x="32" y="248" width="836" height="172" rx="10" fill="#22252a"/>
<text x="52" y="280" font-size="17" fill="#e9e7e3" text-anchor="start" font-weight="bold">Tham số của camera này</text>
<text x="52" y="312" font-size="15" fill="#e9e7e3" text-anchor="start" font-weight="normal">R = [[0, −1, 0], [0, 0, −1], [1, 0, 0]],  det R = +1</text>
<text x="52" y="340" font-size="15" fill="#e9e7e3" text-anchor="start" font-weight="normal">t = −R c = (0, 0.5, −0.1) m,  tâm camera c = −Rᵀt = (0.1, 0, 0.5) m</text>
<text x="52" y="368" font-size="15" fill="#e9e7e3" text-anchor="start" font-weight="normal">c = (320, 240);  P = K [R | t]: P p̃_w = (540, 530, 2) = s (u, v, 1) với s = Z = 2</text>
<text x="52" y="396" font-size="15" fill="#a7adb5" text-anchor="start" font-weight="normal">độ sâu s = 2 là hàng thứ ba; Z ≤ 0 nghĩa là: sau camera, phải loại</text>
</svg>
