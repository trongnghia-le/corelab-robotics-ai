<rect x="480" y="446" width="76" height="28" rx="3" fill="#6fc693" fill-opacity="0.25" stroke="#6fc693" stroke-width="1.5"/>
<text x="338" y="466" font-size="15" fill="#a7adb5" text-anchor="middle">1</text>
<text x="428" y="466" font-size="15" fill="#e9e7e3" text-anchor="middle" font-weight="600">3</text>
