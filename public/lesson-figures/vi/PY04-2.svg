<text x="518" y="380" font-size="15" fill="#e9e7e3" text-anchor="middle" font-weight="600">✗</text>
<rect x="32" y="424" width="836" height="150" rx="6" fill="#22252a" stroke="#3d4148" stroke-width="1.5"/>
<text x="612" y="468" font-size="17" fill="#e9e7e3" text-anchor="start" font-weight="bold">ok: kết quả (3, 3)</text>
