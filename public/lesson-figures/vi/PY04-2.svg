<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 610" font-family="Inter, sans-serif">
<title>Quy tắc broadcasting, từng trục tính từ bên phải</title>
<desc>Ba cặp shape căn lề phải. (6,1,2) với (3,1) cho (6,3,2). (5,3) với (5,) lỗi vì 3 khác 5. (3,3) với (3,) chạy được nhưng trừ theo cột.</desc>
<defs></defs>
<rect width="900" height="610" rx="14" fill="#17181b"/>
<text x="32" y="44" font-size="22" fill="#e9e7e3" text-anchor="start" font-weight="bold">Quy tắc broadcasting, từng trục tính từ bên phải</text>
<text x="338" y="78" font-size="14" fill="#a7adb5" text-anchor="middle">thứ 3 từ phải</text>
<text x="428" y="78" font-size="14" fill="#a7adb5" text-anchor="middle">thứ 2</text>
<text x="518" y="78" font-size="14" fill="#a7adb5" text-anchor="middle">thứ 1</text>
<rect x="32" y="92" width="836" height="150" rx="6" fill="#22252a" stroke="#3d4148" stroke-width="1.5"/>
<text x="612" y="136" font-size="17" fill="#e9e7e3" text-anchor="start" font-weight="bold">ok: kết quả (6, 3, 2)</text>
<text x="612" y="168" font-size="14" fill="#a7adb5"><tspan x="612">mỗi số 1 được giãn cho khớp;</tspan><tspan x="612" dy="22">trục thiếu coi như 1</tspan></text>
<text font-size="15" fill="#a7adb5" text-anchor="end"><tspan x="120" y="134">A</tspan><tspan x="120" y="174">B</tspan><tspan x="120" y="214">kết quả</tspan></text>
<rect x="300" y="114" width="76" height="28" rx="3" fill="#6fc693" fill-opacity="0.25" stroke="#6fc693" stroke-width="1.5"/>
<rect x="390" y="114" width="76" height="28" rx="3" fill="#e0c169" fill-opacity="0.25" stroke="#e0c169" stroke-width="1.5"/>
<rect x="480" y="114" width="76" height="28" rx="3" fill="#e58a80" fill-opacity="0.25" stroke="#e58a80" stroke-width="1.5"/>
<text x="338" y="134" font-size="15" fill="#e9e7e3" text-anchor="middle" font-weight="600">6</text>
<text x="428" y="134" font-size="15" fill="#e9e7e3" text-anchor="middle" font-weight="600">1</text>
<text x="518" y="134" font-size="15" fill="#e9e7e3" text-anchor="middle" font-weight="600">2</text>
<rect x="300" y="154" width="76" height="28" rx="3" fill="none" stroke="#a7adb5" stroke-width="1.2" stroke-dasharray="4 3"/>
<rect x="390" y="154" width="76" height="28" rx="3" fill="#e58a80" fill-opacity="0.25" stroke="#e58a80" stroke-width="1.5"/>
