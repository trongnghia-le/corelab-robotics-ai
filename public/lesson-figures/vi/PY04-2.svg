<text x="518" y="214" font-size="15" fill="#e9e7e3" text-anchor="middle" font-weight="600">2</text>
<rect x="32" y="258" width="836" height="150" rx="6" fill="#22252a" stroke="#3d4148" stroke-width="1.5"/>
<text x="612" y="302" font-size="17" fill="#e58a80" text-anchor="start" font-weight="bold">lỗi</text>
