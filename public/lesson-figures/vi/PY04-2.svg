<text x="428" y="300" font-size="15" fill="#e9e7e3" text-anchor="middle" font-weight="600">5</text>
<text x="518" y="300" font-size="15" fill="#e9e7e3" text-anchor="middle" font-weight="600">3</text>
<rect x="300" y="320" width="76" height="28" rx="3" fill="none" stroke="#a7adb5" stroke-width="1.2" stroke-dasharray="4 3"/>
