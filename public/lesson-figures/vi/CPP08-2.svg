<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" font-family="Inter, sans-serif">
<title>Shadow byte của khối 13 byte</title>
<desc>Hai từ 8 byte của một cấp phát 13 byte, các giá trị shadow 0 và 5, và hai lần đọc 4 byte.</desc>
<rect width="900" height="450" rx="14" fill="#17181b"/>
<defs><marker id="ahf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#a7adb5"/></marker></defs>
<text x="32" y="44" font-size="22" font-weight="700" fill="#e9e7e3">Shadow byte của khối 13 byte</text>
<text x="32" y="70" font-size="14" fill="#a7adb5">p = malloc(13), căn 8 byte. Offset 0-12 hợp lệ; 13-15 là phần đệm bị poison.</text>
<text x="32" y="120" font-size="15" font-weight="600" fill="#e9e7e3">offset</text>
<rect x="120" y="128" width="40" height="44" rx="3" fill="#2b3a31" stroke="#6fc693" stroke-width="1.5"/>
<text x="140.0" y="106" font-size="14" fill="#a7adb5" text-anchor="middle">0</text>
<rect x="160" y="128" width="40" height="44" rx="3" fill="#2b3a31" stroke="#6fc693" stroke-width="1.5"/>
<text x="180.0" y="106" font-size="14" fill="#a7adb5" text-anchor="middle">1</text>
<rect x="200" y="128" width="40" height="44" rx="3" fill="#2b3a31" stroke="#6fc693" stroke-width="1.5"/>
<text x="220.0" y="106" font-size="14" fill="#a7adb5" text-anchor="middle">2</text>
<rect x="240" y="128" width="40" height="44" rx="3" fill="#2b3a31" stroke="#6fc693" stroke-width="1.5"/>
<text x="260.0" y="106" font-size="14" fill="#a7adb5" text-anchor="middle">3</text>
<rect x="280" y="128" width="40" height="44" rx="3" fill="#2b3a31" stroke="#6fc693" stroke-width="1.5"/>
<text x="300.0" y="106" font-size="14" fill="#a7adb5" text-anchor="middle">4</text>
<rect x="320" y="128" width="40" height="44" rx="3" fill="#2b3a31" stroke="#6fc693" stroke-width="1.5"/>
<text x="340.0" y="106" font-size="14" fill="#a7adb5" text-anchor="middle">5</text>
<rect x="360" y="128" width="40" height="44" rx="3" fill="#2b3a31" stroke="#6fc693" stroke-width="1.5"/>
<text x="380.0" y="106" font-size="14" fill="#a7adb5" text-anchor="middle">6</text>
<rect x="400" y="128" width="40" height="44" rx="3" fill="#2b3a31" stroke="#6fc693" stroke-width="1.5"/>
<text x="420.0" y="106" font-size="14" fill="#a7adb5" text-anchor="middle">7</text>
<rect x="440" y="128" width="40" height="44" rx="3" fill="#2b3a31" stroke="#6fc693" stroke-width="1.5"/>
<text x="460.0" y="106" font-size="14" fill="#a7adb5" text-anchor="middle">8</text>
<rect x="480" y="128" width="40" height="44" rx="3" fill="#2b3a31" stroke="#6fc693" stroke-width="1.5"/>
<text x="500.0" y="106" font-size="14" fill="#a7adb5" text-anchor="middle">9</text>
<rect x="520" y="128" width="40" height="44" rx="3" fill="#2b3a31" stroke="#6fc693" stroke-width="1.5"/>
<text x="540.0" y="106" font-size="14" fill="#a7adb5" text-anchor="middle">10</text>
<rect x="560" y="128" width="40" height="44" rx="3" fill="#2b3a31" stroke="#6fc693" stroke-width="1.5"/>
<text x="580.0" y="106" font-size="14" fill="#a7adb5" text-anchor="middle">11</text>
<rect x="600" y="128" width="40" height="44" rx="3" fill="#2b3a31" stroke="#6fc693" stroke-width="1.5"/>
<text x="620.0" y="106" font-size="14" fill="#a7adb5" text-anchor="middle">12</text>
<rect x="640" y="128" width="40" height="44" rx="3" fill="#3a2b2b" stroke="#e58a80" stroke-width="1.5"/>
<text x="660.0" y="106" font-size="14" fill="#a7adb5" text-anchor="middle">13</text>
<rect x="680" y="128" width="40" height="44" rx="3" fill="#3a2b2b" stroke="#e58a80" stroke-width="1.5"/>
<text x="700.0" y="106" font-size="14" fill="#a7adb5" text-anchor="middle">14</text>
<rect x="720" y="128" width="40" height="44" rx="3" fill="#3a2b2b" stroke="#e58a80" stroke-width="1.5"/>
<text x="740.0" y="106" font-size="14" fill="#a7adb5" text-anchor="middle">15</text>
<text x="32" y="156" font-size="15" fill="#e9e7e3" font-family="monospace">p[ ]</text>
<rect x="120" y="288" width="314" height="40" rx="8" fill="#22252a" stroke="#6fc693" stroke-width="2"/>
<text x="277" y="314" font-size="15" font-weight="700" fill="#6fc693" text-anchor="middle" font-family="monospace">00</text>
<rect x="440" y="288" width="320" height="40" rx="8" fill="#22252a" stroke="#e0c169" stroke-width="2"/>
<text x="600" y="314" font-size="15" font-weight="700" fill="#e0c169" text-anchor="middle" font-family="monospace">05</text>
<text x="32" y="314" font-size="15" font-weight="600" fill="#e9e7e3">shadow</text>
<text x="280" y="350" font-size="14" fill="#a7adb5" text-anchor="middle">cả 8 byte hợp lệ</text>
<text x="600" y="350" font-size="14" fill="#a7adb5" text-anchor="middle">5 byte đầu hợp lệ (13 = 8 + 5)</text>
<rect x="480" y="188" width="160" height="28" rx="4" fill="none" stroke="#6fc693" stroke-width="2.5"/>
<text x="468" y="208" font-size="15" font-weight="600" fill="#6fc693" text-anchor="end">offset 9: l = 1 + 3 = 4 &lt; 5, im lặng</text>
<rect x="520" y="230" width="160" height="28" rx="4" fill="none" stroke="#e58a80" stroke-width="2.5"/>
<text x="508" y="250" font-size="15" font-weight="600" fill="#e58a80" text-anchor="end">offset 10: l = 2 + 3 = 5 &gt;= 5, báo lỗi</text>
<text x="32" y="400" font-size="14" fill="#a7adb5">Khung: lần đọc 4 byte. l = (a mod 8) + s - 1 là byte cuối bị chạm trong từ; lỗi khi l &gt;= giá trị shadow.</text>
</svg>
