<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" font-family="Inter, sans-serif">
<title>Chín lần push vào một vector mới</title>
<desc>Capacity sau mỗi trong chín lần push_back: 1, 2, 4, 4, 8, 8, 8, 8, 16; các lần cấp phát lại ở push 2, 3, 5 và 9 với số phần tử chuyển 1, 2, 4 và 8; con trỏ p được lấy sau push 1.</desc>
<rect width="900" height="480" rx="14" fill="#17181b"/>
<defs><marker id="c024-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs>
<text x="32" y="44" font-size="22" fill="#e9e7e3" font-weight="700">Chín lần push vào một vector mới</text>
<line x1="110" y1="330" x2="800" y2="330" stroke="#2c3036" stroke-width="1"/>
<text x="100" y="335" font-size="14" fill="#a7adb5" text-anchor="end">0</text>
<line x1="110" y1="282" x2="800" y2="282" stroke="#2c3036" stroke-width="1"/>
<text x="100" y="287" font-size="14" fill="#a7adb5" text-anchor="end">4</text>
<line x1="110" y1="234" x2="800" y2="234" stroke="#2c3036" stroke-width="1"/>
<text x="100" y="239" font-size="14" fill="#a7adb5" text-anchor="end">8</text>
<line x1="110" y1="186" x2="800" y2="186" stroke="#2c3036" stroke-width="1"/>
<text x="100" y="191" font-size="14" fill="#a7adb5" text-anchor="end">12</text>
<line x1="110" y1="138" x2="800" y2="138" stroke="#2c3036" stroke-width="1"/>
<text x="100" y="143" font-size="14" fill="#a7adb5" text-anchor="end">16</text>
<line x1="110" y1="330" x2="800" y2="330" stroke="#3d4148" stroke-width="2"/>
<line x1="110" y1="128" x2="110" y2="330" stroke="#3d4148" stroke-width="2"/>
<path d="M130,318 L210,318 L210,306 L290,306 L290,282 L370,282 L370,282 L450,282 L450,234 L530,234 L530,234 L610,234 L610,234 L690,234 L690,234 L770,234 L770,138" fill="none" stroke="#86abe2" stroke-width="2"/>
<circle cx="130" cy="318" r="6" fill="#e0904f" stroke="#e0904f" stroke-width="2"/>
<text x="130" y="350" font-size="14" fill="#a7adb5" text-anchor="middle">1</text>
<circle cx="210" cy="306" r="6" fill="#e0904f" stroke="#e0904f" stroke-width="2"/>
<text x="210" y="350" font-size="14" fill="#a7adb5" text-anchor="middle">2</text>
<text x="200" y="294" font-size="15" fill="#e0904f" font-weight="600" text-anchor="end">chuyển 1</text>
<circle cx="290" cy="282" r="6" fill="#e0904f" stroke="#e0904f" stroke-width="2"/>
<text x="290" y="350" font-size="14" fill="#a7adb5" text-anchor="middle">3</text>
<text x="280" y="270" font-size="15" fill="#e0904f" font-weight="600" text-anchor="end">chuyển 2</text>
<circle cx="370" cy="282" r="6" fill="#17181b" stroke="#a7adb5" stroke-width="2"/>
<text x="370" y="350" font-size="14" fill="#a7adb5" text-anchor="middle">4</text>
<circle cx="450" cy="234" r="6" fill="#e0904f" stroke="#e0904f" stroke-width="2"/>
<text x="450" y="350" font-size="14" fill="#a7adb5" text-anchor="middle">5</text>
<text x="440" y="222" font-size="15" fill="#e0904f" font-weight="600" text-anchor="end">chuyển 4</text>
<circle cx="530" cy="234" r="6" fill="#17181b" stroke="#a7adb5" stroke-width="2"/>
<text x="530" y="350" font-size="14" fill="#a7adb5" text-anchor="middle">6</text>
<circle cx="610" cy="234" r="6" fill="#17181b" stroke="#a7adb5" stroke-width="2"/>
<text x="610" y="350" font-size="14" fill="#a7adb5" text-anchor="middle">7</text>
<circle cx="690" cy="234" r="6" fill="#17181b" stroke="#a7adb5" stroke-width="2"/>
<text x="690" y="350" font-size="14" fill="#a7adb5" text-anchor="middle">8</text>
<circle cx="770" cy="138" r="6" fill="#e0904f" stroke="#e0904f" stroke-width="2"/>
<text x="770" y="350" font-size="14" fill="#a7adb5" text-anchor="middle">9</text>
<text x="760" y="126" font-size="15" fill="#e0904f" font-weight="600" text-anchor="end">chuyển 8</text>
<text x="110" y="76" font-size="15" fill="#e9e7e3" font-weight="600">capacity (phần tử)</text>
<text x="450" y="376" font-size="15" fill="#e9e7e3" font-weight="600" text-anchor="middle">số thứ tự push</text>
<rect x="116" y="402" width="28" height="22" rx="0" fill="#6fc693" stroke="#6fc693" stroke-width="1.5"/>
<rect x="196" y="402" width="588" height="22" rx="0" fill="none" stroke="#e58a80" stroke-width="2" stroke-dasharray="5 4"/>
<text x="108" y="419" font-size="15" fill="#6fc693" font-weight="600" text-anchor="end">p hợp lệ</text>
<text x="380" y="419" font-size="15" fill="#e58a80" font-weight="600">p treo (mọi lần push sau)</text>
<circle cx="290" cy="413" r="5" fill="#e0c169" stroke="#e0c169" stroke-width="1"/>
<text x="302" y="454" font-size="14" fill="#e0c169">p == data() đúng ở đây do tình cờ</text>
<line x1="290" y1="424" x2="290" y2="438" stroke="#e0c169" stroke-width="1.5"/>
<circle cx="640" cy="72" r="6" fill="#e0904f" stroke="#e0904f" stroke-width="2"/>
<text x="654" y="77" font-size="14" fill="#a7adb5">cấp phát lại</text>
<circle cx="760" cy="72" r="6" fill="#17181b" stroke="#a7adb5" stroke-width="2"/>
<text x="774" y="77" font-size="14" fill="#a7adb5">tại chỗ</text>
<text x="868" y="100" font-size="15" fill="#e9e7e3" font-weight="600" text-anchor="end">5 lần cấp phát, 15 lần chuyển &lt; 18</text>
</svg>
