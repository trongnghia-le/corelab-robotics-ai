<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 630" font-family="Inter, Arial, sans-serif">
<title>Loại động cơ, trạng thái H-bridge và điện áp trung bình PWM</title>
<desc>Trái: năm loại động cơ với cách điều khiển và nơi dùng. Phải trên: H-bridge với bốn công tắc và bốn trạng thái tiến, lùi, phanh và quán tính. Phải dưới: dạng sóng PWM 12 V ở duty 25 và 75 phần trăm kèm điện áp trung bình.</desc>
<rect width="900" height="630" fill="#191b1f" rx="12"/>
<text x="24" y="32" font-size="16" fill="#e5e7eb" text-anchor="start" font-weight="bold">1. Chọn loại động cơ</text>
<rect x="20" y="52" width="410" height="76" rx="8" fill="#272a2f" stroke="#53b2dd" stroke-width="2"/>
<text x="34" y="76" font-size="14" fill="#e5e7eb" text-anchor="start" font-weight="bold" style="font-size:10.93px">Động cơ DC chổi than giảm tốc</text>
<text x="34" y="98" font-size="12" fill="#e5e7eb" text-anchor="start" style="font-size:10.51px">điều khiển bằng: H-bridge: DIR + PWM</text>
<text x="34" y="117" font-size="12" fill="#a0a4ab" text-anchor="start" style="font-size:10.12px">dùng cho: bánh xe, khớp đơn giản; thêm encoder</text>
<rect x="20" y="140" width="410" height="76" rx="8" fill="#272a2f" stroke="#9ccd4e" stroke-width="2"/>
<text x="34" y="164" font-size="14" fill="#e5e7eb" text-anchor="start" font-weight="bold">Brushless (BLDC)</text>
<text x="34" y="186" font-size="12" fill="#e5e7eb" text-anchor="start" style="font-size:9.57px">điều khiển bằng: ESC hoặc driver FOC</text>
<text x="34" y="205" font-size="12" fill="#a0a4ab" text-anchor="start" style="font-size:10.56px">dùng cho: drone, khớp nhanh, hiệu suất</text>
<rect x="20" y="228" width="410" height="76" rx="8" fill="#272a2f" stroke="#d97936" stroke-width="2"/>
<text x="34" y="252" font-size="14" fill="#e5e7eb" text-anchor="start" font-weight="bold">Servo hobby</text>
<text x="34" y="274" font-size="12" fill="#e5e7eb" text-anchor="start" style="font-size:10.78px">điều khiển bằng: một xung 50 Hz, 1-2 ms</text>
<text x="34" y="293" font-size="12" fill="#a0a4ab" text-anchor="start" style="font-size:11.46px">dùng cho: tay nhỏ, pan/tilt, không có phản hồi</text>
<rect x="20" y="316" width="410" height="76" rx="8" fill="#272a2f" stroke="#9ccd4e" stroke-width="2"/>
<text x="34" y="340" font-size="14" fill="#e5e7eb" text-anchor="start" font-weight="bold" style="font-size:11.3px">Servo serial thông minh</text>
<text x="34" y="362" font-size="12" fill="#e5e7eb" text-anchor="start">điều khiển bằng: gói UART / RS-485</text>
<text x="34" y="381" font-size="12" fill="#a0a4ab" text-anchor="start">dùng cho: khớp tay có vị trí + dòng</text>
<rect x="20" y="404" width="410" height="76" rx="8" fill="#272a2f" stroke="#53b2dd" stroke-width="2"/>
<text x="34" y="428" font-size="14" fill="#e5e7eb" text-anchor="start" font-weight="bold">Stepper</text>
<text x="34" y="450" font-size="12" fill="#e5e7eb" text-anchor="start" style="font-size:10.31px">điều khiển bằng: driver STEP + DIR</text>
<text x="34" y="469" font-size="12" fill="#a0a4ab" text-anchor="start" style="font-size:11.53px">dùng cho: trục máy in 3D, vòng hở</text>
<text x="24" y="525" font-size="12" fill="#a0a4ab" text-anchor="start">Tính mô-men, tỉ số truyền và tốc độ: R09. Ở đây ta chọn và kiểm tra.</text>
<text x="24" y="545" font-size="12" fill="#d97936" text-anchor="start">Quy tắc: chọn cỡ theo tải, rồi kiểm tra dòng STALL với driver.</text>
<text x="460" y="32" font-size="16" fill="#e5e7eb" text-anchor="start" font-weight="bold" style="font-size:15.79px">2. H-bridge: bốn công tắc, bốn trạng thái</text>
<line x1="520" y1="56" x2="640" y2="56" stroke="#d97936" stroke-width="2"/>
<text x="650" y="60" font-size="12" fill="#d97936" text-anchor="start" style="font-size:11.19px">+V nguồn động cơ</text>
<line x1="520" y1="206" x2="640" y2="206" stroke="#a0a4ab" stroke-width="2"/>
<text x="650" y="210" font-size="12" fill="#a0a4ab" text-anchor="start">GND</text>
<line x1="540" y1="56" x2="540" y2="206" stroke="#e5e7eb" stroke-width="2"/>
<line x1="620" y1="56" x2="620" y2="206" stroke="#e5e7eb" stroke-width="2"/>
<rect x="524" y="70" width="32" height="32" rx="8" fill="#272a2f" stroke="#53b2dd" stroke-width="2"/>
<text x="540" y="91" font-size="13" fill="#e5e7eb" text-anchor="middle" font-weight="bold">Q1</text>
<rect x="604" y="70" width="32" height="32" rx="8" fill="#272a2f" stroke="#53b2dd" stroke-width="2"/>
<text x="620" y="91" font-size="13" fill="#e5e7eb" text-anchor="middle" font-weight="bold">Q2</text>
<rect x="524" y="140" width="32" height="32" rx="8" fill="#272a2f" stroke="#53b2dd" stroke-width="2"/>
<text x="540" y="161" font-size="13" fill="#e5e7eb" text-anchor="middle" font-weight="bold">Q3</text>
<rect x="604" y="140" width="32" height="32" rx="8" fill="#272a2f" stroke="#53b2dd" stroke-width="2"/>
<text x="620" y="161" font-size="13" fill="#e5e7eb" text-anchor="middle" font-weight="bold">Q4</text>
<line x1="540" y1="131" x2="620" y2="131" stroke="#e5e7eb" stroke-width="2"/>
<circle cx="580" cy="131" r="17" fill="#272a2f" stroke="#e5e7eb" stroke-width="2"/>
<text x="580" y="136" font-size="14" fill="#e5e7eb" text-anchor="middle" font-weight="bold">M</text>
<text x="720" y="92" font-size="12" fill="#a0a4ab" text-anchor="start">Q1, Q2: phía cao</text>
<text x="720" y="162" font-size="12" fill="#a0a4ab" text-anchor="start" style="font-size:11.83px">Q3, Q4: phía thấp</text>
<text x="470" y="232" font-size="13" fill="#9ccd4e" text-anchor="start" font-weight="bold">Tiến</text>
<text x="560" y="232" font-size="13" fill="#e5e7eb" text-anchor="start">Q1 + Q4 bật</text>
<text x="690" y="232" font-size="12" fill="#a0a4ab" text-anchor="start" style="font-size:10.53px">dòng từ trái sang phải</text>
<text x="470" y="262" font-size="13" fill="#9ccd4e" text-anchor="start" font-weight="bold">Lùi</text>
<text x="560" y="262" font-size="13" fill="#e5e7eb" text-anchor="start">Q2 + Q3 bật</text>
<text x="690" y="262" font-size="12" fill="#a0a4ab" text-anchor="start" style="font-size:10.53px">dòng từ phải sang trái</text>
<text x="470" y="292" font-size="13" fill="#53b2dd" text-anchor="start" font-weight="bold">Phanh</text>
<text x="560" y="292" font-size="13" fill="#e5e7eb" text-anchor="start">Q3 + Q4 bật</text>
<text x="690" y="292" font-size="12" fill="#a0a4ab" text-anchor="start">chập hai cực động cơ</text>
<text x="470" y="322" font-size="13" fill="#53b2dd" text-anchor="start" font-weight="bold" style="font-size:10.14px">Quán tính</text>
<text x="560" y="322" font-size="13" fill="#e5e7eb" text-anchor="start" style="font-size:10.14px">tất cả tắt</text>
<text x="690" y="322" font-size="12" fill="#a0a4ab" text-anchor="start" style="font-size:11.51px">động cơ quay tự do</text>
<text x="470" y="358" font-size="12" fill="#d97936" text-anchor="start" style="font-size:10.51px">Không bao giờ bật cùng lúc Q1 + Q3 (hoặc Q2 + Q4): đoản mạch shoot-through.</text>
<text x="460" y="392" font-size="16" fill="#e5e7eb" text-anchor="start" font-weight="bold">3. PWM: duty đặt điện áp trung bình (nguồn 12 V)</text>
<polyline points="470.0,500.0 470.0,450.0 490.0,450.0 490.0,500.0 550.0,500.0 550.0,450.0 570.0,450.0 570.0,500.0 630.0,500.0 630.0,450.0 650.0,450.0 650.0,500.0 710.0,500.0" fill="none" stroke="#53b2dd" stroke-width="2"/>
<line x1="470" y1="487.5" x2="710" y2="487.5" stroke="#d97936" stroke-width="1"/>
<text x="722" y="491.5" font-size="12" fill="#d97936" text-anchor="start" style="font-size:10.92px">trung bình 3 V</text>
<text x="470" y="518" font-size="12" fill="#e5e7eb" text-anchor="start">duty 25 %</text>
<polyline points="470.0,590.0 470.0,540.0 530.0,540.0 530.0,590.0 550.0,590.0 550.0,540.0 610.0,540.0 610.0,590.0 630.0,590.0 630.0,540.0 690.0,540.0 690.0,590.0 710.0,590.0" fill="none" stroke="#53b2dd" stroke-width="2"/>
<line x1="470" y1="552.5" x2="710" y2="552.5" stroke="#d97936" stroke-width="1"/>
<text x="722" y="556.5" font-size="12" fill="#d97936" text-anchor="start" style="font-size:10.92px">trung bình 9 V</text>
<text x="470" y="608" font-size="12" fill="#e5e7eb" text-anchor="start">duty 75 %</text>
<text x="860" y="414" font-size="12" fill="#a0a4ab" text-anchor="end">chu kỳ ở 20 kHz = 50 us</text>
</svg>
