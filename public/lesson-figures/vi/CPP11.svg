<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="Inter, sans-serif">
<title>Bình phương tối thiểu là một cái bóng; phương trình chuẩn bình phương sai số</title>
<desc>Trái: b nằm trên không gian cột của A, bóng A x-hat trong mặt phẳng và phần dư r vuông góc. Phải: sai số hệ số đo được theo số điều kiện trên trục log-log cho QR và phương trình chuẩn, cùng hai đường kappa nhân epsilon và kappa bình phương nhân epsilon.</desc>
