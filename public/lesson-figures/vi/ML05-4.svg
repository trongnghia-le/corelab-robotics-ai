<text x="48" y="432" font-size="17" fill="#e9e7e3" text-anchor="start" font-weight="bold">Gradient của tham số từ cùng một lượt quét</text>
<text x="48" y="462" font-size="15" fill="#e0904f" text-anchor="start">W̄₂ = ȳ·a₁ᵀ = (−0.46808, −2.37122)    b̄₂ = −2.56586</text>
<text x="48" y="490" font-size="15" fill="#e0904f" text-anchor="start">W̄₁ = z̄₁·xᵀ = [ −0.38269  −0.76538 ;  0.35975  0.71950 ]    b̄₁ = z̄₁</text>
<text x="48" y="516" font-size="14" fill="#a7adb5" text-anchor="start">Mỗi adjoint có cùng hình dạng với giá trị của nó. Đơn vị ẩn 2 bão hoà (a = 0.924, độ dốc 0.070) nên hàng của nó bị giảm.</text>
