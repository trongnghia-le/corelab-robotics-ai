<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="Inter, Arial, sans-serif" role="img">
<title>CAP06 kỹ năng gắp học được: huấn luyện, ngẫu nhiên hóa, đánh giá trên seed giữ lại</title>
<desc>Vòng huấn luyện với bộ ngẫu nhiên hóa miền cấp dữ liệu cho môi trường gắp Gymnasium và policy PPO hoặc behaviour cloning. Bộ đánh giá riêng dùng seed và nhiễu loạn giữ lại, báo cận Wilson, và so với kỹ năng viết tay sau cùng giao diện GraspSkill.</desc>
<rect width="900" height="470" fill="#191b1f" rx="12"/>
<text x="450" y="28" font-size="17" fill="#e5e7eb" text-anchor="middle" font-weight="bold" style="font-size:14.55px">Kỹ năng gắp học được: huấn luyện trên thế giới ngẫu nhiên, đánh giá trên thế giới giữ lại</text>
<text x="30" y="62" font-size="13" fill="#9ccd4e" text-anchor="start" font-weight="bold" style="font-size:11.72px">HUẤN LUYỆN  (seed 0-999, CPU, 1 thread)</text>
<rect x="30" y="75" width="170" height="70" rx="8" fill="#272a2f" stroke="#d3952d" stroke-width="2"/>
<text x="115.0" y="99.2" font-size="12" fill="#e5e7eb" text-anchor="middle" font-weight="bold" style="font-size:10.29px">Bộ ngẫu nhiên hóa miền</text>
<text x="115.0" y="114.2" font-size="12" fill="#e5e7eb" text-anchor="middle" style="font-size:9.36px">khối lượng, ma sát,</text>
<text x="115.0" y="129.2" font-size="12" fill="#e5e7eb" text-anchor="middle" style="font-size:11.24px">trễ, ánh sáng, camera</text>
<rect x="250" y="75" width="190" height="70" rx="8" fill="#272a2f" stroke="#53b2dd" stroke-width="2"/>
<text x="345.0" y="99.2" font-size="12" fill="#e5e7eb" text-anchor="middle" font-weight="bold">GraspReachEnv</text>
<text x="345.0" y="114.2" font-size="12" fill="#e5e7eb" text-anchor="middle">obs 17, action 4</text>
<text x="345.0" y="129.2" font-size="12" fill="#e5e7eb" text-anchor="middle" style="font-size:9.76px">các số hạng reward + guard</text>
<rect x="490" y="75" width="170" height="70" rx="8" fill="#272a2f" stroke="#9ccd4e" stroke-width="2"/>
<text x="575.0" y="99.2" font-size="12" fill="#e5e7eb" text-anchor="middle" font-weight="bold">PPO  /  BC</text>
<text x="575.0" y="114.2" font-size="12" fill="#e5e7eb" text-anchor="middle">seed 0-4,</text>
<text x="575.0" y="129.2" font-size="12" fill="#e5e7eb" text-anchor="middle">quét demo 50-500</text>
<rect x="710" y="75" width="160" height="70" rx="8" fill="#272a2f" stroke="#c095eb" stroke-width="2"/>
<text x="790.0" y="99.2" font-size="12" fill="#e5e7eb" text-anchor="middle" font-weight="bold">File policy</text>
<text x="790.0" y="114.2" font-size="12" fill="#e5e7eb" text-anchor="middle" style="font-size:9.51px">+ metadata lần chạy</text>
<text x="790.0" y="129.2" font-size="12" fill="#e5e7eb" text-anchor="middle" style="font-size:10.28px">(bước, thời gian thực)</text>
<line x1="200" y1="110" x2="250" y2="110" stroke="#e5e7eb" stroke-width="2"/>
<polygon points="250,110 241.0,113.5 241.0,106.5" fill="#e5e7eb"/>
<line x1="440" y1="110" x2="490" y2="110" stroke="#e5e7eb" stroke-width="2"/>
<polygon points="490,110 481.0,113.5 481.0,106.5" fill="#e5e7eb"/>
<line x1="660" y1="110" x2="710" y2="110" stroke="#e5e7eb" stroke-width="2"/>
<polygon points="710,110 701.0,113.5 701.0,106.5" fill="#e5e7eb"/>
<line x1="575" y1="145" x2="575" y2="185" stroke="#e5e7eb" stroke-width="2" stroke-dasharray="5 4"/>
<polygon points="575,185 571.5,176.0 578.5,176.0" fill="#e5e7eb"/>
<text x="660" y="172" font-size="11" fill="#a0a4ab" text-anchor="start" style="font-size:9.04px">đường cong reward, loss</text>
<rect x="490" y="185" width="170" height="50" rx="8" fill="#272a2f" stroke="#a0a4ab" stroke-width="2"/>
<text x="575.0" y="206.8" font-size="11" fill="#e5e7eb" text-anchor="middle" font-weight="bold">Đường cong học</text>
<text x="575.0" y="220.8" font-size="11" fill="#e5e7eb" text-anchor="middle" style="font-size:8.58px">theo từng seed, không chọn tốt nhất</text>
<text x="30" y="278" font-size="13" fill="#e58484" text-anchor="start" font-weight="bold" style="font-size:12.64px">ĐÁNH GIÁ  (seed &gt;= 1000, chưa từng huấn luyện)</text>
<rect x="30" y="292" width="190" height="70" rx="8" fill="#272a2f" stroke="#53b2dd" stroke-width="2"/>
<text x="125.0" y="316.2" font-size="12" fill="#e5e7eb" text-anchor="middle" font-weight="bold" style="font-size:9.36px">Phân chia danh định</text>
<text x="125.0" y="331.2" font-size="12" fill="#e5e7eb" text-anchor="middle">5 seed x 100 episode</text>
<text x="125.0" y="346.2" font-size="12" fill="#e5e7eb" text-anchor="middle">mean + CI bootstrap</text>
<rect x="260" y="292" width="200" height="70" rx="8" fill="#272a2f" stroke="#d3952d" stroke-width="2"/>
<text x="360.0" y="316.2" font-size="12" fill="#e5e7eb" text-anchor="middle" font-weight="bold">Nhiễu loạn giữ lại</text>
<text x="360.0" y="331.2" font-size="12" fill="#e5e7eb" text-anchor="middle" style="font-size:10.61px">khối lượng +-30%, ma sát +-40%</text>
<text x="360.0" y="346.2" font-size="12" fill="#e5e7eb" text-anchor="middle" style="font-size:11.63px">+40 ms trễ hành động</text>
<rect x="500" y="292" width="170" height="70" rx="8" fill="#272a2f" stroke="#e58484" stroke-width="2"/>
<text x="585.0" y="316.2" font-size="12" fill="#e5e7eb" text-anchor="middle" font-weight="bold">Cận Wilson</text>
<text x="585.0" y="331.2" font-size="12" fill="#e5e7eb" text-anchor="middle" style="font-size:9.36px">DR so với không DR,</text>
<text x="585.0" y="346.2" font-size="12" fill="#e5e7eb" text-anchor="middle" style="font-size:9.97px">học được so với viết tay</text>
<rect x="710" y="292" width="160" height="70" rx="8" fill="#272a2f" stroke="#c095eb" stroke-width="2"/>
<text x="790.0" y="316.2" font-size="12" fill="#e5e7eb" text-anchor="middle" font-weight="bold">runs/cap06/*.json</text>
<text x="790.0" y="331.2" font-size="12" fill="#e5e7eb" text-anchor="middle">summary, episodes,</text>
<text x="790.0" y="346.2" font-size="12" fill="#e5e7eb" text-anchor="middle">bc_summary, meta</text>
<line x1="220" y1="327" x2="260" y2="327" stroke="#e5e7eb" stroke-width="2"/>
<polygon points="260,327 251.0,330.5 251.0,323.5" fill="#e5e7eb"/>
<line x1="460" y1="327" x2="500" y2="327" stroke="#e5e7eb" stroke-width="2"/>
<polygon points="500,327 491.0,330.5 491.0,323.5" fill="#e5e7eb"/>
<line x1="670" y1="327" x2="710" y2="327" stroke="#e5e7eb" stroke-width="2"/>
<polygon points="710,327 701.0,330.5 701.0,323.5" fill="#e5e7eb"/>
<line x1="790" y1="145" x2="790" y2="292" stroke="#e5e7eb" stroke-width="2" stroke-dasharray="5 4"/>
<polygon points="790,292 786.5,283.0 793.5,283.0" fill="#e5e7eb"/>
<text x="796" y="225" font-size="11" fill="#a0a4ab" text-anchor="start">nạp policy</text>
<rect x="30" y="395" width="420" height="55" rx="8" fill="#272a2f" stroke="#9ccd4e" stroke-width="2"/>
<text x="240.0" y="419.4" font-size="11" fill="#e5e7eb" text-anchor="middle" font-weight="bold">GraspSkill.attempt(goal, obs) -&gt; GraspResult</text>
<text x="240.0" y="433.4" font-size="11" fill="#e5e7eb" text-anchor="middle" style="font-size:9.89px"> kỹ năng viết tay (CAP05) và học được có thể thay thế nhau</text>
<rect x="490" y="395" width="380" height="55" rx="8" fill="#272a2f" stroke="#e58484" stroke-width="2"/>
<text x="680.0" y="419.4" font-size="11" fill="#e5e7eb" text-anchor="middle" font-weight="bold" style="font-size:10.24px">Lớp an toàn: kẹp action, guard không gian làm việc</text>
<text x="680.0" y="433.4" font-size="11" fill="#e5e7eb" text-anchor="middle" style="font-size:10.74px">0 vi phạm giới hạn khớp / bàn trong mọi episode</text>
</svg>
