<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 590" font-family="Inter, sans-serif">
<title>Tương thích QoS: mức đưa ra phải mạnh ít nhất bằng mức yêu cầu</title>
<desc>Hai ma trận 2 nhân 2 cho reliability và durability, hàng là mức publisher đưa ra, cột là mức subscription yêu cầu; best-effort đưa ra với reliable yêu cầu và volatile đưa ra với transient-local yêu cầu là các ô lỗi. Một trục số cho thấy deadline đưa ra 0.2 s không đạt yêu cầu 0.1 s còn 0.04 s thì đạt.</desc>
<defs><marker id="s03m3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs>
<rect width="900" height="590" rx="14" fill="#17181b"/>
<text x="32" y="44" font-size="22" fill="#e9e7e3" font-weight="bold" text-anchor="start">Tương thích QoS: mức đưa ra phải mạnh ít nhất bằng mức yêu cầu</text>
<rect x="32" y="64" width="406" height="272" rx="10" fill="#22252a"/>
