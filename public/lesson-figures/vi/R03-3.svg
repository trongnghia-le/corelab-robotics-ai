<text x="146.6" y="466.3" font-size="15" fill="#ae9ce6" text-anchor="end" font-weight="600">trục ω</text>
<text x="451.9" y="285.9" font-size="15" fill="#86abe2" text-anchor="start" font-weight="600">p = (3, 1, 2)</text>
<text x="268.7" y="144.6" font-size="15" fill="#6fc693" text-anchor="middle" font-weight="600">p′ = Rp</text>
<text x="227" y="371.7" font-size="15" fill="#ae9ce6" text-anchor="end" font-weight="600">p∥</text>
<text x="371.1" y="287.5" font-size="15" fill="#a7adb5" text-anchor="start" font-weight="600">p⊥</text>
<text x="324.8" y="255.7" font-size="15" fill="#e0c169" text-anchor="start" font-weight="600">θ = 70°</text>
<text x="412" y="215.7" font-size="15" fill="#e08db5" text-anchor="start" font-weight="600">ω×p</text>
<text x="343" y="451.3" font-size="15" fill="#a7adb5" text-anchor="middle" font-weight="normal">đường tròn bán kính</text>
<text x="343" y="471.3" font-size="15" fill="#a7adb5" text-anchor="middle" font-weight="normal">|p⊥| = 2,236</text>
<text x="616" y="132" font-size="15" fill="#e9e7e3" text-anchor="start" font-weight="600">p′ = p∥ + cos θ p⊥ + sin θ ω×p</text>
<line x1="616" y1="148" x2="848" y2="148" stroke="#3d4148" stroke-width="1.5" stroke-linecap="round"/>
<text x="616" y="178" font-size="15" fill="#e9e7e3" text-anchor="start" font-weight="normal">ω = (2, −1, 2)/3</text>
<text x="616" y="210" font-size="15" fill="#e9e7e3" text-anchor="start" font-weight="normal">p∥ = (2,000; −1,000; 2,000)</text>
<text x="616" y="242" font-size="15" fill="#e9e7e3" text-anchor="start" font-weight="normal">p⊥ = (1,000; 2,000; 0,000)</text>
<text x="616" y="274" font-size="15" fill="#e9e7e3" text-anchor="start" font-weight="normal">cos θ · p⊥ = (0,342; 0,684; 0,000)</text>
<text x="616" y="306" font-size="15" fill="#e9e7e3" text-anchor="start" font-weight="normal">sin θ · ω×p = (−1,253; 0,626; 1,566)</text>
<text x="616" y="338" font-size="15" fill="#e9e7e3" text-anchor="start" font-weight="600">p′ = (1,089; 0,311; 3,566)</text>
<text x="616" y="370" font-size="15" fill="#e9e7e3" text-anchor="start" font-weight="normal">|p′| = |p| = 3,742</text>
