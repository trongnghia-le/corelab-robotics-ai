<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="Inter, sans-serif">
<title>Công thức Rodrigues: tách p, quay phần vuông góc</title>
<desc>Quay p = (3, 1, 2) quanh trục đơn vị (2, -1, 2)/3 một góc 70 độ cho p' = (1,089; 0,311; 3,566). p tách thành phần dọc trục và phần vuông góc quay trên một đường tròn.</desc>
<defs><marker id="R03caae9ce6" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 z" fill="#ae9ce6"/></marker><marker id="R03ca86abe2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 z" fill="#86abe2"/></marker><marker id="R03ca6fc693" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 z" fill="#6fc693"/></marker><marker id="R03cae08db5" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 z" fill="#e08db5"/></marker></defs>
