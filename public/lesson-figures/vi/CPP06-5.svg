<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="Inter, sans-serif">
<title>SFINAE: ứng viên thất bại khi thay thế sẽ biến mất</title>
<desc>Bốn lời gọi to_text so với hai overload, một trả về decltype(std::to_string(x)) và một decltype(x.name()): với mỗi lời gọi, mỗi ứng viên hoặc khả dụng hoặc bị loại, và kết quả là một giá trị hoặc lỗi biên dịch khi không còn ứng viên.</desc>
<defs><marker id="b5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a7adb5"/></marker></defs>
<rect width="900" height="500" rx="14" fill="#17181b"/>
<text x="32" y="44" font-size="22" font-weight="bold" fill="#e9e7e3">SFINAE: ứng viên thất bại khi thay thế sẽ biến mất</text>
<rect x="32" y="64" width="836" height="404" rx="10" fill="#22252a"/>
