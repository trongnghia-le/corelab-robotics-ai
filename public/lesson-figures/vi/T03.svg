<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="Inter, Arial, sans-serif" font-size="14">
<rect width="800" height="400" fill="#191b1f" rx="12"/>
<text x="200" y="30" fill="#e5e7eb" font-size="16" text-anchor="middle">launch.json cố định môi trường</text>
<text x="600" y="30" fill="#e5e7eb" font-size="16" text-anchor="middle" style="font-size:15.19px">Cùng đường dẫn, cwd khác</text>
<rect x="30" y="60" width="340" height="42" rx="8" fill="#53b2dd" fill-opacity="0.13" stroke="#53b2dd" stroke-width="2"/><text x="44" y="86" fill="#53b2dd" font-size="14">program</text><text x="115" y="86" fill="#e5e7eb" font-size="13">${workspaceFolder}/sumsq.py</text>
<rect x="30" y="112" width="340" height="42" rx="8" fill="#9ccd4e" fill-opacity="0.13" stroke="#9ccd4e" stroke-width="2"/><text x="44" y="138" fill="#9ccd4e" font-size="14">args</text><text x="115" y="138" fill="#e5e7eb" font-size="13" style="font-size:12.42px">[ ]  (danh sách chuỗi)</text>
<rect x="30" y="164" width="340" height="42" rx="8" fill="#9ccd4e" fill-opacity="0.13" stroke="#9ccd4e" stroke-width="2"/><text x="44" y="190" fill="#9ccd4e" font-size="14">env</text><text x="115" y="190" fill="#e5e7eb" font-size="13">{ "PYTHONHASHSEED": "0" }</text>
<rect x="30" y="216" width="340" height="42" rx="8" fill="#d97936" fill-opacity="0.13" stroke="#d97936" stroke-width="2"/><text x="44" y="242" fill="#d97936" font-size="14">cwd</text><text x="115" y="242" fill="#e5e7eb" font-size="13">${workspaceFolder}</text>
<path d="M200 268 v26" stroke="#e5e7eb" stroke-width="2"/><path d="M194 288 l6 8 l6 -8" fill="none" stroke="#e5e7eb" stroke-width="2"/>
<rect x="60" y="298" width="280" height="40" rx="8" fill="#d97936" fill-opacity="0.15" stroke="#d97936" stroke-width="2"/><text x="200.0" y="323.0" fill="#e5e7eb" font-size="14" text-anchor="middle">phiên debug (F5): dừng ở breakpoint</text>
<text x="200" y="364" fill="#e5e7eb" font-size="13" text-anchor="middle">panel: variables · watch · call stack · console</text>
<text x="200" y="384" fill="#e5e7eb" font-size="13" text-anchor="middle" style="font-size:10.29px">F5 tiếp tục · F10 bước qua · F11 bước vào · ⇧F11 bước ra</text>
<text x="600" y="62" fill="#e5e7eb" font-size="13" text-anchor="middle">script gọi open("data/input.csv")</text>
<rect x="430" y="80" width="340" height="40" rx="8" fill="#9ccd4e" fill-opacity="0.15" stroke="#9ccd4e" stroke-width="2"/><text x="600.0" y="105.0" fill="#e5e7eb" font-size="13" text-anchor="middle">/home/u/proj/exp/data/input.csv  (có)</text>
<rect x="430" y="200" width="340" height="40" rx="8" fill="#d97936" fill-opacity="0.15" stroke="#d97936" stroke-width="2"/><text x="600.0" y="225.0" fill="#e5e7eb" font-size="13" text-anchor="middle">/home/u/proj/data/input.csv  (không có)</text>
<text x="600" y="150" fill="#9ccd4e" font-size="13" text-anchor="middle">cwd = /home/u/proj/exp  →  thấy</text>
<text x="600" y="270" fill="#d97936" font-size="13" text-anchor="middle">cwd = /home/u/proj  →  FileNotFoundError</text>
<text x="600" y="320" fill="#e5e7eb" font-size="13" text-anchor="middle" style="font-size:11.8px">cách sửa: Path(__file__).parent / "data/input.csv"</text><text x="600" y="342" fill="#e5e7eb" font-size="13" text-anchor="middle">hoặc đặt "cwd": "${fileDirname}" và ghi chú lại</text>
<text x="600" y="372" fill="#e5e7eb" font-size="13" text-anchor="middle">bisect n bước: ⌈log₂ n⌉ lần thử (10⁶ → 20)</text></svg>