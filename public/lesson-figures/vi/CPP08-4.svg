<text x="32" y="428" font-size="14" fill="#a7adb5">Ô nét đứt màu hổ phách = lần đọc thừa của k &lt;= w. Cửa sổ i = 3 đọc v[5]: ASan báo lỗi; số 4.5 in ra đúng chỉ do may.</text>
