<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" font-family="Inter, sans-serif">
<title>Trường hợp 1: mỗi cửa sổ đọc những phần tử nào</title>
<desc>Vector {1,2,3,4,5}, cửa sổ 2, vòng lặp k &lt;= w: mỗi cửa sổ đọc ba phần tử và cửa sổ cuối đọc chỉ số 5.</desc>
<rect width="900" height="460" rx="14" fill="#17181b"/>
<defs><marker id="ahh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#a7adb5"/></marker></defs>
<text x="32" y="44" font-size="22" font-weight="700" fill="#e9e7e3">Trường hợp 1: mỗi cửa sổ đọc những phần tử nào</text>
