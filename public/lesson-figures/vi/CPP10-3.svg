<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="Inter, sans-serif">
<title>Store buffering: (r1, r2) = (0, 0) xảy ra thế nào</title>
<desc>Dòng thời gian của phép thử store buffering với x = y = 0. Store của mỗi thread nằm chờ trong store buffer riêng, nên cả hai load đều đọc giá trị cũ 0 từ bộ nhớ. Bản relaxed cho kết quả này 2 lần trong 200,000 lần chạy, bản seq_cst không bao giờ.</desc>
<defs><marker id="arc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a7adb5"/></marker></defs>
<rect width="900" height="500" rx="14" fill="#17181b"/>
<text x="32" y="44" font-size="22" fill="#e9e7e3" text-anchor="start" font-weight="bold">Store buffering: (r1, r2) = (0, 0) xảy ra thế nào</text>
<text x="120" y="92" font-size="15" fill="#a7adb5" text-anchor="start" font-weight="600">1: các store được phát</text>
<text x="330" y="92" font-size="15" fill="#a7adb5" text-anchor="start" font-weight="600">2: các load chạy</text>
<text x="540" y="92" font-size="15" fill="#a7adb5" text-anchor="start" font-weight="600">3: buffer xả ra</text>
<line x1="110" y1="100" x2="110" y2="410" stroke="#2c3036" stroke-width="1" stroke-linecap="round"/>
<line x1="320" y1="100" x2="320" y2="410" stroke="#2c3036" stroke-width="1" stroke-linecap="round"/>
<line x1="530" y1="100" x2="530" y2="410" stroke="#2c3036" stroke-width="1" stroke-linecap="round"/>
<text x="32" y="152" font-size="15" fill="#86abe2" text-anchor="start" font-weight="600">thread 1</text>
<text x="32" y="252" font-size="15" fill="#6fc693" text-anchor="start" font-weight="600">thread 2</text>
<rect x="120" y="128" width="180" height="44" rx="6" fill="none" stroke="#86abe2" stroke-width="2"/>
<text x="210" y="156" font-size="15" fill="#e9e7e3" text-anchor="middle">x.store(1)</text>
<rect x="330" y="128" width="180" height="44" rx="6" fill="none" stroke="#86abe2" stroke-width="2"/>
<text x="420" y="156" font-size="15" fill="#e9e7e3" text-anchor="middle">r1 = y.load()</text>
<rect x="120" y="228" width="180" height="44" rx="6" fill="none" stroke="#6fc693" stroke-width="2"/>
<text x="210" y="256" font-size="15" fill="#e9e7e3" text-anchor="middle">y.store(1)</text>
<rect x="330" y="228" width="180" height="44" rx="6" fill="none" stroke="#6fc693" stroke-width="2"/>
<text x="420" y="256" font-size="15" fill="#e9e7e3" text-anchor="middle">r2 = x.load()</text>
<text x="420" y="196" font-size="15" fill="#86abe2" text-anchor="middle" font-weight="600">đọc y = 0</text>
<text x="420" y="296" font-size="15" fill="#6fc693" text-anchor="middle" font-weight="600">đọc x = 0</text>
<text x="210" y="196" font-size="14" fill="#a7adb5" text-anchor="middle">chờ trong buffer</text>
<text x="210" y="296" font-size="14" fill="#a7adb5" text-anchor="middle">chờ trong buffer</text>
<text x="630" y="160" font-size="15" fill="#86abe2" text-anchor="middle">x = 1 trở nên thấy được</text>
<text x="630" y="260" font-size="15" fill="#6fc693" text-anchor="middle">y = 1 trở nên thấy được</text>
<rect x="32" y="348" width="836" height="56" rx="8" fill="#22252a" stroke="none" stroke-width="1.5"/>
<text x="48" y="383" font-size="15" fill="#e9e7e3" text-anchor="start" font-weight="600">bộ nhớ mà các load nhìn thấy:</text>
<text x="330" y="383" font-size="15" fill="#e0c169" text-anchor="start">x = 0, y = 0</text>
<text x="560" y="383" font-size="15" fill="#a7adb5" text-anchor="start">sau đó x = 1, y = 1</text>
<text x="32" y="442" font-size="15" fill="#e58a80" text-anchor="start" font-weight="600">relaxed: thấy (0, 0) trong 2 trên 200,000 lần chạy (Ví dụ, x86-64)</text>
<text x="32" y="468" font-size="15" fill="#6fc693" text-anchor="start" font-weight="600">seq_cst: cả bốn thao tác trong một thứ tự toàn phần, nên (0, 0) bất khả: 0 trên 200,000</text>
</svg>
