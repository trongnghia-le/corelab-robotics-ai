<text x="282" y="360" font-size="15" fill="#6fc693" font-weight="600">l₂ = 1 m</text>
<text x="112" y="368" font-size="15" fill="#a7adb5">r₁ = √2 m</text>
<text x="48" y="510" font-size="14" fill="#a7adb5">cột tính bằng m/s trên rad/s</text>
<text x="492" y="98" font-size="17" fill="#e9e7e3" font-weight="700">Tư thế thường q = (0, π/2)</text>
