<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="Inter, sans-serif">
<title>Mỗi cột Jacobian là vận tốc đầu mút do một khớp tạo ra</title>
<desc>Tay máy 2R khâu đơn vị tại q=(0, pi/2): cột J1=(-1,1) tiếp tuyến với đường tròn quanh đế, cột J2=(-1,0) tiếp tuyến với đường tròn quanh khuỷu. Bên phải: hai cột căng cả mặt phẳng ở tư thế này và song song tại q=(0,0).</desc>
