<text x="622" y="257" font-size="15" fill="#e08db5" font-weight="600" text-anchor="end">J₂</text>
<text x="594" y="197" font-size="15" fill="#e0c169" font-weight="600" text-anchor="end">v</text>
<text x="492" y="272" font-size="14" fill="#a7adb5">q̇ = (0.6, 0.8) rad/s → v = (−1.4, 0.6) m/s</text>
<text x="492" y="336" font-size="17" fill="#e9e7e3" font-weight="700">Tư thế kỳ dị q = (0, 0)</text>
<line x1="790.0" y1="470.0" x2="790.0" y2="370.0" stroke="#e0904f" stroke-width="3" stroke-linecap="round" marker-end="url(#R061vi-e0904f)"/>
<line x1="790.0" y1="470.0" x2="790.0" y2="420.0" stroke="#e08db5" stroke-width="3" stroke-linecap="round" marker-end="url(#R061vi-e08db5)"/>
<circle cx="790.0" cy="470.0" r="4.0" fill="#e9e7e3" stroke="#e9e7e3" stroke-width="1"/>
<text x="778" y="374" font-size="15" fill="#e0904f" font-weight="600" text-anchor="end">J₁ = (0, 2)</text>
<text x="778" y="424" font-size="15" fill="#e08db5" font-weight="600" text-anchor="end">J₂ = (0, 1)</text>
<text x="492" y="468" font-size="14" fill="#a7adb5">Hai cột cùng chỉ theo y:</text>
<text x="492" y="488" font-size="14" fill="#a7adb5">không tốc độ khớp nào dời</text>
<text x="492" y="508" font-size="14" fill="#a7adb5">đầu mút theo x, hướng tay.</text>
