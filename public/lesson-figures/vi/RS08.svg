<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420">
<rect width="760" height="420" fill="#191b1f" rx="12"/>
<g font-family="Inter, Arial, sans-serif" fill="#e5e7eb" font-size="14">
<text x="380" y="28" text-anchor="middle" font-size="16" font-weight="bold">Tìm, sàng lọc, rồi so sánh</text>
<rect x="20" y="50" width="270" height="52" rx="8" fill="none" stroke="#53b2dd" stroke-width="2"/>
<text x="155" y="73" text-anchor="middle">Tìm được: 120 bản ghi</text>
<text x="155" y="92" text-anchor="middle" font-size="13" style="font-size:11.11px">2 cơ sở dữ liệu</text>
<rect x="20" y="130" width="270" height="52" rx="8" fill="none" stroke="#53b2dd" stroke-width="2"/>
<text x="155" y="153" text-anchor="middle">Sau khử trùng: 90</text>
<rect x="20" y="210" width="270" height="52" rx="8" fill="none" stroke="#53b2dd" stroke-width="2"/>
<text x="155" y="233" text-anchor="middle">Sau sàng tiêu đề/tóm tắt: 28</text>
<rect x="20" y="290" width="270" height="52" rx="8" fill="none" stroke="#53b2dd" stroke-width="2"/>
<text x="155" y="313" text-anchor="middle" style="font-size:13.18px">Giữ lại sau đọc toàn văn: 8</text>
<line x1="155" y1="102" x2="155" y2="128" stroke="#e5e7eb" stroke-width="2"/><polygon points="155,130 150,120 160,120" fill="#e5e7eb"/>
<line x1="155" y1="182" x2="155" y2="208" stroke="#e5e7eb" stroke-width="2"/><polygon points="155,210 150,200 160,200" fill="#e5e7eb"/>
<line x1="155" y1="262" x2="155" y2="288" stroke="#e5e7eb" stroke-width="2"/><polygon points="155,290 150,280 160,280" fill="#e5e7eb"/>
<text x="170" y="115" font-size="13" fill="#d97936">-30 trùng</text>
<text x="170" y="195" font-size="13" fill="#d97936">-62 lạc đề hoặc cũ</text>
<text x="170" y="275" font-size="13" fill="#d97936" style="font-size:10.14px">-20 không đạt quy tắc</text>
<text x="155" y="370" text-anchor="middle" font-size="13">Quy tắc lựa chọn viết trước khi sàng lọc</text>
<text x="585" y="62" text-anchor="middle" font-weight="bold">Ma trận so sánh (8 bài)</text>
<text x="535" y="100" text-anchor="middle" font-size="13">tĩnh</text><text x="650" y="100" text-anchor="middle" font-size="13">động</text>
<text x="420" y="150" text-anchor="end" font-size="13">map landmark</text>
<rect x="480" y="112" width="100" height="56" rx="6" fill="#53b2dd" fill-opacity="0.25" stroke="#53b2dd"/>
<text x="530" y="146" text-anchor="middle">3 bài</text>
<rect x="595" y="112" width="100" height="56" rx="6" fill="none" stroke="#d97936" stroke-width="2" stroke-dasharray="6 4"/>
<text x="645" y="146" text-anchor="middle" fill="#d97936" style="font-size:10.92px">khoảng trống?</text>
<text x="420" y="220" text-anchor="end" font-size="13">pose graph</text>
<rect x="480" y="182" width="100" height="56" rx="6" fill="#53b2dd" fill-opacity="0.25" stroke="#53b2dd"/>
<text x="530" y="216" text-anchor="middle">4 bài</text>
<rect x="595" y="182" width="100" height="56" rx="6" fill="none" stroke="#d97936" stroke-width="2" stroke-dasharray="6 4"/>
<text x="645" y="216" text-anchor="middle" fill="#d97936" style="font-size:10.92px">khoảng trống?</text>
<text x="420" y="290" text-anchor="end" font-size="13">grid map</text>
<rect x="480" y="252" width="100" height="56" rx="6" fill="none" stroke="#d97936" stroke-width="2" stroke-dasharray="6 4"/>
<text x="530" y="286" text-anchor="middle" fill="#d97936" style="font-size:10.92px">khoảng trống?</text>
<rect x="595" y="252" width="100" height="56" rx="6" fill="#53b2dd" fill-opacity="0.25" stroke="#53b2dd"/>
<text x="645" y="286" text-anchor="middle">1 bài</text>
<text x="585" y="345" text-anchor="middle" font-size="13">Ô trống là khoảng trống tiềm năng: kiểm tra xem</text>
<text x="585" y="365" text-anchor="middle" font-size="13">có phải chỉ do tìm sót trước khi khẳng định.</text>
</g></svg>