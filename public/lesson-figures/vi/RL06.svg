<text x="34" y="196" font-size="14" fill="#e5e7eb">S</text><text x="436" y="196" font-size="14" fill="#e5e7eb">G</text>
<polyline points="48,190 48,172 66,172 425,172 442,172 442,190" fill="none" stroke="#53b2dd" stroke-width="4"/>
<polyline points="48,190 48,80 442,80 442,190" fill="none" stroke="#9ccd4e" stroke-width="4"/>
<text x="100" y="164" font-size="14" fill="#53b2dd">Q-learning: 13 bước, dọc mép</text>
