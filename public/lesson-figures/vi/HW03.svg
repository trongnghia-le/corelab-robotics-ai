<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 410" font-family="Inter, Arial, sans-serif">
<title>Cây nguồn của robot</title>
<desc>Pin qua cầu chì đến contactor E-stop, rồi motor driver và bộ buck cấp ray logic, tất cả hồi về một điểm mass hình sao, kèm hình nhỏ cho thấy điện áp pin sụt dưới ngưỡng lúc động cơ khởi động.</desc>
<rect width="760" height="410" fill="#191b1f" rx="12"/>
<text x="380" y="28" font-size="17" fill="#e5e7eb" text-anchor="middle" font-weight="bold" style="font-size:16.9px">Cây nguồn: bảo vệ, ngắt, chuyển đổi, chung một mass</text>
<rect x="16" y="50" width="110" height="60" rx="8" fill="#272a2f" stroke="#53b2dd" stroke-width="2"/>
<text x="71.0" y="68.0" font-size="12" fill="#e5e7eb" text-anchor="middle" font-weight="bold">Pin 3S</text>
<text x="71.0" y="84.0" font-size="12" fill="#e5e7eb" text-anchor="middle" style="font-size:11.21px">danh định 11.1 V</text>
<text x="71.0" y="100.0" font-size="12" fill="#e5e7eb" text-anchor="middle" style="font-size:11.83px">đầy 12.6 V</text>
<rect x="156" y="50" width="90" height="60" rx="8" fill="#272a2f" stroke="#d97936" stroke-width="2"/>
<text x="201.0" y="68.0" font-size="12" fill="#e5e7eb" text-anchor="middle" font-weight="bold" style="font-size:9.99px">Cầu chì 10 A</text>
<text x="201.0" y="84.0" font-size="12" fill="#e5e7eb" text-anchor="middle">bảo vệ</text>
<text x="201.0" y="100.0" font-size="12" fill="#e5e7eb" text-anchor="middle">dây</text>
<rect x="276" y="50" width="130" height="60" rx="8" fill="#272a2f" stroke="#d97936" stroke-width="2"/>
<text x="341.0" y="68.0" font-size="12" fill="#e5e7eb" text-anchor="middle" font-weight="bold">Contactor E-stop</text>
<text x="341.0" y="84.0" font-size="12" fill="#e5e7eb" text-anchor="middle">thường đóng,</text>
<text x="341.0" y="100.0" font-size="12" fill="#e5e7eb" text-anchor="middle" style="font-size:11.52px">chuỗi nối tiếp</text>
<line x1="126" y1="80" x2="156" y2="80" stroke="#e5e7eb" stroke-width="2"/>
<polygon points="156.0,80.0 147.0,76.0 147.0,84.0" fill="#e5e7eb"/>
<line x1="246" y1="80" x2="276" y2="80" stroke="#e5e7eb" stroke-width="2"/>
<polygon points="276.0,80.0 267.0,76.0 267.0,84.0" fill="#e5e7eb"/>
<line x1="341" y1="110" x2="341" y2="150" stroke="#e5e7eb" stroke-width="2"/>
<line x1="250" y1="150" x2="470" y2="150" stroke="#e5e7eb" stroke-width="2"/>
<text x="180" y="154" font-size="11" fill="#e5e7eb" text-anchor="middle">bus 12 V</text>
<line x1="260" y1="150" x2="260" y2="182" stroke="#e5e7eb" stroke-width="2"/>
<polygon points="260.0,182.0 264.0,173.0 256.0,173.0" fill="#e5e7eb"/>
<line x1="450" y1="150" x2="450" y2="182" stroke="#e5e7eb" stroke-width="2"/>
<polygon points="450.0,182.0 454.0,173.0 446.0,173.0" fill="#e5e7eb"/>
<rect x="190" y="182" width="140" height="62" rx="8" fill="#272a2f" stroke="#53b2dd" stroke-width="2"/>
<text x="260.0" y="201.0" font-size="12" fill="#e5e7eb" text-anchor="middle" font-weight="bold">Motor driver</text>
<text x="260.0" y="217.0" font-size="12" fill="#e5e7eb" text-anchor="middle">2 động cơ, kẹt</text>
<text x="260.0" y="233.0" font-size="12" fill="#e5e7eb" text-anchor="middle" style="font-size:10.48px">1.8 A mỗi cái</text>
<rect x="380" y="182" width="140" height="62" rx="8" fill="#272a2f" stroke="#9ccd4e" stroke-width="2"/>
<text x="450.0" y="201.0" font-size="12" fill="#e5e7eb" text-anchor="middle" font-weight="bold" style="font-size:10.06px">Buck 12 V xuống 5 V</text>
<text x="450.0" y="217.0" font-size="12" fill="#e5e7eb" text-anchor="middle" style="font-size:11.51px">hiệu suất 90 %</text>
<text x="450.0" y="233.0" font-size="12" fill="#e5e7eb" text-anchor="middle" style="font-size:11.63px">vào 2.3 A ở 25 W</text>
<line x1="520" y1="213" x2="570" y2="213" stroke="#e5e7eb" stroke-width="2"/>
<polygon points="570.0,213.0 561.0,209.0 561.0,217.0" fill="#e5e7eb"/>
<rect x="570" y="182" width="174" height="62" rx="8" fill="#272a2f" stroke="#9ccd4e" stroke-width="2"/>
<text x="657.0" y="201.0" font-size="12" fill="#e5e7eb" text-anchor="middle" font-weight="bold">Ray logic 5 V</text>
<text x="657.0" y="217.0" font-size="12" fill="#e5e7eb" text-anchor="middle" style="font-size:11.87px">Pi, MCU, cảm biến</text>
<text x="657.0" y="233.0" font-size="12" fill="#e5e7eb" text-anchor="middle">tới 5 A</text>
<text x="450" y="268" font-size="11" fill="#d97936" text-anchor="middle">Bộ điều áp tuyến tính ở đây sẽ tỏa (12 - 5) V x 5 A = 35 W</text>
<line x1="40" y1="320" x2="720" y2="320" stroke="#e5e7eb" stroke-width="3"/>
<line x1="71" y1="110" x2="71" y2="320" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="4 3"/>
<line x1="260" y1="244" x2="260" y2="320" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="4 3"/>
<line x1="450" y1="244" x2="450" y2="320" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="4 3"/>
<line x1="657" y1="244" x2="657" y2="320" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="4 3"/>
<circle cx="71" cy="320" r="6" fill="#d97936"/>
<text x="71" y="342" font-size="11" fill="#d97936" text-anchor="middle">điểm sao</text>
<text x="400" y="342" font-size="12" fill="#e5e7eb" text-anchor="middle">Mọi dây hồi về điểm sao gần pin</text>
<text x="380" y="378" font-size="12" fill="#e5e7eb" text-anchor="middle">Cầu chì bảo vệ dây, contactor cắt nguồn, buck tạo 5 V, một mốc mass</text>
<rect x="440" y="44" width="304" height="86" rx="8" fill="#272a2f" stroke="#e5e7eb" stroke-width="1"/>
<text x="592" y="60" font-size="11" fill="#e5e7eb" text-anchor="middle" font-weight="bold">Điện áp cực pin lúc động cơ khởi động</text>
<line x1="460" y1="76" x2="460" y2="122" stroke="#e5e7eb" stroke-width="1"/>
<line x1="460" y1="122" x2="730" y2="122" stroke="#e5e7eb" stroke-width="1"/>
<line x1="460" y1="104" x2="730" y2="104" stroke="#d97936" stroke-width="1" stroke-dasharray="5 4"/>
<text x="732" y="102" font-size="10" fill="#d97936" text-anchor="end">10 V</text>
<polyline points="462,84 540,85 556,116 574,90 600,87 726,88" fill="none" stroke="#53b2dd" stroke-width="2"/>
<text x="556" y="76" font-size="10" fill="#53b2dd" text-anchor="middle" style="font-size:7.8px">sụt áp</text>
</svg>
