<circle cx="117" cy="330" r="4" fill="#e9e7e3"/>
<text x="117" y="214.6" font-size="15" fill="#e0c169" text-anchor="middle" font-weight="600">trục yaw z</text>
<text x="218.7" y="405.3" font-size="15" fill="#e08db5" text-anchor="start" font-weight="600">trục roll x_b</text>
