<text x="496" y="100" font-size="17" fill="#e9e7e3" text-anchor="start" font-weight="bold">Tốc độ yaw trên mỗi đơn vị tốc độ thân</text>
<text x="496" y="124" font-size="14" fill="#a7adb5" text-anchor="start" font-weight="normal">ψ̇ = (sin φ ω_y + cos φ ω_z) / cos θ, nên |ψ̇| ≤ |ω| / cos θ</text>
