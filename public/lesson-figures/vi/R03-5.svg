<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" font-family="Inter, sans-serif">
<title>Khóa gimbal: trục roll gập vào trục yaw</title>
<desc>Với góc Z-Y-X, trục roll x_b nằm dọc -z khi pitch bằng 90 độ, nên yaw và roll quay khung quanh cùng một đường. Tốc độ yaw cần cho mỗi đơn vị tốc độ thân là 1/cos(pitch).</desc>
<defs><marker id="R03eae0c169" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 z" fill="#e0c169"/></marker><marker id="R03eaae9ce6" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 z" fill="#ae9ce6"/></marker><marker id="R03eae08db5" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 z" fill="#e08db5"/></marker></defs>
<rect width="900" height="540" rx="14" fill="#17181b"/>
<text x="32" y="44" font-size="22" fill="#e9e7e3" text-anchor="start" font-weight="bold">Khóa gimbal: trục roll gập vào trục yaw</text>
