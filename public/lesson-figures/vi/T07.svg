<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" font-family="Inter, Arial, sans-serif">
<rect width="720" height="400" fill="#191b1f" rx="12"/>
<text x="24" y="32" fill="#e5e7eb" font-size="16" font-weight="bold">Một request: độ trễ đi đâu</text>
<rect x="40" y="52" width="110" height="36" fill="#d97936"/><text x="95" y="75" fill="#191b1f" font-size="13" text-anchor="middle" style="font-size:11.25px">chờ hàng đợi</text>
<rect x="150" y="52" width="170" height="36" fill="#53b2dd"/><text x="235" y="75" fill="#191b1f" font-size="13" text-anchor="middle" style="font-size:10.24px">CPU làm việc</text>
<rect x="320" y="52" width="250" height="36" fill="#3b414d" stroke="#9ccd4e" stroke-dasharray="5 3"/><text x="445" y="75" fill="#e5e7eb" font-size="13" text-anchor="middle" style="font-size:10.14px">chờ I/O (không phải CPU)</text>
<line x1="40" y1="104" x2="570" y2="104" stroke="#e5e7eb"/><text x="305" y="124" fill="#e5e7eb" font-size="13" text-anchor="middle">độ trễ = wall time (CPU time chỉ là phần xanh)</text>
<text x="590" y="75" fill="#e5e7eb" font-size="13" style="font-size:10.14px">thời gian</text>
<text x="24" y="160" fill="#e5e7eb" font-size="16" font-weight="bold">Nhiều request: phân phối độ trễ</text>
<line x1="60" y1="360" x2="680" y2="360" stroke="#e5e7eb"/><line x1="60" y1="360" x2="60" y2="175" stroke="#e5e7eb"/>
<text x="370" y="388" fill="#e5e7eb" font-size="13" text-anchor="middle">độ trễ (ms)</text>
<text x="20" y="270" fill="#e5e7eb" font-size="13" transform="rotate(-90 20 270)" text-anchor="middle" style="font-size:10.14px">số lượng</text>
<g fill="#53b2dd"><rect x="80" y="320" width="30" height="40"/><rect x="110" y="230" width="30" height="130"/><rect x="140" y="190" width="30" height="170"/><rect x="170" y="240" width="30" height="120"/><rect x="200" y="300" width="30" height="60"/><rect x="230" y="335" width="30" height="25"/><rect x="260" y="350" width="30" height="10"/></g>
<rect x="560" y="352" width="30" height="8" fill="#d97936"/>
<line x1="150" y1="175" x2="150" y2="360" stroke="#9ccd4e" stroke-dasharray="4 3"/><text x="156" y="186" fill="#9ccd4e" font-size="13">trung vị</text>
<line x1="235" y1="205" x2="235" y2="360" stroke="#e5e7eb" stroke-dasharray="4 3"/><text x="241" y="216" fill="#e5e7eb" font-size="13" style="font-size:10.14px">trung bình</text>
<text x="575" y="338" fill="#d97936" font-size="13" text-anchor="middle" style="font-size:12.52px">đuôi P99 / max</text>
<line x1="575" y1="344" x2="575" y2="352" stroke="#d97936"/>
</svg>
