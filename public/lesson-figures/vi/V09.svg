<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" font-family="Inter, Arial, sans-serif" font-size="14">
<rect width="760" height="340" fill="#191b1f" rx="12"/>
<defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#e5e7eb"/></marker></defs>
<text x="20" y="28" fill="#e5e7eb" font-size="16" font-weight="bold">Giao nhau ở frame 3 (vị trí tính px)</text>
