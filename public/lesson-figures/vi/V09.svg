<text x="472" y="94" text-anchor="middle" fill="#e5e7eb">30</text><text x="537" y="94" text-anchor="middle" fill="#d97936" font-weight="bold">2</text>
<text x="472" y="126" text-anchor="middle" fill="#d97936" font-weight="bold">2</text><text x="537" y="126" text-anchor="middle" fill="#e5e7eb">30</text>
