<line x1="665" y1="72" x2="665" y2="136" stroke="#e5e7eb" stroke-opacity="0.6"/><line x1="600" y1="104" x2="730" y2="104" stroke="#e5e7eb" stroke-opacity="0.6"/>
<text x="632" y="94" text-anchor="middle" fill="#9ccd4e" font-weight="bold">0</text><text x="697" y="94" text-anchor="middle" fill="#e5e7eb">30</text>
<text x="632" y="126" text-anchor="middle" fill="#e5e7eb">30</text><text x="697" y="126" text-anchor="middle" fill="#9ccd4e" font-weight="bold">0</text>
<text x="440" y="165" fill="#e5e7eb">hàng: track A, B; cột: det 1, det 2</text>
<text x="440" y="200" fill="#e5e7eb" style="font-size:13.8px">Greedy so với tối ưu: [[1,2],[2,10]]</text>
