<text x="282" y="486" font-size="14" text-anchor="middle" fill="#a7adb5">x₀ = 0.5</text>
<text x="407.289" y="462" font-size="14" font-weight="600" text-anchor="middle" fill="#e0904f">x* = 0.7391</text>
<text x="448.6" y="270" font-size="15" font-weight="600" text-anchor="end" fill="#86abe2">y = cos x</text>
<text x="404.4" y="110.2" font-size="15" text-anchor="end" fill="#a7adb5">y = x</text>
<text x="473.6" y="445" font-size="14" fill="#a7adb5">x</text>
<text x="94" y="78.4" font-size="14" fill="#a7adb5">y</text>
<text x="568" y="104" font-size="17" font-weight="bold" fill="#e9e7e3">Bảng kiểm tra Banach</text>
<polyline points="574.0,141.0 578.0,146.0 587.0,134.0" fill="none" stroke="#6fc693" stroke-width="2.5" stroke-linejoin="round"/>
<text x="600" y="146" font-size="15" fill="#e9e7e3">đầy đủ: [0, 1] là tập đóng</text>
<polyline points="574.0,179.0 578.0,184.0 587.0,172.0" fill="none" stroke="#6fc693" stroke-width="2.5" stroke-linejoin="round"/>
<text x="600" y="184" font-size="15" fill="#e9e7e3">tự ánh xạ: cos[0, 1] = [0.540, 1]</text>
<polyline points="574.0,217.0 578.0,222.0 587.0,210.0" fill="none" stroke="#6fc693" stroke-width="2.5" stroke-linejoin="round"/>
<text x="600" y="222" font-size="15" fill="#e9e7e3">co: |f′| ≤ sin 1 = 0.8415</text>
<text x="568" y="274" font-size="15" fill="#e9e7e3">Vậy: có một điểm bất động x*, và</text>
<text x="568" y="304" font-size="15" font-weight="600" fill="#e0904f">dₙ ≤ Lⁿ/(1−L) · d(x₁, x₀)</text>
<text x="568" y="354" font-size="15" fill="#a7adb5">Bỏ một giả thiết:</text>
<text x="568" y="384" font-size="15" fill="#e9e7e3">x + 1/x trên [1, ∞) có L → 1</text>
<text x="568" y="414" font-size="15" fill="#e9e7e3">và không có điểm bất động.</text>
</svg>
