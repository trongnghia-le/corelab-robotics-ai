<line x1="452.0" y1="440.0" x2="452.0" y2="100.0" stroke="#3d4148" stroke-width="1"/>
<line x1="112.0" y1="100.0" x2="452.0" y2="100.0" stroke="#3d4148" stroke-width="1"/>
<line x1="112.0" y1="440.0" x2="465.6" y2="440.0" stroke="#a7adb5" stroke-width="1.5"/>
