<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="Inter, sans-serif">
<title>Lặp cos trên [0, 1]: ánh xạ co đang hoạt động</title>
<desc>Sơ đồ mạng nhện của x thành cos x xuất phát từ 0.5 và hội tụ về điểm bất động 0.7391, cạnh bảng kiểm tra ba giả thiết Banach với hằng số L = sin 1 = 0.8415 và cận sai số a-priori.</desc>
