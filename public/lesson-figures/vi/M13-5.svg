<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="Inter, sans-serif">
<title>Trường hợp 1: chia đều so với nghiệm tối ưu</title>
<desc>Các thanh ngang cho ba thruster: chia đều 3, 3, 3 vượt cận 2 của thruster 1; nghiệm tối ưu là 2, 3.5, 3.5 với nhân tử 1.5 trên thruster 1.</desc>
<rect width="900" height="500" rx="14" fill="#17181b"/>

<text x="32" y="44" font-size="22" font-weight="bold" fill="#e9e7e3">Trường hợp 1: chia đều so với nghiệm tối ưu</text>
<rect x="32" y="72" width="564" height="404" rx="10" fill="#22252a"/>
<rect x="620" y="72" width="248" height="404" rx="10" fill="#22252a"/>
<text x="52" y="102" font-size="17" font-weight="bold" fill="#e9e7e3">Trường hợp 1: τ = 9, ū = (2, 5, 5)</text>
<text x="640" y="102" font-size="17" font-weight="bold" fill="#e9e7e3">Số liệu Trường hợp 1</text>
<line x1="52" y1="128" x2="86.0" y2="128.0" stroke="#a7adb5" stroke-width="2" stroke-dasharray="5 4"/>
<text x="96" y="133" font-size="15" fill="#e9e7e3">chia đều (3, 3, 3): vi phạm ū₁</text>
<line x1="52" y1="152" x2="86.0" y2="152.0" stroke="#e0904f" stroke-width="10"/>
<text x="96" y="157" font-size="15" fill="#e9e7e3">nghiệm tối ưu (2, 3.5, 3.5)</text>
<text x="52" y="238" font-size="15" font-weight="600" fill="#e9e7e3">Thruster 1</text>
<rect x="150" y="206" width="210" height="16" fill="none" stroke="#a7adb5" stroke-width="2" stroke-dasharray="5 4"/>
<rect x="150" y="230" width="140" height="16" fill="#e0904f"/>
<line x1="290" y1="198" x2="290.0" y2="252.0" stroke="#86abe2" stroke-width="3"/>
<text x="290" y="192" font-size="15" font-weight="600" text-anchor="middle" fill="#86abe2">ū₁ = 2</text>
<text x="368" y="219" font-size="15" fill="#a7adb5">3</text>
<text x="304" y="243" font-size="15" font-weight="600" fill="#e0904f">2</text>
<text x="52" y="310" font-size="15" font-weight="600" fill="#e9e7e3">Thruster 2</text>
<rect x="150" y="278" width="210" height="16" fill="none" stroke="#a7adb5" stroke-width="2" stroke-dasharray="5 4"/>
<rect x="150" y="302" width="245" height="16" fill="#e0904f"/>
<line x1="500" y1="270" x2="500.0" y2="324.0" stroke="#86abe2" stroke-width="3"/>
<text x="500" y="264" font-size="15" font-weight="600" text-anchor="middle" fill="#86abe2">ū₂ = 5</text>
<text x="368" y="291" font-size="15" fill="#a7adb5">3</text>
<text x="403" y="315" font-size="15" font-weight="600" fill="#e0904f">3.5</text>
<text x="52" y="382" font-size="15" font-weight="600" fill="#e9e7e3">Thruster 3</text>
<rect x="150" y="350" width="210" height="16" fill="none" stroke="#a7adb5" stroke-width="2" stroke-dasharray="5 4"/>
<rect x="150" y="374" width="245" height="16" fill="#e0904f"/>
<line x1="500" y1="342" x2="500.0" y2="396.0" stroke="#86abe2" stroke-width="3"/>
<text x="500" y="336" font-size="15" font-weight="600" text-anchor="middle" fill="#86abe2">ū₃ = 5</text>
<text x="368" y="363" font-size="15" fill="#a7adb5">3</text>
<text x="403" y="387" font-size="15" font-weight="600" fill="#e0904f">3.5</text>
<rect x="290" y="206" width="70" height="16" fill="#e58a80" fill-opacity="0.35"/>
<text x="298" y="242" font-size="15" fill="#e9e7e3"></text>
<line x1="150" y1="414" x2="500.0" y2="414.0" stroke="#a7adb5" stroke-width="1.5"/>
<line x1="150" y1="414" x2="150.0" y2="420.0" stroke="#a7adb5" stroke-width="1.5"/>
<text x="150" y="438" font-size="14" text-anchor="middle" fill="#a7adb5">0</text>
<line x1="220" y1="414" x2="220.0" y2="420.0" stroke="#a7adb5" stroke-width="1.5"/>
<text x="220" y="438" font-size="14" text-anchor="middle" fill="#a7adb5">1</text>
<line x1="290" y1="414" x2="290.0" y2="420.0" stroke="#a7adb5" stroke-width="1.5"/>
<text x="290" y="438" font-size="14" text-anchor="middle" fill="#a7adb5">2</text>
<line x1="360" y1="414" x2="360.0" y2="420.0" stroke="#a7adb5" stroke-width="1.5"/>
<text x="360" y="438" font-size="14" text-anchor="middle" fill="#a7adb5">3</text>
<line x1="430" y1="414" x2="430.0" y2="420.0" stroke="#a7adb5" stroke-width="1.5"/>
<text x="430" y="438" font-size="14" text-anchor="middle" fill="#a7adb5">4</text>
<line x1="500" y1="414" x2="500.0" y2="420.0" stroke="#a7adb5" stroke-width="1.5"/>
<text x="500" y="438" font-size="14" text-anchor="middle" fill="#a7adb5">5</text>
<text x="500" y="460" font-size="15" text-anchor="end" fill="#e9e7e3">u (đơn vị lực)</text>
<text x="640" y="142" font-size="15" fill="#e9e7e3">λ = u₂ = u₃</text>
<text x="848" y="142" font-size="15" font-weight="600" text-anchor="end" fill="#e9e7e3">3.5</text>
<text x="640" y="178" font-size="15" fill="#e9e7e3">μ₁ = λ − ū₁</text>
<text x="848" y="178" font-size="15" font-weight="600" text-anchor="end" fill="#e9e7e3">1.5</text>
<text x="640" y="214" font-size="15" fill="#e9e7e3">μ₂ = μ₃</text>
<text x="848" y="214" font-size="15" font-weight="600" text-anchor="end" fill="#e9e7e3">0</text>
<text x="640" y="250" font-size="15" fill="#e9e7e3">nỗ lực ½‖u‖²</text>
<text x="848" y="250" font-size="15" font-weight="600" text-anchor="end" fill="#e9e7e3">14.25</text>
<text x="640" y="286" font-size="15" fill="#e9e7e3">giá trị dual g</text>
<text x="848" y="286" font-size="15" font-weight="600" text-anchor="end" fill="#e9e7e3">14.25</text>
<text x="640" y="322" font-size="15" fill="#e9e7e3">khoảng cách</text>
<text x="848" y="322" font-size="15" font-weight="600" text-anchor="end" fill="#e9e7e3">0</text>
<text x="640" y="374" font-size="15" font-weight="600" fill="#e9e7e3">Σu = 2 + 3.5 + 3.5 = 9</text>
<text x="640" y="400" font-size="14" fill="#a7adb5">bước 3 đến 5 của Trường hợp 1</text>
</svg>
