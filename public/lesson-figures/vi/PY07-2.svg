<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" font-family="Inter, sans-serif">
<title>Mỗi vùng một test là chưa đủ: các biên</title>
<desc>Trục số của battery_state(v) theo volt với bốn vùng (critical dưới 10.5, low từ 10.5 đến 11.1, ok từ 11.1 đến 12.6 gồm cả 12.6, invalid trên 12.6). Các test ở giữa vùng cho qua ba phép so sánh bị sửa; ba test biên mỗi cái giết đúng một mutant.</desc>
<defs></defs>
<rect width="900" height="460" rx="14" fill="#17181b"/>
<text x="32" y="44" font-size="22" fill="#e9e7e3" text-anchor="start" font-weight="bold">Mỗi vùng một test là chưa đủ: các biên</text>
<circle cx="48" cy="79" r="7" fill="#22252a" stroke="#e9e7e3" stroke-width="2"/>
<text x="64" y="84" font-size="15" fill="#e9e7e3" text-anchor="start">mỗi vùng một test (bên trong)</text>
<circle cx="380" cy="79" r="7" fill="#e9e7e3" stroke="#e9e7e3" stroke-width="2"/>
<text x="396" y="84" font-size="15" fill="#e9e7e3" text-anchor="start">test biên (đúng tại mép)</text>
<rect x="64" y="168" width="257" height="40" rx="0" fill="#22252a" stroke="#e58a80" stroke-width="2"/>
<text x="192" y="194" font-size="15" fill="#e58a80" text-anchor="middle" font-weight="600">critical</text>
<rect x="321" y="168" width="103" height="40" rx="0" fill="#22252a" stroke="#e0c169" stroke-width="2"/>
<text x="372" y="194" font-size="15" fill="#e0c169" text-anchor="middle" font-weight="600">low</text>
<rect x="424" y="168" width="258" height="40" rx="0" fill="#22252a" stroke="#6fc693" stroke-width="2"/>
<text x="553" y="194" font-size="15" fill="#6fc693" text-anchor="middle" font-weight="600">ok</text>
<rect x="682" y="168" width="154" height="40" rx="0" fill="#22252a" stroke="#ae9ce6" stroke-width="2"/>
<text x="759" y="194" font-size="15" fill="#ae9ce6" text-anchor="middle" font-weight="600">invalid</text>
<line x1="321" y1="208" x2="321" y2="218" stroke="#a7adb5" stroke-width="1.5" stroke-linecap="round"/>
<text x="321" y="238" font-size="14" fill="#a7adb5" text-anchor="middle">10.5</text>
<line x1="424" y1="208" x2="424" y2="218" stroke="#a7adb5" stroke-width="1.5" stroke-linecap="round"/>
<text x="424" y="238" font-size="14" fill="#a7adb5" text-anchor="middle">11.1</text>
<line x1="682" y1="208" x2="682" y2="218" stroke="#a7adb5" stroke-width="1.5" stroke-linecap="round"/>
<text x="682" y="238" font-size="14" fill="#a7adb5" text-anchor="middle">12.6</text>
<line x1="64" y1="208" x2="64" y2="218" stroke="#a7adb5" stroke-width="1.5" stroke-linecap="round"/>
<text x="64" y="238" font-size="14" fill="#a7adb5" text-anchor="middle">9.0</text>
<line x1="750" y1="208" x2="750" y2="218" stroke="#a7adb5" stroke-width="1.5" stroke-linecap="round"/>
<text x="750" y="238" font-size="14" fill="#a7adb5" text-anchor="middle">13.0</text>
<text x="836" y="260" font-size="15" fill="#a7adb5" text-anchor="end">điện áp pin v (V)</text>
<circle cx="64" cy="154" r="7" fill="#22252a" stroke="#e9e7e3" stroke-width="2"/>
<text x="64" y="134" font-size="15" fill="#e9e7e3" text-anchor="middle">9.0</text>
<circle cx="373" cy="154" r="7" fill="#22252a" stroke="#e9e7e3" stroke-width="2"/>
<text x="373" y="134" font-size="15" fill="#e9e7e3" text-anchor="middle">10.8</text>
<circle cx="579" cy="154" r="7" fill="#22252a" stroke="#e9e7e3" stroke-width="2"/>
<text x="579" y="134" font-size="15" fill="#e9e7e3" text-anchor="middle">12.0</text>
<circle cx="750" cy="154" r="7" fill="#22252a" stroke="#e9e7e3" stroke-width="2"/>
<text x="750" y="134" font-size="15" fill="#e9e7e3" text-anchor="middle">13.0</text>
<circle cx="321" cy="154" r="7" fill="#e9e7e3" stroke="#e9e7e3" stroke-width="2"/>
<text x="321" y="134" font-size="15" fill="#e9e7e3" text-anchor="middle" font-weight="600">10.5</text>
<circle cx="424" cy="154" r="7" fill="#e9e7e3" stroke="#e9e7e3" stroke-width="2"/>
<text x="424" y="134" font-size="15" fill="#e9e7e3" text-anchor="middle" font-weight="600">11.1</text>
<circle cx="682" cy="154" r="7" fill="#e9e7e3" stroke="#e9e7e3" stroke-width="2"/>
<text x="682" y="134" font-size="15" fill="#e9e7e3" text-anchor="middle" font-weight="600">12.6</text>
<rect x="32" y="272" width="836" height="150" rx="6" fill="#22252a" stroke="#3d4148" stroke-width="1.5"/>
<text x="48" y="296" font-size="17" fill="#e9e7e3" text-anchor="start" font-weight="bold">Ba mutant, mỗi cái sửa một phép so sánh</text>
<text x="48" y="322" font-size="14" fill="#a7adb5" text-anchor="start">mutant</text>
<text x="300" y="322" font-size="14" fill="#a7adb5" text-anchor="start">kết quả sai</text>
<text x="600" y="322" font-size="14" fill="#a7adb5" text-anchor="start">bị giết bởi</text>
<text x="48" y="346" font-size="15" fill="#e9e7e3" text-anchor="start" font-weight="600">M1  v &lt;= 10.5</text>
<text x="300" y="346" font-size="15" fill="#e9e7e3" text-anchor="start">critical (đúng: low)</text>
<text x="600" y="346" font-size="15" fill="#6fc693" text-anchor="start">chỉ test 10.5</text>
<text x="48" y="370" font-size="15" fill="#e9e7e3" text-anchor="start" font-weight="600">M2  v &lt;= 11.1</text>
<text x="300" y="370" font-size="15" fill="#e9e7e3" text-anchor="start">low (đúng: ok)</text>
<text x="600" y="370" font-size="15" fill="#6fc693" text-anchor="start">chỉ test 11.1</text>
<text x="48" y="394" font-size="15" fill="#e9e7e3" text-anchor="start" font-weight="600">M3  v &lt; 12.6</text>
<text x="300" y="394" font-size="15" fill="#e9e7e3" text-anchor="start">invalid (đúng: ok)</text>
<text x="600" y="394" font-size="15" fill="#6fc693" text-anchor="start">chỉ test 12.6</text>
<text x="32" y="442" font-size="15" fill="#e9e7e3" text-anchor="start">Chỉ test bên trong vùng: giết 0 trong 3 mutant. Thêm ba test biên: 3 trong 3.</text>
</svg>
