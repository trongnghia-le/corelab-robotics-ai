<line x1="261.629" y1="215.686" x2="295.629" y2="215.686" stroke="#ae9ce6" stroke-width="3" stroke-linecap="round" stroke-dasharray="9 5"/>
<text x="305.629" y="220.686" font-size="15" fill="#e9e7e3" text-anchor="start">70:1: 127 rpm</text>
<text x="548" y="112" font-size="17" fill="#e9e7e3" text-anchor="start" font-weight="bold">Dòng khi chạy đều (A)</text>
