<text x="562" y="332" font-size="15" fill="#ae9ce6" text-anchor="start" font-weight="600">70:1</text>
<rect x="608" y="306" width="105.973" height="40" rx="3" fill="#ae9ce6" fill-opacity="0.5"/>
<text x="616" y="332" font-size="15" fill="#e9e7e3" text-anchor="start" font-weight="600">0.88</text>
<text x="854" y="332" font-size="15" fill="#6fc693" text-anchor="end" font-weight="bold">đạt</text>
<line x1="773" y1="138" x2="773" y2="378" stroke="#e0c169" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 5"/>
<text x="781" y="396" font-size="14" fill="#e0c169" text-anchor="start" font-weight="600">1.375 A</text>
<text x="562" y="416" font-size="14" fill="#a7adb5" text-anchor="start">nét đứt: 25 % dòng kẹt 5.5 A</text>
</svg>
