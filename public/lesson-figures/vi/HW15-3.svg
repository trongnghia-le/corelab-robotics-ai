<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="Inter, sans-serif">
<title>Trường hợp 1: vì sao gearmotor 50:1 thắng</title>
<desc>Các đường hai điểm Pololu 37D cho 30:1, 50:1 và 70:1 ở 12 V so với mô-men bánh 42.2 kg mm và yêu cầu 106 rpm, và dòng khi chạy đều của từng loại so với quy tắc 25 % dòng kẹt 1.375 A.</desc>
<defs></defs>
<rect width="900" height="520" rx="14" fill="#17181b"/>
<text x="32" y="44" font-size="22" fill="#e9e7e3" text-anchor="start" font-weight="bold">Trường hợp 1: vì sao gearmotor 50:1 thắng</text>
<text x="32" y="70" font-size="15" fill="#a7adb5" text-anchor="start">Robot 8 kg trên dốc 10°, 0.5 m/s, mô-men bánh 42.2 kg mm (34.8 kg mm khi chạy đều)</text>
<rect x="88" y="128" width="412" height="296" rx="4" fill="#22252a"/>
<text x="88" y="112" font-size="17" fill="#e9e7e3" text-anchor="start" font-weight="bold">Tốc độ theo mô-men ở bánh</text>
<line x1="83" y1="424" x2="88" y2="424" stroke="#a7adb5" stroke-width="1.5" stroke-linecap="round"/>
<text x="78" y="429" font-size="14" fill="#a7adb5" text-anchor="end">0</text>
