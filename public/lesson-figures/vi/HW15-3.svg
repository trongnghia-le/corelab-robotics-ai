<text x="78" y="344.429" font-size="14" fill="#a7adb5" text-anchor="end">100</text>
<line x1="83" y1="254.857" x2="88" y2="254.857" stroke="#a7adb5" stroke-width="1.5" stroke-linecap="round"/>
<text x="78" y="259.857" font-size="14" fill="#a7adb5" text-anchor="end">200</text>
<line x1="83" y1="170.286" x2="88" y2="170.286" stroke="#a7adb5" stroke-width="1.5" stroke-linecap="round"/>
<text x="78" y="175.286" font-size="14" fill="#a7adb5" text-anchor="end">300</text>
<line x1="88" y1="424" x2="88" y2="429" stroke="#a7adb5" stroke-width="1.5" stroke-linecap="round"/>
<text x="88" y="446" font-size="14" fill="#a7adb5" text-anchor="middle">0</text>
<line x1="191" y1="424" x2="191" y2="429" stroke="#a7adb5" stroke-width="1.5" stroke-linecap="round"/>
<text x="191" y="446" font-size="14" fill="#a7adb5" text-anchor="middle">70</text>
<line x1="294" y1="424" x2="294" y2="429" stroke="#a7adb5" stroke-width="1.5" stroke-linecap="round"/>
<text x="294" y="446" font-size="14" fill="#a7adb5" text-anchor="middle">140</text>
<line x1="397" y1="424" x2="397" y2="429" stroke="#a7adb5" stroke-width="1.5" stroke-linecap="round"/>
<text x="397" y="446" font-size="14" fill="#a7adb5" text-anchor="middle">210</text>
<line x1="500" y1="424" x2="500" y2="429" stroke="#a7adb5" stroke-width="1.5" stroke-linecap="round"/>
<text x="500" y="446" font-size="14" fill="#a7adb5" text-anchor="middle">280</text>
<line x1="88" y1="424" x2="500" y2="424" stroke="#a7adb5" stroke-width="1.5" stroke-linecap="round"/>
<line x1="88" y1="128" x2="88" y2="424" stroke="#a7adb5" stroke-width="1.5" stroke-linecap="round"/>
<text x="294" y="470" font-size="15" fill="#e9e7e3" text-anchor="middle">mô-men đầu ra (kg mm)</text>
<line x1="150.094" y1="128" x2="150.094" y2="424" stroke="#a7adb5" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="6 5"/>
<line x1="88" y1="334.354" x2="500" y2="334.354" stroke="#a7adb5" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="6 5"/>
<text x="492" y="326.354" font-size="14" fill="#e9e7e3" text-anchor="end" font-weight="600">cần 106 rpm</text>
<text x="158.094" y="414" font-size="14" fill="#e9e7e3" text-anchor="start" font-weight="600">42.2</text>
