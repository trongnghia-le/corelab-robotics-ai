<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" font-family="Inter, sans-serif">
<title>Một mutex, hai điều kiện, và cập nhật bị mất mà nó ngăn chặn</title>
<desc>Trái: một producer và một consumer dùng chung hàng đợi giới hạn dung lượng 4 được bảo vệ bởi một mutex m_, với các condition variable not_full và not_empty. Phải: hai lần tăng không đồng bộ đều nạp 5 và đều lưu 6, nên một cập nhật bị mất.</desc>
<defs><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a7adb5"/></marker></defs>
<rect width="900" height="540" rx="14" fill="#17181b"/>
<text x="32" y="44" font-size="22" fill="#e9e7e3" text-anchor="start" font-weight="bold">Một mutex, hai điều kiện, và cập nhật bị mất mà nó ngăn chặn</text>
<rect x="32" y="68" width="410" height="430" rx="8" fill="#22252a" stroke="none" stroke-width="1.5"/>
<rect x="466" y="68" width="410" height="430" rx="8" fill="#22252a" stroke="none" stroke-width="1.5"/>
<text x="48" y="96" font-size="17" fill="#e9e7e3" text-anchor="start" font-weight="bold">Hàng đợi giới hạn, dung lượng K = 4</text>
<rect x="48" y="170" width="84" height="56" rx="6" fill="none" stroke="#86abe2" stroke-width="2"/>
<text x="90" y="204" font-size="15" fill="#86abe2" text-anchor="middle" font-weight="600">producer</text>
<rect x="160" y="170" width="152" height="56" rx="0" fill="none" stroke="#e9e7e3" stroke-width="2"/>
<rect x="162" y="172" width="34" height="52" rx="0" fill="#4a321c" stroke="#e0904f" stroke-width="1.5"/>
<text x="179" y="204" font-size="15" fill="#e9e7e3" text-anchor="middle" font-weight="600">1</text>
<rect x="200" y="172" width="34" height="52" rx="0" fill="#4a321c" stroke="#e0904f" stroke-width="1.5"/>
<text x="217" y="204" font-size="15" fill="#e9e7e3" text-anchor="middle" font-weight="600">2</text>
<rect x="238" y="172" width="34" height="52" rx="0" fill="#4a321c" stroke="#e0904f" stroke-width="1.5"/>
<text x="255" y="204" font-size="15" fill="#e9e7e3" text-anchor="middle" font-weight="600">3</text>
<rect x="276" y="172" width="34" height="52" rx="0" fill="none" stroke="#3d4148" stroke-width="1.5"/>
<rect x="340" y="170" width="86" height="56" rx="6" fill="none" stroke="#6fc693" stroke-width="2"/>
<text x="383" y="204" font-size="15" fill="#6fc693" text-anchor="middle" font-weight="600">consumer</text>
<line x1="132" y1="198" x2="158" y2="198" stroke="#a7adb5" stroke-width="2" marker-end="url(#ara)" stroke-linecap="round"/>
<line x1="314" y1="198" x2="338" y2="198" stroke="#a7adb5" stroke-width="2" marker-end="url(#ara)" stroke-linecap="round"/>
<text x="134" y="162" font-size="14" fill="#a7adb5" text-anchor="start">push(x)</text>
<text x="340" y="162" font-size="14" fill="#a7adb5" text-anchor="start">pop()</text>
<rect x="148" y="244" width="176" height="34" rx="6" fill="none" stroke="#e0c169" stroke-width="2"/>
<text x="236" y="266" font-size="15" fill="#e0c169" text-anchor="middle" font-weight="600">mutex m_ bảo vệ tất cả</text>
<line x1="236" y1="228" x2="236" y2="242" stroke="#e0c169" stroke-width="2" stroke-linecap="round"/>
<rect x="48" y="316" width="182" height="64" rx="6" fill="#22252a" stroke="#3d4148" stroke-width="1.5"/>
<text x="60" y="342" font-size="15" fill="#86abe2" text-anchor="start" font-weight="600">not_full</text>
<text x="60" y="366" font-size="14" fill="#a7adb5" text-anchor="start">producer ngủ khi size = K</text>
<rect x="246" y="316" width="182" height="64" rx="6" fill="#22252a" stroke="#3d4148" stroke-width="1.5"/>
<text x="258" y="342" font-size="15" fill="#6fc693" text-anchor="start" font-weight="600">not_empty</text>
<text x="258" y="366" font-size="14" fill="#a7adb5" text-anchor="start">consumer ngủ khi rỗng</text>
<text x="48" y="414" font-size="14" fill="#a7adb5" text-anchor="start">close(): đặt closed, notify_all cả hai;</text>
<text x="48" y="436" font-size="14" fill="#a7adb5" text-anchor="start">pop lấy hết phần tử rồi trả nullopt</text>
<text x="48" y="470" font-size="14" fill="#a7adb5" text-anchor="start">predicate được kiểm dưới lock, trong vòng lặp</text>
<text x="482" y="96" font-size="17" fill="#e9e7e3" text-anchor="start" font-weight="bold">Hai lần tăng không đồng bộ</text>
<text x="482" y="150" font-size="15" fill="#86abe2" text-anchor="start" font-weight="600">thread A</text>
<text x="482" y="236" font-size="15" fill="#6fc693" text-anchor="start" font-weight="600">thread B</text>
<rect x="582" y="132" width="86" height="40" rx="6" fill="none" stroke="#86abe2" stroke-width="2"/>
<text x="625" y="158" font-size="15" fill="#e9e7e3" text-anchor="middle">load 5</text>
<rect x="676" y="132" width="86" height="40" rx="6" fill="none" stroke="#86abe2" stroke-width="2"/>
<text x="719" y="158" font-size="15" fill="#e9e7e3" text-anchor="middle">add: 6</text>
<rect x="770" y="132" width="86" height="40" rx="6" fill="none" stroke="#86abe2" stroke-width="2"/>
<text x="813" y="158" font-size="15" fill="#e9e7e3" text-anchor="middle">store 6</text>
<rect x="582" y="218" width="86" height="40" rx="6" fill="none" stroke="#6fc693" stroke-width="2"/>
<text x="625" y="244" font-size="15" fill="#e9e7e3" text-anchor="middle">load 5</text>
<rect x="676" y="218" width="86" height="40" rx="6" fill="none" stroke="#6fc693" stroke-width="2"/>
<text x="719" y="244" font-size="15" fill="#e9e7e3" text-anchor="middle">add: 6</text>
<rect x="770" y="218" width="86" height="40" rx="6" fill="none" stroke="#6fc693" stroke-width="2"/>
<text x="813" y="244" font-size="15" fill="#e9e7e3" text-anchor="middle">store 6</text>
<text x="482" y="306" font-size="15" fill="#e9e7e3" text-anchor="start" font-weight="600">bộ đếm trong bộ nhớ</text>
<rect x="582" y="320" width="86" height="40" rx="0" fill="none" stroke="#3d4148" stroke-width="1.5"/>
<text x="625" y="346" font-size="15" fill="#e9e7e3" text-anchor="middle" font-weight="600">5</text>
<rect x="770" y="320" width="86" height="40" rx="0" fill="none" stroke="#e58a80" stroke-width="2"/>
<text x="813" y="346" font-size="15" fill="#e58a80" text-anchor="middle" font-weight="600">6</text>
<line x1="672" y1="340" x2="766" y2="340" stroke="#a7adb5" stroke-width="1.5" marker-end="url(#ara)" stroke-linecap="round"/>
<text x="482" y="392" font-size="15" fill="#e9e7e3" text-anchor="start">Cả hai nạp 5 trước khi bên nào lưu.</text>
<text x="482" y="418" font-size="15" fill="#e9e7e3" text-anchor="start">Hai lần tăng, giá trị cuối là 6, không phải 7:</text>
<text x="482" y="444" font-size="15" fill="#e58a80" text-anchor="start" font-weight="600">mất một cập nhật (undefined behavior).</text>
</svg>
