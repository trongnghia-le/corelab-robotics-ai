<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" font-family="Inter, Arial, sans-serif" font-size="14">
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#e5e7eb"/></marker><marker id="ao" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#d97936"/></marker></defs>
<rect width="720" height="360" fill="#191b1f" rx="12"/>

<text x="360" y="28" fill="#e5e7eb" font-size="16" text-anchor="middle" font-weight="bold">Từ quan sát đến kết luận bảo vệ được</text>
<rect x="20" y="70" width="100" height="86" fill="#272a2f" stroke="#53b2dd" stroke-width="2" rx="6"/>
<text x="70" y="96" fill="#e5e7eb" font-size="14" text-anchor="middle" font-weight="bold">Giả thuyết</text>
<text x="70" y="120" fill="#e5e7eb" font-size="13" text-anchor="middle">metric và</text>
<text x="70" y="138" fill="#e5e7eb" font-size="13" text-anchor="middle">ngưỡng</text>
<line x1="120" y1="113" x2="138" y2="113" stroke="#e5e7eb" stroke-width="2" marker-end="url(#a)"/>
<rect x="138" y="70" width="100" height="86" fill="#272a2f" stroke="#53b2dd" stroke-width="2" rx="6"/>
<text x="188" y="96" fill="#e5e7eb" font-size="14" text-anchor="middle" font-weight="bold" style="font-size:13.54px">Quy trình</text>
<text x="188" y="120" fill="#e5e7eb" font-size="13" text-anchor="middle">chốt trước</text>
<text x="188" y="138" fill="#e5e7eb" font-size="13" text-anchor="middle">khi chạy</text>
<line x1="238" y1="113" x2="256" y2="113" stroke="#e5e7eb" stroke-width="2" marker-end="url(#a)"/>
<rect x="256" y="70" width="100" height="86" fill="#272a2f" stroke="#9ccd4e" stroke-width="2" rx="6"/>
<text x="306" y="96" fill="#e5e7eb" font-size="14" text-anchor="middle" font-weight="bold" style="font-size:10.92px">Lần chạy</text>
<text x="306" y="120" fill="#e5e7eb" font-size="13" text-anchor="middle">điều kiện</text>
<text x="306" y="138" fill="#e5e7eb" font-size="13" text-anchor="middle">x seed</text>
<line x1="356" y1="113" x2="374" y2="113" stroke="#e5e7eb" stroke-width="2" marker-end="url(#a)"/>
<rect x="374" y="70" width="100" height="86" fill="#272a2f" stroke="#9ccd4e" stroke-width="2" rx="6"/>
<text x="424" y="96" fill="#e5e7eb" font-size="14" text-anchor="middle" font-weight="bold" style="font-size:12.34px">Dữ liệu thô</text>
<text x="424" y="120" fill="#e5e7eb" font-size="13" text-anchor="middle">mọi seed</text>
<text x="424" y="138" fill="#e5e7eb" font-size="13" text-anchor="middle" style="font-size:10.14px">được lưu</text>
<line x1="474" y1="113" x2="492" y2="113" stroke="#e5e7eb" stroke-width="2" marker-end="url(#a)"/>
<rect x="492" y="70" width="100" height="86" fill="#272a2f" stroke="#d97936" stroke-width="2" rx="6"/>
<text x="542" y="96" fill="#e5e7eb" font-size="14" text-anchor="middle" font-weight="bold" style="font-size:13.56px">Phân tích</text>
<text x="542" y="120" fill="#e5e7eb" font-size="13" text-anchor="middle" style="font-size:11.3px">hiệu theo cặp,</text>
<text x="542" y="138" fill="#e5e7eb" font-size="13" text-anchor="middle" style="font-size:10.14px">khoảng tin cậy</text>
<line x1="592" y1="113" x2="610" y2="113" stroke="#e5e7eb" stroke-width="2" marker-end="url(#a)"/>
<rect x="610" y="70" width="100" height="86" fill="#272a2f" stroke="#d97936" stroke-width="2" rx="6"/>
<text x="660" y="96" fill="#e5e7eb" font-size="14" text-anchor="middle" font-weight="bold" style="font-size:10.92px">Kết luận</text>
<text x="660" y="120" fill="#e5e7eb" font-size="13" text-anchor="middle" style="font-size:10.35px">kèm giới hạn</text>
<text x="660" y="138" fill="#e5e7eb" font-size="13" text-anchor="middle">và lưu ý</text>
<rect x="20" y="190" width="320" height="150" fill="#272a2f" stroke="#d97936" stroke-width="2" rx="6"/>
<text x="36" y="214" fill="#e5e7eb" font-size="14" text-anchor="start" font-weight="bold" style="font-size:12.06px">Mối đe dọa cần kiểm</text>
<text x="36" y="240" fill="#e5e7eb" font-size="13" text-anchor="start" style="font-size:10.29px">Yếu tố nhiễu: ngân sách, dữ liệu, phiên bản khác nhau</text>
<text x="36" y="264" fill="#e5e7eb" font-size="13" text-anchor="start" style="font-size:10.61px">Chọn lọc: seed tốt nhất, tốt nhất trong 50</text>
<text x="36" y="288" fill="#e5e7eb" font-size="13" text-anchor="start" style="font-size:12.97px">Rò rỉ: dùng dữ liệu test để tinh chỉnh</text>
<text x="36" y="312" fill="#e5e7eb" font-size="13" text-anchor="start" style="font-size:11.24px">Nhiều phép thử: 20 lần, 64% dương tính giả</text>
<rect x="360" y="190" width="340" height="150" fill="#272a2f" stroke="#9ccd4e" stroke-width="2" rx="6"/>
<text x="376" y="214" fill="#e5e7eb" font-size="14" text-anchor="start" font-weight="bold">Đối chứng và ablation</text>
<text x="376" y="240" fill="#e5e7eb" font-size="13" text-anchor="start">Đổi từng yếu tố một (hoặc factorial)</text>
<text x="376" y="264" fill="#e5e7eb" font-size="13" text-anchor="start" style="font-size:12.01px">Cùng cảnh, giới hạn, bước thời gian, tính toán</text>
<text x="376" y="288" fill="#e5e7eb" font-size="13" text-anchor="start">Lặp qua các seed độc lập</text>
<text x="376" y="312" fill="#e5e7eb" font-size="13" text-anchor="start">Báo cáo kết quả âm và sai lệch</text>
</svg>
