<rect x="89" y="179" width="62" height="46" rx="3" fill="#86abe2" fill-opacity="0.28"/>
<rect x="153" y="179" width="62" height="46" rx="3" fill="#86abe2" fill-opacity="0.28"/>
<rect x="217" y="179" width="62" height="46" rx="3" fill="#e0904f" fill-opacity="0.28"/>
<text y="207" font-size="15" fill="#e9e7e3" text-anchor="middle"><tspan x="120">1</tspan><tspan x="184">0</tspan><tspan x="248">2</tspan></text>
<rect x="89" y="227" width="62" height="46" rx="3" fill="#3d4148" fill-opacity="0.35"/>
<rect x="153" y="227" width="62" height="46" rx="3" fill="#3d4148" fill-opacity="0.35"/>
<rect x="217" y="227" width="62" height="46" rx="3" fill="#3d4148" fill-opacity="0.35"/>
<text y="255" font-size="15" fill="#e9e7e3" text-anchor="middle"><tspan x="120">0</tspan><tspan x="184">0</tspan><tspan x="248">1</tspan></text>
<line x1="85" y1="130" x2="85" y2="274" stroke="#a7adb5" stroke-width="2" stroke-linecap="round"/>
<line x1="283" y1="130" x2="283" y2="274" stroke="#a7adb5" stroke-width="2" stroke-linecap="round"/>
<text x="152" y="120" font-size="15" fill="#86abe2" text-anchor="middle" font-weight="600">R</text>
<text x="248" y="120" font-size="15" fill="#e0904f" text-anchor="middle" font-weight="600">t</text>
<text x="48" y="330" font-size="15" fill="#e08db5" text-anchor="start" font-weight="600">điểm (2, 0, 1)  →  (1, 4, 1)</text>
<text x="48" y="356" font-size="14" fill="#a7adb5" text-anchor="start">tọa độ cuối 1: t được cộng</text>
<text x="48" y="404" font-size="15" fill="#6fc693" text-anchor="start" font-weight="600">hướng (2, 0, 0)  →  (0, 2, 0)</text>
<text x="48" y="430" font-size="14" fill="#a7adb5" text-anchor="start">tọa độ cuối 0: t bị bỏ qua</text>
