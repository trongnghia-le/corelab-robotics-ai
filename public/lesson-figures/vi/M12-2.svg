<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="Inter, sans-serif">
<title>Điểm chịu tịnh tiến, hướng thì không</title>
<desc>Ma trận thuần nhất [[0,-1,1],[1,0,2],[0,0,1]] biến điểm (2,0,1) thành (1,4,1) và hướng (2,0,0) thành (0,2,0). Trong frame A, hai điểm P1=(1,4) và P2=(1,6) hơn kém nhau hướng (0,2), cùng vector như tại gốc.</desc>
<defs><marker id="M122arr-6fc693" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 z" fill="#6fc693"/></marker><marker id="M122arr-a7adb5" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 z" fill="#a7adb5"/></marker></defs>
<rect width="900" height="520" rx="14" fill="#17181b"/>
<text x="32" y="44" font-size="22" fill="#e9e7e3" text-anchor="start" font-weight="bold">Điểm chịu tịnh tiến, hướng thì không</text>
<rect x="32" y="64" width="424" height="432" rx="8" fill="#22252a" stroke="#3d4148" stroke-width="1.5"/>
<text x="48" y="94" font-size="17" fill="#e9e7e3" text-anchor="start" font-weight="bold">Ma trận thuần nhất T</text>
