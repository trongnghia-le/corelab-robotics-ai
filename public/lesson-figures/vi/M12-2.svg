<circle cx="564" cy="206" r="6" fill="#e08db5"/>
<text x="578" y="299" font-size="15" fill="#e08db5" text-anchor="start" font-weight="600">P₁ = (1, 4)</text>
<text x="578" y="211" font-size="15" fill="#e08db5" text-anchor="start" font-weight="600">P₂ = (1, 6)</text>
<text x="578" y="255" font-size="15" fill="#6fc693" text-anchor="start" font-weight="600">hướng (0, 2) = P₂ − P₁</text>
<text x="606" y="492" font-size="14" fill="#a7adb5" text-anchor="middle">x</text>
<text x="510" y="188" font-size="14" fill="#a7adb5" text-anchor="end">y</text>
<text x="564" y="490" font-size="14" fill="#a7adb5" text-anchor="middle">1</text>
</svg>
