<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" font-family="Inter, Arial, sans-serif">
<rect width="760" height="360" fill="#191b1f" rx="12"/>
<defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#e5e7eb"/></marker></defs>
<text x="20" y="30" fill="#e5e7eb" font-size="16" font-weight="bold" style="font-size:14.6px">Các bước kế hoạch nối bằng sự kiện chúng tạo ra</text>
<g fill="none" stroke-width="2">
<rect x="20" y="60" width="150" height="44" rx="8" stroke="#53b2dd"/><rect x="200" y="60" width="150" height="44" rx="8" stroke="#53b2dd"/>
<rect x="380" y="60" width="150" height="44" rx="8" stroke="#53b2dd"/><rect x="560" y="60" width="180" height="44" rx="8" stroke="#d97936"/>
</g>
<g fill="#e5e7eb" font-size="14" text-anchor="middle"><text x="95" y="87">1 unstack(C,A)</text><text x="275" y="87">2 putdown(C)</text><text x="455" y="87">3 pickup(A)</text><text x="650" y="87">4 stack(A,B)</text></g>
<g stroke="#e5e7eb" stroke-width="2" fill="none" marker-end="url(#ar)">
<path d="M170 82 L198 82"/><path d="M350 82 L378 82"/><path d="M530 82 L558 82"/>
<path d="M95 106 C95 160 440 160 440 108" stroke="#9ccd4e"/><path d="M455 106 C455 140 600 140 640 108" stroke="#9ccd4e"/>
</g>
<text x="130" y="172" fill="#9ccd4e" font-size="13">clear(A): bước 1 tạo ra, bước 3 dùng</text>
<text x="470" y="150" fill="#9ccd4e" font-size="13">holding(A)</text>
<text x="658" y="160" fill="#d97936" font-size="13">cần clear(B)</text>
<g fill="none" stroke-width="2"><rect x="560" y="200" width="180" height="40" rx="8" stroke="#d97936" stroke-dasharray="5 4"/></g>
<text x="650" y="225" fill="#d97936" font-size="14" text-anchor="middle">D đặt lên B: mất clear(B)</text>
<path d="M650 200 L650 110" stroke="#d97936" stroke-width="2" fill="none" marker-end="url(#ar)"/>
<text x="20" y="215" fill="#e5e7eb" font-size="14">Kiểm tra bằng mô phỏng: bước 1-3 qua, bước 4 là</text>
<text x="20" y="235" fill="#e5e7eb" font-size="14" style="font-size:10.92px">bước không hợp lệ đầu tiên (chỉ số 3), phát hiện trước khi di chuyển.</text>
<text x="20" y="285" fill="#e5e7eb" font-size="16" font-weight="bold">Phản hồi thực thi</text>
<text x="20" y="312" fill="#53b2dd" font-size="14" style="font-size:12.04px">sự kiện dự đoán  so với  sự kiện quan sát</text>
<text x="20" y="336" fill="#e5e7eb" font-size="14">thiếu = dự đoán - quan sát;  thừa = quan sát - dự đoán</text>
</svg>
