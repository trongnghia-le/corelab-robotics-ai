<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="Inter, sans-serif">
<title>Learning rate và giới hạn ổn định</title>
<desc>Gradient descent trên f=2 theta^2 (lambda=4) từ theta0=1 với eta=0,1; 0,5 và 0,6, và hệ số |1-eta*lambda| theo eta với vùng ổn định eta<0,5.</desc>
