<text x="32" y="458" font-size="14" fill="#a7adb5" text-anchor="start">Ví dụ có lời giải: với λ = 4 các iterate đúng bằng (1 − ηλ)^t θ₀; η = 0.6 đạt 1,4³ = 2,744 sau ba bước.</text>
<text x="32" y="480" font-size="14" fill="#a7adb5" text-anchor="start">Giới hạn ổn định trên hàm bậc hai được chứng minh trong M10.</text>
