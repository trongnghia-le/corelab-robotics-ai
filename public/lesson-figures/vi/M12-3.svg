<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" font-family="Inter, sans-serif">
<title>Nghịch đảo phép biến đổi cứng: bỏ phép dịch trước, rồi quay ngược</title>
<desc>Từ P=(1,4) trong A, trừ t=(1,2) được (0,2) rồi quay bằng R chuyển vị được (2,0), đúng tọa độ trong B. Quay trước rồi mới trừ t cho (3,-3), sai.</desc>
<defs><marker id="M123arr-6fc693" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 z" fill="#6fc693"/></marker><marker id="M123arr-e58a80" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 z" fill="#e58a80"/></marker></defs>
<rect width="900" height="540" rx="14" fill="#17181b"/>
<text x="32" y="44" font-size="22" fill="#e9e7e3" text-anchor="start" font-weight="bold">Nghịch đảo phép biến đổi cứng: bỏ phép dịch trước, rồi quay ngược</text>
<rect x="32" y="64" width="500" height="452" rx="8" fill="#22252a" stroke="#3d4148" stroke-width="1.5"/>
<text x="48" y="94" font-size="17" fill="#e9e7e3" text-anchor="start" font-weight="bold">Tọa độ của một điểm, từng bước (m)</text>
<line x1="38" y1="330" x2="369.2" y2="330" stroke="#a7adb5" stroke-width="1.5" stroke-linecap="round"/>
<line x1="110" y1="502.8" x2="110" y2="109.2" stroke="#a7adb5" stroke-width="1.5" stroke-linecap="round"/>
<line x1="158" y1="325" x2="158" y2="335" stroke="#a7adb5" stroke-width="1.5" stroke-linecap="round"/>
<text x="158" y="320" font-size="14" fill="#a7adb5" text-anchor="middle">1</text>
<line x1="206" y1="325" x2="206" y2="335" stroke="#a7adb5" stroke-width="1.5" stroke-linecap="round"/>
<line x1="254" y1="325" x2="254" y2="335" stroke="#a7adb5" stroke-width="1.5" stroke-linecap="round"/>
<text x="254" y="320" font-size="14" fill="#a7adb5" text-anchor="middle">3</text>
<line x1="302" y1="325" x2="302" y2="335" stroke="#a7adb5" stroke-width="1.5" stroke-linecap="round"/>
<text x="302" y="320" font-size="14" fill="#a7adb5" text-anchor="middle">4</text>
<line x1="154.422" y1="145.155" x2="113.578" y2="226.845" stroke="#6fc693" stroke-width="2.5" stroke-linecap="round" marker-end="url(#M123arr-6fc693)"/>
<line x1="115.657" y1="239.657" x2="200.343" y2="324.343" stroke="#6fc693" stroke-width="2.5" stroke-linecap="round" marker-end="url(#M123arr-6fc693)"/>
<line x1="162.116" y1="144.86" x2="297.884" y2="371.14" stroke="#e58a80" stroke-width="2.5" stroke-linecap="round" marker-end="url(#M123arr-e58a80)"/>
<line x1="298.422" y1="385.155" x2="257.578" y2="466.845" stroke="#e58a80" stroke-width="2.5" stroke-linecap="round" marker-end="url(#M123arr-e58a80)"/>
<circle cx="158" cy="138" r="6" fill="#e08db5"/>
<circle cx="110" cy="234" r="6" fill="#6fc693"/>
<circle cx="206" cy="330" r="6" fill="#6fc693"/>
<circle cx="302" cy="378" r="6" fill="#e58a80"/>
<circle cx="254" cy="474" r="6" fill="#e58a80"/>
<text x="170" y="143" font-size="15" fill="#e08db5" text-anchor="start" font-weight="600">(1, 4) = P trong A</text>
<text x="98" y="239" font-size="15" fill="#6fc693" text-anchor="end" font-weight="600">(0, 2)</text>
<text x="196" y="354" font-size="15" fill="#6fc693" text-anchor="end" font-weight="600">(2, 0)</text>
<text x="196" y="374" font-size="15" fill="#6fc693" text-anchor="end" font-weight="600">P trong B</text>
<text x="314" y="383" font-size="15" fill="#e58a80" text-anchor="start">(4, −1)</text>
<text x="266" y="479" font-size="15" fill="#e58a80" text-anchor="start" font-weight="600">(3, −3)  ✗</text>
<text x="148" y="191" font-size="15" fill="#6fc693" text-anchor="start" font-weight="600">− t</text>
<text x="166" y="270" font-size="15" fill="#6fc693" text-anchor="start" font-weight="600">Rᵀ</text>
<text x="244" y="250" font-size="15" fill="#e58a80" text-anchor="start" font-weight="600">Rᵀ</text>
<text x="292" y="442" font-size="15" fill="#e58a80" text-anchor="start" font-weight="600">− t</text>
<rect x="548" y="64" width="320" height="452" rx="8" fill="#22252a" stroke="#3d4148" stroke-width="1.5"/>
<text x="564" y="94" font-size="17" fill="#e9e7e3" text-anchor="start" font-weight="bold">Đại số</text>
<text x="564" y="140" font-size="15" fill="#e9e7e3" text-anchor="start" font-weight="600">T⁻¹ = [[Rᵀ, −Rᵀt], [0, 1]]</text>
<text x="564" y="192" font-size="15" fill="#e9e7e3" text-anchor="start">Rᵀt = (2, −1), nên −Rᵀt = (−2, 1)</text>
<text x="564" y="244" font-size="15" fill="#6fc693" text-anchor="start">T⁻¹ (1, 4, 1) = (2, 0, 1)   ✓</text>
<text x="564" y="296" font-size="15" fill="#e58a80" text-anchor="start">Rᵀ(1, 4) − t = (3, −3)   ✗</text>
<text x="564" y="348" font-size="15" fill="#e9e7e3" text-anchor="start">Quay ngược sau khi bỏ t:</text>
<text x="564" y="400" font-size="15" fill="#6fc693" text-anchor="start" font-weight="600">ᴮp = Rᵀ(ᴬp − t)</text>
</svg>
