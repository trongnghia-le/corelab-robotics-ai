<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" font-family="Inter, sans-serif">
<title>Vòng PID: ba khâu, một giới hạn cơ cấu chấp hành</title>
<desc>Sơ đồ khối: sai số e = r − y đi vào khâu tỉ lệ và khâu tích phân, giá trị đo đi vào khâu vi phân, tổng của chúng qua giới hạn cơ cấu chấp hành vào đối tượng, và y được phản hồi.</desc>
<rect width="900" height="430" rx="14" fill="#17181b"/>
<defs><marker id="arf1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#e9e7e3"/></marker></defs>
<text x="32" y="44" font-size="22" fill="#e9e7e3" text-anchor="start" font-weight="700">Vòng PID: ba khâu, một giới hạn cơ cấu chấp hành</text>
<text x="32" y="227" font-size="15" fill="#e9e7e3" text-anchor="start">r</text>
<line x1="46.0" y1="235.0" x2="103.0" y2="235.0" stroke="#e9e7e3" stroke-width="2" marker-end="url(#arf1)"/>
<circle cx="118.0" cy="235.0" r="14" fill="none" stroke="#e9e7e3" stroke-width="1.5"/>
<text x="111" y="240" font-size="15" fill="#e9e7e3" text-anchor="start">+</text>
<text x="92" y="265" font-size="15" fill="#e9e7e3" text-anchor="start">−</text>
<text x="138" y="259" font-size="15" fill="#a7adb5" text-anchor="start">e = r − y</text>
<line x1="132.0" y1="235.0" x2="172.0" y2="235.0" stroke="#e9e7e3" stroke-width="2"/>
<line x1="172.0" y1="135.0" x2="172.0" y2="235.0" stroke="#e9e7e3" stroke-width="2"/>
<rect x="210" y="104" width="250" height="62" rx="8" fill="#22252a" stroke="#86abe2" stroke-width="2"/>
<text x="224" y="131" font-size="17" fill="#e9e7e3" text-anchor="start" font-weight="700">Kp · e</text>
<text x="224" y="154" font-size="15" fill="#a7adb5" text-anchor="start">sai số hiện tại</text>
<rect x="210" y="204" width="250" height="62" rx="8" fill="#22252a" stroke="#6fc693" stroke-width="2"/>
<text x="224" y="231" font-size="17" fill="#e9e7e3" text-anchor="start" font-weight="700">Ki · ∫ e dt</text>
<text x="224" y="254" font-size="15" fill="#a7adb5" text-anchor="start">sai số tích lũy</text>
<rect x="210" y="304" width="250" height="62" rx="8" fill="#22252a" stroke="#ae9ce6" stroke-width="2"/>
<text x="224" y="331" font-size="17" fill="#e9e7e3" text-anchor="start" font-weight="700">−Kd · dy/dt</text>
<text x="224" y="354" font-size="15" fill="#a7adb5" text-anchor="start">xu hướng của giá trị đo</text>
<line x1="172.0" y1="135.0" x2="210.0" y2="135.0" stroke="#e9e7e3" stroke-width="2" marker-end="url(#arf1)"/>
<line x1="172.0" y1="235.0" x2="210.0" y2="235.0" stroke="#e9e7e3" stroke-width="2" marker-end="url(#arf1)"/>
<line x1="460.0" y1="135.0" x2="518.0" y2="135.0" stroke="#e9e7e3" stroke-width="2"/>
<line x1="460.0" y1="235.0" x2="518.0" y2="235.0" stroke="#e9e7e3" stroke-width="2"/>
<line x1="460.0" y1="335.0" x2="518.0" y2="335.0" stroke="#e9e7e3" stroke-width="2"/>
<line x1="518.0" y1="135.0" x2="518.0" y2="335.0" stroke="#e9e7e3" stroke-width="2"/>
<circle cx="534.0" cy="235.0" r="14" fill="none" stroke="#e9e7e3" stroke-width="1.5"/>
<text x="529" y="240" font-size="15" fill="#e9e7e3" text-anchor="start">+</text>
<line x1="518.0" y1="235.0" x2="520.0" y2="235.0" stroke="#e9e7e3" stroke-width="2"/>
<line x1="548.0" y1="235.0" x2="610.0" y2="235.0" stroke="#e9e7e3" stroke-width="2" marker-end="url(#arf1)"/>
<text x="560" y="223" font-size="15" fill="#a7adb5" text-anchor="start">u_raw</text>
<rect x="612" y="207" width="80" height="56" rx="8" fill="#22252a" stroke="#e0904f" stroke-width="2"/>
<text x="652" y="240" font-size="15" fill="#e9e7e3" text-anchor="middle">giới hạn</text>
<line x1="692.0" y1="235.0" x2="728.0" y2="235.0" stroke="#e9e7e3" stroke-width="2" marker-end="url(#arf1)"/>
<text x="702" y="223" font-size="15" fill="#a7adb5" text-anchor="start">u</text>
<rect x="730" y="195" width="136" height="80" rx="8" fill="#22252a" stroke="#6cc6ba" stroke-width="2"/>
<text x="798" y="227" font-size="17" fill="#e9e7e3" text-anchor="middle" font-weight="700">đối tượng</text>
<text x="798" y="252" font-size="14" fill="#a7adb5" text-anchor="middle">y' = −a·y + b·u + d</text>
<text x="798" y="153" font-size="15" fill="#a7adb5" text-anchor="middle">tải d</text>
<line x1="798.0" y1="161.0" x2="798.0" y2="193.0" stroke="#e9e7e3" stroke-width="2" marker-end="url(#arf1)"/>
<line x1="866.0" y1="235.0" x2="880.0" y2="235.0" stroke="#e9e7e3" stroke-width="2"/>
<text x="868" y="223" font-size="15" fill="#e9e7e3" text-anchor="start">y</text>
<line x1="873.0" y1="235.0" x2="873.0" y2="400.0" stroke="#e9e7e3" stroke-width="2"/>
<line x1="873.0" y1="400.0" x2="118.0" y2="400.0" stroke="#e9e7e3" stroke-width="2"/>
<line x1="118.0" y1="400.0" x2="118.0" y2="250.0" stroke="#e9e7e3" stroke-width="2" marker-end="url(#arf1)"/>
<text x="560" y="392" font-size="15" fill="#a7adb5" text-anchor="start">giá trị đo y</text>
<line x1="335.0" y1="400.0" x2="335.0" y2="366.0" stroke="#ae9ce6" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arf1)"/>
</svg>
