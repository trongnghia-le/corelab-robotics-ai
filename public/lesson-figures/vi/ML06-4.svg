<text x="32" y="456" font-size="14" fill="#a7adb5" text-anchor="start">Bắt đầu x₀ = (1, 1), f = ½(x₁² + 25 x₂²), sai số ‖x_t‖/‖x₀‖. Heavy ball ở nghiệm kép, nên sai số tiến</text>
<text x="32" y="478" font-size="14" fill="#a7adb5" text-anchor="start">như t·(2/3)^t và cần 26 bước, không phải ln 10³ / ln(3/2) = 17.</text>
