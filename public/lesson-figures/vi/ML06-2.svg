<text x="32" y="456" font-size="14" fill="#a7adb5" text-anchor="start">(a) Tỉ lệ tuyến tính (η, B) = (0,1; 16) → (0,4; 64) giữ η/B, nhưng sàn tăng 1,75 lần vì 2 − ηλ giảm từ 1,75 xuống 1.</text>
<text x="32" y="478" font-size="14" fill="#a7adb5" text-anchor="start">(b) Đệ quy chính xác V ← (1 − ηλ)² V + η² σ²/B với E f = ½ λ V; bắt đầu từ V = 1.</text>
