<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400">
  <rect width="760" height="400" fill="#111827" rx="12"/>
  <g font-family="Inter, Arial, sans-serif" fill="#e5e7eb" font-size="14">
    <text x="380" y="30" text-anchor="middle" font-size="16" font-weight="bold">Same 1000 test images, two views of the errors</text>
    <text x="165" y="62" text-anchor="middle" font-size="14">A. Slice by lighting</text>
    <text x="570" y="62" text-anchor="middle" font-size="14">B. Slice by lighting AND distance</text>
    <!-- panel A axes: baseline y=320, 0..30% = 200px -> 6.667 px per % -->
    <line x1="60" y1="320" x2="60" y2="110" stroke="#e5e7eb"/>
    <line x1="60" y1="320" x2="290" y2="320" stroke="#e5e7eb"/>
    <text x="22" y="215" transform="rotate(-90 22 215)" text-anchor="middle">error rate (%)</text>
    <text x="52" y="324" text-anchor="end">0</text>
    <text x="52" y="254" text-anchor="end">10</text>
    <text x="52" y="187" text-anchor="end">20</text>
    <text x="52" y="120" text-anchor="end">30</text>
    <line x1="60" y1="253" x2="290" y2="253" stroke="#374151" stroke-dasharray="4 4"/>
    <line x1="60" y1="187" x2="290" y2="187" stroke="#374151" stroke-dasharray="4 4"/>
    <line x1="60" y1="120" x2="290" y2="120" stroke="#374151" stroke-dasharray="4 4"/>
    <rect x="80" y="267" width="40" height="53" fill="#38bdf8"/>
    <rect x="150" y="187" width="40" height="133" fill="#f97316"/>
    <rect x="220" y="287" width="40" height="33" fill="#a3e635"/>
    <text x="100" y="260" text-anchor="middle">8</text>
    <text x="170" y="180" text-anchor="middle">20</text>
    <text x="240" y="280" text-anchor="middle">5</text>
    <text x="100" y="342" text-anchor="middle">all</text>
    <text x="100" y="360" text-anchor="middle" font-size="13">n=1000</text>
    <text x="170" y="342" text-anchor="middle">dark</text>
    <text x="170" y="360" text-anchor="middle" font-size="13">n=200</text>
    <text x="240" y="342" text-anchor="middle">bright</text>
    <text x="240" y="360" text-anchor="middle" font-size="13">n=800</text>
    <!-- panel B -->
    <line x1="400" y1="320" x2="400" y2="110" stroke="#e5e7eb"/>
    <line x1="400" y1="320" x2="740" y2="320" stroke="#e5e7eb"/>
    <line x1="400" y1="253" x2="740" y2="253" stroke="#374151" stroke-dasharray="4 4"/>
    <line x1="400" y1="187" x2="740" y2="187" stroke="#374151" stroke-dasharray="4 4"/>
    <line x1="400" y1="120" x2="740" y2="120" stroke="#374151" stroke-dasharray="4 4"/>
    <rect x="430" y="147" width="50" height="173" fill="#f97316"/>
    <rect x="500" y="147" width="50" height="173" fill="#a3e635"/>
    <rect x="600" y="307" width="50" height="13" fill="#f97316"/>
    <rect x="670" y="307" width="50" height="13" fill="#a3e635"/>
    <text x="455" y="140" text-anchor="middle">26</text>
    <text x="525" y="140" text-anchor="middle">26</text>
    <text x="625" y="300" text-anchor="middle">2</text>
    <text x="695" y="300" text-anchor="middle">2</text>
    <text x="455" y="342" text-anchor="middle" font-size="13">dark</text>
    <text x="525" y="342" text-anchor="middle" font-size="13">bright</text>
    <text x="625" y="342" text-anchor="middle" font-size="13">dark</text>
    <text x="695" y="342" text-anchor="middle" font-size="13">bright</text>
    <text x="490" y="364" text-anchor="middle">far (250 images)</text>
    <text x="660" y="364" text-anchor="middle">near (750 images)</text>
    <text x="380" y="390" text-anchor="middle" font-size="13" fill="#f97316">Darkness looked guilty in A; distance is the real driver in B.</text>
  </g>
</svg>
