<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" font-family="Inter, Arial, sans-serif" font-size="14">
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#e5e7eb"/></marker><marker id="ao" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#d97936"/></marker></defs>
<rect width="720" height="360" fill="#191b1f" rx="12"/>

<text x="360" y="28" fill="#e5e7eb" font-size="16" text-anchor="middle" font-weight="bold">Layers of evidence and the tolerance band</text>
<rect x="30" y="52" width="300" height="52" fill="#272a2f" stroke="#d97936" stroke-width="2" rx="6"/>
<text x="180" y="83" fill="#e5e7eb" font-size="14" text-anchor="middle">Regression: every fixed bug</text>
<rect x="30" y="117" width="300" height="52" fill="#272a2f" stroke="#53b2dd" stroke-width="2" rx="6"/>
<text x="180" y="148" fill="#e5e7eb" font-size="14" text-anchor="middle">Integration: fixtures, units</text>
<rect x="30" y="182" width="300" height="52" fill="#272a2f" stroke="#9ccd4e" stroke-width="2" rx="6"/>
<text x="180" y="213" fill="#e5e7eb" font-size="14" text-anchor="middle">Properties: invariants, seeds</text>
<rect x="30" y="247" width="300" height="52" fill="#272a2f" stroke="#e5e7eb" stroke-width="2" rx="6"/>
<text x="180" y="278" fill="#e5e7eb" font-size="14" text-anchor="middle">Examples: hand-computed</text>
<text x="180" y="330" fill="#e5e7eb" font-size="13" text-anchor="middle">Each layer catches different bugs</text>
<line x1="400" y1="290" x2="680" y2="290" stroke="#e5e7eb" stroke-width="2" marker-end="url(#a)"/>
<line x1="400" y1="290" x2="400" y2="90" stroke="#e5e7eb" stroke-width="2" marker-end="url(#a)"/>
<text x="680" y="334" fill="#e5e7eb" font-size="13" text-anchor="end">|expected b|  (log scale)</text>
<text x="404" y="84" fill="#e5e7eb" font-size="13" text-anchor="start">allowed |a - b| (log scale)</text>
<line x1="400" y1="230" x2="520" y2="230" stroke="#53b2dd" stroke-width="3"/>
<line x1="520" y1="230" x2="670" y2="95.0" stroke="#9ccd4e" stroke-width="3"/>
<text x="408" y="222" fill="#53b2dd" font-size="13" text-anchor="start">atol dominates</text>
<text x="668" y="87.0" fill="#9ccd4e" font-size="13" text-anchor="end">rtol dominates</text>
<line x1="520" y1="290" x2="520" y2="230" stroke="#d97936" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="520" y="312" fill="#d97936" font-size="13" text-anchor="middle">b = atol/rtol</text>
<text x="410" y="260" fill="#e5e7eb" font-size="13" text-anchor="start">b = 0: only atol allows error</text>
<rect x="400" y="50" width="280" height="40" fill="#272a2f" stroke="#272a2f" stroke-width="2" rx="6"/>
<text x="540" y="76" fill="#9ccd4e" font-size="14" text-anchor="middle">pass if |a-b| &lt;= atol + rtol |b|</text>
</svg>
