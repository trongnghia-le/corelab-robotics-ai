<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" font-family="Inter, sans-serif">
<title>Mutation testing: does the suite notice a plausible bug?</title>
<desc>A correct median function is copied into three mutants (no sorting, upper middle element, mean instead of median). The test suite runs against each: a mutant that makes a test fail is killed, one that passes every test survives and calls for a new test.</desc>
<defs><marker id="m7ae0904f" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 z" fill="#e0904f"/></marker><marker id="m7ae9e7e3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 z" fill="#e9e7e3"/></marker></defs>
<rect width="900" height="440" rx="14" fill="#17181b"/>
<text x="32" y="44" font-size="22" fill="#e9e7e3" text-anchor="start" font-weight="bold">Mutation testing: does the suite notice a plausible bug?</text>
<rect x="32" y="152" width="170" height="100" rx="6" fill="#22252a" stroke="#86abe2" stroke-width="2"/>
<text x="117" y="194" font-size="17" fill="#e9e7e3" text-anchor="middle" font-weight="bold">median(values)</text>
<text x="117" y="218" font-size="14" fill="#a7adb5" text-anchor="middle">original code</text>
<text x="117" y="240" font-size="14" fill="#6fc693" text-anchor="middle">suite passes: OK</text>
<text x="244" y="84" font-size="17" fill="#e9e7e3" text-anchor="start" font-weight="bold">Mutants: one small edit each</text>
<rect x="244" y="104" width="246" height="60" rx="6" fill="#22252a" stroke="#e0904f" stroke-width="2"/>
<text x="260" y="130" font-size="15" fill="#e9e7e3" text-anchor="start" font-weight="600">M1  no sort</text>
<text x="260" y="152" font-size="14" fill="#a7adb5" text-anchor="start">drops sorted()</text>
<line x1="202" y1="202" x2="242" y2="134" stroke="#e0904f" stroke-width="2" marker-end="url(#m7ae0904f)" stroke-linecap="round"/>
<rect x="244" y="184" width="246" height="60" rx="6" fill="#22252a" stroke="#e0904f" stroke-width="2"/>
<text x="260" y="210" font-size="15" fill="#e9e7e3" text-anchor="start" font-weight="600">M2  upper middle</text>
<text x="260" y="232" font-size="14" fill="#a7adb5" text-anchor="start">s[n//2] for even n</text>
<line x1="202" y1="202" x2="242" y2="214" stroke="#e0904f" stroke-width="2" marker-end="url(#m7ae0904f)" stroke-linecap="round"/>
<rect x="244" y="264" width="246" height="60" rx="6" fill="#22252a" stroke="#e0904f" stroke-width="2"/>
<text x="260" y="290" font-size="15" fill="#e9e7e3" text-anchor="start" font-weight="600">M3  mean</text>
<text x="260" y="312" font-size="14" fill="#a7adb5" text-anchor="start">sum(v) / len(v)</text>
<line x1="202" y1="202" x2="242" y2="294" stroke="#e0904f" stroke-width="2" marker-end="url(#m7ae0904f)" stroke-linecap="round"/>
<rect x="536" y="148" width="170" height="108" rx="6" fill="#22252a" stroke="#6fc693" stroke-width="2"/>
<text x="621" y="178" font-size="17" fill="#e9e7e3" text-anchor="middle" font-weight="bold">test suite</text>
<text x="621" y="202" font-size="14" fill="#a7adb5" text-anchor="middle">cases + oracle</text>
<text x="621" y="222" font-size="14" fill="#a7adb5" text-anchor="middle">+ input unchanged</text>
<text x="621" y="242" font-size="14" fill="#a7adb5" text-anchor="middle">+ error on empty</text>
<line x1="490" y1="134" x2="534" y2="182" stroke="#e9e7e3" stroke-width="2" marker-end="url(#m7ae9e7e3)" stroke-linecap="round"/>
<line x1="490" y1="214" x2="534" y2="202" stroke="#e9e7e3" stroke-width="2" marker-end="url(#m7ae9e7e3)" stroke-linecap="round"/>
<line x1="490" y1="294" x2="534" y2="222" stroke="#e9e7e3" stroke-width="2" marker-end="url(#m7ae9e7e3)" stroke-linecap="round"/>
<rect x="752" y="112" width="116" height="76" rx="6" fill="#22252a" stroke="#6fc693" stroke-width="2"/>
<text x="810" y="142" font-size="17" fill="#6fc693" text-anchor="middle" font-weight="bold">killed</text>
<text x="810" y="166" font-size="14" fill="#a7adb5" text-anchor="middle">a test fails</text>
<rect x="752" y="232" width="116" height="76" rx="6" fill="#22252a" stroke="#e0904f" stroke-width="2"/>
<text x="810" y="262" font-size="17" fill="#e0904f" text-anchor="middle" font-weight="bold">survived</text>
<text x="810" y="286" font-size="14" fill="#a7adb5" text-anchor="middle">every test passes</text>
<line x1="706" y1="190" x2="750" y2="152" stroke="#e9e7e3" stroke-width="2" marker-end="url(#m7ae9e7e3)" stroke-linecap="round"/>
<line x1="706" y1="214" x2="750" y2="270" stroke="#e9e7e3" stroke-width="2" marker-end="url(#m7ae9e7e3)" stroke-linecap="round"/>
<line x1="32" y1="352" x2="868" y2="352" stroke="#3d4148" stroke-width="1.2" stroke-linecap="round"/>
<text x="32" y="384" font-size="15" fill="#e9e7e3" text-anchor="start">A survivor means the suite cannot tell this bug from the correct code.</text>
<text x="32" y="410" font-size="15" fill="#a7adb5" text-anchor="start">Add a test that separates them, or show that the mutant is equivalent (no input behaves differently).</text>
</svg>
