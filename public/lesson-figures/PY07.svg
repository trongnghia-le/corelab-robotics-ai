<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" font-family="Inter, Arial, sans-serif" font-size="14">
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#e5e7eb"/></marker><marker id="ao" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#f97316"/></marker></defs>
<rect width="720" height="340" fill="#111827" rx="12"/>

<text x="360" y="28" fill="#e5e7eb" font-size="16" text-anchor="middle" font-weight="bold">Mutation testing: does the suite notice a plausible bug?</text>
<rect x="30" y="90" width="130" height="60" fill="#1f2937" stroke="#38bdf8" stroke-width="2" rx="6"/>
<text x="95" y="115" fill="#e5e7eb" font-size="14" text-anchor="middle">median()</text>
<text x="95" y="136" fill="#e5e7eb" font-size="13" text-anchor="middle">original code</text>
<rect x="230" y="50" width="150" height="44" fill="#1f2937" stroke="#f97316" stroke-width="2" rx="6"/>
<text x="305" y="77" fill="#e5e7eb" font-size="13" text-anchor="middle">mutant: no sort</text>
<rect x="230" y="120" width="150" height="44" fill="#1f2937" stroke="#f97316" stroke-width="2" rx="6"/>
<text x="305" y="147" fill="#e5e7eb" font-size="13" text-anchor="middle">mutant: upper middle</text>
<rect x="230" y="190" width="150" height="44" fill="#1f2937" stroke="#f97316" stroke-width="2" rx="6"/>
<text x="305" y="217" fill="#e5e7eb" font-size="13" text-anchor="middle">mutant: sorts input</text>
<line x1="160" y1="120" x2="228" y2="72" stroke="#f97316" stroke-width="2" marker-end="url(#ao)"/>
<line x1="160" y1="120" x2="228" y2="142" stroke="#f97316" stroke-width="2" marker-end="url(#ao)"/>
<line x1="160" y1="120" x2="228" y2="212" stroke="#f97316" stroke-width="2" marker-end="url(#ao)"/>
<rect x="450" y="100" width="130" height="100" fill="#1f2937" stroke="#a3e635" stroke-width="2" rx="6"/>
<text x="515" y="135" fill="#e5e7eb" font-size="14" text-anchor="middle">test suite</text>
<text x="515" y="158" fill="#e5e7eb" font-size="13" text-anchor="middle">cases + oracle</text>
<text x="515" y="178" fill="#e5e7eb" font-size="13" text-anchor="middle">+ no-mutation check</text>
<line x1="380" y1="72" x2="448" y2="150" stroke="#e5e7eb" stroke-width="2" marker-end="url(#a)"/>
<line x1="380" y1="142" x2="448" y2="150" stroke="#e5e7eb" stroke-width="2" marker-end="url(#a)"/>
<line x1="380" y1="212" x2="448" y2="150" stroke="#e5e7eb" stroke-width="2" marker-end="url(#a)"/>
<rect x="620" y="90" width="80" height="36" fill="#1f2937" stroke="#a3e635" stroke-width="2" rx="6"/>
<text x="660" y="113" fill="#a3e635" font-size="14" text-anchor="middle">killed</text>
<rect x="620" y="150" width="80" height="36" fill="#1f2937" stroke="#f97316" stroke-width="2" rx="6"/>
<text x="660" y="173" fill="#f97316" font-size="14" text-anchor="middle">survived</text>
<line x1="580" y1="140" x2="618" y2="110" stroke="#e5e7eb" stroke-width="2" marker-end="url(#a)"/>
<line x1="580" y1="160" x2="618" y2="168" stroke="#e5e7eb" stroke-width="2" marker-end="url(#a)"/>
<rect x="30" y="262" width="660" height="56" fill="#1f2937" stroke="#e5e7eb" stroke-width="2" rx="6"/>
<text x="46" y="284" fill="#e5e7eb" font-size="13" text-anchor="start">Mutation score = killed / valid mutants. A survivor means a missing test (or an equivalent mutant).</text>
<text x="46" y="305" fill="#e5e7eb" font-size="13" text-anchor="start">The original code must still pass: a suite that rejects everything proves nothing.</text>
</svg>
