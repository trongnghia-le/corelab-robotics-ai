<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" font-family="Inter, sans-serif">
<title>Where each build error comes from</title>
<desc>Four pipeline stages, what each one reads and the typical error message of each stage.</desc>
<rect width="900" height="380" rx="14" fill="#17181b"/>
<defs><marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#a7adb5"/></marker></defs>
<text x="32" y="44" font-size="22" font-weight="700" fill="#e9e7e3">Where each build error comes from</text>
<rect x="32" y="70" width="190" height="92" rx="8" fill="#22252a" stroke="#86abe2" stroke-width="2"/>
<text x="46" y="98" font-size="17" font-weight="700" fill="#e9e7e3">1 Preprocess</text>
<text x="46" y="122" font-size="14" fill="#a7adb5">#include, #define</text>
<text x="46" y="144" font-size="14" fill="#86abe2">reads: headers</text>
<line x1="225" y1="116" x2="243" y2="116" stroke="#a7adb5" stroke-width="2" marker-end="url(#aha)"/>
<rect x="32" y="186" width="190" height="164" rx="8" fill="#22252a" stroke="#3d4148" stroke-width="1.5"/>
<text x="46" y="214" font-size="14" fill="#86abe2" font-family="monospace">fatal error:</text>
<text x="46" y="236" font-size="14" fill="#86abe2" font-family="monospace">No such file or</text>
<text x="46" y="258" font-size="14" fill="#86abe2" font-family="monospace">directory</text>
<text x="46" y="292" font-size="14" fill="#a7adb5">cause:</text>
<text x="46" y="312" font-size="14" fill="#a7adb5">include path not</text>
<text x="46" y="330" font-size="14" fill="#a7adb5">given to this target</text>
<rect x="246" y="70" width="190" height="92" rx="8" fill="#22252a" stroke="#6fc693" stroke-width="2"/>
<text x="260" y="98" font-size="17" font-weight="700" fill="#e9e7e3">2 Compile</text>
<text x="260" y="122" font-size="14" fill="#a7adb5">.cpp to .o</text>
<text x="260" y="144" font-size="14" fill="#6fc693">reads: declarations</text>
<line x1="439" y1="116" x2="457" y2="116" stroke="#a7adb5" stroke-width="2" marker-end="url(#aha)"/>
<rect x="246" y="186" width="190" height="164" rx="8" fill="#22252a" stroke="#3d4148" stroke-width="1.5"/>
<text x="260" y="214" font-size="14" fill="#6fc693" font-family="monospace">error: 'foo' was</text>
<text x="260" y="236" font-size="14" fill="#6fc693" font-family="monospace">not declared in</text>
<text x="260" y="258" font-size="14" fill="#6fc693" font-family="monospace">this scope</text>
<text x="260" y="292" font-size="14" fill="#a7adb5">cause:</text>
<text x="260" y="312" font-size="14" fill="#a7adb5">typo, missing</text>
<text x="260" y="330" font-size="14" fill="#a7adb5">#include, namespace</text>
<rect x="460" y="70" width="190" height="92" rx="8" fill="#22252a" stroke="#ae9ce6" stroke-width="2"/>
<text x="474" y="98" font-size="17" font-weight="700" fill="#e9e7e3">3 Archive</text>
<text x="474" y="122" font-size="14" fill="#a7adb5">.o files to .a</text>
<text x="474" y="144" font-size="14" fill="#ae9ce6">reads: objects</text>
<line x1="653" y1="116" x2="671" y2="116" stroke="#a7adb5" stroke-width="2" marker-end="url(#aha)"/>
<rect x="460" y="186" width="190" height="164" rx="8" fill="#22252a" stroke="#3d4148" stroke-width="1.5"/>
<text x="474" y="214" font-size="14" fill="#ae9ce6" font-family="monospace">ar rcs lib.a *.o</text>
<text x="474" y="236" font-size="14" fill="#ae9ce6" font-family="monospace">(almost never</text>
<text x="474" y="258" font-size="14" fill="#ae9ce6" font-family="monospace">fails)</text>
<text x="474" y="292" font-size="14" fill="#a7adb5">cause:</text>
<text x="474" y="312" font-size="14" fill="#a7adb5">no symbol check</text>
<text x="474" y="330" font-size="14" fill="#a7adb5">happens here</text>
<rect x="674" y="70" width="190" height="92" rx="8" fill="#22252a" stroke="#e0904f" stroke-width="2"/>
<text x="688" y="98" font-size="17" font-weight="700" fill="#e9e7e3">4 Link</text>
<text x="688" y="122" font-size="14" fill="#a7adb5">objects + .a to exe</text>
<text x="688" y="144" font-size="14" fill="#e0904f">reads: definitions</text>
<rect x="674" y="186" width="190" height="164" rx="8" fill="#22252a" stroke="#3d4148" stroke-width="1.5"/>
<text x="688" y="214" font-size="14" fill="#e0904f" font-family="monospace">undefined</text>
<text x="688" y="236" font-size="14" fill="#e0904f" font-family="monospace">reference to ...</text>
<text x="688" y="258" font-size="14" fill="#e0904f" font-family="monospace">multiple definition</text>
<text x="688" y="292" font-size="14" fill="#a7adb5">cause:</text>
<text x="688" y="312" font-size="14" fill="#a7adb5">definition missing</text>
<text x="688" y="330" font-size="14" fill="#a7adb5">or defined twice</text>
</svg>
