<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" font-family="Inter, Arial, sans-serif">
<rect width="720" height="400" fill="#191b1f" rx="12"/>
<text x="24" y="30" fill="#e5e7eb" font-size="16" font-weight="bold">Flexible link and flexible joint</text>
<text x="400" y="30" fill="#e5e7eb" font-size="16" font-weight="bold">Dynamic amplification</text>
<rect x="30" y="60" width="14" height="110" fill="#3b414d" stroke="#e5e7eb"/>
<line x1="44" y1="115" x2="330" y2="115" stroke="#e5e7eb" stroke-dasharray="5 4"/>
<path d="M 44 115 Q 200 115 330 175" fill="none" stroke="#53b2dd" stroke-width="5"/>
<text x="190" y="90" fill="#e5e7eb" font-size="13">rigid link</text>
<text x="330" y="198" fill="#53b2dd" font-size="13" text-anchor="end">first bending mode, f1</text>
<text x="40" y="224" fill="#e5e7eb" font-size="13">f1 = (1.875^2 / 2 pi) sqrt(E I / (rho A L^4))</text>
<rect x="40" y="250" width="60" height="50" fill="none" stroke="#d97936" stroke-width="2"/><text x="70" y="280" fill="#d97936" font-size="13" text-anchor="middle">Jm</text>
<path d="M 100 275 L 130 275 L 140 260 L 160 290 L 180 260 L 200 290 L 210 275 L 240 275" fill="none" stroke="#9ccd4e" stroke-width="3"/>
<text x="170" y="312" fill="#9ccd4e" font-size="13" text-anchor="middle">spring k</text>
<rect x="240" y="245" width="80" height="60" fill="none" stroke="#53b2dd" stroke-width="2"/><text x="280" y="280" fill="#53b2dd" font-size="13" text-anchor="middle">Jl</text>
<text x="40" y="340" fill="#e5e7eb" font-size="13">anti-resonance sqrt(k / Jl)  (motor held)</text>
<text x="40" y="362" fill="#e5e7eb" font-size="13">resonance sqrt(k (Jm + Jl) / (Jm Jl))  (motor free)</text>
<line x1="420" y1="330" x2="700" y2="330" stroke="#e5e7eb"/><line x1="420" y1="330" x2="420" y2="60" stroke="#e5e7eb"/>
<text x="560" y="362" fill="#e5e7eb" font-size="13" text-anchor="middle">frequency ratio f / fn</text>
<text x="410" y="195" fill="#e5e7eb" font-size="13" text-anchor="end" transform="rotate(-90 410 195)">DAF</text>
<rect x="420" y="60" width="62" height="270" fill="#9ccd4e" fill-opacity="0.12"/>
<path d="M 420 300 L 450 297 L 480 290 L 510 275 L 535 245 L 552 190 L 562 110 L 568 70" fill="none" stroke="#d97936" stroke-width="3"/>
<path d="M 570 70 L 580 150 L 600 210 L 640 260 L 690 285" fill="none" stroke="#d97936" stroke-width="3"/>
<line x1="420" y1="300" x2="700" y2="300" stroke="#e5e7eb" stroke-dasharray="3 4" opacity="0.5"/>
<text x="702" y="304" fill="#e5e7eb" font-size="13" text-anchor="end" dy="-6">DAF = 1</text>
<line x1="568" y1="330" x2="568" y2="70" stroke="#e5e7eb" stroke-dasharray="4 3"/><text x="574" y="80" fill="#e5e7eb" font-size="13">resonance</text>
<text x="426" y="86" fill="#9ccd4e" font-size="13">rigid ok:</text><text x="426" y="104" fill="#9ccd4e" font-size="13">f &lt; 0.3 fn</text>
<text x="482" y="348" fill="#e5e7eb" font-size="13" text-anchor="middle">0.3</text><text x="568" y="348" fill="#e5e7eb" font-size="13" text-anchor="middle">1</text>
</svg>
