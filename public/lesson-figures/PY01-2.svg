<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" font-family="Inter, sans-serif">
<title>Float binary64 gần 2^53: khoảng cách 1 ở dưới, 2 ở trên, và cách 2^53+1, +3, +5 làm tròn</title>
<desc>Hình trục số float gần 2 mũ 53: chấm đặc là float, chấm rỗng làm tròn về lân cận.</desc>
<rect width="900" height="430" rx="14" fill="#17181b"/>

<text x="32" y="44" font-size="22" font-weight="bold" fill="#e9e7e3">Trên 2^53, float bỏ qua cứ một số nguyên</text>
<circle cx="40.0" cy="84.0" r="6" fill="#e9e7e3"/>
<text x="54" y="89" font-size="15" fill="#e9e7e3">float biểu diễn được</text>
<circle cx="40.0" cy="84.0" r="6" fill="#e9e7e3"/>
<circle cx="290.0" cy="84.0" r="6" fill="#22252a" stroke="#e08db5" stroke-width="2"/>
<text x="304" y="89" font-size="15" fill="#e9e7e3">số nguyên không có float riêng</text>
<line x1="590" y1="84" x2="609.0" y2="84.0" stroke="#e0c169" stroke-width="2"/>
<polygon points="620.0,84.0 609.0,89.5 609.0,78.5" fill="#e0c169"/>
<text x="630" y="89" font-size="15" fill="#e9e7e3">làm tròn (hòa → chẵn)</text>
<line x1="60" y1="250" x2="780.0" y2="250.0" stroke="#a7adb5" stroke-width="1.5"/>
<line x1="90" y1="244" x2="90.0" y2="256.0" stroke="#a7adb5" stroke-width="1.5"/>
<text x="90" y="280" font-size="14" text-anchor="middle" fill="#a7adb5">−4</text>
<circle cx="90.0" cy="250.0" r="7" fill="#e9e7e3"/>
<line x1="156" y1="244" x2="156.0" y2="256.0" stroke="#a7adb5" stroke-width="1.5"/>
<text x="156" y="280" font-size="14" text-anchor="middle" fill="#a7adb5">−3</text>
<circle cx="156.0" cy="250.0" r="7" fill="#e9e7e3"/>
<line x1="222" y1="244" x2="222.0" y2="256.0" stroke="#a7adb5" stroke-width="1.5"/>
<text x="222" y="280" font-size="14" text-anchor="middle" fill="#a7adb5">−2</text>
<circle cx="222.0" cy="250.0" r="7" fill="#e9e7e3"/>
<line x1="288" y1="244" x2="288.0" y2="256.0" stroke="#a7adb5" stroke-width="1.5"/>
<text x="288" y="280" font-size="14" text-anchor="middle" fill="#a7adb5">−1</text>
<circle cx="288.0" cy="250.0" r="7" fill="#e9e7e3"/>
<line x1="354" y1="244" x2="354.0" y2="256.0" stroke="#a7adb5" stroke-width="1.5"/>
<text x="354" y="280" font-size="14" text-anchor="middle" fill="#a7adb5">0</text>
<circle cx="354.0" cy="250.0" r="7" fill="#e9e7e3"/>
<line x1="420" y1="244" x2="420.0" y2="256.0" stroke="#a7adb5" stroke-width="1.5"/>
<text x="420" y="280" font-size="14" text-anchor="middle" fill="#a7adb5">+1</text>
<circle cx="420.0" cy="250.0" r="7" fill="#22252a" stroke="#e08db5" stroke-width="2"/>
<line x1="486" y1="244" x2="486.0" y2="256.0" stroke="#a7adb5" stroke-width="1.5"/>
<text x="486" y="280" font-size="14" text-anchor="middle" fill="#a7adb5">+2</text>
<circle cx="486.0" cy="250.0" r="7" fill="#e9e7e3"/>
<line x1="552" y1="244" x2="552.0" y2="256.0" stroke="#a7adb5" stroke-width="1.5"/>
<text x="552" y="280" font-size="14" text-anchor="middle" fill="#a7adb5">+3</text>
<circle cx="552.0" cy="250.0" r="7" fill="#22252a" stroke="#e08db5" stroke-width="2"/>
<line x1="618" y1="244" x2="618.0" y2="256.0" stroke="#a7adb5" stroke-width="1.5"/>
<text x="618" y="280" font-size="14" text-anchor="middle" fill="#a7adb5">+4</text>
<circle cx="618.0" cy="250.0" r="7" fill="#e9e7e3"/>
<line x1="684" y1="244" x2="684.0" y2="256.0" stroke="#a7adb5" stroke-width="1.5"/>
<text x="684" y="280" font-size="14" text-anchor="middle" fill="#a7adb5">+5</text>
<circle cx="684.0" cy="250.0" r="7" fill="#22252a" stroke="#e08db5" stroke-width="2"/>
<line x1="750" y1="244" x2="750.0" y2="256.0" stroke="#a7adb5" stroke-width="1.5"/>
<text x="750" y="280" font-size="14" text-anchor="middle" fill="#a7adb5">+6</text>
<circle cx="750.0" cy="250.0" r="7" fill="#e9e7e3"/>
<path d="M420.0,238 Q387.0,194 354.0,230" fill="none" stroke="#e0c169" stroke-width="2"/>
<polygon points="354.0,236.0 356.5,224.0 365.1,230.7" fill="#e0c169"/>
<path d="M552.0,238 Q585.0,194 618.0,230" fill="none" stroke="#e0c169" stroke-width="2"/>
<polygon points="618.0,236.0 606.9,230.7 615.5,224.0" fill="#e0c169"/>
<path d="M684.0,238 Q651.0,194 618.0,230" fill="none" stroke="#e0c169" stroke-width="2"/>
<polygon points="618.0,236.0 620.5,224.0 629.1,230.7" fill="#e0c169"/>
<text x="387" y="178" font-size="14" text-anchor="middle" fill="#e0c169">+1 → +0</text>
<text x="585" y="178" font-size="14" text-anchor="middle" fill="#e0c169">+3 → +4</text>
<text x="651" y="178" font-size="14" text-anchor="middle" fill="#e0c169">+5 → +4</text>
<line x1="82" y1="330" x2="362.0" y2="330.0" stroke="#6fc693" stroke-width="2"/>
<line x1="82" y1="323" x2="82.0" y2="330.0" stroke="#6fc693" stroke-width="2"/>
<line x1="362" y1="323" x2="362.0" y2="330.0" stroke="#6fc693" stroke-width="2"/>
<text x="222" y="356" font-size="15" font-weight="600" text-anchor="middle" fill="#6fc693">khoảng cách 1: mọi số nguyên là float</text>
<line x1="346" y1="330" x2="758.0" y2="330.0" stroke="#e0904f" stroke-width="2"/>
<line x1="346" y1="323" x2="346.0" y2="330.0" stroke="#e0904f" stroke-width="2"/>
<line x1="758" y1="323" x2="758.0" y2="330.0" stroke="#e0904f" stroke-width="2"/>
<text x="552" y="356" font-size="15" font-weight="600" text-anchor="middle" fill="#e0904f">khoảng cách 2: chỉ độ lệch chẵn</text>
<text x="60" y="308" font-size="15" fill="#e9e7e3">độ lệch x − 2^53, theo đơn vị số nguyên (2^53 = 9007199254740992)</text>
<text x="32" y="398" font-size="14" fill="#a7adb5">Tại 2^53 khoảng cách 2 bằng 2^−52 giá trị, tức 2u với u = 2^−53</text>
</svg>
