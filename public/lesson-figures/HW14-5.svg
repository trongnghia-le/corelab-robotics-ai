<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" font-family="Inter, sans-serif">
<title>Gearhead limits against motor limits</title>
<desc>Output torque of the 3257 G 024 CR through a 14:1, 85 percent gearhead at the rated point (0.859 N m), at the intermittent limit (3 N m, 6.7 A) and at stall (6.52 N m), against the 32A two-stage limits 2.25 and 3 N m.</desc>
<defs><marker id="HW14-5a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#a7adb5"/></marker></defs>
<rect width="900" height="480" rx="14" fill="#17181b"/>
<text x="32.0" y="44.0" font-size="22" fill="#e9e7e3" text-anchor="start" font-weight="bold">Output torque = motor torque × 14 × 0.85</text>
<text x="32.0" y="70.0" font-size="15" fill="#a7adb5" text-anchor="start">3257 G 024 CR + 32A two-stage gearhead, 14:1</text>
<line x1="310.0" y1="372.0" x2="310.0" y2="378.0" stroke="#a7adb5" stroke-width="1.5"/>
<text x="310.0" y="394.0" font-size="14" fill="#a7adb5" text-anchor="middle">0</text>
<line x1="380.0" y1="372.0" x2="380.0" y2="378.0" stroke="#a7adb5" stroke-width="1.5"/>
<text x="380.0" y="394.0" font-size="14" fill="#a7adb5" text-anchor="middle">1</text>
<line x1="450.0" y1="372.0" x2="450.0" y2="378.0" stroke="#a7adb5" stroke-width="1.5"/>
<text x="450.0" y="394.0" font-size="14" fill="#a7adb5" text-anchor="middle">2</text>
<line x1="520.0" y1="372.0" x2="520.0" y2="378.0" stroke="#a7adb5" stroke-width="1.5"/>
<text x="520.0" y="394.0" font-size="14" fill="#a7adb5" text-anchor="middle">3</text>
<line x1="590.0" y1="372.0" x2="590.0" y2="378.0" stroke="#a7adb5" stroke-width="1.5"/>
<text x="590.0" y="394.0" font-size="14" fill="#a7adb5" text-anchor="middle">4</text>
<line x1="660.0" y1="372.0" x2="660.0" y2="378.0" stroke="#a7adb5" stroke-width="1.5"/>
<text x="660.0" y="394.0" font-size="14" fill="#a7adb5" text-anchor="middle">5</text>
<line x1="730.0" y1="372.0" x2="730.0" y2="378.0" stroke="#a7adb5" stroke-width="1.5"/>
<text x="730.0" y="394.0" font-size="14" fill="#a7adb5" text-anchor="middle">6</text>
<line x1="800.0" y1="372.0" x2="800.0" y2="378.0" stroke="#a7adb5" stroke-width="1.5"/>
<text x="800.0" y="394.0" font-size="14" fill="#a7adb5" text-anchor="middle">7</text>
<text x="555.0" y="422.0" font-size="15" fill="#e9e7e3" text-anchor="middle">torque at the gearhead output (N m)</text>
<line x1="467.5" y1="128.0" x2="467.5" y2="372.0" stroke="#6fc693" stroke-width="2" stroke-dasharray="7 5"/>
<line x1="520.0" y1="104.0" x2="520.0" y2="372.0" stroke="#e0c169" stroke-width="2" stroke-dasharray="7 5"/>
<text x="461.5" y="132.0" font-size="15" fill="#6fc693" text-anchor="end">continuous 2.25 N m</text>
<text x="526.0" y="112.0" font-size="15" fill="#e0c169" text-anchor="start">intermittent 3 N m</text>
<text x="32.0" y="186.0" font-size="17" fill="#e9e7e3" text-anchor="start" font-weight="bold">Rated point</text>
<text x="32.0" y="206.0" font-size="14" fill="#a7adb5" text-anchor="start">motor: 72.2 mNm · 2.36 A</text>
<text x="32.0" y="224.0" font-size="14" fill="#a7adb5" text-anchor="start">2.36 A: printed on the sheet</text>
<rect x="310.0" y="170.0" width="60.1" height="34.0" rx="3" fill="#6fc693" stroke="none" stroke-width="1.5" fill-opacity="0.85"/>
<text x="378.1" y="194.0" font-size="15" fill="#e9e7e3" text-anchor="start">0.859  pass</text>
<text x="32.0" y="254.0" font-size="17" fill="#e9e7e3" text-anchor="start" font-weight="bold">Intermittent limit</text>
<text x="32.0" y="274.0" font-size="14" fill="#a7adb5" text-anchor="start">motor: 252 mNm · 6.7 A</text>
<text x="32.0" y="292.0" font-size="14" fill="#a7adb5" text-anchor="start">6.7 A = I0 + M/kM (linear model)</text>
<rect x="310.0" y="238.0" width="210.0" height="34.0" rx="3" fill="#e0c169" stroke="none" stroke-width="1.5" fill-opacity="0.85"/>
<text x="528.0" y="262.0" font-size="15" fill="#e9e7e3" text-anchor="start">3.00  limit</text>
<text x="32.0" y="322.0" font-size="17" fill="#e9e7e3" text-anchor="start" font-weight="bold">Stall</text>
<text x="32.0" y="342.0" font-size="14" fill="#a7adb5" text-anchor="start">motor: 548 mNm · 14.7 A</text>
<text x="32.0" y="360.0" font-size="14" fill="#a7adb5" text-anchor="start">14.7 A = U/R (derived)</text>
<rect x="310.0" y="306.0" width="456.5" height="34.0" rx="3" fill="#e58a80" stroke="none" stroke-width="1.5" fill-opacity="0.85"/>
<text x="774.5" y="330.0" font-size="15" fill="#e9e7e3" text-anchor="start">6.52  fail</text>
<text x="32.0" y="462.0" font-size="15" fill="#a7adb5" text-anchor="start">Set the driver current limit to about 6.7 A, not the 14.7 A the motor draws at stall.</text>
</svg>
