<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" font-family="Inter, Arial, sans-serif">
<rect width="720" height="360" fill="#191b1f" rx="12"/>
<text x="24" y="30" fill="#e5e7eb" font-size="16" font-weight="bold">Resumable job with an output contract</text>
<g fill="none" stroke="#e5e7eb" stroke-width="1.5">
<rect x="24" y="60" width="130" height="60" rx="6"/><rect x="200" y="60" width="150" height="60" rx="6"/><rect x="396" y="60" width="140" height="60" rx="6"/><rect x="570" y="50" width="130" height="80" rx="6" stroke="#9ccd4e"/></g>
<g fill="#e5e7eb" font-size="13" text-anchor="middle">
<text x="89" y="86">config.json</text><text x="89" y="105">+ image tag</text>
<text x="275" y="86">sha256(config)</text><text x="275" y="105">= 3f9c2ab41d07</text>
<text x="466" y="86">job: step 0..N</text><text x="466" y="105">(may be killed)</text>
<text x="635" y="74" fill="#9ccd4e">runs/3f9c.../</text><text x="635" y="93">result.json</text><text x="635" y="109">manifest.json</text><text x="635" y="124" fill="#9ccd4e">DONE (last)</text></g>
<g stroke="#53b2dd" stroke-width="2" fill="#53b2dd"><line x1="154" y1="90" x2="198" y2="90"/><line x1="350" y1="90" x2="394" y2="90"/><line x1="536" y1="90" x2="568" y2="90"/>
<polygon points="198,85 208,90 198,95" stroke="none"/><polygon points="394,85 404,90 394,95" stroke="none"/><polygon points="568,85 578,90 568,95" stroke="none"/></g>
<text x="24" y="170" fill="#e5e7eb" font-size="14" font-weight="bold">Time line of one job with a crash (checkpoint every 25 steps)</text>
<line x1="40" y1="260" x2="680" y2="260" stroke="#e5e7eb" stroke-width="1.5"/>
<g stroke="#53b2dd" stroke-width="3"><line x1="40" y1="260" x2="400" y2="260"/></g>
<g fill="#9ccd4e"><rect x="115" y="244" width="6" height="32"/><rect x="190" y="244" width="6" height="32"/><rect x="265" y="244" width="6" height="32"/><rect x="340" y="244" width="6" height="32"/></g>
<text x="118" y="235" fill="#9ccd4e" font-size="13" text-anchor="middle">ckpt 25</text><text x="268" y="235" fill="#9ccd4e" font-size="13" text-anchor="middle">ckpt 75</text><text x="193" y="302" fill="#9ccd4e" font-size="13" text-anchor="middle">ckpt 50</text><text x="343" y="235" fill="#9ccd4e" font-size="13" text-anchor="middle">ckpt 100</text>
<g stroke="#d97936" stroke-width="3"><line x1="388" y1="246" x2="412" y2="274"/><line x1="412" y1="246" x2="388" y2="274"/></g>
<text x="400" y="200" fill="#d97936" font-size="13" text-anchor="middle">crash (step 110)</text>
<path d="M 400 280 Q 370 330 343 282" fill="none" stroke="#d97936" stroke-width="2" stroke-dasharray="5 3"/>
<text x="470" y="330" fill="#d97936" font-size="13" text-anchor="middle">backoff, resume from ckpt 100</text>
<g stroke="#53b2dd" stroke-width="3"><line x1="470" y1="260" x2="680" y2="260"/></g>
<text x="600" y="245" fill="#53b2dd" font-size="13" text-anchor="middle">steps 100..N</text>
</svg>
