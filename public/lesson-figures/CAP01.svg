<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="Inter, Arial, sans-serif" role="img">
<title>CAP01: spec, model and three agreeing kinematics</title>
<desc>A spec table feeds seeded world and robot models. Your own forward kinematics, the MJCF model in MuJoCo and the URDF must agree within 1 mm, and the acceptance tests check determinism, rest stability and reachability.</desc>
<rect width="900" height="470" fill="#111827" rx="12"/>
<text x="450" y="28" font-size="18" fill="#e5e7eb" text-anchor="middle" font-weight="bold">CAP01: measurable spec in, three kinematics that must agree out</text>
<rect x="30" y="60" width="230" height="90" rx="8" fill="#1f2937" stroke="#a78bfa" stroke-width="2"/>
<text x="145.0" y="94.2" font-size="12" fill="#e5e7eb" text-anchor="middle" font-weight="bold">SPEC.md</text>
<text x="145.0" y="109.2" font-size="12" fill="#e5e7eb" text-anchor="middle">SR1..SR10: metric,</text>
<text x="145.0" y="124.2" font-size="12" fill="#e5e7eb" text-anchor="middle">threshold, test name</text>
<rect x="335" y="60" width="230" height="90" rx="8" fill="#1f2937" stroke="#38bdf8" stroke-width="2"/>
<text x="450.0" y="94.2" font-size="12" fill="#e5e7eb" text-anchor="middle" font-weight="bold">Seeded Env</text>
<text x="450.0" y="109.2" font-size="12" fill="#e5e7eb" text-anchor="middle">reset(seed), step()</text>
<text x="450.0" y="124.2" font-size="12" fill="#e5e7eb" text-anchor="middle">np.random.default_rng</text>
<rect x="640" y="60" width="230" height="90" rx="8" fill="#1f2937" stroke="#a3e635" stroke-width="2"/>
<text x="755.0" y="94.2" font-size="12" fill="#e5e7eb" text-anchor="middle" font-weight="bold">Acceptance tests</text>
<text x="755.0" y="109.2" font-size="12" fill="#e5e7eb" text-anchor="middle">pytest tests/acceptance</text>
<text x="755.0" y="124.2" font-size="12" fill="#e5e7eb" text-anchor="middle">reads results</text>
<line x1="260" y1="105" x2="335" y2="105" stroke="#e5e7eb" stroke-width="2"/>
<polygon points="335,105 326.0,108.5 326.0,101.5" fill="#e5e7eb"/>
<line x1="565" y1="105" x2="640" y2="105" stroke="#e5e7eb" stroke-width="2"/>
<polygon points="640,105 631.0,108.5 631.0,101.5" fill="#e5e7eb"/>
<rect x="30" y="210" width="230" height="90" rx="8" fill="#1f2937" stroke="#f97316" stroke-width="2"/>
<text x="145.0" y="244.2" font-size="12" fill="#e5e7eb" text-anchor="middle" font-weight="bold">Your FK</text>
<text x="145.0" y="259.2" font-size="12" fill="#e5e7eb" text-anchor="middle">manipulation/</text>
<text x="145.0" y="274.2" font-size="12" fill="#e5e7eb" text-anchor="middle">kinematics.py</text>
<rect x="335" y="210" width="230" height="90" rx="8" fill="#1f2937" stroke="#f97316" stroke-width="2"/>
<text x="450.0" y="244.2" font-size="12" fill="#e5e7eb" text-anchor="middle" font-weight="bold">MJCF in MuJoCo</text>
<text x="450.0" y="259.2" font-size="12" fill="#e5e7eb" text-anchor="middle">corebot.xml</text>
<text x="450.0" y="274.2" font-size="12" fill="#e5e7eb" text-anchor="middle">site position</text>
<rect x="640" y="210" width="230" height="90" rx="8" fill="#1f2937" stroke="#f97316" stroke-width="2"/>
<text x="755.0" y="244.2" font-size="12" fill="#e5e7eb" text-anchor="middle" font-weight="bold">URDF</text>
<text x="755.0" y="259.2" font-size="12" fill="#e5e7eb" text-anchor="middle">corebot.urdf</text>
<text x="755.0" y="274.2" font-size="12" fill="#e5e7eb" text-anchor="middle">yourdfpy / pinocchio</text>
<line x1="145" y1="300" x2="145" y2="345" stroke="#f97316" stroke-width="2"/>
<polygon points="145,345 141.5,336.0 148.5,336.0" fill="#f97316"/>
<line x1="450" y1="300" x2="450" y2="345" stroke="#f97316" stroke-width="2"/>
<polygon points="450,345 446.5,336.0 453.5,336.0" fill="#f97316"/>
<line x1="755" y1="300" x2="755" y2="345" stroke="#f97316" stroke-width="2"/>
<polygon points="755,345 751.5,336.0 758.5,336.0" fill="#f97316"/>
<rect x="30" y="345" width="840" height="50" rx="8" fill="#1f2937" stroke="#e5e7eb" stroke-width="2"/>
<text x="450.0" y="374.6" font-size="13" fill="#e5e7eb" text-anchor="middle" font-weight="bold">max |p_FK - p_MuJoCo| &lt; 1 mm  and  |p_URDF - p_MJCF| &lt; 1 mm  (20 random configurations)</text>
<text x="450" y="425" font-size="13" fill="#fbbf24" text-anchor="middle">Also checked: same joint names and limits, mass within 2 %, 5 s rest drift, 95 % of table points reachable</text>
<text x="450" y="448" font-size="13" fill="#fbbf24" text-anchor="middle">Gate checks (bold in the lesson): determinism and forward kinematics</text>
<line x1="450" y1="150" x2="450" y2="210" stroke="#e5e7eb" stroke-width="2" stroke-dasharray="5 4"/>
<polygon points="450,210 446.5,201.0 453.5,201.0" fill="#e5e7eb"/>
</svg>
