<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" font-family="Inter, Arial, sans-serif">
<rect width="720" height="380" fill="#111827" rx="12"/>
<text x="360" y="30" fill="#e5e7eb" font-size="18" font-weight="bold" text-anchor="middle">Ill-conditioning: nearly parallel constraints amplify tiny changes</text>
<path d="M70,114.0 L670,234.0" stroke="#a3e635" stroke-width="3" fill="none"/>
<path d="M70,103.2 L670,259.2" stroke="#38bdf8" stroke-width="3" fill="none"/>
<path d="M70,95.2 L670,251.2" stroke="#f97316" stroke-width="3" fill="none" stroke-dasharray="8 5"/>
<circle cx="250" cy="150.0" r="7" fill="#e5e7eb"/><circle cx="383" cy="176.60000000000002" r="7" fill="#e5e7eb"/>
<text x="250" y="110.0" fill="#e5e7eb" font-size="14" text-anchor="middle">solution x</text>
<text x="313" y="242.60000000000002" fill="#e5e7eb" font-size="14">solution x' after change δ</text>
<path d="M256,164.0 L377,190.60000000000002" stroke="#e5e7eb" stroke-width="2" fill="none"/>
<text x="230" y="200.0" fill="#e5e7eb" font-size="14" text-anchor="middle">moves by ≈ κ·δ</text>
<rect x="60" y="270" width="600" height="92" rx="8" fill="#1f2937"/>
<text x="80" y="294" fill="#a3e635" font-size="14">green: row 1   </text>
<text x="200" y="294" fill="#38bdf8" font-size="14">blue: row 2 with exact b</text>
<text x="400" y="294" fill="#f97316" font-size="14">dashed orange: row 2 after a tiny δ in b</text>
<text x="360" y="320" fill="#e5e7eb" font-size="14" text-anchor="middle">Small residual does not imply small error: ‖x − x'‖/‖x‖ ≤ κ(A) · ‖r‖/‖b‖</text>
<text x="360" y="344" fill="#e5e7eb" font-size="13" text-anchor="middle">Angle exaggerated. For A = [[1,1],[1,1.0001]], κ ≈ 4·10⁴.</text>
</svg>