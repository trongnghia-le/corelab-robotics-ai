<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" font-family="Inter, sans-serif">
<title>Columns are landing points; the order changes the landing</title>
<desc>Left: the unit square and its image under the shear A=[[1,2],[0,1]]; the columns are A e1=(1,0) and A e2=(2,1). Right: with B=diag(2,1), AB e2=(2,1) but BA e2=(4,1).</desc>
<defs><marker id="M03arr-6fc693" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 z" fill="#6fc693"/></marker><marker id="M03arr-86abe2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 z" fill="#86abe2"/></marker><marker id="M03arr-a7adb5" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 z" fill="#a7adb5"/></marker><marker id="M03arr-e0904f" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 z" fill="#e0904f"/></marker></defs>
<rect width="900" height="460" rx="14" fill="#17181b"/>
<text x="32" y="44" font-size="22" fill="#e9e7e3" text-anchor="start" font-weight="bold">Columns are landing points; the order changes the landing</text>
<rect x="32" y="64" width="404" height="372" rx="8" fill="#22252a" stroke="#3d4148" stroke-width="1.5"/>
<rect x="464" y="64" width="404" height="372" rx="8" fill="#22252a" stroke="#3d4148" stroke-width="1.5"/>
<text x="48" y="92" font-size="17" fill="#e9e7e3" text-anchor="start" font-weight="bold">Columns of A = images of e₁ and e₂</text>
<text x="480" y="92" font-size="17" fill="#e9e7e3" text-anchor="start" font-weight="bold">Order matters: AB e₂ versus BA e₂</text>
<line x1="88" y1="350" x2="326" y2="350" stroke="#a7adb5" stroke-width="1.5" stroke-linecap="round"/>
<line x1="88" y1="350" x2="88" y2="210" stroke="#a7adb5" stroke-width="1.5" stroke-linecap="round"/>
<line x1="158" y1="350" x2="158" y2="355" stroke="#a7adb5" stroke-width="1.5" stroke-linecap="round"/>
<text x="158" y="372" font-size="14" fill="#a7adb5" text-anchor="middle">1</text>
<line x1="228" y1="350" x2="228" y2="355" stroke="#a7adb5" stroke-width="1.5" stroke-linecap="round"/>
<text x="228" y="372" font-size="14" fill="#a7adb5" text-anchor="middle">2</text>
<line x1="298" y1="350" x2="298" y2="355" stroke="#a7adb5" stroke-width="1.5" stroke-linecap="round"/>
<text x="298" y="372" font-size="14" fill="#a7adb5" text-anchor="middle">3</text>
<line x1="83" y1="280" x2="88" y2="280" stroke="#a7adb5" stroke-width="1.5" stroke-linecap="round"/>
<text x="76" y="285" font-size="14" fill="#a7adb5" text-anchor="end">1</text>
<text x="330" y="355" font-size="15" fill="#a7adb5" text-anchor="start">x</text>
<text x="84" y="200" font-size="15" fill="#a7adb5" text-anchor="middle">y</text>
<polygon points="88,350 158,350 158,280 88,280" fill="#86abe2" fill-opacity="0.18" stroke="#86abe2" stroke-width="2" stroke-linejoin="round"/>
<polygon points="88,350 158,350 298,280 228,280" fill="#e0904f" fill-opacity="0.15" stroke="#e0904f" stroke-width="2" stroke-dasharray="6 4" stroke-linejoin="round"/>
<line x1="88" y1="350" x2="155.9" y2="350" stroke="#86abe2" stroke-width="3" stroke-linecap="round" marker-end="url(#M03arr-86abe2)"/>
<line x1="88" y1="350" x2="88" y2="283.5" stroke="#86abe2" stroke-width="3" stroke-linecap="round" marker-end="url(#M03arr-86abe2)"/>
<line x1="88" y1="350" x2="223.1" y2="282.45" stroke="#e0904f" stroke-width="3" stroke-linecap="round" marker-end="url(#M03arr-e0904f)"/>
<text x="98" y="270" font-size="15" fill="#86abe2" text-anchor="start" font-weight="600">e₂</text>
<text x="123" y="372" font-size="15" fill="#86abe2" text-anchor="middle" font-weight="600">e₁</text>
<text x="222" y="268" font-size="15" fill="#e0904f" text-anchor="end" font-weight="600">A e₂</text>
<text x="48" y="128" font-size="15" fill="#86abe2" text-anchor="start" font-weight="600">e₁ stays at A e₁ = (1, 0)</text>
<text x="48" y="152" font-size="15" fill="#e0904f" text-anchor="start" font-weight="600">e₂ lands at A e₂ = (2, 1)</text>
<rect x="278" y="118" width="14" height="14" rx="2" fill="#86abe2" stroke="#86abe2" stroke-width="1.5" fill-opacity="0.25"/>
<text x="298" y="131" font-size="14" fill="#a7adb5" text-anchor="start">unit square</text>
<rect x="278" y="142" width="14" height="14" rx="2" fill="#e0904f" stroke="#e0904f" stroke-width="1.5" stroke-dasharray="3 2" fill-opacity="0.25"/>
<text x="298" y="155" font-size="14" fill="#a7adb5" text-anchor="start">image under A</text>
<text x="48" y="418" font-size="14" fill="#a7adb5" text-anchor="start">A = [[1, 2], [0, 1]]; column 1 = (1, 0), column 2 = (2, 1)</text>
<line x1="520" y1="350" x2="842" y2="350" stroke="#a7adb5" stroke-width="1.5" stroke-linecap="round"/>
<line x1="520" y1="350" x2="520" y2="210" stroke="#a7adb5" stroke-width="1.5" stroke-linecap="round"/>
<line x1="590" y1="350" x2="590" y2="355" stroke="#a7adb5" stroke-width="1.5" stroke-linecap="round"/>
<text x="590" y="372" font-size="14" fill="#a7adb5" text-anchor="middle">1</text>
<line x1="660" y1="350" x2="660" y2="355" stroke="#a7adb5" stroke-width="1.5" stroke-linecap="round"/>
<text x="660" y="372" font-size="14" fill="#a7adb5" text-anchor="middle">2</text>
<line x1="730" y1="350" x2="730" y2="355" stroke="#a7adb5" stroke-width="1.5" stroke-linecap="round"/>
<text x="730" y="372" font-size="14" fill="#a7adb5" text-anchor="middle">3</text>
<line x1="800" y1="350" x2="800" y2="355" stroke="#a7adb5" stroke-width="1.5" stroke-linecap="round"/>
<text x="800" y="372" font-size="14" fill="#a7adb5" text-anchor="middle">4</text>
<line x1="515" y1="280" x2="520" y2="280" stroke="#a7adb5" stroke-width="1.5" stroke-linecap="round"/>
<text x="508" y="285" font-size="14" fill="#a7adb5" text-anchor="end">1</text>
<text x="846" y="355" font-size="15" fill="#a7adb5" text-anchor="start">x</text>
<text x="516" y="200" font-size="15" fill="#a7adb5" text-anchor="middle">y</text>
<line x1="520" y1="350" x2="520" y2="283.5" stroke="#86abe2" stroke-width="3" stroke-linecap="round" marker-end="url(#M03arr-86abe2)"/>
<text x="530" y="270" font-size="15" fill="#86abe2" text-anchor="start" font-weight="600">e₂</text>
<text x="555" y="372" font-size="15" fill="#86abe2" text-anchor="middle" font-weight="600">e₁</text>
<line x1="520" y1="350" x2="655.1" y2="282.45" stroke="#6fc693" stroke-width="3" stroke-linecap="round" marker-end="url(#M03arr-6fc693)"/>
<line x1="520" y1="350" x2="795.1" y2="282.45" stroke="#e0904f" stroke-width="3" stroke-linecap="round" marker-end="url(#M03arr-e0904f)"/>
<line x1="660" y1="280" x2="793" y2="280" stroke="#a7adb5" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 4" marker-end="url(#M03arr-a7adb5)"/>
<circle cx="660" cy="280" r="5" fill="#6fc693"/>
<circle cx="800" cy="280" r="5" fill="#e0904f"/>
<text x="652" y="266" font-size="15" fill="#6fc693" text-anchor="end" font-weight="600">AB e₂ = (2, 1)</text>
<text x="806" y="266" font-size="15" fill="#e0904f" text-anchor="end" font-weight="600">BA e₂ = (4, 1)</text>
<text x="480" y="128" font-size="15" fill="#6fc693" text-anchor="start" font-weight="600">AB = A(B e₂):</text>
<text x="610" y="128" font-size="14" fill="#a7adb5" text-anchor="start">B e₂ = e₂, then A shears</text>
<text x="480" y="152" font-size="15" fill="#e0904f" text-anchor="start" font-weight="600">BA = B(A e₂):</text>
<text x="610" y="152" font-size="14" fill="#a7adb5" text-anchor="start">A e₂ = (2, 1), then B doubles x</text>
<text x="480" y="418" font-size="14" fill="#a7adb5" text-anchor="start">B = diag(2, 1) scales x by 2; A as on the left</text>
</svg>
