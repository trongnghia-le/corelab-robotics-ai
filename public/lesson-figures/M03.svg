<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" font-family="Inter, Arial, sans-serif" font-size="14">
<rect width="720" height="330" fill="#111827" rx="12"/>
<defs><marker id="b" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/></marker>
<marker id="g" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#a3e635"/></marker>
<marker id="o" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#f97316"/></marker></defs>
<g fill="#e5e7eb">
<text x="24" y="34" font-size="15" font-weight="bold">Columns are where the basis vectors go</text>
<text x="400" y="34" font-size="15" font-weight="bold">Order matters: AB e2 vs BA e2</text>
<text x="24" y="300" font-size="13">A = [[1,2],[0,1]]  columns (1,0) and (2,1)</text>
<text x="400" y="300" font-size="13">B = diag(2,1);  AB e2 = A(B e2),  BA e2 = B(A e2)</text>
<text x="140" y="196" fill="#f97316">A e2 = (2,1)</text>
<text x="108" y="266" fill="#38bdf8">A e1 = e1</text>
<text x="66" y="198" font-size="13">e2</text>
<text x="224" y="254" font-size="13">x</text><text x="52" y="126" font-size="13">y</text>
<text x="500" y="196" fill="#a3e635">AB e2 = (2,1)</text>
<text x="548" y="196" font-size="1"> </text>
<text x="598" y="184" fill="#f97316">BA e2 = (4,1)</text>
<text x="640" y="266" font-size="13">x</text><text x="412" y="126" font-size="13">y</text>
</g>
<g stroke="#e5e7eb" stroke-width="1.5" fill="none"><line x1="60" y1="250" x2="230" y2="250"/><line x1="60" y1="250" x2="60" y2="120"/><line x1="420" y1="250" x2="640" y2="250"/><line x1="420" y1="250" x2="420" y2="120"/></g>
<polygon points="60,250 105,250 105,205 60,205" fill="#38bdf8" fill-opacity="0.2" stroke="#38bdf8" stroke-width="2"/>
<polygon points="60,250 105,250 195,205 150,205" fill="#f97316" fill-opacity="0.2" stroke="#f97316" stroke-width="2"/>
<line x1="60" y1="250" x2="104" y2="250" stroke="#38bdf8" stroke-width="3" marker-end="url(#b)"/>
<line x1="60" y1="250" x2="148" y2="206" stroke="#f97316" stroke-width="3" marker-end="url(#o)"/>
<line x1="420" y1="250" x2="508" y2="206" stroke="#a3e635" stroke-width="3" marker-end="url(#g)"/>
<line x1="420" y1="250" x2="598" y2="206" stroke="#f97316" stroke-width="3" marker-end="url(#o)"/>
<g stroke="#e5e7eb" stroke-width="1" stroke-dasharray="3 4" opacity="0.5"><line x1="420" y1="206" x2="598" y2="206"/><line x1="508" y1="206" x2="508" y2="250"/><line x1="598" y1="206" x2="598" y2="250"/></g>
<g fill="#e5e7eb" font-size="13"><text x="500" y="270">2</text><text x="590" y="270">4</text><text x="402" y="210">1</text></g>
</svg>