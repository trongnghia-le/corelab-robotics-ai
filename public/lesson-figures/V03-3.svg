<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="Inter, sans-serif">
<title>Back-projection: one pixel, many depths</title>
<desc>Side view of a camera 0.8 m above the floor. The ray through pixel (400, 330) has direction (0.16, 0.18, 1); the points at depth 1, 2, 4 m on it give the same pixel, and it meets the floor at Z = 4.444 m.</desc>
<defs><marker id="V03cae9e7e3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 z" fill="#e9e7e3"/></marker></defs>
<rect width="900" height="470" rx="14" fill="#17181b"/>
<text x="32" y="44" font-size="22" fill="#e9e7e3" text-anchor="start" font-weight="bold">Back-projection: one pixel, many depths</text>
<line x1="150" y1="150" x2="836" y2="150" stroke="#a7adb5" stroke-width="2" stroke-linecap="round" stroke-dasharray="7 6"/>
<text x="836" y="138" font-size="15" fill="#a7adb5" text-anchor="end" font-weight="normal">optical axis (horizontal)</text>
<line x1="130" y1="262" x2="836" y2="262" stroke="#e0c169" stroke-width="3" stroke-linecap="round"/>
<text x="130" y="288" font-size="15" fill="#e0c169" text-anchor="start" font-weight="600">floor: Y = 0.8 m (y points down)</text>
<line x1="100" y1="150" x2="100" y2="262" stroke="#e9e7e3" stroke-width="1.5" stroke-linecap="round" marker-end="url(#V03cae9e7e3)"/>
<line x1="100" y1="262" x2="100" y2="150" stroke="#e9e7e3" stroke-width="1.5" stroke-linecap="round" marker-end="url(#V03cae9e7e3)"/>
<text x="90" y="211" font-size="15" fill="#e9e7e3" text-anchor="end" font-weight="normal">h = 0.8 m</text>
<line x1="150" y1="150" x2="772.2" y2="262" stroke="#e0904f" stroke-width="2.5" stroke-linecap="round"/>
<circle cx="150" cy="150" r="6" fill="#e9e7e3"/>
<text x="140" y="136" font-size="15" fill="#e9e7e3" text-anchor="end" font-weight="normal">camera</text>
<line x1="225" y1="110" x2="225" y2="210" stroke="#86abe2" stroke-width="3" stroke-linecap="round"/>
<text x="225" y="98" font-size="14" fill="#86abe2" text-anchor="middle" font-weight="normal">image plane</text>
<circle cx="225" cy="162.6" r="6" fill="#6fc693"/>
<text x="213" y="192.6" font-size="14" fill="#6fc693" text-anchor="end" font-weight="600">pixel v = 330</text>
<circle cx="290" cy="175.2" r="6" fill="#6fc693"/>
<text x="300" y="165.2" font-size="14" fill="#6fc693" text-anchor="start" font-weight="600">Z = 1 m, Y = 0.18 m</text>
<circle cx="430" cy="200.4" r="6" fill="#6fc693"/>
<text x="440" y="190.4" font-size="14" fill="#6fc693" text-anchor="start" font-weight="600">Z = 2 m, Y = 0.36 m</text>
<circle cx="710" cy="250.8" r="6" fill="#6fc693"/>
<text x="680" y="234.8" font-size="14" fill="#6fc693" text-anchor="start" font-weight="600">Z = 4 m, Y = 0.72 m</text>
<circle cx="772.2" cy="262" r="8" fill="#e0904f"/>
<text x="822.2" y="288" font-size="15" fill="#e0904f" text-anchor="end" font-weight="600">floor hit: Z = 4.444 m</text>
<line x1="772.2" y1="262" x2="772.2" y2="262" stroke="#e0904f" stroke-width="1" stroke-linecap="round"/>
<line x1="290" y1="144" x2="290" y2="156" stroke="#a7adb5" stroke-width="1.5" stroke-linecap="round"/>
<line x1="430" y1="144" x2="430" y2="156" stroke="#a7adb5" stroke-width="1.5" stroke-linecap="round"/>
<line x1="570" y1="144" x2="570" y2="156" stroke="#a7adb5" stroke-width="1.5" stroke-linecap="round"/>
<line x1="710" y1="144" x2="710" y2="156" stroke="#a7adb5" stroke-width="1.5" stroke-linecap="round"/>
<rect x="32" y="326" width="836" height="118" rx="10" fill="#22252a"/>
<text x="52" y="358" font-size="15" fill="#e9e7e3" text-anchor="start" font-weight="normal">x = (400 − 320)/500 = 0.16,  y = (330 − 240)/500 = 0.18  →  ray direction (0.16, 0.18, 1)</text>
<text x="52" y="388" font-size="15" fill="#e0904f" text-anchor="start" font-weight="600">floor: Y = Z·y = 0.8  →  Z = 0.8 / 0.18 = 4.444 m,  X = 0.16 · 4.444 = 0.711 m</text>
<text x="52" y="418" font-size="15" fill="#a7adb5" text-anchor="start" font-weight="normal">v = 331 (one pixel lower) gives Z = 4.396 m</text>
</svg>
