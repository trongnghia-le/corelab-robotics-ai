<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 360" font-family="Inter, Arial, sans-serif">
<rect width="780" height="360" fill="#191b1f" rx="12"/>
<text x="30" y="34" font-size="16" fill="#e5e7eb" font-weight="bold">A. Image to patch tokens</text>
<text x="440" y="34" font-size="16" fill="#e5e7eb" font-weight="bold">B. Every token attends to every token</text>
<g stroke="#53b2dd" stroke-width="2" fill="none">
<rect x="40" y="60" width="160" height="160"/>
<line x1="80" y1="60" x2="80" y2="220"/><line x1="120" y1="60" x2="120" y2="220"/><line x1="160" y1="60" x2="160" y2="220"/>
<line x1="40" y1="100" x2="200" y2="100"/><line x1="40" y1="140" x2="200" y2="140"/><line x1="40" y1="180" x2="200" y2="180"/></g>
<g font-size="13" fill="#e5e7eb" text-anchor="middle">
<text x="60" y="85">1</text><text x="100" y="85">2</text><text x="140" y="85">3</text><text x="180" y="85">4</text>
<text x="60" y="125">5</text><text x="100" y="125">6</text><text x="140" y="125">7</text><text x="180" y="125">8</text>
<text x="60" y="165">9</text><text x="100" y="165">10</text><text x="140" y="165">11</text><text x="180" y="165">12</text>
<text x="60" y="205">13</text><text x="100" y="205">14</text><text x="140" y="205">15</text><text x="180" y="205">16</text></g>
<text x="40" y="245" font-size="14" fill="#e5e7eb">224 / 16 = 14 per side, 196 patches</text>
<text x="40" y="266" font-size="14" fill="#e5e7eb">each patch = 16x16x3 = 768 numbers</text>
<rect x="40" y="290" width="40" height="28" fill="#d97936"/><text x="46" y="309" font-size="13" fill="#191b1f">CLS</text>
<rect x="84" y="290" width="40" height="28" fill="#9ccd4e"/><rect x="128" y="290" width="40" height="28" fill="#9ccd4e"/><rect x="172" y="290" width="40" height="28" fill="#9ccd4e"/>
<text x="220" y="309" font-size="14" fill="#e5e7eb">... 196 tokens + CLS = 197</text>
<text x="40" y="344" font-size="13" fill="#e5e7eb">token = linear(patch) + position code</text>
<g stroke="#e5e7eb" stroke-width="1"><rect x="470" y="60" width="180" height="180" fill="#272a2f"/></g>
<rect x="470" y="60" width="180" height="30" fill="#d97936" opacity="0.55"/>
<g stroke="#53b2dd" stroke-width="1" opacity="0.6"><line x1="470" y1="90" x2="650" y2="90"/><line x1="470" y1="120" x2="650" y2="120"/><line x1="470" y1="150" x2="650" y2="150"/><line x1="470" y1="180" x2="650" y2="180"/><line x1="470" y1="210" x2="650" y2="210"/><line x1="500" y1="60" x2="500" y2="240"/><line x1="530" y1="60" x2="530" y2="240"/><line x1="560" y1="60" x2="560" y2="240"/><line x1="590" y1="60" x2="590" y2="240"/><line x1="620" y1="60" x2="620" y2="240"/></g>
<text x="660" y="80" font-size="14" fill="#d97936">row i</text>
<text x="470" y="262" font-size="14" fill="#e5e7eb">N x N matrix per head, rows sum to 1</text>
<text x="470" y="288" font-size="14" fill="#e5e7eb">N = 197 gives 38,809 entries</text>
<text x="470" y="310" font-size="14" fill="#e5e7eb">N = 577 (384 px) gives 332,929</text>
<text x="470" y="332" font-size="14" fill="#9ccd4e">double the side: 4x tokens, 16x matrix</text>
</svg>
