<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" font-family="Inter, sans-serif">
<title>Memory of lists, arrays and pairwise distance computations</title>
<desc>Left: bytes per element, 32 for a list of floats, 8 for float64 and 4 for float32. Right: stacked bars for the pairwise distance of 800 points, a broadcast version with a 15.36 MB temporary and a chunked version with a 1.92 MB block, both with a 5.12 MB output.</desc>
<rect width="900" height="440" rx="14" fill="#17181b"/>

<text x="32" y="44" font-size="22" font-weight="bold" fill="#e9e7e3">Memory: per element and per computation</text>
<rect x="32" y="72" width="372" height="340" rx="10" fill="#22252a"/>
<rect x="428" y="72" width="440" height="340" rx="10" fill="#22252a"/>
<text x="52" y="102" font-size="17" font-weight="bold" fill="#e9e7e3">Bytes per element</text>
<text x="448" y="102" font-size="17" font-weight="bold" fill="#e9e7e3">Pairwise distances of 800 points (MB)</text>
<text x="60" y="138" font-size="15" fill="#e9e7e3">list of floats</text>
<rect x="60" y="148" width="192" height="34" rx="0" fill="#e0904f"/>
<text x="156" y="170" font-size="15" font-weight="600" text-anchor="middle" fill="#17181b">24</text>
<rect x="252" y="148" width="64" height="34" rx="0" fill="#ae9ce6"/>
<text x="284" y="170" font-size="15" font-weight="600" text-anchor="middle" fill="#17181b">8</text>
<text x="326" y="170" font-size="15" font-weight="600" fill="#e9e7e3">= 32</text>
<text x="60" y="210" font-size="15" fill="#e9e7e3">float64 array</text>
<rect x="60" y="220" width="64" height="34" rx="0" fill="#86abe2"/>
<text x="92" y="242" font-size="15" font-weight="600" text-anchor="middle" fill="#17181b">8</text>
<text x="134" y="242" font-size="15" font-weight="600" fill="#e9e7e3">= 8</text>
<text x="60" y="282" font-size="15" fill="#e9e7e3">float32 array</text>
<rect x="60" y="292" width="32" height="34" rx="0" fill="#6cc6ba"/>
<text x="102" y="314" font-size="15" font-weight="600" fill="#e9e7e3">= 4</text>
<rect x="60" y="356" width="12" height="12" rx="2" fill="#e0904f"/>
<text x="80" y="368" font-size="15" fill="#e9e7e3">float object (24 B)</text>
<rect x="60" y="380" width="12" height="12" rx="2" fill="#ae9ce6"/>
<text x="80" y="392" font-size="15" fill="#e9e7e3">list pointer (8 B)</text>
<text x="448" y="138" font-size="15" fill="#e9e7e3">broadcast difference</text>
<rect x="448" y="148" width="261.1" height="38" rx="0" fill="#e0904f"/>
<rect x="709.1" y="148" width="87" height="38" rx="0" fill="#86abe2"/>
<text x="578.6" y="172" font-size="15" font-weight="600" text-anchor="middle" fill="#17181b">15.36</text>
<text x="752.6" y="172" font-size="15" font-weight="600" text-anchor="middle" fill="#17181b">5.12</text>
<text x="448" y="208" font-size="14" fill="#a7adb5">15.36 + 5.12 = 20.48 MB</text>
<text x="448" y="228" font-size="14" fill="#a7adb5">measured peak: 20.5 MB</text>
<text x="448" y="268" font-size="15" fill="#e9e7e3">chunks of 100 rows</text>
<rect x="448" y="278" width="32.6" height="38" rx="0" fill="#ae9ce6"/>
<rect x="480.6" y="278" width="87" height="38" rx="0" fill="#86abe2"/>
<text x="524.2" y="302" font-size="15" font-weight="600" text-anchor="middle" fill="#17181b">5.12</text>
<rect x="567.7" y="278" width="11.2" height="38" rx="0" fill="#5b6068"/>
<text x="448" y="338" font-size="14" fill="#a7adb5">1.92 + 5.12 + 0.66 = 7.70 MB</text>
<text x="448" y="358" font-size="14" fill="#a7adb5">measured peak: 7.7 MB</text>
<rect x="448" y="388" width="12" height="12" rx="2" fill="#e0904f"/>
<text x="468" y="400" font-size="15" fill="#e9e7e3">difference</text>
<rect x="584" y="388" width="12" height="12" rx="2" fill="#86abe2"/>
<text x="604" y="400" font-size="15" fill="#e9e7e3">output</text>
<rect x="674" y="388" width="12" height="12" rx="2" fill="#ae9ce6"/>
<text x="694" y="400" font-size="15" fill="#e9e7e3">one block</text>
<rect x="790" y="388" width="12" height="12" rx="2" fill="#5b6068"/>
<text x="810" y="400" font-size="15" fill="#e9e7e3">other</text>
</svg>
