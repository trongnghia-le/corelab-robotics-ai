<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="Inter, sans-serif">
<title>Läuchli matrix: the normal equations fail while QR does not</title>
<desc>Relative error of the solution of a least-squares problem with the Läuchli matrix (b = (1, 1, 0)) against delta on log-log axes for QR and the normal equations. The normal equations lose accuracy as 1/delta squared and fail when delta is 1e-8 or smaller.</desc>
