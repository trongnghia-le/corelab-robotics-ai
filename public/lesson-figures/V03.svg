<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="Inter, sans-serif">
<title>Pinhole projection: similar triangles</title>
<desc>Top view of a pinhole camera. A point at X = 0.2 m and Z = 2 m projects to 50 px from the principal point for fx = 500; a point at X = 0.4 m, Z = 4 m on the same ray gives the same pixel.</desc>
<defs><marker id="V03aaa7adb5" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 z" fill="#a7adb5"/></marker></defs>
<rect width="900" height="520" rx="14" fill="#17181b"/>
<text x="32" y="44" font-size="22" fill="#e9e7e3" text-anchor="start" font-weight="bold">Pinhole projection: similar triangles</text>
<text x="32" y="76" font-size="14" fill="#a7adb5" text-anchor="start" font-weight="normal">lateral scale ×3 stretched; plane at Z = f drawn with 1 px = 1 mm: not to scale</text>
<line x1="320" y1="273" x2="320" y2="257" stroke="#a7adb5" stroke-width="1.5" stroke-linecap="round"/>
<text x="320" y="295" font-size="14" fill="#a7adb5" text-anchor="middle" font-weight="normal">1</text>
<line x1="450" y1="273" x2="450" y2="257" stroke="#a7adb5" stroke-width="1.5" stroke-linecap="round"/>
<text x="450" y="295" font-size="14" fill="#a7adb5" text-anchor="middle" font-weight="normal">2</text>
<line x1="580" y1="273" x2="580" y2="257" stroke="#a7adb5" stroke-width="1.5" stroke-linecap="round"/>
<text x="580" y="295" font-size="14" fill="#a7adb5" text-anchor="middle" font-weight="normal">3</text>
<line x1="710" y1="273" x2="710" y2="257" stroke="#a7adb5" stroke-width="1.5" stroke-linecap="round"/>
<text x="710" y="295" font-size="14" fill="#a7adb5" text-anchor="middle" font-weight="normal">4</text>
<line x1="190" y1="265" x2="801" y2="265" stroke="#a7adb5" stroke-width="2" stroke-linecap="round" stroke-dasharray="7 6" marker-end="url(#V03aaa7adb5)"/>
<text x="797" y="319" font-size="15" fill="#a7adb5" text-anchor="end" font-weight="normal">depth Z (m)</text>
<text x="797" y="253" font-size="15" fill="#a7adb5" text-anchor="end" font-weight="normal">optical axis z</text>
<line x1="255" y1="185" x2="255" y2="345" stroke="#86abe2" stroke-width="3" stroke-linecap="round"/>
<text x="247" y="367" font-size="15" fill="#86abe2" text-anchor="start" font-weight="600">image plane at Z = f</text>
<line x1="190" y1="265" x2="710" y2="105" stroke="#e0904f" stroke-width="2.5" stroke-linecap="round"/>
<line x1="450" y1="185" x2="450" y2="265" stroke="#3d4148" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 5"/>
<line x1="710" y1="105" x2="710" y2="265" stroke="#3d4148" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 5"/>
<circle cx="190" cy="265" r="6" fill="#e9e7e3"/>
<text x="180" y="295" font-size="15" fill="#e9e7e3" text-anchor="end" font-weight="normal">O (optical centre)</text>
<circle cx="450" cy="185" r="7" fill="#e0904f"/>
<text x="444" y="171" font-size="15" fill="#e0904f" text-anchor="end" font-weight="600">P: X = 0.2 m, Z = 2 m</text>
<circle cx="710" cy="105" r="7" fill="#e0904f"/>
<text x="704" y="91" font-size="15" fill="#e0904f" text-anchor="end" font-weight="600">same ray: X = 0.4 m, Z = 4 m</text>
<circle cx="255" cy="245" r="7" fill="#6fc693"/>
<text x="241" y="229" font-size="15" fill="#6fc693" text-anchor="end" font-weight="600">p: 50 px from c</text>
<circle cx="255" cy="265" r="4" fill="#e9e7e3"/>
<text x="247" y="317" font-size="14" fill="#a7adb5" text-anchor="end" font-weight="normal">c (principal point)</text>
<text x="245" y="189" font-size="15" fill="#a7adb5" text-anchor="end" font-weight="normal">X</text>
<rect x="32" y="396" width="836" height="112" rx="10" fill="#22252a"/>
<text x="52" y="428" font-size="17" fill="#e9e7e3" text-anchor="start" font-weight="bold">u = fx X/Z + cx = 500 · 0.2 / 2 + 320 = 370</text>
<text x="52" y="456" font-size="15" fill="#e0904f" text-anchor="start" font-weight="600">offset u − cx = 50 px; the same for every point on the ray</text>
<text x="52" y="484" font-size="15" fill="#86abe2" text-anchor="start" font-weight="600">larger f: bigger image, narrower field of view</text>
</svg>
