<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" font-family="Inter, Arial, sans-serif" font-size="14">
<rect width="760" height="340" fill="#191b1f" rx="12"/>
<text x="20" y="30" fill="#e5e7eb" font-size="16" font-weight="bold">Pinhole projection (side view, y shown)</text>
<line x1="40" y1="170" x2="560" y2="170" stroke="#e5e7eb" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="565" y="175" fill="#e5e7eb">optical axis (z)</text>
<circle cx="200" cy="170" r="5" fill="#e5e7eb"/>
<text x="185" y="195" fill="#e5e7eb">centre</text>
<line x1="320" y1="90" x2="320" y2="250" stroke="#53b2dd" stroke-width="3"/>
<text x="290" y="270" fill="#53b2dd">image plane</text>
<line x1="500" y1="170" x2="500" y2="90" stroke="#d97936" stroke-width="3"/>
<circle cx="500" cy="90" r="6" fill="#d97936"/>
<text x="470" y="75" fill="#d97936">point (X, Y, Z)</text>
<line x1="200" y1="170" x2="500" y2="90" stroke="#d97936" stroke-width="2"/>
<line x1="200" y1="170" x2="320" y2="138" stroke="#d97936" stroke-width="2"/>
<circle cx="320" cy="138" r="5" fill="#9ccd4e"/>
<text x="330" y="160" fill="#9ccd4e">pixel offset f Y / Z</text>
<line x1="200" y1="215" x2="320" y2="215" stroke="#53b2dd" stroke-width="1.5"/>
<text x="235" y="235" fill="#53b2dd">f</text>
<line x1="200" y1="300" x2="500" y2="300" stroke="#e5e7eb" stroke-width="1.5"/>
<text x="330" y="322" fill="#e5e7eb">depth Z</text>
<text x="515" y="135" fill="#d97936">Y</text>
<text x="580" y="60" fill="#e5e7eb">u = fx X/Z + cx</text>
<text x="580" y="85" fill="#e5e7eb">v = fy Y/Z + cy</text>
<text x="580" y="125" fill="#9ccd4e">same ray, same pixel:</text>
<text x="580" y="147" fill="#9ccd4e">depth is lost</text>
<text x="580" y="215" fill="#53b2dd">larger f: bigger image,</text>
<text x="580" y="237" fill="#53b2dd">narrower field of view</text>
</svg>
