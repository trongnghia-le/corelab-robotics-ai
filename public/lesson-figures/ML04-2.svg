<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" font-family="Inter, sans-serif">
<title>The tent map and its compositions</title>
<desc>Three plots on [0,1]: T has 2 linear pieces from 2 hidden units, T composed twice has 4 pieces from 4 units, composed three times 8 pieces from 6 units.</desc>
<defs><marker id="m2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs>
<rect width="900" height="450" rx="14" fill="#17181b"/>
<text x="32" y="44" font-size="22" fill="#e9e7e3" text-anchor="start" font-weight="bold">The tent map and its compositions</text>
<rect x="32" y="68" width="262" height="316" rx="8" fill="#22252a" stroke="#3d4148" stroke-width="1.5"/>
<text x="48" y="98" font-size="17" fill="#e9e7e3" text-anchor="start" font-weight="bold">l = 1: T</text>
<rect x="76" y="128" width="190" height="180" fill="none" stroke="#3d4148" stroke-width="1.5"/>
<line x1="76" y1="308" x2="266" y2="308" stroke="#3d4148" stroke-width="1" stroke-linecap="round" stroke-opacity="0.6"/>
<line x1="76" y1="218" x2="266" y2="218" stroke="#3d4148" stroke-width="1" stroke-linecap="round" stroke-opacity="0.6"/>
<line x1="76" y1="128" x2="266" y2="128" stroke="#3d4148" stroke-width="1" stroke-linecap="round" stroke-opacity="0.6"/>
<polyline points="76,308 171,128 266,308" fill="none" stroke="#e0904f" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="76" cy="308" r="4" fill="#e0904f"/>
<circle cx="171" cy="128" r="4" fill="#e0904f"/>
<circle cx="266" cy="308" r="4" fill="#e0904f"/>
<text x="76" y="328" font-size="14" fill="#a7adb5" text-anchor="middle">0</text>
<text x="171" y="328" font-size="14" fill="#a7adb5" text-anchor="middle">0.5</text>
<text x="266" y="328" font-size="14" fill="#a7adb5" text-anchor="middle">1</text>
<text x="68" y="313" font-size="14" fill="#a7adb5" text-anchor="end">0</text>
<text x="68" y="223" font-size="14" fill="#a7adb5" text-anchor="end">0.5</text>
<text x="68" y="133" font-size="14" fill="#a7adb5" text-anchor="end">1</text>
<text x="171" y="350" font-size="15" fill="#a7adb5" text-anchor="middle">x</text>
<text x="48" y="118" font-size="15" fill="#a7adb5" text-anchor="start">T(x)</text>
<text x="48" y="368" font-size="15" fill="#e9e7e3" text-anchor="start" font-weight="600">2 pieces, 2 units</text>
<rect x="318" y="68" width="262" height="316" rx="8" fill="#22252a" stroke="#3d4148" stroke-width="1.5"/>
<text x="334" y="98" font-size="17" fill="#e9e7e3" text-anchor="start" font-weight="bold">l = 2: T∘T</text>
<rect x="362" y="128" width="190" height="180" fill="none" stroke="#3d4148" stroke-width="1.5"/>
<line x1="362" y1="308" x2="552" y2="308" stroke="#3d4148" stroke-width="1" stroke-linecap="round" stroke-opacity="0.6"/>
<line x1="362" y1="218" x2="552" y2="218" stroke="#3d4148" stroke-width="1" stroke-linecap="round" stroke-opacity="0.6"/>
<line x1="362" y1="128" x2="552" y2="128" stroke="#3d4148" stroke-width="1" stroke-linecap="round" stroke-opacity="0.6"/>
<polyline points="362,308 409.5,128 457,308 504.5,128 552,308" fill="none" stroke="#86abe2" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="362" cy="308" r="4" fill="#86abe2"/>
<circle cx="409.5" cy="128" r="4" fill="#86abe2"/>
<circle cx="457" cy="308" r="4" fill="#86abe2"/>
<circle cx="504.5" cy="128" r="4" fill="#86abe2"/>
<circle cx="552" cy="308" r="4" fill="#86abe2"/>
<text x="362" y="328" font-size="14" fill="#a7adb5" text-anchor="middle">0</text>
<text x="409.5" y="328" font-size="14" fill="#a7adb5" text-anchor="middle">0.25</text>
<text x="457" y="328" font-size="14" fill="#a7adb5" text-anchor="middle">0.5</text>
<text x="504.5" y="328" font-size="14" fill="#a7adb5" text-anchor="middle">0.75</text>
<text x="552" y="328" font-size="14" fill="#a7adb5" text-anchor="middle">1</text>
<text x="354" y="313" font-size="14" fill="#a7adb5" text-anchor="end">0</text>
<text x="354" y="223" font-size="14" fill="#a7adb5" text-anchor="end">0.5</text>
<text x="354" y="133" font-size="14" fill="#a7adb5" text-anchor="end">1</text>
<text x="457" y="350" font-size="15" fill="#a7adb5" text-anchor="middle">x</text>
<text x="334" y="118" font-size="15" fill="#a7adb5" text-anchor="start">T²(x)</text>
<text x="334" y="368" font-size="15" fill="#e9e7e3" text-anchor="start" font-weight="600">4 pieces, 4 units</text>
<rect x="604" y="68" width="262" height="316" rx="8" fill="#22252a" stroke="#3d4148" stroke-width="1.5"/>
<text x="620" y="98" font-size="17" fill="#e9e7e3" text-anchor="start" font-weight="bold">l = 3: T∘T∘T</text>
<rect x="648" y="128" width="190" height="180" fill="none" stroke="#3d4148" stroke-width="1.5"/>
<line x1="648" y1="308" x2="838" y2="308" stroke="#3d4148" stroke-width="1" stroke-linecap="round" stroke-opacity="0.6"/>
<line x1="648" y1="218" x2="838" y2="218" stroke="#3d4148" stroke-width="1" stroke-linecap="round" stroke-opacity="0.6"/>
<line x1="648" y1="128" x2="838" y2="128" stroke="#3d4148" stroke-width="1" stroke-linecap="round" stroke-opacity="0.6"/>
<polyline points="648,308 671.8,128 695.5,308 719.2,128 743,308 766.8,128 790.5,308 814.2,128 838,308" fill="none" stroke="#6fc693" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="648" cy="308" r="4" fill="#6fc693"/>
<circle cx="671.8" cy="128" r="4" fill="#6fc693"/>
<circle cx="695.5" cy="308" r="4" fill="#6fc693"/>
<circle cx="719.2" cy="128" r="4" fill="#6fc693"/>
<circle cx="743" cy="308" r="4" fill="#6fc693"/>
<circle cx="766.8" cy="128" r="4" fill="#6fc693"/>
<circle cx="790.5" cy="308" r="4" fill="#6fc693"/>
<circle cx="814.2" cy="128" r="4" fill="#6fc693"/>
<circle cx="838" cy="308" r="4" fill="#6fc693"/>
<text x="648" y="328" font-size="14" fill="#a7adb5" text-anchor="middle">0</text>
<text x="695.5" y="328" font-size="14" fill="#a7adb5" text-anchor="middle">0.25</text>
<text x="743" y="328" font-size="14" fill="#a7adb5" text-anchor="middle">0.5</text>
<text x="790.5" y="328" font-size="14" fill="#a7adb5" text-anchor="middle">0.75</text>
<text x="838" y="328" font-size="14" fill="#a7adb5" text-anchor="middle">1</text>
<text x="640" y="313" font-size="14" fill="#a7adb5" text-anchor="end">0</text>
<text x="640" y="223" font-size="14" fill="#a7adb5" text-anchor="end">0.5</text>
<text x="640" y="133" font-size="14" fill="#a7adb5" text-anchor="end">1</text>
<text x="743" y="350" font-size="15" fill="#a7adb5" text-anchor="middle">x</text>
<text x="620" y="118" font-size="15" fill="#a7adb5" text-anchor="start">T³(x)</text>
<text x="620" y="368" font-size="15" fill="#e9e7e3" text-anchor="start" font-weight="600">8 pieces, 6 units</text>
<text x="32" y="410" font-size="14" fill="#a7adb5" text-anchor="start">Each fold doubles the pieces and adds 2 units.</text>
<text x="32" y="432" font-size="14" fill="#a7adb5" text-anchor="start">Every piece runs over the full range 0 to 1; kinks at k/2^l.</text>
</svg>
