<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" font-family="Inter, Arial, sans-serif">
<rect width="720" height="360" fill="#111827" rx="12"/>
<text x="24" y="30" fill="#e5e7eb" font-size="16" font-weight="bold">Contact force and friction cone</text>
<text x="400" y="30" fill="#e5e7eb" font-size="16" font-weight="bold">Friction vs applied force</text>
<line x1="30" y1="300" x2="350" y2="300" stroke="#e5e7eb" stroke-width="2"/>
<rect x="130" y="230" width="70" height="70" fill="#374151" stroke="#e5e7eb"/>
<text x="165" y="270" fill="#e5e7eb" font-size="13" text-anchor="middle">box</text>
<g stroke-width="3"><line x1="165" y1="300" x2="165" y2="200" stroke="#a3e635"/><line x1="165" y1="265" x2="165" y2="355" stroke="#f97316"/><line x1="200" y1="265" x2="262" y2="265" stroke="#38bdf8"/><line x1="130" y1="285" x2="82" y2="285" stroke="#a3e635"/></g>
<text x="170" y="196" fill="#a3e635" font-size="13">N</text><text x="170" y="350" fill="#f97316" font-size="13">mg</text>
<text x="212" y="258" fill="#38bdf8" font-size="13">push F</text><text x="52" y="278" fill="#a3e635" font-size="13">friction f</text>
<path d="M 165 300 L 240 125 L 90 125 Z" fill="#38bdf8" fill-opacity="0.18" stroke="#38bdf8" stroke-dasharray="5 3"/>
<text x="165" y="118" fill="#38bdf8" font-size="13" text-anchor="middle">cone: |f| &lt;= mu N</text>
<text x="260" y="170" fill="#e5e7eb" font-size="13">half-angle = atan(mu)</text>
<line x1="410" y1="300" x2="690" y2="300" stroke="#e5e7eb"/><line x1="410" y1="300" x2="410" y2="60" stroke="#e5e7eb"/>
<text x="560" y="344" fill="#e5e7eb" font-size="13" text-anchor="middle">applied force F</text>
<text x="420" y="80" fill="#e5e7eb" font-size="13">friction f</text>
<polyline points="410,300 560,150" fill="none" stroke="#a3e635" stroke-width="3"/>
<line x1="560" y1="150" x2="560" y2="180" stroke="#f97316" stroke-width="2" stroke-dasharray="4 3"/>
<polyline points="560,180 680,180" fill="none" stroke="#f97316" stroke-width="3"/>
<line x1="410" y1="150" x2="560" y2="150" stroke="#e5e7eb" stroke-dasharray="4 4"/><line x1="560" y1="300" x2="560" y2="150" stroke="#e5e7eb" stroke-dasharray="4 4"/>
<text x="418" y="143" fill="#e5e7eb" font-size="13">mu_s N</text><text x="570" y="205" fill="#f97316" font-size="13">mu_k N (sliding)</text>
<text x="450" y="238" fill="#a3e635" font-size="13" transform="rotate(-42 450 238)">stick: f = F</text>
<text x="563" y="318" fill="#e5e7eb" font-size="12" text-anchor="start">breakaway</text>
</svg>
