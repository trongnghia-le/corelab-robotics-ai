<text x="568" y="104" font-size="17" font-weight="bold" fill="#e9e7e3">t = V v, with K = [ω]×</text>
<text x="568" y="142" font-size="15" fill="#e9e7e3">θ = ‖ω‖ T</text>
<text x="844" y="142" font-size="15" text-anchor="end" fill="#e9e7e3">π/2 = 1.5708</text>
<text x="568" y="178" font-size="15" fill="#e9e7e3">(1−cos θ)/θ²</text>
<text x="844" y="178" font-size="15" text-anchor="end" fill="#e9e7e3">0.4053</text>
<text x="568" y="214" font-size="15" fill="#e9e7e3">(θ−sin θ)/θ³</text>
<text x="844" y="214" font-size="15" text-anchor="end" fill="#e9e7e3">0.1473</text>
<text x="568" y="250" font-size="15" fill="#e9e7e3">K e₁</text>
<text x="844" y="250" font-size="15" text-anchor="end" fill="#e9e7e3">(0, 1.5708, 0)</text>
<text x="568" y="286" font-size="15" fill="#e9e7e3">K² e₁</text>
<text x="844" y="286" font-size="15" text-anchor="end" fill="#e9e7e3">(−2.4674, 0, 0)</text>
<text x="568" y="322" font-size="15" font-weight="600" fill="#e0904f">t = e₁ + 0.4053 K e₁ + 0.1473 K² e₁</text>
<text x="844" y="348" font-size="15" font-weight="600" text-anchor="end" fill="#e0904f">(0.6366, 0.6366, 0)</text>
