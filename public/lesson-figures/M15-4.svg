<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="Inter, sans-serif">
<title>Worked case: a twist of 1 m/s and 90°/s for 1 s</title>
<desc>Plan view of a robot that drives forward at 1 m/s while turning at 90 degrees per second for 1 s. It follows a quarter circle of radius 2 over pi metres and ends at (0.637, 0.637) m, not at (1, 0).</desc>
