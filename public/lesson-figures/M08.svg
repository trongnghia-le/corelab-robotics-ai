<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" font-family="Inter, Arial, sans-serif" font-size="14">
<rect width="720" height="340" fill="#111827" rx="12"/>
<g fill="#e5e7eb" text-anchor="middle">
<text x="360" y="34" font-size="15" font-weight="bold">Natural frequencies: 10,000 parts, 1% defective, test 90% sensitive, 5% false alarms</text>
<text x="360" y="82">10,000 parts</text>
<text x="180" y="170">100 defective</text><text x="540" y="170">9,900 good</text>
<text x="100" y="262" fill="#a3e635">90 flagged</text><text x="260" y="262">10 missed</text>
<text x="450" y="262" fill="#f97316">495 flagged</text><text x="630" y="262">9,405 clear</text>
<text x="360" y="318" fill="#a3e635" font-size="15">P(defect | flag) = 90 / (90 + 495) = 0.154</text>
</g>
<g fill="none" stroke-width="2">
<rect x="270" y="56" width="180" height="40" stroke="#e5e7eb"/>
<rect x="110" y="142" width="140" height="40" stroke="#38bdf8"/><rect x="460" y="142" width="160" height="40" stroke="#38bdf8"/>
<rect x="40" y="234" width="120" height="40" stroke="#a3e635"/><rect x="200" y="234" width="120" height="40" stroke="#e5e7eb" stroke-dasharray="5 4"/>
<rect x="390" y="234" width="120" height="40" stroke="#f97316"/><rect x="560" y="234" width="140" height="40" stroke="#e5e7eb" stroke-dasharray="5 4"/>
<g stroke="#e5e7eb"><line x1="330" y1="96" x2="200" y2="142"/><line x1="390" y1="96" x2="520" y2="142"/><line x1="150" y1="182" x2="110" y2="234"/><line x1="210" y1="182" x2="250" y2="234"/><line x1="500" y1="182" x2="450" y2="234"/><line x1="580" y1="182" x2="630" y2="234"/></g>
</g>
<text x="190" y="128" fill="#e5e7eb" font-size="13">1%</text><text x="500" y="128" fill="#e5e7eb" font-size="13">99%</text>
<text x="60" y="214" fill="#e5e7eb" font-size="13">90%</text><text x="236" y="214" fill="#e5e7eb" font-size="13">10%</text><text x="430" y="214" fill="#e5e7eb" font-size="13">5%</text><text x="600" y="214" fill="#e5e7eb" font-size="13">95%</text>
