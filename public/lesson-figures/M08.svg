<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" font-family="Inter, sans-serif">
<title>Natural frequencies: 10,000 parts, 585 flags</title>
<desc>Tree of 10,000 parts: 100 defective of which 90 are flagged and 9,900 good of which 495 are flagged, so 90 of 585 flags are real defects, 0.154.</desc>
<rect width="900" height="540" rx="14" fill="#17181b"/>

<text x="32" y="44" font-size="22" font-weight="bold" fill="#e9e7e3">Natural frequencies: 10,000 parts, 585 flags</text>
<rect x="40" y="238" width="150" height="60" rx="8" fill="#22252a" stroke="#3d4148" stroke-width="2"/>
<text x="115" y="274" font-size="15" font-weight="600" text-anchor="middle" fill="#e9e7e3">10,000 parts</text>
<rect x="290" y="138" width="190" height="60" rx="8" fill="#22252a" stroke="#e0904f" stroke-width="2"/>
<text x="385" y="164" font-size="17" font-weight="bold" text-anchor="middle" fill="#e9e7e3">100 defective</text>
<text x="385" y="186" font-size="14" text-anchor="middle" fill="#a7adb5">1 % prevalence</text>
<rect x="290" y="338" width="190" height="60" rx="8" fill="#22252a" stroke="#86abe2" stroke-width="2"/>
<text x="385" y="364" font-size="17" font-weight="bold" text-anchor="middle" fill="#e9e7e3">9,900 good</text>
<text x="385" y="386" font-size="14" text-anchor="middle" fill="#a7adb5">99 %</text>
<rect x="600" y="104" width="200" height="52" rx="8" fill="#22252a" stroke="#6fc693" stroke-width="2"/>
<text x="700" y="136" font-size="15" font-weight="600" text-anchor="middle" fill="#e9e7e3">90 flagged</text>
<rect x="600" y="180" width="200" height="52" rx="8" fill="#22252a" stroke="#3d4148" stroke-width="2"/>
<text x="700" y="212" font-size="15" font-weight="600" text-anchor="middle" fill="#e9e7e3">10 missed</text>
<rect x="600" y="304" width="200" height="52" rx="8" fill="#22252a" stroke="#6fc693" stroke-width="2"/>
<text x="700" y="336" font-size="15" font-weight="600" text-anchor="middle" fill="#e9e7e3">495 flagged</text>
<rect x="600" y="380" width="200" height="52" rx="8" fill="#22252a" stroke="#3d4148" stroke-width="2"/>
<text x="700" y="412" font-size="15" font-weight="600" text-anchor="middle" fill="#e9e7e3">9,405 not flagged</text>
<polyline points="190.0,268.0 240.0,268.0 240.0,168.0 290.0,168.0" fill="none" stroke="#e0904f" stroke-width="2" stroke-linejoin="round"/>
<text x="265" y="160" font-size="14" text-anchor="middle" fill="#a7adb5">1 %</text>
<polyline points="190.0,268.0 240.0,268.0 240.0,368.0 290.0,368.0" fill="none" stroke="#86abe2" stroke-width="2" stroke-linejoin="round"/>
<text x="265" y="360" font-size="14" text-anchor="middle" fill="#a7adb5">99 %</text>
<polyline points="480.0,168.0 540.0,168.0 540.0,130.0 600.0,130.0" fill="none" stroke="#6fc693" stroke-width="2" stroke-linejoin="round"/>
<text x="570" y="122" font-size="14" text-anchor="middle" fill="#a7adb5">90 %</text>
<polyline points="480.0,168.0 540.0,168.0 540.0,206.0 600.0,206.0" fill="none" stroke="#a7adb5" stroke-width="2" stroke-linejoin="round"/>
<text x="570" y="198" font-size="14" text-anchor="middle" fill="#a7adb5">10 %</text>
<polyline points="480.0,368.0 540.0,368.0 540.0,330.0 600.0,330.0" fill="none" stroke="#6fc693" stroke-width="2" stroke-linejoin="round"/>
<text x="570" y="322" font-size="14" text-anchor="middle" fill="#a7adb5">5 %</text>
<polyline points="480.0,368.0 540.0,368.0 540.0,406.0 600.0,406.0" fill="none" stroke="#a7adb5" stroke-width="2" stroke-linejoin="round"/>
<text x="570" y="398" font-size="14" text-anchor="middle" fill="#a7adb5">95 %</text>
<rect x="32" y="462" width="836" height="54" rx="10" fill="#22252a" stroke="#6fc693" stroke-width="2"/>
<text x="52" y="486" font-size="17" font-weight="bold" fill="#6fc693">flagged: 90 + 495 = 585</text>
<text x="52" y="506" font-size="15" font-weight="600" fill="#e9e7e3">defective among flagged: 90 / 585 = 0.154</text>
</svg>
