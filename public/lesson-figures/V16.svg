<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 360" font-family="Inter, Arial, sans-serif">
<rect width="780" height="360" fill="#111827" rx="12"/>
<text x="30" y="34" font-size="16" fill="#e5e7eb" font-weight="bold">A. Same frames, opposite action</text>
<text x="420" y="34" font-size="16" fill="#e5e7eb" font-weight="bold">B. Sampling a 28 Hz wheel at 30 fps</text>
<text x="30" y="68" font-size="14" fill="#f97316">approach</text>
<g fill="#f97316"><circle cx="110" cy="64" r="8"/><circle cx="160" cy="64" r="8"/><circle cx="210" cy="64" r="8"/><circle cx="260" cy="64" r="8"/><circle cx="310" cy="64" r="8"/></g>
<line x1="110" y1="92" x2="310" y2="92" stroke="#f97316" stroke-width="2"/><polygon points="318,92 306,86 306,98" fill="#f97316"/>
<text x="30" y="148" font-size="14" fill="#38bdf8">retreat</text>
<g fill="#38bdf8"><circle cx="110" cy="144" r="8"/><circle cx="160" cy="144" r="8"/><circle cx="210" cy="144" r="8"/><circle cx="260" cy="144" r="8"/><circle cx="310" cy="144" r="8"/></g>
<line x1="310" y1="172" x2="110" y2="172" stroke="#38bdf8" stroke-width="2"/><polygon points="102,172 114,166 114,178" fill="#38bdf8"/>
<text x="30" y="214" font-size="14" fill="#e5e7eb">bag of frames: mean x = 2 for both</text>
<text x="30" y="238" font-size="14" fill="#a3e635">motion feature: +1 vs -1 per frame</text>
<text x="30" y="276" font-size="14" fill="#e5e7eb">Frame-only features cannot separate them;</text>
<text x="30" y="298" font-size="14" fill="#e5e7eb">consecutive-frame differences can.</text>
<line x1="440" y1="200" x2="750" y2="200" stroke="#e5e7eb" stroke-width="1.2"/>
<path d="M440,200 Q455,110 470,200 T500,200 T530,200 T560,200 T590,200 T620,200 T650,200 T680,200 T710,200 T740,200" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.8"/>
<g fill="#f97316"><circle cx="440" cy="200" r="5"/><circle cx="496" cy="221" r="5"/><circle cx="552" cy="235" r="5"/><circle cx="608" cy="243" r="5"/><circle cx="664" cy="245" r="5"/><circle cx="720" cy="240" r="5"/></g>
<polyline points="440,200 496,221 552,235 608,243 664,245 720,240" fill="none" stroke="#f97316" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="440" y="270" font-size="14" fill="#e5e7eb">true 28 Hz, samples at 30 Hz</text>
<text x="440" y="292" font-size="14" fill="#f97316">samples trace a slow 2 Hz wave</text>
<text x="440" y="320" font-size="14" fill="#a3e635">f_alias = |f - fs * round(f / fs)|</text>
<text x="440" y="342" font-size="13" fill="#e5e7eb">sketch, not to scale</text>
</svg>
