<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="Inter, sans-serif">
<title>Removing the oldest message: list versus deque (n = 6)</title>
<desc>Six messages m0 to m5. With list.pop(0) the five others each move one place left; with deque.popleft() only the head pointer advances.</desc>
<rect width="900" height="470" rx="14" fill="#17181b"/>

<text x="32" y="44" font-size="22" font-weight="bold" fill="#e9e7e3">Removing the oldest message: list versus deque (n = 6)</text>
<text x="32" y="98" font-size="17" font-weight="bold" fill="#e9e7e3">list.pop(0): O(n), every remaining element shifts left</text>
<rect x="32" y="120" width="90" height="46" rx="8" fill="#e0904f" fill-opacity="0.3" stroke="#e0904f" stroke-width="2"/>
<text x="77" y="149" font-size="15" font-weight="600" text-anchor="middle" fill="#e9e7e3">m0</text>
<rect x="136" y="120" width="90" height="46" rx="8" fill="#22252a" fill-opacity="1" stroke="#a7adb5" stroke-width="2"/>
<text x="181" y="149" font-size="15" font-weight="600" text-anchor="middle" fill="#e9e7e3">m1</text>
<rect x="240" y="120" width="90" height="46" rx="8" fill="#22252a" fill-opacity="1" stroke="#a7adb5" stroke-width="2"/>
<text x="285" y="149" font-size="15" font-weight="600" text-anchor="middle" fill="#e9e7e3">m2</text>
<rect x="344" y="120" width="90" height="46" rx="8" fill="#22252a" fill-opacity="1" stroke="#a7adb5" stroke-width="2"/>
<text x="389" y="149" font-size="15" font-weight="600" text-anchor="middle" fill="#e9e7e3">m3</text>
<rect x="448" y="120" width="90" height="46" rx="8" fill="#22252a" fill-opacity="1" stroke="#a7adb5" stroke-width="2"/>
<text x="493" y="149" font-size="15" font-weight="600" text-anchor="middle" fill="#e9e7e3">m4</text>
<rect x="552" y="120" width="90" height="46" rx="8" fill="#22252a" fill-opacity="1" stroke="#a7adb5" stroke-width="2"/>
<text x="597" y="149" font-size="15" font-weight="600" text-anchor="middle" fill="#e9e7e3">m5</text>
<text x="32" y="268" font-size="17" font-weight="bold" fill="#e9e7e3">deque.popleft(): O(1), only the head pointer moves</text>
<rect x="32" y="290" width="90" height="46" rx="8" fill="#6fc693" fill-opacity="0.3" stroke="#6fc693" stroke-width="2"/>
<text x="77" y="319" font-size="15" font-weight="600" text-anchor="middle" fill="#e9e7e3">m0</text>
<rect x="136" y="290" width="90" height="46" rx="8" fill="#22252a" fill-opacity="1" stroke="#a7adb5" stroke-width="2"/>
<text x="181" y="319" font-size="15" font-weight="600" text-anchor="middle" fill="#e9e7e3">m1</text>
<rect x="240" y="290" width="90" height="46" rx="8" fill="#22252a" fill-opacity="1" stroke="#a7adb5" stroke-width="2"/>
<text x="285" y="319" font-size="15" font-weight="600" text-anchor="middle" fill="#e9e7e3">m2</text>
<rect x="344" y="290" width="90" height="46" rx="8" fill="#22252a" fill-opacity="1" stroke="#a7adb5" stroke-width="2"/>
<text x="389" y="319" font-size="15" font-weight="600" text-anchor="middle" fill="#e9e7e3">m3</text>
<rect x="448" y="290" width="90" height="46" rx="8" fill="#22252a" fill-opacity="1" stroke="#a7adb5" stroke-width="2"/>
<text x="493" y="319" font-size="15" font-weight="600" text-anchor="middle" fill="#e9e7e3">m4</text>
<rect x="552" y="290" width="90" height="46" rx="8" fill="#22252a" fill-opacity="1" stroke="#a7adb5" stroke-width="2"/>
<text x="597" y="319" font-size="15" font-weight="600" text-anchor="middle" fill="#e9e7e3">m5</text>
<path d="M181.0,170 Q129.0,200 85.0,171" fill="none" stroke="#e0904f" stroke-width="2"/>
<polygon points="79.0,171 90.0,163 90.0,181" fill="#e0904f"/>
<path d="M285.0,170 Q233.0,200 189.0,171" fill="none" stroke="#e0904f" stroke-width="2"/>
<polygon points="183.0,171 194.0,163 194.0,181" fill="#e0904f"/>
<path d="M389.0,170 Q337.0,200 293.0,171" fill="none" stroke="#e0904f" stroke-width="2"/>
<polygon points="287.0,171 298.0,163 298.0,181" fill="#e0904f"/>
<path d="M493.0,170 Q441.0,200 397.0,171" fill="none" stroke="#e0904f" stroke-width="2"/>
<polygon points="391.0,171 402.0,163 402.0,181" fill="#e0904f"/>
<path d="M597.0,170 Q545.0,200 501.0,171" fill="none" stroke="#e0904f" stroke-width="2"/>
<polygon points="495.0,171 506.0,163 506.0,181" fill="#e0904f"/>
<text x="670" y="146" font-size="15" fill="#e9e7e3">m0 leaves,</text>
<text x="670" y="170" font-size="15" font-weight="600" fill="#e0904f">5 moves (n − 1)</text>
<line x1="77" y1="368" x2="77.0" y2="357.0" stroke="#6fc693" stroke-width="2"/>
<polygon points="77.0,346.0 82.5,357.0 71.5,357.0" fill="#6fc693"/>
<text x="77" y="388" font-size="15" font-weight="600" text-anchor="middle" fill="#6fc693">head</text>
<line x1="181" y1="368" x2="181.0" y2="357.0" stroke="#6fc693" stroke-width="2" stroke-dasharray="5 4"/>
<polygon points="181.0,346.0 186.5,357.0 175.5,357.0" fill="#6fc693"/>
<text x="181" y="388" font-size="15" font-weight="600" text-anchor="middle" fill="#6fc693">head after pop</text>
<rect x="32" y="404" width="836" height="48" rx="10" fill="#22252a"/>
<text x="52" y="425" font-size="15" font-weight="600" fill="#e9e7e3">Draining n messages: the list does n(n − 1)/2 element moves, the deque n pointer updates</text>
<text x="52" y="444" font-size="14" fill="#a7adb5">n = 6: 15 moves against 6 updates.   n = 10,000: 49,995,000 against 10,000.</text>
</svg>
