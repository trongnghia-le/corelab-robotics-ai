<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" font-family="Inter, Arial, sans-serif">
<rect width="720" height="400" fill="#111827" rx="12"/>
<text x="360" y="28" fill="#e5e7eb" font-size="18" font-weight="bold" text-anchor="middle">Removing the oldest message: list versus deque</text>
<text x="40" y="66" fill="#f97316" font-size="15" font-weight="bold">list.pop(0): O(n), every remaining element shifts left</text>
<rect x="40" y="80" width="70" height="44" rx="6" fill="#7c2d12" stroke="#e5e7eb" stroke-width="1.5"/><text x="75" y="108" fill="#e5e7eb" font-size="14" text-anchor="middle">m0</text>
<rect x="120" y="80" width="70" height="44" rx="6" fill="#1f2937" stroke="#e5e7eb" stroke-width="1.5"/><text x="155" y="108" fill="#e5e7eb" font-size="14" text-anchor="middle">m1</text>
<rect x="200" y="80" width="70" height="44" rx="6" fill="#1f2937" stroke="#e5e7eb" stroke-width="1.5"/><text x="235" y="108" fill="#e5e7eb" font-size="14" text-anchor="middle">m2</text>
<rect x="280" y="80" width="70" height="44" rx="6" fill="#1f2937" stroke="#e5e7eb" stroke-width="1.5"/><text x="315" y="108" fill="#e5e7eb" font-size="14" text-anchor="middle">m3</text>
<rect x="360" y="80" width="70" height="44" rx="6" fill="#1f2937" stroke="#e5e7eb" stroke-width="1.5"/><text x="395" y="108" fill="#e5e7eb" font-size="14" text-anchor="middle">m4</text>
<rect x="440" y="80" width="70" height="44" rx="6" fill="#1f2937" stroke="#e5e7eb" stroke-width="1.5"/><text x="475" y="108" fill="#e5e7eb" font-size="14" text-anchor="middle">m5</text>
<path d="M130,140 Q90,158 60,140" fill="none" stroke="#f97316" stroke-width="2"/><polygon points="60,140 68,132 68,147" fill="#f97316"/>
<path d="M210,140 Q170,158 140,140" fill="none" stroke="#f97316" stroke-width="2"/><polygon points="140,140 148,132 148,147" fill="#f97316"/>
<path d="M290,140 Q250,158 220,140" fill="none" stroke="#f97316" stroke-width="2"/><polygon points="220,140 228,132 228,147" fill="#f97316"/>
<path d="M370,140 Q330,158 300,140" fill="none" stroke="#f97316" stroke-width="2"/><polygon points="300,140 308,132 308,147" fill="#f97316"/>
<path d="M450,140 Q410,158 380,140" fill="none" stroke="#f97316" stroke-width="2"/><polygon points="380,140 388,132 388,147" fill="#f97316"/>
<text x="540" y="104" fill="#e5e7eb" font-size="14">m0 leaves,</text><text x="540" y="124" fill="#e5e7eb" font-size="14">5 moves (n−1)</text>
<text x="40" y="226" fill="#a3e635" font-size="15" font-weight="bold">deque.popleft(): O(1), only the head moves</text>
<rect x="40" y="240" width="70" height="44" rx="6" fill="#365314" stroke="#e5e7eb" stroke-width="1.5"/><text x="75" y="268" fill="#e5e7eb" font-size="14" text-anchor="middle">m0</text>
<rect x="120" y="240" width="70" height="44" rx="6" fill="#1f2937" stroke="#e5e7eb" stroke-width="1.5"/><text x="155" y="268" fill="#e5e7eb" font-size="14" text-anchor="middle">m1</text>
<rect x="200" y="240" width="70" height="44" rx="6" fill="#1f2937" stroke="#e5e7eb" stroke-width="1.5"/><text x="235" y="268" fill="#e5e7eb" font-size="14" text-anchor="middle">m2</text>
<rect x="280" y="240" width="70" height="44" rx="6" fill="#1f2937" stroke="#e5e7eb" stroke-width="1.5"/><text x="315" y="268" fill="#e5e7eb" font-size="14" text-anchor="middle">m3</text>
<rect x="360" y="240" width="70" height="44" rx="6" fill="#1f2937" stroke="#e5e7eb" stroke-width="1.5"/><text x="395" y="268" fill="#e5e7eb" font-size="14" text-anchor="middle">m4</text>
<rect x="440" y="240" width="70" height="44" rx="6" fill="#1f2937" stroke="#e5e7eb" stroke-width="1.5"/><text x="475" y="268" fill="#e5e7eb" font-size="14" text-anchor="middle">m5</text>
<path d="M75,300 L75,288" stroke="#a3e635" stroke-width="2"/><text x="75" y="318" fill="#a3e635" font-size="14" text-anchor="middle">head</text>
<path d="M155,300 L155,288" stroke="#a3e635" stroke-width="2" stroke-dasharray="4 3"/><text x="155" y="318" fill="#a3e635" font-size="14" text-anchor="middle">head after pop</text>
<rect x="40" y="338" width="640" height="46" rx="8" fill="#1f2937"/><text x="360" y="358" fill="#e5e7eb" font-size="14" text-anchor="middle">Draining n messages: list does n(n−1)/2 element moves; deque does n pointer updates.</text><text x="360" y="376" fill="#e5e7eb" font-size="13" text-anchor="middle">n = 6: 15 moves versus 6. n = 10,000: about 50 million versus 10,000.</text>
</svg>