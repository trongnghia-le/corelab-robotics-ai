<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="Inter, sans-serif">
<title>One point, two frames: B is rotated +90° and moved by (1, 2) in A</title>
<desc>Frame A with axes x_A, y_A and frame B whose origin is at (1,2) in A and which is rotated by 90 degrees. The point P with coordinates (2,0) in B lies at (1,4) in A, computed as R(2,0)+(1,2).</desc>
<defs><marker id="M12arr-86abe2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 z" fill="#86abe2"/></marker><marker id="M12arr-a7adb5" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 z" fill="#a7adb5"/></marker><marker id="M12arr-e0904f" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 z" fill="#e0904f"/></marker></defs>
<rect width="900" height="520" rx="14" fill="#17181b"/>
<text x="32" y="44" font-size="22" fill="#e9e7e3" text-anchor="start" font-weight="bold">One point, two frames: B is rotated +90° and moved by (1, 2) in A</text>
<rect x="32" y="64" width="460" height="432" rx="8" fill="#22252a" stroke="#3d4148" stroke-width="1.5"/>
<text x="48" y="94" font-size="17" fill="#e9e7e3" text-anchor="start" font-weight="bold">To scale, metres</text>
<line x1="50" y1="448" x2="428" y2="448" stroke="#a7adb5" stroke-width="1.5" stroke-linecap="round" marker-end="url(#M12arr-a7adb5)"/>
<line x1="140" y1="484" x2="140" y2="151" stroke="#a7adb5" stroke-width="1.5" stroke-linecap="round" marker-end="url(#M12arr-a7adb5)"/>
<text x="200" y="470" font-size="14" fill="#a7adb5" text-anchor="middle">1</text>
<text x="260" y="470" font-size="14" fill="#a7adb5" text-anchor="middle">2</text>
<text x="320" y="470" font-size="14" fill="#a7adb5" text-anchor="middle">3</text>
<text x="380" y="470" font-size="14" fill="#a7adb5" text-anchor="middle">4</text>
<text x="424" y="436" font-size="15" fill="#a7adb5" text-anchor="end" font-weight="600">xₐ</text>
<text x="150" y="159" font-size="15" fill="#a7adb5" text-anchor="start" font-weight="600">yₐ</text>
<line x1="140" y1="448" x2="200" y2="328" stroke="#e0904f" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 5" marker-end="url(#M12arr-e0904f)"/>
<text x="180" y="410" font-size="15" fill="#e0904f" text-anchor="start" font-weight="600">t = (1, 2)</text>
<line x1="200" y1="328" x2="200" y2="172" stroke="#86abe2" stroke-width="2.5" stroke-linecap="round" marker-end="url(#M12arr-86abe2)"/>
<line x1="200" y1="328" x2="104" y2="328" stroke="#86abe2" stroke-width="2.5" stroke-linecap="round" marker-end="url(#M12arr-86abe2)"/>
<text x="210" y="180" font-size="15" fill="#86abe2" text-anchor="start" font-weight="600">x_B</text>
<text x="96" y="318" font-size="15" fill="#86abe2" text-anchor="end" font-weight="600">y_B</text>
<path d="M234,328 A34,34 0 0 0 200,294" fill="none" stroke="#86abe2" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="242" y="314" font-size="15" fill="#86abe2" text-anchor="start" font-weight="600">θ = 90°</text>
<circle cx="200" cy="208" r="7" fill="#e08db5"/>
<text x="214" y="202" font-size="15" fill="#e08db5" text-anchor="start" font-weight="600">P: ᴮp = (2, 0)</text>
<text x="214" y="224" font-size="15" fill="#e08db5" text-anchor="start" font-weight="600">ᴬp = (1, 4)</text>
<circle cx="140" cy="448" r="4" fill="#e9e7e3"/>
<rect x="508" y="64" width="360" height="432" rx="8" fill="#22252a" stroke="#3d4148" stroke-width="1.5"/>
<text x="524" y="94" font-size="17" fill="#e9e7e3" text-anchor="start" font-weight="bold">The map</text>
<text x="524" y="140" font-size="15" fill="#e9e7e3" text-anchor="start" font-weight="600">ᴬp = ᴬR_B ᴮp + ᴬt_B</text>
<text x="524" y="184" font-size="15" fill="#e9e7e3" text-anchor="start">The columns of ᴬR_B are the axes of B in A:</text>
<text x="524" y="228" font-size="15" fill="#e9e7e3" text-anchor="start">x_B → (0, 1)    y_B → (−1, 0)</text>
<text x="524" y="272" font-size="15" fill="#e9e7e3" text-anchor="start">ᴬp = R(2, 0) + (1, 2)</text>
<text x="524" y="316" font-size="15" fill="#e08db5" text-anchor="start" font-weight="600">= (0, 2) + (1, 2) = (1, 4)</text>
<text x="524" y="384" font-size="15" fill="#e9e7e3" text-anchor="start" font-weight="600">Back: ᴮp = Rᵀ(ᴬp − t)</text>
<text x="524" y="428" font-size="15" fill="#e08db5" text-anchor="start">= Rᵀ(0, 2) = (2, 0)</text>
</svg>
