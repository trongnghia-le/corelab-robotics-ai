<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" font-family="Inter, Arial, sans-serif" font-size="14">
<rect width="720" height="340" fill="#111827" rx="12"/>
<g fill="#e5e7eb">
<text x="24" y="30" font-size="15" font-weight="bold">x' = -2x: Euler follows the tangent</text>
<text x="384" y="30" font-size="15" font-weight="bold">Too large a step: h k = 2.2 &gt; 2</text>
<text x="300" y="288" font-size="13">time t (s)</text><text x="24" y="70" font-size="13">x</text>
<text x="130" y="116" fill="#38bdf8">exact e^(-2t)</text>
<text x="130" y="140" fill="#a3e635">Euler h = 0.1</text>
<text x="130" y="164" fill="#f97316">Euler h = 0.4</text>
<text x="40" y="310" font-size="13">multiplier 1 - hk = 0.8 and 0.2: both decay</text>
<text x="400" y="310" font-size="13">multiplier 1 - hk = -1.2: sign flips, size grows</text>
<text x="636" y="190" font-size="13">step n</text><text x="396" y="66" font-size="13">x_n</text>
<text x="470" y="250" fill="#f97316" font-size="13">x_n = (-1.2)^n</text>
</g>
