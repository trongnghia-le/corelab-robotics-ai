<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="Inter, sans-serif">
<title>Broadcasting: one mean row serves every sample</title>
<desc>Centering a (4,3) data matrix: the (3,) feature mean row is reused for all four rows, giving a (4,3) result with zero column means.</desc>
<defs></defs>
<rect width="900" height="470" rx="14" fill="#17181b"/>
<text x="32" y="44" font-size="22" fill="#e9e7e3" text-anchor="start" font-weight="bold">Broadcasting: one mean row serves every sample</text>
<text x="60" y="92" font-size="17" fill="#e9e7e3" text-anchor="start" font-weight="bold">X  (4, 3)</text>
<rect x="60" y="106" width="48" height="36" rx="3" fill="#86abe2" fill-opacity="0.22" stroke="#86abe2" stroke-width="1.2"/>
<rect x="108" y="106" width="48" height="36" rx="3" fill="#86abe2" fill-opacity="0.22" stroke="#86abe2" stroke-width="1.2"/>
<rect x="156" y="106" width="48" height="36" rx="3" fill="#86abe2" fill-opacity="0.22" stroke="#86abe2" stroke-width="1.2"/>
<text y="129" font-size="15" fill="#e9e7e3" text-anchor="middle"><tspan x="84">2</tspan><tspan x="132">7</tspan><tspan x="180">1</tspan></text>
<rect x="60" y="142" width="48" height="36" rx="3" fill="#86abe2" fill-opacity="0.22" stroke="#86abe2" stroke-width="1.2"/>
<rect x="108" y="142" width="48" height="36" rx="3" fill="#86abe2" fill-opacity="0.22" stroke="#86abe2" stroke-width="1.2"/>
<rect x="156" y="142" width="48" height="36" rx="3" fill="#86abe2" fill-opacity="0.22" stroke="#86abe2" stroke-width="1.2"/>
<text y="165" font-size="15" fill="#e9e7e3" text-anchor="middle"><tspan x="84">4</tspan><tspan x="132">5</tspan><tspan x="180">3</tspan></text>
<rect x="60" y="178" width="48" height="36" rx="3" fill="#86abe2" fill-opacity="0.22" stroke="#86abe2" stroke-width="1.2"/>
<rect x="108" y="178" width="48" height="36" rx="3" fill="#86abe2" fill-opacity="0.22" stroke="#86abe2" stroke-width="1.2"/>
<rect x="156" y="178" width="48" height="36" rx="3" fill="#86abe2" fill-opacity="0.22" stroke="#86abe2" stroke-width="1.2"/>
<text y="201" font-size="15" fill="#e9e7e3" text-anchor="middle"><tspan x="84">6</tspan><tspan x="132">9</tspan><tspan x="180">5</tspan></text>
<rect x="60" y="214" width="48" height="36" rx="3" fill="#86abe2" fill-opacity="0.22" stroke="#86abe2" stroke-width="1.2"/>
<rect x="108" y="214" width="48" height="36" rx="3" fill="#86abe2" fill-opacity="0.22" stroke="#86abe2" stroke-width="1.2"/>
<rect x="156" y="214" width="48" height="36" rx="3" fill="#86abe2" fill-opacity="0.22" stroke="#86abe2" stroke-width="1.2"/>
<text y="237" font-size="15" fill="#e9e7e3" text-anchor="middle"><tspan x="84">8</tspan><tspan x="132">7</tspan><tspan x="180">7</tspan></text>
<text x="224" y="184" font-size="17" fill="#e9e7e3" text-anchor="middle" font-weight="bold">−</text>
<text x="256" y="92" font-size="17" fill="#e9e7e3" text-anchor="start" font-weight="bold">mean over samples  (3,)</text>
<rect x="256" y="106" width="48" height="36" rx="3" fill="#e0c169" fill-opacity="0.22" stroke="#e0c169" stroke-width="1.2"/>
<rect x="304" y="106" width="48" height="36" rx="3" fill="#e0c169" fill-opacity="0.22" stroke="#e0c169" stroke-width="1.2"/>
<rect x="352" y="106" width="48" height="36" rx="3" fill="#e0c169" fill-opacity="0.22" stroke="#e0c169" stroke-width="1.2"/>
<text y="129" font-size="15" fill="#e9e7e3" text-anchor="middle"><tspan x="280">5</tspan><tspan x="328">7</tspan><tspan x="376">4</tspan></text>
<rect x="256" y="142" width="48" height="36" rx="3" fill="#e0c169" fill-opacity="0.22" stroke="#e0c169" stroke-width="1.2" stroke-dasharray="4 3"/>
<rect x="304" y="142" width="48" height="36" rx="3" fill="#e0c169" fill-opacity="0.22" stroke="#e0c169" stroke-width="1.2" stroke-dasharray="4 3"/>
<rect x="352" y="142" width="48" height="36" rx="3" fill="#e0c169" fill-opacity="0.22" stroke="#e0c169" stroke-width="1.2" stroke-dasharray="4 3"/>
<text y="165" font-size="15" fill="#a7adb5" text-anchor="middle"><tspan x="280">5</tspan><tspan x="328">7</tspan><tspan x="376">4</tspan></text>
<rect x="256" y="178" width="48" height="36" rx="3" fill="#e0c169" fill-opacity="0.22" stroke="#e0c169" stroke-width="1.2" stroke-dasharray="4 3"/>
<rect x="304" y="178" width="48" height="36" rx="3" fill="#e0c169" fill-opacity="0.22" stroke="#e0c169" stroke-width="1.2" stroke-dasharray="4 3"/>
<rect x="352" y="178" width="48" height="36" rx="3" fill="#e0c169" fill-opacity="0.22" stroke="#e0c169" stroke-width="1.2" stroke-dasharray="4 3"/>
<text y="201" font-size="15" fill="#a7adb5" text-anchor="middle"><tspan x="280">5</tspan><tspan x="328">7</tspan><tspan x="376">4</tspan></text>
<rect x="256" y="214" width="48" height="36" rx="3" fill="#e0c169" fill-opacity="0.22" stroke="#e0c169" stroke-width="1.2" stroke-dasharray="4 3"/>
<rect x="304" y="214" width="48" height="36" rx="3" fill="#e0c169" fill-opacity="0.22" stroke="#e0c169" stroke-width="1.2" stroke-dasharray="4 3"/>
<rect x="352" y="214" width="48" height="36" rx="3" fill="#e0c169" fill-opacity="0.22" stroke="#e0c169" stroke-width="1.2" stroke-dasharray="4 3"/>
<text y="237" font-size="15" fill="#a7adb5" text-anchor="middle"><tspan x="280">5</tspan><tspan x="328">7</tspan><tspan x="376">4</tspan></text>
<text x="436" y="184" font-size="17" fill="#e9e7e3" text-anchor="middle" font-weight="bold">=</text>
<text x="468" y="92" font-size="17" fill="#e9e7e3" text-anchor="start" font-weight="bold">X - mean  (4, 3)</text>
<rect x="468" y="106" width="48" height="36" rx="3" fill="#6fc693" fill-opacity="0.22" stroke="#6fc693" stroke-width="1.2"/>
<rect x="516" y="106" width="48" height="36" rx="3" fill="#6fc693" fill-opacity="0.22" stroke="#6fc693" stroke-width="1.2"/>
<rect x="564" y="106" width="48" height="36" rx="3" fill="#6fc693" fill-opacity="0.22" stroke="#6fc693" stroke-width="1.2"/>
<text y="129" font-size="15" fill="#e9e7e3" text-anchor="middle"><tspan x="492">-3</tspan><tspan x="540">0</tspan><tspan x="588">-3</tspan></text>
<rect x="468" y="142" width="48" height="36" rx="3" fill="#6fc693" fill-opacity="0.22" stroke="#6fc693" stroke-width="1.2"/>
<rect x="516" y="142" width="48" height="36" rx="3" fill="#6fc693" fill-opacity="0.22" stroke="#6fc693" stroke-width="1.2"/>
<rect x="564" y="142" width="48" height="36" rx="3" fill="#6fc693" fill-opacity="0.22" stroke="#6fc693" stroke-width="1.2"/>
<text y="165" font-size="15" fill="#e9e7e3" text-anchor="middle"><tspan x="492">-1</tspan><tspan x="540">-2</tspan><tspan x="588">-1</tspan></text>
<rect x="468" y="178" width="48" height="36" rx="3" fill="#6fc693" fill-opacity="0.22" stroke="#6fc693" stroke-width="1.2"/>
<rect x="516" y="178" width="48" height="36" rx="3" fill="#6fc693" fill-opacity="0.22" stroke="#6fc693" stroke-width="1.2"/>
<rect x="564" y="178" width="48" height="36" rx="3" fill="#6fc693" fill-opacity="0.22" stroke="#6fc693" stroke-width="1.2"/>
<text y="201" font-size="15" fill="#e9e7e3" text-anchor="middle"><tspan x="492">1</tspan><tspan x="540">2</tspan><tspan x="588">1</tspan></text>
<rect x="468" y="214" width="48" height="36" rx="3" fill="#6fc693" fill-opacity="0.22" stroke="#6fc693" stroke-width="1.2"/>
<rect x="516" y="214" width="48" height="36" rx="3" fill="#6fc693" fill-opacity="0.22" stroke="#6fc693" stroke-width="1.2"/>
<rect x="564" y="214" width="48" height="36" rx="3" fill="#6fc693" fill-opacity="0.22" stroke="#6fc693" stroke-width="1.2"/>
<text y="237" font-size="15" fill="#e9e7e3" text-anchor="middle"><tspan x="492">3</tspan><tspan x="540">0</tspan><tspan x="588">3</tspan></text>
<text x="256" y="276" font-size="14" fill="#a7adb5" text-anchor="start">reused for each row</text>
<rect x="32" y="300" width="836" height="138" rx="6" fill="#22252a" stroke="#3d4148" stroke-width="1.5"/>
<text x="48" y="328" font-size="17" fill="#e9e7e3" text-anchor="start" font-weight="bold">Shapes are compared from the right:</text>
<text x="60" y="360" font-size="15" fill="#a7adb5" text-anchor="start">X</text>
<text x="60" y="388" font-size="15" fill="#a7adb5" text-anchor="start">mean</text>
<text x="60" y="416" font-size="15" fill="#a7adb5" text-anchor="start">X - mean</text>
<text x="160" y="360" font-size="15" fill="#86abe2" text-anchor="start" font-weight="600">4    3</text>
<text x="160" y="388" font-size="15" fill="#e0c169" text-anchor="start" font-weight="600">–    3</text>
<text x="160" y="416" font-size="15" fill="#6fc693" text-anchor="start" font-weight="600">4    3</text>
<text x="260" y="388" font-size="14" fill="#a7adb5" text-anchor="start">padded with 1</text>
<text x="420" y="350" font-size="14" fill="#a7adb5" text-anchor="start">axis=0 reduces the sample axis: X.mean(axis=0) has shape (3,).</text>
<text x="420" y="378" font-size="14" fill="#a7adb5" text-anchor="start">Each column of the result has mean 0 (units unchanged).</text>
</svg>
