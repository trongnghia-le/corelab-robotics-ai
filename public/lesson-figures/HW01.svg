<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 490" font-family="Inter, Arial, sans-serif">
<title>Block diagram of a differential-drive robot</title>
<desc>Six hardware blocks: compute (Raspberry Pi and microcontroller), sensors (LiDAR, IMU, encoders), driver, actuator (motors), power (battery, fuse and switch, buck regulator) and communications (the labelled links with typical latencies).</desc>
<rect width="780" height="490" fill="#191b1f" rx="12"/>
<text x="390" y="28" font-size="16" fill="#e5e7eb" text-anchor="middle" font-weight="bold">Six blocks of one robot: power flows orange, information flows labelled</text>
<rect x="24" y="42" width="12" height="12" rx="3" fill="#272a2f" stroke="#9ccd4e" stroke-width="2"/>
<text x="42" y="52" font-size="11" fill="#e5e7eb" text-anchor="start">compute</text>
<rect x="112" y="42" width="12" height="12" rx="3" fill="#272a2f" stroke="#53b2dd" stroke-width="2"/>
<text x="130" y="52" font-size="11" fill="#e5e7eb" text-anchor="start">sensor</text>
<rect x="200" y="42" width="12" height="12" rx="3" fill="#272a2f" stroke="#d9b836" stroke-width="2"/>
<text x="218" y="52" font-size="11" fill="#e5e7eb" text-anchor="start">driver</text>
<rect x="288" y="42" width="12" height="12" rx="3" fill="#272a2f" stroke="#c095eb" stroke-width="2"/>
<text x="306" y="52" font-size="11" fill="#e5e7eb" text-anchor="start">actuator</text>
<rect x="376" y="42" width="12" height="12" rx="3" fill="#272a2f" stroke="#d97936" stroke-width="2"/>
<text x="394" y="52" font-size="11" fill="#e5e7eb" text-anchor="start">power</text>
<text x="480" y="52" font-size="11" fill="#e5e7eb" text-anchor="start">links = communications</text>
<text x="295" y="142" font-size="11" fill="#9ccd4e" text-anchor="middle">HIGH LEVEL: Linux, ROS 2, 10-100 ms</text>
<text x="505" y="142" font-size="11" fill="#9ccd4e" text-anchor="middle">LOW LEVEL: real time, ~1 ms</text>
<rect x="20" y="150" width="130" height="56" rx="8" fill="#272a2f" stroke="#53b2dd" stroke-width="2"/>
<text x="85.0" y="175.0" font-size="13" fill="#e5e7eb" text-anchor="middle" font-weight="bold">LiDAR</text>
<text x="85.0" y="192.0" font-size="11" fill="#e5e7eb" text-anchor="middle">RPLIDAR A1-class</text>
<rect x="230" y="150" width="130" height="56" rx="8" fill="#272a2f" stroke="#9ccd4e" stroke-width="2"/>
<text x="295.0" y="175.0" font-size="13" fill="#e5e7eb" text-anchor="middle" font-weight="bold">Raspberry Pi</text>
<text x="295.0" y="192.0" font-size="11" fill="#e5e7eb" text-anchor="middle">SBC, ROS 2</text>
<rect x="440" y="150" width="130" height="56" rx="8" fill="#272a2f" stroke="#9ccd4e" stroke-width="2"/>
<text x="505.0" y="175.0" font-size="13" fill="#e5e7eb" text-anchor="middle" font-weight="bold">Microcontroller</text>
<text x="505.0" y="192.0" font-size="11" fill="#e5e7eb" text-anchor="middle">Arduino / ESP32</text>
<rect x="640" y="80" width="120" height="56" rx="8" fill="#272a2f" stroke="#53b2dd" stroke-width="2"/>
<text x="700.0" y="105.0" font-size="13" fill="#e5e7eb" text-anchor="middle" font-weight="bold">IMU</text>
<text x="700.0" y="122.0" font-size="11" fill="#e5e7eb" text-anchor="middle">MPU-6050</text>
<rect x="640" y="170" width="120" height="56" rx="8" fill="#272a2f" stroke="#53b2dd" stroke-width="2"/>
<text x="700.0" y="195.0" font-size="13" fill="#e5e7eb" text-anchor="middle" font-weight="bold">Encoders</text>
<text x="700.0" y="212.0" font-size="11" fill="#e5e7eb" text-anchor="middle">A/B pulses</text>
<rect x="440" y="290" width="130" height="56" rx="8" fill="#272a2f" stroke="#d9b836" stroke-width="2"/>
<text x="505.0" y="315.0" font-size="13" fill="#e5e7eb" text-anchor="middle" font-weight="bold">Motor driver</text>
<text x="505.0" y="332.0" font-size="11" fill="#e5e7eb" text-anchor="middle">TB6612FNG-class</text>
<rect x="640" y="290" width="120" height="56" rx="8" fill="#272a2f" stroke="#c095eb" stroke-width="2"/>
<text x="700.0" y="315.0" font-size="13" fill="#e5e7eb" text-anchor="middle" font-weight="bold">Gearmotors</text>
<text x="700.0" y="332.0" font-size="11" fill="#e5e7eb" text-anchor="middle">2 wheels</text>
<rect x="20" y="392" width="110" height="56" rx="8" fill="#272a2f" stroke="#d97936" stroke-width="2"/>
<text x="75.0" y="417.0" font-size="13" fill="#e5e7eb" text-anchor="middle" font-weight="bold">Battery</text>
<text x="75.0" y="434.0" font-size="11" fill="#e5e7eb" text-anchor="middle">3S LiPo 11.1 V</text>
<rect x="150" y="392" width="110" height="56" rx="8" fill="#272a2f" stroke="#d97936" stroke-width="2"/>
<text x="205.0" y="417.0" font-size="13" fill="#e5e7eb" text-anchor="middle" font-weight="bold">Fuse + switch</text>
<text x="205.0" y="434.0" font-size="11" fill="#e5e7eb" text-anchor="middle">protect, cut</text>
<rect x="310" y="392" width="120" height="56" rx="8" fill="#272a2f" stroke="#d97936" stroke-width="2"/>
<text x="370.0" y="417.0" font-size="13" fill="#e5e7eb" text-anchor="middle" font-weight="bold">Buck 5 V</text>
<text x="370.0" y="434.0" font-size="11" fill="#e5e7eb" text-anchor="middle">regulator</text>
<line x1="150" y1="178" x2="230" y2="178" stroke="#e5e7eb" stroke-width="2"/>
<polygon points="230.0,178.0 222.0,174.5 222.0,181.5" fill="#e5e7eb"/>
<text x="190" y="168" font-size="10" fill="#e5e7eb" text-anchor="middle">USB serial</text>
<text x="190" y="198" font-size="10" fill="#e5e7eb" text-anchor="middle">scan 5-10 Hz</text>
<line x1="360" y1="172" x2="440" y2="172" stroke="#e5e7eb" stroke-width="2"/>
<polygon points="440.0,172.0 432.0,168.5 432.0,175.5" fill="#e5e7eb"/>
<line x1="440" y1="186" x2="360" y2="186" stroke="#e5e7eb" stroke-width="2"/>
<polygon points="360.0,186.0 368.0,189.5 368.0,182.5" fill="#e5e7eb"/>
<text x="400" y="164" font-size="10" fill="#e5e7eb" text-anchor="middle">USB serial</text>
<text x="400" y="203" font-size="10" fill="#e5e7eb" text-anchor="middle">2-16 ms</text>
<line x1="640" y1="108" x2="570" y2="160" stroke="#e5e7eb" stroke-width="2"/>
<polygon points="570.0,160.0 578.5,158.0 574.3,152.4" fill="#e5e7eb"/>
<text x="612" y="104" font-size="10" fill="#e5e7eb" text-anchor="end">I2C</text>
<text x="612" y="118" font-size="10" fill="#e5e7eb" text-anchor="end">~0.4 ms</text>
<line x1="640" y1="198" x2="570" y2="196" stroke="#e5e7eb" stroke-width="2"/>
<polygon points="570.0,196.0 577.9,199.7 578.1,192.7" fill="#e5e7eb"/>
<text x="605" y="226" font-size="10" fill="#e5e7eb" text-anchor="middle">interrupts</text>
<text x="605" y="239" font-size="10" fill="#e5e7eb" text-anchor="middle">~us</text>
<line x1="505" y1="206" x2="505" y2="290" stroke="#e5e7eb" stroke-width="2"/>
<polygon points="505.0,290.0 508.5,282.0 501.5,282.0" fill="#e5e7eb"/>
<text x="512" y="244" font-size="10" fill="#e5e7eb" text-anchor="start">PWM + DIR</text>
<text x="512" y="257" font-size="10" fill="#e5e7eb" text-anchor="start">~1 kHz</text>
<line x1="570" y1="318" x2="640" y2="318" stroke="#d97936" stroke-width="3"/>
<polygon points="640.0,318.0 632.0,314.5 632.0,321.5" fill="#d97936"/>
<text x="605" y="310" font-size="10" fill="#d97936" text-anchor="middle">motor</text>
<text x="605" y="336" font-size="10" fill="#d97936" text-anchor="middle">power</text>
<line x1="700" y1="290" x2="700" y2="226" stroke="#e5e7eb" stroke-width="2" stroke-dasharray="5 3"/>
<polygon points="700.0,226.0 696.5,234.0 703.5,234.0" fill="#e5e7eb"/>
<text x="692" y="262" font-size="10" fill="#e5e7eb" text-anchor="end">shaft turns magnet</text>
<line x1="130" y1="420" x2="150" y2="420" stroke="#d97936" stroke-width="3"/>
<polygon points="150.0,420.0 142.0,416.5 142.0,423.5" fill="#d97936"/>
<line x1="370" y1="372" x2="370" y2="392" stroke="#d97936" stroke-width="3"/>
<polygon points="370.0,392.0 373.5,384.0 366.5,384.0" fill="#d97936"/>
<polyline points="205,392 205,372 705,372" fill="none" stroke="#d97936" stroke-width="3"/>
<line x1="505" y1="372" x2="505" y2="346" stroke="#d97936" stroke-width="3"/>
<polygon points="505.0,346.0 501.5,354.0 508.5,354.0" fill="#d97936"/>
<line x1="705" y1="372" x2="705" y2="346" stroke="#d97936" stroke-width="3"/>
<polygon points="705.0,346.0 701.5,354.0 708.5,354.0" fill="#d97936"/>
<text x="560" y="388" font-size="11" fill="#d97936" text-anchor="start">12 V motor rail</text>
<polyline points="310,420 285,420 285,222" fill="none" stroke="#d97936" stroke-width="3"/>
<line x1="285" y1="222" x2="285" y2="206" stroke="#d97936" stroke-width="3"/>
<polygon points="285.0,206.0 281.5,214.0 288.5,214.0" fill="#d97936"/>
<text x="272" y="300" font-size="11" fill="#d97936" text-anchor="end">5 V logic</text>
<text x="300" y="172" font-size="10" fill="#e5e7eb" text-anchor="middle"></text>
<text x="24" y="470" font-size="10" fill="#e5e7eb" text-anchor="start">The microcontroller is powered from the Pi's USB port in this layout.</text>
<text x="24" y="484" font-size="10" fill="#e5e7eb" text-anchor="start">All grounds meet at one point; signal wires need that shared reference.</text>
</svg>
