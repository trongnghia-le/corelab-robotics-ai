<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="Inter, Arial, sans-serif">
<rect width="760" height="400" fill="#191b1f" rx="12"/>
<text x="380.0" y="30" font-size="17" fill="#e5e7eb" text-anchor="middle" font-weight="bold">From MJCF file to a validated trajectory</text>
<rect x="25" y="70" width="150" height="90" rx="8" fill="#272a2f" stroke="#53b2dd" stroke-width="2"/>
<text x="100.0" y="102.9" font-size="14" fill="#e5e7eb" text-anchor="middle" font-weight="bold">MJCF file</text>
<text x="100.0" y="119.9" font-size="14" fill="#e5e7eb" text-anchor="middle">bodies, joints,</text>
<text x="100.0" y="136.9" font-size="14" fill="#e5e7eb" text-anchor="middle">geoms, actuators</text>
<rect x="235" y="70" width="160" height="90" rx="8" fill="#272a2f" stroke="#9ccd4e" stroke-width="2"/>
<text x="315.0" y="102.9" font-size="14" fill="#e5e7eb" text-anchor="middle" font-weight="bold">Compile: MjModel</text>
<text x="315.0" y="119.9" font-size="14" fill="#e5e7eb" text-anchor="middle">mass, inertia, dt,</text>
<text x="315.0" y="136.9" font-size="14" fill="#e5e7eb" text-anchor="middle">gravity, limits</text>
<rect x="455" y="70" width="140" height="90" rx="8" fill="#272a2f" stroke="#d97936" stroke-width="2"/>
<text x="525.0" y="102.9" font-size="14" fill="#e5e7eb" text-anchor="middle" font-weight="bold">State: MjData</text>
<text x="525.0" y="119.9" font-size="14" fill="#e5e7eb" text-anchor="middle">qpos, qvel, ctrl</text>
<text x="525.0" y="136.9" font-size="14" fill="#e5e7eb" text-anchor="middle">time</text>
<rect x="655" y="70" width="90" height="90" rx="8" fill="#272a2f" stroke="#e5e7eb" stroke-width="2"/>
<text x="700.0" y="111.4" font-size="14" fill="#e5e7eb" text-anchor="middle" font-weight="bold">mj_step</text>
<text x="700.0" y="128.4" font-size="14" fill="#e5e7eb" text-anchor="middle">one dt</text>
<line x1="175" y1="115" x2="235" y2="115" stroke="#e5e7eb" stroke-width="2"/>
<polygon points="235.0,115.0 226.7,118.5 226.7,111.5" fill="#e5e7eb"/>
<line x1="395" y1="115" x2="455" y2="115" stroke="#e5e7eb" stroke-width="2"/>
<polygon points="455.0,115.0 446.7,118.5 446.7,111.5" fill="#e5e7eb"/>
<line x1="595" y1="115" x2="655" y2="115" stroke="#e5e7eb" stroke-width="2"/>
<polygon points="655.0,115.0 646.7,118.5 646.7,111.5" fill="#e5e7eb"/>
<path d="M700 160 L700 200 L525 200 L525 168" fill="none" stroke="#e5e7eb" stroke-width="2"/><polygon points="525,162 519,174 531,174" fill="#e5e7eb"/>
<text x="612" y="194" font-size="13" fill="#e5e7eb" text-anchor="middle">repeat: next state</text>
<rect x="235" y="260" width="160" height="90" rx="8" fill="#272a2f" stroke="#9ccd4e" stroke-width="2"/>
<text x="315.0" y="292.9" font-size="14" fill="#e5e7eb" text-anchor="middle" font-weight="bold">Hand reference</text>
<text x="315.0" y="309.9" font-size="14" fill="#e5e7eb" text-anchor="middle">I = 0.4 m r^2 + m L^2</text>
<text x="315.0" y="326.9" font-size="14" fill="#e5e7eb" text-anchor="middle">w = sqrt(m g L / I)</text>
<rect x="455" y="260" width="290" height="90" rx="8" fill="#272a2f" stroke="#d97936" stroke-width="2"/>
<text x="600.0" y="292.9" font-size="14" fill="#e5e7eb" text-anchor="middle" font-weight="bold">Checks</text>
<text x="600.0" y="309.9" font-size="14" fill="#e5e7eb" text-anchor="middle">inertia, period, energy band</text>
<text x="600.0" y="326.9" font-size="14" fill="#e5e7eb" text-anchor="middle">tolerance stated in advance</text>
<line x1="315" y1="160" x2="315" y2="260" stroke="#9ccd4e" stroke-width="2"/>
<polygon points="315.0,260.0 311.5,251.7 318.5,251.7" fill="#9ccd4e"/>
<text x="360" y="215" font-size="13" fill="#9ccd4e" text-anchor="middle">constants</text>
<line x1="395" y1="305" x2="455" y2="305" stroke="#9ccd4e" stroke-width="2"/>
<polygon points="455.0,305.0 446.7,308.5 446.7,301.5" fill="#9ccd4e"/>
<line x1="640" y1="205" x2="640" y2="260" stroke="#d97936" stroke-width="2"/>
<polygon points="640.0,260.0 636.5,251.7 643.5,251.7" fill="#d97936"/>
<text x="690" y="238" font-size="13" fill="#d97936" text-anchor="middle">trajectory</text>
<text x="25" y="385" font-size="13" fill="#e5e7eb" text-anchor="start">Contacts are soft constraints: the solref time constant is floored at 2*dt.</text>
</svg>