<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" font-family="Inter, Arial, sans-serif">
<rect width="760" height="360" fill="#111827" rx="12"/>
<defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#e5e7eb"/></marker></defs>
<text x="20" y="30" fill="#e5e7eb" font-size="16" font-weight="bold">Plan steps linked by the facts they produce</text>
<g fill="none" stroke-width="2">
<rect x="20" y="60" width="150" height="44" rx="8" stroke="#38bdf8"/><rect x="200" y="60" width="150" height="44" rx="8" stroke="#38bdf8"/>
<rect x="380" y="60" width="150" height="44" rx="8" stroke="#38bdf8"/><rect x="560" y="60" width="180" height="44" rx="8" stroke="#f97316"/>
</g>
<g fill="#e5e7eb" font-size="14" text-anchor="middle"><text x="95" y="87">1 unstack(C,A)</text><text x="275" y="87">2 putdown(C)</text><text x="455" y="87">3 pickup(A)</text><text x="650" y="87">4 stack(A,B)</text></g>
<g stroke="#e5e7eb" stroke-width="2" fill="none" marker-end="url(#ar)">
<path d="M170 82 L198 82"/><path d="M350 82 L378 82"/><path d="M530 82 L558 82"/>
<path d="M95 106 C95 160 440 160 440 108" stroke="#a3e635"/><path d="M455 106 C455 140 600 140 640 108" stroke="#a3e635"/>
</g>
<text x="130" y="172" fill="#a3e635" font-size="13">clear(A): step 1 produces, step 3 consumes</text>
<text x="470" y="150" fill="#a3e635" font-size="13">holding(A)</text>
<text x="580" y="130" fill="#f97316" font-size="13">needs clear(B)</text>
<g fill="none" stroke-width="2"><rect x="560" y="200" width="180" height="40" rx="8" stroke="#f97316" stroke-dasharray="5 4"/></g>
<text x="650" y="225" fill="#f97316" font-size="14" text-anchor="middle">D placed on B: clear(B) lost</text>
<path d="M650 200 L650 110" stroke="#f97316" stroke-width="2" fill="none" marker-end="url(#ar)"/>
<text x="20" y="215" fill="#e5e7eb" font-size="14">Validate by simulation: steps 1-3 pass, step 4 is the</text>
<text x="20" y="235" fill="#e5e7eb" font-size="14">first invalid step (index 3), found before moving.</text>
<text x="20" y="285" fill="#e5e7eb" font-size="16" font-weight="bold">Execution feedback</text>
<text x="20" y="312" fill="#38bdf8" font-size="14">predicted facts  vs  observed facts</text>
<text x="20" y="336" fill="#e5e7eb" font-size="14">missing = predicted - observed;  extra = observed - predicted</text>
</svg>
