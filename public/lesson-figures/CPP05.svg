<text x="52" y="126" font-size="15" fill="#a7adb5">one block</text>
<text x="52" y="204" font-size="17" font-weight="bold" fill="#e9e7e3">deque</text>
<text x="52" y="230" font-size="15" fill="#a7adb5">blocks + index</text>
<text x="52" y="320" font-size="17" font-weight="bold" fill="#e9e7e3">list</text>
<text x="52" y="346" font-size="15" fill="#a7adb5">separate nodes</text>
<text x="52" y="424" font-size="17" font-weight="bold" fill="#e9e7e3">map / set</text>
<text x="52" y="450" font-size="15" fill="#a7adb5">red-black tree</text>
<text x="52" y="532" font-size="17" font-weight="bold" fill="#e9e7e3">unordered_map</text>
<text x="52" y="558" font-size="15" fill="#a7adb5">buckets + chains</text>
