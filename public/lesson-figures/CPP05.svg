<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" font-family="Inter, Arial, sans-serif">
<rect width="760" height="380" fill="#111827" rx="12"/>
<text x="20" y="30" font-size="16" font-weight="bold" fill="#e5e7eb">lower_bound on a sorted vector (find t = 3)</text>
<g font-size="14" fill="#e5e7eb" text-anchor="middle">
<rect x="40" y="60" width="90" height="50" fill="none" stroke="#e5e7eb" stroke-width="2"/><text x="85" y="82">t = 0</text><text x="85" y="101" font-size="13">v = 0</text>
<rect x="130" y="60" width="90" height="50" fill="none" stroke="#e5e7eb" stroke-width="2"/><text x="175" y="82">t = 1</text><text x="175" y="101" font-size="13">v = 10</text>
<rect x="220" y="60" width="90" height="50" fill="none" stroke="#38bdf8" stroke-width="3"/><text x="265" y="82">t = 2</text><text x="265" y="101" font-size="13">v = 20</text>
<rect x="310" y="60" width="90" height="50" fill="none" stroke="#f97316" stroke-width="3"/><text x="355" y="82">t = 4</text><text x="355" y="101" font-size="13">v = 60</text>
</g>
<text x="265" y="132" font-size="13" fill="#38bdf8" text-anchor="middle">probe: 2 &lt; 3, go right</text>
<text x="355" y="152" font-size="13" fill="#f97316" text-anchor="middle">lower_bound: first t &gt;= 3</text>
<text x="440" y="82" font-size="14" fill="#e5e7eb">end()</text>
<rect x="410" y="60" width="70" height="50" fill="none" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="4 4"/>
<text x="492" y="82" font-size="13" fill="#a3e635">v(3) = 20 + 40*(3-2)/(4-2) = 40</text>
<text x="492" y="102" font-size="13" fill="#e5e7eb">interpolate between prev and it</text>
<text x="20" y="200" font-size="16" font-weight="bold" fill="#e5e7eb">Comparisons for n elements: about log2(n)</text>
<line x1="60" y1="340" x2="700" y2="340" stroke="#e5e7eb" stroke-width="2"/>
<line x1="60" y1="340" x2="60" y2="220" stroke="#e5e7eb" stroke-width="2"/>
<text x="380" y="368" font-size="13" fill="#e5e7eb" text-anchor="middle">n (samples, log scale): 10^3, 10^4, 10^5, 10^6</text>
<text x="20" y="215" font-size="13" fill="#e5e7eb">steps</text>
<polyline points="110,314 270,296 430,280 590,262" fill="none" stroke="#a3e635" stroke-width="3"/>
<circle cx="110" cy="314" r="4" fill="#a3e635"/><circle cx="270" cy="296" r="4" fill="#a3e635"/><circle cx="430" cy="280" r="4" fill="#a3e635"/><circle cx="590" cy="262" r="4" fill="#a3e635"/>
<text x="110" y="334" font-size="13" fill="#a3e635" text-anchor="middle">10</text>
<text x="270" y="316" font-size="13" fill="#a3e635" text-anchor="middle">14</text>
<text x="430" y="300" font-size="13" fill="#a3e635" text-anchor="middle">17</text>
<text x="590" y="282" font-size="13" fill="#a3e635" text-anchor="middle">20</text>
<text x="350" y="240" font-size="13" fill="#f97316">linear scan: n steps (10^6 at n = 10^6)</text>
</svg>
