<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 632" font-family="Inter, sans-serif">
<title>Five containers, five memory layouts</title>
<desc>Cells of a vector with spare capacity, deque blocks behind a pointer array, linked list nodes, a red-black tree and hash buckets with chains.</desc>
<defs><marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a7adb5"/></marker></defs>
<rect width="900" height="632" rx="14" fill="#17181b"/>
<text x="32" y="44" font-size="22" font-weight="bold" fill="#e9e7e3">Five containers, five memory layouts</text>
<rect x="32" y="64" width="836" height="92" rx="10" fill="#22252a"/>
<rect x="32" y="168" width="836" height="104" rx="10" fill="#22252a"/>
<rect x="32" y="284" width="836" height="92" rx="10" fill="#22252a"/>
