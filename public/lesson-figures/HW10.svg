<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 475" font-family="Inter, Arial, sans-serif">
<title>Firmware speed loop on a fixed timer tick</title>
<desc>Block diagram of a firmware speed control loop: a fixed 100 Hz timer tick triggers reading encoder counts, estimating velocity, a PI controller with clamp and anti-windup, conversion to signed PWM with dead-zone compensation, a safety gate, the motor driver and the motor, with the encoder closing the loop. Below, a step response plot with rise time, overshoot and a two percent band.</desc>
<rect width="760" height="475" fill="#191b1f" rx="12"/>
<text x="380" y="28" font-size="17" fill="#e5e7eb" text-anchor="middle" font-weight="bold">Speed loop: count, estimate, PI, PWM, safety gate, motor</text>
<rect x="28.0" y="82" width="92" height="62" rx="8" fill="#272a2f" stroke="#53b2dd" stroke-width="2"/>
<text x="74.0" y="108" font-size="13" fill="#e5e7eb" text-anchor="middle" font-weight="bold">Timer tick</text>
<text x="74.0" y="127" font-size="10.5" fill="#e5e7eb" text-anchor="middle">every dt = 10 ms</text>
<rect x="130.0" y="82" width="92" height="62" rx="8" fill="#272a2f" stroke="#53b2dd" stroke-width="2"/>
<text x="176.0" y="108" font-size="13" fill="#e5e7eb" text-anchor="middle" font-weight="bold">Encoder</text>
<text x="176.0" y="127" font-size="10.5" fill="#e5e7eb" text-anchor="middle">count delta</text>
<line x1="120.0" y1="113.0" x2="130.0" y2="113.0" stroke="#e5e7eb" stroke-width="2"/>
<polygon points="130.0,113.0 122.8,116.5 122.8,109.5" fill="#e5e7eb"/>
<rect x="232.0" y="82" width="92" height="62" rx="8" fill="#272a2f" stroke="#9ccd4e" stroke-width="2"/>
<text x="278.0" y="108" font-size="13" fill="#e5e7eb" text-anchor="middle" font-weight="bold">Velocity</text>
<text x="278.0" y="127" font-size="10.5" fill="#e5e7eb" text-anchor="middle">w = 2 pi d / (N dt)</text>
<line x1="222.0" y1="113.0" x2="232.0" y2="113.0" stroke="#e5e7eb" stroke-width="2"/>
<polygon points="232.0,113.0 224.8,116.5 224.8,109.5" fill="#e5e7eb"/>
<rect x="334.0" y="82" width="92" height="62" rx="8" fill="#272a2f" stroke="#9ccd4e" stroke-width="2"/>
<text x="380.0" y="108" font-size="13" fill="#e5e7eb" text-anchor="middle" font-weight="bold">PI</text>
<text x="380.0" y="127" font-size="10.5" fill="#e5e7eb" text-anchor="middle">clamp, anti-windup</text>
<line x1="324.0" y1="113.0" x2="334.0" y2="113.0" stroke="#e5e7eb" stroke-width="2"/>
<polygon points="334.0,113.0 326.8,116.5 326.8,109.5" fill="#e5e7eb"/>
<rect x="436.0" y="82" width="92" height="62" rx="8" fill="#272a2f" stroke="#9ccd4e" stroke-width="2"/>
<text x="482.0" y="108" font-size="13" fill="#e5e7eb" text-anchor="middle" font-weight="bold">PWM + dir</text>
<text x="482.0" y="127" font-size="10.5" fill="#e5e7eb" text-anchor="middle">dead-zone skip</text>
<line x1="426.0" y1="113.0" x2="436.0" y2="113.0" stroke="#e5e7eb" stroke-width="2"/>
<polygon points="436.0,113.0 428.8,116.5 428.8,109.5" fill="#e5e7eb"/>
<rect x="538.0" y="82" width="92" height="62" rx="8" fill="#272a2f" stroke="#e5e7eb" stroke-width="2"/>
<text x="584.0" y="108" font-size="13" fill="#e5e7eb" text-anchor="middle" font-weight="bold">Driver</text>
<text x="584.0" y="127" font-size="10.5" fill="#e5e7eb" text-anchor="middle">H-bridge</text>
<line x1="528.0" y1="113.0" x2="538.0" y2="113.0" stroke="#e5e7eb" stroke-width="2"/>
<polygon points="538.0,113.0 530.8,116.5 530.8,109.5" fill="#e5e7eb"/>
<rect x="640.0" y="82" width="92" height="62" rx="8" fill="#272a2f" stroke="#e5e7eb" stroke-width="2"/>
<text x="686.0" y="108" font-size="13" fill="#e5e7eb" text-anchor="middle" font-weight="bold">Motor</text>
<text x="686.0" y="127" font-size="10.5" fill="#e5e7eb" text-anchor="middle">+ encoder</text>
<line x1="630.0" y1="113.0" x2="640.0" y2="113.0" stroke="#e5e7eb" stroke-width="2"/>
<polygon points="640.0,113.0 632.8,116.5 632.8,109.5" fill="#e5e7eb"/>
<line x1="74.0" y1="82" x2="74.0" y2="66" stroke="#53b2dd" stroke-width="2"/>
<line x1="74.0" y1="66" x2="380.0" y2="66" stroke="#53b2dd" stroke-width="2" stroke-dasharray="5 3"/>
<line x1="380.0" y1="66" x2="380.0" y2="82" stroke="#53b2dd" stroke-width="2"/>
<polygon points="380.0,82.0 376.5,74.8 383.5,74.8" fill="#53b2dd"/>
<text x="278.0" y="60" font-size="11" fill="#53b2dd" text-anchor="middle">ISR sets a flag; loop() reads, computes, writes - same dt every time</text>
<text x="380.0" y="162" font-size="11" fill="#d97936" text-anchor="middle">r (rad/s)</text>
<line x1="380.0" y1="168" x2="380.0" y2="146" stroke="#d97936" stroke-width="2"/>
<polygon points="380.0,146.0 383.5,153.2 376.5,153.2" fill="#d97936"/>
<line x1="686.0" y1="144" x2="686.0" y2="184" stroke="#e5e7eb" stroke-width="2"/>
<line x1="686.0" y1="184" x2="176.0" y2="184" stroke="#e5e7eb" stroke-width="2"/>
<line x1="176.0" y1="184" x2="176.0" y2="144" stroke="#e5e7eb" stroke-width="2"/>
<polygon points="176.0,144.0 179.5,151.2 172.5,151.2" fill="#e5e7eb"/>
<text x="491.0" y="200" font-size="11" fill="#e5e7eb" text-anchor="middle">encoder A/B pulses -&gt; hardware counter</text>
<rect x="430.0" y="74" width="206.0" height="78" rx="8" fill="none" stroke="#d97936" stroke-width="2" stroke-dasharray="6 4"/>
<text x="533.0" y="174" font-size="10" fill="#e5e7eb" text-anchor="middle"></text>
<text x="594.0" y="218" font-size="11" fill="#d97936" text-anchor="middle">safety gate: command timeout, stall, current limit -&gt; pwm = 0</text>
<line x1="50" y1="400" x2="430" y2="400" stroke="#e5e7eb" stroke-width="2"/>
<line x1="50" y1="400" x2="50" y2="240" stroke="#e5e7eb" stroke-width="2"/>
<text x="240.0" y="422" font-size="12" fill="#e5e7eb" text-anchor="middle">time (s)</text>
<text x="16" y="325.0" font-size="12" fill="#e5e7eb" text-anchor="middle" transform="rotate(-90 16 325.0)">speed (rad/s)</text>
<line x1="50" y1="275.0" x2="430" y2="275.0" stroke="#d97936" stroke-width="1.5" stroke-dasharray="5 3"/>
<text x="434" y="279.0" font-size="11" fill="#d97936" text-anchor="start">r</text>
<rect x="50" y="272.5" width="380" height="5.0" fill="#d97936" opacity="0.18"/>
<polyline fill="none" stroke="#53b2dd" stroke-width="2.5" points="50.0,400.0 53.2,386.7 56.3,374.0 59.5,362.5 62.7,352.2 65.8,342.8 69.0,334.8 72.2,327.7 75.3,321.4 78.5,315.8 81.7,311.1 84.8,306.9 88.0,303.2 91.2,300.0 94.3,297.2 97.5,294.7 100.7,292.5 103.8,290.7 107.0,289.1 110.2,287.8 113.3,286.4 116.5,285.2 119.7,284.2 122.8,283.2 126.0,282.6 129.2,281.8 132.3,281.2 135.5,280.8 138.7,280.3 141.8,279.6 145.0,279.4 148.2,279.0 151.3,278.7 154.5,278.2 157.7,277.8 160.8,277.7 164.0,277.4 167.2,277.3 170.3,277.1 173.5,277.0 176.7,276.7 179.8,276.6 183.0,276.6 186.2,276.4 189.3,276.4 192.5,276.1 195.7,276.0 198.8,275.9 202.0,276.0 205.2,275.8 208.3,275.7 211.5,275.7 214.7,275.8 217.8,275.8 221.0,275.6 224.2,275.5 227.3,275.5 230.5,275.6 233.7,275.7 236.8,275.4 240.0,275.4 243.2,275.4 246.3,275.4 249.5,275.4 252.7,275.5 255.8,275.3 259.0,275.2 262.2,275.2 265.3,275.3 268.5,275.3 271.7,275.3 274.8,275.3 278.0,275.1 281.2,275.0 284.3,274.9 287.5,275.0 290.7,275.0 293.8,275.1 297.0,275.1 300.2,275.1 303.3,275.2 306.5,275.2 309.7,275.2 312.8,275.0 316.0,274.9 319.2,274.9 322.3,274.9 325.5,275.0 328.7,275.0 331.8,275.0 335.0,275.1 338.2,275.1 341.3,275.1 344.5,275.2 347.7,275.2 350.8,275.0 354.0,274.9 357.2,274.8 360.3,274.9 363.5,274.9 366.7,275.0 369.8,275.0 373.0,275.1 376.2,275.1 379.3,275.1 382.5,275.2 385.7,275.2 388.8,275.0 392.0,274.9 395.2,274.8 398.3,274.9 401.5,274.9 404.7,275.0 407.8,275.0 411.0,275.1 414.2,275.1 417.3,275.1 420.5,275.2 423.7,275.2 426.8,275.0"/>
<text x="424" y="246.5" font-size="11" fill="#d97936" text-anchor="end">+-2 % band</text>
<line x1="53.166666666666664" y1="400" x2="53.166666666666664" y2="392" stroke="#9ccd4e" stroke-width="2"/>
<line x1="113.33333333333334" y1="400" x2="113.33333333333334" y2="392" stroke="#9ccd4e" stroke-width="2"/>
<text x="83.25" y="386" font-size="11" fill="#9ccd4e" text-anchor="middle">rise time</text>
<text x="56" y="234" font-size="11.5" fill="#e5e7eb" text-anchor="start">step 0 -&gt; 10 rad/s (quantised, filtered estimate drives PI)</text>
<rect x="460" y="250" width="280" height="150" rx="8" fill="#191b1f" stroke="#e5e7eb" stroke-width="1"/>
<text x="474" y="272" font-size="13" fill="#e5e7eb" text-anchor="start" font-weight="bold">What to read from a step test</text>
<text x="474" y="298" font-size="12" fill="#e5e7eb" text-anchor="start">rise time: 10 % to 90 % of r</text>
<text x="474" y="318" font-size="12" fill="#e5e7eb" text-anchor="start">overshoot: peak above r, in %</text>
<text x="474" y="338" font-size="12" fill="#e5e7eb" text-anchor="start">steady-state error: r minus the tail mean</text>
<text x="474" y="358" font-size="12" fill="#e5e7eb" text-anchor="start">settling time: stays inside the 2 % band</text>
<text x="474" y="378" font-size="12" fill="#e5e7eb" text-anchor="start">if windup: output stuck at 255 after r drops</text>
<text x="380" y="458" font-size="12.5" fill="#e5e7eb" text-anchor="middle">Units first (counts -&gt; rad/s), fixed dt second, tune third, safety always.</text>
</svg>