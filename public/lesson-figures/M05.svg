<circle cx="272.6" cy="290.0" r="5" fill="#e9e7e3"/>
<text x="282.6" y="312" font-size="14" fill="#a7adb5">(2, 4)</text>
<text x="366.9" y="314.5" font-size="15" font-weight="600" fill="#86abe2">y = x²</text>
<line x1="98" y1="162" x2="130.0" y2="162.0" stroke="#e0904f" stroke-width="2.5"/>
