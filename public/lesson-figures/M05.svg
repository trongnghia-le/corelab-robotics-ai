<line x1="520" y1="360" x2="520.0" y2="365.0" stroke="#a7adb5" stroke-width="1.5"/>
<text x="520" y="380" font-size="14" text-anchor="middle" fill="#a7adb5">0</text>
<line x1="665.5" y1="360" x2="665.5" y2="365.0" stroke="#a7adb5" stroke-width="1.5"/>
