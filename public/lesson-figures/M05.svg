<text x="272.6" y="380" font-size="14" text-anchor="middle" fill="#a7adb5">2</text>
<line x1="366.9" y1="360" x2="366.9" y2="365.0" stroke="#a7adb5" stroke-width="1.5"/>
<text x="366.9" y="380" font-size="14" text-anchor="middle" fill="#a7adb5">3</text>
<line x1="79" y1="360" x2="84.0" y2="360.0" stroke="#a7adb5" stroke-width="1.5"/>
<text x="76" y="365" font-size="14" text-anchor="end" fill="#a7adb5">0</text>
<line x1="79" y1="290" x2="84.0" y2="290.0" stroke="#a7adb5" stroke-width="1.5"/>
<text x="76" y="295" font-size="14" text-anchor="end" fill="#a7adb5">4</text>
<line x1="79" y1="220" x2="84.0" y2="220.0" stroke="#a7adb5" stroke-width="1.5"/>
<text x="76" y="225" font-size="14" text-anchor="end" fill="#a7adb5">8</text>
