<line x1="105" y1="270" x2="215" y2="142" stroke="#f97316" stroke-width="2" stroke-dasharray="0" transform="translate(0,0)"/>
<circle cx="160" cy="206" r="5" fill="#a3e635"/>
<polyline points="438,118 474,186 510,252 564,212 636,149 690,97" fill="none" stroke="#a3e635" stroke-width="3"/>
