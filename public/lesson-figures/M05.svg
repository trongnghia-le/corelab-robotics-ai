<text x="512" y="305" font-size="14" text-anchor="end" fill="#a7adb5">4</text>
<line x1="515" y1="240" x2="520.0" y2="240.0" stroke="#a7adb5" stroke-width="1.5"/>
<text x="512" y="245" font-size="14" text-anchor="end" fill="#a7adb5">4.5</text>
<line x1="515" y1="180" x2="520.0" y2="180.0" stroke="#a7adb5" stroke-width="1.5"/>
<text x="512" y="185" font-size="14" text-anchor="end" fill="#a7adb5">5</text>
<line x1="520" y1="360" x2="840.0" y2="360.0" stroke="#a7adb5" stroke-width="1.5"/>
<line x1="520" y1="150" x2="520.0" y2="360.0" stroke="#a7adb5" stroke-width="1.5"/>
<text x="840" y="402" font-size="15" text-anchor="end" fill="#e9e7e3">step h</text>
<text x="520" y="138" font-size="15" fill="#e9e7e3">secant slope</text>
<polyline points="520.0,300.0 825.5,174.0" fill="none" stroke="#e0904f" stroke-width="2.5" stroke-linejoin="round"/>
<circle cx="810.9" cy="180.0" r="5" fill="#e9e7e3"/>
<circle cx="665.5" cy="240.0" r="5" fill="#e9e7e3"/>
<circle cx="549.1" cy="288.0" r="5" fill="#e9e7e3"/>
<text x="802.9" y="170" font-size="14" text-anchor="end" fill="#a7adb5">5</text>
<text x="657.5" y="230" font-size="14" text-anchor="end" fill="#a7adb5">4.5</text>
<text x="541.1" y="278" font-size="14" text-anchor="end" fill="#a7adb5">4.1</text>
<circle cx="520.0" cy="300.0" r="5" fill="#17181b" stroke="#e0904f" stroke-width="2"/>
<text x="532" y="322" font-size="14" fill="#a7adb5">h → 0: slope 4</text>
<text x="650.9" y="180" font-size="15" font-weight="600" fill="#e0904f">slope = 4 + h</text>
</svg>
