<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" font-family="Inter, sans-serif">
<title>Derivative: secants close in on the tangent</title>
<desc>Left: parabola y = x² with the tangent at x = 2 and two secants. Right: the secant slope equals 4 + h and approaches 4 as h goes to 0.</desc>
<rect width="900" height="460" rx="14" fill="#17181b"/>

