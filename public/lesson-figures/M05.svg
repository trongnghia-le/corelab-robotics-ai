<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" font-family="Inter, Arial, sans-serif" font-size="14">
<rect width="720" height="340" fill="#111827" rx="12"/>
<g fill="#e5e7eb">
<text x="24" y="32" font-size="15" font-weight="bold">Tangent line: f(2+h) is about 4 + 4h</text>
<text x="384" y="32" font-size="15" font-weight="bold">Central difference error versus step h</text>
<text x="232" y="286" font-size="13">x</text><text x="30" y="84" font-size="13">y</text>
<text x="62" y="230" fill="#38bdf8">y = x^2</text>
<text x="60" y="130" fill="#f97316">tangent at x = 2</text>
<text x="90" y="310" font-size="13">slope 4: the line is a local model</text>
<text x="420" y="300" font-size="13">h = 1e-1</text><text x="560" y="300" font-size="13">1e-8</text><text x="640" y="300" font-size="13">1e-15</text>
<text x="384" y="76" font-size="13">log error</text>
<text x="436" y="108" fill="#a3e635" font-size="13">truncation ~ h^2</text>
<text x="590" y="200" fill="#f97316" font-size="13">rounding ~ 1/h</text>
<text x="500" y="324" font-size="13">smaller h is not always better</text>
</g>
<g stroke="#e5e7eb" stroke-width="1.5"><line x1="50" y1="270" x2="240" y2="270"/><line x1="50" y1="270" x2="50" y2="70"/><line x1="420" y1="270" x2="700" y2="270"/><line x1="420" y1="270" x2="420" y2="70"/></g>
