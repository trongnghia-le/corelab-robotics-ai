<text x="76" y="155" font-size="14" text-anchor="end" fill="#a7adb5">12</text>
<line x1="84" y1="360" x2="414.0" y2="360.0" stroke="#a7adb5" stroke-width="1.5"/>
<line x1="84" y1="150" x2="84.0" y2="360.0" stroke="#a7adb5" stroke-width="1.5"/>
<text x="414" y="402" font-size="15" text-anchor="end" fill="#e9e7e3">x</text>
<text x="84" y="138" font-size="15" fill="#e9e7e3">y</text>
<polyline points="84.0,360.0 88.7,360.0 93.4,359.8 98.1,359.6 102.9,359.3 107.6,358.9 112.3,358.4 117.0,357.9 121.7,357.2 126.4,356.5 131.1,355.6 135.9,354.7 140.6,353.7 145.3,352.6 150.0,351.4 154.7,350.2 159.4,348.8 164.1,347.4 168.9,345.8 173.6,344.2 178.3,342.5 183.0,340.7 187.7,338.8 192.4,336.9 197.1,334.8 201.9,332.7 206.6,330.4 211.3,328.1 216.0,325.7 220.7,323.2 225.4,320.6 230.1,318.0 234.9,315.2 239.6,312.4 244.3,309.4 249.0,306.4 253.7,303.3 258.4,300.1 263.1,296.8 267.9,293.5 272.6,290.0 277.3,286.5 282.0,282.8 286.7,279.1 291.4,275.3 296.1,271.4 300.9,267.4 305.6,263.4 310.3,259.2 315.0,255.0 319.7,250.6 324.4,246.2 329.1,241.7 333.9,237.1 338.6,232.4 343.3,227.7 348.0,222.8 352.7,217.9 357.4,212.8 362.1,207.7 366.9,202.5 371.6,197.2 376.3,191.8 381.0,186.4 385.7,180.8 390.4,175.2 395.1,169.4 399.9,163.6 404.6,157.7" fill="none" stroke="#86abe2" stroke-width="3" stroke-linejoin="round"/>
