<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" font-family="Inter, Arial, sans-serif">
<rect width="720" height="380" fill="#111827" rx="12"/>
<text x="24" y="30" fill="#e5e7eb" font-size="16" font-weight="bold">Two elbow solutions</text>
<text x="400" y="30" fill="#e5e7eb" font-size="16" font-weight="bold">Reachable ring</text>
<!-- left: base (60,320), target (300,120), l1=200, l2=170; elbows are mirror images across the dashed line -->
<line x1="60" y1="320" x2="300" y2="120" stroke="#e5e7eb" stroke-dasharray="6 4"/>
<g stroke="#38bdf8" stroke-width="5" fill="none" stroke-linecap="round"><polyline points="60,320 256.8,284.4 300,120"/></g>
<g stroke="#a3e635" stroke-width="5" fill="none" stroke-linecap="round"><polyline points="60,320 130.5,132.8 300,120"/></g>
<circle cx="60" cy="320" r="7" fill="#e5e7eb"/><circle cx="300" cy="120" r="8" fill="#f97316"/>
<circle cx="256.8" cy="284.4" r="6" fill="#38bdf8"/><circle cx="130.5" cy="132.8" r="6" fill="#a3e635"/>
<text x="40" y="352" fill="#e5e7eb" font-size="13">base</text>
<text x="310" y="108" fill="#f97316" font-size="13">target (x, y)</text>
<text x="124" y="112" fill="#a3e635" font-size="13">elbow B (q2 &lt; 0)</text>
<text x="268" y="312" fill="#38bdf8" font-size="13">elbow A (q2 &gt; 0)</text>
<text x="200" y="250" fill="#e5e7eb" font-size="13" font-style="italic">r</text>
<!-- right: ring centred (550,205), outer 140, inner 56 -->
<text x="550" y="54" fill="#e5e7eb" font-size="13" text-anchor="middle">edges: 1 solution</text>
<circle cx="550" cy="205" r="140" fill="#1f2937" stroke="#38bdf8" stroke-width="2"/>
<circle cx="550" cy="205" r="56" fill="#111827" stroke="#f97316" stroke-width="2"/>
<line x1="550" y1="205" x2="690" y2="205" stroke="#e5e7eb"/>
<text x="648" y="197" fill="#e5e7eb" font-size="12" text-anchor="middle">l1 + l2</text>
<line x1="550" y1="205" x2="494" y2="205" stroke="#f97316" stroke-width="2"/>
<text x="452" y="197" fill="#f97316" font-size="12" text-anchor="middle">|l1 - l2|</text>
<circle cx="550" cy="205" r="5" fill="#e5e7eb"/>
<text x="550" y="238" fill="#e5e7eb" font-size="12" text-anchor="middle">hole: 0</text>
<text x="550" y="102" fill="#a3e635" font-size="13" text-anchor="middle">2 solutions</text>
<circle cx="550" cy="124" r="6" fill="#a3e635"/>
<circle cx="650" cy="350" r="6" fill="#f97316"/>
<text x="650" y="372" fill="#f97316" font-size="13" text-anchor="middle">outside: 0 solutions</text>
</svg>
