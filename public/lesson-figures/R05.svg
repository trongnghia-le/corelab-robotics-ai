<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" font-family="Inter, Arial, sans-serif">
<rect width="720" height="380" fill="#111827" rx="12"/>
<text x="24" y="30" fill="#e5e7eb" font-size="16" font-weight="bold">Two elbow solutions</text>
<text x="400" y="30" fill="#e5e7eb" font-size="16" font-weight="bold">Reachable ring</text>
<!-- left: base (60,320), target (300,120) -->
<line x1="60" y1="320" x2="300" y2="120" stroke="#e5e7eb" stroke-dasharray="6 4"/>
<g stroke="#38bdf8" stroke-width="5" fill="none" stroke-linecap="round"><polyline points="60,320 76,166 300,120"/></g>
<g stroke="#a3e635" stroke-width="5" fill="none" stroke-linecap="round"><polyline points="60,320 226,276 300,120"/></g>
<circle cx="60" cy="320" r="7" fill="#e5e7eb"/><circle cx="300" cy="120" r="8" fill="#f97316"/>
<circle cx="76" cy="166" r="6" fill="#38bdf8"/><circle cx="226" cy="276" r="6" fill="#a3e635"/>
<text x="40" y="350" fill="#e5e7eb" font-size="13">base</text>
<text x="244" y="104" fill="#f97316" font-size="13">target (x, y)</text>
<text x="86" y="156" fill="#38bdf8" font-size="13">elbow A (q2 &gt; 0)</text>
<text x="196" y="302" fill="#a3e635" font-size="13">elbow B (q2 &lt; 0)</text>
<text x="150" y="214" fill="#e5e7eb" font-size="13" transform="rotate(-39 150 214)">r</text>
<!-- right: ring centred (550,215) outer 130 inner 50 -->
<circle cx="550" cy="215" r="130" fill="#1f2937" stroke="#38bdf8" stroke-width="2"/>
<circle cx="550" cy="215" r="50" fill="#111827" stroke="#f97316" stroke-width="2"/>
<circle cx="550" cy="215" r="5" fill="#e5e7eb"/>
<line x1="550" y1="215" x2="680" y2="215" stroke="#e5e7eb"/><text x="610" y="207" fill="#e5e7eb" font-size="13">l1 + l2</text>
<line x1="550" y1="215" x2="550" y2="165" stroke="#f97316"/><text x="556" y="190" fill="#f97316" font-size="13">|l1 - l2|</text>
<circle cx="610" cy="140" r="6" fill="#a3e635"/><text x="620" y="136" fill="#a3e635" font-size="13">2 solutions</text>
<circle cx="680" cy="215" r="0" fill="none"/>
<circle cx="640" cy="345" r="6" fill="#f97316"/><text x="500" y="350" fill="#f97316" font-size="13">outside: 0 solutions</text>
<circle cx="560" cy="245" r="0"/>
<text x="480" y="232" fill="#e5e7eb" font-size="13" text-anchor="middle">hole: 0</text>
<text x="550" y="68" fill="#e5e7eb" font-size="13" text-anchor="middle">edges: 1 solution</text>
</svg>
