<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380">
<rect width="760" height="380" fill="#191b1f" rx="12"/>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#e5e7eb"/></marker></defs>
<text x="24" y="30" fill="#e5e7eb" font-size="16" text-anchor="start" font-family="Inter, Arial, sans-serif">Sampled loop: stale commands reduce the usable gain</text>
<rect x="40" y="90" width="100" height="50" rx="6" fill="none" stroke="#53b2dd" stroke-width="2"/>
<text x="90.0" y="111.5" fill="#53b2dd" font-size="14" text-anchor="middle" font-family="Inter, Arial, sans-serif">sample</text>
<text x="90.0" y="128.5" fill="#53b2dd" font-size="14" text-anchor="middle" font-family="Inter, Arial, sans-serif">y(kT)</text>
<rect x="190" y="90" width="110" height="50" rx="6" fill="none" stroke="#d97936" stroke-width="2"/>
<text x="245.0" y="111.5" fill="#d97936" font-size="14" text-anchor="middle" font-family="Inter, Arial, sans-serif">compute</text>
<text x="245.0" y="128.5" fill="#d97936" font-size="14" text-anchor="middle" font-family="Inter, Arial, sans-serif">u = −K y</text>
<rect x="350" y="90" width="100" height="50" rx="6" fill="none" stroke="#9ccd4e" stroke-width="2"/>
<text x="400.0" y="111.5" fill="#9ccd4e" font-size="14" text-anchor="middle" font-family="Inter, Arial, sans-serif">hold</text>
<text x="400.0" y="128.5" fill="#9ccd4e" font-size="14" text-anchor="middle" font-family="Inter, Arial, sans-serif">ZOH</text>
<rect x="350" y="200" width="100" height="50" rx="6" fill="none" stroke="#e5e7eb" stroke-width="2"/>
<text x="400.0" y="221.5" fill="#e5e7eb" font-size="14" text-anchor="middle" font-family="Inter, Arial, sans-serif">plant</text>
<text x="400.0" y="238.5" fill="#e5e7eb" font-size="14" text-anchor="middle" font-family="Inter, Arial, sans-serif">y' = u</text>
<line x1="140" y1="115" x2="188" y2="115" stroke="#e5e7eb" stroke-width="2" marker-end="url(#a)"/>
<line x1="300" y1="115" x2="348" y2="115" stroke="#e5e7eb" stroke-width="2" marker-end="url(#a)"/>
<line x1="400" y1="140" x2="400" y2="198" stroke="#e5e7eb" stroke-width="2" marker-end="url(#a)"/>
<path d="M350,225 L60,225 L60,142" fill="none" stroke="#e5e7eb" stroke-width="2" marker-end="url(#a)"/>
<text x="70" y="262" fill="#e5e7eb" font-size="13" text-anchor="start" font-family="Inter, Arial, sans-serif">measurement y(t)</text>
<text x="312" y="84" fill="#d97936" font-size="13" text-anchor="start" font-family="Inter, Arial, sans-serif">+ latency d·T</text>
<text x="60" y="300" fill="#e5e7eb" font-size="14" text-anchor="start" font-family="Inter, Arial, sans-serif">effective delay ≈ (d + ½)·T</text>
<text x="60" y="326" fill="#9ccd4e" font-size="14" text-anchor="start" font-family="Inter, Arial, sans-serif">stable only if K·(d + ½)·T &lt; π/2 (approximately, for d ≥ 1)</text>
<text x="510" y="66" fill="#e5e7eb" font-size="14" text-anchor="start" font-family="Inter, Arial, sans-serif">max stable K·T</text>
<rect x="520" y="80" width="210" height="200" rx="0" fill="none" stroke="#70747b" stroke-width="2"/>
<rect x="538" y="110.0" width="34" height="170.0" fill="#9ccd4e"/>
<text x="555.0" y="104.0" fill="#e5e7eb" font-size="13" text-anchor="middle" font-family="Inter, Arial, sans-serif">2.0</text>
<text x="555.0" y="298" fill="#e5e7eb" font-size="13" text-anchor="middle" font-family="Inter, Arial, sans-serif">d=0</text>
<rect x="586" y="195.0" width="34" height="85.0" fill="#53b2dd"/>
<text x="603.0" y="189.0" fill="#e5e7eb" font-size="13" text-anchor="middle" font-family="Inter, Arial, sans-serif">1.0</text>
<text x="603.0" y="298" fill="#e5e7eb" font-size="13" text-anchor="middle" font-family="Inter, Arial, sans-serif">d=1</text>
<rect x="634" y="227.47" width="34" height="52.53" fill="#53b2dd"/>
<text x="651.0" y="221.47" fill="#e5e7eb" font-size="13" text-anchor="middle" font-family="Inter, Arial, sans-serif">0.618</text>
<text x="651.0" y="298" fill="#e5e7eb" font-size="13" text-anchor="middle" font-family="Inter, Arial, sans-serif">d=2</text>
<rect x="682" y="242.175" width="34" height="37.825" fill="#d97936"/>
<text x="699.0" y="236.175" fill="#e5e7eb" font-size="13" text-anchor="middle" font-family="Inter, Arial, sans-serif">0.445</text>
<text x="699.0" y="298" fill="#e5e7eb" font-size="13" text-anchor="middle" font-family="Inter, Arial, sans-serif">d=3</text>
<text x="625.0" y="320" fill="#e5e7eb" font-size="13" text-anchor="middle" font-family="Inter, Arial, sans-serif">delay samples d</text>
</svg>