<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" font-family="Inter, Arial, sans-serif" font-size="14">
<rect width="720" height="340" fill="#111827" rx="12"/>
<g fill="#e5e7eb">
<text x="24" y="30" font-size="15" font-weight="bold">Gradient descent on J = (theta - 3)^2</text>
<text x="384" y="30" font-size="15" font-weight="bold">Error factor |1 - 2 alpha| per step</text>
<text x="60" y="68" fill="#38bdf8" font-size="13">J(theta)</text>
<text x="262" y="290" font-size="13">theta</text>
<text x="120" y="222" fill="#a3e635" font-size="13">alpha = 0.1: slow, safe</text>
<text x="24" y="312" fill="#f97316" font-size="13">alpha = 1.1: 0 to 6.6 to -1.3 to 8.2 ... (diverges)</text>
<text x="394" y="136" font-size="13">1</text><text x="394" y="274" font-size="13">0</text>
<text x="510.0" y="292" font-size="13">0.5</text><text x="614" y="292" font-size="13">1</text><text x="416" y="292" font-size="13">0</text>
<text x="640" y="292" font-size="13">alpha</text>
<text x="490.0" y="240" fill="#a3e635" font-size="13">one step</text>
<text x="430" y="122" fill="#f97316" font-size="13">above 1: error grows</text>
<text x="440" y="190" fill="#a3e635" font-size="13">below 1: converges</text>
<text x="384" y="318" font-size="13">stable range 0 &lt; alpha &lt; 1</text>
</g>
