<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="Inter, sans-serif">
<title>Composition error against the size of the rotations</title>
<desc>Log-log plot of the error of predicting log(exp a exp b) by a+b (slope 2) and by a+b+half a cross b (slope 3) for epsilon from 0.003 to 0.1.</desc>
<defs></defs>
<rect width="900" height="500" rx="14" fill="#17181b"/>
<text x="32" y="44" font-size="22" font-weight="bold" fill="#e9e7e3">Composition error against the size of the rotations</text>
<rect x="32" y="72" width="560" height="396" rx="10" fill="#22252a"/>
<rect x="616" y="72" width="252" height="396" rx="10" fill="#22252a"/>
<line x1="112.0" y1="365.3" x2="568.0" y2="365.3" stroke="#3d4148" stroke-width="1"/>
<text x="102" y="370.333" font-size="14" text-anchor="end" fill="#a7adb5">1e-9</text>
<line x1="112.0" y1="304.0" x2="568.0" y2="304.0" stroke="#3d4148" stroke-width="1"/>
<text x="102" y="309" font-size="14" text-anchor="end" fill="#a7adb5">1e-7</text>
<line x1="112.0" y1="242.7" x2="568.0" y2="242.7" stroke="#3d4148" stroke-width="1"/>
<text x="102" y="247.667" font-size="14" text-anchor="end" fill="#a7adb5">1e-5</text>
<line x1="112.0" y1="181.3" x2="568.0" y2="181.3" stroke="#3d4148" stroke-width="1"/>
<text x="102" y="186.333" font-size="14" text-anchor="end" fill="#a7adb5">1e-3</text>
<line x1="112.0" y1="120.0" x2="568.0" y2="120.0" stroke="#3d4148" stroke-width="1"/>
<text x="102" y="125" font-size="14" text-anchor="end" fill="#a7adb5">1e-1</text>
<line x1="152.1" y1="120.0" x2="152.1" y2="396.0" stroke="#3d4148" stroke-width="1"/>
<text x="152.149" y="418" font-size="14" text-anchor="middle" fill="#a7adb5">0.003</text>
<line x1="271.4" y1="120.0" x2="271.4" y2="396.0" stroke="#3d4148" stroke-width="1"/>
<text x="271.365" y="418" font-size="14" text-anchor="middle" fill="#a7adb5">0.01</text>
<line x1="380.1" y1="120.0" x2="380.1" y2="396.0" stroke="#3d4148" stroke-width="1"/>
<text x="380.149" y="418" font-size="14" text-anchor="middle" fill="#a7adb5">0.03</text>
<line x1="499.4" y1="120.0" x2="499.4" y2="396.0" stroke="#3d4148" stroke-width="1"/>
<text x="499.365" y="418" font-size="14" text-anchor="middle" fill="#a7adb5">0.1</text>
<line x1="112.0" y1="396.0" x2="568.0" y2="396.0" stroke="#a7adb5" stroke-width="1.5"/>
<line x1="112.0" y1="120.0" x2="112.0" y2="396.0" stroke="#a7adb5" stroke-width="1.5"/>
<polyline points="499.4,170.7 380.1,202.7 271.4,232.0 152.1,264.1" fill="none" stroke="#e0904f" stroke-width="3" stroke-linejoin="round"/>
<polyline points="499.4,225.1 380.1,273.2 271.4,317.1 152.1,365.2" fill="none" stroke="#86abe2" stroke-width="3" stroke-linejoin="round"/>
<circle cx="499.4" cy="170.7" r="5" fill="#e0904f"/>
<circle cx="380.1" cy="202.7" r="5" fill="#e0904f"/>
<circle cx="271.4" cy="232.0" r="5" fill="#e0904f"/>
<circle cx="152.1" cy="264.1" r="5" fill="#e0904f"/>
<circle cx="499.4" cy="225.1" r="5" fill="#86abe2"/>
<circle cx="380.1" cy="273.2" r="5" fill="#86abe2"/>
<circle cx="271.4" cy="317.1" r="5" fill="#86abe2"/>
<circle cx="152.1" cy="365.2" r="5" fill="#86abe2"/>
<line x1="128.0" y1="142.0" x2="158.0" y2="142.0" stroke="#e0904f" stroke-width="3"/>
<text x="168" y="147" font-size="15" font-weight="600" fill="#e0904f">a + b: slope 2</text>
<line x1="128.0" y1="170.0" x2="158.0" y2="170.0" stroke="#86abe2" stroke-width="3"/>
<text x="168" y="175" font-size="15" font-weight="600" fill="#86abe2">a + b + ½ a×b: slope 3</text>
<text x="285.365" y="255.986" font-size="14" fill="#a7adb5">ε = 0.01: 2.2e-05</text>
<text x="340" y="444" font-size="14" text-anchor="middle" fill="#a7adb5">ε (rad), a = ε(0.3, −0.2, 0.5), b = ε(0.4, 0.6, −0.1)</text>
<text x="48" y="106" font-size="14" fill="#a7adb5">error ‖Log(exp a exp b) − prediction‖</text>
<text x="636" y="104" font-size="17" font-weight="bold" fill="#e9e7e3">Reading the plot</text>
<text x="636" y="140" font-size="15" fill="#e9e7e3">Halve ε: first error ÷4,</text>
<text x="636" y="170" font-size="15" fill="#e9e7e3">second error ÷8.</text>
<text x="636" y="200" font-size="15" fill="#e9e7e3">Fitted slopes: 2.00, 3.00.</text>
<text x="636" y="230" font-size="15" fill="#e9e7e3">½ a×b is the whole</text>
<text x="636" y="260" font-size="15" fill="#e9e7e3">second-order BCH term.</text>
</svg>
