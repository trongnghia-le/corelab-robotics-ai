<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 580" font-family="Inter, sans-serif">
<title>Reverse accumulation on a graph with a shared node</title>
<desc>Graph of L=(x*y+x)*x at x=1.5, y=-2. Forward values and adjoints at each node; x feeds three consumers and its adjoint is the sum of three terms, -3.</desc>
<defs><marker id="mml05" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs>
<rect width="900" height="580" rx="14" fill="#17181b"/>
<text x="32" y="44" font-size="22" fill="#e9e7e3" text-anchor="start" font-weight="bold">Reverse accumulation on a graph with a shared node</text>
<line x1="141" y1="218" x2="305" y2="310" stroke="#a7adb5" stroke-width="2" stroke-linecap="round" marker-end="url(#mml05)"/>
<line x1="145" y1="381" x2="301" y2="340" stroke="#a7adb5" stroke-width="2" stroke-linecap="round" marker-end="url(#mml05)"/>
<line x1="376" y1="330" x2="520" y2="330" stroke="#a7adb5" stroke-width="2" stroke-linecap="round" marker-end="url(#mml05)"/>
<line x1="596" y1="330" x2="740" y2="330" stroke="#a7adb5" stroke-width="2" stroke-linecap="round" marker-end="url(#mml05)"/>
<path d="M 140 190 Q 330 110 546 298" fill="none" stroke="#a7adb5" stroke-width="2" stroke-linecap="round" marker-end="url(#mml05)"/>
<path d="M 140 194 Q 560 56 768 297" fill="none" stroke="#a7adb5" stroke-width="2" stroke-linecap="round" marker-end="url(#mml05)"/>
<circle cx="110" cy="200" r="32" fill="#22252a" stroke="#86abe2" stroke-width="2.5"/>
<text x="110" y="206" font-size="17" fill="#e9e7e3" text-anchor="middle" font-weight="bold">x</text>
<circle cx="110" cy="390" r="32" fill="#22252a" stroke="#86abe2" stroke-width="2.5"/>
<text x="110" y="396" font-size="17" fill="#e9e7e3" text-anchor="middle" font-weight="bold">y</text>
<circle cx="340" cy="330" r="32" fill="#22252a" stroke="#86abe2" stroke-width="2.5"/>
<text x="340" y="336" font-size="17" fill="#e9e7e3" text-anchor="middle" font-weight="bold">v₁</text>
<circle cx="560" cy="330" r="32" fill="#22252a" stroke="#86abe2" stroke-width="2.5"/>
<text x="560" y="336" font-size="17" fill="#e9e7e3" text-anchor="middle" font-weight="bold">v₂</text>
<circle cx="780" cy="330" r="32" fill="#22252a" stroke="#e0904f" stroke-width="2.5"/>
<text x="780" y="336" font-size="17" fill="#e9e7e3" text-anchor="middle" font-weight="bold">L</text>
<text x="110" y="150" font-size="15" fill="#86abe2" text-anchor="middle">x = 1.5</text>
<text x="110" y="262" font-size="15" fill="#e0904f" text-anchor="middle" font-weight="600">x̄ = −3</text>
<text x="110" y="340" font-size="15" fill="#86abe2" text-anchor="middle">y = −2</text>
<text x="110" y="452" font-size="15" fill="#e0904f" text-anchor="middle" font-weight="600">ȳ = 2.25</text>
<text x="340" y="382" font-size="15" fill="#86abe2" text-anchor="middle">v₁ = x·y = −3</text>
<text x="340" y="406" font-size="15" fill="#e0904f" text-anchor="middle" font-weight="600">v̄₁ = 1.5</text>
<text x="560" y="382" font-size="15" fill="#86abe2" text-anchor="middle">v₂ = v₁+x = −1.5</text>
<text x="560" y="406" font-size="15" fill="#e0904f" text-anchor="middle" font-weight="600">v̄₂ = 1.5</text>
<text x="780" y="382" font-size="15" fill="#86abe2" text-anchor="middle">L = v₂·x = −2.25</text>
<text x="780" y="406" font-size="15" fill="#e0904f" text-anchor="middle" font-weight="600">L̄ = 1</text>
<text x="560" y="87" font-size="15" fill="#86abe2" text-anchor="start">blue numbers: forward values</text>
<text x="560" y="113" font-size="15" fill="#e0904f" text-anchor="start">orange numbers: adjoints (bars)</text>
<rect x="32" y="478" width="836" height="84" rx="8" fill="#22252a" stroke="#3d4148" stroke-width="1.5"/>
<text x="48" y="504" font-size="17" fill="#e9e7e3" text-anchor="start" font-weight="bold">x is used three times, so x̄ is a sum of three terms</text>
<text x="48" y="530" font-size="15" fill="#86abe2" text-anchor="start">via v₁: v̄₁·y = 1.5·(−2) = −3</text>
<text x="380" y="530" font-size="15" fill="#6fc693" text-anchor="start">via v₂: v̄₂·1 = 1.5</text>
<text x="610" y="530" font-size="15" fill="#ae9ce6" text-anchor="start">directly in L: v₂ = −1.5</text>
<text x="48" y="552" font-size="15" fill="#e9e7e3" text-anchor="start" font-weight="600">sum: x̄ = −3 + 1.5 − 1.5 = −3  (check: dL/dx = 2xy + 2x = −3)</text>
</svg>
