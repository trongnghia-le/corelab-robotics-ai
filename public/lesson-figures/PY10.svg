<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" font-family="Inter, Arial, sans-serif">
<rect width="760" height="360" fill="#111827" rx="12"/>
<text x="20" y="30" font-size="16" fill="#e5e7eb" font-weight="bold">Iterator protocol</text>
<rect x="20" y="50" width="150" height="56" rx="8" fill="none" stroke="#38bdf8" stroke-width="2"/>
<text x="95" y="74" font-size="14" fill="#e5e7eb" text-anchor="middle">iterable</text>
<text x="95" y="94" font-size="13" fill="#38bdf8" text-anchor="middle">__iter__()</text>
<rect x="215" y="50" width="150" height="56" rx="8" fill="none" stroke="#f97316" stroke-width="2"/>
<text x="290" y="74" font-size="14" fill="#e5e7eb" text-anchor="middle">iterator</text>
<text x="290" y="94" font-size="13" fill="#f97316" text-anchor="middle">__next__()</text>
<path d="M170 78 H213" stroke="#e5e7eb" stroke-width="2"/><path d="M205 72 L213 78 L205 84" fill="none" stroke="#e5e7eb" stroke-width="2"/>
<text x="192" y="44" font-size="13" fill="#e5e7eb" text-anchor="middle">iter()</text>
<rect x="20" y="140" width="345" height="40" rx="6" fill="#1f2937"/>
<text x="30" y="165" font-size="14" fill="#e5e7eb">next -&gt; 1   next -&gt; 2   next -&gt; 3</text>
<text x="30" y="215" font-size="14" fill="#a3e635">StopIteration: exhausted</text>
<text x="30" y="240" font-size="13" fill="#e5e7eb">list(it) again gives [] (one-shot)</text>
<text x="30" y="275" font-size="13" fill="#e5e7eb">generator frame alive until exhausted,</text>
<text x="30" y="295" font-size="13" fill="#e5e7eb">close() or garbage collection</text>
<line x1="395" y1="20" x2="395" y2="340" stroke="#374151" stroke-width="2"/>
<text x="420" y="30" font-size="16" fill="#e5e7eb" font-weight="bold">Lookup of obj.name</text>
<rect x="420" y="50" width="320" height="50" rx="8" fill="none" stroke="#f97316" stroke-width="2"/>
<text x="580" y="72" font-size="14" fill="#e5e7eb" text-anchor="middle">1. data descriptor on type</text>
<text x="580" y="90" font-size="13" fill="#f97316" text-anchor="middle">has __set__ / __delete__</text>
<rect x="420" y="130" width="320" height="50" rx="8" fill="none" stroke="#38bdf8" stroke-width="2"/>
<text x="580" y="152" font-size="14" fill="#e5e7eb" text-anchor="middle">2. obj.__dict__["name"]</text>
<text x="580" y="170" font-size="13" fill="#38bdf8" text-anchor="middle">instance attribute</text>
<rect x="420" y="210" width="320" height="50" rx="8" fill="none" stroke="#a3e635" stroke-width="2"/>
<text x="580" y="232" font-size="14" fill="#e5e7eb" text-anchor="middle">3. non-data descriptor / class attr</text>
<text x="580" y="250" font-size="13" fill="#a3e635" text-anchor="middle">functions become bound methods</text>
<text x="580" y="295" font-size="14" fill="#e5e7eb" text-anchor="middle">4. AttributeError</text>
<path d="M580 100 V128 M580 180 V208 M580 260 V278" stroke="#e5e7eb" stroke-width="2"/>
<text x="600" y="120" font-size="13" fill="#e5e7eb">not found</text>
<text x="600" y="200" font-size="13" fill="#e5e7eb">not found</text>
<text x="600" y="274" font-size="13" fill="#e5e7eb">not found</text>
</svg>
