<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 556" font-family="Inter, sans-serif">
<title>Motor sizing: seven steps and one loop</title>
<desc>Flow chart of the seven sizing steps from requirements to a bench test: requirements, load model, motion profile, ratio and motor, torque and heat, driver and supply, feedback. A dashed loop returns to the step that owns a failed check.</desc>
<defs><marker id="HW15arr-a7adb5" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 z" fill="#a7adb5"/></marker><marker id="HW15arr-e58a80" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 z" fill="#e58a80"/></marker></defs>
<rect width="900" height="556" rx="14" fill="#17181b"/>
<text x="32" y="44" font-size="22" fill="#e9e7e3" text-anchor="start" font-weight="bold">Motor sizing: seven steps and one loop</text>
<rect x="48" y="92" width="180" height="118" rx="8" fill="#22252a" stroke="#86abe2" stroke-width="2"/>
<circle cx="70" cy="118" r="13" fill="#86abe2"/>
<text x="70" y="123" font-size="15" fill="#17181b" text-anchor="middle" font-weight="bold">1</text>
<text x="90" y="123" font-size="17" fill="#e9e7e3" text-anchor="start" font-weight="bold">Requirements</text>
<text x="64" y="158" font-size="15" fill="#e9e7e3" text-anchor="start">motion, load, supply</text>
<text x="64" y="186" font-size="14" fill="#a7adb5" text-anchor="start">mark each input</text>
<rect x="252" y="92" width="180" height="118" rx="8" fill="#22252a" stroke="#e0904f" stroke-width="2"/>
<circle cx="274" cy="118" r="13" fill="#e0904f"/>
<text x="274" y="123" font-size="15" fill="#17181b" text-anchor="middle" font-weight="bold">2</text>
<text x="294" y="123" font-size="17" fill="#e9e7e3" text-anchor="start" font-weight="bold">Load model</text>
<text x="268" y="158" font-size="15" fill="#e9e7e3" text-anchor="start">T_w = F r / n</text>
<text x="268" y="186" font-size="14" fill="#a7adb5" text-anchor="start">worst case, traction</text>
<rect x="456" y="92" width="180" height="118" rx="8" fill="#22252a" stroke="#e0c169" stroke-width="2"/>
<circle cx="478" cy="118" r="13" fill="#e0c169"/>
<text x="478" y="123" font-size="15" fill="#17181b" text-anchor="middle" font-weight="bold">3</text>
<text x="498" y="123" font-size="17" fill="#e9e7e3" text-anchor="start" font-weight="bold">Motion profile</text>
<text x="472" y="158" font-size="15" fill="#e9e7e3" text-anchor="start">T = d/v + v/a</text>
<text x="472" y="186" font-size="14" fill="#a7adb5" text-anchor="start">peak v, peak a, time</text>
<rect x="660" y="92" width="180" height="118" rx="8" fill="#22252a" stroke="#ae9ce6" stroke-width="2"/>
<circle cx="682" cy="118" r="13" fill="#ae9ce6"/>
<text x="682" y="123" font-size="15" fill="#17181b" text-anchor="middle" font-weight="bold">4</text>
<text x="702" y="123" font-size="17" fill="#e9e7e3" text-anchor="start" font-weight="bold">Ratio, motor</text>
<text x="676" y="158" font-size="15" fill="#e9e7e3" text-anchor="start">window from R09</text>
<text x="676" y="186" font-size="14" fill="#a7adb5" text-anchor="start">catalogue candidates</text>
<rect x="48" y="268" width="180" height="118" rx="8" fill="#22252a" stroke="#e08db5" stroke-width="2"/>
<circle cx="70" cy="294" r="13" fill="#e08db5"/>
<text x="70" y="299" font-size="15" fill="#17181b" text-anchor="middle" font-weight="bold">5</text>
<text x="90" y="299" font-size="17" fill="#e9e7e3" text-anchor="start" font-weight="bold">Torque and heat</text>
<text x="64" y="334" font-size="15" fill="#e9e7e3" text-anchor="start">T_M = (T_L + T_a) S_f</text>
<text x="64" y="362" font-size="14" fill="#a7adb5" text-anchor="start">T_rms ≤ T_rated</text>
<rect x="252" y="268" width="180" height="118" rx="8" fill="#22252a" stroke="#6cc6ba" stroke-width="2"/>
<circle cx="274" cy="294" r="13" fill="#6cc6ba"/>
<text x="274" y="299" font-size="15" fill="#17181b" text-anchor="middle" font-weight="bold">6</text>
<text x="294" y="299" font-size="17" fill="#e9e7e3" text-anchor="start" font-weight="bold">Driver, supply</text>
<text x="268" y="334" font-size="15" fill="#e9e7e3" text-anchor="start">I_cont ≥ I_stall</text>
<text x="268" y="362" font-size="14" fill="#a7adb5" text-anchor="start">V ≥ I R + k_e ω</text>
<rect x="456" y="268" width="180" height="118" rx="8" fill="#22252a" stroke="#6fc693" stroke-width="2"/>
<circle cx="478" cy="294" r="13" fill="#6fc693"/>
<text x="478" y="299" font-size="15" fill="#17181b" text-anchor="middle" font-weight="bold">7</text>
<text x="498" y="299" font-size="17" fill="#e9e7e3" text-anchor="start" font-weight="bold">Feedback</text>
<text x="472" y="334" font-size="15" fill="#e9e7e3" text-anchor="start">counts per output rev</text>
<text x="472" y="362" font-size="14" fill="#a7adb5" text-anchor="start">meter, thermometer</text>
<line x1="228" y1="151" x2="248" y2="151" stroke="#a7adb5" stroke-width="2" stroke-linecap="round" marker-end="url(#HW15arr-a7adb5)"/>
<line x1="432" y1="151" x2="452" y2="151" stroke="#a7adb5" stroke-width="2" stroke-linecap="round" marker-end="url(#HW15arr-a7adb5)"/>
<line x1="636" y1="151" x2="656" y2="151" stroke="#a7adb5" stroke-width="2" stroke-linecap="round" marker-end="url(#HW15arr-a7adb5)"/>
<line x1="228" y1="327" x2="248" y2="327" stroke="#a7adb5" stroke-width="2" stroke-linecap="round" marker-end="url(#HW15arr-a7adb5)"/>
<line x1="432" y1="327" x2="452" y2="327" stroke="#a7adb5" stroke-width="2" stroke-linecap="round" marker-end="url(#HW15arr-a7adb5)"/>
<path d="M750 210 L750 244 L138 244 L138 264" fill="none" stroke="#a7adb5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#HW15arr-a7adb5)"/>
<rect x="660" y="268" width="180" height="118" rx="8" fill="#6fc693" stroke="#6fc693" stroke-width="2" fill-opacity="0.14"/>
<text x="676" y="299" font-size="17" fill="#6fc693" text-anchor="start" font-weight="bold">Result</text>
<text x="676" y="334" font-size="15" fill="#e9e7e3" text-anchor="start">motor, ratio, driver</text>
<text x="676" y="362" font-size="14" fill="#a7adb5" text-anchor="start">and checks that passed</text>
<line x1="636" y1="327" x2="656" y2="327" stroke="#a7adb5" stroke-width="2" stroke-linecap="round" marker-end="url(#HW15arr-a7adb5)"/>
<path d="M138 390 L138 424 L28 424 L28 151 L44 151" fill="none" stroke="#e58a80" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 5" marker-end="url(#HW15arr-e58a80)"/>
<text x="154" y="431" font-size="15" fill="#e58a80" text-anchor="start" font-weight="600">a check fails: go back to the step that owns it</text>
<text x="154" y="462" font-size="15" fill="#e9e7e3" text-anchor="start">speed too low  →  step 4, a lower ratio</text>
<text x="154" y="488" font-size="15" fill="#e9e7e3" text-anchor="start">heat or torque  →  step 4, or a larger frame</text>
<text x="154" y="514" font-size="15" fill="#e9e7e3" text-anchor="start">current too high  →  step 6, a bigger driver</text>
</svg>
