<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" font-family="Inter, Arial, sans-serif">
<rect width="720" height="400" fill="#111827" rx="12"/>
<text x="360" y="28" fill="#e5e7eb" font-size="18" font-weight="bold" text-anchor="middle">Names point to objects: [[0]*3]*3 versus a comprehension</text>
<text x="170" y="64" fill="#f97316" font-size="15" font-weight="bold" text-anchor="middle">grid = [[0]*3] * 3</text>
<text x="550" y="64" fill="#a3e635" font-size="15" font-weight="bold" text-anchor="middle">grid = [[0]*3 for _ in range(3)]</text>
<rect x="30" y="90" width="70" height="150" rx="6" fill="#1f2937" stroke="#e5e7eb" stroke-width="1.5"/><text x="65" y="122" fill="#e5e7eb" font-size="13" text-anchor="middle">grid[0]</text><path d="M100,118 L200,165" stroke="#f97316" stroke-width="2" fill="none"/><circle cx="100" cy="118" r="4" fill="#f97316"/><text x="65" y="167" fill="#e5e7eb" font-size="13" text-anchor="middle">grid[1]</text><path d="M100,163 L200,165" stroke="#f97316" stroke-width="2" fill="none"/><circle cx="100" cy="163" r="4" fill="#f97316"/><text x="65" y="212" fill="#e5e7eb" font-size="13" text-anchor="middle">grid[2]</text><path d="M100,208 L200,165" stroke="#f97316" stroke-width="2" fill="none"/><circle cx="100" cy="208" r="4" fill="#f97316"/><rect x="200" y="140" width="150" height="50" rx="6" fill="#7c2d12" stroke="#f97316" stroke-width="1.5"/><text x="275" y="170" fill="#e5e7eb" font-size="14" text-anchor="middle">[0, 7, 0]  one list</text><text x="170" y="270" fill="#e5e7eb" font-size="13" text-anchor="middle">grid[1][1] = 7 changes every row</text><text x="170" y="290" fill="#f97316" font-size="13" text-anchor="middle">id(grid[0]) == id(grid[1]) == id(grid[2])</text><rect x="400" y="90" width="70" height="150" rx="6" fill="#1f2937" stroke="#e5e7eb" stroke-width="1.5"/><text x="435" y="122" fill="#e5e7eb" font-size="13" text-anchor="middle">grid[0]</text><path d="M470,118 L540,122" stroke="#a3e635" stroke-width="2" fill="none"/><circle cx="470" cy="118" r="4" fill="#a3e635"/><rect x="540" y="100" width="150" height="40" rx="6" fill="#365314" stroke="#a3e635" stroke-width="1.5"/><text x="615" y="125" fill="#e5e7eb" font-size="14" text-anchor="middle">[0, 0, 0]</text><text x="435" y="167" fill="#e5e7eb" font-size="13" text-anchor="middle">grid[1]</text><path d="M470,163 L540,167" stroke="#a3e635" stroke-width="2" fill="none"/><circle cx="470" cy="163" r="4" fill="#a3e635"/><rect x="540" y="145" width="150" height="40" rx="6" fill="#365314" stroke="#a3e635" stroke-width="1.5"/><text x="615" y="170" fill="#e5e7eb" font-size="14" text-anchor="middle">[0, 7, 0]</text><text x="435" y="212" fill="#e5e7eb" font-size="13" text-anchor="middle">grid[2]</text><path d="M470,208 L540,212" stroke="#a3e635" stroke-width="2" fill="none"/><circle cx="470" cy="208" r="4" fill="#a3e635"/><rect x="540" y="190" width="150" height="40" rx="6" fill="#365314" stroke="#a3e635" stroke-width="1.5"/><text x="615" y="215" fill="#e5e7eb" font-size="14" text-anchor="middle">[0, 0, 0]</text><text x="550" y="270" fill="#e5e7eb" font-size="13" text-anchor="middle">grid[1][1] = 7 changes one row only</text><text x="550" y="290" fill="#a3e635" font-size="13" text-anchor="middle">three distinct ids</text><rect x="40" y="318" width="640" height="62" rx="8" fill="#1f2937"/><text x="360" y="342" fill="#e5e7eb" font-size="14" text-anchor="middle">Multiplying a list repeats the reference, not the object. Assignment never copies.</text><text x="360" y="364" fill="#e5e7eb" font-size="13" text-anchor="middle">Test with `a is b` and `id(a)`; copy nested data with copy.deepcopy or a comprehension.</text></svg>