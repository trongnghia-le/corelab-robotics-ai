<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" font-family="Inter, Arial, sans-serif" role="img">
<title>CAP03 localisation pipeline</title>
<desc>Wheel odometry and gyro drive the EKF prediction; marker corners pass through camera calibration and PnP to a range-bearing measurement; a Mahalanobis gate and the Joseph-form update correct the pose; NEES and NIS audit the covariance.</desc>
<rect width="900" height="430" fill="#191b1f" rx="12"/>
<text x="450" y="28" font-size="17" fill="#e5e7eb" text-anchor="middle" font-weight="bold">Predict with motion, correct with landmarks, audit with NEES/NIS</text>
<text x="20" y="62" font-size="12" fill="#d97936" text-anchor="start" font-weight="bold">MOTION (100 Hz)</text>
<rect x="20" y="72" width="150" height="56" rx="8" fill="#272a2f" stroke="#d97936" stroke-width="2"/>
<text x="95.0" y="96.7" font-size="12" fill="#e5e7eb" text-anchor="middle" font-weight="bold">Wheel odometry</text>
<text x="95.0" y="111.7" font-size="12" fill="#e5e7eb" text-anchor="middle">v (CAP02 calibrated)</text>
<rect x="20" y="150" width="150" height="56" rx="8" fill="#272a2f" stroke="#d97936" stroke-width="2"/>
<text x="95.0" y="174.7" font-size="12" fill="#e5e7eb" text-anchor="middle" font-weight="bold">Gyro</text>
<text x="95.0" y="189.7" font-size="12" fill="#e5e7eb" text-anchor="middle">w_g - b_g</text>
<rect x="240" y="100" width="190" height="80" rx="8" fill="#272a2f" stroke="#53b2dd" stroke-width="2"/>
<text x="335.0" y="129.2" font-size="12" fill="#e5e7eb" text-anchor="middle" font-weight="bold">EKF predict</text>
<text x="335.0" y="144.2" font-size="12" fill="#e5e7eb" text-anchor="middle">x,y,theta,b_g</text>
<text x="335.0" y="159.2" font-size="12" fill="#e5e7eb" text-anchor="middle">P = F P F^T + G Q G^T</text>
<line x1="170" y1="100" x2="240" y2="125" stroke="#e5e7eb" stroke-width="2"/>
<polygon points="240,125 230.3,125.3 232.7,118.7" fill="#e5e7eb"/>
<line x1="170" y1="178" x2="240" y2="155" stroke="#e5e7eb" stroke-width="2"/>
<polygon points="240,155 232.5,161.1 230.4,154.5" fill="#e5e7eb"/>
<text x="20" y="246" font-size="12" fill="#9ccd4e" text-anchor="start" font-weight="bold">LANDMARKS (5 Hz)</text>
<rect x="20" y="256" width="150" height="56" rx="8" fill="#272a2f" stroke="#9ccd4e" stroke-width="2"/>
<text x="95.0" y="280.7" font-size="12" fill="#e5e7eb" text-anchor="middle" font-weight="bold">Camera + marker</text>
<text x="95.0" y="295.7" font-size="12" fill="#e5e7eb" text-anchor="middle">corner pixels</text>
<rect x="200" y="256" width="130" height="56" rx="8" fill="#272a2f" stroke="#9ccd4e" stroke-width="2"/>
<text x="265.0" y="280.7" font-size="12" fill="#e5e7eb" text-anchor="middle" font-weight="bold">Calibration + PnP</text>
<text x="265.0" y="295.7" font-size="12" fill="#e5e7eb" text-anchor="middle">K, T_cam_marker</text>
<rect x="360" y="256" width="140" height="56" rx="8" fill="#272a2f" stroke="#9ccd4e" stroke-width="2"/>
<text x="430.0" y="280.7" font-size="12" fill="#e5e7eb" text-anchor="middle" font-weight="bold">Range, bearing</text>
<text x="430.0" y="295.7" font-size="12" fill="#e5e7eb" text-anchor="middle">in base_link</text>
<line x1="170" y1="284" x2="200" y2="284" stroke="#e5e7eb" stroke-width="2"/>
<polygon points="200,284 191.0,287.5 191.0,280.5" fill="#e5e7eb"/>
<line x1="330" y1="284" x2="360" y2="284" stroke="#e5e7eb" stroke-width="2"/>
<polygon points="360,284 351.0,287.5 351.0,280.5" fill="#e5e7eb"/>
<rect x="560" y="170" width="150" height="70" rx="8" fill="#272a2f" stroke="#d75c5c" stroke-width="2"/>
<text x="635.0" y="201.7" font-size="12" fill="#e5e7eb" text-anchor="middle" font-weight="bold">Gate</text>
<text x="635.0" y="216.7" font-size="12" fill="#e5e7eb" text-anchor="middle">d2 &lt;= 9.21 (2 dof)</text>
<line x1="500" y1="284" x2="600" y2="240" stroke="#e5e7eb" stroke-width="2"/>
<polygon points="600,240 593.2,246.8 590.4,240.4" fill="#e5e7eb"/>
<rect x="560" y="70" width="150" height="70" rx="8" fill="#272a2f" stroke="#53b2dd" stroke-width="2"/>
<text x="635.0" y="94.2" font-size="12" fill="#e5e7eb" text-anchor="middle" font-weight="bold">EKF update</text>
<text x="635.0" y="109.2" font-size="12" fill="#e5e7eb" text-anchor="middle">Joseph form</text>
<text x="635.0" y="124.2" font-size="12" fill="#e5e7eb" text-anchor="middle">wrapped bearing</text>
<line x1="430" y1="140" x2="560" y2="105" stroke="#e5e7eb" stroke-width="2"/>
<polygon points="560,105 552.2,110.7 550.4,104.0" fill="#e5e7eb"/>
<line x1="635" y1="170" x2="635" y2="140" stroke="#e5e7eb" stroke-width="2"/>
<polygon points="635,140 638.5,149.0 631.5,149.0" fill="#e5e7eb"/>
<rect x="750" y="70" width="130" height="70" rx="8" fill="#272a2f" stroke="#e5e7eb" stroke-width="2"/>
<text x="815.0" y="101.7" font-size="12" fill="#e5e7eb" text-anchor="middle" font-weight="bold">Pose + P</text>
<text x="815.0" y="116.7" font-size="12" fill="#e5e7eb" text-anchor="middle">Pose2DCov</text>
<line x1="710" y1="105" x2="750" y2="105" stroke="#e5e7eb" stroke-width="2"/>
<polygon points="750,105 741.0,108.5 741.0,101.5" fill="#e5e7eb"/>
<rect x="560" y="330" width="320" height="60" rx="8" fill="#272a2f" stroke="#ae9bea" stroke-width="2" stroke-dasharray="5 4"/>
<text x="720.0" y="356.7" font-size="12" fill="#e5e7eb" text-anchor="middle" font-weight="bold">Audit with ground truth (tests only)</text>
<text x="720.0" y="371.7" font-size="12" fill="#e5e7eb" text-anchor="middle">NEES ~ chi2(3), NIS ~ chi2(2), 85-99.5 % inside</text>
<line x1="815" y1="140" x2="815" y2="330" stroke="#ae9bea" stroke-width="2" stroke-dasharray="5 4"/>
<polygon points="815,330 811.5,321.0 818.5,321.0" fill="#ae9bea"/>
<text x="250" y="372" font-size="12" fill="#d75c5c" text-anchor="middle">no marker in view: P must grow</text>
<text x="250" y="392" font-size="12" fill="#d75c5c" text-anchor="middle">gate rejects wrong-ID detections</text>
</svg>
