<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" font-family="Inter, Arial, sans-serif">
<rect width="720" height="400" fill="#111827" rx="12"/>
<text x="24" y="32" fill="#e5e7eb" font-size="16" font-weight="bold">One request: where the latency goes</text>
<rect x="40" y="52" width="110" height="36" fill="#f97316"/><text x="95" y="75" fill="#111827" font-size="13" text-anchor="middle">queue wait</text>
<rect x="150" y="52" width="170" height="36" fill="#38bdf8"/><text x="235" y="75" fill="#111827" font-size="13" text-anchor="middle">CPU work</text>
<rect x="320" y="52" width="250" height="36" fill="#374151" stroke="#a3e635" stroke-dasharray="5 3"/><text x="445" y="75" fill="#e5e7eb" font-size="13" text-anchor="middle">I/O wait (not CPU)</text>
<line x1="40" y1="104" x2="570" y2="104" stroke="#e5e7eb"/><text x="305" y="124" fill="#e5e7eb" font-size="13" text-anchor="middle">latency = wall time (CPU time is only the blue part)</text>
<text x="590" y="75" fill="#e5e7eb" font-size="13">time</text>
<text x="24" y="160" fill="#e5e7eb" font-size="16" font-weight="bold">Many requests: latency distribution</text>
<line x1="60" y1="360" x2="680" y2="360" stroke="#e5e7eb"/><line x1="60" y1="360" x2="60" y2="175" stroke="#e5e7eb"/>
<text x="370" y="388" fill="#e5e7eb" font-size="13" text-anchor="middle">latency (ms)</text>
<text x="20" y="270" fill="#e5e7eb" font-size="13" transform="rotate(-90 20 270)" text-anchor="middle">count</text>
<g fill="#38bdf8"><rect x="80" y="320" width="30" height="40"/><rect x="110" y="230" width="30" height="130"/><rect x="140" y="190" width="30" height="170"/><rect x="170" y="240" width="30" height="120"/><rect x="200" y="300" width="30" height="60"/><rect x="230" y="335" width="30" height="25"/><rect x="260" y="350" width="30" height="10"/></g>
<rect x="560" y="352" width="30" height="8" fill="#f97316"/>
<line x1="150" y1="175" x2="150" y2="360" stroke="#a3e635" stroke-dasharray="4 3"/><text x="156" y="186" fill="#a3e635" font-size="13">median</text>
<line x1="235" y1="205" x2="235" y2="360" stroke="#e5e7eb" stroke-dasharray="4 3"/><text x="241" y="216" fill="#e5e7eb" font-size="13">mean</text>
<text x="575" y="338" fill="#f97316" font-size="13" text-anchor="middle">P99 / max tail</text>
<line x1="575" y1="344" x2="575" y2="352" stroke="#f97316"/>
</svg>
