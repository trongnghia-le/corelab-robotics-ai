<polygon points="612.0,102.0 603.7,105.5 603.7,98.5" fill="#e5e7eb"/>
<rect x="160" y="170" width="144" height="46" rx="8" fill="#1f2937" stroke="#f97316" stroke-width="2"/>
<text x="232" y="198" font-size="12" fill="#f97316" text-anchor="middle">wrap: modular unwrap</text>
<line x1="232" y1="134" x2="232" y2="170" stroke="#f97316" stroke-width="2"/>
<polygon points="232.0,170.0 228.5,161.7 235.5,161.7" fill="#f97316"/>
<rect x="308" y="170" width="144" height="46" rx="8" fill="#1f2937" stroke="#f97316" stroke-width="2"/>
<text x="380" y="198" font-size="12" fill="#f97316" text-anchor="middle">bad checksum: reject</text>
<line x1="380" y1="134" x2="380" y2="170" stroke="#f97316" stroke-width="2"/>
<polygon points="380.0,170.0 376.5,161.7 383.5,161.7" fill="#f97316"/>
<rect x="456" y="170" width="144" height="46" rx="8" fill="#1f2937" stroke="#f97316" stroke-width="2"/>
<text x="528" y="198" font-size="12" fill="#f97316" text-anchor="middle">age &gt; 3 periods: stale</text>
<line x1="528" y1="134" x2="528" y2="170" stroke="#f97316" stroke-width="2"/>
<polygon points="528.0,170.0 524.5,161.7 531.5,161.7" fill="#f97316"/>
<text x="380" y="244" font-size="13" fill="#f97316" text-anchor="middle">stale or invalid input: command zero, report fault</text>
<rect x="20" y="300" width="128" height="64" rx="8" fill="#1f2937" stroke="#e5e7eb" stroke-width="2"/>
<text x="84.0" y="328.6" font-size="13" fill="#e5e7eb" text-anchor="middle" font-weight="bold">Controller</text>
<text x="84.0" y="344.6" font-size="13" fill="#e5e7eb" text-anchor="middle">w in rad/s</text>
<rect x="168" y="300" width="128" height="64" rx="8" fill="#1f2937" stroke="#a3e635" stroke-width="2"/>
<text x="232.0" y="328.6" font-size="13" fill="#e5e7eb" text-anchor="middle" font-weight="bold">Clamp</text>
<text x="232.0" y="344.6" font-size="13" fill="#e5e7eb" text-anchor="middle">|w/wmax| &lt;= 1</text>
<rect x="316" y="300" width="128" height="64" rx="8" fill="#1f2937" stroke="#a3e635" stroke-width="2"/>
<text x="380.0" y="328.6" font-size="13" fill="#e5e7eb" text-anchor="middle" font-weight="bold">Scale, round</text>
<text x="380.0" y="344.6" font-size="13" fill="#e5e7eb" text-anchor="middle">x 255 = PWM</text>
<rect x="464" y="300" width="128" height="64" rx="8" fill="#1f2937" stroke="#f97316" stroke-width="2"/>
<text x="528.0" y="328.6" font-size="13" fill="#e5e7eb" text-anchor="middle" font-weight="bold">Reject NaN</text>
<text x="528.0" y="344.6" font-size="13" fill="#e5e7eb" text-anchor="middle">watchdog</text>
<rect x="612" y="300" width="128" height="64" rx="8" fill="#1f2937" stroke="#38bdf8" stroke-width="2"/>
<text x="676.0" y="328.6" font-size="13" fill="#e5e7eb" text-anchor="middle" font-weight="bold">Motor</text>
<text x="676.0" y="344.6" font-size="13" fill="#e5e7eb" text-anchor="middle">driver</text>
