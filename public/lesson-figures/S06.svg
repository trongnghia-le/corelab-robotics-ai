<text x="84.0" y="98.5" font-size="13" fill="#e5e7eb" text-anchor="middle" font-weight="bold">Encoder</text>
<text x="84.0" y="114.5" font-size="13" fill="#e5e7eb" text-anchor="middle">pulses A/B</text>
<rect x="168" y="70" width="128" height="64" rx="8" fill="#1f2937" stroke="#38bdf8" stroke-width="2"/>
<text x="232.0" y="98.5" font-size="13" fill="#e5e7eb" text-anchor="middle" font-weight="bold">Counter</text>
<text x="232.0" y="114.5" font-size="13" fill="#e5e7eb" text-anchor="middle">16-bit, wraps</text>
<rect x="316" y="70" width="128" height="64" rx="8" fill="#1f2937" stroke="#a3e635" stroke-width="2"/>
<text x="380.0" y="98.5" font-size="13" fill="#e5e7eb" text-anchor="middle" font-weight="bold">Frame</text>
<text x="380.0" y="114.5" font-size="13" fill="#e5e7eb" text-anchor="middle">AA len data sum</text>
<rect x="464" y="70" width="128" height="64" rx="8" fill="#1f2937" stroke="#a3e635" stroke-width="2"/>
<text x="528.0" y="98.5" font-size="13" fill="#e5e7eb" text-anchor="middle" font-weight="bold">Driver</text>
<text x="528.0" y="114.5" font-size="13" fill="#e5e7eb" text-anchor="middle">age, checksum</text>
<rect x="612" y="70" width="128" height="64" rx="8" fill="#1f2937" stroke="#e5e7eb" stroke-width="2"/>
<text x="676.0" y="98.5" font-size="13" fill="#e5e7eb" text-anchor="middle" font-weight="bold">State</text>
<text x="676.0" y="114.5" font-size="13" fill="#e5e7eb" text-anchor="middle">rad, rad/s</text>
<line x1="148" y1="102" x2="168" y2="102" stroke="#e5e7eb" stroke-width="2"/>
<polygon points="168.0,102.0 159.7,105.5 159.7,98.5" fill="#e5e7eb"/>
