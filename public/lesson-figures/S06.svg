<line x1="444" y1="332" x2="464" y2="332" stroke="#e5e7eb" stroke-width="2"/>
<polygon points="464.0,332.0 455.7,335.5 455.7,328.5" fill="#e5e7eb"/>
<line x1="592" y1="332" x2="612" y2="332" stroke="#e5e7eb" stroke-width="2"/>
<polygon points="612.0,332.0 603.7,335.5 603.7,328.5" fill="#e5e7eb"/>
<text x="380" y="405" font-size="13" fill="#e5e7eb" text-anchor="middle">Mock first: every box has a hand-computed test before hardware is connected.</text>
