<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" font-family="Inter, Arial, sans-serif" font-size="14">
<rect width="720" height="360" fill="#111827" rx="12"/>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e5e7eb"/></marker>
<marker id="o" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#f97316"/></marker></defs>
<g fill="#e5e7eb">
<text x="24" y="34" font-size="15" font-weight="bold">push_back past capacity moves the storage</text>
<text x="24" y="70" fill="#a3e635">1. before: size 3, capacity 3</text>
<text x="24" y="170" fill="#f97316">2. after: elements moved to a new block</text>
<text x="24" y="154" font-size="13">p = &amp;v[0]</text>
<text x="24" y="262" fill="#f97316">p still holds the old address: dangling</text>
<text x="400" y="34" font-size="15" font-weight="bold">unique_ptr: one owner, moved not copied</text>
<text x="420" y="84">a</text><text x="420" y="164">b</text>

<text x="400" y="244" fill="#a3e635">auto b = std::move(a);</text>
<text x="400" y="268">a == nullptr, b owns the object</text>
<text x="400" y="292">auto c = b;   // compile error</text>
<text x="400" y="316" fill="#f97316">at scope end: owner destroys object</text>
</g>
<g fill="none" stroke-width="2">
<rect x="24" y="84" width="60" height="34" stroke="#38bdf8"/><rect x="84" y="84" width="60" height="34" stroke="#38bdf8"/><rect x="144" y="84" width="60" height="34" stroke="#38bdf8"/>
