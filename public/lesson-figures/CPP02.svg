<rect x="260" y="84" width="40" height="34" stroke="#a3e635"/><rect x="300" y="84" width="40" height="34" stroke="#a3e635"/><rect x="340" y="84" width="40" height="34" stroke="#a3e635"/>
<rect x="260" y="214" width="1" height="1" stroke="none"/>
<rect x="440" y="64" width="60" height="30" stroke="#38bdf8"/><rect x="440" y="144" width="60" height="30" stroke="#a3e635"/>
<rect x="525" y="144" width="120" height="30" stroke="#a3e635"/>
</g>
