<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 360" font-family="Inter, Arial, sans-serif">
<rect width="780" height="360" fill="#111827" rx="12"/>
<text x="30" y="34" font-size="16" fill="#e5e7eb" font-weight="bold">A. The example MDP (gamma = 0.9)</text>
<text x="440" y="34" font-size="16" fill="#e5e7eb" font-weight="bold">B. V, Q and advantage at state B</text>
<circle cx="90" cy="150" r="34" fill="none" stroke="#38bdf8" stroke-width="3"/><text x="80" y="156" font-size="18" fill="#e5e7eb">A</text>
<circle cx="260" cy="150" r="34" fill="none" stroke="#a3e635" stroke-width="3"/><text x="250" y="156" font-size="18" fill="#e5e7eb">B</text>
<rect x="340" y="116" width="50" height="68" rx="8" fill="none" stroke="#e5e7eb" stroke-width="2" stroke-dasharray="5 4"/><text x="352" y="156" font-size="18" fill="#e5e7eb">T</text>
<line x1="124" y1="150" x2="226" y2="150" stroke="#f97316" stroke-width="2.5"/><polygon points="228,150 216,144 216,156" fill="#f97316"/>
<text x="112" y="136" font-size="13" fill="#f97316">go: 0.8 r=0</text>
<line x1="294" y1="150" x2="338" y2="150" stroke="#f97316" stroke-width="2.5"/><polygon points="340,150 328,144 328,156" fill="#f97316"/>
<text x="270" y="104" font-size="13" fill="#f97316">go: 0.9, r=10</text>
<path d="M70,118 C50,70 130,70 110,118" fill="none" stroke="#e5e7eb" stroke-width="2"/><text x="40" y="62" font-size="13" fill="#e5e7eb">stay r=1, go 0.2 r=0</text>
<path d="M240,182 C220,240 300,240 280,182" fill="none" stroke="#e5e7eb" stroke-width="2"/><text x="190" y="256" font-size="13" fill="#e5e7eb">stay r=2, go 0.1 r=0</text>
<text x="30" y="300" font-size="14" fill="#e5e7eb">uniform policy: V(A) = 9.610, V(B) = 10.891</text>
<text x="30" y="324" font-size="14" fill="#e5e7eb">always stay: V(A) = 10, V(B) = 20</text>
<line x1="450" y1="290" x2="750" y2="290" stroke="#e5e7eb" stroke-width="1.5"/>
<rect x="470" y="165" width="50" height="125" fill="#38bdf8"/><text x="474" y="156" font-size="14" fill="#e5e7eb">V 10.89</text>
<rect x="550" y="150" width="50" height="140" fill="#a3e635"/><text x="540" y="141" font-size="14" fill="#e5e7eb">Q stay 11.80</text>
<rect x="630" y="175" width="50" height="115" fill="#f97316"/><text x="625" y="166" font-size="14" fill="#e5e7eb">Q go 9.98</text>
<text x="470" y="312" font-size="14" fill="#e5e7eb">advantage: stay +0.91, go -0.91</text>
<text x="470" y="334" font-size="13" fill="#e5e7eb">V = pi-average of Q: advantages cancel</text>
</svg>
