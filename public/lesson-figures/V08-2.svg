<text x="310" y="176" font-size="17" fill="#e0904f" font-weight="bold" text-anchor="start">B</text>
<text x="225.0" y="204" font-size="15" fill="#e58a80" font-weight="600" text-anchor="middle">C \ (A∪B)</text>
<line x1="150" y1="272" x2="300" y2="272" stroke="#e9e7e3" stroke-width="1.5" marker-end="url(#v08f2a)"/>
