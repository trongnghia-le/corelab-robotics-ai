<text x="48" y="330" font-size="15" fill="#e9e7e3" font-weight="normal" text-anchor="start">|A∪B| = 200</text>
<text x="48" y="354" font-size="15" fill="#e9e7e3" font-weight="normal" text-anchor="start">|C| = 350 (C drawn slightly larger)</text>
<text x="48" y="378" font-size="15" fill="#e58a80" font-weight="normal" text-anchor="start">empty part of C: 150</text>
<text x="48" y="418" font-size="15" fill="#e9e7e3" font-weight="600" text-anchor="start">IoU = 0</text>
<text x="48" y="442" font-size="15" fill="#e0904f" font-weight="600" text-anchor="start">GIoU = 0 − 150/350 = −0.429</text>
