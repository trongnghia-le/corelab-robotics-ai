<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="Inter, sans-serif">
<title>GIoU still tells how far apart two disjoint boxes are</title>
<desc>Left: two equal boxes in a row with a gap, the enclosing box C of area 350, the union of area 200 and the empty part of area 150, GIoU = -0.429. Right: IoU and GIoU as box B moves right: IoU is 0 after the boxes separate, GIoU falls towards -1.</desc>
<rect width="900" height="520" rx="14" fill="#17181b"/>
<defs><marker id="v08f2a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs>
<text x="32" y="44" font-size="22" fill="#e9e7e3" font-weight="bold" text-anchor="start">GIoU still tells how far apart two disjoint boxes are</text>
