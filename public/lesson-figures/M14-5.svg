<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="Inter, sans-serif">
<title>Case 1: the true standard error of an average</title>
<desc>Log-log plot of the standard error of the mean of n AR(1) readings with phi 0.8 and variance 1 against n: exact, large-n formula and the independence model; at n 100 they are 0.293, 0.3 and 0.1 centimetres.</desc>
<rect width="900" height="520" rx="14" fill="#17181b"/>

