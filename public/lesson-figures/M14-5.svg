<line x1="640" y1="190" x2="672.0" y2="190.0" stroke="#86abe2" stroke-width="3" stroke-dasharray="7 5"/>
<text x="682" y="195" font-size="15" fill="#e9e7e3">independence: σ/√n</text>
<text x="640" y="262" font-size="15" font-weight="600" fill="#e9e7e3">Var(X̄) = 860/100² = 0.0860</text>
<text x="640" y="290" font-size="15" font-weight="600" fill="#e9e7e3">SE = 0.293 cm</text>
<text x="640" y="318" font-size="15" font-weight="600" fill="#e9e7e3">n_eff = 1/0.0860 = 11.6</text>
<text x="640" y="346" font-size="15" fill="#e9e7e3">independence model: 0.1 cm</text>
<text x="640" y="374" font-size="14" fill="#a7adb5">95% interval covers 48%,</text>
<text x="640" y="394" font-size="14" fill="#a7adb5">not 95%</text>
