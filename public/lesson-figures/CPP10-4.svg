<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="Inter, sans-serif">
<title>Case 1: queue of capacity K = 2, step by step</title>
<desc>A grid of seven steps. The two queue slots hold 1, 2; then P blocks on a full queue; C pops 1; P pushes 3; C pops 2 and 3 and blocks on an empty queue; close() ends the stream. Items 1, 2, 3 are delivered once each, in order.</desc>
<defs><marker id="ard" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a7adb5"/></marker></defs>
<rect width="900" height="520" rx="14" fill="#17181b"/>
<text x="32" y="44" font-size="22" fill="#e9e7e3" text-anchor="start" font-weight="bold">Case 1: queue of capacity K = 2, step by step</text>
<text x="238" y="92" font-size="17" fill="#e9e7e3" text-anchor="middle" font-weight="bold">1</text>
<text x="334" y="92" font-size="17" fill="#e9e7e3" text-anchor="middle" font-weight="bold">2</text>
<text x="430" y="92" font-size="17" fill="#e9e7e3" text-anchor="middle" font-weight="bold">3</text>
<text x="526" y="92" font-size="17" fill="#e9e7e3" text-anchor="middle" font-weight="bold">4</text>
<text x="622" y="92" font-size="17" fill="#e9e7e3" text-anchor="middle" font-weight="bold">5</text>
<text x="718" y="92" font-size="17" fill="#e9e7e3" text-anchor="middle" font-weight="bold">6</text>
<text x="814" y="92" font-size="17" fill="#e9e7e3" text-anchor="middle" font-weight="bold">7</text>
<text x="32" y="92" font-size="15" fill="#a7adb5" text-anchor="start" font-weight="600">step</text>
<text x="32" y="150" font-size="15" fill="#e9e7e3" text-anchor="start" font-weight="600">queue slot 1</text>
<text x="32" y="210" font-size="15" fill="#e9e7e3" text-anchor="start" font-weight="600">queue slot 2</text>
<text x="32" y="286" font-size="15" fill="#e9e7e3" text-anchor="start" font-weight="600">P</text>
<text x="32" y="346" font-size="15" fill="#e9e7e3" text-anchor="start" font-weight="600">C</text>
<text x="32" y="406" font-size="15" fill="#e9e7e3" text-anchor="start" font-weight="600">waits on</text>
<rect x="196" y="116" width="84" height="44" rx="4" fill="#4a321c" stroke="#e0904f" stroke-width="1.5"/>
<text x="238" y="144" font-size="15" fill="#e9e7e3" text-anchor="middle" font-weight="600">1</text>
<rect x="196" y="176" width="84" height="44" rx="4" fill="none" stroke="#3d4148" stroke-width="1.5"/>
<rect x="292" y="116" width="84" height="44" rx="4" fill="#4a321c" stroke="#e0904f" stroke-width="1.5"/>
<text x="334" y="144" font-size="15" fill="#e9e7e3" text-anchor="middle" font-weight="600">1</text>
<rect x="292" y="176" width="84" height="44" rx="4" fill="#4a321c" stroke="#e0904f" stroke-width="1.5"/>
<text x="334" y="204" font-size="15" fill="#e9e7e3" text-anchor="middle" font-weight="600">2</text>
<rect x="388" y="116" width="84" height="44" rx="4" fill="#4a321c" stroke="#e0904f" stroke-width="1.5"/>
<text x="430" y="144" font-size="15" fill="#e9e7e3" text-anchor="middle" font-weight="600">1</text>
<rect x="388" y="176" width="84" height="44" rx="4" fill="#4a321c" stroke="#e0904f" stroke-width="1.5"/>
<text x="430" y="204" font-size="15" fill="#e9e7e3" text-anchor="middle" font-weight="600">2</text>
<rect x="484" y="116" width="84" height="44" rx="4" fill="#4a321c" stroke="#e0904f" stroke-width="1.5"/>
<text x="526" y="144" font-size="15" fill="#e9e7e3" text-anchor="middle" font-weight="600">2</text>
<rect x="484" y="176" width="84" height="44" rx="4" fill="none" stroke="#3d4148" stroke-width="1.5"/>
<rect x="580" y="116" width="84" height="44" rx="4" fill="#4a321c" stroke="#e0904f" stroke-width="1.5"/>
<text x="622" y="144" font-size="15" fill="#e9e7e3" text-anchor="middle" font-weight="600">2</text>
<rect x="580" y="176" width="84" height="44" rx="4" fill="#4a321c" stroke="#e0904f" stroke-width="1.5"/>
<text x="622" y="204" font-size="15" fill="#e9e7e3" text-anchor="middle" font-weight="600">3</text>
<rect x="676" y="116" width="84" height="44" rx="4" fill="none" stroke="#3d4148" stroke-width="1.5"/>
<rect x="676" y="176" width="84" height="44" rx="4" fill="none" stroke="#3d4148" stroke-width="1.5"/>
<rect x="772" y="116" width="84" height="44" rx="4" fill="none" stroke="#3d4148" stroke-width="1.5"/>
<rect x="772" y="176" width="84" height="44" rx="4" fill="none" stroke="#3d4148" stroke-width="1.5"/>
<text x="238" y="280" font-size="14" fill="#86abe2" text-anchor="middle">push 1</text>
<text x="238" y="340" font-size="14" fill="#a7adb5" text-anchor="middle">-</text>
<text x="334" y="280" font-size="14" fill="#86abe2" text-anchor="middle">push 2</text>
<text x="334" y="340" font-size="14" fill="#a7adb5" text-anchor="middle">-</text>
<text x="430" y="280" font-size="14" fill="#e58a80" text-anchor="middle">blocked</text>
<text x="430" y="340" font-size="14" fill="#a7adb5" text-anchor="middle">-</text>
<text x="526" y="280" font-size="14" fill="#e0c169" text-anchor="middle">woken</text>
<text x="526" y="340" font-size="14" fill="#6fc693" text-anchor="middle">pop 1</text>
<text x="622" y="280" font-size="14" fill="#86abe2" text-anchor="middle">push 3</text>
<text x="622" y="340" font-size="14" fill="#a7adb5" text-anchor="middle">-</text>
<text x="718" y="280" font-size="14" fill="#a7adb5" text-anchor="middle">idle</text>
<text x="718" y="340" font-size="14" fill="#6fc693" text-anchor="middle">pop 2, 3</text>
<text x="814" y="280" font-size="14" fill="#86abe2" text-anchor="middle">close()</text>
<text x="814" y="340" font-size="14" fill="#6fc693" text-anchor="middle">nullopt</text>
<text x="430" y="400" font-size="14" fill="#e58a80" text-anchor="middle" font-weight="600">not_full</text>
<text x="718" y="400" font-size="14" fill="#e58a80" text-anchor="middle" font-weight="600">not_empty</text>
<line x1="190" y1="244" x2="862" y2="244" stroke="#3d4148" stroke-width="1.5" stroke-linecap="round"/>
<line x1="190" y1="364" x2="862" y2="364" stroke="#3d4148" stroke-width="1.5" stroke-linecap="round"/>
<text x="32" y="462" font-size="15" fill="#e9e7e3" text-anchor="start" font-weight="600">Delivered: 1, 2, 3 once each, in order; sum = 6. Without close() in step 7, C would block forever.</text>
<text x="32" y="490" font-size="14" fill="#a7adb5" text-anchor="start">P wakes inside wait() only after re-acquiring the lock (step 4 to 5); step 6 groups C's pops of 2, then 3, then the blocking fourth pop.</text>
</svg>
