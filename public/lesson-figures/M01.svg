<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" font-family="Inter, Arial, sans-serif" font-size="14">
<rect width="720" height="340" fill="#111827" rx="12"/>
<g fill="#e5e7eb">
<text x="30" y="36" font-size="15" font-weight="bold">A function: one output per input</text>
<text x="380" y="36" font-size="15" font-weight="bold">Calibration with a declared domain</text>
<text x="40" y="82">domain D</text><text x="228" y="82">outputs Y</text>
<text x="48" y="119">-2</text><text x="48" y="179">2</text><text x="48" y="239">3</text>
<text x="262" y="149">4</text><text x="262" y="239">9</text>
<text x="118" y="300" fill="#a3e635">f(x) = x^2 maps -2 and 2 to 4</text>
<text x="118" y="320" fill="#f97316">so no inverse unless D = [0, inf)</text>
<text x="630" y="316">counts n</text>
<text x="386" y="62">distance (m)</text>
<text x="408" y="292">0</text><text x="436" y="292">10</text><text x="556" y="292">60</text><text x="676" y="292">110</text>
<text x="392" y="274">0</text><text x="392" y="219">1</text><text x="392" y="164">2</text>
</g>
<g stroke="#e5e7eb" stroke-width="1.5" fill="none">
<line x1="420" y1="270" x2="700" y2="270"/><line x1="420" y1="270" x2="420" y2="70"/>
</g>
<g fill="#38bdf8"><circle cx="75" cy="115" r="5"/><circle cx="75" cy="175" r="5"/><circle cx="75" cy="235" r="5"/><circle cx="250" cy="145" r="5"/><circle cx="250" cy="235" r="5"/></g>
<g stroke="#38bdf8" stroke-width="2"><line x1="80" y1="115" x2="245" y2="145"/><line x1="80" y1="175" x2="245" y2="145"/><line x1="80" y1="235" x2="245" y2="235"/></g>
<line x1="444" y1="270" x2="684" y2="160" stroke="#a3e635" stroke-width="3"/>
<line x1="420" y1="270" x2="444" y2="270" stroke="#f97316" stroke-width="4" stroke-dasharray="4 3"/>
<circle cx="444" cy="270" r="5" fill="#a3e635"/><circle cx="684" cy="160" r="5" fill="#a3e635"/>
<text x="430" y="200" fill="#a3e635" font-size="14">d = 0.02 (n - 10)</text>
<text x="424" y="316" fill="#f97316" font-size="13">n &lt; 10: invalid</text>
<text x="560" y="150" fill="#e5e7eb" font-size="13">(110, 2.0 m)</text>
