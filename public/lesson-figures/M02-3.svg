<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="Inter, sans-serif">
<title>Acute, right and obtuse corners</title>
<desc>The length of a+b compared with the square root of the sum of squared lengths decides the angle type: right (3,0),(0,4); acute (2,1),(-1,3); obtuse (4,1),(-1,-5).</desc>
<defs><marker id="M023arr6fc693" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 z" fill="#6fc693"/></marker><marker id="M023arr86abe2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 z" fill="#86abe2"/></marker><marker id="M023arre0904f" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 z" fill="#e0904f"/></marker></defs>
<rect width="900" height="470" rx="14" fill="#17181b"/>
<text x="32" y="44" font-size="22" fill="#e9e7e3" text-anchor="start" font-weight="bold">Acute, right and obtuse corners</text>
<rect x="32" y="70" width="262" height="390" rx="10" fill="#22252a"/>
<text x="52" y="100" font-size="17" fill="#a7adb5" text-anchor="start" font-weight="bold">Right angle</text>
<line x1="102.0" y1="282.0" x2="198.0" y2="282.0" stroke="#86abe2" stroke-width="3" stroke-linecap="round" marker-end="url(#M023arr86abe2)"/>
<line x1="198.0" y1="282.0" x2="198.0" y2="154.0" stroke="#e0904f" stroke-width="3" stroke-linecap="round" marker-end="url(#M023arre0904f)"/>
<line x1="102.0" y1="282.0" x2="198.0" y2="154.0" stroke="#6fc693" stroke-width="3" stroke-linecap="round" marker-end="url(#M023arr6fc693)"/>
<circle cx="102.0" cy="282.0" r="5" fill="#e9e7e3"/>
<path d="M186.0 282.0 L186.0 270.0 L198.0 270.0" fill="none" stroke="#e9e7e3" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="150" y="306" font-size="15" fill="#86abe2" text-anchor="middle" font-weight="600">a</text>
<text x="210" y="223" font-size="15" fill="#e0904f" text-anchor="start" font-weight="600">b</text>
<text x="138" y="218" font-size="15" fill="#6fc693" text-anchor="end" font-weight="600">a + b</text>
<text x="52" y="356" font-size="15" fill="#e9e7e3" text-anchor="start" font-weight="normal">a·b = 0</text>
<text x="52" y="380" font-size="15" fill="#e9e7e3" text-anchor="start" font-weight="normal">‖a+b‖ = 5.00</text>
<text x="52" y="404" font-size="15" fill="#e9e7e3" text-anchor="start" font-weight="normal">√(‖a‖²+‖b‖²) = 5.00</text>
<text x="52" y="428" font-size="15" fill="#e0c169" text-anchor="start" font-weight="600">equal: perpendicular</text>
<rect x="318" y="70" width="262" height="390" rx="10" fill="#22252a"/>
<text x="338" y="100" font-size="17" fill="#a7adb5" text-anchor="start" font-weight="bold">Acute angle</text>
<line x1="448.0" y1="282.0" x2="512.0" y2="250.0" stroke="#86abe2" stroke-width="3" stroke-linecap="round" marker-end="url(#M023arr86abe2)"/>
<line x1="512.0" y1="250.0" x2="480.0" y2="154.0" stroke="#e0904f" stroke-width="3" stroke-linecap="round" marker-end="url(#M023arre0904f)"/>
<line x1="448.0" y1="282.0" x2="480.0" y2="154.0" stroke="#6fc693" stroke-width="3" stroke-linecap="round" marker-end="url(#M023arr6fc693)"/>
<circle cx="448.0" cy="282.0" r="5" fill="#e9e7e3"/>
<text x="490" y="292" font-size="15" fill="#86abe2" text-anchor="start" font-weight="600">a</text>
<text x="508" y="207" font-size="15" fill="#e0904f" text-anchor="start" font-weight="600">b</text>
<text x="452" y="223" font-size="15" fill="#6fc693" text-anchor="end" font-weight="600">a + b</text>
<text x="338" y="356" font-size="15" fill="#e9e7e3" text-anchor="start" font-weight="normal">a·b = +1</text>
<text x="338" y="380" font-size="15" fill="#e9e7e3" text-anchor="start" font-weight="normal">‖a+b‖ = 4.12</text>
<text x="338" y="404" font-size="15" fill="#e9e7e3" text-anchor="start" font-weight="normal">√(‖a‖²+‖b‖²) = 3.87</text>
<text x="338" y="428" font-size="15" fill="#e0c169" text-anchor="start" font-weight="600">above: acute, θ = 81.87°</text>
<rect x="604" y="70" width="262" height="390" rx="10" fill="#22252a"/>
<text x="624" y="100" font-size="17" fill="#a7adb5" text-anchor="start" font-weight="bold">Obtuse angle</text>
<line x1="684.0" y1="160.0" x2="812.0" y2="128.0" stroke="#86abe2" stroke-width="3" stroke-linecap="round" marker-end="url(#M023arr86abe2)"/>
<line x1="812.0" y1="128.0" x2="780.0" y2="288.0" stroke="#e0904f" stroke-width="3" stroke-linecap="round" marker-end="url(#M023arre0904f)"/>
<line x1="684.0" y1="160.0" x2="780.0" y2="288.0" stroke="#6fc693" stroke-width="3" stroke-linecap="round" marker-end="url(#M023arr6fc693)"/>
<circle cx="684.0" cy="160.0" r="5" fill="#e9e7e3"/>
<text x="748" y="130" font-size="15" fill="#86abe2" text-anchor="middle" font-weight="600">a</text>
<text x="808" y="213" font-size="15" fill="#e0904f" text-anchor="start" font-weight="600">b</text>
<text x="720" y="229" font-size="15" fill="#6fc693" text-anchor="end" font-weight="600">a + b</text>
<text x="624" y="356" font-size="15" fill="#e9e7e3" text-anchor="start" font-weight="normal">a·b = −9</text>
<text x="624" y="380" font-size="15" fill="#e9e7e3" text-anchor="start" font-weight="normal">‖a+b‖ = 5.00</text>
<text x="624" y="404" font-size="15" fill="#e9e7e3" text-anchor="start" font-weight="normal">√(‖a‖²+‖b‖²) = 6.56</text>
<text x="624" y="428" font-size="15" fill="#e0c169" text-anchor="start" font-weight="600">below: obtuse, θ = 115.35°</text>
</svg>
