<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400">
<rect width="760" height="400" fill="#111827" rx="12"/>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#e5e7eb"/></marker></defs>
<text x="24" y="32" fill="#e5e7eb" font-size="16" text-anchor="start" font-family="Inter, Arial, sans-serif">Two-tank cascade: x1' = −x1 + u,  x2' = x1 − 2·x2</text>
<rect x="60" y="110" width="130" height="120" rx="6" fill="none" stroke="#38bdf8" stroke-width="2"/>
<text x="125.0" y="166.5" fill="#38bdf8" font-size="14" text-anchor="middle" font-family="Inter, Arial, sans-serif">tank 1</text>
<text x="125.0" y="183.5" fill="#38bdf8" font-size="14" text-anchor="middle" font-family="Inter, Arial, sans-serif">x1</text>
<rect x="300" y="170" width="130" height="120" rx="6" fill="none" stroke="#a3e635" stroke-width="2"/>
<text x="365.0" y="226.5" fill="#a3e635" font-size="14" text-anchor="middle" font-family="Inter, Arial, sans-serif">tank 2</text>
<text x="365.0" y="243.5" fill="#a3e635" font-size="14" text-anchor="middle" font-family="Inter, Arial, sans-serif">x2</text>
<line x1="125" y1="50" x2="125" y2="108" stroke="#f97316" stroke-width="2" marker-end="url(#a)"/>
<text x="135" y="70" fill="#f97316" font-size="14" text-anchor="start" font-family="Inter, Arial, sans-serif">pump u</text>
<line x1="190" y1="200" x2="298" y2="230" stroke="#e5e7eb" stroke-width="2" marker-end="url(#a)"/>
<text x="200" y="196" fill="#e5e7eb" font-size="13" text-anchor="start" font-family="Inter, Arial, sans-serif">flow x1</text>
<line x1="430" y1="250" x2="500" y2="250" stroke="#e5e7eb" stroke-width="2" marker-end="url(#a)"/>
<text x="436" y="244" fill="#e5e7eb" font-size="13" text-anchor="start" font-family="Inter, Arial, sans-serif">out 2·x2</text>
<text x="60" y="258" fill="#f97316" font-size="13" text-anchor="start" font-family="Inter, Arial, sans-serif">sensor on tank 1: y = x1</text>
<text x="60" y="278" fill="#f97316" font-size="13" text-anchor="start" font-family="Inter, Arial, sans-serif">x2 never reaches y</text>
<text x="300" y="318" fill="#a3e635" font-size="13" text-anchor="start" font-family="Inter, Arial, sans-serif">sensor on tank 2: y = x2</text>
<text x="300" y="338" fill="#a3e635" font-size="13" text-anchor="start" font-family="Inter, Arial, sans-serif">x1 leaks into x2: visible</text>
<rect x="520" y="60" width="220" height="300" rx="8" fill="none" stroke="#e5e7eb" stroke-width="2"/>
<text x="630" y="86" fill="#e5e7eb" font-size="15" text-anchor="middle" font-family="Inter, Arial, sans-serif">Rank tests (n = 2)</text>
<text x="536" y="118" fill="#38bdf8" font-size="14" text-anchor="start" font-family="Inter, Arial, sans-serif">Controllability  [B  AB]</text>
<text x="536" y="142" fill="#e5e7eb" font-size="14" text-anchor="start" font-family="Inter, Arial, sans-serif">=  [[1, −1], [0, 1]]</text>
<text x="536" y="164" fill="#a3e635" font-size="14" text-anchor="start" font-family="Inter, Arial, sans-serif">det = 1  →  rank 2</text>
<text x="536" y="204" fill="#38bdf8" font-size="14" text-anchor="start" font-family="Inter, Arial, sans-serif">Observability, y = x2</text>
<text x="536" y="228" fill="#e5e7eb" font-size="14" text-anchor="start" font-family="Inter, Arial, sans-serif">[[0, 1], [1, −2]]  det = −1</text>
<text x="536" y="250" fill="#a3e635" font-size="14" text-anchor="start" font-family="Inter, Arial, sans-serif">→  rank 2</text>
<text x="536" y="290" fill="#38bdf8" font-size="14" text-anchor="start" font-family="Inter, Arial, sans-serif">Observability, y = x1</text>
<text x="536" y="314" fill="#e5e7eb" font-size="14" text-anchor="start" font-family="Inter, Arial, sans-serif">[[1, 0], [−1, 0]]  det = 0</text>
<text x="536" y="336" fill="#f97316" font-size="14" text-anchor="start" font-family="Inter, Arial, sans-serif">→  rank 1 (x2 hidden)</text>
</svg>