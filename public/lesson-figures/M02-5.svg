<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 410" font-family="Inter, sans-serif">
<title>Distance and angle can disagree</title>
<desc>Query x=(2,0), z1=(1,1), z2=(8,-1): distance picks z1, angle picks z2, after normalising both pick z2.</desc>
<rect width="900" height="410" rx="14" fill="#17181b"/>
<text x="32" y="44" font-size="22" fill="#e9e7e3" text-anchor="start" font-weight="bold">Distance and angle can disagree</text>
<rect x="32" y="70" width="424" height="310" rx="10" fill="#22252a"/>
<text x="52" y="100" font-size="17" fill="#a7adb5" text-anchor="start" font-weight="bold">Three vectors and a query</text>
<line x1="88.0" y1="270.0" x2="88.0" y2="276.0" stroke="#a7adb5" stroke-width="2" stroke-linecap="round"/>
<text x="88" y="290" font-size="14" fill="#a7adb5" text-anchor="middle" font-weight="normal">0</text>
<line x1="156.0" y1="270.0" x2="156.0" y2="276.0" stroke="#a7adb5" stroke-width="2" stroke-linecap="round"/>
<text x="156" y="290" font-size="14" fill="#a7adb5" text-anchor="middle" font-weight="normal">2</text>
<line x1="224.0" y1="270.0" x2="224.0" y2="276.0" stroke="#a7adb5" stroke-width="2" stroke-linecap="round"/>
<text x="224" y="290" font-size="14" fill="#a7adb5" text-anchor="middle" font-weight="normal">4</text>
<line x1="292.0" y1="270.0" x2="292.0" y2="276.0" stroke="#a7adb5" stroke-width="2" stroke-linecap="round"/>
<text x="292" y="290" font-size="14" fill="#a7adb5" text-anchor="middle" font-weight="normal">6</text>
<line x1="360.0" y1="270.0" x2="360.0" y2="276.0" stroke="#a7adb5" stroke-width="2" stroke-linecap="round"/>
<text x="360" y="290" font-size="14" fill="#a7adb5" text-anchor="middle" font-weight="normal">8</text>
<line x1="82.0" y1="270.0" x2="88.0" y2="270.0" stroke="#a7adb5" stroke-width="2" stroke-linecap="round"/>
<text x="78" y="275" font-size="14" fill="#a7adb5" text-anchor="end" font-weight="normal">−2</text>
<line x1="82.0" y1="202.0" x2="88.0" y2="202.0" stroke="#a7adb5" stroke-width="2" stroke-linecap="round"/>
<text x="78" y="207" font-size="14" fill="#a7adb5" text-anchor="end" font-weight="normal">0</text>
<line x1="82.0" y1="134.0" x2="88.0" y2="134.0" stroke="#a7adb5" stroke-width="2" stroke-linecap="round"/>
<text x="78" y="139" font-size="14" fill="#a7adb5" text-anchor="end" font-weight="normal">2</text>
<line x1="88.0" y1="270.0" x2="394.0" y2="270.0" stroke="#a7adb5" stroke-width="2" stroke-linecap="round"/>
<line x1="88.0" y1="134.0" x2="88.0" y2="270.0" stroke="#a7adb5" stroke-width="2" stroke-linecap="round"/>
<text x="394" y="312" font-size="15" fill="#a7adb5" text-anchor="end" font-weight="normal">x</text>
<text x="88" y="122" font-size="15" fill="#a7adb5" text-anchor="start" font-weight="normal">y</text>
<path d="M88.0 236.0 L90.7 235.9 L93.3 235.6 L95.9 235.1 L98.5 234.3 L101.0 233.4 L103.4 232.3 L105.8 231.0 L108.0 229.5 L110.1 227.9 L112.0 226.0 L113.9 224.1 L115.5 222.0 L117.0 219.8 L118.3 217.4 L119.4 215.0 L120.3 212.5 L121.1 209.9 L121.6 207.3 L121.9 204.7 L122.0 202.0 L121.9 199.3 L121.6 196.7 L121.1 194.1 L120.3 191.5 L119.4 189.0 L118.3 186.6 L117.0 184.2 L115.5 182.0 L113.9 179.9 L112.0 178.0 L110.1 176.1 L108.0 174.5 L105.8 173.0 L103.4 171.7 L101.0 170.6 L98.5 169.7 L95.9 168.9 L93.3 168.4 L90.7 168.1 L88.0 168.0" fill="none" stroke="#a7adb5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4"/>
<line x1="88.0" y1="202.0" x2="122.0" y2="168.0" stroke="#3d4148" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 4"/>
<line x1="88.0" y1="202.0" x2="360.0" y2="236.0" stroke="#3d4148" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 4"/>
<line x1="156.0" y1="202.0" x2="122.0" y2="168.0" stroke="#e0904f" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 5"/>
<line x1="156.0" y1="202.0" x2="360.0" y2="236.0" stroke="#e08db5" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 5"/>
<circle cx="88.0" cy="202.0" r="4" fill="#e9e7e3"/>
<circle cx="156.0" cy="202.0" r="7" fill="#86abe2"/>
<circle cx="122.0" cy="168.0" r="7" fill="#e0904f"/>
<circle cx="360.0" cy="236.0" r="7" fill="#e08db5"/>
<circle cx="112.0" cy="178.0" r="5" fill="#22252a" stroke="#e0904f" stroke-width="2"/>
<circle cx="121.7" cy="206.2" r="5" fill="#22252a" stroke="#e08db5" stroke-width="2"/>
<text x="166" y="188" font-size="15" fill="#86abe2" text-anchor="start" font-weight="600">x (2, 0)</text>
<text x="134" y="164" font-size="15" fill="#e0904f" text-anchor="start" font-weight="600">z₁ (1, 1)</text>
<text x="370" y="241" font-size="15" fill="#e08db5" text-anchor="start" font-weight="600">z₂ (8, −1)</text>
<text x="94" y="262" font-size="14" fill="#a7adb5" text-anchor="start" font-weight="normal">unit circle</text>
<text x="52" y="346" font-size="14" fill="#a7adb5" text-anchor="start" font-weight="normal">Hollow dots: z/‖z‖ on the unit circle.</text>
<text x="52" y="366" font-size="14" fill="#a7adb5" text-anchor="start" font-weight="normal">Coloured dashes: distance from x to z.</text>
<rect x="480" y="70" width="388" height="310" rx="10" fill="#22252a"/>
<text x="500" y="100" font-size="17" fill="#a7adb5" text-anchor="start" font-weight="bold">Which vector is nearest to x?</text>
<text x="500" y="140" font-size="17" fill="#e9e7e3" text-anchor="start" font-weight="bold">Distance ‖x − z‖</text>
<text x="500" y="168" font-size="15" fill="#e9e7e3" text-anchor="start" font-weight="normal">z₁: 1.414</text>
<text x="650" y="168" font-size="15" fill="#e9e7e3" text-anchor="start" font-weight="normal">z₂: 6.083</text>
<text x="848" y="168" font-size="15" fill="#e0904f" text-anchor="end" font-weight="600">→ z₁</text>
<text x="500" y="202" font-size="17" fill="#e9e7e3" text-anchor="start" font-weight="bold">Angle ∠(x, z)</text>
<text x="500" y="230" font-size="15" fill="#e9e7e3" text-anchor="start" font-weight="normal">z₁: 45.00°</text>
<text x="650" y="230" font-size="15" fill="#e9e7e3" text-anchor="start" font-weight="normal">z₂: 7.13°</text>
<text x="848" y="230" font-size="15" fill="#e08db5" text-anchor="end" font-weight="600">→ z₂</text>
<text x="500" y="264" font-size="17" fill="#e9e7e3" text-anchor="start" font-weight="bold">After normalising: distance</text>
<text x="500" y="292" font-size="15" fill="#e9e7e3" text-anchor="start" font-weight="normal">z₁: 1.474</text>
<text x="650" y="292" font-size="15" fill="#e9e7e3" text-anchor="start" font-weight="normal">z₂: 1.015</text>
<text x="848" y="292" font-size="15" fill="#e08db5" text-anchor="end" font-weight="600">→ z₂</text>
<text x="500" y="338" font-size="14" fill="#a7adb5" text-anchor="start" font-weight="normal">x need not be normalised; the proof needs ‖z‖ = 1.</text>
</svg>
