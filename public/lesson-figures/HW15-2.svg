<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="Inter, sans-serif">
<title>Trapezoid or triangle: the profile decides peak speed</title>
<desc>Velocity against time for the limits v = 0.5 m/s and a = 1.0 m/s^2: a 0.8 m move is a trapezoid of 2.1 s with 1.1 s of cruise, a 0.2 m move is a triangle of 0.894 s with peak speed 0.447 m/s.</desc>
<defs></defs>
<rect width="900" height="520" rx="14" fill="#17181b"/>
<text x="32" y="44" font-size="22" fill="#e9e7e3" text-anchor="start" font-weight="bold">Trapezoid or triangle: the profile decides peak speed</text>
<text x="32" y="70" font-size="15" fill="#a7adb5" text-anchor="start">Same limits, two distances (exercise 3, Modern Robotics §9.2.2.2)</text>
<rect x="88" y="112" width="532" height="308" rx="4" fill="#22252a"/>
<line x1="83" y1="420" x2="88" y2="420" stroke="#a7adb5" stroke-width="1.5" stroke-linecap="round"/>
<text x="78" y="425" font-size="14" fill="#a7adb5" text-anchor="end">0</text>
<line x1="83" y1="364" x2="88" y2="364" stroke="#a7adb5" stroke-width="1.5" stroke-linecap="round"/>
<text x="78" y="369" font-size="14" fill="#a7adb5" text-anchor="end">0.1</text>
<line x1="83" y1="308" x2="88" y2="308" stroke="#a7adb5" stroke-width="1.5" stroke-linecap="round"/>
<text x="78" y="313" font-size="14" fill="#a7adb5" text-anchor="end">0.2</text>
<line x1="83" y1="252" x2="88" y2="252" stroke="#a7adb5" stroke-width="1.5" stroke-linecap="round"/>
<text x="78" y="257" font-size="14" fill="#a7adb5" text-anchor="end">0.3</text>
<line x1="83" y1="196" x2="88" y2="196" stroke="#a7adb5" stroke-width="1.5" stroke-linecap="round"/>
<text x="78" y="201" font-size="14" fill="#a7adb5" text-anchor="end">0.4</text>
<line x1="83" y1="140" x2="88" y2="140" stroke="#a7adb5" stroke-width="1.5" stroke-linecap="round"/>
<text x="78" y="145" font-size="14" fill="#a7adb5" text-anchor="end">0.5</text>
<line x1="88" y1="420" x2="88" y2="425" stroke="#a7adb5" stroke-width="1.5" stroke-linecap="round"/>
<text x="88" y="442" font-size="14" fill="#a7adb5" text-anchor="middle">0</text>
<line x1="208.909" y1="420" x2="208.909" y2="425" stroke="#a7adb5" stroke-width="1.5" stroke-linecap="round"/>
<text x="208.909" y="442" font-size="14" fill="#a7adb5" text-anchor="middle">0.5</text>
<line x1="304.185" y1="420" x2="304.185" y2="425" stroke="#a7adb5" stroke-width="1.5" stroke-linecap="round"/>
<text x="304.185" y="442" font-size="14" fill="#a7adb5" text-anchor="middle">0.894</text>
<line x1="474.909" y1="420" x2="474.909" y2="425" stroke="#a7adb5" stroke-width="1.5" stroke-linecap="round"/>
<text x="474.909" y="442" font-size="14" fill="#a7adb5" text-anchor="middle">1.6</text>
<line x1="595.818" y1="420" x2="595.818" y2="425" stroke="#a7adb5" stroke-width="1.5" stroke-linecap="round"/>
<text x="595.818" y="442" font-size="14" fill="#a7adb5" text-anchor="middle">2.1</text>
<line x1="88" y1="420" x2="620" y2="420" stroke="#a7adb5" stroke-width="1.5" stroke-linecap="round"/>
<line x1="88" y1="112" x2="88" y2="420" stroke="#a7adb5" stroke-width="1.5" stroke-linecap="round"/>
<text x="354" y="468" font-size="15" fill="#e9e7e3" text-anchor="middle">time (s)</text>
<text x="88" y="98" font-size="15" fill="#e9e7e3" text-anchor="start">speed (m/s)</text>
<polygon points="88,420 208.909,140 474.909,140 595.818,420" fill="#e0904f" fill-opacity="0.18" stroke="#e0904f" stroke-width="3" stroke-linejoin="round"/>
<polygon points="88,420 196.144,169.56 304.289,420" fill="#86abe2" fill-opacity="0.25" stroke="#86abe2" stroke-width="3" stroke-linejoin="round"/>
<line x1="88" y1="140" x2="620" y2="140" stroke="#a7adb5" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="6 5"/>
<text x="612" y="132" font-size="14" fill="#e9e7e3" text-anchor="end" font-weight="600">v limit 0.5 m/s</text>
<circle cx="208.909" cy="140" r="4" fill="#e9e7e3"/>
<circle cx="474.909" cy="140" r="4" fill="#e9e7e3"/>
<circle cx="595.818" cy="420" r="4" fill="#e9e7e3"/>
<circle cx="196.144" cy="169.56" r="4" fill="#e9e7e3"/>
<circle cx="304.289" cy="420" r="4" fill="#e9e7e3"/>
<text x="162.144" y="174.56" font-size="14" fill="#86abe2" text-anchor="end" font-weight="600">0.447</text>
<text x="341.909" y="308" font-size="15" fill="#e0904f" text-anchor="middle" font-weight="600">area = 0.8 m</text>
<text x="189.564" y="364" font-size="15" fill="#86abe2" text-anchor="middle" font-weight="600">0.2 m</text>
<rect x="652" y="112" width="216" height="308" rx="8" fill="#22252a"/>
<text x="668" y="144" font-size="17" fill="#e0904f" text-anchor="start" font-weight="bold">0.8 m: trapezoid</text>
<text x="668" y="172" font-size="15" fill="#e9e7e3" text-anchor="start">v²/a = 0.25 &lt; 0.8</text>
<text x="668" y="196" font-size="15" fill="#e9e7e3" text-anchor="start">t_a = v/a = 0.5 s</text>
<text x="668" y="220" font-size="15" fill="#e9e7e3" text-anchor="start">cruise 1.1 s</text>
<text x="668" y="244" font-size="15" fill="#e9e7e3" text-anchor="start">T = d/v + v/a = 2.1 s</text>
<text x="668" y="302" font-size="17" fill="#86abe2" text-anchor="start" font-weight="bold">0.2 m: triangle</text>
<text x="668" y="330" font-size="15" fill="#e9e7e3" text-anchor="start">v²/a = 0.25 ≥ 0.2</text>
<text x="668" y="354" font-size="15" fill="#e9e7e3" text-anchor="start">v_peak = √(d a) = 0.447</text>
<text x="668" y="378" font-size="15" fill="#e9e7e3" text-anchor="start">T = 2·√(d/a) = 0.894 s</text>
</svg>
