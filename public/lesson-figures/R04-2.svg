<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" font-family="Inter, sans-serif">
<title>Workspace of the two-link arm: an annulus</title>
<desc>Reachable set of a two-link arm with l1=0.4 m and l2=0.25 m: a ring between radius 0.15 m and 0.65 m, an example pose with r=0.539 m, and the two extreme postures.</desc>
<defs><marker id="R042enarr-6cc6ba" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 z" fill="#6cc6ba"/></marker><marker id="R042enarr-6fc693" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 z" fill="#6fc693"/></marker><marker id="R042enarr-86abe2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 z" fill="#86abe2"/></marker><marker id="R042enarr-a7adb5" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 z" fill="#a7adb5"/></marker><marker id="R042enarr-ae9ce6" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 z" fill="#ae9ce6"/></marker><marker id="R042enarr-e08db5" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 z" fill="#e08db5"/></marker><marker id="R042enarr-e0904f" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 z" fill="#e0904f"/></marker><marker id="R042enarr-e0c169" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 z" fill="#e0c169"/></marker><marker id="R042enarr-e58a80" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 z" fill="#e58a80"/></marker><marker id="R042enarr-e9e7e3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 z" fill="#e9e7e3"/></marker></defs>
<rect width="900" height="640" rx="14" fill="#17181b"/>
<text x="32.0" y="44.0" font-size="22" fill="#e9e7e3" text-anchor="start" font-weight="bold">Reach is an annulus</text>
<path fill-rule="evenodd" d="M33.0 318 a247.0 247.0 0 1 0 494.0 0 a247.0 247.0 0 1 0 -494.0 0 M223.0 318 a57.00000000000001 57.00000000000001 0 1 0 114.00000000000001 0 a57.00000000000001 57.00000000000001 0 1 0 -114.00000000000001 0" fill="#ae9ce6" fill-opacity="0.22"/>
<circle cx="280.0" cy="318.0" r="247.0" fill="none" stroke="#ae9ce6" stroke-width="2.5" />
<circle cx="280.0" cy="318.0" r="57.0" fill="none" stroke="#ae9ce6" stroke-width="2.5" stroke-dasharray="7 5"/>
<line x1="280.0" y1="318.0" x2="482.3" y2="285.3" stroke="#e9e7e3" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 5"/>
<line x1="280.0" y1="318.0" x2="404.5" y2="230.8" stroke="#86abe2" stroke-width="5" stroke-linecap="round"/>
<line x1="404.5" y1="230.8" x2="482.3" y2="285.3" stroke="#e0904f" stroke-width="5" stroke-linecap="round"/>
<circle cx="280.0" cy="318.0" r="7.0" fill="#17181b" stroke="#e9e7e3" stroke-width="2.5" />
<circle cx="404.5" cy="230.8" r="7.0" fill="#17181b" stroke="#e9e7e3" stroke-width="2.5" />
<circle cx="482.3" cy="285.3" r="7.0" fill="#6fc693" />
<text x="397.0" y="344.0" font-size="15" fill="#e9e7e3" text-anchor="middle" font-weight="normal">r = 0.539 m</text>
<text x="391.0" y="221.0" font-size="15" fill="#86abe2" text-anchor="end" font-weight="normal">l₁ = 0.4 m</text>
<text x="453.0" y="214.0" font-size="15" fill="#e0904f" text-anchor="middle" font-weight="normal">l₂ = 0.25 m</text>
<text x="280.0" y="345.0" font-size="14" fill="#a7adb5" text-anchor="middle" font-weight="normal">unreachable</text>
<text x="268.0" y="323.0" font-size="14" fill="#a7adb5" text-anchor="end" font-weight="normal">base</text>
<text x="252.0" y="120.0" font-size="15" fill="#ae9ce6" text-anchor="middle" font-weight="normal">reachable</text>
<line x1="32.0" y1="586.0" x2="72.0" y2="586.0" stroke="#ae9ce6" stroke-width="2.5" stroke-linecap="round"/>
<text x="84.0" y="591.0" font-size="15" fill="#ae9ce6" text-anchor="start" font-weight="normal">r max = l₁ + l₂ = 0.65 m (outer circle)</text>
<line x1="32.0" y1="613.0" x2="72.0" y2="613.0" stroke="#ae9ce6" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="7 5"/>
<text x="84.0" y="618.0" font-size="15" fill="#ae9ce6" text-anchor="start" font-weight="normal">r min = |l₁ − l₂| = 0.15 m (dashed circle)</text>
<rect x="588" y="70" width="280" height="540" rx="10" fill="#22252a"/>
<text x="612.0" y="105.0" font-size="17" fill="#a7adb5" text-anchor="start" font-weight="bold">Law of cosines</text>
<text x="612.0" y="135.0" font-size="15" fill="#e9e7e3" text-anchor="start" font-weight="normal">r² = l₁² + l₂² + 2 l₁ l₂ cos q₂</text>
<text x="612.0" y="170.0" font-size="15" fill="#a7adb5" text-anchor="start" font-weight="normal">cos q₂ ∈ [−1, 1]  ⇒</text>
<text x="612.0" y="196.0" font-size="15" fill="#e9e7e3" text-anchor="start" font-weight="normal">|l₁ − l₂| ≤ r ≤ l₁ + l₂</text>
<text x="612.0" y="262.0" font-size="17" fill="#a7adb5" text-anchor="start" font-weight="bold">Extremes of q₂ (not to scale)</text>
<line x1="622.0" y1="330.0" x2="682.0" y2="330.0" stroke="#86abe2" stroke-width="5" stroke-linecap="round"/>
<line x1="682.0" y1="330.0" x2="719.5" y2="330.0" stroke="#e0904f" stroke-width="5" stroke-linecap="round"/>
<circle cx="622.0" cy="330.0" r="7.0" fill="#17181b" stroke="#e9e7e3" stroke-width="2.5" />
<circle cx="682.0" cy="330.0" r="7.0" fill="#17181b" stroke="#e9e7e3" stroke-width="2.5" />
<circle cx="719.5" cy="330.0" r="6.0" fill="#6fc693" />
<text x="622.0" y="364.0" font-size="15" fill="#e9e7e3" text-anchor="start" font-weight="normal">stretched, q₂ = 0</text>
<text x="622.0" y="390.0" font-size="15" fill="#ae9ce6" text-anchor="start" font-weight="normal">r = l₁ + l₂ = 0.65 m</text>
<line x1="622.0" y1="470.0" x2="682.0" y2="470.0" stroke="#86abe2" stroke-width="6" stroke-linecap="round"/>
<line x1="682.0" y1="470.0" x2="644.5" y2="470.0" stroke="#e0904f" stroke-width="3" stroke-linecap="round"/>
<circle cx="622.0" cy="470.0" r="7.0" fill="#17181b" stroke="#e9e7e3" stroke-width="2.5" />
<circle cx="682.0" cy="470.0" r="7.0" fill="#17181b" stroke="#e9e7e3" stroke-width="2.5" />
<circle cx="644.5" cy="470.0" r="5.0" fill="#6fc693" />
<text x="622.0" y="508.0" font-size="15" fill="#e9e7e3" text-anchor="start" font-weight="normal">folded, q₂ = ±180°</text>
<text x="622.0" y="534.0" font-size="15" fill="#ae9ce6" text-anchor="start" font-weight="normal">r = |l₁ − l₂| = 0.15 m</text>
</svg>
