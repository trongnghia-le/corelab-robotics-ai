<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="Inter, sans-serif">
<title>Case 2: Newton steps for inverse kinematics</title>
<desc>Planar two-link arm in three poses reaching the target (1.2, 0.8) with Newton iterations, and the error norm falling from 0.360 to 8.1e-6 m.</desc>
<rect width="900" height="500" rx="14" fill="#17181b"/>

