<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 630" font-family="Inter, Arial, sans-serif">
<title>Motor types, H-bridge states and PWM average voltage</title>
<desc>Left: five motor types with how each is driven and where it is used. Right top: an H-bridge with four switches and the four states forward, reverse, brake and coast. Right bottom: a 12 V PWM waveform at 25 and 75 percent duty with the average voltage.</desc>
<rect width="900" height="630" fill="#111827" rx="12"/>
<text x="24" y="32" font-size="16" fill="#e5e7eb" text-anchor="start" font-weight="bold">1. Pick the motor type</text>
<rect x="20" y="52" width="410" height="76" rx="8" fill="#1f2937" stroke="#38bdf8" stroke-width="2"/>
<text x="34" y="76" font-size="14" fill="#e5e7eb" text-anchor="start" font-weight="bold">Brushed DC gearmotor</text>
<text x="34" y="98" font-size="12" fill="#e5e7eb" text-anchor="start">driven by: H-bridge: DIR + PWM</text>
<text x="34" y="117" font-size="12" fill="#9ca3af" text-anchor="start">use: wheels, simple joints; add encoder</text>
<rect x="20" y="140" width="410" height="76" rx="8" fill="#1f2937" stroke="#a3e635" stroke-width="2"/>
<text x="34" y="164" font-size="14" fill="#e5e7eb" text-anchor="start" font-weight="bold">Brushless (BLDC)</text>
<text x="34" y="186" font-size="12" fill="#e5e7eb" text-anchor="start">driven by: ESC or FOC driver</text>
<text x="34" y="205" font-size="12" fill="#9ca3af" text-anchor="start">use: drones, fast joints, efficiency</text>
<rect x="20" y="228" width="410" height="76" rx="8" fill="#1f2937" stroke="#f97316" stroke-width="2"/>
<text x="34" y="252" font-size="14" fill="#e5e7eb" text-anchor="start" font-weight="bold">Hobby servo</text>
<text x="34" y="274" font-size="12" fill="#e5e7eb" text-anchor="start">driven by: one 50 Hz pulse, 1-2 ms</text>
<text x="34" y="293" font-size="12" fill="#9ca3af" text-anchor="start">use: small arms, pan/tilt, no feedback out</text>
<rect x="20" y="316" width="410" height="76" rx="8" fill="#1f2937" stroke="#a3e635" stroke-width="2"/>
<text x="34" y="340" font-size="14" fill="#e5e7eb" text-anchor="start" font-weight="bold">Smart serial servo</text>
<text x="34" y="362" font-size="12" fill="#e5e7eb" text-anchor="start">driven by: UART / RS-485 packets</text>
<text x="34" y="381" font-size="12" fill="#9ca3af" text-anchor="start">use: arm joints with position + current</text>
<rect x="20" y="404" width="410" height="76" rx="8" fill="#1f2937" stroke="#38bdf8" stroke-width="2"/>
<text x="34" y="428" font-size="14" fill="#e5e7eb" text-anchor="start" font-weight="bold">Stepper</text>
<text x="34" y="450" font-size="12" fill="#e5e7eb" text-anchor="start">driven by: STEP + DIR driver</text>
<text x="34" y="469" font-size="12" fill="#9ca3af" text-anchor="start">use: 3D printer axes, open loop</text>
<text x="24" y="525" font-size="12" fill="#9ca3af" text-anchor="start">Torque, gearing and speed maths: R09. Here we choose and check.</text>
<text x="24" y="545" font-size="12" fill="#f97316" text-anchor="start">Rule: size for the load, then check the STALL current against the driver.</text>
<text x="460" y="32" font-size="16" fill="#e5e7eb" text-anchor="start" font-weight="bold">2. H-bridge: four switches, four states</text>
<line x1="520" y1="56" x2="640" y2="56" stroke="#f97316" stroke-width="2"/>
<text x="650" y="60" font-size="12" fill="#f97316" text-anchor="start">+V motor supply</text>
<line x1="520" y1="206" x2="640" y2="206" stroke="#9ca3af" stroke-width="2"/>
<text x="650" y="210" font-size="12" fill="#9ca3af" text-anchor="start">GND</text>
<line x1="540" y1="56" x2="540" y2="206" stroke="#e5e7eb" stroke-width="2"/>
<line x1="620" y1="56" x2="620" y2="206" stroke="#e5e7eb" stroke-width="2"/>
<rect x="524" y="70" width="32" height="32" rx="8" fill="#1f2937" stroke="#38bdf8" stroke-width="2"/>
<text x="540" y="91" font-size="13" fill="#e5e7eb" text-anchor="middle" font-weight="bold">Q1</text>
<rect x="604" y="70" width="32" height="32" rx="8" fill="#1f2937" stroke="#38bdf8" stroke-width="2"/>
<text x="620" y="91" font-size="13" fill="#e5e7eb" text-anchor="middle" font-weight="bold">Q2</text>
<rect x="524" y="140" width="32" height="32" rx="8" fill="#1f2937" stroke="#38bdf8" stroke-width="2"/>
<text x="540" y="161" font-size="13" fill="#e5e7eb" text-anchor="middle" font-weight="bold">Q3</text>
<rect x="604" y="140" width="32" height="32" rx="8" fill="#1f2937" stroke="#38bdf8" stroke-width="2"/>
<text x="620" y="161" font-size="13" fill="#e5e7eb" text-anchor="middle" font-weight="bold">Q4</text>
<line x1="540" y1="131" x2="620" y2="131" stroke="#e5e7eb" stroke-width="2"/>
<circle cx="580" cy="131" r="17" fill="#1f2937" stroke="#e5e7eb" stroke-width="2"/>
<text x="580" y="136" font-size="14" fill="#e5e7eb" text-anchor="middle" font-weight="bold">M</text>
<text x="720" y="92" font-size="12" fill="#9ca3af" text-anchor="start">Q1, Q2: high side</text>
<text x="720" y="162" font-size="12" fill="#9ca3af" text-anchor="start">Q3, Q4: low side</text>
<text x="470" y="232" font-size="13" fill="#a3e635" text-anchor="start" font-weight="bold">Forward</text>
<text x="560" y="232" font-size="13" fill="#e5e7eb" text-anchor="start">Q1 + Q4 on</text>
<text x="690" y="232" font-size="12" fill="#9ca3af" text-anchor="start">current left to right</text>
<text x="470" y="262" font-size="13" fill="#a3e635" text-anchor="start" font-weight="bold">Reverse</text>
<text x="560" y="262" font-size="13" fill="#e5e7eb" text-anchor="start">Q2 + Q3 on</text>
<text x="690" y="262" font-size="12" fill="#9ca3af" text-anchor="start">current right to left</text>
<text x="470" y="292" font-size="13" fill="#38bdf8" text-anchor="start" font-weight="bold">Brake</text>
<text x="560" y="292" font-size="13" fill="#e5e7eb" text-anchor="start">Q3 + Q4 on</text>
<text x="690" y="292" font-size="12" fill="#9ca3af" text-anchor="start">motor terminals shorted</text>
<text x="470" y="322" font-size="13" fill="#38bdf8" text-anchor="start" font-weight="bold">Coast</text>
<text x="560" y="322" font-size="13" fill="#e5e7eb" text-anchor="start">all off</text>
<text x="690" y="322" font-size="12" fill="#9ca3af" text-anchor="start">motor spins freely</text>
<text x="470" y="358" font-size="12" fill="#f97316" text-anchor="start">Never turn Q1 + Q3 (or Q2 + Q4) on together: shoot-through short.</text>
<text x="460" y="392" font-size="16" fill="#e5e7eb" text-anchor="start" font-weight="bold">3. PWM: duty sets the average voltage (12 V supply)</text>
<polyline points="470.0,500.0 470.0,450.0 490.0,450.0 490.0,500.0 550.0,500.0 550.0,450.0 570.0,450.0 570.0,500.0 630.0,500.0 630.0,450.0 650.0,450.0 650.0,500.0 710.0,500.0" fill="none" stroke="#38bdf8" stroke-width="2"/>
<line x1="470" y1="487.5" x2="710" y2="487.5" stroke="#f97316" stroke-width="1"/>
<text x="722" y="491.5" font-size="12" fill="#f97316" text-anchor="start">average 3 V</text>
<text x="470" y="518" font-size="12" fill="#e5e7eb" text-anchor="start">duty 25 %</text>
<polyline points="470.0,590.0 470.0,540.0 530.0,540.0 530.0,590.0 550.0,590.0 550.0,540.0 610.0,540.0 610.0,590.0 630.0,590.0 630.0,540.0 690.0,540.0 690.0,590.0 710.0,590.0" fill="none" stroke="#38bdf8" stroke-width="2"/>
<line x1="470" y1="552.5" x2="710" y2="552.5" stroke="#f97316" stroke-width="1"/>
<text x="722" y="556.5" font-size="12" fill="#f97316" text-anchor="start">average 9 V</text>
<text x="470" y="608" font-size="12" fill="#e5e7eb" text-anchor="start">duty 75 %</text>
<text x="860" y="414" font-size="12" fill="#9ca3af" text-anchor="end">period at 20 kHz = 50 us</text>
</svg>
