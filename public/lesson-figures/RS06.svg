<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420">
  <rect width="760" height="420" fill="#191b1f" rx="12"/>
  <g font-family="Inter, Arial, sans-serif" fill="#e5e7eb" font-size="14">
    <text x="380" y="30" text-anchor="middle" font-size="16" font-weight="bold">A claim is only as strong as the evidence and assumptions under it</text>
    <text x="110" y="64" text-anchor="middle" fill="#d97936" font-weight="bold">CLAIMS</text>
    <text x="380" y="64" text-anchor="middle" fill="#53b2dd" font-weight="bold">EVIDENCE</text>
    <text x="650" y="64" text-anchor="middle" fill="#9ccd4e" font-weight="bold">ASSUMPTIONS</text>
    <!-- claims -->
    <rect x="20" y="80" width="180" height="70" rx="8" fill="none" stroke="#d97936" stroke-width="2"/>
    <text x="110" y="108" text-anchor="middle">C1: higher success</text>
    <text x="110" y="128" text-anchor="middle">rate than baseline</text>
    <rect x="20" y="180" width="180" height="70" rx="8" fill="none" stroke="#d97936" stroke-width="2"/>
    <text x="110" y="208" text-anchor="middle">C2: works on a</text>
    <text x="110" y="228" text-anchor="middle">real robot</text>
    <rect x="20" y="280" width="180" height="70" rx="8" fill="none" stroke="#d97936" stroke-width="2"/>
    <text x="110" y="308" text-anchor="middle">C3: gain comes from</text>
    <text x="110" y="328" text-anchor="middle">the learned cost map</text>
    <!-- evidence -->
    <rect x="290" y="80" width="180" height="70" rx="8" fill="none" stroke="#53b2dd" stroke-width="2"/>
    <text x="380" y="108" text-anchor="middle">Table 2: 5 seeds,</text>
    <text x="380" y="128" text-anchor="middle">+1.8 points, t = 1.4</text>
    <rect x="290" y="180" width="180" height="70" rx="8" fill="none" stroke="#53b2dd" stroke-width="2"/>
    <text x="380" y="208" text-anchor="middle">Fig 6: one video,</text>
    <text x="380" y="228" text-anchor="middle">n = 1 run</text>
    <rect x="290" y="280" width="180" height="70" rx="8" fill="none" stroke="#53b2dd" stroke-width="2" stroke-dasharray="6 5"/>
    <text x="380" y="308" text-anchor="middle">no ablation</text>
    <text x="380" y="328" text-anchor="middle">reported</text>
    <!-- assumptions -->
    <rect x="560" y="80" width="180" height="70" rx="8" fill="none" stroke="#9ccd4e" stroke-width="2"/>
    <text x="650" y="108" text-anchor="middle">test maps drawn from</text>
    <text x="650" y="128" text-anchor="middle">the training maps' family</text>
    <rect x="560" y="180" width="180" height="70" rx="8" fill="none" stroke="#9ccd4e" stroke-width="2"/>
    <text x="650" y="208" text-anchor="middle">perfect localisation,</text>
    <text x="650" y="228" text-anchor="middle">Gaussian lidar noise</text>
    <rect x="560" y="280" width="180" height="70" rx="8" fill="none" stroke="#9ccd4e" stroke-width="2"/>
    <text x="650" y="308" text-anchor="middle">same compute budget</text>
    <text x="650" y="328" text-anchor="middle">for both methods</text>
    <!-- arrows -->
    <line x1="200" y1="115" x2="288" y2="115" stroke="#e5e7eb" stroke-width="2"/>
    <polygon points="288,115 278,110 278,120" fill="#e5e7eb"/>
    <line x1="200" y1="215" x2="288" y2="215" stroke="#e5e7eb" stroke-width="2"/>
    <polygon points="288,215 278,210 278,220" fill="#e5e7eb"/>
    <line x1="200" y1="315" x2="288" y2="315" stroke="#e5e7eb" stroke-width="2" stroke-dasharray="6 5"/>
    <line x1="560" y1="115" x2="472" y2="115" stroke="#e5e7eb" stroke-width="2"/>
    <polygon points="472,115 482,110 482,120" fill="#e5e7eb"/>
    <line x1="560" y1="215" x2="472" y2="215" stroke="#e5e7eb" stroke-width="2"/>
    <polygon points="472,215 482,210 482,220" fill="#e5e7eb"/>
    <line x1="560" y1="315" x2="472" y2="315" stroke="#e5e7eb" stroke-width="2"/>
    <polygon points="472,315 482,310 482,320" fill="#e5e7eb"/>
    <text x="244" y="104" text-anchor="middle" font-size="13">weak</text>
    <text x="244" y="204" text-anchor="middle" font-size="13">n = 1</text>
    <text x="244" y="304" text-anchor="middle" font-size="13">none</text>
    <text x="380" y="385" text-anchor="middle" font-size="14" fill="#d97936">Per row: does the evidence cover the whole claim, and what must hold?</text>
  </g>
</svg>
