<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" font-family="Inter, Arial, sans-serif">
<rect width="760" height="360" fill="#111827" rx="12"/>
<text x="20" y="30" font-size="16" font-weight="bold" fill="#e5e7eb">Templates: one stencil, one real function per type</text>
<rect x="260" y="50" width="240" height="60" rx="8" fill="none" stroke="#38bdf8" stroke-width="2"/>
<text x="380" y="75" font-size="14" fill="#38bdf8" text-anchor="middle">template &lt;class T&gt;</text>
<text x="380" y="97" font-size="13" fill="#e5e7eb" text-anchor="middle">T clamp_to(T x, T lo, T hi)</text>
<path d="M330 110 L140 170 M380 110 V170 M430 110 L620 170" stroke="#e5e7eb" stroke-width="2"/>
<rect x="40" y="170" width="200" height="56" rx="8" fill="#1f2937" stroke="#a3e635" stroke-width="2"/>
<text x="140" y="194" font-size="14" fill="#a3e635" text-anchor="middle">clamp_to&lt;int&gt;</text>
<text x="140" y="214" font-size="13" fill="#e5e7eb" text-anchor="middle">clamp_to(5, 0, 3)</text>
<rect x="280" y="170" width="200" height="56" rx="8" fill="#1f2937" stroke="#a3e635" stroke-width="2"/>
<text x="380" y="194" font-size="14" fill="#a3e635" text-anchor="middle">clamp_to&lt;double&gt;</text>
<text x="380" y="214" font-size="13" fill="#e5e7eb" text-anchor="middle">clamp_to(0.5, 0.0, 1.0)</text>
<rect x="520" y="170" width="200" height="56" rx="8" fill="none" stroke="#f97316" stroke-width="2" stroke-dasharray="5 4"/>
<text x="620" y="194" font-size="14" fill="#f97316" text-anchor="middle">clamp_to(5, 0.0, 3.0)</text>
<text x="620" y="214" font-size="13" fill="#e5e7eb" text-anchor="middle">error: int vs double</text>
<text x="20" y="262" font-size="16" font-weight="bold" fill="#e5e7eb">constexpr: same code, evaluated when the arguments are constants</text>
<rect x="40" y="280" width="320" height="56" rx="8" fill="#1f2937" stroke="#38bdf8" stroke-width="2"/>
<text x="200" y="304" font-size="14" fill="#38bdf8" text-anchor="middle">compile time</text>
<text x="200" y="324" font-size="13" fill="#e5e7eb" text-anchor="middle">static_assert(make_squares&lt;6&gt;()[5] == 25)</text>
<rect x="400" y="280" width="320" height="56" rx="8" fill="#1f2937" stroke="#f97316" stroke-width="2"/>
<text x="560" y="304" font-size="14" fill="#f97316" text-anchor="middle">run time</text>
<text x="560" y="324" font-size="13" fill="#e5e7eb" text-anchor="middle">clamp_to(read_sensor(), lo, hi)</text>
</svg>
