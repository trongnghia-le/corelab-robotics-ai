<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" font-family="Inter, Arial, sans-serif">
<rect width="760" height="430" fill="#111827" rx="12"/>
<text x="380.0" y="30" font-size="17" fill="#e5e7eb" text-anchor="middle" font-weight="bold">Faults in, safe output out; distance is the cost of delay</text>
<rect x="20" y="60" width="130" height="64" rx="8" fill="#1f2937" stroke="#f97316" stroke-width="2"/>
<text x="85.0" y="80.5" font-size="13" fill="#e5e7eb" text-anchor="middle" font-weight="bold">Hazard</text>
<text x="85.0" y="96.5" font-size="13" fill="#e5e7eb" text-anchor="middle">moving arm,</text>
<text x="85.0" y="112.5" font-size="13" fill="#e5e7eb" text-anchor="middle">pinch point</text>
<rect x="20" y="160" width="130" height="64" rx="8" fill="#1f2937" stroke="#f97316" stroke-width="2"/>
<text x="85.0" y="180.6" font-size="13" fill="#e5e7eb" text-anchor="middle" font-weight="bold">Fault</text>
<text x="85.0" y="196.6" font-size="13" fill="#e5e7eb" text-anchor="middle">lost command,</text>
<text x="85.0" y="212.6" font-size="13" fill="#e5e7eb" text-anchor="middle">NaN sensor</text>
<line x1="85" y1="124" x2="85" y2="160" stroke="#f97316" stroke-width="2"/>
<polygon points="85.0,160.0 81.5,151.7 88.5,151.7" fill="#f97316"/>
<rect x="200" y="60" width="220" height="164" rx="8" fill="#1f2937" stroke="#38bdf8" stroke-width="2"/>
<text x="310.0" y="106.5" font-size="13" fill="#e5e7eb" text-anchor="middle" font-weight="bold">Monitor</text>
<text x="310.0" y="122.5" font-size="13" fill="#e5e7eb" text-anchor="middle"></text>
<text x="310.0" y="138.6" font-size="13" fill="#e5e7eb" text-anchor="middle">cmd age > Tc ?</text>
<text x="310.0" y="154.6" font-size="13" fill="#e5e7eb" text-anchor="middle">sensor finite, in range ?</text>
<text x="310.0" y="170.6" font-size="13" fill="#e5e7eb" text-anchor="middle">sensor age > Ts ?</text>
<text x="310.0" y="186.6" font-size="13" fill="#e5e7eb" text-anchor="middle">|v| > vmax ?</text>
<line x1="150" y1="192" x2="200" y2="192" stroke="#f97316" stroke-width="2"/>
<polygon points="200.0,192.0 191.7,195.5 191.7,188.5" fill="#f97316"/>
<rect x="470" y="60" width="120" height="40" rx="8" fill="#1f2937" stroke="#a3e635" stroke-width="2"/>
<text x="530.0" y="84.5" font-size="13" fill="#e5e7eb" text-anchor="middle" font-weight="bold">ok</text>
<rect x="470" y="112" width="120" height="40" rx="8" fill="#1f2937" stroke="#a3e635" stroke-width="2"/>
<text x="530.0" y="136.6" font-size="13" fill="#e5e7eb" text-anchor="middle" font-weight="bold">limit (clip)</text>
<rect x="470" y="164" width="120" height="60" rx="8" fill="#1f2937" stroke="#f97316" stroke-width="2"/>
<text x="530.0" y="190.6" font-size="13" fill="#e5e7eb" text-anchor="middle" font-weight="bold">stop, latched</text>
<text x="530.0" y="206.6" font-size="13" fill="#e5e7eb" text-anchor="middle">until reset</text>
<line x1="420" y1="80" x2="470" y2="80" stroke="#e5e7eb" stroke-width="2"/>
<polygon points="470.0,80.0 461.7,83.5 461.7,76.5" fill="#e5e7eb"/>
<line x1="420" y1="132" x2="470" y2="132" stroke="#e5e7eb" stroke-width="2"/>
<polygon points="470.0,132.0 461.7,135.5 461.7,128.5" fill="#e5e7eb"/>
<line x1="420" y1="194" x2="470" y2="194" stroke="#e5e7eb" stroke-width="2"/>
<polygon points="470.0,194.0 461.7,197.5 461.7,190.5" fill="#e5e7eb"/>
<rect x="620" y="100" width="120" height="90" rx="8" fill="#1f2937" stroke="#e5e7eb" stroke-width="2"/>
<text x="680.0" y="133.6" font-size="13" fill="#e5e7eb" text-anchor="middle" font-weight="bold">Actuator</text>
<text x="680.0" y="149.6" font-size="13" fill="#e5e7eb" text-anchor="middle">safe state:</text>
<text x="680.0" y="165.6" font-size="13" fill="#e5e7eb" text-anchor="middle">brake / power off</text>
<line x1="590" y1="194" x2="620" y2="170" stroke="#f97316" stroke-width="2"/>
<polygon points="620.0,170.0 615.7,177.9 611.3,172.4" fill="#f97316"/>
<text x="380" y="268" font-size="13" fill="#e5e7eb" text-anchor="middle" font-weight="bold">v = 1.5 m/s, t_r = 0.1 s, a = 3 m/s^2</text>
<rect x="60" y="296" width="55.0" height="34" fill="#1f2937" stroke="#f97316" stroke-width="2"/>
<rect x="115.0" y="296" width="137.5" height="34" fill="#1f2937" stroke="#38bdf8" stroke-width="2"/>
<text x="87.5" y="318" font-size="12" fill="#e5e7eb" text-anchor="middle">0.15 m</text>
<text x="183.75" y="318" font-size="13" fill="#e5e7eb" text-anchor="middle">0.375 m braking</text>
<text x="87.5" y="288" font-size="13" fill="#f97316" text-anchor="middle">reaction</text>
<text x="183.75" y="288" font-size="13" fill="#38bdf8" text-anchor="middle">v^2 / 2a</text>
<line x1="60" y1="344" x2="252.5" y2="344" stroke="#a3e635" stroke-width="2"/>
<text x="156.25" y="364" font-size="13" fill="#a3e635" text-anchor="middle">total d = 0.525 m</text>
<text x="282.5" y="318" font-size="13" fill="#e5e7eb" text-anchor="start">obstacle clearance D = 1.0 m leaves 0.475 m margin</text>
<text x="380" y="405" font-size="13" fill="#e5e7eb" text-anchor="middle">Timeouts are distances: 250 ms at 1.5 m/s is 0.375 m before braking begins.</text>
</svg>