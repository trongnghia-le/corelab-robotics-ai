<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" font-family="Inter, sans-serif">
<title>Computation graph of a sigmoid neuron: forward values and backward gradients</title>
<desc>Graph with inputs x, w, b, node z, sigmoid y and loss L with forward values in blue and backward gradients in orange, then one SGD step.</desc>
<defs><marker id="PY06arr-86abe2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 z" fill="#86abe2"/></marker><marker id="PY06arr-e0904f" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 z" fill="#e0904f"/></marker></defs>
<rect width="900" height="540" rx="14" fill="#17181b"/>
<text x="32" y="44" font-size="22" fill="#e9e7e3" text-anchor="start" font-weight="bold">Computation graph of a sigmoid neuron: forward values and backward gradients</text>
<line x1="52.0" y1="104.0" x2="86.0" y2="104.0" stroke="#86abe2" stroke-width="2.5" stroke-linecap="round" marker-end="url(#PY06arr-86abe2)"/>
<text x="96" y="109" font-size="14" fill="#a7adb5" text-anchor="start">forward: values are stored</text>
<line x1="332.0" y1="104.0" x2="366.0" y2="104.0" stroke="#e0904f" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="6 4" marker-end="url(#PY06arr-e0904f)"/>
<text x="376" y="109" font-size="14" fill="#a7adb5" text-anchor="start">backward: adjoints (gradients)</text>
<rect x="32" y="138" width="170" height="38" rx="8" fill="#22252a" stroke="#3d4148" stroke-width="1.5"/>
<text x="44" y="163" font-size="15" fill="#e9e7e3" text-anchor="start">x = (1, 2)</text>
<rect x="32" y="188" width="170" height="38" rx="8" fill="#22252a" stroke="#3d4148" stroke-width="1.5"/>
<text x="44" y="213" font-size="15" fill="#e9e7e3" text-anchor="start">w = (0.5, −0.25)</text>
<rect x="32" y="238" width="170" height="38" rx="8" fill="#22252a" stroke="#3d4148" stroke-width="1.5"/>
<text x="44" y="263" font-size="15" fill="#e9e7e3" text-anchor="start">b = 0.1</text>
<rect x="280" y="170" width="170" height="66" rx="10" fill="#22252a" stroke="#3d4148" stroke-width="1.5"/>
<text x="365" y="194" font-size="15" fill="#e9e7e3" text-anchor="middle">z = wᵀx + b</text>
<text x="365" y="216" font-size="15" fill="#86abe2" text-anchor="middle" font-weight="600">z = 0.1</text>
<rect x="520" y="170" width="150" height="66" rx="10" fill="#22252a" stroke="#3d4148" stroke-width="1.5"/>
<text x="595" y="194" font-size="15" fill="#e9e7e3" text-anchor="middle">y = σ(z)</text>
<text x="595" y="216" font-size="15" fill="#86abe2" text-anchor="middle" font-weight="600">y = 0.524979</text>
<rect x="740" y="170" width="128" height="66" rx="10" fill="#22252a" stroke="#3d4148" stroke-width="1.5"/>
<text x="804" y="194" font-size="15" fill="#e9e7e3" text-anchor="middle">L = ½(y − t)²</text>
<text x="804" y="216" font-size="15" fill="#86abe2" text-anchor="middle" font-weight="600">L = 0.112822</text>
<text x="804" y="152" font-size="15" fill="#a7adb5" text-anchor="middle">t = 1</text>
<line x1="202.0" y1="157.0" x2="278.0" y2="203.0" stroke="#86abe2" stroke-width="2" stroke-linecap="round" marker-end="url(#PY06arr-86abe2)"/>
<line x1="202.0" y1="207.0" x2="278.0" y2="203.0" stroke="#86abe2" stroke-width="2" stroke-linecap="round" marker-end="url(#PY06arr-86abe2)"/>
<line x1="202.0" y1="257.0" x2="278.0" y2="203.0" stroke="#86abe2" stroke-width="2" stroke-linecap="round" marker-end="url(#PY06arr-86abe2)"/>
<line x1="450.0" y1="203.0" x2="518.0" y2="203.0" stroke="#86abe2" stroke-width="2.5" stroke-linecap="round" marker-end="url(#PY06arr-86abe2)"/>
<line x1="670.0" y1="203.0" x2="738.0" y2="203.0" stroke="#86abe2" stroke-width="2.5" stroke-linecap="round" marker-end="url(#PY06arr-86abe2)"/>
<line x1="365.0" y1="238.0" x2="365.0" y2="324.0" stroke="#2c3036" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="3 4"/>
<line x1="595.0" y1="238.0" x2="595.0" y2="324.0" stroke="#2c3036" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="3 4"/>
<line x1="804.0" y1="238.0" x2="804.0" y2="324.0" stroke="#2c3036" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="3 4"/>
<line x1="804.0" y1="330.0" x2="597.0" y2="330.0" stroke="#e0904f" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="6 4" marker-end="url(#PY06arr-e0904f)"/>
<line x1="595.0" y1="330.0" x2="367.0" y2="330.0" stroke="#e0904f" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="6 4" marker-end="url(#PY06arr-e0904f)"/>
<line x1="365.0" y1="330.0" x2="102.0" y2="330.0" stroke="#e0904f" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="6 4" marker-end="url(#PY06arr-e0904f)"/>
<text x="700" y="316" font-size="15" fill="#e9e7e3" text-anchor="middle">∂L/∂y = y − t</text>
<text x="700" y="354" font-size="15" fill="#e0904f" text-anchor="middle" font-weight="600">= −0.475021</text>
<text x="480" y="316" font-size="15" fill="#e9e7e3" text-anchor="middle">∂y/∂z = y(1 − y)</text>
<text x="480" y="354" font-size="15" fill="#e0904f" text-anchor="middle" font-weight="600">= 0.249376</text>
<text x="480" y="404" font-size="15" fill="#e9e7e3" text-anchor="middle">∂L/∂z = (∂L/∂y)(∂y/∂z)</text>
<text x="480" y="428" font-size="15" fill="#e0904f" text-anchor="middle" font-weight="600">= −0.118459</text>
<text x="234" y="316" font-size="15" fill="#e9e7e3" text-anchor="middle">∂L/∂w = (∂L/∂z)·x</text>
<text x="234" y="354" font-size="15" fill="#e0904f" text-anchor="middle" font-weight="600">= (−0.118459, −0.236918)</text>
<text x="234" y="404" font-size="15" fill="#e9e7e3" text-anchor="middle">∂L/∂b = ∂L/∂z</text>
<text x="234" y="428" font-size="15" fill="#e0904f" text-anchor="middle" font-weight="600">= −0.118459</text>
<rect x="32" y="478" width="836" height="36" rx="8" fill="#22252a" stroke="#3d4148" stroke-width="1.5"/>
<text x="46" y="502" font-size="15" fill="#e9e7e3" text-anchor="start" font-weight="600">SGD step, η = 0.5:  w ← (0.559230, −0.131541),  b ← 0.159230,  L: 0.112822 → 0.075304</text>
</svg>
