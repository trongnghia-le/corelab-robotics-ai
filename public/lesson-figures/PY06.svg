<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="Inter, Arial, sans-serif">
<rect width="760" height="400" fill="#111827" rx="12"/>
<text x="380" y="28" fill="#e5e7eb" font-size="18" font-weight="bold" text-anchor="middle">Autograd on a neuron: forward values and backward gradients</text>
<rect x="30" y="90" width="100" height="56" rx="8" fill="#1f2937" stroke="#e5e7eb" stroke-width="2"/><text x="80.0" y="112" fill="#e5e7eb" font-size="15" font-weight="bold" text-anchor="middle">x, w, b</text><text x="80.0" y="132" fill="#e5e7eb" font-size="12" text-anchor="middle">x=(1, 2)</text><rect x="190" y="90" width="110" height="56" rx="8" fill="#1f2937" stroke="#38bdf8" stroke-width="2"/><text x="245.0" y="112" fill="#e5e7eb" font-size="15" font-weight="bold" text-anchor="middle">z = w·x + b</text><text x="245.0" y="132" fill="#e5e7eb" font-size="12" text-anchor="middle">z = 0.1</text><rect x="360" y="90" width="120" height="56" rx="8" fill="#1f2937" stroke="#38bdf8" stroke-width="2"/><text x="420.0" y="112" fill="#e5e7eb" font-size="15" font-weight="bold" text-anchor="middle">y = σ(z)</text><text x="420.0" y="132" fill="#e5e7eb" font-size="12" text-anchor="middle">y = 0.52498</text><rect x="540" y="90" width="180" height="56" rx="8" fill="#1f2937" stroke="#38bdf8" stroke-width="2"/><text x="630.0" y="112" fill="#e5e7eb" font-size="15" font-weight="bold" text-anchor="middle">L = ½ (y − t)²</text><text x="630.0" y="132" fill="#e5e7eb" font-size="12" text-anchor="middle">L = 0.11282 (t = 1)</text><path d="M130,118 L182,118" stroke="#38bdf8" stroke-width="2.5"/><polygon points="190,118 181,113 181,123" fill="#38bdf8"/><path d="M300,118 L352,118" stroke="#38bdf8" stroke-width="2.5"/><polygon points="360,118 351,113 351,123" fill="#38bdf8"/><path d="M480,118 L532,118" stroke="#38bdf8" stroke-width="2.5"/><polygon points="540,118 531,113 531,123" fill="#38bdf8"/><text x="380" y="76" fill="#38bdf8" font-size="13" text-anchor="middle">forward pass (left to right) stores intermediate values</text><path d="M630,150 L630,190 L420,190 L420,150" fill="none" stroke="#f97316" stroke-width="2" stroke-dasharray="6 4"/><polygon points="420,148 415,158 425,158" fill="#f97316"/>
<text x="525" y="210" fill="#f97316" font-size="13" text-anchor="middle">∂L/∂y = y − t = −0.47502</text>
<path d="M400,150 L400,262 L245,262 L245,150" fill="none" stroke="#f97316" stroke-width="2" stroke-dasharray="6 4"/><polygon points="245,148 240,158 250,158" fill="#f97316"/>
<text x="332" y="256" fill="#f97316" font-size="13" text-anchor="middle" dy="-8">× σ'(z) = 0.24938</text>
<text x="332" y="282" fill="#f97316" font-size="13" text-anchor="middle">∂L/∂z = −0.11846</text>
<path d="M245,150 L245,300 L80,300 L80,150" fill="none" stroke="#f97316" stroke-width="2" stroke-dasharray="6 4"/><polygon points="80,148 75,158 85,158" fill="#f97316"/>
<text x="162" y="320" fill="#f97316" font-size="13" text-anchor="middle">∂L/∂w = ∂L/∂z · x = (−0.11846, −0.23692)</text>
<text x="162" y="338" fill="#f97316" font-size="13" text-anchor="middle">∂L/∂b = ∂L/∂z = −0.11846</text>
<rect x="470" y="236" width="270" height="130" rx="8" fill="#1f2937"/>
<text x="484" y="260" fill="#e5e7eb" font-size="13">loss.backward() applies the chain rule</text>
<text x="484" y="280" fill="#e5e7eb" font-size="13">along the stored graph (orange).</text>
<text x="484" y="306" fill="#a3e635" font-size="13">w.grad accumulates: call zero_grad()</text>
<text x="484" y="326" fill="#a3e635" font-size="13">before each backward pass.</text>
<text x="484" y="352" fill="#e5e7eb" font-size="13">SGD step: w ← w − lr · w.grad</text>
</svg>