<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420">
<rect width="760" height="420" fill="#111827" rx="12"/>
<g font-family="Inter, Arial, sans-serif" fill="#e5e7eb" font-size="14">
<text x="380" y="28" text-anchor="middle" font-size="16" font-weight="bold">A result is only as good as the record of what produced it</text>
<rect x="20" y="60" width="200" height="66" rx="8" fill="none" stroke="#38bdf8" stroke-width="2"/>
<text x="120" y="88" text-anchor="middle">code revision</text><text x="120" y="110" text-anchor="middle" font-size="13">git rev-parse HEAD</text>
<line x1="220" y1="93" x2="300" y2="195" stroke="#e5e7eb" stroke-width="2"/>
<rect x="20" y="150" width="200" height="66" rx="8" fill="none" stroke="#38bdf8" stroke-width="2"/>
<text x="120" y="178" text-anchor="middle">config</text><text x="120" y="200" text-anchor="middle" font-size="13">hash of canonical JSON</text>
<line x1="220" y1="183" x2="300" y2="195" stroke="#e5e7eb" stroke-width="2"/>
<rect x="20" y="240" width="200" height="66" rx="8" fill="none" stroke="#38bdf8" stroke-width="2"/>
<text x="120" y="268" text-anchor="middle">data file</text><text x="120" y="290" text-anchor="middle" font-size="13">sha256 of the bytes</text>
<line x1="220" y1="273" x2="300" y2="195" stroke="#e5e7eb" stroke-width="2"/>
<rect x="300" y="150" width="140" height="90" rx="10" fill="none" stroke="#f97316" stroke-width="2"/>
<text x="370" y="190" text-anchor="middle">run</text><text x="370" y="212" text-anchor="middle" font-size="13">fixed seed</text>
<line x1="440" y1="195" x2="500" y2="195" stroke="#e5e7eb" stroke-width="2"/><polygon points="502,195 492,190 492,200" fill="#e5e7eb"/>
<rect x="504" y="60" width="236" height="250" rx="10" fill="none" stroke="#a3e635" stroke-width="2"/>
<text x="622" y="88" text-anchor="middle" fill="#a3e635">manifest.json</text>
<text x="524" y="122" font-size="13">result: 1.9744</text>
<text x="524" y="152" font-size="13">seed: 7</text>
<text x="524" y="182" font-size="13">code_rev: a1b2c3d</text>
<text x="524" y="212" font-size="13">config_sha: 63fac9eb...</text>
<text x="524" y="242" font-size="13">data_sha: 4bf0e630...</text>
<text x="622" y="290" text-anchor="middle" font-size="13">stored next to the result</text>
<rect x="20" y="340" width="720" height="56" rx="8" fill="none" stroke="#f97316" stroke-dasharray="6 4"/>
<text x="380" y="364" text-anchor="middle" fill="#f97316">verify later: recompute the three hashes; any mismatch tells you</text>
<text x="380" y="384" text-anchor="middle" fill="#f97316">whether code, config or data changed since the result was produced</text>
</g></svg>