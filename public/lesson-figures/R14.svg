<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" font-family="Inter, Arial, sans-serif">
<rect width="720" height="380" fill="#191b1f" rx="12"/>
<text x="24" y="30" fill="#e5e7eb" font-size="16" font-weight="bold">Two-finger grasp with friction cones</text>
<rect x="250" y="130" width="160" height="150" fill="#3b414d" stroke="#e5e7eb" stroke-width="2"/>
<text x="330" y="148" fill="#e5e7eb" font-size="13" text-anchor="middle">object</text>
<rect x="200" y="150" width="40" height="110" fill="#272a2f" stroke="#53b2dd" stroke-width="2"/>
<rect x="420" y="150" width="40" height="110" fill="#272a2f" stroke="#53b2dd" stroke-width="2"/>
<text x="220" y="285" fill="#53b2dd" font-size="13" text-anchor="middle">finger 1</text><text x="440" y="285" fill="#53b2dd" font-size="13" text-anchor="middle">finger 2</text>
<polygon points="250,205 330,120 330,290" fill="none"/>
<path d="M 250 205 L 330 150 L 330 260 Z" fill="#9ccd4e" fill-opacity="0.25" stroke="#9ccd4e" stroke-dasharray="4 3"/>
<path d="M 410 205 L 330 150 L 330 260 Z" fill="#9ccd4e" fill-opacity="0.25" stroke="#9ccd4e" stroke-dasharray="4 3"/>
<line x1="200" y1="205" x2="248" y2="205" stroke="#d97936" stroke-width="3"/><polygon points="240,199 252,205 240,211" fill="#d97936"/>
<line x1="460" y1="205" x2="412" y2="205" stroke="#d97936" stroke-width="3"/><polygon points="420,199 408,205 420,211" fill="#d97936"/>
<text x="190" y="200" fill="#d97936" font-size="13" text-anchor="end">N</text><text x="470" y="200" fill="#d97936" font-size="13">N</text>
<line x1="250" y1="205" x2="250" y2="150" stroke="#9ccd4e" stroke-width="3"/><line x1="410" y1="205" x2="410" y2="150" stroke="#9ccd4e" stroke-width="3"/>
<text x="245" y="146" fill="#9ccd4e" font-size="13" text-anchor="end">f1 &lt;= mu N</text><text x="415" y="146" fill="#9ccd4e" font-size="13">f2 &lt;= mu N</text>
<circle cx="350" cy="205" r="6" fill="#e5e7eb"/><line x1="350" y1="205" x2="350" y2="260" stroke="#e5e7eb" stroke-width="3"/><polygon points="344,254 356,254 350,266" fill="#e5e7eb"/>
<text x="330" y="304" fill="#e5e7eb" font-size="13" text-anchor="middle">W at the COM, offset d</text>
<line x1="330" y1="318" x2="350" y2="318" stroke="#e5e7eb"/><line x1="330" y1="312" x2="330" y2="324" stroke="#e5e7eb"/><line x1="350" y1="312" x2="350" y2="324" stroke="#e5e7eb"/><text x="340" y="337" fill="#e5e7eb" font-size="13" text-anchor="middle">d</text>
<line x1="250" y1="350" x2="330" y2="350" stroke="#e5e7eb"/><text x="290" y="368" fill="#e5e7eb" font-size="13" text-anchor="middle">a</text>
<line x1="330" y1="350" x2="410" y2="350" stroke="#e5e7eb"/><text x="370" y="368" fill="#e5e7eb" font-size="13" text-anchor="middle">a</text>
<text x="500" y="90" fill="#e5e7eb" font-size="14" font-weight="bold">Condition</text>
<text x="500" y="116" fill="#e5e7eb" font-size="13">f1 + f2 = W</text>
<text x="500" y="138" fill="#e5e7eb" font-size="13">f2 - f1 = W d / a</text>
<text x="500" y="160" fill="#9ccd4e" font-size="13">max |fi| = (W/2)(1 + d/a) &lt;= mu N</text>
<text x="500" y="196" fill="#d97936" font-size="13">N &gt;= W (1 + d/a) / (2 mu)</text>
<text x="500" y="232" fill="#e5e7eb" font-size="13">cone half-angle = atan(mu)</text>
<text x="500" y="254" fill="#e5e7eb" font-size="13">antipodal: contact line in both cones</text>
</svg>
