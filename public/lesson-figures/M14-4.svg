<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="Inter, sans-serif">
<title>Three bounds on one tail: fair coin, n = 100</title>
<desc>Log plot against t of the exact binomial tail probability, the Hoeffding bound and the Chebyshev bound for 100 fair coin tosses; Hoeffding is smaller than Chebyshev only for t above about 0.104.</desc>
<rect width="900" height="520" rx="14" fill="#17181b"/>

<text x="32" y="44" font-size="22" font-weight="bold" fill="#e9e7e3">Three bounds on one tail: fair coin, n = 100</text>
<rect x="32" y="72" width="564" height="424" rx="10" fill="#22252a"/>
<rect x="620" y="72" width="248" height="424" rx="10" fill="#22252a"/>
<text x="52" y="102" font-size="17" font-weight="bold" fill="#e9e7e3">P(|Ȳ − 0.5| ≥ t), n = 100</text>
<text x="640" y="102" font-size="17" font-weight="bold" fill="#e9e7e3">At t = 0.1</text>
<line x1="110" y1="150" x2="110.0" y2="440.0" stroke="#3d4148" stroke-width="1"/>
<text x="110" y="460" font-size="14" text-anchor="middle" fill="#a7adb5">0.05</text>
<line x1="253.3" y1="150" x2="253.3" y2="440.0" stroke="#3d4148" stroke-width="1"/>
<text x="253.3" y="460" font-size="14" text-anchor="middle" fill="#a7adb5">0.1</text>
<line x1="396.7" y1="150" x2="396.7" y2="440.0" stroke="#3d4148" stroke-width="1"/>
<text x="396.7" y="460" font-size="14" text-anchor="middle" fill="#a7adb5">0.15</text>
<line x1="540" y1="150" x2="540.0" y2="440.0" stroke="#3d4148" stroke-width="1"/>
<text x="540" y="460" font-size="14" text-anchor="middle" fill="#a7adb5">0.2</text>
<line x1="110" y1="150" x2="540.0" y2="150.0" stroke="#3d4148" stroke-width="1"/>
<text x="102" y="155" font-size="14" text-anchor="end" fill="#a7adb5">1</text>
<line x1="110" y1="208" x2="540.0" y2="208.0" stroke="#3d4148" stroke-width="1"/>
<text x="102" y="213" font-size="14" text-anchor="end" fill="#a7adb5">0.1</text>
<line x1="110" y1="266" x2="540.0" y2="266.0" stroke="#3d4148" stroke-width="1"/>
<text x="102" y="271" font-size="14" text-anchor="end" fill="#a7adb5">0.01</text>
<line x1="110" y1="324" x2="540.0" y2="324.0" stroke="#3d4148" stroke-width="1"/>
<text x="102" y="329" font-size="14" text-anchor="end" fill="#a7adb5">10⁻³</text>
<line x1="110" y1="382" x2="540.0" y2="382.0" stroke="#3d4148" stroke-width="1"/>
<text x="102" y="387" font-size="14" text-anchor="end" fill="#a7adb5">10⁻⁴</text>
<line x1="110" y1="440" x2="540.0" y2="440.0" stroke="#3d4148" stroke-width="1"/>
<text x="102" y="445" font-size="14" text-anchor="end" fill="#a7adb5">10⁻⁵</text>
<line x1="110" y1="440" x2="540.0" y2="440.0" stroke="#a7adb5" stroke-width="1.5"/>
<line x1="110" y1="150" x2="110.0" y2="440.0" stroke="#a7adb5" stroke-width="1.5"/>
<text x="540" y="482" font-size="15" text-anchor="end" fill="#e9e7e3">deviation t</text>
<text x="110" y="138" font-size="15" fill="#e9e7e3">probability</text>
