<circle cx="253.3" cy="222.2" r="5" fill="#6fc693"/>
<circle cx="253.3" cy="182.9" r="5" fill="#e0904f"/>
<circle cx="253.3" cy="184.9" r="5" fill="#86abe2"/>
<line x1="263.9" y1="440" x2="263.9" y2="190.5" stroke="#a7adb5" stroke-width="1.5" stroke-dasharray="4 4"/>
<text x="271.9" y="430" font-size="14" fill="#a7adb5">crossing at t ≈ 0.104</text>
<line x1="640" y1="134" x2="672.0" y2="134.0" stroke="#6fc693" stroke-width="3"/>
<text x="682" y="139" font-size="15" fill="#e9e7e3">exact binomial tail</text>
<line x1="640" y1="162" x2="672.0" y2="162.0" stroke="#e0904f" stroke-width="3"/>
<text x="682" y="167" font-size="15" fill="#e9e7e3">Hoeffding 2·exp(−2nt²)</text>
<line x1="640" y1="190" x2="672.0" y2="190.0" stroke="#86abe2" stroke-width="3" stroke-dasharray="7 5"/>
<text x="682" y="195" font-size="15" fill="#e9e7e3">Chebyshev 0.0025/t²</text>
<text x="640" y="262" font-size="15" font-weight="600" fill="#6fc693">exact 0.0569</text>
<text x="640" y="288" font-size="15" font-weight="600" fill="#e0904f">Hoeffding 0.2707</text>
<text x="640" y="314" font-size="15" font-weight="600" fill="#86abe2">Chebyshev 0.25</text>
<text x="640" y="372" font-size="14" fill="#a7adb5">Both bounds are far above</text>
<text x="640" y="392" font-size="14" fill="#a7adb5">the exact tail: they use only</text>
<text x="640" y="412" font-size="14" fill="#a7adb5">range or variance, not the shape.</text>
</svg>
