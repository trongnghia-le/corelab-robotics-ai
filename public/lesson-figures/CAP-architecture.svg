<text x="780.0" y="96.7" font-size="12" fill="#e5e7eb" text-anchor="middle" font-weight="bold">Task planner / BT</text>
<text x="780.0" y="111.7" font-size="12" fill="#e5e7eb" text-anchor="middle">retry, fallback</text>
