<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" font-family="Inter, Arial, sans-serif" role="img">
<title>CoreBot Tidy system architecture</title>
<desc>Five bands from physics at the bottom to the task layer on top: MuJoCo world, firmware in the loop, host estimation and perception, skills, task layer; a safety supervisor crosses all bands and an evaluation harness runs underneath.</desc>
