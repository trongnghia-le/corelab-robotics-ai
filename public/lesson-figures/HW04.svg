<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 450" font-family="Inter, Arial, sans-serif">
<title>Sensor family chart</title>
<desc>Sensors grouped by what they measure: own motion on the left (encoder, IMU, current sensing, limit switch) and the surroundings on the right (ultrasonic, time-of-flight, LiDAR, camera, load cell), each with its interface and typical failure.</desc>
<rect width="760" height="450" fill="#191b1f" rx="12"/>
<text x="380" y="26" font-size="16" fill="#e5e7eb" text-anchor="middle" font-weight="bold">Sensor family chart: what does it measure, how do I read it, how does it fail</text>
<text x="195" y="56" font-size="14" fill="#53b2dd" text-anchor="middle" font-weight="bold">Own motion (proprioceptive)</text>
<text x="565" y="56" font-size="14" fill="#9ccd4e" text-anchor="middle" font-weight="bold">The world (exteroceptive)</text>
<rect x="20" y="70" width="350" height="58" rx="8" fill="#272a2f" stroke="#53b2dd" stroke-width="2"/>
<text x="195.0" y="87.0" font-size="11" fill="#e5e7eb" text-anchor="middle" font-weight="bold">Encoder</text>
<text x="195.0" y="103.0" font-size="11" fill="#e5e7eb" text-anchor="middle">wheel or joint turn, as counts | A/B pulses, x4 decode</text>
<text x="195.0" y="119.0" font-size="11" fill="#e5e7eb" text-anchor="middle">fails: missed counts, slip downstream</text>
<rect x="20" y="136" width="350" height="58" rx="8" fill="#272a2f" stroke="#53b2dd" stroke-width="2"/>
<text x="195.0" y="153.0" font-size="11" fill="#e5e7eb" text-anchor="middle" font-weight="bold">IMU (accel, gyro, mag)</text>
<text x="195.0" y="169.0" font-size="11" fill="#e5e7eb" text-anchor="middle">rotation rate, acceleration | I2C or SPI, 16-bit raw</text>
<text x="195.0" y="185.0" font-size="11" fill="#e5e7eb" text-anchor="middle">fails: gyro drift, vibration noise</text>
<rect x="20" y="202" width="350" height="58" rx="8" fill="#272a2f" stroke="#53b2dd" stroke-width="2"/>
<text x="195.0" y="219.0" font-size="11" fill="#e5e7eb" text-anchor="middle" font-weight="bold">Current / voltage sense</text>
<text x="195.0" y="235.0" font-size="11" fill="#e5e7eb" text-anchor="middle">motor current, battery volts | shunt + amplifier to ADC</text>
<text x="195.0" y="251.0" font-size="11" fill="#e5e7eb" text-anchor="middle">fails: offset, wrong gain</text>
<rect x="20" y="268" width="350" height="58" rx="8" fill="#272a2f" stroke="#53b2dd" stroke-width="2"/>
<text x="195.0" y="285.0" font-size="11" fill="#e5e7eb" text-anchor="middle" font-weight="bold">Limit / bumper switch</text>
<text x="195.0" y="301.0" font-size="11" fill="#e5e7eb" text-anchor="middle">contact, end of travel | digital input, debounce</text>
<text x="195.0" y="317.0" font-size="11" fill="#e5e7eb" text-anchor="middle">fails: bounce, wire break if NO</text>
<rect x="390" y="70" width="350" height="58" rx="8" fill="#272a2f" stroke="#9ccd4e" stroke-width="2"/>
<text x="565.0" y="87.0" font-size="11" fill="#e5e7eb" text-anchor="middle" font-weight="bold">Ultrasonic (HC-SR04)</text>
<text x="565.0" y="103.0" font-size="11" fill="#e5e7eb" text-anchor="middle">distance 2 to 400 cm, 15 deg cone | trigger pulse, echo width</text>
<text x="565.0" y="119.0" font-size="11" fill="#e5e7eb" text-anchor="middle">fails: soft or angled surfaces</text>
<rect x="390" y="136" width="350" height="58" rx="8" fill="#272a2f" stroke="#9ccd4e" stroke-width="2"/>
<text x="565.0" y="153.0" font-size="11" fill="#e5e7eb" text-anchor="middle" font-weight="bold">Time-of-flight IR</text>
<text x="565.0" y="169.0" font-size="11" fill="#e5e7eb" text-anchor="middle">distance by light delay | I2C, short range</text>
<text x="565.0" y="185.0" font-size="11" fill="#e5e7eb" text-anchor="middle">fails: sunlight, dark surfaces</text>
<rect x="390" y="202" width="350" height="58" rx="8" fill="#272a2f" stroke="#9ccd4e" stroke-width="2"/>
<text x="565.0" y="219.0" font-size="11" fill="#e5e7eb" text-anchor="middle" font-weight="bold">2D LiDAR</text>
<text x="565.0" y="235.0" font-size="11" fill="#e5e7eb" text-anchor="middle">ranges around the robot | UART or USB scan</text>
<text x="565.0" y="251.0" font-size="11" fill="#e5e7eb" text-anchor="middle">fails: glass, black, mirrors</text>
<rect x="390" y="268" width="350" height="58" rx="8" fill="#272a2f" stroke="#9ccd4e" stroke-width="2"/>
<text x="565.0" y="285.0" font-size="11" fill="#e5e7eb" text-anchor="middle" font-weight="bold">RGB / depth camera</text>
<text x="565.0" y="301.0" font-size="11" fill="#e5e7eb" text-anchor="middle">image, depth per pixel | USB or CSI</text>
<text x="565.0" y="317.0" font-size="11" fill="#e5e7eb" text-anchor="middle">fails: light, no texture (V03, V04)</text>
<rect x="390" y="334" width="350" height="58" rx="8" fill="#272a2f" stroke="#9ccd4e" stroke-width="2"/>
<text x="565.0" y="351.0" font-size="11" fill="#e5e7eb" text-anchor="middle" font-weight="bold">Load cell + HX711</text>
<text x="565.0" y="367.0" font-size="11" fill="#e5e7eb" text-anchor="middle">force or weight | 2-wire serial, 24-bit</text>
<text x="565.0" y="383.0" font-size="11" fill="#e5e7eb" text-anchor="middle">fails: creep, temperature drift</text>
<text x="195" y="388" font-size="12" fill="#d97936" text-anchor="middle">Fused with a filter in C08</text>
<line x1="195" y1="330" x2="195" y2="372" stroke="#d97936" stroke-width="2" stroke-dasharray="5 4"/>
<text x="380" y="432" font-size="11" fill="#e5e7eb" text-anchor="middle">Read the datasheet for range, rate, field of view, interface and the error you can expect, not just the headline range</text>
</svg>
