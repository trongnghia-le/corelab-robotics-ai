<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" font-family="Inter, Arial, sans-serif">
<rect width="760" height="340" fill="#111827" rx="12"/>
<text x="20" y="34" fill="#e5e7eb" font-size="16" font-weight="bold">Slots compete for features</text>
<text x="400" y="34" fill="#e5e7eb" font-size="16" font-weight="bold">Crossing tracks, x vs time</text>
<g fill="none" stroke-width="2">
<rect x="20" y="70" width="70" height="30" rx="5" stroke="#38bdf8"/><rect x="20" y="130" width="70" height="30" rx="5" stroke="#38bdf8"/><rect x="20" y="190" width="70" height="30" rx="5" stroke="#38bdf8"/>
<rect x="240" y="95" width="80" height="40" rx="8" stroke="#f97316"/><rect x="240" y="165" width="80" height="40" rx="8" stroke="#a3e635"/>
<path d="M90 85 L240 110" stroke="#f97316" stroke-width="4"/><path d="M90 85 L240 180" stroke="#a3e635" stroke-width="1"/>
<path d="M90 145 L240 120" stroke="#f97316" stroke-width="1.5"/><path d="M90 145 L240 185" stroke="#a3e635" stroke-width="2"/>
<path d="M90 205 L240 125" stroke="#f97316" stroke-width="2.5"/><path d="M90 205 L240 195" stroke="#a3e635" stroke-width="2.5"/>
</g>
<text x="25" y="62" fill="#e5e7eb" font-size="13">features x_i</text>
<text x="255" y="120" fill="#e5e7eb" font-size="14">slot 1</text><text x="255" y="190" fill="#e5e7eb" font-size="14">slot 2</text>
<text x="30" y="90" fill="#e5e7eb" font-size="13">x1</text><text x="30" y="150" fill="#e5e7eb" font-size="13">x2</text><text x="30" y="210" fill="#e5e7eb" font-size="13">x3</text>
<text x="20" y="260" fill="#e5e7eb" font-size="13">softmax over slots per feature;</text>
<text x="20" y="280" fill="#e5e7eb" font-size="13">line thickness = attention A_ij (x3 splits 50/50)</text>
<text x="20" y="310" fill="#a3e635" font-size="13">then weighted mean over inputs</text>
<line x1="410" y1="290" x2="740" y2="290" stroke="#e5e7eb"/><line x1="410" y1="290" x2="410" y2="60" stroke="#e5e7eb"/>
<text x="540" y="318" fill="#e5e7eb" font-size="13">time t</text><text x="418" y="72" fill="#e5e7eb" font-size="13">position x</text>
<path d="M415 270 L730 90" stroke="#38bdf8" stroke-width="3"/>
<path d="M415 90 L730 270" stroke="#f97316" stroke-width="3"/>
<path d="M570 180 L610 180" stroke="#111827" stroke-width="12"/>
<rect x="545" y="150" width="90" height="60" fill="none" stroke="#e5e7eb" stroke-dasharray="4 4"/>
<text x="548" y="145" fill="#e5e7eb" font-size="13">occluded</text>
<path d="M415 270 L560 187 C600 180 610 180 640 148 L730 90" stroke="#a3e635" stroke-width="2" stroke-dasharray="3 5" fill="none" opacity="0.0"/>
<text x="430" y="255" fill="#38bdf8" font-size="13">A</text><text x="430" y="115" fill="#f97316" font-size="13">B</text>
<text x="625" y="120" fill="#a3e635" font-size="13">velocity: keeps A</text><text x="585" y="276" fill="#f97316" font-size="13">nearest: swaps</text>
</svg>
