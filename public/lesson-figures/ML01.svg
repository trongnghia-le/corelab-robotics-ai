<g fill="#e5e7eb" text-anchor="middle">
<text x="360" y="30" font-size="15" font-weight="bold">Split first (by robot, part or time), then fit anything</text>
<text x="360" y="76">all data, grouped by physical robot or part</text>
<text x="125" y="166">Train 60%</text><text x="125" y="188" font-size="13">fit scaler and model</text>
<text x="360" y="166">Validation 20%</text><text x="360" y="188" font-size="13">choose model, threshold, lr</text>
<text x="595" y="166">Test 20%</text><text x="595" y="188" font-size="13">report once, at the end</text>
<text x="360" y="296" fill="#a3e635">Preprocessing statistics come from Train only and are reused unchanged</text>
<text x="360" y="320" fill="#f97316">Test information must never reach fitting or selection</text>
</g>
