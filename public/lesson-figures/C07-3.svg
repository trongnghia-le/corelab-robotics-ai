<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="Inter, sans-serif">
<title>NIS over time: a correct filter against two mistuned ones</title>
<desc>Moving mean over 20 steps of the normalised innovation squared for three constant-velocity filters fed the same simulated data. The correct filter stays near 1, inside the 95 percent band 0.48 to 1.71. The filter with R ten times too small averages 6.46 in this run (long run 7.93), and the filter with process noise 100 times too small averages 5.12 (long run 5.16).</desc>
