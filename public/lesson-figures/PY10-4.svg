<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" font-family="Inter, sans-serif">
<title>Lazy sliding mean of seven readings</title>
<desc>A grid of five windows of three over the readings 12, 15, 11, 18, 14, 16, 13 with the means 12.667, 14.667, 14.333, 16.000 and 14.333 and the pull counts 3, 4, 5, 6 and 7.</desc>
<rect width="900" height="460" rx="14" fill="#17181b"/>

<text x="32" y="44" font-size="22" font-weight="bold" fill="#e9e7e3">Case 2: the window moves, the source is pulled once per output</text>
