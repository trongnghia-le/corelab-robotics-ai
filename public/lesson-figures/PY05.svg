<text x="484" y="96" fill="#e5e7eb" font-size="14" font-weight="bold">Workflow</text>
<text x="484" y="122" fill="#e5e7eb" font-size="13">1. model: ω' = (K·u − ω)/τ</text>
<text x="484" y="144" fill="#e5e7eb" font-size="13">2. simulate: solve_ivp</text>
<text x="484" y="166" fill="#e5e7eb" font-size="13">3. fit: least_squares, bounds</text>
<text x="484" y="188" fill="#e5e7eb" font-size="13">4. residuals with units</text>
<text x="484" y="210" fill="#e5e7eb" font-size="13">5. uncertainty from Jacobian</text>
<text x="484" y="242" fill="#38bdf8" font-size="13">blue: fitted model</text>
<text x="484" y="262" fill="#f97316" font-size="13">orange: measurements</text>
<text x="484" y="282" fill="#a3e635" font-size="13">green: residuals y − model</text>
<text x="484" y="318" fill="#e5e7eb" font-size="13">Fit: τ = 0.498 ± 0.009 s</text>
<text x="484" y="340" fill="#e5e7eb" font-size="13">K = 1.992 ± 0.008 rad/s/V</text>
<text x="484" y="368" fill="#a3e635" font-size="13">Random scatter, no trend:</text>
<text x="484" y="388" fill="#a3e635" font-size="13">the model is adequate.</text>
