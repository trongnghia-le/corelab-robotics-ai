<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="Inter, sans-serif">
<title>Relative error of the Gram identity against distance</title>
<desc>Log-log plot of the relative error of the squared distance against the true distance. The Gram identity follows 4uM squared over d squared, reaches 1 near 1.1e-5 metres, and the centred computation stays below 2e-13.</desc>
<rect width="900" height="560" rx="14" fill="#17181b"/>

<text x="32" y="44" font-size="22" font-weight="bold" fill="#e9e7e3">Case 2: the Gram identity loses digits as d shrinks</text>
<rect x="32" y="72" width="836" height="456" rx="10" fill="#22252a"/>
<line x1="52" y1="107" x2="86.0" y2="107.0" stroke="#e0904f" stroke-width="2.5" stroke-dasharray="8 5"/>
<text x="96" y="112" font-size="15" fill="#e9e7e3">bound 4uM^2 / d^2 (M^2 = 2.7e5 m^2)</text>
<circle cx="69.0" cy="131.0" r="5" fill="#86abe2"/>
<text x="96" y="136" font-size="15" fill="#e9e7e3">Gram form, tight cloud (largest error per bin)</text>
<polygon points="69,148 75,155 69,162 63,155" fill="#e0c169"/>
<text x="96" y="160" font-size="15" fill="#e9e7e3">Gram form, two points (median of 40)</text>
<circle cx="69.0" cy="179.0" r="5" fill="#6fc693"/>
<text x="96" y="184" font-size="15" fill="#e9e7e3">after subtracting the centroid</text>
