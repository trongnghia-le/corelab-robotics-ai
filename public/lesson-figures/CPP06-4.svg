<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="Inter, sans-serif">
<title>Worked case 2: naive variance against Welford</title>
<desc>Left: number line near 4.00000008e18 with doubles 512 apart; q = 4000000080000000490 is stored as ...000, n*mean^2 = ...400 as ...512, so the difference is -512 instead of 90. Right: Welford M_n = 0, 4.5, 42, 90 for n = 1 to 4, giving variance 30.</desc>
<defs><marker id="b4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a7adb5"/></marker></defs>
<rect width="900" height="500" rx="14" fill="#17181b"/>
<text x="32" y="44" font-size="22" font-weight="bold" fill="#e9e7e3">Worked case 2: naive variance against Welford</text>
<rect x="32" y="64" width="540" height="404" rx="10" fill="#22252a"/>
<rect x="596" y="64" width="272" height="404" rx="10" fill="#22252a"/>
<text x="52" y="96" font-size="17" font-weight="bold" fill="#e9e7e3">Naive: q − n·x̄², zoomed in</text>
<text x="52" y="118" font-size="14" fill="#a7adb5">offset from 4 000 000 080 000 000 000</text>
<line x1="84" y1="250" x2="532" y2="250" stroke="#a7adb5" stroke-width="2"/>
<line x1="122" y1="242" x2="122" y2="258" stroke="#a7adb5" stroke-width="2"/>
<text x="122" y="278" font-size="14" text-anchor="middle" fill="#a7adb5">0</text>
<line x1="450" y1="242" x2="450" y2="258" stroke="#a7adb5" stroke-width="2"/>
<text x="450" y="278" font-size="14" text-anchor="middle" fill="#a7adb5">512</text>
<text x="552" y="146" font-size="14" text-anchor="end" fill="#a7adb5">doubles here are 512 apart</text>
<circle cx="436" cy="200" r="6" fill="#17181b" stroke="#86abe2" stroke-width="2"/>
<circle cx="122" cy="250" r="6" fill="#86abe2"/>
<line x1="428" y1="204" x2="130" y2="244" stroke="#86abe2" stroke-width="2" marker-end="url(#b4)"/>
<text x="448" y="188" font-size="15" fill="#86abe2">q exact: 490</text>
<text x="92" y="304" font-size="15" font-weight="600" fill="#86abe2">q stored: 0</text>
<circle cx="378" cy="310" r="6" fill="#17181b" stroke="#e0904f" stroke-width="2"/>
<circle cx="450" cy="250" r="6" fill="#e0904f"/>
<line x1="382" y1="304" x2="446" y2="258" stroke="#e0904f" stroke-width="2" marker-end="url(#b4)"/>
<text x="466" y="238" font-size="15" font-weight="600" fill="#e0904f">n·x̄² stored: 512</text>
<text x="364" y="316" font-size="15" text-anchor="end" fill="#e0904f">exact: 400</text>
<rect x="52" y="360" width="500" height="88" rx="8" fill="#17181b" stroke="#3d4148" stroke-width="2"/>
<text x="68" y="388" font-size="15" fill="#e9e7e3">stored difference  0 − 512 = −512,   exact  490 − 400 = 90</text>
<text x="68" y="416" font-size="15" font-weight="600" fill="#e58a80">÷ (n − 1) = 3:   −170.67  instead of  30</text>
<text x="68" y="440" font-size="14" fill="#a7adb5">q ≈ 4.00000008·10¹⁸ lies in [2⁶¹, 2⁶²): spacing 2⁹ = 512</text>
<text x="616" y="96" font-size="17" font-weight="bold" fill="#e9e7e3">Welford: M_n</text>
<text x="616" y="118" font-size="14" fill="#a7adb5">n = 1..4 → s² = M₄ / 3</text>
<text x="616" y="162" font-size="15" fill="#e9e7e3">n = 1</text>
<rect x="680" y="144" width="3" height="26" rx="3" fill="#6cc6ba"/>
<text x="691" y="163" font-size="15" fill="#e9e7e3">0</text>
<text x="616" y="214" font-size="15" fill="#e9e7e3">n = 2</text>
<rect x="680" y="196" width="7" height="26" rx="3" fill="#6cc6ba"/>
<text x="695" y="215" font-size="15" fill="#e9e7e3">4.5</text>
<text x="616" y="266" font-size="15" fill="#e9e7e3">n = 3</text>
<rect x="680" y="248" width="67" height="26" rx="3" fill="#6cc6ba"/>
<text x="739" y="267" font-size="15" font-weight="600" text-anchor="end" fill="#17181b">42</text>
<text x="616" y="318" font-size="15" fill="#e9e7e3">n = 4</text>
<rect x="680" y="300" width="144" height="26" rx="3" fill="#6cc6ba"/>
<text x="816" y="319" font-size="15" font-weight="600" text-anchor="end" fill="#17181b">90</text>
<rect x="616" y="356" width="232" height="92" rx="8" fill="#17181b" stroke="#6fc693" stroke-width="2"/>
<text x="632" y="386" font-size="15" font-weight="600" fill="#6fc693">s² = 90 / 3 = 30</text>
<text x="632" y="412" font-size="14" fill="#a7adb5">every term δ(x − x̄) is</text>
<text x="632" y="432" font-size="14" fill="#a7adb5">a product of small numbers</text>
</svg>
