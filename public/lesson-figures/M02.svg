<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 510" font-family="Inter, sans-serif">
<title>A vector is a displacement</title>
<desc>Two displacements a=(2,1) and b=(-1,3) add tip to tail to a+b=(1,4), whose length 4.123 is shorter than the path length 5.398.</desc>
<defs><marker id="M02arr6fc693" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 z" fill="#6fc693"/></marker><marker id="M02arr86abe2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 z" fill="#86abe2"/></marker><marker id="M02arre0904f" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 z" fill="#e0904f"/></marker></defs>
<rect width="900" height="510" rx="14" fill="#17181b"/>
<text x="32" y="44" font-size="22" fill="#e9e7e3" text-anchor="start" font-weight="bold">A vector is a displacement</text>
<rect x="32" y="70" width="424" height="420" rx="10" fill="#22252a"/>
<text x="52" y="100" font-size="17" fill="#a7adb5" text-anchor="start" font-weight="bold">Tip to tail</text>
<line x1="92.0" y1="426.0" x2="92.0" y2="432.0" stroke="#a7adb5" stroke-width="2" stroke-linecap="round"/>
<text x="92" y="446" font-size="14" fill="#a7adb5" text-anchor="middle" font-weight="normal">−2</text>
<line x1="140.0" y1="426.0" x2="140.0" y2="432.0" stroke="#a7adb5" stroke-width="2" stroke-linecap="round"/>
<text x="140" y="446" font-size="14" fill="#a7adb5" text-anchor="middle" font-weight="normal">−1</text>
<line x1="188.0" y1="426.0" x2="188.0" y2="432.0" stroke="#a7adb5" stroke-width="2" stroke-linecap="round"/>
<text x="188" y="446" font-size="14" fill="#a7adb5" text-anchor="middle" font-weight="normal">0</text>
<line x1="236.0" y1="426.0" x2="236.0" y2="432.0" stroke="#a7adb5" stroke-width="2" stroke-linecap="round"/>
<text x="236" y="446" font-size="14" fill="#a7adb5" text-anchor="middle" font-weight="normal">1</text>
<line x1="284.0" y1="426.0" x2="284.0" y2="432.0" stroke="#a7adb5" stroke-width="2" stroke-linecap="round"/>
<text x="284" y="446" font-size="14" fill="#a7adb5" text-anchor="middle" font-weight="normal">2</text>
<line x1="332.0" y1="426.0" x2="332.0" y2="432.0" stroke="#a7adb5" stroke-width="2" stroke-linecap="round"/>
<text x="332" y="446" font-size="14" fill="#a7adb5" text-anchor="middle" font-weight="normal">3</text>
<line x1="380.0" y1="426.0" x2="380.0" y2="432.0" stroke="#a7adb5" stroke-width="2" stroke-linecap="round"/>
<text x="380" y="446" font-size="14" fill="#a7adb5" text-anchor="middle" font-weight="normal">4</text>
<line x1="86.0" y1="378.0" x2="92.0" y2="378.0" stroke="#a7adb5" stroke-width="2" stroke-linecap="round"/>
<text x="82" y="383" font-size="14" fill="#a7adb5" text-anchor="end" font-weight="normal">0</text>
<line x1="86.0" y1="330.0" x2="92.0" y2="330.0" stroke="#a7adb5" stroke-width="2" stroke-linecap="round"/>
<text x="82" y="335" font-size="14" fill="#a7adb5" text-anchor="end" font-weight="normal">1</text>
<line x1="86.0" y1="282.0" x2="92.0" y2="282.0" stroke="#a7adb5" stroke-width="2" stroke-linecap="round"/>
<text x="82" y="287" font-size="14" fill="#a7adb5" text-anchor="end" font-weight="normal">2</text>
<line x1="86.0" y1="234.0" x2="92.0" y2="234.0" stroke="#a7adb5" stroke-width="2" stroke-linecap="round"/>
<text x="82" y="239" font-size="14" fill="#a7adb5" text-anchor="end" font-weight="normal">3</text>
<line x1="86.0" y1="186.0" x2="92.0" y2="186.0" stroke="#a7adb5" stroke-width="2" stroke-linecap="round"/>
<text x="82" y="191" font-size="14" fill="#a7adb5" text-anchor="end" font-weight="normal">4</text>
<line x1="86.0" y1="138.0" x2="92.0" y2="138.0" stroke="#a7adb5" stroke-width="2" stroke-linecap="round"/>
<text x="82" y="143" font-size="14" fill="#a7adb5" text-anchor="end" font-weight="normal">5</text>
<line x1="92.0" y1="426.0" x2="380.0" y2="426.0" stroke="#a7adb5" stroke-width="2" stroke-linecap="round"/>
<line x1="92.0" y1="138.0" x2="92.0" y2="426.0" stroke="#a7adb5" stroke-width="2" stroke-linecap="round"/>
<text x="380" y="468" font-size="15" fill="#a7adb5" text-anchor="end" font-weight="normal">x (m)</text>
<text x="92" y="126" font-size="15" fill="#a7adb5" text-anchor="start" font-weight="normal">y (m)</text>
<line x1="188.0" y1="378.0" x2="140.0" y2="234.0" stroke="#e0904f" stroke-width="2" stroke-linecap="round" stroke-dasharray="7 6" marker-end="url(#M02arre0904f)"/>
<line x1="140.0" y1="234.0" x2="236.0" y2="186.0" stroke="#86abe2" stroke-width="2" stroke-linecap="round" stroke-dasharray="7 6" marker-end="url(#M02arr86abe2)"/>
<line x1="188.0" y1="378.0" x2="284.0" y2="330.0" stroke="#86abe2" stroke-width="3" stroke-linecap="round" marker-end="url(#M02arr86abe2)"/>
<line x1="284.0" y1="330.0" x2="236.0" y2="186.0" stroke="#e0904f" stroke-width="3" stroke-linecap="round" marker-end="url(#M02arre0904f)"/>
<line x1="188.0" y1="378.0" x2="236.0" y2="186.0" stroke="#6fc693" stroke-width="3.5" stroke-linecap="round" marker-end="url(#M02arr6fc693)"/>
<circle cx="188.0" cy="378.0" r="6" fill="#e9e7e3"/>
<text x="240" y="384" font-size="15" fill="#86abe2" text-anchor="start" font-weight="600">a = (2, 1)</text>
<text x="274" y="263" font-size="15" fill="#e0904f" text-anchor="start" font-weight="600">b = (−1, 3)</text>
<text x="246" y="162" font-size="15" fill="#6fc693" text-anchor="start" font-weight="600">a + b = (1, 4)</text>
<text x="114" y="143" font-size="14" fill="#a7adb5" text-anchor="start" font-weight="normal">other order,</text>
<text x="114" y="162" font-size="14" fill="#a7adb5" text-anchor="start" font-weight="normal">same tip</text>
<rect x="480" y="70" width="388" height="420" rx="10" fill="#22252a"/>
<text x="500" y="100" font-size="17" fill="#a7adb5" text-anchor="start" font-weight="bold">Straight line vs path driven</text>
<text x="500" y="140" font-size="15" fill="#e9e7e3" text-anchor="start" font-weight="600">‖a‖ = 2.236 m</text>
<rect x="500" y="152" width="134" height="16" rx="3" fill="#86abe2"/>
<text x="500" y="206" font-size="15" fill="#e9e7e3" text-anchor="start" font-weight="600">‖b‖ = 3.162 m</text>
<rect x="500" y="218" width="190" height="16" rx="3" fill="#e0904f"/>
<text x="500" y="272" font-size="15" fill="#e9e7e3" text-anchor="start" font-weight="600">path driven: ‖a‖ + ‖b‖ = 5.398 m</text>
<rect x="500" y="284" width="134" height="16" rx="3" fill="#86abe2"/>
<rect x="634" y="284" width="190" height="16" rx="3" fill="#e0904f"/>
<text x="500" y="338" font-size="15" fill="#e9e7e3" text-anchor="start" font-weight="600">straight line: ‖a + b‖ = 4.123 m</text>
<rect x="500" y="350" width="247" height="16" rx="3" fill="#6fc693"/>
<text x="500" y="420" font-size="14" fill="#a7adb5" text-anchor="start" font-weight="normal">Bars share one scale. ‖a+b‖ ≤ ‖a‖ + ‖b‖,</text>
<text x="500" y="442" font-size="14" fill="#a7adb5" text-anchor="start" font-weight="normal">equal only if a and b point the same way.</text>
</svg>
