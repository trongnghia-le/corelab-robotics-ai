<text x="312" y="140" fill="#9ccd4e" font-size="13" text-anchor="start">u (drive)</text>
<line x1="120" y1="168" x2="60" y2="168" stroke="#d97936" stroke-width="3" marker-end="url(#ao)"/>
<text x="34" y="140" fill="#d97936" font-size="13" text-anchor="start">c v (drag)</text>
