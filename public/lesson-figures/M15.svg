<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" font-family="Inter, sans-serif">
<title>The group is curved, its tangent space is flat</title>
<desc>A circle stands for the curved group with a straight tangent line at the identity I. Vectors a and b on the line are wrapped by exp onto points of the circle. A panel lists Rodrigues formula, the composition rule and the adjoint rule.</desc>
<defs><marker id="ahm15a86abe2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#86abe2"/></marker><marker id="ahm15ae0904f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e0904f"/></marker></defs>
<rect width="900" height="480" rx="14" fill="#17181b"/>
<text x="32" y="44" font-size="22" font-weight="bold" fill="#e9e7e3">The group is curved, its tangent space is flat</text>
<rect x="32" y="72" width="500" height="376" rx="10" fill="#22252a"/>
<rect x="556" y="72" width="312" height="376" rx="10" fill="#22252a"/>
