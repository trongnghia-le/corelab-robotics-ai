<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" font-family="Inter, Arial, sans-serif">
<rect width="720" height="400" fill="#111827" rx="12"/>
<text x="360" y="28" fill="#e5e7eb" font-size="18" font-weight="bold" text-anchor="middle">Lie group and its tangent space at the identity</text>
<line x1="40" y1="190" x2="470" y2="190" stroke="#a3e635" stroke-width="2.5"/>
<text x="44" y="180" fill="#a3e635" font-size="14">tangent space: Lie algebra so(3), vectors ω ∈ R³</text>
<path d="M116.6,258.4 L124.2,252.0 L132.1,245.9 L140.3,240.0 L148.6,234.5 L157.1,229.2 L165.8,224.3 L174.6,219.6 L183.6,215.3 L192.8,211.3 L202.1,207.7 L211.5,204.3 L221.1,201.4 L230.7,198.7 L240.5,196.4 L250.3,194.5 L260.1,192.9 L270.1,191.6 L280.0,190.7 L290.0,190.2 L300.0,190.0 L310.0,190.2 L320.0,190.7 L329.9,191.6 L339.9,192.9 L349.7,194.5 L359.5,196.4 L369.3,198.7 L378.9,201.4 L388.5,204.3 L397.9,207.7 L407.2,211.3 L416.4,215.3 L425.4,219.6 L434.2,224.3 L442.9,229.2 L451.4,234.5 L459.7,240.0" fill="none" stroke="#38bdf8" stroke-width="3"/>
<text x="40" y="375" fill="#38bdf8" font-size="14">group SO(3): rotation matrices R</text>
<circle cx="300" cy="190" r="6" fill="#e5e7eb"/>
<text x="310" y="212" fill="#e5e7eb" font-size="14">I (identity)</text>
<line x1="160" y1="190" x2="165.8" y2="224.3" stroke="#f97316" stroke-width="2" stroke-dasharray="5 4"/>
<circle cx="160" cy="190" r="5" fill="#f97316"/><circle cx="165.8" cy="224.3" r="5" fill="#f97316"/>
<text x="160" y="166" fill="#f97316" font-size="14" text-anchor="middle">a</text>
<text x="155.8" y="246.3" fill="#f97316" font-size="14" text-anchor="end">exp(a)</text>
<line x1="400" y1="190" x2="397.9" y2="207.7" stroke="#f97316" stroke-width="2" stroke-dasharray="5 4"/>
<circle cx="400" cy="190" r="5" fill="#f97316"/><circle cx="397.9" cy="207.7" r="5" fill="#f97316"/>
<text x="400" y="166" fill="#f97316" font-size="14" text-anchor="middle">b</text>
<text x="398" y="242" fill="#f97316" font-size="14" text-anchor="end">exp(b)</text>
<text x="260" y="340" fill="#f97316" font-size="14" text-anchor="middle">exp bends the straight tangent line onto the group</text>
<rect x="480" y="150" width="220" height="226" rx="8" fill="#1f2937"/>
<text x="494" y="176" fill="#e5e7eb" font-size="14" font-weight="bold">Key facts</text>
<text x="494" y="202" fill="#e5e7eb" font-size="13">exp(ω) = I + sinθ/θ [ω]× +</text>
<text x="494" y="220" fill="#e5e7eb" font-size="13">(1−cosθ)/θ² [ω]×², θ = ‖ω‖</text>
<text x="494" y="248" fill="#a3e635" font-size="13">small ω: exp(ω) ≈ I + [ω]×</text>
<text x="494" y="276" fill="#f97316" font-size="13">exp(a)·exp(b) ≠ exp(a + b):</text>
<text x="494" y="294" fill="#f97316" font-size="13">≈ exp(a + b + ½ a×b)</text>
<text x="494" y="322" fill="#38bdf8" font-size="13">tangent vectors add;</text>
<text x="494" y="340" fill="#38bdf8" font-size="13">rotations compose (no commute)</text>
<text x="494" y="364" fill="#e5e7eb" font-size="13">log = inverse of exp</text>
</svg>