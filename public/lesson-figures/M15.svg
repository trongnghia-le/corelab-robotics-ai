<polyline points="282.0,327.0 279.7,327.0 277.3,326.9 275.0,326.8 272.7,326.6 270.4,326.4 268.0,326.1 265.7,325.7 263.4,325.3 261.1,324.9 258.9,324.4 256.6,323.9 254.3,323.3 252.1,322.6 249.9,322.0 247.6,321.2 245.4,320.4 243.3,319.6 241.1,318.7 239.0,317.8 236.9,316.8 234.8,315.8 232.7,314.7 230.6,313.6 228.6,312.4 226.6,311.2 224.7,310.0 222.7,308.7 220.8,307.3 218.9,305.9 217.1,304.5" fill="none" stroke="#86abe2" stroke-width="3.5" stroke-linejoin="round"/>
