<circle cx="217.1" cy="304.5" r="6" fill="#86abe2"/>
<text x="282" y="357" font-size="15" text-anchor="middle" fill="#e9e7e3">I (identity)</text>
<text x="387" y="355" font-size="15" font-weight="600" text-anchor="middle" fill="#e0904f">a</text>
<text x="212" y="355" font-size="15" font-weight="600" text-anchor="middle" fill="#86abe2">b</text>
<text x="384.354" y="274.732" font-size="15" font-weight="600" fill="#e0904f">exp(a)</text>
<text x="203.071" y="300.518" font-size="15" font-weight="600" text-anchor="end" fill="#86abe2">exp(b)</text>
<text x="282" y="226" font-size="15" text-anchor="middle" fill="#a7adb5">group G (curved)</text>
<text x="48" y="387" font-size="14" fill="#a7adb5">tangent space at I (flat, vectors add)</text>
<text x="48" y="411" font-size="14" fill="#a7adb5">Schematic: SO(3) has 3 dimensions, a circle has 1.</text>
<text x="386.354" y="304.732" font-size="14" fill="#a7adb5">exp wraps</text>
<text x="580" y="104" font-size="17" font-weight="bold" fill="#e9e7e3">Key facts</text>
<text x="580" y="140" font-size="15" fill="#e9e7e3">exp(ω) = I + (sin θ/θ)[ω]×</text>
<text x="580" y="174" font-size="15" fill="#e9e7e3">        + ((1−cos θ)/θ²)[ω]×²</text>
<text x="580" y="208" font-size="15" fill="#e9e7e3">θ = ‖ω‖, axis = ω/θ</text>
<text x="580" y="242" font-size="15" fill="#e9e7e3">exp(a)exp(b) ≈ exp(a+b+½ a×b)</text>
<text x="580" y="276" font-size="15" fill="#a7adb5">using a+b alone: error O(ε²)</text>
<text x="580" y="310" font-size="15" fill="#e9e7e3">R exp(δ) = exp(Rδ) R</text>
</svg>
