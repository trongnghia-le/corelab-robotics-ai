<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" font-family="Inter, Arial, sans-serif" role="img">
<title>MCU to ROS 2 link, layer by layer</title>
<desc>Encoders and motors connect to MCU firmware with a receive state machine, CRC8 and a watchdog, then a transport such as UART, USB CDC, CAN or Ethernet, then the host, then the ROS 2 graph. Below, the frame bytes and two paths: a custom protocol into a ros2_control hardware interface, and the highlighted micro-ROS client to agent path.</desc>
<rect width="760" height="470" fill="#191b1f" rx="12"/>
<text x="380" y="28" font-size="17" fill="#e5e7eb" text-anchor="middle" font-weight="bold">From encoder and motor to the ROS 2 graph: one stack, two routes</text>
<rect x="20" y="50" width="128" height="72" rx="8" fill="#272a2f" stroke="#53b2dd" stroke-width="2"/>
<text x="84.0" y="75.2" font-size="12" fill="#e5e7eb" text-anchor="middle" font-weight="bold">Encoders</text>
<text x="84.0" y="90.2" font-size="12" fill="#e5e7eb" text-anchor="middle">and motors</text>
<text x="84.0" y="105.2" font-size="12" fill="#e5e7eb" text-anchor="middle">counts, PWM</text>
<rect x="168" y="50" width="128" height="72" rx="8" fill="#272a2f" stroke="#9ccd4e" stroke-width="2"/>
<text x="232.0" y="75.2" font-size="12" fill="#e5e7eb" text-anchor="middle" font-weight="bold">MCU firmware</text>
<text x="232.0" y="90.2" font-size="12" fill="#e5e7eb" text-anchor="middle">RX state machine</text>
<text x="232.0" y="105.2" font-size="12" fill="#e5e7eb" text-anchor="middle">CRC8, watchdog</text>
<rect x="316" y="50" width="128" height="72" rx="8" fill="#272a2f" stroke="#e5e7eb" stroke-width="2"/>
<text x="380.0" y="75.2" font-size="12" fill="#e5e7eb" text-anchor="middle" font-weight="bold">Transport</text>
<text x="380.0" y="90.2" font-size="12" fill="#e5e7eb" text-anchor="middle">UART, USB CDC,</text>
<text x="380.0" y="105.2" font-size="12" fill="#e5e7eb" text-anchor="middle">CAN, Ethernet</text>
<rect x="464" y="50" width="128" height="72" rx="8" fill="#272a2f" stroke="#9ccd4e" stroke-width="2"/>
<text x="528.0" y="75.2" font-size="12" fill="#e5e7eb" text-anchor="middle" font-weight="bold">Host PC / Pi</text>
<text x="528.0" y="90.2" font-size="12" fill="#e5e7eb" text-anchor="middle">hw interface or</text>
<text x="528.0" y="105.2" font-size="12" fill="#e5e7eb" text-anchor="middle">micro-ROS agent</text>
<rect x="612" y="50" width="128" height="72" rx="8" fill="#272a2f" stroke="#53b2dd" stroke-width="2"/>
<text x="676.0" y="75.2" font-size="12" fill="#e5e7eb" text-anchor="middle" font-weight="bold">ROS 2 graph</text>
<text x="676.0" y="90.2" font-size="12" fill="#e5e7eb" text-anchor="middle">topics, nodes,</text>
<text x="676.0" y="105.2" font-size="12" fill="#e5e7eb" text-anchor="middle">controllers</text>
<line x1="148" y1="86" x2="168" y2="86" stroke="#e5e7eb" stroke-width="2"/>
<polygon points="168,86 159.0,89.5 159.0,82.5" fill="#e5e7eb"/>
<line x1="296" y1="86" x2="316" y2="86" stroke="#e5e7eb" stroke-width="2"/>
<polygon points="316,86 307.0,89.5 307.0,82.5" fill="#e5e7eb"/>
<line x1="444" y1="86" x2="464" y2="86" stroke="#e5e7eb" stroke-width="2"/>
<polygon points="464,86 455.0,89.5 455.0,82.5" fill="#e5e7eb"/>
<line x1="592" y1="86" x2="612" y2="86" stroke="#e5e7eb" stroke-width="2"/>
<polygon points="612,86 603.0,89.5 603.0,82.5" fill="#e5e7eb"/>
<text x="380" y="150" font-size="13" fill="#e5e7eb" text-anchor="middle" font-weight="bold">Frame on the wire (every byte after 7E is stuffed; CRC8 covers LEN to PAYLOAD)</text>
<rect x="80" y="162" width="70" height="44" rx="8" fill="#272a2f" stroke="#9ccd4e" stroke-width="2"/>
<text x="115.0" y="180.7" font-size="12" fill="#e5e7eb" text-anchor="middle" font-weight="bold">7E</text>
<text x="115.0" y="195.7" font-size="12" fill="#e5e7eb" text-anchor="middle">SOF</text>
<rect x="156" y="162" width="70" height="44" rx="8" fill="#272a2f" stroke="#53b2dd" stroke-width="2"/>
<text x="191.0" y="180.7" font-size="12" fill="#e5e7eb" text-anchor="middle" font-weight="bold">LEN</text>
<text x="191.0" y="195.7" font-size="12" fill="#e5e7eb" text-anchor="middle">0..64</text>
<rect x="232" y="162" width="70" height="44" rx="8" fill="#272a2f" stroke="#53b2dd" stroke-width="2"/>
<text x="267.0" y="180.7" font-size="12" fill="#e5e7eb" text-anchor="middle" font-weight="bold">ID</text>
<text x="267.0" y="195.7" font-size="12" fill="#e5e7eb" text-anchor="middle">type</text>
<rect x="308" y="162" width="80" height="44" rx="8" fill="#272a2f" stroke="#53b2dd" stroke-width="2"/>
<text x="348.0" y="180.7" font-size="12" fill="#e5e7eb" text-anchor="middle" font-weight="bold">SEQ</text>
<text x="348.0" y="195.7" font-size="12" fill="#e5e7eb" text-anchor="middle">mod 256</text>
<rect x="394" y="162" width="190" height="44" rx="8" fill="#272a2f" stroke="#53b2dd" stroke-width="2"/>
<text x="489.0" y="180.7" font-size="12" fill="#e5e7eb" text-anchor="middle" font-weight="bold">PAYLOAD</text>
<text x="489.0" y="195.7" font-size="12" fill="#e5e7eb" text-anchor="middle">LEN bytes</text>
<rect x="590" y="162" width="90" height="44" rx="8" fill="#272a2f" stroke="#9ccd4e" stroke-width="2"/>
<text x="635.0" y="180.7" font-size="12" fill="#e5e7eb" text-anchor="middle" font-weight="bold">CRC8</text>
<text x="635.0" y="195.7" font-size="12" fill="#e5e7eb" text-anchor="middle">poly 0x07</text>
<text x="380" y="232" font-size="12" fill="#e5e7eb" text-anchor="middle">Stuffing: 7E -&gt; 7D 5E, 7D -&gt; 7D 5D, so a bare 7E always starts a frame (resync)</text>
<text x="20" y="266" font-size="13" fill="#53b2dd" text-anchor="start" font-weight="bold">A  Custom protocol (this lesson)</text>
<rect x="20" y="276" width="150" height="54" rx="8" fill="#272a2f" stroke="#53b2dd" stroke-width="2"/>
<text x="95.0" y="299.7" font-size="12" fill="#e5e7eb" text-anchor="middle" font-weight="bold">Firmware parser</text>
<text x="95.0" y="314.7" font-size="12" fill="#e5e7eb" text-anchor="middle">frames + timeout</text>
<rect x="206" y="276" width="120" height="54" rx="8" fill="#272a2f" stroke="#53b2dd" stroke-width="2"/>
<text x="266.0" y="299.7" font-size="12" fill="#e5e7eb" text-anchor="middle" font-weight="bold">UART / USB</text>
<text x="266.0" y="314.7" font-size="12" fill="#e5e7eb" text-anchor="middle">115200..500000</text>
<rect x="362" y="276" width="180" height="54" rx="8" fill="#272a2f" stroke="#53b2dd" stroke-width="2"/>
<text x="452.0" y="292.2" font-size="12" fill="#e5e7eb" text-anchor="middle" font-weight="bold">ros2_control</text>
<text x="452.0" y="307.2" font-size="12" fill="#e5e7eb" text-anchor="middle">hardware interface</text>
<text x="452.0" y="322.2" font-size="12" fill="#e5e7eb" text-anchor="middle">read() / write()</text>
<rect x="578" y="276" width="162" height="54" rx="8" fill="#272a2f" stroke="#53b2dd" stroke-width="2"/>
<text x="659.0" y="299.7" font-size="12" fill="#e5e7eb" text-anchor="middle" font-weight="bold">diff_drive_</text>
<text x="659.0" y="314.7" font-size="12" fill="#e5e7eb" text-anchor="middle">controller</text>
<line x1="170" y1="303" x2="206" y2="303" stroke="#e5e7eb" stroke-width="2"/>
<polygon points="206,303 197.0,306.5 197.0,299.5" fill="#e5e7eb"/>
<line x1="326" y1="303" x2="362" y2="303" stroke="#e5e7eb" stroke-width="2"/>
<polygon points="362,303 353.0,306.5 353.0,299.5" fill="#e5e7eb"/>
<line x1="542" y1="303" x2="578" y2="303" stroke="#e5e7eb" stroke-width="2"/>
<polygon points="578,303 569.0,306.5 569.0,299.5" fill="#e5e7eb"/>
<text x="20" y="358" font-size="13" fill="#d97936" text-anchor="start" font-weight="bold">B  micro-ROS (highlighted)</text>
<rect x="20" y="368" width="150" height="54" rx="8" fill="#272a2f" stroke="#d97936" stroke-width="2"/>
<text x="95.0" y="391.7" font-size="12" fill="#e5e7eb" text-anchor="middle" font-weight="bold">micro-ROS client</text>
<text x="95.0" y="406.7" font-size="12" fill="#e5e7eb" text-anchor="middle">rclc node on MCU</text>
<rect x="206" y="368" width="120" height="54" rx="8" fill="#272a2f" stroke="#d97936" stroke-width="2"/>
<text x="266.0" y="391.7" font-size="12" fill="#e5e7eb" text-anchor="middle" font-weight="bold">XRCE-DDS</text>
<text x="266.0" y="406.7" font-size="12" fill="#e5e7eb" text-anchor="middle">serial / UDP</text>
<rect x="362" y="368" width="180" height="54" rx="8" fill="#272a2f" stroke="#d97936" stroke-width="2"/>
<text x="452.0" y="391.7" font-size="12" fill="#e5e7eb" text-anchor="middle" font-weight="bold">micro-ROS agent</text>
<text x="452.0" y="406.7" font-size="12" fill="#e5e7eb" text-anchor="middle">on the host</text>
<rect x="578" y="368" width="162" height="54" rx="8" fill="#272a2f" stroke="#d97936" stroke-width="2"/>
<text x="659.0" y="391.7" font-size="12" fill="#e5e7eb" text-anchor="middle" font-weight="bold">DDS topics</text>
<text x="659.0" y="406.7" font-size="12" fill="#e5e7eb" text-anchor="middle">/wheel_ticks, /cmd</text>
<line x1="170" y1="395" x2="206" y2="395" stroke="#d97936" stroke-width="2"/>
<polygon points="206,395 197.0,398.5 197.0,391.5" fill="#d97936"/>
<line x1="326" y1="395" x2="362" y2="395" stroke="#d97936" stroke-width="2"/>
<polygon points="362,395 353.0,398.5 353.0,391.5" fill="#d97936"/>
<line x1="542" y1="395" x2="578" y2="395" stroke="#d97936" stroke-width="2"/>
<polygon points="578,395 569.0,398.5 569.0,391.5" fill="#d97936"/>
<text x="380" y="452" font-size="13" fill="#e5e7eb" text-anchor="middle">The fast PI loop stays on the MCU in both routes; the link carries setpoints and measurements.</text>
</svg>
