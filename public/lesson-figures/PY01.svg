<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="Inter, sans-serif">
<title>Names are labels on objects: shallow copy of a list of lists</title>
<desc>Two names, two outer lists; the three inner lists are objects too. b[0].append(40) changed an inner list that both outer lists point at.</desc>
<rect width="900" height="470" rx="14" fill="#17181b"/>

<text x="32" y="44" font-size="22" font-weight="bold" fill="#e9e7e3">Names are labels: b = list(a) copies only the outer list</text>
<text x="32" y="76" font-size="14" fill="#a7adb5">a = [[10, 20], [30]];  b = list(a);  b[0].append(40);  b.append([50])</text>
<text x="150" y="112" font-size="15" font-weight="600" fill="#86abe2">list A (outer)</text>
<rect x="150" y="126" width="72" height="44" rx="6" fill="#22252a" stroke="#86abe2" stroke-width="2"/>
<text x="158" y="153" font-size="14" fill="#a7adb5">[0]</text>
<circle cx="204.0" cy="148.0" r="4" fill="#86abe2"/>
<rect x="150" y="170" width="72" height="44" rx="6" fill="#22252a" stroke="#86abe2" stroke-width="2"/>
<text x="158" y="197" font-size="14" fill="#a7adb5">[1]</text>
<circle cx="204.0" cy="192.0" r="4" fill="#86abe2"/>
<text x="32" y="175" font-size="17" font-weight="bold" fill="#86abe2">a</text>
<line x1="56" y1="170" x2="137.0" y2="170.0" stroke="#86abe2" stroke-width="2"/>
<polygon points="148.0,170.0 137.0,175.5 137.0,164.5" fill="#86abe2"/>
<text x="150" y="296" font-size="15" font-weight="600" fill="#6fc693">list B (outer, new)</text>
<rect x="150" y="310" width="72" height="44" rx="6" fill="#22252a" stroke="#6fc693" stroke-width="2"/>
<text x="158" y="337" font-size="14" fill="#a7adb5">[0]</text>
<circle cx="204.0" cy="332.0" r="4" fill="#6fc693"/>
<rect x="150" y="354" width="72" height="44" rx="6" fill="#22252a" stroke="#6fc693" stroke-width="2"/>
<text x="158" y="381" font-size="14" fill="#a7adb5">[1]</text>
<circle cx="204.0" cy="376.0" r="4" fill="#6fc693"/>
<rect x="150" y="398" width="72" height="44" rx="6" fill="#22252a" stroke="#6fc693" stroke-width="2"/>
<text x="158" y="425" font-size="14" fill="#a7adb5">[2]</text>
<circle cx="204.0" cy="420.0" r="4" fill="#6fc693"/>
<text x="32" y="381" font-size="17" font-weight="bold" fill="#6fc693">b</text>
<line x1="56" y1="376" x2="137.0" y2="376.0" stroke="#6fc693" stroke-width="2"/>
<polygon points="148.0,376.0 137.0,381.5 137.0,370.5" fill="#6fc693"/>
<rect x="560" y="150" width="300" height="44" rx="8" fill="#22252a" stroke="#e0904f" stroke-width="2"/>
<text x="576" y="178" font-size="15" font-weight="600" fill="#e9e7e3">[10, 20, 40]</text>
<text x="560" y="216" font-size="14" fill="#a7adb5">shared: a[0] is b[0] → True</text>
<rect x="560" y="250" width="300" height="44" rx="8" fill="#22252a" stroke="#e9e7e3" stroke-width="2"/>
<text x="576" y="278" font-size="15" font-weight="600" fill="#e9e7e3">[30]</text>
<text x="560" y="316" font-size="14" fill="#a7adb5">shared: a[1] is b[1] → True</text>
<rect x="560" y="372" width="300" height="44" rx="8" fill="#22252a" stroke="#6fc693" stroke-width="2"/>
<text x="576" y="400" font-size="15" font-weight="600" fill="#e9e7e3">[50]</text>
<text x="560" y="438" font-size="14" fill="#a7adb5">only list B holds it</text>
<line x1="222" y1="148" x2="547.0" y2="163.5" stroke="#86abe2" stroke-width="2"/>
<polygon points="558.0,164.0 546.8,169.0 547.3,158.0" fill="#86abe2"/>
<line x1="222" y1="192" x2="547.2" y2="259.8" stroke="#86abe2" stroke-width="2"/>
<polygon points="558.0,262.0 546.1,265.1 548.4,254.4" fill="#86abe2"/>
<line x1="222" y1="332" x2="547.9" y2="188.4" stroke="#6fc693" stroke-width="2"/>
<polygon points="558.0,184.0 550.2,193.5 545.7,183.4" fill="#6fc693"/>
<line x1="222" y1="376" x2="547.4" y2="285.0" stroke="#6fc693" stroke-width="2"/>
<polygon points="558.0,282.0 548.9,290.3 545.9,279.7" fill="#6fc693"/>
<line x1="222" y1="420" x2="547.0" y2="394.8" stroke="#6fc693" stroke-width="2"/>
<polygon points="558.0,394.0 547.5,400.3 546.6,389.4" fill="#6fc693"/>
</svg>
