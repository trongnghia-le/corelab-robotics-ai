<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" font-family="Inter, Arial, sans-serif" font-size="14">
<defs><marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#e5e7eb"/></marker>
<marker id="ao" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#f97316"/></marker></defs>
<rect width="720" height="340" fill="#111827" rx="12"/>
<text x="360" y="28" text-anchor="middle" fill="#e5e7eb" font-size="16" font-weight="bold">b = list(a): a shallow copy shares the inner lists</text>
<text x="40" y="95" fill="#38bdf8" font-size="16">a</text>
<text x="40" y="215" fill="#a3e635" font-size="16">b</text>
<rect x="150" y="65" width="150" height="46" fill="none" stroke="#38bdf8" stroke-width="2" rx="6"/>
<text x="165" y="94" fill="#e5e7eb">outer list A</text>
<rect x="150" y="185" width="150" height="46" fill="none" stroke="#a3e635" stroke-width="2" rx="6"/>
<text x="165" y="214" fill="#e5e7eb">outer list B</text>
<line x1="65" y1="90" x2="146" y2="88" stroke="#e5e7eb" stroke-width="2" marker-end="url(#ar)"/>
<line x1="65" y1="210" x2="146" y2="208" stroke="#e5e7eb" stroke-width="2" marker-end="url(#ar)"/>
<rect x="470" y="55" width="190" height="46" fill="#1f2937" stroke="#f97316" stroke-width="2" rx="6"/>
<text x="485" y="84" fill="#e5e7eb">inner [1, 2]</text>
<rect x="470" y="135" width="190" height="46" fill="#1f2937" stroke="#e5e7eb" stroke-width="2" rx="6"/>
<text x="485" y="164" fill="#e5e7eb">inner [3]</text>
<rect x="470" y="255" width="190" height="46" fill="#1f2937" stroke="#a3e635" stroke-width="2" rx="6"/>
<text x="485" y="284" fill="#e5e7eb">inner [4] (only in B)</text>
<line x1="300" y1="80" x2="466" y2="77" stroke="#f97316" stroke-width="2" marker-end="url(#ao)"/>
<line x1="300" y1="200" x2="466" y2="84" stroke="#f97316" stroke-width="2" marker-end="url(#ao)"/>
<line x1="300" y1="95" x2="466" y2="157" stroke="#e5e7eb" stroke-width="2" marker-end="url(#ar)"/>
<line x1="300" y1="215" x2="466" y2="165" stroke="#e5e7eb" stroke-width="2" marker-end="url(#ar)"/>
<line x1="300" y1="225" x2="466" y2="272" stroke="#a3e635" stroke-width="2" marker-end="url(#ar)"/>
<text x="30" y="325" fill="#e5e7eb">b[0].append(9) changes a too; b.append([4]) changes only outer list B.</text>
</svg>
