<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" font-family="Inter, sans-serif">
<title>Richardson iteration: the number of steps grows like κ²</title>
<desc>Error bound (1 - 1/kappa^2)^k against iteration count k for kappa 2, 4 and 6 on a logarithmic error axis, with the iteration counts needed to reach 1e-6 marked: 49, 215 and 491.</desc>
<defs><marker id="b3ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a7adb5"/></marker></defs>
<rect width="900" height="480" rx="14" fill="#17181b"/>
<text x="32" y="44" font-size="22" font-weight="bold" fill="#e9e7e3">Richardson iteration: the number of steps grows like κ²</text>
<rect x="32" y="64" width="836" height="384" rx="10" fill="#22252a"/>
<text x="52" y="96" font-size="17" font-weight="bold" fill="#e9e7e3">Error bound after k steps, μ = 1/σmax²</text>
<line x1="120.0" y1="140.0" x2="120.0" y2="366.0" stroke="#3d4148" stroke-width="1"/>
<text x="120" y="388" font-size="14" text-anchor="middle" fill="#a7adb5">0</text>
<line x1="253.0" y1="140.0" x2="253.0" y2="366.0" stroke="#3d4148" stroke-width="1"/>
<text x="253" y="388" font-size="14" text-anchor="middle" fill="#a7adb5">100</text>
<line x1="385.0" y1="140.0" x2="385.0" y2="366.0" stroke="#3d4148" stroke-width="1"/>
<text x="385" y="388" font-size="14" text-anchor="middle" fill="#a7adb5">200</text>
<line x1="518.0" y1="140.0" x2="518.0" y2="366.0" stroke="#3d4148" stroke-width="1"/>
<text x="518" y="388" font-size="14" text-anchor="middle" fill="#a7adb5">300</text>
<line x1="651.0" y1="140.0" x2="651.0" y2="366.0" stroke="#3d4148" stroke-width="1"/>
<text x="651" y="388" font-size="14" text-anchor="middle" fill="#a7adb5">400</text>
<line x1="783.0" y1="140.0" x2="783.0" y2="366.0" stroke="#3d4148" stroke-width="1"/>
<text x="783" y="388" font-size="14" text-anchor="middle" fill="#a7adb5">500</text>
<line x1="120.0" y1="140.0" x2="810.0" y2="140.0" stroke="#3d4148" stroke-width="1"/>
<text x="110" y="145" font-size="14" text-anchor="end" fill="#a7adb5">0</text>
<line x1="120.0" y1="205.0" x2="810.0" y2="205.0" stroke="#3d4148" stroke-width="1"/>
<text x="110" y="210" font-size="14" text-anchor="end" fill="#a7adb5">-2</text>
<line x1="120.0" y1="269.0" x2="810.0" y2="269.0" stroke="#3d4148" stroke-width="1"/>
<text x="110" y="274" font-size="14" text-anchor="end" fill="#a7adb5">-4</text>
<line x1="120.0" y1="334.0" x2="810.0" y2="334.0" stroke="#3d4148" stroke-width="1"/>
<text x="110" y="339" font-size="14" text-anchor="end" fill="#a7adb5">-6</text>
<line x1="120.0" y1="366.0" x2="810.0" y2="366.0" stroke="#a7adb5" stroke-width="1.5"/>
<line x1="120.0" y1="140.0" x2="120.0" y2="366.0" stroke="#a7adb5" stroke-width="1.5"/>
<text x="465" y="410" font-size="15" text-anchor="middle" fill="#e9e7e3">iteration k</text>
<text x="68" y="128" font-size="15" fill="#e9e7e3">log₁₀ (‖eₖ‖ / ‖e₀‖)</text>
<polyline points="120.0,140.0 194.0,366.0" fill="none" stroke="#6fc693" stroke-width="2.5" stroke-linejoin="round"/>
<circle cx="185.0" cy="334.0" r="6" fill="#6fc693"/>
<text x="195" y="322" font-size="15" fill="#6fc693">κ = 2: k = 49</text>
<polyline points="120.0,140.0 451.0,366.0" fill="none" stroke="#ae9ce6" stroke-width="2.5" stroke-linejoin="round"/>
<circle cx="405.0" cy="334.0" r="6" fill="#ae9ce6"/>
<text x="415" y="322" font-size="15" fill="#ae9ce6">κ = 4: k = 215</text>
<polyline points="120.0,140.0 810.0,345.0" fill="none" stroke="#86abe2" stroke-width="2.5" stroke-linejoin="round"/>
<circle cx="772.0" cy="334.0" r="6" fill="#86abe2"/>
<text x="786" y="364" font-size="15" text-anchor="end" fill="#86abe2">κ = 6: k = 491</text>
<polyline points="120.0,334.0 810.0,334.0" fill="none" stroke="#e0c169" stroke-width="1.5" stroke-linejoin="round" stroke-dasharray="7 5"/>
<text x="220" y="356" font-size="14" fill="#e0c169">tolerance 1e-6</text>
<text x="52" y="430" font-size="14" fill="#a7adb5">k = ln(1e-6) / ln(1 − 1/κ²): 49, 215, 491; ≈ 13.8·κ²</text>
</svg>
