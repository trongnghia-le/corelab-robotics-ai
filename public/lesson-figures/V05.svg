<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" font-family="Inter, Arial, sans-serif" font-size="14">
<rect width="760" height="340" fill="#111827" rx="12"/>
<text x="20" y="28" fill="#e5e7eb" font-size="16" font-weight="bold">Corner test: window shift energy</text>
<text x="420" y="28" fill="#e5e7eb" font-size="16" font-weight="bold">Ratio test</text>
<rect x="20" y="50" width="100" height="100" fill="#374151" stroke="#e5e7eb"/>
<text x="70" y="175" text-anchor="middle" fill="#e5e7eb">flat</text>
<text x="70" y="197" text-anchor="middle" fill="#e5e7eb">both small</text>
<text x="70" y="219" text-anchor="middle" fill="#e5e7eb">R near 0</text>
<rect x="140" y="50" width="100" height="100" fill="#374151" stroke="#e5e7eb"/>
<rect x="190" y="50" width="50" height="100" fill="#e5e7eb"/>
<text x="190" y="175" text-anchor="middle" fill="#38bdf8">edge</text>
<text x="190" y="197" text-anchor="middle" fill="#e5e7eb">one large</text>
<text x="190" y="219" text-anchor="middle" fill="#38bdf8">R &lt; 0</text>
<rect x="260" y="50" width="100" height="100" fill="#374151" stroke="#e5e7eb"/>
<rect x="310" y="50" width="50" height="50" fill="#e5e7eb"/>
<text x="310" y="175" text-anchor="middle" fill="#f97316">corner</text>
<text x="310" y="197" text-anchor="middle" fill="#e5e7eb">both large</text>
<text x="310" y="219" text-anchor="middle" fill="#f97316">R &gt;&gt; 0</text>
<text x="20" y="262" fill="#e5e7eb">R = det M - k (tr M)^2</text>
<text x="20" y="290" fill="#a3e635">gain g: R scales by g^4;  offset: R unchanged</text>
<text x="20" y="318" fill="#a3e635">rotation: eigenvalues kept, R unchanged</text>
<line x1="420" y1="120" x2="740" y2="120" stroke="#e5e7eb"/>
<text x="420" y="145" fill="#e5e7eb">0</text>
<text x="600" y="145" fill="#e5e7eb">distance to candidates</text>
<circle cx="420" cy="120" r="6" fill="#e5e7eb"/>
<text x="425" y="100" fill="#e5e7eb">query</text>
<circle cx="500" cy="120" r="6" fill="#a3e635"/>
<circle cx="620" cy="120" r="6" fill="#38bdf8"/>
<text x="470" y="82" fill="#a3e635">d1 = 1</text>
<text x="590" y="82" fill="#38bdf8">d2 = 3</text>
<text x="420" y="185" fill="#a3e635">1 &lt; 0.8 x 3: accept (distinct)</text>
<circle cx="500" cy="230" r="6" fill="#a3e635"/>
<circle cx="508" cy="258" r="6" fill="#f97316"/>
<text x="525" y="236" fill="#a3e635">d1 = 1.0</text>
<text x="525" y="264" fill="#f97316">d2 = 1.1</text>
<text x="420" y="300" fill="#f97316">1.0 &gt; 0.8 x 1.1: reject (ambiguous)</text>
</svg>
