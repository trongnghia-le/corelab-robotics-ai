<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" font-family="Inter, sans-serif">
<title>Timer wrap-around: the interval is an arc across 0</title>
<desc>A 32-bit microsecond timer drawn as a ring with t0 just before the wrap and t1 just after, arcs of 296 and 1200 microseconds, and three computed results.</desc>
<rect width="900" height="440" rx="14" fill="#17181b"/>
<defs><marker id="c014-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs>
<text x="32" y="44" font-size="22" fill="#e9e7e3" font-weight="700">Timer wrap-around: the interval is an arc across 0</text>
<circle cx="250" cy="252" r="118" fill="none" stroke="#3d4148" stroke-width="2"/>
<path d="M174,162 A118,118 0 0 1 246,134" fill="none" stroke="#6cc6ba" stroke-width="4"/>
<path d="M254,134 A118,118 0 0 1 352,193" fill="none" stroke="#e0904f" stroke-width="4"/>
<circle cx="174" cy="162" r="6" fill="#6cc6ba" stroke="#6cc6ba" stroke-width="1"/>
<circle cx="250" cy="134" r="6" fill="#e9e7e3" stroke="#e9e7e3" stroke-width="1"/>
<circle cx="352" cy="193" r="6" fill="#e0904f" stroke="#e0904f" stroke-width="1"/>
<text x="250" y="110" font-size="15" fill="#e9e7e3" font-weight="600" text-anchor="middle">wrap: 2^32 -&gt; 0</text>
<text x="165" y="147" font-size="15" fill="#6cc6ba" font-weight="600" text-anchor="end">t0 = 4294967000</text>
<text x="364" y="182" font-size="15" fill="#e0904f" font-weight="600">t1 = 1200</text>
<text x="250" y="240" font-size="17" fill="#e9e7e3" font-weight="700" text-anchor="middle">dt = 1496 us</text>
<text x="224" y="181" font-size="14" fill="#6cc6ba" text-anchor="end">296 us</text>
<text x="278" y="182" font-size="14" fill="#e0904f">1200 us</text>
<text x="250" y="292" font-size="14" fill="#a7adb5" text-anchor="middle">not to scale: arcs exaggerated</text>
<rect x="500" y="72" width="368" height="330" rx="10" fill="#22252a" stroke="#3d4148" stroke-width="1.5"/>
<text x="520" y="104" font-size="17" fill="#e9e7e3" font-weight="700">Results for 37 counts of 4096</text>
<text x="520" y="140" font-size="14" fill="#a7adb5">method</text>
<text x="740" y="140" font-size="14" fill="#a7adb5" text-anchor="end">dt (us)</text>
<text x="848" y="140" font-size="14" fill="#a7adb5" text-anchor="end">ω (rad/s)</text>
<text x="520" y="180" font-size="15" fill="#e9e7e3" font-weight="600">unsigned t1 - t0</text>
<text x="740" y="208" font-size="15" fill="#6fc693" font-weight="600" text-anchor="end">1496</text>
<text x="848" y="208" font-size="15" fill="#6fc693" font-weight="600" text-anchor="end">37.9394</text>
<text x="520" y="208" font-size="14" fill="#6fc693">correct</text>
<line x1="520" y1="226" x2="848" y2="226" stroke="#2c3036" stroke-width="1"/>
<text x="520" y="252" font-size="15" fill="#e9e7e3" font-weight="600">double t1 - t0</text>
<text x="740" y="280" font-size="15" fill="#e58a80" font-weight="600" text-anchor="end">-4294965800</text>
<text x="848" y="280" font-size="15" fill="#e58a80" font-weight="600" text-anchor="end">-</text>
<text x="520" y="280" font-size="14" fill="#e58a80">wrong</text>
<line x1="520" y1="298" x2="848" y2="298" stroke="#2c3036" stroke-width="1"/>
<text x="520" y="324" font-size="15" fill="#e9e7e3" font-weight="600">37 / 4096 in int</text>
<text x="740" y="352" font-size="15" fill="#e58a80" font-weight="600" text-anchor="end">1496</text>
<text x="848" y="352" font-size="15" fill="#e58a80" font-weight="600" text-anchor="end">0.0000</text>
<text x="520" y="352" font-size="14" fill="#e58a80">wrong</text>
<line x1="520" y1="370" x2="848" y2="370" stroke="#2c3036" stroke-width="1"/>
<text x="520" y="384" font-size="14" fill="#a7adb5">362.29 rpm = 37.9394 rad/s x 60 / (2 pi)</text>
</svg>
