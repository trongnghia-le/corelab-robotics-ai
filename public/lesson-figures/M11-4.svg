<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" font-family="Inter, sans-serif">
<title>Case 2: the quadratic formula loses a quarter of the small root</title>
<desc>Left, to scale: near 1e8 the doubles are 1.49e-8 apart; the true square root d is 2.00e-8 below 1e8 but the stored value is 1.49e-8 below, so the difference 1e8 - d is computed as 1.49e-8 instead of 2.00e-8. Right: the naive small root is 0.745e-8 (25.5 percent too small); the stable formula gives 1.000e-8.</desc>
<defs></defs>
<rect width="900" height="480" rx="14" fill="#17181b"/>
<text x="32" y="44" font-size="22" fill="#e9e7e3" text-anchor="start" font-weight="bold">Case 2: the quadratic formula loses a quarter of the small root</text>
<rect x="32" y="64" width="468" height="384" rx="8" fill="#22252a" stroke="#3d4148" stroke-width="1.5"/>
<text x="48" y="94" font-size="17" fill="#e9e7e3" text-anchor="start" font-weight="bold">Near 10⁸ the grid step is 1.49×10⁻⁸</text>
<line x1="80" y1="190" x2="432" y2="190" stroke="#a7adb5" stroke-width="1.5" stroke-linecap="round"/>
<line x1="80" y1="180" x2="80" y2="198" stroke="#e9e7e3" stroke-width="2" stroke-linecap="round"/>
<text x="80" y="218" font-size="14" fill="#a7adb5" text-anchor="middle">0</text>
<line x1="243.913" y1="180" x2="243.913" y2="198" stroke="#e9e7e3" stroke-width="2" stroke-linecap="round"/>
<text x="243.913" y="218" font-size="14" fill="#a7adb5" text-anchor="middle">1.49</text>
<line x1="407.826" y1="180" x2="407.826" y2="198" stroke="#e9e7e3" stroke-width="2" stroke-linecap="round"/>
<text x="407.826" y="218" font-size="14" fill="#a7adb5" text-anchor="middle">2.98</text>
<circle cx="300" cy="190" r="6" fill="#e0904f"/>
<circle cx="243.913" cy="190" r="6" fill="#e58a80"/>
<text x="310" y="172" font-size="15" fill="#e0904f" text-anchor="start" font-weight="600">true d</text>
<text x="233.913" y="172" font-size="15" fill="#e58a80" text-anchor="end" font-weight="600">stored d̂</text>
<text x="80" y="244" font-size="14" fill="#a7adb5" text-anchor="start">distance below 10⁸, in units of 10⁻⁸</text>
<line x1="80" y1="296" x2="300" y2="296" stroke="#e0904f" stroke-width="3" stroke-linecap="round"/>
<line x1="80" y1="338" x2="243.913" y2="338" stroke="#e58a80" stroke-width="3" stroke-linecap="round"/>
<text x="80" y="286" font-size="15" fill="#e0904f" text-anchor="start" font-weight="600">10⁸ − d, true: 2.00</text>
<text x="80" y="328" font-size="15" fill="#e58a80" text-anchor="start" font-weight="600">10⁸ − d̂, computed: 1.49</text>
<text x="48" y="392" font-size="15" fill="#e9e7e3" text-anchor="start">d = √(b² − 4ac) = √(10¹⁶ − 4)</text>
<text x="48" y="418" font-size="14" fill="#a7adb5" text-anchor="start">d̂ is within 5×10⁻¹⁷ of d, yet the difference is off by 25 %</text>
<rect x="524" y="64" width="344" height="384" rx="8" fill="#22252a" stroke="#3d4148" stroke-width="1.5"/>
<text x="540" y="94" font-size="17" fill="#e9e7e3" text-anchor="start" font-weight="bold">Small root, units of 10⁻⁸</text>
<text x="540" y="150" font-size="15" fill="#e9e7e3" text-anchor="start" font-weight="600">true root</text>
<rect x="540" y="160" width="250" height="26" rx="3" fill="#6fc693" fill-opacity="0.85"/>
<text x="540" y="206" font-size="15" fill="#6fc693" text-anchor="start" font-weight="600">1.000</text>
<text x="540" y="230" font-size="15" fill="#e9e7e3" text-anchor="start" font-weight="600">naive (10⁸ − d̂)/2</text>
<rect x="540" y="240" width="186.264" height="26" rx="3" fill="#e58a80" fill-opacity="0.85"/>
<text x="540" y="286" font-size="15" fill="#e58a80" text-anchor="start" font-weight="600">0.745  (−25.5 %)</text>
<text x="540" y="310" font-size="15" fill="#e9e7e3" text-anchor="start" font-weight="600">stable c / q</text>
<rect x="540" y="320" width="250" height="26" rx="3" fill="#6cc6ba" fill-opacity="0.85"/>
<text x="540" y="366" font-size="15" fill="#6cc6ba" text-anchor="start" font-weight="600">1.000</text>
<line x1="790" y1="140" x2="790" y2="380" stroke="#a7adb5" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 4"/>
<text x="540" y="420" font-size="14" fill="#a7adb5" text-anchor="start">q = ½(10⁸ + d̂) rounds to 10⁸, so c/q = 10⁻⁸</text>
</svg>
