<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" font-family="Inter, sans-serif">
<title>One arm, three postures: the velocity ellipse shrinks as the force ellipse grows</title>
<desc>Planar 2R arm l=(0.6,0.4) m at q1=25 degrees and q2 = 70, 35 and 10 degrees. At each posture the velocity ellipse {J qdot : |qdot|=1} with semi-axes sigma_i and the force ellipse {F : |J^T F|=1} with semi-axes 1/sigma_i, along the same principal directions.</desc>
<defs></defs>
<rect width="900" height="640" rx="14" fill="#17181b"/>
<text x="32" y="44" font-size="22" fill="#e9e7e3" font-weight="700">One arm, three postures: the velocity ellipse shrinks as the force ellipse grows</text>
<rect x="32" y="70" width="262" height="556" rx="10" fill="#22252a" stroke="none" stroke-width="1.5" />
<text x="48" y="98" font-size="17" fill="#e9e7e3" font-weight="700">q₂ = 70°</text>
<line x1="92.0" y1="300.0" x2="173.6" y2="262.0" stroke="#86abe2" stroke-width="5" stroke-linecap="round"/>
<line x1="173.6" y1="262.0" x2="168.3" y2="202.2" stroke="#6fc693" stroke-width="5" stroke-linecap="round"/>
<circle cx="92.0" cy="300.0" r="7.0" fill="#17181b" stroke="#e9e7e3" stroke-width="2.5"/>
<circle cx="173.6" cy="262.0" r="7.0" fill="#17181b" stroke="#e9e7e3" stroke-width="2.5"/>
<circle cx="168.3" cy="202.2" r="4.0" fill="#e9e7e3" stroke="#e9e7e3" stroke-width="1"/>
<ellipse cx="168.3" cy="202.2" rx="61.8" ry="17.9" transform="rotate(-148.49 168.3 202.2)" fill="#86abe2" stroke="#86abe2" stroke-width="2.5" fill-opacity="0.18"/>
<text x="48" y="330" font-size="14" fill="#86abe2" font-weight="600">velocity ellipse, |q̇| = 1</text>
<text x="48" y="350" font-size="14" fill="#a7adb5">σ₁ = 0.883, σ₂ = 0.256 m/s</text>
<text x="48" y="368" font-size="14" fill="#a7adb5">1 m/s = 70 px</text>
<line x1="48.0" y1="384.0" x2="278.0" y2="384.0" stroke="#3d4148" stroke-width="1" stroke-linecap="round"/>
<text x="48" y="406" font-size="14" fill="#e0904f" font-weight="600">force ellipse, |τ| = 1</text>
<text x="48" y="604" font-size="14" fill="#a7adb5">1 N = 18.4 px (own scale per panel)</text>
<ellipse cx="163.0" cy="494.0" rx="20.8" ry="72.0" transform="rotate(-148.49 163.0 494.0)" fill="#e0904f" stroke="#e0904f" stroke-width="2.5" stroke-dasharray="7 4" fill-opacity="0.12"/>
<text x="48" y="584" font-size="14" fill="#a7adb5">1/σ₁ = 1.13, 1/σ₂ = 3.91 N</text>
<text x="278" y="98" font-size="15" fill="#e9e7e3" font-weight="600" text-anchor="end">μ₁ = 3.5</text>
<rect x="318" y="70" width="262" height="556" rx="10" fill="#22252a" stroke="none" stroke-width="1.5" />
<text x="334" y="98" font-size="17" fill="#e9e7e3" font-weight="700">q₂ = 35°</text>
<line x1="378.0" y1="300.0" x2="459.6" y2="262.0" stroke="#86abe2" stroke-width="5" stroke-linecap="round"/>
<line x1="459.6" y1="262.0" x2="489.6" y2="210.0" stroke="#6fc693" stroke-width="5" stroke-linecap="round"/>
<circle cx="378.0" cy="300.0" r="7.0" fill="#17181b" stroke="#e9e7e3" stroke-width="2.5"/>
<circle cx="459.6" cy="262.0" r="7.0" fill="#17181b" stroke="#e9e7e3" stroke-width="2.5"/>
<circle cx="489.6" cy="210.0" r="4.0" fill="#e9e7e3" stroke="#e9e7e3" stroke-width="1"/>
<ellipse cx="489.6" cy="210.0" rx="71.9" ry="9.4" transform="rotate(-131.87 489.6 210.0)" fill="#86abe2" stroke="#86abe2" stroke-width="2.5" fill-opacity="0.18"/>
<text x="334" y="330" font-size="14" fill="#86abe2" font-weight="600">velocity ellipse, |q̇| = 1</text>
<text x="334" y="350" font-size="14" fill="#a7adb5">σ₁ = 1.027, σ₂ = 0.134 m/s</text>
<text x="334" y="368" font-size="14" fill="#a7adb5">1 m/s = 70 px</text>
<line x1="334.0" y1="384.0" x2="564.0" y2="384.0" stroke="#3d4148" stroke-width="1" stroke-linecap="round"/>
<text x="334" y="406" font-size="14" fill="#e0904f" font-weight="600">force ellipse, |τ| = 1</text>
<text x="334" y="604" font-size="14" fill="#a7adb5">1 N = 9.6 px (own scale per panel)</text>
<ellipse cx="449.0" cy="494.0" rx="9.4" ry="72.0" transform="rotate(-131.87 449.0 494.0)" fill="#e0904f" stroke="#e0904f" stroke-width="2.5" stroke-dasharray="7 4" fill-opacity="0.12"/>
<text x="334" y="584" font-size="14" fill="#a7adb5">1/σ₁ = 0.97, 1/σ₂ = 7.46 N</text>
<text x="564" y="98" font-size="15" fill="#e9e7e3" font-weight="600" text-anchor="end">μ₁ = 7.7</text>
<rect x="604" y="70" width="262" height="556" rx="10" fill="#22252a" stroke="none" stroke-width="1.5" />
<text x="620" y="98" font-size="17" fill="#e9e7e3" font-weight="700">q₂ = 10°</text>
<line x1="664.0" y1="300.0" x2="745.6" y2="262.0" stroke="#86abe2" stroke-width="5" stroke-linecap="round"/>
<line x1="745.6" y1="262.0" x2="794.7" y2="227.5" stroke="#6fc693" stroke-width="5" stroke-linecap="round"/>
<circle cx="664.0" cy="300.0" r="7.0" fill="#17181b" stroke="#e9e7e3" stroke-width="2.5"/>
<circle cx="745.6" cy="262.0" r="7.0" fill="#17181b" stroke="#e9e7e3" stroke-width="2.5"/>
<circle cx="794.7" cy="227.5" r="4.0" fill="#e9e7e3" stroke="#e9e7e3" stroke-width="1"/>
<ellipse cx="794.7" cy="227.5" rx="75.1" ry="2.7" transform="rotate(-119.83 794.7 227.5)" fill="#86abe2" stroke="#86abe2" stroke-width="2.5" fill-opacity="0.18"/>
<text x="620" y="330" font-size="14" fill="#86abe2" font-weight="600">velocity ellipse, |q̇| = 1</text>
<text x="620" y="350" font-size="14" fill="#a7adb5">σ₁ = 1.073, σ₂ = 0.039 m/s</text>
<text x="620" y="368" font-size="14" fill="#a7adb5">1 m/s = 70 px</text>
<line x1="620.0" y1="384.0" x2="850.0" y2="384.0" stroke="#3d4148" stroke-width="1" stroke-linecap="round"/>
<text x="620" y="406" font-size="14" fill="#e0904f" font-weight="600">force ellipse, |τ| = 1</text>
<text x="620" y="604" font-size="14" fill="#a7adb5">1 N = 2.8 px (own scale per panel)</text>
<ellipse cx="735.0" cy="494.0" rx="2.6" ry="72.0" transform="rotate(-119.83 735.0 494.0)" fill="#e0904f" stroke="#e0904f" stroke-width="2.5" stroke-dasharray="7 4" fill-opacity="0.12"/>
<text x="620" y="584" font-size="14" fill="#a7adb5">1/σ₁ = 0.93, 1/σ₂ = 25.75 N</text>
<text x="850" y="98" font-size="15" fill="#e9e7e3" font-weight="600" text-anchor="end">μ₁ = 27.6</text>
</svg>
