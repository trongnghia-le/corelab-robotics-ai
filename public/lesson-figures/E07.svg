<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" font-family="Inter, Arial, sans-serif">
<rect width="720" height="360" fill="#111827" rx="12"/>
<text x="20" y="30" fill="#e5e7eb" font-size="16" font-weight="bold">Rollout shift</text>
<text x="400" y="30" fill="#e5e7eb" font-size="16" font-weight="bold">Multimodal actions</text>
<!-- left panel -->
<path d="M30 150 L360 150 L360 210 L30 210 Z" fill="#38bdf8" fill-opacity="0.18" stroke="#38bdf8" stroke-dasharray="5 4"/>
<text x="40" y="140" fill="#38bdf8" font-size="14">demonstrated tube (training states)</text>
<path d="M30 180 L360 180" stroke="#a3e635" stroke-width="3"/>
<text x="260" y="203" fill="#a3e635" font-size="14">expert</text>
<path d="M30 180 C90 176 130 196 170 206 C210 222 250 250 300 285 C320 300 340 318 355 325" fill="none" stroke="#f97316" stroke-width="3"/>
<circle cx="170" cy="206" r="5" fill="#f97316"/>
<text x="178" y="238" fill="#f97316" font-size="14">small error</text>
<text x="240" y="318" fill="#f97316" font-size="14">no data here</text>
<text x="30" y="345" fill="#e5e7eb" font-size="13">time t</text>
<text x="200" y="345" fill="#e5e7eb" font-size="13">error grows, cost ~ eps*T^2</text>
<path d="M30 100 L30 120" stroke="#e5e7eb"/>
<text x="30" y="75" fill="#e5e7eb" font-size="13">state x (vertical), learner = orange</text>
<!-- right panel -->
<line x1="410" y1="290" x2="690" y2="290" stroke="#e5e7eb"/>
<text x="420" y="315" fill="#e5e7eb" font-size="13">-1 (left)</text>
<text x="535" y="315" fill="#e5e7eb" font-size="13">0</text>
<text x="630" y="315" fill="#e5e7eb" font-size="13">+1 (right)</text>
<text x="400" y="345" fill="#e5e7eb" font-size="13">action a at the same observation</text>
<rect x="430" y="140" width="30" height="150" fill="#38bdf8"/>
<rect x="640" y="140" width="30" height="150" fill="#38bdf8"/>
<text x="400" y="125" fill="#38bdf8" font-size="14">50% demos</text>
<text x="615" y="125" fill="#38bdf8" font-size="14">50% demos</text>
<line x1="550" y1="150" x2="550" y2="290" stroke="#f97316" stroke-width="3"/>
<text x="470" y="110" fill="#f97316" font-size="14">MSE output = mean</text>
<text x="470" y="200" fill="#f97316" font-size="14">obstacle!</text>
<line x1="550" y1="105" x2="550" y2="150" stroke="#f97316" stroke-dasharray="3 3"/>
<line x1="365" y1="45" x2="365" y2="350" stroke="#374151"/>
</svg>
