<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" font-family="Inter, sans-serif">
<title>Conflict misses: 256 lines in one set versus spread over 64</title>
<desc>Bar charts of how many of the 256 lines of the column fall in each of the 64 cache sets. For N = 1024 all 256 lines land in set 0, which holds 8, so all 2048 accesses miss and cost 8192 ns. For N = 1032 each set gets 4 lines, so only 256 accesses miss and the time is 2816 ns.</desc>
