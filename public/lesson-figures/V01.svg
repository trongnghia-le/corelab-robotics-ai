<rect x="400" y="60" width="290" height="120" fill="#1f2937" stroke="#38bdf8" stroke-width="2" rx="6"/>
<text x="415" y="84" fill="#e5e7eb" font-size="14" text-anchor="start" font-weight="bold">uint8 holds 0..255 (256 levels)</text>
<text x="415" y="108" fill="#f97316" font-size="13" text-anchor="start">10 - 20 in uint8  ->  246 (wraps)</text>
<text x="415" y="128" fill="#a3e635" font-size="13" text-anchor="start">cast to int16 first:  -10  (correct)</text>
<text x="415" y="148" fill="#e5e7eb" font-size="13" text-anchor="start">normalise: value / 255  in [0, 1]</text>
<text x="415" y="168" fill="#e5e7eb" font-size="13" text-anchor="start">gamma: not proportional to light</text>
<rect x="400" y="200" width="290" height="130" fill="#1f2937" stroke="#a3e635" stroke-width="2" rx="6"/>
<text x="415" y="224" fill="#e5e7eb" font-size="14" text-anchor="start" font-weight="bold">Resizing changes sampling</text>
<text x="415" y="246" fill="#e5e7eb" font-size="13" text-anchor="start">nearest: keeps labels, can alias</text>
<text x="415" y="266" fill="#e5e7eb" font-size="13" text-anchor="start">box average: stripes -> true mean 127.5</text>
<text x="415" y="286" fill="#e5e7eb" font-size="13" text-anchor="start">bilinear: invents values; not for masks</text>
