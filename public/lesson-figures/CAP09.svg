<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="Inter, Arial, sans-serif" role="img">
<title>CAP09: release, report and graduation pipeline</title>
<desc>Source at tag v1.0 with a Dockerfile and Makefile feeds make reproduce-smoke, which compares six seeded outcomes with a stored file. metrics.json feeds report.md.tmpl through render.py into report.md. scores.json feeds graduate.py which prints the verdict with gates, minimum 60 per milestone, total 70, Merit 80 and Distinction 90 with a stretch.</desc>
<rect width="900" height="470" fill="#111827" rx="12"/>
<text x="450" y="28" font-size="18" fill="#e5e7eb" text-anchor="middle" font-weight="bold">CAP09: from tagged repo to a report you can trust and a verdict</text>
<rect x="30" y="60" width="200" height="80" rx="8" fill="#1f2937" stroke="#38bdf8" stroke-width="2"/>
<text x="130.0" y="89.2" font-size="12" fill="#e5e7eb" text-anchor="middle" font-weight="bold">Repo at tag v1.0</text>
<text x="130.0" y="104.2" font-size="12" fill="#e5e7eb" text-anchor="middle">Dockerfile, Makefile,</text>
<text x="130.0" y="119.2" font-size="12" fill="#e5e7eb" text-anchor="middle">requirements.lock</text>
<rect x="290" y="60" width="250" height="80" rx="8" fill="#1f2937" stroke="#a3e635" stroke-width="2"/>
<text x="415.0" y="89.2" font-size="12" fill="#e5e7eb" text-anchor="middle" font-weight="bold">make reproduce-smoke</text>
<text x="415.0" y="104.2" font-size="12" fill="#e5e7eb" text-anchor="middle">6 seeds, --network none</text>
<text x="415.0" y="119.2" font-size="12" fill="#e5e7eb" text-anchor="middle">limit 20 min</text>
<rect x="600" y="60" width="270" height="80" rx="8" fill="#1f2937" stroke="#e5e7eb" stroke-width="2"/>
<text x="735.0" y="89.2" font-size="12" fill="#e5e7eb" text-anchor="middle" font-weight="bold">runs/smoke/expected.json</text>
<text x="735.0" y="104.2" font-size="12" fill="#e5e7eb" text-anchor="middle">= actual.json ?</text>
<text x="735.0" y="119.2" font-size="12" fill="#e5e7eb" text-anchor="middle">outcomes identical (gate)</text>
<line x1="230" y1="100" x2="290" y2="100" stroke="#e5e7eb" stroke-width="2"/>
<polygon points="290,100 281.0,103.5 281.0,96.5" fill="#e5e7eb"/>
<line x1="540" y1="100" x2="600" y2="100" stroke="#e5e7eb" stroke-width="2"/>
<polygon points="600,100 591.0,103.5 591.0,96.5" fill="#e5e7eb"/>
<rect x="30" y="190" width="200" height="80" rx="8" fill="#1f2937" stroke="#a78bfa" stroke-width="2"/>
<text x="130.0" y="226.7" font-size="12" fill="#e5e7eb" text-anchor="middle" font-weight="bold">runs/final/metrics.json</text>
<text x="130.0" y="241.7" font-size="12" fill="#e5e7eb" text-anchor="middle">from CAP08 logs</text>
<rect x="290" y="190" width="250" height="80" rx="8" fill="#1f2937" stroke="#f97316" stroke-width="2"/>
<text x="415.0" y="219.2" font-size="12" fill="#e5e7eb" text-anchor="middle" font-weight="bold">report.md.tmpl</text>
<text x="415.0" y="234.2" font-size="12" fill="#e5e7eb" text-anchor="middle">{{metric:path|fmt}}</text>
<text x="415.0" y="249.2" font-size="12" fill="#e5e7eb" text-anchor="middle">render.py fails on unknown keys</text>
<rect x="600" y="190" width="270" height="80" rx="8" fill="#1f2937" stroke="#e5e7eb" stroke-width="2"/>
<text x="735.0" y="219.2" font-size="12" fill="#e5e7eb" text-anchor="middle" font-weight="bold">report.md</text>
<text x="735.0" y="234.2" font-size="12" fill="#e5e7eb" text-anchor="middle">8+ references, limitations,</text>
<text x="735.0" y="249.2" font-size="12" fill="#e5e7eb" text-anchor="middle">simulation only, model card</text>
<line x1="230" y1="230" x2="290" y2="230" stroke="#e5e7eb" stroke-width="2"/>
<polygon points="290,230 281.0,233.5 281.0,226.5" fill="#e5e7eb"/>
<line x1="540" y1="230" x2="600" y2="230" stroke="#e5e7eb" stroke-width="2"/>
<polygon points="600,230 591.0,233.5 591.0,226.5" fill="#e5e7eb"/>
<rect x="30" y="320" width="200" height="90" rx="8" fill="#1f2937" stroke="#38bdf8" stroke-width="2"/>
<text x="130.0" y="354.2" font-size="12" fill="#e5e7eb" text-anchor="middle" font-weight="bold">docs/scores.json</text>
<text x="130.0" y="369.2" font-size="12" fill="#e5e7eb" text-anchor="middle">automated fraction,</text>
<text x="130.0" y="384.2" font-size="12" fill="#e5e7eb" text-anchor="middle">rubric 0-4, gates</text>
<rect x="290" y="320" width="250" height="90" rx="8" fill="#1f2937" stroke="#ef4444" stroke-width="2"/>
<text x="415.0" y="354.2" font-size="12" fill="#e5e7eb" text-anchor="middle" font-weight="bold">tools/graduate.py</text>
<text x="415.0" y="369.2" font-size="12" fill="#e5e7eb" text-anchor="middle">gates, each milestone &gt;= 60,</text>
<text x="415.0" y="384.2" font-size="12" fill="#e5e7eb" text-anchor="middle">total &gt;= 70, 0 safety violations</text>
<rect x="600" y="320" width="270" height="90" rx="8" fill="#1f2937" stroke="#a3e635" stroke-width="2"/>
<text x="735.0" y="354.2" font-size="12" fill="#e5e7eb" text-anchor="middle" font-weight="bold">Verdict</text>
<text x="735.0" y="369.2" font-size="12" fill="#e5e7eb" text-anchor="middle">Pass 70, Merit 80,</text>
<text x="735.0" y="384.2" font-size="12" fill="#e5e7eb" text-anchor="middle">Distinction 90 + stretch</text>
<line x1="230" y1="365" x2="290" y2="365" stroke="#e5e7eb" stroke-width="2"/>
<polygon points="290,365 281.0,368.5 281.0,361.5" fill="#e5e7eb"/>
<line x1="540" y1="365" x2="600" y2="365" stroke="#e5e7eb" stroke-width="2"/>
<polygon points="600,365 591.0,368.5 591.0,361.5" fill="#e5e7eb"/>
<text x="450" y="440" font-size="13" fill="#e5e7eb" text-anchor="middle">No number is typed by hand; the hardware tier never replaces a failing gate.</text>
</svg>
