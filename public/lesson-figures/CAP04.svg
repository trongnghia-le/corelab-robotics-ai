<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 490" font-family="Inter, Arial, sans-serif" role="img">
<title>CAP04: from lidar scans to wheel commands</title>
<desc>Pipeline: lidar scan and EKF pose feed a log-odds occupancy grid, which is inflated into a costmap, planned with A star, tracked by pure pursuit into a wheel command; a monitor stops and replans when an obstacle appears; a profile shows lethal, inscribed and inflation zones.</desc>
<rect width="900" height="490" fill="#191b1f" rx="12"/>
<text x="450" y="30" font-size="17" fill="#e5e7eb" text-anchor="middle" font-weight="bold">CAP04: scan + pose in, safe wheel command out</text>
<rect x="20" y="70" width="150" height="64" rx="8" fill="#272a2f" stroke="#53b2dd" stroke-width="2"/>
<text x="95.0" y="98.7" font-size="12" fill="#e5e7eb" text-anchor="middle" font-weight="bold">ScanSample</text>
<text x="95.0" y="113.7" font-size="12" fill="#e5e7eb" text-anchor="middle">lidar ranges</text>
<rect x="20" y="160" width="150" height="64" rx="8" fill="#272a2f" stroke="#53b2dd" stroke-width="2"/>
<text x="95.0" y="188.7" font-size="12" fill="#e5e7eb" text-anchor="middle" font-weight="bold">Pose2DCov</text>
<text x="95.0" y="203.7" font-size="12" fill="#e5e7eb" text-anchor="middle">EKF (CAP03)</text>
<rect x="215" y="100" width="160" height="84" rx="8" fill="#272a2f" stroke="#9ccd4e" stroke-width="2"/>
<text x="295.0" y="131.2" font-size="12" fill="#e5e7eb" text-anchor="middle" font-weight="bold">Occupancy grid</text>
<text x="295.0" y="146.2" font-size="12" fill="#e5e7eb" text-anchor="middle">log-odds, 5 cm</text>
<text x="295.0" y="161.2" font-size="12" fill="#e5e7eb" text-anchor="middle">clamp [-4, 4]</text>
<rect x="420" y="100" width="160" height="84" rx="8" fill="#272a2f" stroke="#9ccd4e" stroke-width="2"/>
<text x="500.0" y="131.2" font-size="12" fill="#e5e7eb" text-anchor="middle" font-weight="bold">Costmap</text>
<text x="500.0" y="146.2" font-size="12" fill="#e5e7eb" text-anchor="middle">lethal / inscribed</text>
<text x="500.0" y="161.2" font-size="12" fill="#e5e7eb" text-anchor="middle">inflation decay</text>
<rect x="625" y="70" width="150" height="64" rx="8" fill="#272a2f" stroke="#ddb242" stroke-width="2"/>
<text x="700.0" y="98.7" font-size="12" fill="#e5e7eb" text-anchor="middle" font-weight="bold">A* (8-conn.)</text>
<text x="700.0" y="113.7" font-size="12" fill="#e5e7eb" text-anchor="middle">octile heuristic</text>
<rect x="625" y="160" width="150" height="64" rx="8" fill="#272a2f" stroke="#ddb242" stroke-width="2"/>
<text x="700.0" y="188.7" font-size="12" fill="#e5e7eb" text-anchor="middle" font-weight="bold">Pure pursuit</text>
<text x="700.0" y="203.7" font-size="12" fill="#e5e7eb" text-anchor="middle">kappa = 2y / L^2</text>
<rect x="790" y="115" width="96" height="64" rx="8" fill="#272a2f" stroke="#e5e7eb" stroke-width="2"/>
<text x="838.0" y="143.7" font-size="12" fill="#e5e7eb" text-anchor="middle" font-weight="bold">WheelCmd</text>
<text x="838.0" y="158.7" font-size="12" fill="#e5e7eb" text-anchor="middle">v, w</text>
<line x1="170" y1="102" x2="215" y2="128" stroke="#e5e7eb" stroke-width="2"/>
<polygon points="215,128 205.5,126.5 209.0,120.5" fill="#e5e7eb"/>
<line x1="170" y1="192" x2="215" y2="160" stroke="#e5e7eb" stroke-width="2"/>
<polygon points="215,160 209.7,168.1 205.6,162.4" fill="#e5e7eb"/>
<line x1="375" y1="142" x2="420" y2="142" stroke="#e5e7eb" stroke-width="2"/>
<polygon points="420,142 411.0,145.5 411.0,138.5" fill="#e5e7eb"/>
<line x1="580" y1="125" x2="625" y2="102" stroke="#e5e7eb" stroke-width="2"/>
<polygon points="625,102 618.6,109.2 615.4,103.0" fill="#e5e7eb"/>
<line x1="700" y1="134" x2="700" y2="160" stroke="#e5e7eb" stroke-width="2"/>
<polygon points="700,160 696.5,151.0 703.5,151.0" fill="#e5e7eb"/>
<line x1="775" y1="192" x2="812" y2="179" stroke="#e5e7eb" stroke-width="2"/>
<polygon points="812,179 804.7,185.3 802.3,178.7" fill="#e5e7eb"/>
<rect x="300" y="250" width="300" height="62" rx="8" fill="#272a2f" stroke="#e58484" stroke-width="2" stroke-dasharray="5 4"/>
<text x="450.0" y="277.7" font-size="12" fill="#e5e7eb" text-anchor="middle" font-weight="bold">Monitor: stop / replan / blocked</text>
<text x="450.0" y="292.7" font-size="12" fill="#e5e7eb" text-anchor="middle">clearance &lt; threshold, no path, timeout</text>
<line x1="500" y1="250" x2="500" y2="186" stroke="#e58484" stroke-width="2" stroke-dasharray="5 4"/>
<polygon points="500,186 503.5,195.0 496.5,195.0" fill="#e58484"/>
<line x1="600" y1="281" x2="838" y2="281" stroke="#e58484" stroke-width="2"/>
<line x1="838" y1="281" x2="838" y2="181" stroke="#e58484" stroke-width="2" stroke-dasharray="5 4"/>
<polygon points="838,181 841.5,190.0 834.5,190.0" fill="#e58484"/>
<text x="450" y="342" font-size="13" fill="#e5e7eb" text-anchor="middle" font-weight="bold">Cost profile away from an obstacle (distance d)</text>
<line x1="140" y1="430" x2="760" y2="430" stroke="#a0a4ab" stroke-width="1"/>
<line x1="140" y1="360" x2="140" y2="430" stroke="#a0a4ab" stroke-width="1"/>
<rect x="140" y="360" width="120" height="70" fill="#712b2b" opacity="0.7"/>
<polyline points="260,360 320,382 440,412 560,430" fill="none" stroke="#ddb242" stroke-width="2"/>
<text x="200" y="399.0" font-size="12" fill="#e5e7eb" text-anchor="middle">lethal (254)</text>
<text x="260" y="446" font-size="11" fill="#e5e7eb" text-anchor="middle">inscribed r</text>
<text x="560" y="446" font-size="11" fill="#e5e7eb" text-anchor="middle">inflation radius</text>
<text x="660" y="394" font-size="12" fill="#e5e7eb" text-anchor="middle">free (0)</text>
<text x="440" y="376" font-size="12" fill="#ddb242" text-anchor="middle">cost = 253 exp(-k (d - r_in))</text>
<text x="450" y="478" font-size="12" fill="#a0a4ab" text-anchor="middle">Every arrow carries a dataclass from interfaces.py; the pipeline never reads simulator truth.</text>
</svg>
