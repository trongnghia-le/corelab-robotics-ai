<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" font-family="Inter, sans-serif">
<title>Rank decides: one solution, infinitely many, or none</title>
<desc>Three pairs of lines in the plane: x+y=3 and x-y=1 meet at (2,1); x+y=3 and 2x+2y=6 coincide so every point of the line is a solution; x+y=3 and 2x+2y=7 are parallel with no common point.</desc>
<defs></defs>
<rect width="900" height="440" rx="14" fill="#17181b"/>
<text x="32" y="44" font-size="22" fill="#e9e7e3" text-anchor="start" font-weight="bold">Rank decides: one solution, infinitely many, or none</text>
<rect x="32" y="64" width="268" height="344" rx="8" fill="#22252a" stroke="#3d4148" stroke-width="1.5"/>
<text x="48" y="94" font-size="17" fill="#e9e7e3" text-anchor="start" font-weight="bold">Rank 2: independent rows</text>
<line x1="74" y1="300" x2="254" y2="300" stroke="#a7adb5" stroke-width="1.5" stroke-linecap="round"/>
<line x1="74" y1="300" x2="74" y2="120" stroke="#a7adb5" stroke-width="1.5" stroke-linecap="round"/>
<line x1="114" y1="300" x2="114" y2="305" stroke="#a7adb5" stroke-width="1.5" stroke-linecap="round"/>
<line x1="69" y1="260" x2="74" y2="260" stroke="#a7adb5" stroke-width="1.5" stroke-linecap="round"/>
