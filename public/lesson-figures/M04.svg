<line x1="69" y1="220" x2="74" y2="220" stroke="#a7adb5" stroke-width="1.5" stroke-linecap="round"/>
<line x1="194" y1="300" x2="194" y2="305" stroke="#a7adb5" stroke-width="1.5" stroke-linecap="round"/>
<line x1="69" y1="180" x2="74" y2="180" stroke="#a7adb5" stroke-width="1.5" stroke-linecap="round"/>
<line x1="234" y1="300" x2="234" y2="305" stroke="#a7adb5" stroke-width="1.5" stroke-linecap="round"/>
<line x1="69" y1="140" x2="74" y2="140" stroke="#a7adb5" stroke-width="1.5" stroke-linecap="round"/>
<text x="154" y="322" font-size="14" fill="#a7adb5" text-anchor="middle">2</text>
<text x="64" y="225" font-size="14" fill="#a7adb5" text-anchor="end">2</text>
<text x="234" y="322" font-size="14" fill="#a7adb5" text-anchor="middle">4</text>
<text x="64" y="145" font-size="14" fill="#a7adb5" text-anchor="end">4</text>
<line x1="74" y1="180" x2="194" y2="300" stroke="#86abe2" stroke-width="2.5" stroke-linecap="round"/>
<line x1="114" y1="300" x2="254" y2="160" stroke="#e0904f" stroke-width="2.5" stroke-linecap="round"/>
<circle cx="154" cy="260" r="6" fill="#6fc693"/>
<text x="88" y="146" font-size="15" fill="#86abe2" text-anchor="start" font-weight="600">x + y = 3</text>
<text x="254" y="140" font-size="15" fill="#e0904f" text-anchor="end" font-weight="600">x − y = 1</text>
<text x="154" y="228" font-size="15" fill="#6fc693" text-anchor="middle" font-weight="600">(2, 1)</text>
<text x="48" y="352" font-size="15" fill="#6fc693" text-anchor="start" font-weight="600">one solution (2, 1)</text>
<text x="48" y="376" font-size="14" fill="#a7adb5" text-anchor="start">rank 2 = number of unknowns</text>
<rect x="316" y="64" width="268" height="344" rx="8" fill="#22252a" stroke="#3d4148" stroke-width="1.5"/>
<text x="332" y="94" font-size="17" fill="#e9e7e3" text-anchor="start" font-weight="bold">Rank 1: same line</text>
<line x1="358" y1="300" x2="538" y2="300" stroke="#a7adb5" stroke-width="1.5" stroke-linecap="round"/>
<line x1="358" y1="300" x2="358" y2="120" stroke="#a7adb5" stroke-width="1.5" stroke-linecap="round"/>
<line x1="398" y1="300" x2="398" y2="305" stroke="#a7adb5" stroke-width="1.5" stroke-linecap="round"/>
<line x1="353" y1="260" x2="358" y2="260" stroke="#a7adb5" stroke-width="1.5" stroke-linecap="round"/>
