<line x1="353" y1="140" x2="358" y2="140" stroke="#a7adb5" stroke-width="1.5" stroke-linecap="round"/>
<text x="438" y="322" font-size="14" fill="#a7adb5" text-anchor="middle">2</text>
<text x="348" y="225" font-size="14" fill="#a7adb5" text-anchor="end">2</text>
<text x="518" y="322" font-size="14" fill="#a7adb5" text-anchor="middle">4</text>
<text x="348" y="145" font-size="14" fill="#a7adb5" text-anchor="end">4</text>
<line x1="358" y1="180" x2="478" y2="300" stroke="#86abe2" stroke-width="5" stroke-linecap="round"/>
<line x1="358" y1="180" x2="478" y2="300" stroke="#e0904f" stroke-width="2" stroke-linecap="round" stroke-dasharray="7 5"/>
<text x="374" y="152" font-size="15" fill="#86abe2" text-anchor="start" font-weight="600">x + y = 3</text>
<text x="374" y="126" font-size="15" fill="#e0904f" text-anchor="start" font-weight="600">2x + 2y = 6</text>
<circle cx="478" cy="300" r="6" fill="#6fc693"/>
<text x="490" y="292" font-size="15" fill="#6fc693" text-anchor="start" font-weight="600">(3, 0)</text>
<circle cx="398" cy="220" r="6" fill="#6fc693"/>
<text x="410" y="214" font-size="15" fill="#6fc693" text-anchor="start" font-weight="600">(1, 2)</text>
<text x="332" y="352" font-size="15" fill="#6fc693" text-anchor="start" font-weight="600">infinitely many solutions</text>
<text x="332" y="376" font-size="14" fill="#a7adb5" text-anchor="start">rank 1, b on the column line</text>
<rect x="600" y="64" width="268" height="344" rx="8" fill="#22252a" stroke="#3d4148" stroke-width="1.5"/>
<text x="616" y="94" font-size="17" fill="#e9e7e3" text-anchor="start" font-weight="bold">Rank 1: parallel lines</text>
<line x1="642" y1="300" x2="822" y2="300" stroke="#a7adb5" stroke-width="1.5" stroke-linecap="round"/>
<line x1="642" y1="300" x2="642" y2="120" stroke="#a7adb5" stroke-width="1.5" stroke-linecap="round"/>
<line x1="682" y1="300" x2="682" y2="305" stroke="#a7adb5" stroke-width="1.5" stroke-linecap="round"/>
<line x1="637" y1="260" x2="642" y2="260" stroke="#a7adb5" stroke-width="1.5" stroke-linecap="round"/>
<line x1="722" y1="300" x2="722" y2="305" stroke="#a7adb5" stroke-width="1.5" stroke-linecap="round"/>
<line x1="637" y1="220" x2="642" y2="220" stroke="#a7adb5" stroke-width="1.5" stroke-linecap="round"/>
<line x1="762" y1="300" x2="762" y2="305" stroke="#a7adb5" stroke-width="1.5" stroke-linecap="round"/>
<line x1="637" y1="180" x2="642" y2="180" stroke="#a7adb5" stroke-width="1.5" stroke-linecap="round"/>
<line x1="802" y1="300" x2="802" y2="305" stroke="#a7adb5" stroke-width="1.5" stroke-linecap="round"/>
<line x1="637" y1="140" x2="642" y2="140" stroke="#a7adb5" stroke-width="1.5" stroke-linecap="round"/>
<text x="722" y="322" font-size="14" fill="#a7adb5" text-anchor="middle">2</text>
<text x="632" y="225" font-size="14" fill="#a7adb5" text-anchor="end">2</text>
<text x="802" y="322" font-size="14" fill="#a7adb5" text-anchor="middle">4</text>
<text x="632" y="145" font-size="14" fill="#a7adb5" text-anchor="end">4</text>
<line x1="642" y1="180" x2="762" y2="300" stroke="#86abe2" stroke-width="2.5" stroke-linecap="round"/>
<line x1="642" y1="160" x2="782" y2="300" stroke="#e0904f" stroke-width="2.5" stroke-linecap="round"/>
<text x="650" y="280" font-size="15" fill="#86abe2" text-anchor="start" font-weight="600">x + y = 3</text>
<text x="658" y="128" font-size="15" fill="#e0904f" text-anchor="start" font-weight="600">2x + 2y = 7</text>
<text x="616" y="352" font-size="15" fill="#e58a80" text-anchor="start" font-weight="600">no solution</text>
<text x="616" y="376" font-size="14" fill="#a7adb5" text-anchor="start">rank 1, b off the column line</text>
</svg>
