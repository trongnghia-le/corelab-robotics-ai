<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" font-family="Inter, Arial, sans-serif" font-size="14">
<rect width="720" height="340" fill="#111827" rx="12"/>
<g fill="#e5e7eb">
<text x="24" y="32" font-size="15" font-weight="bold">Independent rows: one solution</text>
<text x="384" y="32" font-size="15" font-weight="bold">Dependent rows: none or infinitely many</text>
<text x="170" y="150" fill="#38bdf8">x + y = 3</text>
<text x="190" y="236" fill="#f97316">x - y = 1</text>
<text x="152" y="196" fill="#a3e635">(2, 1)</text>
<text x="24" y="310" font-size="13">rank 2: columns independent, nullspace is only {0}</text>
<text x="384" y="310" font-size="13">rank 1: identical columns, nullspace contains (1, -1)</text>
<text x="500" y="108" fill="#38bdf8">x + y = 3</text>
<text x="500" y="76" fill="#f97316">2x + 2y = 7  (no solution)</text>
<text x="545" y="272" font-size="13">x</text><text x="404" y="80" font-size="13">y</text>
<text x="215" y="272" font-size="13">x</text><text x="44" y="80" font-size="13">y</text>
<text x="384" y="286" font-size="13" fill="#a3e635">2x + 2y = 6 would coincide: a whole line of solutions</text>
</g>
<g stroke="#e5e7eb" stroke-width="1.5"><line x1="50" y1="260" x2="230" y2="260"/><line x1="50" y1="260" x2="50" y2="90"/><line x1="410" y1="260" x2="560" y2="260"/><line x1="410" y1="260" x2="410" y2="90"/></g>
<line x1="50" y1="110" x2="200" y2="260" stroke="#38bdf8" stroke-width="3"/>
<line x1="100" y1="260" x2="200" y2="160" stroke="#f97316" stroke-width="3"/>
<circle cx="150" cy="210" r="6" fill="#a3e635"/>
<line x1="410" y1="130" x2="540" y2="260" stroke="#38bdf8" stroke-width="3"/>
<line x1="410" y1="100" x2="560" y2="250" stroke="#f97316" stroke-width="3"/>
</svg>