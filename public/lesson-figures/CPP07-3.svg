<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" font-family="Inter, sans-serif">
<title>Steps that run after touching one file</title>
<desc>Stacked bars of compile, archive and link steps measured after touching three files of the lab project.</desc>
<rect width="900" height="430" rx="14" fill="#17181b"/>
<defs><marker id="ahd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#a7adb5"/></marker></defs>
<text x="32" y="44" font-size="22" font-weight="700" fill="#e9e7e3">Steps that run after touching one file</text>
<line x1="300" y1="100" x2="300" y2="372" stroke="#3d4148" stroke-width="1.5"/>
<line x1="300" y1="100" x2="300" y2="372" stroke="#2c3036" stroke-width="1"/>
<text x="300" y="392" font-size="14" fill="#a7adb5" text-anchor="middle">0</text>
<line x1="380" y1="100" x2="380" y2="372" stroke="#2c3036" stroke-width="1"/>
<text x="380" y="392" font-size="14" fill="#a7adb5" text-anchor="middle">1</text>
<line x1="460" y1="100" x2="460" y2="372" stroke="#2c3036" stroke-width="1"/>
