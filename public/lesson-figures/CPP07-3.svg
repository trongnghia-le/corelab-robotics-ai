<line x1="620" y1="100" x2="620" y2="372" stroke="#2c3036" stroke-width="1"/>
<text x="620" y="392" font-size="14" fill="#a7adb5" text-anchor="middle">4</text>
<line x1="700" y1="100" x2="700" y2="372" stroke="#2c3036" stroke-width="1"/>
<text x="700" y="392" font-size="14" fill="#a7adb5" text-anchor="middle">5</text>
<line x1="780" y1="100" x2="780" y2="372" stroke="#2c3036" stroke-width="1"/>
<text x="780" y="392" font-size="14" fill="#a7adb5" text-anchor="middle">6</text>
