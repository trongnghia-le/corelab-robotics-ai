<text x="32" y="456" font-size="14" fill="#a7adb5" text-anchor="start">set(r) = floor(8 N r / 64) mod 64;  step d = (N/8) mod 64 when 8N is a multiple of 64.</text>
<text x="32" y="478" font-size="14" fill="#a7adb5" text-anchor="start">Cache: 32 KiB, 8-way, 64 B lines, 64 sets.</text>
