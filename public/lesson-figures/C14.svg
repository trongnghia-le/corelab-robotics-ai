<text x="44" y="154" fill="#53b2dd" font-size="15" text-anchor="start" font-family="Inter, Arial, sans-serif">1  Balance</text>
<text x="44" y="174" fill="#e5e7eb" font-size="13" text-anchor="start" font-family="Inter, Arial, sans-serif">COM / CoP inside the support</text>
<line x1="195" y1="186" x2="195" y2="200" stroke="#e5e7eb" stroke-width="2" marker-end="url(#a)"/>
<rect x="30" y="200" width="330" height="56" rx="6" fill="none" stroke="#9ccd4e" stroke-width="2"/>
