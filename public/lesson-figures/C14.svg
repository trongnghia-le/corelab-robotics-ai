<text x="44" y="84" fill="#d97936" font-size="15" text-anchor="start" font-family="Inter, Arial, sans-serif">0  Physics and limits (hard)</text>
<text x="44" y="104" fill="#e5e7eb" font-size="13" text-anchor="start" font-family="Inter, Arial, sans-serif">dynamics, friction cone, λn ≥ 0, |τ| ≤ τmax</text>
<line x1="195" y1="116" x2="195" y2="130" stroke="#e5e7eb" stroke-width="2" marker-end="url(#a)"/>
