<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400">
<rect width="760" height="400" fill="#191b1f" rx="12"/>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#e5e7eb"/></marker></defs>
<text x="24" y="30" fill="#e5e7eb" font-size="16" text-anchor="start" font-family="Inter, Arial, sans-serif">Whole-body control: hard constraints first, then prioritised tasks</text>
