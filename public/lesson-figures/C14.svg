<text x="44" y="244" fill="#e5e7eb" font-size="13" text-anchor="start" font-family="Inter, Arial, sans-serif">hand pose / height</text>
<line x1="195" y1="256" x2="195" y2="270" stroke="#e5e7eb" stroke-width="2" marker-end="url(#a)"/>
<rect x="30" y="270" width="330" height="56" rx="6" fill="none" stroke="#e5e7eb" stroke-width="2"/>
<text x="44" y="294" fill="#e5e7eb" font-size="15" text-anchor="start" font-family="Inter, Arial, sans-serif">3  Posture</text>
<text x="44" y="314" fill="#e5e7eb" font-size="13" text-anchor="start" font-family="Inter, Arial, sans-serif">stay near a nominal pose</text>
<text x="30" y="350" fill="#e5e7eb" font-size="13" text-anchor="start" font-family="Inter, Arial, sans-serif">each level is solved in the null space of the levels above</text>
<text x="30" y="372" fill="#e5e7eb" font-size="13" text-anchor="start" font-family="Inter, Arial, sans-serif">(or by a lexicographic QP)</text>
