<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" font-family="Inter, Arial, sans-serif" font-size="14">
<defs>
<marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#a3e635"/></marker>
<marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#f97316"/></marker>
</defs>
<rect width="760" height="420" fill="#111827" rx="12"/>
<text x="380" y="30" fill="#e5e7eb" font-size="16" text-anchor="middle">A repeatable checkpoint bonus creates a reward loophole</text>
<g stroke="#e5e7eb" stroke-width="2" fill="none">
<rect x="40" y="150" width="100" height="70"/><rect x="140" y="150" width="100" height="70"/><rect x="240" y="150" width="100" height="70"/>
<rect x="340" y="150" width="100" height="70" stroke="#f97316" stroke-width="3"/><rect x="440" y="150" width="100" height="70"/><rect x="540" y="150" width="100" height="70" stroke="#a3e635" stroke-width="3"/>
</g>
<g fill="#e5e7eb" text-anchor="middle">
<text x="90" y="192">0 start</text><text x="190" y="192">1</text><text x="290" y="192">2</text><text x="390" y="192" fill="#f97316">3 checkpoint</text><text x="490" y="192">4</text><text x="590" y="192" fill="#a3e635">5 goal</text>
</g>
<text x="390" y="140" fill="#f97316" text-anchor="middle">+2 on every entry</text>
<text x="590" y="140" fill="#a3e635" text-anchor="middle">+10, episode ends</text>
<text x="190" y="140" fill="#e5e7eb" text-anchor="middle">-0.1 per step</text>
<path d="M90 235 L590 235" stroke="#a3e635" stroke-width="3" marker-end="url(#g)"/>
<text x="340" y="262" fill="#a3e635" text-anchor="middle">intended: walk 0 to 5 in 5 steps</text>
<path d="M300 295 Q 340 330 380 295" fill="none" stroke="#f97316" stroke-width="3" marker-end="url(#o)"/>
<path d="M380 305 Q 340 340 300 305" fill="none" stroke="#f97316" stroke-width="3" marker-end="url(#o)"/>
<text x="340" y="365" fill="#f97316" text-anchor="middle">loophole: bounce 2 and 3 forever</text>
<text x="640" y="305" fill="#e5e7eb" text-anchor="end">from cell 2, gamma = 0.95:</text>
<text x="640" y="328" fill="#f97316" text-anchor="end">loop value 18.51</text>
<text x="640" y="351" fill="#a3e635" text-anchor="end">finish value 10.83</text>
<text x="640" y="392" fill="#e5e7eb" text-anchor="end">the proxy prefers the loop; success rate is 0</text>
</svg>
