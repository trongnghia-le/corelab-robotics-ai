<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" font-family="Inter, Arial, sans-serif" role="img">
<title>CAP08: nominal world and sealed twin, one stack, honest statistics</title>
<desc>The same CoreBot stack runs on the nominal world and on a sealed perturbed twin. Episodes are written to episodes.jsonl. metrics.py recomputes Wilson bounds, paired McNemar tests, bootstrap intervals and the failure table. Tuning seeds are kept apart from evaluation seeds, and a system-identification loop recalibrates against twin experiments.</desc>
<rect width="900" height="480" fill="#111827" rx="12"/>
<text x="450" y="28" font-size="18" fill="#e5e7eb" text-anchor="middle" font-weight="bold">CAP08: one stack, two worlds, numbers recomputed from logs</text>
<rect x="30" y="60" width="230" height="80" rx="8" fill="#1f2937" stroke="#38bdf8" stroke-width="2"/>
<text x="145.0" y="89.2" font-size="12" fill="#e5e7eb" text-anchor="middle" font-weight="bold">Nominal world</text>
<text x="145.0" y="104.2" font-size="12" fill="#e5e7eb" text-anchor="middle">seeds 1000-1119 (n=120)</text>
<text x="145.0" y="119.2" font-size="12" fill="#e5e7eb" text-anchor="middle">ablations: 30 paired seeds</text>
<rect x="30" y="170" width="230" height="80" rx="8" fill="#1f2937" stroke="#f97316" stroke-width="2" stroke-dasharray="5 4"/>
<text x="145.0" y="191.7" font-size="12" fill="#e5e7eb" text-anchor="middle" font-weight="bold">Sealed twin (hidden)</text>
<text x="145.0" y="206.7" font-size="12" fill="#e5e7eb" text-anchor="middle">seeds 2000-2079 (n=80)</text>
<text x="145.0" y="221.7" font-size="12" fill="#e5e7eb" text-anchor="middle">radius, track, mass, friction,</text>
<text x="145.0" y="236.7" font-size="12" fill="#e5e7eb" text-anchor="middle">latency, lidar noise</text>
<rect x="330" y="100" width="200" height="110" rx="8" fill="#1f2937" stroke="#a3e635" stroke-width="2"/>
<text x="430.0" y="136.7" font-size="12" fill="#e5e7eb" text-anchor="middle" font-weight="bold">Full stack</text>
<text x="430.0" y="151.7" font-size="12" fill="#e5e7eb" text-anchor="middle">parse, localise, plan,</text>
<text x="430.0" y="166.7" font-size="12" fill="#e5e7eb" text-anchor="middle">perceive, grasp, place</text>
<text x="430.0" y="181.7" font-size="12" fill="#e5e7eb" text-anchor="middle">safety supervisor</text>
<line x1="260" y1="100" x2="330" y2="140" stroke="#e5e7eb" stroke-width="2"/>
<polygon points="330,140 320.4,138.6 323.9,132.5" fill="#e5e7eb"/>
<line x1="260" y1="210" x2="330" y2="170" stroke="#e5e7eb" stroke-width="2"/>
<polygon points="330,170 323.9,177.5 320.4,171.4" fill="#e5e7eb"/>
<rect x="600" y="60" width="270" height="70" rx="8" fill="#1f2937" stroke="#e5e7eb" stroke-width="2"/>
<text x="735.0" y="84.2" font-size="12" fill="#e5e7eb" text-anchor="middle" font-weight="bold">runs/final/episodes.jsonl</text>
<text x="735.0" y="99.2" font-size="12" fill="#e5e7eb" text-anchor="middle">seed, split, success, cause,</text>
<text x="735.0" y="114.2" font-size="12" fill="#e5e7eb" text-anchor="middle">timings, safety, git hash</text>
<line x1="530" y1="150" x2="600" y2="110" stroke="#e5e7eb" stroke-width="2"/>
<polygon points="600,110 593.9,117.5 590.4,111.4" fill="#e5e7eb"/>
<rect x="600" y="170" width="270" height="110" rx="8" fill="#1f2937" stroke="#a78bfa" stroke-width="2"/>
<text x="735.0" y="206.7" font-size="12" fill="#e5e7eb" text-anchor="middle" font-weight="bold">bench/metrics.py</text>
<text x="735.0" y="221.7" font-size="12" fill="#e5e7eb" text-anchor="middle">Wilson bounds, McNemar (Holm),</text>
<text x="735.0" y="236.7" font-size="12" fill="#e5e7eb" text-anchor="middle">bootstrap CI, Newcombe gap,</text>
<text x="735.0" y="251.7" font-size="12" fill="#e5e7eb" text-anchor="middle">failure table, latency median</text>
<line x1="735" y1="130" x2="735" y2="170" stroke="#e5e7eb" stroke-width="2"/>
<polygon points="735,170 731.5,161.0 738.5,161.0" fill="#e5e7eb"/>
<rect x="600" y="320" width="270" height="64" rx="8" fill="#1f2937" stroke="#e5e7eb" stroke-width="2"/>
<text x="735.0" y="356.2" font-size="12" fill="#e5e7eb" text-anchor="middle" font-weight="bold">metrics.json  -&gt;  report, tests</text>
<line x1="735" y1="280" x2="735" y2="320" stroke="#e5e7eb" stroke-width="2"/>
<polygon points="735,320 731.5,311.0 738.5,311.0" fill="#e5e7eb"/>
<rect x="30" y="310" width="230" height="70" rx="8" fill="#1f2937" stroke="#ef4444" stroke-width="2"/>
<text x="145.0" y="341.7" font-size="12" fill="#e5e7eb" text-anchor="middle" font-weight="bold">Tuning seeds 0-99</text>
<text x="145.0" y="356.7" font-size="12" fill="#e5e7eb" text-anchor="middle">never in evaluation</text>
<rect x="330" y="310" width="200" height="70" rx="8" fill="#1f2937" stroke="#f97316" stroke-width="2"/>
<text x="430.0" y="341.7" font-size="12" fill="#e5e7eb" text-anchor="middle" font-weight="bold">Sysid on twin experiments</text>
<text x="430.0" y="356.7" font-size="12" fill="#e5e7eb" text-anchor="middle">radius, track, friction</text>
<line x1="130" y1="250" x2="330" y2="330" stroke="#f97316" stroke-width="2" stroke-dasharray="5 4"/>
<polygon points="330,330 320.3,329.9 322.9,323.4" fill="#f97316"/>
<line x1="530" y1="345" x2="600" y2="345" stroke="#f97316" stroke-width="2" stroke-dasharray="5 4"/>
<polygon points="600,345 591.0,348.5 591.0,341.5" fill="#f97316"/>
<text x="450" y="430" font-size="13" fill="#e5e7eb" text-anchor="middle">A twin gap estimates sensitivity to one family of errors, not reality. Seeds are the experimental unit.</text>
<text x="450" y="452" font-size="12" fill="#9ca3af" text-anchor="middle">Dashed orange: allowed only as experiments, never by reading the hidden parameters.</text>
</svg>
