<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="Inter, Arial, sans-serif">
<rect width="760" height="400" fill="#111827" rx="12"/>
<text x="20" y="30" font-size="16" font-weight="bold" fill="#e5e7eb">Cache lines: 64 bytes = 8 doubles</text>
<text x="20" y="58" font-size="14" fill="#38bdf8">vector: one line load serves 8 elements</text>
<g stroke="#e5e7eb" stroke-width="1.5" fill="none">
<rect x="20" y="68" width="40" height="28"/><rect x="60" y="68" width="40" height="28"/><rect x="100" y="68" width="40" height="28"/><rect x="140" y="68" width="40" height="28"/><rect x="180" y="68" width="40" height="28"/><rect x="220" y="68" width="40" height="28"/><rect x="260" y="68" width="40" height="28"/><rect x="300" y="68" width="40" height="28"/>
</g>
<rect x="18" y="66" width="324" height="32" fill="none" stroke="#a3e635" stroke-width="3"/>
<text x="180" y="116" font-size="13" fill="#a3e635" text-anchor="middle">1 miss, 8 useful elements, prefetcher streams ahead</text>
<text x="400" y="58" font-size="14" fill="#f97316">shuffled list: one line per node</text>
<g stroke="#e5e7eb" stroke-width="1.5" fill="none">
<rect x="400" y="68" width="40" height="28"/><rect x="520" y="68" width="40" height="28"/><rect x="640" y="68" width="40" height="28"/>
</g>
<path d="M440 82 H518 M560 82 H638" stroke="#f97316" stroke-width="2" stroke-dasharray="4 3"/>
<text x="540" y="116" font-size="13" fill="#f97316" text-anchor="middle">each hop: new line, address unknown until loaded</text>
<text x="20" y="168" font-size="16" font-weight="bold" fill="#e5e7eb">Measured ns per element (log scale)</text>
<line x1="70" y1="360" x2="720" y2="360" stroke="#e5e7eb" stroke-width="2"/>
<line x1="70" y1="360" x2="70" y2="185" stroke="#e5e7eb" stroke-width="2"/>
<g font-size="13" fill="#e5e7eb">
<text x="20" y="364">0.7</text><text x="30" y="316">1</text><text x="30" y="254">10</text><text x="22" y="192">100+</text>
<text x="70" y="382" text-anchor="middle">10^3</text><text x="330" y="382" text-anchor="middle">10^5</text><text x="640" y="382" text-anchor="middle">4x10^6</text>
<text x="395" y="398" text-anchor="middle">n (elements)</text>
</g>
<polyline points="70,350 330,350 640,347" fill="none" stroke="#38bdf8" stroke-width="3"/>
<polyline points="70,325 330,260 640,198" fill="none" stroke="#f97316" stroke-width="3"/>
<g fill="#38bdf8"><circle cx="70" cy="350" r="4"/><circle cx="330" cy="350" r="4"/><circle cx="640" cy="347" r="4"/></g>
<g fill="#f97316"><circle cx="70" cy="325" r="4"/><circle cx="330" cy="260" r="4"/><circle cx="640" cy="198" r="4"/></g>
<text x="500" y="338" font-size="13" fill="#38bdf8">vector 0.76-0.92 ns</text>
<text x="300" y="232" font-size="13" fill="#f97316">shuffled list 1.9 / 14 / 140 ns</text>
