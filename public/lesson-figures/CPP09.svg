<text x="486" y="184" font-size="14" fill="#a7adb5" text-anchor="start">64 B loaded, 16 B used; next address unknown until loaded</text>
<text x="486" y="206" font-size="14" fill="#e0904f" text-anchor="start">2 / 8 slots</text>
