<rect x="626" y="118" width="12" height="40" rx="0" fill="#4a321c" stroke="#e0904f" stroke-width="1.5"/>
<rect x="638" y="118" width="12" height="40" rx="0" fill="none" stroke="#3d4148" stroke-width="1"/>
