<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="Inter, sans-serif">
<title>Cache lines decide the cost of one element</title>
<desc>Top: a vector uses all 8 doubles of a 64-byte cache line while a shuffled list uses 2 of 8 slots per node. Bottom: log-log plot of measured ns per element for n = 1,000, 100,000 and 4,000,000: the vector stays near 0.8 ns, the shuffled list rises from 1.88 to 14.4 to 140 ns.</desc>
<defs><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a7adb5"/></marker></defs>
<rect width="900" height="600" rx="14" fill="#17181b"/>
<text x="32" y="44" font-size="22" fill="#e9e7e3" text-anchor="start" font-weight="bold">Cache lines decide the cost of one element</text>
<rect x="32" y="68" width="406" height="150" rx="8" fill="#22252a" stroke="none" stroke-width="1.5"/>
<text x="48" y="94" font-size="17" fill="#e9e7e3" text-anchor="start" font-weight="bold">Vector: 8 doubles share one line</text>
<rect x="462" y="68" width="406" height="150" rx="8" fill="#22252a" stroke="none" stroke-width="1.5"/>
<text x="478" y="94" font-size="17" fill="#e9e7e3" text-anchor="start" font-weight="bold">Shuffled list: one line per node</text>
<rect x="56" y="118" width="44" height="40" rx="0" fill="#1c3a4a" stroke="#86abe2" stroke-width="1.5"/>
<rect x="100" y="118" width="44" height="40" rx="0" fill="#1c3a4a" stroke="#86abe2" stroke-width="1.5"/>
<rect x="144" y="118" width="44" height="40" rx="0" fill="#1c3a4a" stroke="#86abe2" stroke-width="1.5"/>
<rect x="188" y="118" width="44" height="40" rx="0" fill="#1c3a4a" stroke="#86abe2" stroke-width="1.5"/>
<rect x="232" y="118" width="44" height="40" rx="0" fill="#1c3a4a" stroke="#86abe2" stroke-width="1.5"/>
<rect x="276" y="118" width="44" height="40" rx="0" fill="#1c3a4a" stroke="#86abe2" stroke-width="1.5"/>
<rect x="320" y="118" width="44" height="40" rx="0" fill="#1c3a4a" stroke="#86abe2" stroke-width="1.5"/>
<rect x="364" y="118" width="44" height="40" rx="0" fill="#1c3a4a" stroke="#86abe2" stroke-width="1.5"/>
<text x="56" y="184" font-size="14" fill="#a7adb5" text-anchor="start">1 miss, then 7 hits; the prefetcher runs ahead</text>
<text x="56" y="206" font-size="14" fill="#a7adb5" text-anchor="start">64 B = 8 x 8 B</text>
<rect x="486" y="118" width="12" height="40" rx="0" fill="#4a321c" stroke="#e0904f" stroke-width="1.5"/>
