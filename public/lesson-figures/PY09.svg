<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" font-family="Inter, Arial, sans-serif">
<rect width="760" height="420" fill="#111827" rx="12"/>
<text x="380" y="28" fill="#e5e7eb" font-size="18" font-weight="bold" text-anchor="middle">Measure first: where the time goes, and what speedups can give</text>
<text x="40" y="62" fill="#f97316" font-size="15" font-weight="bold">1. Profile of the loop (cProfile, 160k points)</text>
<text x="40" y="102" fill="#e5e7eb" font-size="13">loop body (Python bytecode)</text><rect x="40" y="110" width="209.5" height="18" rx="3" fill="#f97316"/><text x="257.5" y="124" fill="#e5e7eb" font-size="13">0.128 s (78%)</text><text x="40" y="156" fill="#e5e7eb" font-size="13">math.cos</text><rect x="40" y="164" width="31.1" height="18" rx="3" fill="#38bdf8"/><text x="79.1" y="178" fill="#e5e7eb" font-size="13">0.019 s (12%)</text><text x="40" y="210" fill="#e5e7eb" font-size="13">math.sin</text><rect x="40" y="218" width="31.1" height="18" rx="3" fill="#38bdf8"/><text x="79.1" y="232" fill="#e5e7eb" font-size="13">0.019 s (12%)</text><text x="40" y="266" fill="#e5e7eb" font-size="13">Speeding up sin by 100× changes total time by</text><text x="40" y="286" fill="#e5e7eb" font-size="13">only 1/(0.885 + 0.115/100) = 1.13×.</text><text x="40" y="320" fill="#a3e635" font-size="13">The loop itself is the bottleneck, so remove the loop</text><text x="40" y="340" fill="#a3e635" font-size="13">(vectorize) rather than tuning cos and sin.</text><text x="430" y="62" fill="#38bdf8" font-size="15" font-weight="bold">2. Amdahl: speedup bound</text><rect x="450" y="90" width="270" height="218" fill="none" stroke="#374151"/><path d="M450.0,308.0 L456.8,305.5 L463.5,302.8 L470.2,299.8 L477.0,296.6 L483.8,293.1 L490.5,289.3 L497.2,285.2 L504.0,280.9 L510.8,276.2 L517.5,271.3 L524.2,266.1 L531.0,260.6 L537.8,254.8 L544.5,248.9 L551.2,242.7 L558.0,236.4 L564.8,229.9 L571.5,223.4 L578.2,216.8 L585.0,210.2 L591.8,203.6 L598.5,197.1 L605.2,190.8 L612.0,184.6 L618.8,178.6 L625.5,172.8 L632.2,167.3 L639.0,162.0 L645.8,157.0 L652.5,152.3 L659.2,147.9 L666.0,143.8 L672.8,140.0 L679.5,136.4 L686.2,133.1 L693.0,130.1 L699.8,127.4 L706.5,124.8 L713.2,122.5 L720.0,120.4" fill="none" stroke="#f97316" stroke-width="2.5"/><path d="M450.0,308.0 L456.8,306.7 L463.5,305.4 L470.2,304.1 L477.0,302.8 L483.8,301.6 L490.5,300.4 L497.2,299.2 L504.0,298.1 L510.8,297.1 L517.5,296.1 L524.2,295.1 L531.0,294.3 L537.8,293.4 L544.5,292.7 L551.2,292.0 L558.0,291.3 L564.8,290.7 L571.5,290.2 L578.2,289.7 L585.0,289.2 L591.8,288.8 L598.5,288.4 L605.2,288.1 L612.0,287.8 L618.8,287.5 L625.5,287.2 L632.2,287.0 L639.0,286.8 L645.8,286.6 L652.5,286.5 L659.2,286.3 L666.0,286.2 L672.8,286.1 L679.5,286.0 L686.2,285.9 L693.0,285.8 L699.8,285.7 L706.5,285.6 L713.2,285.6 L720.0,285.5" fill="none" stroke="#a3e635" stroke-width="2.5"/><path d="M450.0,308.0 L456.8,307.7 L463.5,307.4 L470.2,307.2 L477.0,307.0 L483.8,306.8 L490.5,306.6 L497.2,306.4 L504.0,306.3 L510.8,306.2 L517.5,306.0 L524.2,305.9 L531.0,305.8 L537.8,305.8 L544.5,305.7 L551.2,305.6 L558.0,305.5 L564.8,305.5 L571.5,305.4 L578.2,305.4 L585.0,305.4 L591.8,305.3 L598.5,305.3 L605.2,305.3 L612.0,305.2 L618.8,305.2 L625.5,305.2 L632.2,305.2 L639.0,305.2 L645.8,305.1 L652.5,305.1 L659.2,305.1 L666.0,305.1 L672.8,305.1 L679.5,305.1 L686.2,305.1 L693.0,305.1 L699.8,305.1 L706.5,305.1 L713.2,305.1 L720.0,305.1" fill="none" stroke="#e5e7eb" stroke-width="2.5"/><text x="716" y="115.47368421052633" fill="#f97316" font-size="13" text-anchor="end">p = 0.9 (limit 10×)</text><text x="716" y="279.0526315789474" fill="#a3e635" font-size="13" text-anchor="end">p = 0.5 (limit 2×)</text><text x="460" y="147.3684210526316" fill="#e5e7eb" font-size="13">white: p = 0.115 (limit 1.13×)</text><text x="450.0" y="326" fill="#e5e7eb" font-size="13" text-anchor="middle">1×</text><text x="585.0" y="326" fill="#e5e7eb" font-size="13" text-anchor="middle">10×</text><text x="720.0" y="326" fill="#e5e7eb" font-size="13" text-anchor="middle">100×</text><text x="444" y="312.0" fill="#e5e7eb" font-size="13" text-anchor="end">1×</text><text x="444" y="220.21052631578948" fill="#e5e7eb" font-size="13" text-anchor="end">5×</text><text x="444" y="105.47368421052633" fill="#e5e7eb" font-size="13" text-anchor="end">10×</text><text x="585.0" y="346" fill="#e5e7eb" font-size="13" text-anchor="middle">speedup s of the optimized part</text><text x="450" y="82" fill="#e5e7eb" font-size="13">overall speedup 1/((1−p) + p/s)</text><rect x="40" y="368" width="680" height="36" rx="8" fill="#1f2937"/><text x="380" y="391" fill="#e5e7eb" font-size="13" text-anchor="middle">Workflow: correct first, then profile, then change one thing, then re-measure speed, memory and equivalence.</text></svg>