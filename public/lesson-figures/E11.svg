<g fill="#d97936"><circle cx="470" cy="290" r="6"/><circle cx="520" cy="258" r="6"/><circle cx="590" cy="95" r="6"/><circle cx="650" cy="72" r="6"/><circle cx="710" cy="70" r="6"/></g>
