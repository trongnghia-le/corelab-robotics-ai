<circle cx="340" cy="90" r="6" fill="#9ccd4e"/><circle cx="340" cy="260" r="6" fill="#9ccd4e"/>
<text x="250" y="82" fill="#9ccd4e" font-size="13">mode +1</text><text x="250" y="282" fill="#9ccd4e" font-size="13">mode -1</text>
<path d="M40 175 L340 175" stroke="#d97936" stroke-width="2" stroke-dasharray="2 5"/>
<text x="60" y="140" fill="#53b2dd" font-size="13">sample paths</text>
