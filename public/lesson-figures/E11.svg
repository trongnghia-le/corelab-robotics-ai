<text x="46" y="58" fill="#e5e7eb" font-size="13">action a</text>
<line x1="40" y1="175" x2="360" y2="175" stroke="#3b414d" stroke-dasharray="4 4"/>
<text x="300" y="168" fill="#d97936" font-size="13">mean = 0</text>
<path d="M40 175 C150 175 200 120 340 90" fill="none" stroke="#9ccd4e" stroke-width="3"/>
<path d="M40 175 C150 175 200 230 340 260" fill="none" stroke="#9ccd4e" stroke-width="3"/>
<path d="M40 150 C120 160 200 140 340 90" fill="none" stroke="#53b2dd" stroke-width="2"/>
