<text x="530" y="236" fill="#e5e7eb" font-size="13">N=2: 0.15</text>
<text x="600" y="130" fill="#e5e7eb" font-size="13">N=4: 0.89</text>
<text x="596" y="58" fill="#e5e7eb" font-size="13" dx="0">N=8: 0.998</text>
