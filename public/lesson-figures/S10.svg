<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 430" font-family="Inter, Arial, sans-serif">
<rect width="780" height="430" fill="#191b1f" rx="12"/>
<text x="390.0" y="30" font-size="17" fill="#e5e7eb" text-anchor="middle" font-weight="bold">ros2_control: one owner per command, read-update-write each period</text>
<rect x="20" y="60" width="140" height="80" rx="8" fill="#272a2f" stroke="#53b2dd" stroke-width="2"/>
<text x="90.0" y="88.5" font-size="13" fill="#e5e7eb" text-anchor="middle" font-weight="bold">Hardware</text>
<text x="90.0" y="104.5" font-size="13" fill="#e5e7eb" text-anchor="middle">component</text>
<text x="90.0" y="120.5" font-size="13" fill="#e5e7eb" text-anchor="middle">read / write</text>
<rect x="215" y="60" width="170" height="80" rx="8" fill="#272a2f" stroke="#9ccd4e" stroke-width="2"/>
<text x="300.0" y="88.5" font-size="13" fill="#e5e7eb" text-anchor="middle" font-weight="bold">Resource manager</text>
<text x="300.0" y="104.5" font-size="13" fill="#e5e7eb" text-anchor="middle">state: shared</text>
<text x="300.0" y="120.5" font-size="13" fill="#e5e7eb" text-anchor="middle">command: 1 owner</text>
<rect x="440" y="60" width="150" height="80" rx="8" fill="#272a2f" stroke="#d97936" stroke-width="2"/>
<text x="515.0" y="88.5" font-size="13" fill="#e5e7eb" text-anchor="middle" font-weight="bold">Controller</text>
<text x="515.0" y="104.5" font-size="13" fill="#e5e7eb" text-anchor="middle">manager</text>
<text x="515.0" y="120.5" font-size="13" fill="#e5e7eb" text-anchor="middle">update_rate 100 Hz</text>
<rect x="640" y="50" width="120" height="40" rx="8" fill="#272a2f" stroke="#e5e7eb" stroke-width="2"/>
<text x="700.0" y="74.2" font-size="12" fill="#e5e7eb" text-anchor="middle" font-weight="bold">controller A</text>
<rect x="640" y="100" width="120" height="40" rx="8" fill="#272a2f" stroke="#e5e7eb" stroke-width="2"/>
<text x="700.0" y="124.2" font-size="12" fill="#e5e7eb" text-anchor="middle" font-weight="bold">broadcaster</text>
<line x1="160" y1="100" x2="215" y2="100" stroke="#e5e7eb" stroke-width="2"/>
<polygon points="215.0,100.0 206.7,103.5 206.7,96.5" fill="#e5e7eb"/>
<line x1="385" y1="100" x2="440" y2="100" stroke="#e5e7eb" stroke-width="2"/>
<polygon points="440.0,100.0 431.7,103.5 431.7,96.5" fill="#e5e7eb"/>
<line x1="590" y1="70" x2="640" y2="70" stroke="#e5e7eb" stroke-width="2"/>
<polygon points="640.0,70.0 631.7,73.5 631.7,66.5" fill="#e5e7eb"/>
<line x1="590" y1="120" x2="640" y2="120" stroke="#e5e7eb" stroke-width="2"/>
<polygon points="640.0,120.0 631.7,123.5 631.7,116.5" fill="#e5e7eb"/>
<text x="300" y="160" font-size="12" fill="#9ccd4e" text-anchor="middle">j1/velocity -> A    j2/velocity -> A</text>
<text x="300" y="178" font-size="12" fill="#d97936" text-anchor="middle">B asks for j2/velocity: refused</text>
<text x="390" y="222" font-size="13" fill="#e5e7eb" text-anchor="middle" font-weight="bold">One 10 ms period (utilization 24 %)</text>
<rect x="60.0" y="250" width="27.5" height="38" fill="#272a2f" stroke="#53b2dd" stroke-width="2"/>
<text x="73.75" y="274" font-size="12" fill="#e5e7eb" text-anchor="middle">r</text>
<rect x="87.5" y="250" width="66.0" height="38" fill="#272a2f" stroke="#d97936" stroke-width="2"/>
<text x="120.5" y="274" font-size="12" fill="#e5e7eb" text-anchor="middle">update</text>
<rect x="153.5" y="250" width="38.5" height="38" fill="#272a2f" stroke="#53b2dd" stroke-width="2"/>
<text x="172.75" y="274" font-size="12" fill="#e5e7eb" text-anchor="middle">w</text>
<line x1="60" y1="310" x2="720" y2="310" stroke="#e5e7eb"/>
<line x1="60.0" y1="305" x2="60.0" y2="315" stroke="#e5e7eb"/>
<text x="60.0" y="332" font-size="12" fill="#e5e7eb" text-anchor="middle">0</text>
<line x1="170.0" y1="305" x2="170.0" y2="315" stroke="#e5e7eb"/>
<text x="170.0" y="332" font-size="12" fill="#e5e7eb" text-anchor="middle">2</text>
<line x1="280.0" y1="305" x2="280.0" y2="315" stroke="#e5e7eb"/>
<text x="280.0" y="332" font-size="12" fill="#e5e7eb" text-anchor="middle">4</text>
<line x1="390.0" y1="305" x2="390.0" y2="315" stroke="#e5e7eb"/>
<text x="390.0" y="332" font-size="12" fill="#e5e7eb" text-anchor="middle">6</text>
<line x1="500.0" y1="305" x2="500.0" y2="315" stroke="#e5e7eb"/>
<text x="500.0" y="332" font-size="12" fill="#e5e7eb" text-anchor="middle">8</text>
<line x1="610.0" y1="305" x2="610.0" y2="315" stroke="#e5e7eb"/>
<text x="610.0" y="332" font-size="12" fill="#e5e7eb" text-anchor="middle">10</text>
<line x1="720.0" y1="305" x2="720.0" y2="315" stroke="#e5e7eb"/>
<text x="720.0" y="332" font-size="12" fill="#e5e7eb" text-anchor="middle">12</text>
<text x="390.0" y="348" font-size="12" fill="#e5e7eb" text-anchor="middle">time (ms)</text>
<line x1="610.0" y1="240" x2="610.0" y2="298" stroke="#9ccd4e" stroke-width="2" stroke-dasharray="5 4"/>
<text x="610.0" y="236" font-size="12" fill="#9ccd4e" text-anchor="middle">deadline T = 10 ms</text>
<text x="126.0" y="322" font-size="12" fill="#e5e7eb" text-anchor="middle"></text>
<text x="390" y="376" font-size="13" fill="#d97936" text-anchor="middle">Same loop with update = 9 ms: cycle 10.2 ms > T, overrun every cycle.</text>
<text x="390" y="398" font-size="13" fill="#e5e7eb" text-anchor="middle">Use the manager's measured period as dt; never hardcode it.</text>
<text x="390" y="420" font-size="13" fill="#e5e7eb" text-anchor="middle">Limits and ownership are checked in the mock before any hardware is connected.</text>
</svg>