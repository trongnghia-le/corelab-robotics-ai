<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 360" font-family="Inter, Arial, sans-serif">
<rect width="780" height="360" fill="#111827" rx="12"/>
<text x="30" y="34" font-size="16" fill="#e5e7eb" font-weight="bold">A. Zero-shot prediction</text>
<text x="440" y="34" font-size="16" fill="#e5e7eb" font-weight="bold">B. 34 of 40 correct, what can you claim?</text>
<rect x="24" y="70" width="124" height="46" rx="8" fill="none" stroke="#38bdf8" stroke-width="2"/><text x="34" y="99" font-size="14" fill="#e5e7eb">image encoder</text>
<rect x="24" y="170" width="124" height="46" rx="8" fill="none" stroke="#a3e635" stroke-width="2"/><text x="34" y="199" font-size="14" fill="#e5e7eb">text encoder</text>
<text x="30" y="238" font-size="13" fill="#e5e7eb">prompts: "a photo of a {class}"</text>
<line x1="148" y1="93" x2="250" y2="130" stroke="#e5e7eb" stroke-width="2"/><line x1="148" y1="193" x2="250" y2="150" stroke="#e5e7eb" stroke-width="2"/>
<rect x="250" y="112" width="140" height="56" rx="8" fill="none" stroke="#f97316" stroke-width="2"/>
<text x="262" y="136" font-size="14" fill="#e5e7eb">cosine / tau</text><text x="262" y="156" font-size="14" fill="#e5e7eb">then softmax</text>
<line x1="390" y1="140" x2="410" y2="140" stroke="#e5e7eb" stroke-width="2"/>
<text x="30" y="290" font-size="14" fill="#e5e7eb">Prompt A alone picks can (0.848); prompt B alone</text>
<text x="30" y="310" font-size="14" fill="#e5e7eb">picks mug (0.997); the ensemble picks mug (0.899).</text>
<line x1="470" y1="270" x2="750" y2="270" stroke="#e5e7eb" stroke-width="1.5"/>
<text x="470" y="296" font-size="13" fill="#e5e7eb">0.5</text><text x="602" y="296" font-size="13" fill="#e5e7eb">0.75</text><text x="740" y="296" font-size="13" fill="#e5e7eb">1</text>
<text x="500" y="320" font-size="14" fill="#e5e7eb">accuracy (chance 0.5 for two classes)</text>
<line x1="588" y1="200" x2="698" y2="200" stroke="#f97316" stroke-width="5"/>
<circle cx="665" cy="200" r="7" fill="#f97316"/>
<text x="590" y="184" font-size="14" fill="#f97316">point estimate 0.85</text>
<text x="470" y="236" font-size="14" fill="#f97316">95% Wilson interval 0.71 to 0.93</text>
<text x="470" y="115" font-size="14" fill="#e5e7eb">With 40 images the interval is wide:</text>
<text x="470" y="135" font-size="14" fill="#e5e7eb">+-0.11, too wide to rank two models.</text>
</svg>
