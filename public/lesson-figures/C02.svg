<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" font-family="Inter, Arial, sans-serif">
<rect width="720" height="400" fill="#111827" rx="12"/>
<text x="24" y="30" fill="#e5e7eb" font-size="16" font-weight="bold">Scalar system: tangent at equilibrium</text>
<text x="400" y="30" fill="#e5e7eb" font-size="16" font-weight="bold">Pendulum equilibria (phase plane)</text>
<line x1="40" y1="200" x2="350" y2="200" stroke="#e5e7eb"/><line x1="60" y1="60" x2="60" y2="330" stroke="#e5e7eb"/>
<text x="352" y="218" fill="#e5e7eb" font-size="13" text-anchor="end">x</text><text x="68" y="74" fill="#e5e7eb" font-size="13">f(x)</text>
<path d="M 70 90 Q 200 300 330 330 L 330 330" fill="none"/>
<path d="M 80 130 Q 170 250 250 200 T 340 300" fill="none"/>
<path d="M 75 80 C 140 110 180 190 220 200 C 260 210 300 280 340 330" fill="none" stroke="#38bdf8" stroke-width="4"/>
<line x1="140" y1="115" x2="300" y2="285" stroke="#f97316" stroke-width="2.5" stroke-dasharray="6 4"/>
<circle cx="220" cy="200" r="6" fill="#a3e635"/><text x="226" y="190" fill="#a3e635" font-size="13">x*</text>
<text x="100" y="105" fill="#38bdf8" font-size="13">f(x)</text>
<text x="240" y="330" fill="#f97316" font-size="13">tangent: slope a = f'(x*)</text>
<text x="40" y="360" fill="#e5e7eb" font-size="13">a &lt; 0: stable, time constant -1/a</text>
<text x="40" y="380" fill="#e5e7eb" font-size="13">error of linear model ~ (x - x*)^2</text>
<line x1="400" y1="205" x2="700" y2="205" stroke="#e5e7eb"/><line x1="550" y1="60" x2="550" y2="350" stroke="#e5e7eb"/>
<text x="698" y="222" fill="#e5e7eb" font-size="13" text-anchor="end">theta</text><text x="558" y="74" fill="#e5e7eb" font-size="13">theta'</text>
<path d="M 550 205 m -20 0 a 20 20 0 1 1 20 -20" fill="none"/>
<path d="M 640 205 C 640 150 590 130 550 135 C 505 140 480 190 480 205 C 480 230 505 255 550 250 C 595 245 640 235 640 205" fill="none" stroke="#a3e635" stroke-width="2" opacity="0.5"/>
<path d="M 610 205 C 610 175 585 165 560 168 C 535 172 520 190 520 205 C 520 220 535 235 555 235 C 580 235 595 225 595 215 C 595 208 590 205 580 205" fill="none" stroke="#a3e635" stroke-width="3"/>
<circle cx="550" cy="205" r="6" fill="#a3e635"/><text x="470" y="262" fill="#a3e635" font-size="13">stable focus (theta = 0)</text>
<circle cx="690" cy="205" r="6" fill="#f97316"/><text x="660" y="190" fill="#f97316" font-size="13" text-anchor="end">saddle (theta = pi)</text>
<line x1="690" y1="205" x2="640" y2="140" stroke="#f97316" stroke-width="2"/><line x1="690" y1="205" x2="640" y2="270" stroke="#f97316" stroke-width="2"/>
<line x1="690" y1="205" x2="700" y2="150" stroke="#f97316" stroke-width="2" opacity="0.0"/>
<text x="400" y="310" fill="#e5e7eb" font-size="13">Jacobian [[0, 1], [-(g/l) cos(theta), -b]]</text>
<text x="400" y="332" fill="#e5e7eb" font-size="13">theta = 0: det &gt; 0, trace &lt; 0  ->  stable</text>
<text x="400" y="354" fill="#e5e7eb" font-size="13">theta = pi: det &lt; 0  ->  saddle (unstable)</text>
</svg>
