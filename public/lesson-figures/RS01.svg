<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" font-family="Inter, Arial, sans-serif" font-size="14">
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#e5e7eb"/></marker><marker id="ao" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#d97936"/></marker></defs>
<rect width="720" height="360" fill="#191b1f" rx="12"/>

<text x="360" y="28" fill="#e5e7eb" font-size="16" text-anchor="middle" font-weight="bold">From observation to a defensible claim</text>
<rect x="20" y="70" width="100" height="86" fill="#272a2f" stroke="#53b2dd" stroke-width="2" rx="6"/>
<text x="70" y="96" fill="#e5e7eb" font-size="14" text-anchor="middle" font-weight="bold">Hypothesis</text>
<text x="70" y="120" fill="#e5e7eb" font-size="13" text-anchor="middle">metric and</text>
<text x="70" y="138" fill="#e5e7eb" font-size="13" text-anchor="middle">threshold</text>
<line x1="120" y1="113" x2="138" y2="113" stroke="#e5e7eb" stroke-width="2" marker-end="url(#a)"/>
<rect x="138" y="70" width="100" height="86" fill="#272a2f" stroke="#53b2dd" stroke-width="2" rx="6"/>
<text x="188" y="96" fill="#e5e7eb" font-size="14" text-anchor="middle" font-weight="bold">Protocol</text>
<text x="188" y="120" fill="#e5e7eb" font-size="13" text-anchor="middle">frozen before</text>
<text x="188" y="138" fill="#e5e7eb" font-size="13" text-anchor="middle">the runs</text>
<line x1="238" y1="113" x2="256" y2="113" stroke="#e5e7eb" stroke-width="2" marker-end="url(#a)"/>
<rect x="256" y="70" width="100" height="86" fill="#272a2f" stroke="#9ccd4e" stroke-width="2" rx="6"/>
<text x="306" y="96" fill="#e5e7eb" font-size="14" text-anchor="middle" font-weight="bold">Runs</text>
<text x="306" y="120" fill="#e5e7eb" font-size="13" text-anchor="middle">conditions</text>
<text x="306" y="138" fill="#e5e7eb" font-size="13" text-anchor="middle">x seeds</text>
<line x1="356" y1="113" x2="374" y2="113" stroke="#e5e7eb" stroke-width="2" marker-end="url(#a)"/>
<rect x="374" y="70" width="100" height="86" fill="#272a2f" stroke="#9ccd4e" stroke-width="2" rx="6"/>
<text x="424" y="96" fill="#e5e7eb" font-size="14" text-anchor="middle" font-weight="bold">Raw data</text>
<text x="424" y="120" fill="#e5e7eb" font-size="13" text-anchor="middle">every seed</text>
<text x="424" y="138" fill="#e5e7eb" font-size="13" text-anchor="middle">saved</text>
<line x1="474" y1="113" x2="492" y2="113" stroke="#e5e7eb" stroke-width="2" marker-end="url(#a)"/>
<rect x="492" y="70" width="100" height="86" fill="#272a2f" stroke="#d97936" stroke-width="2" rx="6"/>
<text x="542" y="96" fill="#e5e7eb" font-size="14" text-anchor="middle" font-weight="bold">Analysis</text>
<text x="542" y="120" fill="#e5e7eb" font-size="13" text-anchor="middle">paired diffs,</text>
<text x="542" y="138" fill="#e5e7eb" font-size="13" text-anchor="middle">intervals</text>
<line x1="592" y1="113" x2="610" y2="113" stroke="#e5e7eb" stroke-width="2" marker-end="url(#a)"/>
<rect x="610" y="70" width="100" height="86" fill="#272a2f" stroke="#d97936" stroke-width="2" rx="6"/>
<text x="660" y="96" fill="#e5e7eb" font-size="14" text-anchor="middle" font-weight="bold">Claim</text>
<text x="660" y="120" fill="#e5e7eb" font-size="13" text-anchor="middle">with limits</text>
<text x="660" y="138" fill="#e5e7eb" font-size="13" text-anchor="middle">and caveats</text>
<rect x="20" y="190" width="320" height="150" fill="#272a2f" stroke="#d97936" stroke-width="2" rx="6"/>
<text x="36" y="214" fill="#e5e7eb" font-size="14" text-anchor="start" font-weight="bold">Threats to check</text>
<text x="36" y="240" fill="#e5e7eb" font-size="13" text-anchor="start">Confounders: budget, data, version differ</text>
<text x="36" y="264" fill="#e5e7eb" font-size="13" text-anchor="start">Selection: best seed, best of 50</text>
<text x="36" y="288" fill="#e5e7eb" font-size="13" text-anchor="start">Leakage: test data used for tuning</text>
<text x="36" y="312" fill="#e5e7eb" font-size="13" text-anchor="start">Multiple tests: 20 tries, 64% false hit</text>
<rect x="360" y="190" width="340" height="150" fill="#272a2f" stroke="#9ccd4e" stroke-width="2" rx="6"/>
<text x="376" y="214" fill="#e5e7eb" font-size="14" text-anchor="start" font-weight="bold">Controls and ablations</text>
<text x="376" y="240" fill="#e5e7eb" font-size="13" text-anchor="start">Change one factor at a time (or a factorial)</text>
<text x="376" y="264" fill="#e5e7eb" font-size="13" text-anchor="start">Same scenes, limits, time step, compute</text>
<text x="376" y="288" fill="#e5e7eb" font-size="13" text-anchor="start">Repeat over independent seeds</text>
<text x="376" y="312" fill="#e5e7eb" font-size="13" text-anchor="start">Report negative results and deviations</text>
</svg>
