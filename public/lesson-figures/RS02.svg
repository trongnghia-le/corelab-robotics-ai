<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" font-family="Inter, Arial, sans-serif">
<rect width="760" height="360" fill="#111827" rx="12"/>
<defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#e5e7eb"/></marker></defs>
<text x="20" y="30" fill="#e5e7eb" font-size="16" font-weight="bold">2x2 factorial: cell means (accuracy %)</text>
<text x="215" y="62" fill="#e5e7eb" font-size="14" text-anchor="middle">A off</text><text x="365" y="62" fill="#e5e7eb" font-size="14" text-anchor="middle">A on (augmentation)</text>
<text x="130" y="127" fill="#e5e7eb" font-size="14" text-anchor="end">B off</text><text x="130" y="237" fill="#e5e7eb" font-size="14" text-anchor="end">B on (more data)</text>
<g stroke-width="2" fill="none">
<rect x="150" y="75" width="130" height="80" rx="8" stroke="#38bdf8"/><rect x="300" y="75" width="130" height="80" rx="8" stroke="#38bdf8"/>
<rect x="150" y="185" width="130" height="80" rx="8" stroke="#38bdf8"/><rect x="300" y="185" width="130" height="80" rx="8" stroke="#a3e635"/>
</g>
<g fill="#e5e7eb" font-size="22" text-anchor="middle"><text x="215" y="125">70.0</text><text x="365" y="125">73.0</text><text x="215" y="235">74.0</text><text x="365" y="235">79.0</text></g>
<g stroke="#f97316" stroke-width="2" fill="none" marker-end="url(#ar)"><path d="M282 115 L298 115"/><path d="M282 225 L298 225"/><path d="M215 157 L215 183"/><path d="M365 157 L365 183"/></g>
<text x="20" y="300" fill="#f97316" font-size="14">E_A = (3 + 5)/2 = 4.0    E_B = (4 + 6)/2 = 5.0    E_AB = 1.0</text>
<text x="20" y="324" fill="#e5e7eb" font-size="14">SE of each effect = sigma / sqrt(r) = 1.58 / sqrt(5) = 0.71</text>
<text x="500" y="30" fill="#e5e7eb" font-size="16" font-weight="bold">Confounded design</text>
<g stroke-width="2" fill="none"><rect x="510" y="75" width="100" height="60" rx="8" stroke="#38bdf8"/><rect x="640" y="75" width="100" height="60" rx="8" stroke="#a3e635"/></g>
<text x="560" y="110" fill="#e5e7eb" font-size="14" text-anchor="middle">A=0, B=0</text><text x="690" y="110" fill="#e5e7eb" font-size="14" text-anchor="middle">A=1, B=1</text>
<path d="M612 105 L638 105" stroke="#f97316" stroke-width="2" fill="none" marker-end="url(#ar)"/>
<text x="500" y="175" fill="#f97316" font-size="14">+9 points, but whose?</text>
<text x="500" y="200" fill="#e5e7eb" font-size="13">columns A and B identical:</text><text x="500" y="220" fill="#e5e7eb" font-size="13">correlation = 1, not separable.</text>
<text x="500" y="262" fill="#a3e635" font-size="13">Factorial: correlation = 0,</text><text x="500" y="282" fill="#a3e635" font-size="13">randomised run order.</text>
</svg>
