<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" font-family="Inter, Arial, sans-serif">
<rect width="720" height="380" fill="#111827" rx="12"/>
<text x="24" y="30" fill="#e5e7eb" font-size="16" font-weight="bold">Recursive Newton-Euler: two sweeps</text>
<g fill="none" stroke="#e5e7eb" stroke-width="2"><rect x="40" y="130" width="80" height="50" rx="6"/><rect x="190" y="130" width="80" height="50" rx="6"/><rect x="340" y="130" width="80" height="50" rx="6"/><rect x="490" y="130" width="80" height="50" rx="6"/></g>
<g fill="#e5e7eb" font-size="13" text-anchor="middle"><text x="80" y="160">base</text><text x="230" y="160">link 1</text><text x="380" y="160">link 2</text><text x="530" y="160">link n</text></g>
<text x="445" y="160" fill="#e5e7eb" font-size="18" text-anchor="middle">...</text>
<g stroke="#38bdf8" stroke-width="3" fill="#38bdf8"><line x1="122" y1="112" x2="188" y2="112"/><line x1="272" y1="112" x2="338" y2="112"/><line x1="422" y1="112" x2="488" y2="112"/>
<polygon points="188,106 198,112 188,118" stroke="none"/><polygon points="338,106 348,112 338,118" stroke="none"/><polygon points="488,106 498,112 488,118" stroke="none"/></g>
<text x="40" y="92" fill="#38bdf8" font-size="14" font-weight="bold">Forward pass: w, alpha, a_c (base accel = +g)</text>
<g stroke="#f97316" stroke-width="3" fill="#f97316"><line x1="488" y1="198" x2="422" y2="198"/><line x1="338" y1="198" x2="272" y2="198"/><line x1="188" y1="198" x2="122" y2="198"/>
<polygon points="422,192 412,198 422,204" stroke="none"/><polygon points="272,192 262,198 272,204" stroke="none"/><polygon points="122,192 112,198 122,204" stroke="none"/></g>
<text x="40" y="228" fill="#f97316" font-size="14" font-weight="bold">Backward pass: F = m a_c, then tau_i = I alpha + r x F + (torque from outward links)</text>
<text x="40" y="262" fill="#e5e7eb" font-size="13">tau_2 = I2 a2 + rc2 x F2</text>
<text x="40" y="282" fill="#e5e7eb" font-size="13">tau_1 = I1 a1 + rc1 x F1 + rl1 x F2 + tau_2</text>
<rect x="400" y="248" width="296" height="120" fill="none" stroke="#a3e635"/>
<g fill="#e5e7eb" font-size="13"><text x="412" y="270" fill="#a3e635" font-weight="bold">Cost for n joints</text><text x="412" y="292">inverse dynamics (RNEA): O(n)</text><text x="412" y="312">mass matrix by columns: O(n^2)</text><text x="412" y="332">solve M qdd = tau - b: O(n^3)</text><text x="412" y="350">forward dynamics (ABA): O(n)</text></g>
<text x="40" y="330" fill="#a3e635" font-size="13">tau = Y(q, qd, qdd) pi: linear in the</text><text x="40" y="350" fill="#a3e635" font-size="13">inertial parameters pi = (a1, a2, a3, b1, b2)</text>
</svg>
