<circle cx="220.0" cy="370" r="5" fill="#f97316"/><text x="220.0" y="360" fill="#f97316" font-size="13" text-anchor="middle">x0 = 0.5</text>
<circle cx="296.507242624" cy="133.492757376" r="6" fill="#a3e635"/>
<text x="304.0" y="210.0" fill="#a3e635" font-size="13">fixed point 0.7391</text>
<text x="79.2" y="101.19999999999999" fill="#38bdf8" font-size="14">y = cos x</text><text x="252.0" y="274.0" fill="#9ca3af" font-size="14">y = x</text>
<rect x="420" y="70" width="276" height="300" rx="8" fill="#1f2937"/>
<text x="434" y="96" fill="#e5e7eb" font-size="14" font-weight="bold">Check every hypothesis</text>
<text x="434" y="124" fill="#a3e635" font-size="13">1. [0, 1] is a complete metric space</text>
<text x="434" y="148" fill="#a3e635" font-size="13">2. cos maps [0, 1] into [0.54, 1]</text>
<text x="434" y="172" fill="#a3e635" font-size="13">3. |cos'(x)| = |sin x| ≤ sin 1 = 0.841 &lt; 1</text>
<text x="434" y="204" fill="#e5e7eb" font-size="13">Then: unique fixed point, and for any</text>
<text x="434" y="222" fill="#e5e7eb" font-size="13">start in [0, 1] the iterates satisfy</text>
<text x="434" y="246" fill="#f97316" font-size="14">|xn − x*| ≤ Ln/(1−L) · |x1 − x0|</text>
<text x="434" y="278" fill="#e5e7eb" font-size="13">Drop a hypothesis and it can fail:</text>
<text x="434" y="298" fill="#e5e7eb" font-size="13">x ← x + 1/x on [1, ∞) has |slope| &lt; 1</text>
<text x="434" y="316" fill="#e5e7eb" font-size="13">but no constant L &lt; 1, and no fixed</text>
<text x="434" y="334" fill="#e5e7eb" font-size="13">point: iterates grow like √(2n).</text>
</svg>