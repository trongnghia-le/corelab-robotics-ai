<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" font-family="Inter, Arial, sans-serif">
<rect width="720" height="420" fill="#111827" rx="12"/>
<text x="360" y="28" fill="#e5e7eb" font-size="18" font-weight="bold" text-anchor="middle">Banach fixed point: iterating x ← cos x on [0, 1]</text>
<rect x="60" y="50" width="320" height="320" fill="none" stroke="#374151"/>
<line x1="60" y1="370" x2="394" y2="370" stroke="#e5e7eb"/><line x1="60" y1="370" x2="60" y2="36" stroke="#e5e7eb"/>
<text x="380" y="390" fill="#e5e7eb" font-size="13" text-anchor="middle">1</text><text x="52" y="55" fill="#e5e7eb" font-size="13" text-anchor="end">1</text>
<text x="220.0" y="392" fill="#e5e7eb" font-size="14" text-anchor="middle">x</text>
<line x1="60" y1="370" x2="380" y2="50" stroke="#9ca3af" stroke-width="2"/>
<path d="M60.0,50.0 L63.2,50.0 L66.4,50.1 L69.6,50.1 L72.8,50.3 L76.0,50.4 L79.2,50.6 L82.4,50.8 L85.6,51.0 L88.8,51.3 L92.0,51.6 L95.2,51.9 L98.4,52.3 L101.6,52.7 L104.8,53.1 L108.0,53.6 L111.2,54.1 L114.4,54.6 L117.6,55.2 L120.8,55.8 L124.0,56.4 L127.2,57.0 L130.4,57.7 L133.6,58.4 L136.8,59.2 L140.0,59.9 L143.2,60.8 L146.4,61.6 L149.6,62.5 L152.8,63.4 L156.0,64.3 L159.2,65.3 L162.4,66.2 L165.6,67.3 L168.8,68.3 L172.0,69.4 L175.2,70.5 L178.4,71.7 L181.6,72.8 L184.8,74.0 L188.0,75.3 L191.2,76.5 L194.4,77.8 L197.6,79.1 L200.8,80.5 L204.0,81.9 L207.2,83.3 L210.4,84.7 L213.6,86.2 L216.8,87.7 L220.0,89.2 L223.2,90.7 L226.4,92.3 L229.6,93.9 L232.8,95.5 L236.0,97.2 L239.2,98.9 L242.4,100.6 L245.6,102.3 L248.8,104.1 L252.0,105.9 L255.2,107.7 L258.4,109.6 L261.6,111.4 L264.8,113.3 L268.0,115.3 L271.2,117.2 L274.4,119.2 L277.6,121.2 L280.8,123.2 L284.0,125.3 L287.2,127.3 L290.4,129.4 L293.6,131.5 L296.8,133.7 L300.0,135.9 L303.2,138.1 L306.4,140.3 L309.6,142.5 L312.8,144.8 L316.0,147.1 L319.2,149.4 L322.4,151.7 L325.6,154.0 L328.8,156.4 L332.0,158.8 L335.2,161.2 L338.4,163.7 L341.6,166.1 L344.8,168.6 L348.0,171.1 L351.2,173.6 L354.4,176.1 L357.6,178.7 L360.8,181.3 L364.0,183.9 L367.2,186.5 L370.4,189.1 L373.6,191.8 L376.8,194.4 L380.0,197.1" fill="none" stroke="#38bdf8" stroke-width="3"/>
