<title>A rotation matrix is a frame written in another frame</title>
<desc>Frame b is turned 53.13 degrees about z. Its axes written in frame a are the columns (0.6, 0.8, 0), (-0.8, 0.6, 0), (0, 0, 1). A point (5, 0, 2) in b is (3, 4, 2) in a.</desc>
