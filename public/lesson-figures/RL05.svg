<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 360" font-family="Inter, Arial, sans-serif">
<rect width="780" height="360" fill="#191b1f" rx="12"/>
<text x="30" y="34" font-size="16" fill="#e5e7eb" font-weight="bold">A. Two targets for the same step</text>
<text x="440" y="34" font-size="16" fill="#e5e7eb" font-weight="bold">B. Spread of the estimate of V(2)</text>
<g font-size="14" fill="#e5e7eb" text-anchor="middle">
<circle cx="70" cy="110" r="22" fill="none" stroke="#53b2dd" stroke-width="2.5"/><text x="70" y="115">s=2</text>
<circle cx="170" cy="110" r="22" fill="none" stroke="#53b2dd" stroke-width="2.5"/><text x="170" y="115">s=3</text>
<circle cx="270" cy="110" r="22" fill="none" stroke="#53b2dd" stroke-width="2.5"/><text x="270" y="115">s=2</text>
<circle cx="370" cy="110" r="22" fill="none" stroke="#53b2dd" stroke-width="2.5"/><text x="370" y="115">s=3</text>
<rect x="430" y="90" width="0" height="0"/></g>
<g stroke="#e5e7eb" stroke-width="2"><line x1="92" y1="110" x2="148" y2="110"/><line x1="192" y1="110" x2="248" y2="110"/><line x1="292" y1="110" x2="348" y2="110"/></g>
<text x="104" y="98" font-size="13" fill="#e5e7eb">r=-1</text><text x="204" y="98" font-size="13" fill="#e5e7eb">r=-1</text><text x="304" y="98" font-size="13" fill="#e5e7eb">r=-1</text>
<text x="318" y="152" font-size="13" fill="#e5e7eb">last step: r=+10 (goal)</text>
<text x="30" y="170" font-size="14" fill="#d97936">Monte Carlo target for the first step: wait for the end</text>
<text x="30" y="192" font-size="14" fill="#d97936">G_0 = -1 - 0.9 - 0.81 + 0.729 x 10 = 4.58</text>
<text x="30" y="232" font-size="14" fill="#53b2dd">TD(0) target: one reward, then trust the table</text>
<text x="30" y="254" font-size="14" fill="#53b2dd">r + gamma V(3) = -1 + 0.9 V(3)</text>
<text x="30" y="294" font-size="14" fill="#9ccd4e">MC: unbiased, high variance, needs episodes to end</text>
<text x="30" y="316" font-size="14" fill="#9ccd4e">TD: biased early, low variance, learns every step</text>
<line x1="460" y1="290" x2="750" y2="290" stroke="#e5e7eb" stroke-width="1.5"/>
<text x="436" y="52" font-size="14" fill="#e5e7eb">std over 1000 repeats</text>
<rect x="480" y="129.3" width="34" height="160.7" fill="#d97936"/><rect x="518" y="286.3" width="34" height="3.7" fill="#53b2dd"/><text x="480" y="121.3" font-size="13" fill="#e5e7eb">6.43</text><text x="518" y="278.4" font-size="13" fill="#e5e7eb">0.15</text><text x="494" y="312" font-size="14" fill="#e5e7eb">N = 1</text><rect x="580" y="173.5" width="34" height="116.5" fill="#d97936"/><rect x="618" y="279.1" width="34" height="10.9" fill="#53b2dd"/><text x="580" y="165.5" font-size="13" fill="#e5e7eb">4.65</text><text x="618" y="271.1" font-size="13" fill="#e5e7eb">0.44</text><text x="594" y="312" font-size="14" fill="#e5e7eb">N = 5</text><rect x="680" y="233.5" width="34" height="56.5" fill="#d97936"/><rect x="718" y="260.8" width="34" height="29.2" fill="#53b2dd"/><text x="680" y="225.5" font-size="13" fill="#e5e7eb">2.26</text><text x="718" y="252.8" font-size="13" fill="#e5e7eb">1.17</text><text x="694" y="312" font-size="14" fill="#e5e7eb">N = 20</text>
<rect x="480" y="326" width="14" height="14" fill="#d97936"/><text x="500" y="338" font-size="13" fill="#e5e7eb">Monte Carlo</text>
<rect x="600" y="326" width="14" height="14" fill="#53b2dd"/><text x="620" y="338" font-size="13" fill="#e5e7eb">TD(0), alpha = 0.1</text>
</svg>
