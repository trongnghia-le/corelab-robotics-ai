<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 360" font-family="Inter, Arial, sans-serif">
<rect width="780" height="360" fill="#111827" rx="12"/>
<text x="30" y="34" font-size="16" fill="#e5e7eb" font-weight="bold">A. Drift on a square loop</text>
<text x="450" y="34" font-size="16" fill="#e5e7eb" font-weight="bold">B. Which error measures what</text>
<rect x="70" y="80" width="200" height="200" fill="none" stroke="#a3e635" stroke-width="3"/>
<polyline points="70,280 270,280 270,80 70,76 52,100 60,150 85,200" fill="none" stroke="#f97316" stroke-width="3"/>
<circle cx="70" cy="280" r="6" fill="#e5e7eb"/>
<text x="76" y="304" font-size="14" fill="#e5e7eb">start</text>
<text x="40" y="332" font-size="14" fill="#a3e635">ground truth (closed loop)</text>
<text x="40" y="352" font-size="14" fill="#f97316">estimate: ends away from the start</text>
<text x="450" y="76" font-size="14" fill="#38bdf8">RPE (interval d)</text>
<text x="450" y="98" font-size="14" fill="#e5e7eb">error of each local motion; ignores global pose;</text>
<text x="450" y="118" font-size="14" fill="#e5e7eb">small d hides slow heading drift</text>
<text x="450" y="160" font-size="14" fill="#f97316">ATE (after rigid alignment)</text>
<text x="450" y="182" font-size="14" fill="#e5e7eb">RMS position error of the whole path;</text>
<text x="450" y="202" font-size="14" fill="#e5e7eb">alignment removes the free global pose</text>
<text x="450" y="244" font-size="14" fill="#a3e635">Loop closure</text>
<text x="450" y="266" font-size="14" fill="#e5e7eb">Recognising a place seen before adds a constraint,</text>
<text x="450" y="286" font-size="14" fill="#e5e7eb">so the end-point error is spread back</text>
<text x="450" y="306" font-size="14" fill="#e5e7eb">along the trajectory</text>
</svg>
