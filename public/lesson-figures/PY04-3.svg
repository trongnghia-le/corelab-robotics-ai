<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" font-family="Inter, sans-serif">
<title>Strides: one block of memory, many views</title>
<desc>A float64 array of shape (2,3,4) occupies 24 numbers in one block. The strides 96, 32 and 8 bytes give the jump for each axis. Element a[1,2,3] sits at byte 184. The slice a[:, ::2, 1:] picks 12 numbers without copying.</desc>
