<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="Inter, sans-serif">
<title>A stricter override shrinks the accepted calls</title>
<desc>Plot of the accepted region in the (target position, time step) plane for the base joint with vmax 2 rad/s, a slow override with 1.25 and a fast override with 2.75, starting from q = 0 with limits plus or minus 1.5. The point (1.0, 0.6) is accepted by the base and rejected by the slow override; the point (1.2, 0.5) is accepted by the fast override with speed 2.4 rad/s, above the base bound.</desc>
<defs></defs>
<rect width="900" height="520" rx="14" fill="#17181b"/>
<text x="32" y="44" font-size="22" fill="#e9e7e3" text-anchor="start" font-weight="bold">A stricter override shrinks the accepted calls</text>
<rect x="96" y="84" width="520" height="330" rx="0" fill="none" stroke="#3d4148" stroke-width="1"/>
<path d="M96,84 L96,285 L356,414 L616,285 L616,84 Z" fill="#1d2f26" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M96,84 L96,237 L356,414 L616,237 L616,84 Z" fill="#33271c" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M96,84 L96,131 L356,414 L616,131 L616,84 Z" fill="#3a2030" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="356" y1="414" x2="616" y2="285" stroke="#6fc693" stroke-width="2.5" stroke-linecap="round"/>
<line x1="356" y1="414" x2="96" y2="285" stroke="#6fc693" stroke-width="2.5" stroke-linecap="round"/>
<line x1="356" y1="414" x2="616" y2="237" stroke="#e0904f" stroke-width="2.5" stroke-linecap="round"/>
<line x1="356" y1="414" x2="96" y2="237" stroke="#e0904f" stroke-width="2.5" stroke-linecap="round"/>
<line x1="356" y1="414" x2="616" y2="131" stroke="#e08db5" stroke-width="2.5" stroke-linecap="round"/>
<line x1="356" y1="414" x2="96" y2="131" stroke="#e08db5" stroke-width="2.5" stroke-linecap="round"/>
<text x="624" y="290" font-size="14" fill="#6fc693" text-anchor="start" font-weight="600">2.75</text>
<text x="624" y="242" font-size="14" fill="#e0904f" text-anchor="start" font-weight="600">2</text>
<text x="624" y="136" font-size="14" fill="#e08db5" text-anchor="start" font-weight="600">1.25</text>
<line x1="96" y1="414" x2="616" y2="414" stroke="#a7adb5" stroke-width="1.5" stroke-linecap="round"/>
<line x1="96" y1="84" x2="96" y2="414" stroke="#a7adb5" stroke-width="1.5" stroke-linecap="round"/>
<line x1="96" y1="84" x2="96" y2="414" stroke="#2c3036" stroke-width="1" stroke-linecap="round"/>
<line x1="96" y1="414" x2="96" y2="420" stroke="#a7adb5" stroke-width="1.5" stroke-linecap="round"/>
<text x="96" y="438" font-size="14" fill="#a7adb5" text-anchor="middle">-1.5</text>
<line x1="183" y1="84" x2="183" y2="414" stroke="#2c3036" stroke-width="1" stroke-linecap="round"/>
<line x1="183" y1="414" x2="183" y2="420" stroke="#a7adb5" stroke-width="1.5" stroke-linecap="round"/>
<text x="183" y="438" font-size="14" fill="#a7adb5" text-anchor="middle">-1</text>
<line x1="269" y1="84" x2="269" y2="414" stroke="#2c3036" stroke-width="1" stroke-linecap="round"/>
<line x1="269" y1="414" x2="269" y2="420" stroke="#a7adb5" stroke-width="1.5" stroke-linecap="round"/>
<text x="269" y="438" font-size="14" fill="#a7adb5" text-anchor="middle">-0.5</text>
<line x1="356" y1="84" x2="356" y2="414" stroke="#2c3036" stroke-width="1" stroke-linecap="round"/>
<line x1="356" y1="414" x2="356" y2="420" stroke="#a7adb5" stroke-width="1.5" stroke-linecap="round"/>
<text x="356" y="438" font-size="14" fill="#a7adb5" text-anchor="middle">0</text>
<line x1="443" y1="84" x2="443" y2="414" stroke="#2c3036" stroke-width="1" stroke-linecap="round"/>
<line x1="443" y1="414" x2="443" y2="420" stroke="#a7adb5" stroke-width="1.5" stroke-linecap="round"/>
<text x="443" y="438" font-size="14" fill="#a7adb5" text-anchor="middle">0.5</text>
<line x1="529" y1="84" x2="529" y2="414" stroke="#2c3036" stroke-width="1" stroke-linecap="round"/>
<line x1="529" y1="414" x2="529" y2="420" stroke="#a7adb5" stroke-width="1.5" stroke-linecap="round"/>
<text x="529" y="438" font-size="14" fill="#a7adb5" text-anchor="middle">1</text>
<line x1="616" y1="84" x2="616" y2="414" stroke="#2c3036" stroke-width="1" stroke-linecap="round"/>
<line x1="616" y1="414" x2="616" y2="420" stroke="#a7adb5" stroke-width="1.5" stroke-linecap="round"/>
<text x="616" y="438" font-size="14" fill="#a7adb5" text-anchor="middle">1.5</text>
<line x1="96" y1="414" x2="616" y2="414" stroke="#2c3036" stroke-width="1" stroke-linecap="round"/>
<line x1="90" y1="414" x2="96" y2="414" stroke="#a7adb5" stroke-width="1.5" stroke-linecap="round"/>
<text x="84" y="419" font-size="14" fill="#a7adb5" text-anchor="end">0</text>
<line x1="96" y1="320" x2="616" y2="320" stroke="#2c3036" stroke-width="1" stroke-linecap="round"/>
<line x1="90" y1="320" x2="96" y2="320" stroke="#a7adb5" stroke-width="1.5" stroke-linecap="round"/>
<text x="84" y="325" font-size="14" fill="#a7adb5" text-anchor="end">0.4</text>
<line x1="96" y1="225" x2="616" y2="225" stroke="#2c3036" stroke-width="1" stroke-linecap="round"/>
<line x1="90" y1="225" x2="96" y2="225" stroke="#a7adb5" stroke-width="1.5" stroke-linecap="round"/>
<text x="84" y="230" font-size="14" fill="#a7adb5" text-anchor="end">0.8</text>
<line x1="96" y1="131" x2="616" y2="131" stroke="#2c3036" stroke-width="1" stroke-linecap="round"/>
<line x1="90" y1="131" x2="96" y2="131" stroke="#a7adb5" stroke-width="1.5" stroke-linecap="round"/>
<text x="84" y="136" font-size="14" fill="#a7adb5" text-anchor="end">1.2</text>
<text x="356.0" y="464" font-size="15" fill="#e9e7e3" text-anchor="middle">target position q' (rad)</text>
<text x="44" y="70" font-size="15" fill="#e9e7e3" text-anchor="start">dt (s)</text>
<circle cx="529" cy="273" r="6" fill="#e58a80" stroke="#17181b" stroke-width="2"/>
<text x="517" y="263" font-size="15" fill="#e58a80" text-anchor="end" font-weight="bold">A</text>
<circle cx="564" cy="296" r="6" fill="#e0c169" stroke="#17181b" stroke-width="2"/>
<text x="576" y="284" font-size="15" fill="#e0c169" text-anchor="start" font-weight="bold">B</text>
<text x="660" y="100" font-size="17" fill="#e9e7e3" text-anchor="start" font-weight="bold">speed bound vmax (rad/s)</text>
<line x1="660" y1="128" x2="690" y2="128" stroke="#6fc693" stroke-width="2.5" stroke-linecap="round"/>
<text x="702" y="133" font-size="15" fill="#e9e7e3" text-anchor="start">2.75  fast override</text>
<line x1="660" y1="156" x2="690" y2="156" stroke="#e0904f" stroke-width="2.5" stroke-linecap="round"/>
<text x="702" y="161" font-size="15" fill="#e9e7e3" text-anchor="start">2.0   base Joint</text>
<line x1="660" y1="184" x2="690" y2="184" stroke="#e08db5" stroke-width="2.5" stroke-linecap="round"/>
<text x="702" y="189" font-size="15" fill="#e9e7e3" text-anchor="start">1.25  slow override</text>
<text x="660" y="238" font-size="15" fill="#e58a80" text-anchor="start" font-weight="600" font-family="ui-monospace, Menlo, Consolas, monospace">A  (1.0, 0.6)</text>
<text x="660" y="260" font-size="14" fill="#a7adb5" text-anchor="start">speed 1.67 rad/s: base accepts,</text>
<text x="660" y="280" font-size="14" fill="#a7adb5" text-anchor="start">slow rejects (needs dt &gt;= 0.8)</text>
<text x="660" y="324" font-size="15" fill="#e0c169" text-anchor="start" font-weight="600" font-family="ui-monospace, Menlo, Consolas, monospace">B  (1.2, 0.5)</text>
<text x="660" y="346" font-size="14" fill="#a7adb5" text-anchor="start">speed 2.4 rad/s: fast accepts,</text>
<text x="660" y="366" font-size="14" fill="#a7adb5" text-anchor="start">but base bound |v| &lt;= 2 is broken</text>
<text x="32" y="488" font-size="14" fill="#a7adb5" text-anchor="start">Region above each line: dt &gt;= |q'| / vmax. Start q = 0, limits [-1.5, 1.5].</text>
</svg>
