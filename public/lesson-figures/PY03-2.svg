<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" font-family="Inter, sans-serif">
<title>Scope is fixed at compile time; a closure shares one cell</title>
<desc>Left: the LEGB search order for the name k inside s(5): local, enclosing, global, built-in. Right: the inner function and the finished outer frame read the same cell, which holds 6 after k = k*2.</desc>
<defs><marker id="ahP3b6fc693" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 z" fill="#6fc693"/></marker><marker id="ahP3b86abe2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 z" fill="#86abe2"/></marker></defs>
<rect width="900" height="540" rx="14" fill="#17181b"/>
<text x="32" y="44" font-size="22" fill="#e9e7e3" text-anchor="start" font-weight="bold">Scope is fixed at compile time; a closure shares one cell</text>
<rect x="32" y="72" width="436" height="420" rx="6" fill="#22252a" stroke="#3d4148" stroke-width="1.5"/>
<text x="48" y="102" font-size="17" fill="#e9e7e3" text-anchor="start" font-weight="bold">LEGB: where is a name looked up?</text>
<rect x="48" y="118" width="404" height="352" rx="6" fill="none" stroke="#a7adb5" stroke-width="1.5"/>
<text x="62" y="142" font-size="14" fill="#a7adb5" text-anchor="start">B  built-in: len, print, range</text>
<rect x="68" y="156" width="364" height="296" rx="6" fill="none" stroke="#86abe2" stroke-width="1.5"/>
<text x="82" y="180" font-size="14" fill="#86abe2" text-anchor="start">G  module: limit = 10</text>
<rect x="88" y="194" width="324" height="240" rx="6" fill="none" stroke="#e0c169" stroke-width="1.5"/>
<text x="102" y="218" font-size="14" fill="#e0c169" text-anchor="start">E  enclosing function: k</text>
<rect x="108" y="232" width="284" height="184" rx="6" fill="none" stroke="#6fc693" stroke-width="2"/>
<text x="122" y="258" font-size="15" fill="#6fc693" text-anchor="start" font-weight="600">L  local: x = 5</text>
<text x="122" y="294" font-size="14" fill="#e9e7e3" text-anchor="start">x * k: x is found here</text>
<text x="122" y="320" font-size="14" fill="#e9e7e3" text-anchor="start">k is not bound here</text>
<text x="122" y="346" font-size="14" fill="#e0c169" text-anchor="start">go outward: k found in E</text>
<text x="32" y="520" font-size="15" fill="#e9e7e3" text-anchor="start" font-weight="600">search order L, E, G, B; the first hit wins</text>
<rect x="492" y="72" width="376" height="420" rx="6" fill="#22252a" stroke="#3d4148" stroke-width="1.5"/>
<text x="508" y="102" font-size="17" fill="#e9e7e3" text-anchor="start" font-weight="bold">One cell, two readers</text>
<rect x="508" y="142" width="140" height="56" rx="6" fill="#22252a" stroke="#6fc693" stroke-width="2"/>
<text x="578" y="166" font-size="15" fill="#e9e7e3" text-anchor="middle" font-weight="600">function s</text>
<text x="578" y="186" font-size="14" fill="#a7adb5" text-anchor="middle">reads k</text>
<rect x="508" y="300" width="140" height="56" rx="6" fill="#22252a" stroke="#86abe2" stroke-width="2"/>
<text x="578" y="324" font-size="15" fill="#e9e7e3" text-anchor="middle" font-weight="600">make_scaler(3)</text>
<text x="578" y="344" font-size="14" fill="#a7adb5" text-anchor="middle">bound k = 3, then 6</text>
<rect x="716" y="206" width="128" height="84" rx="6" fill="#3a2a1e" stroke="#e0904f" stroke-width="2.5"/>
<text x="780" y="234" font-size="14" fill="#a7adb5" text-anchor="middle">cell for k</text>
<text x="780" y="268" font-size="17" fill="#e0904f" text-anchor="middle" font-weight="bold">k = 6</text>
<line x1="648" y1="176" x2="716" y2="226" stroke="#6fc693" stroke-width="2" marker-end="url(#ahP3b6fc693)" stroke-linecap="round"/>
<line x1="648" y1="330" x2="716" y2="276" stroke="#86abe2" stroke-width="2" marker-end="url(#ahP3b86abe2)" stroke-linecap="round"/>
<text x="508" y="404" font-size="14" fill="#a7adb5" text-anchor="start">k = k*2 rebinds the same cell (3 becomes 6).</text>
<text x="508" y="432" font-size="17" fill="#e0904f" text-anchor="start" font-weight="bold">s(5) = 5 * 6 = 30</text>
<text x="508" y="460" font-size="14" fill="#a7adb5" text-anchor="start">late binding: the value is read when s runs</text>
</svg>
