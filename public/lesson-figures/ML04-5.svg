<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="Inter, sans-serif">
<title>Case 1 in the input plane: four flat pieces</title>
<desc>The crease lines x1 = x2 (unit 1) and x1 = -0.5 (unit 2) divide the input plane into four regions with different formulas for the output; the point x = (1, 2) lies where only unit 2 is on and the output is -3.</desc>
<defs><marker id="m5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs>
<rect width="900" height="520" rx="14" fill="#17181b"/>
<text x="32" y="44" font-size="22" fill="#e9e7e3" text-anchor="start" font-weight="bold">Case 1 in the input plane: four flat pieces</text>
<rect x="32" y="68" width="460" height="400" rx="8" fill="#22252a" stroke="#3d4148" stroke-width="1.5"/>
<text x="48" y="98" font-size="17" fill="#e9e7e3" text-anchor="start" font-weight="bold">Input plane (x1, x2)</text>
<rect x="516" y="68" width="352" height="400" rx="8" fill="#22252a" stroke="#3d4148" stroke-width="1.5"/>
<text x="532" y="98" font-size="17" fill="#e9e7e3" text-anchor="start" font-weight="bold">Forward pass at x = (1, 2)</text>
<polygon points="199,418 402,418 402,128 402,128 199,331" fill="#86abe2" fill-opacity="0.18" stroke="none"/>
<polygon points="112,418 199,418 199,331 112,418" fill="#e0c169" fill-opacity="0.18" stroke="none"/>
<polygon points="199,331 402,128 402,128 199,128" fill="#6cc6ba" fill-opacity="0.18" stroke="none"/>
<polygon points="112,418 112,418 199,331 199,128 112,128" fill="#ae9ce6" fill-opacity="0.18" stroke="none"/>
<rect x="112" y="128" width="290" height="290" fill="none" stroke="#3d4148" stroke-width="1.5"/>
<text x="112" y="438" font-size="14" fill="#a7adb5" text-anchor="middle">−2</text>
<text x="104" y="423" font-size="14" fill="#a7adb5" text-anchor="end">−2</text>
<text x="228" y="438" font-size="14" fill="#a7adb5" text-anchor="middle">0</text>
<text x="104" y="307" font-size="14" fill="#a7adb5" text-anchor="end">0</text>
<text x="344" y="438" font-size="14" fill="#a7adb5" text-anchor="middle">2</text>
<text x="104" y="191" font-size="14" fill="#a7adb5" text-anchor="end">2</text>
<text x="257" y="462" font-size="15" fill="#a7adb5" text-anchor="middle">x1</text>
<text x="52" y="118" font-size="15" fill="#a7adb5" text-anchor="start">x2</text>
<line x1="112" y1="418" x2="402" y2="128" stroke="#e0904f" stroke-width="2.5" stroke-linecap="round"/>
<line x1="199" y1="418" x2="199" y2="128" stroke="#ae9ce6" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="7 5"/>
<text x="402" y="120" font-size="14" fill="#e0904f" text-anchor="end">z1 = 0</text>
<text x="199" y="120" font-size="14" fill="#ae9ce6" text-anchor="middle">z2 = 0</text>
<text x="396.2" y="389" font-size="15" fill="#a7adb5" text-anchor="end" font-weight="600">R1</text>
<text x="204.8" y="151.2" font-size="15" fill="#a7adb5" text-anchor="start" font-weight="600">R3</text>
<text x="158.4" y="400.6" font-size="15" fill="#a7adb5" text-anchor="start" font-weight="600">R2</text>
<text x="117.8" y="244" font-size="15" fill="#a7adb5" text-anchor="start" font-weight="600">R4</text>
<circle cx="286" cy="186" r="6" fill="#e08db5"/>
<text x="286" y="172" font-size="15" fill="#e08db5" text-anchor="middle" font-weight="600">x = (1, 2)</text>
<text x="532" y="128" font-size="15" fill="#e9e7e3" text-anchor="start">z = Wx + b = (−1, 3)</text>
<text x="532" y="154" font-size="15" fill="#e9e7e3" text-anchor="start">a = relu(z) = (0, 3)</text>
<text x="532" y="180" font-size="15" fill="#e9e7e3" text-anchor="start" font-weight="600">ŷ = 2·0 − 1·3 = −3</text>
<text x="532" y="206" font-size="15" fill="#e9e7e3" text-anchor="start">6 + 3 = 9 parameters</text>
<line x1="532" y1="238" x2="836" y2="238" stroke="#3d4148" stroke-width="1.2" stroke-linecap="round"/>
<text x="532" y="266" font-size="17" fill="#e9e7e3" text-anchor="start" font-weight="bold">Output f in each region</text>
<rect x="532" y="286" width="16" height="16" fill="#86abe2" fill-opacity="0.5" stroke="#86abe2" stroke-width="1"/>
<text x="558" y="300" font-size="15" fill="#a7adb5" text-anchor="start" font-weight="600">R1</text>
<text x="590" y="300" font-size="15" fill="#a7adb5" text-anchor="start">(on, on)</text>
<text x="702" y="300" font-size="15" fill="#e9e7e3" text-anchor="start" font-weight="600">−2·x2 − 1</text>
<rect x="532" y="320" width="16" height="16" fill="#e0c169" fill-opacity="0.5" stroke="#e0c169" stroke-width="1"/>
<text x="558" y="334" font-size="15" fill="#a7adb5" text-anchor="start" font-weight="600">R2</text>
<text x="590" y="334" font-size="15" fill="#a7adb5" text-anchor="start">(on, off)</text>
<text x="702" y="334" font-size="15" fill="#e9e7e3" text-anchor="start" font-weight="600">2·x1 − 2·x2</text>
<rect x="532" y="354" width="16" height="16" fill="#6cc6ba" fill-opacity="0.5" stroke="#6cc6ba" stroke-width="1"/>
<text x="558" y="368" font-size="15" fill="#a7adb5" text-anchor="start" font-weight="600">R3</text>
<text x="590" y="368" font-size="15" fill="#a7adb5" text-anchor="start">(off, on)</text>
<text x="702" y="368" font-size="15" fill="#e9e7e3" text-anchor="start" font-weight="600">−2·x1 − 1</text>
<rect x="532" y="388" width="16" height="16" fill="#ae9ce6" fill-opacity="0.5" stroke="#ae9ce6" stroke-width="1"/>
<text x="558" y="402" font-size="15" fill="#a7adb5" text-anchor="start" font-weight="600">R4</text>
<text x="590" y="402" font-size="15" fill="#a7adb5" text-anchor="start">(off, off)</text>
<text x="702" y="402" font-size="15" fill="#e9e7e3" text-anchor="start" font-weight="600">0</text>
<text x="32" y="496" font-size="14" fill="#a7adb5" text-anchor="start">Unit 1 is on when x1 &gt; x2, unit 2 when x1 &gt; −0.5; the output is f = 2·a1 − a2, so each region is one flat plane.</text>
</svg>
