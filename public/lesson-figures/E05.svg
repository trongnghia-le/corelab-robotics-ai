<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" font-family="Inter, Arial, sans-serif">
<rect width="760" height="380" fill="#111827" rx="12"/>
<text x="30" y="30" fill="#e5e7eb" font-size="16" font-weight="bold">Start (robot at A, hand empty)</text>
<rect x="30" y="50" width="120" height="90" rx="8" fill="#1f2937" stroke="#38bdf8" stroke-width="2"/><text x="90" y="72" text-anchor="middle" fill="#e5e7eb" font-size="15" font-weight="bold">A</text><text x="90" y="96" text-anchor="middle" fill="#a3e635" font-size="14">cup</text><text x="90" y="116" text-anchor="middle" fill="#a3e635" font-size="14">robot</text><rect x="170" y="50" width="120" height="90" rx="8" fill="#1f2937" stroke="#38bdf8" stroke-width="2"/><text x="230" y="72" text-anchor="middle" fill="#e5e7eb" font-size="15" font-weight="bold">B</text><text x="230" y="96" text-anchor="middle" fill="#a3e635" font-size="14">box</text><rect x="310" y="50" width="120" height="90" rx="8" fill="#1f2937" stroke="#a3e635" stroke-width="2"/><text x="370" y="72" text-anchor="middle" fill="#e5e7eb" font-size="15" font-weight="bold">C</text><text x="370" y="96" text-anchor="middle" fill="#a3e635" font-size="14">free</text>
<text x="30" y="185" fill="#e5e7eb" font-size="16" font-weight="bold">Goal</text>
<rect x="30" y="200" width="120" height="90" rx="8" fill="#1f2937" stroke="#a3e635" stroke-width="2"/><text x="90" y="222" text-anchor="middle" fill="#e5e7eb" font-size="15" font-weight="bold">A</text><text x="90" y="246" text-anchor="middle" fill="#a3e635" font-size="14">free</text><rect x="170" y="200" width="120" height="90" rx="8" fill="#1f2937" stroke="#38bdf8" stroke-width="2"/><text x="230" y="222" text-anchor="middle" fill="#e5e7eb" font-size="15" font-weight="bold">B</text><text x="230" y="246" text-anchor="middle" fill="#a3e635" font-size="14">cup</text><rect x="310" y="200" width="120" height="90" rx="8" fill="#1f2937" stroke="#38bdf8" stroke-width="2"/><text x="370" y="222" text-anchor="middle" fill="#e5e7eb" font-size="15" font-weight="bold">C</text><text x="370" y="246" text-anchor="middle" fill="#a3e635" font-size="14">box</text>
<text x="470" y="30" fill="#e5e7eb" font-size="16" font-weight="bold">Shortest plan (BFS, 8 steps)</text>
<text x="470" y="88" fill="#e5e7eb" font-size="15"><tspan fill="#f97316">1.</tspan> move(A,B)</text><text x="470" y="116" fill="#e5e7eb" font-size="15"><tspan fill="#f97316">2.</tspan> pick(box,B)</text><text x="470" y="144" fill="#e5e7eb" font-size="15"><tspan fill="#f97316">3.</tspan> move(B,C)</text><text x="470" y="172" fill="#e5e7eb" font-size="15"><tspan fill="#f97316">4.</tspan> place(box,C)</text><text x="470" y="200" fill="#e5e7eb" font-size="15"><tspan fill="#f97316">5.</tspan> move(C,A)</text><text x="470" y="228" fill="#e5e7eb" font-size="15"><tspan fill="#f97316">6.</tspan> pick(cup,A)</text><text x="470" y="256" fill="#e5e7eb" font-size="15"><tspan fill="#f97316">7.</tspan> move(A,B)</text><text x="470" y="284" fill="#e5e7eb" font-size="15"><tspan fill="#f97316">8.</tspan> place(cup,B)</text>
<text x="30" y="335" fill="#e5e7eb" font-size="14">Applying an operator: new state = (state minus delete list) plus add list.</text>
<text x="30" y="358" fill="#e5e7eb" font-size="14">pick(box,B): needs at_robot(B), at(box,B), handempty; adds holding(box), free(B).</text>
</svg>