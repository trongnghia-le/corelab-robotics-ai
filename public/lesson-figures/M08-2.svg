<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" font-family="Inter, sans-serif">
<title>Sequential updating: each “open” reading doubles the odds</title>
<desc>Left: belief that the door is open after 0 to 10 open readings with Bayes factor 2, rising from 0.5 to 0.999. Right: the odds on a log axis grow as a straight line, 2 to the n.</desc>
<rect width="900" height="480" rx="14" fill="#17181b"/>

