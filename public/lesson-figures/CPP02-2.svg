<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="Inter, sans-serif">
<title>Where objects live: static, stack, heap</title>
<desc>Three storage areas. Static holds globals, the stack holds the handles v (24 bytes) and p (8 bytes), the heap holds the 4000-byte and 4-byte blocks they own.</desc>
<rect width="900" height="420" rx="14" fill="#17181b"/>
<defs><marker id="c022-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs>
<text x="32" y="44" font-size="22" fill="#e9e7e3" font-weight="700">Where objects live: static, stack, heap</text>
<rect x="32" y="72" width="232" height="316" rx="10" fill="#22252a" stroke="#3d4148" stroke-width="1.5"/>
<rect x="288" y="72" width="300" height="316" rx="10" fill="#22252a" stroke="#3d4148" stroke-width="1.5"/>
<rect x="612" y="72" width="256" height="316" rx="10" fill="#22252a" stroke="#3d4148" stroke-width="1.5"/>
<text x="52" y="104" font-size="17" fill="#e9e7e3" font-weight="700">static</text>
<text x="308" y="104" font-size="17" fill="#e9e7e3" font-weight="700">stack (automatic)</text>
<text x="632" y="104" font-size="17" fill="#e9e7e3" font-weight="700">heap (dynamic)</text>
<text x="52" y="132" font-size="14" fill="#a7adb5">namespace scope,</text>
<text x="52" y="152" font-size="14" fill="#a7adb5">static locals</text>
<rect x="52" y="176" width="192" height="40" rx="0" fill="none" stroke="#e0c169" stroke-width="2"/>
<text x="148" y="202" font-size="15" fill="#e9e7e3" font-weight="600" text-anchor="middle">g_allocs, g_bytes</text>
<text x="52" y="360" font-size="14" fill="#e0c169">ends: program exit</text>
<text x="308" y="132" font-size="14" fill="#a7adb5">frame of main</text>
<rect x="308" y="148" width="200" height="44" rx="0" fill="none" stroke="#86abe2" stroke-width="2"/>
<text x="408" y="176" font-size="15" fill="#e9e7e3" font-weight="600" text-anchor="middle">v: 24 B</text>
<rect x="308" y="224" width="200" height="44" rx="0" fill="none" stroke="#ae9ce6" stroke-width="2"/>
<text x="408" y="252" font-size="15" fill="#e9e7e3" font-weight="600" text-anchor="middle">p: 8 B</text>
<text x="308" y="360" font-size="14" fill="#86abe2">ends: end of block</text>
<text x="526" y="160" font-size="14" fill="#a7adb5">handle</text>
<rect x="632" y="148" width="216" height="44" rx="0" fill="none" stroke="#6fc693" stroke-width="2"/>
<text x="740" y="176" font-size="15" fill="#e9e7e3" font-weight="600" text-anchor="middle">1000 ints = 4000 B</text>
<rect x="632" y="224" width="216" height="44" rx="0" fill="none" stroke="#6cc6ba" stroke-width="2"/>
<text x="740" y="252" font-size="15" fill="#e9e7e3" font-weight="600" text-anchor="middle">int = 4 B</text>
<text x="632" y="360" font-size="14" fill="#6fc693">ends: owner's destructor</text>
<line x1="508" y1="170" x2="628" y2="170" stroke="#86abe2" stroke-width="2" marker-end="url(#c022-arr)"/>
<line x1="508" y1="246" x2="628" y2="246" stroke="#ae9ce6" stroke-width="2" marker-end="url(#c022-arr)"/>
<text x="632" y="300" font-size="14" fill="#a7adb5">payload</text>
</svg>
