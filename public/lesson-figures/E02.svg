<text x="40" y="350" fill="#53b2dd" font-size="14">blue: expanded by A* (f = g + h)</text>
<text x="40" y="370" fill="#d97936" font-size="14">orange: also expanded by Dijkstra (g only)</text>
<text x="420" y="30" fill="#e5e7eb" font-size="16" font-weight="bold">Inconsistent h: B expanded twice</text>
<g stroke="#e5e7eb" stroke-width="2" fill="none" marker-end="url(#h)">
<path d="M470 190 L560 110" marker-end="url(#h)"/><path d="M470 210 L560 290" marker-end="url(#h)"/><path d="M590 130 L590 262" marker-end="url(#h)"/><path d="M620 300 L700 210" marker-end="url(#h)"/></g>
