<g fill="#e5e7eb" font-size="16" text-anchor="middle"><text x="445" y="206">S</text><text x="590" y="101">A</text><text x="590" y="301">B</text><text x="725" y="206">G</text></g>
<g fill="#e5e7eb" font-size="14"><text x="480" y="130">c=1</text><text x="480" y="275">c=3</text><text x="598" y="205">c=1</text><text x="668" y="275">c=3</text></g>
<text x="440" y="345" fill="#e5e7eb" font-size="13">h(A)=4, others 0.  Order: S, B(g=3), A, B(g=2), G(g=5)</text>
<text x="440" y="365" fill="#e5e7eb" font-size="13">A closed set that never reopens B would return 6.</text>
</svg>