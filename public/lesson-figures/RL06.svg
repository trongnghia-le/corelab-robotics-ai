<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 360" font-family="Inter, Arial, sans-serif">
<rect width="780" height="360" fill="#111827" rx="12"/>
<text x="30" y="34" font-size="16" fill="#e5e7eb" font-weight="bold">A. Cliff walking: two learned paths (4 x 12 grid)</text>
<text x="500" y="34" font-size="16" fill="#e5e7eb" font-weight="bold">B. Same transition, two targets</text>
<g stroke="#e5e7eb" stroke-width="1" fill="none">
<rect x="30" y="60" width="430" height="148"/>
</g>
<rect x="66" y="171" width="359" height="37" fill="#f97316" opacity="0.45"/>
<text x="180" y="196" font-size="14" fill="#e5e7eb">cliff (-100, back to start)</text>
<text x="34" y="196" font-size="14" fill="#e5e7eb">S</text><text x="436" y="196" font-size="14" fill="#e5e7eb">G</text>
<polyline points="48,190 48,172 66,172 425,172 442,172 442,190" fill="none" stroke="#38bdf8" stroke-width="4"/>
<polyline points="48,190 48,80 442,80 442,190" fill="none" stroke="#a3e635" stroke-width="4"/>
<text x="100" y="164" font-size="14" fill="#38bdf8">Q-learning: 13 steps, along the edge</text>
<text x="100" y="72" font-size="14" fill="#a3e635">SARSA: 17 steps, away from the edge</text>
<text x="30" y="240" font-size="14" fill="#e5e7eb">epsilon = 0.1, alpha = 0.5, gamma = 1, seeds 11 to 15</text>
<text x="30" y="266" font-size="14" fill="#38bdf8">online return (last 100 episodes): Q-learning -51.1, se 2.1</text>
<text x="30" y="290" font-size="14" fill="#a3e635">online return (last 100 episodes): SARSA -25.3, se 0.9</text>
<text x="30" y="324" font-size="14" fill="#e5e7eb">Edge path is optimal for a greedy walker but costly when</text>
<text x="30" y="344" font-size="14" fill="#e5e7eb">10 percent of the moves are random.</text>
<text x="500" y="76" font-size="14" fill="#e5e7eb">r = -1, gamma = 0.9, Q(s') = (-3, -1, -2, -5)</text>
<text x="500" y="98" font-size="14" fill="#e5e7eb">next action actually taken a' = left (-5)</text>
<rect x="500" y="120" width="250" height="64" rx="8" fill="none" stroke="#38bdf8" stroke-width="2"/>
<text x="512" y="146" font-size="14" fill="#38bdf8">Q-learning: -1 + 0.9 max = -1.9</text>
<text x="512" y="168" font-size="14" fill="#e5e7eb">assumes the best next action</text>
<rect x="500" y="200" width="250" height="64" rx="8" fill="none" stroke="#a3e635" stroke-width="2"/>
<text x="512" y="226" font-size="14" fill="#a3e635">SARSA: -1 + 0.9 (-5) = -5.5</text>
<text x="512" y="248" font-size="14" fill="#e5e7eb">uses the action it really took</text>
<text x="500" y="296" font-size="14" fill="#e5e7eb">terminated transition: target = r only</text>
<text x="500" y="318" font-size="14" fill="#e5e7eb">truncated: bootstrap as usual</text>
</svg>
