<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" font-family="Inter, sans-serif">
<title>Lever arms: how joint errors move the tip</title>
<desc>For q=(35°,-70°), l1=0.4 m, l2=0.25 m: a shoulder error moves the tip perpendicular to O-P with lever arm r=0.539 m, an elbow error perpendicular to link 2 with lever arm l2=0.25 m.</desc>
<defs><marker id="R044enarr-6cc6ba" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 z" fill="#6cc6ba"/></marker><marker id="R044enarr-6fc693" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 z" fill="#6fc693"/></marker><marker id="R044enarr-86abe2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 z" fill="#86abe2"/></marker><marker id="R044enarr-a7adb5" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 z" fill="#a7adb5"/></marker><marker id="R044enarr-ae9ce6" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 z" fill="#ae9ce6"/></marker><marker id="R044enarr-e08db5" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 z" fill="#e08db5"/></marker><marker id="R044enarr-e0904f" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 z" fill="#e0904f"/></marker><marker id="R044enarr-e0c169" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 z" fill="#e0c169"/></marker><marker id="R044enarr-e58a80" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 z" fill="#e58a80"/></marker><marker id="R044enarr-e9e7e3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 z" fill="#e9e7e3"/></marker></defs>
<rect width="900" height="540" rx="14" fill="#17181b"/>
<text x="32.0" y="44.0" font-size="22" fill="#e9e7e3" text-anchor="start" font-weight="bold">Error equals angle times distance to the tip</text>
<line x1="90.0" y1="440.0" x2="345.6" y2="398.7" stroke="#a7adb5" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 6"/>
<line x1="90.0" y1="440.0" x2="247.3" y2="329.9" stroke="#86abe2" stroke-width="6" stroke-linecap="round"/>
<line x1="247.3" y1="329.9" x2="345.6" y2="398.7" stroke="#e0904f" stroke-width="6" stroke-linecap="round"/>
<line x1="345.6" y1="398.7" x2="304.3" y2="143.1" stroke="#86abe2" stroke-width="3" stroke-linecap="round" marker-end="url(#R044enarr-86abe2)"/>
<line x1="345.6" y1="398.7" x2="414.4" y2="300.4" stroke="#e0904f" stroke-width="3" stroke-linecap="round" marker-end="url(#R044enarr-e0904f)"/>
<path d="M323.9 402.2 L320.3 380.5 L342.1 377.0" fill="none" stroke="#86abe2" stroke-width="1.5"/>
<path d="M334.1 390.7 L342.1 379.2 L353.6 387.2" fill="none" stroke="#e0904f" stroke-width="1.5"/>
<circle cx="90.0" cy="440.0" r="7.0" fill="#17181b" stroke="#e9e7e3" stroke-width="2.5" />
<circle cx="247.3" cy="329.9" r="7.0" fill="#17181b" stroke="#e9e7e3" stroke-width="2.5" />
<circle cx="345.6" cy="398.7" r="7.0" fill="#6fc693" />
<text x="78.0" y="470.0" font-size="15" fill="#a7adb5" text-anchor="end" font-weight="normal">O</text>
<text x="233.0" y="320.0" font-size="15" fill="#a7adb5" text-anchor="end" font-weight="normal">E</text>
<text x="350.0" y="433.0" font-size="15" fill="#6fc693" text-anchor="start" font-weight="bold">P</text>
<text x="228.0" y="449.0" font-size="15" fill="#a7adb5" text-anchor="middle" font-weight="normal">lever arm r = 0.539 m</text>
<text x="318.0" y="151.0" font-size="15" fill="#86abe2" text-anchor="start" font-weight="normal">∂p/∂q₁: length r</text>
<text x="428.0" y="304.0" font-size="15" fill="#e0904f" text-anchor="start" font-weight="normal">∂p/∂q₂: length l₂</text>
<text x="284.0" y="386.0" font-size="15" fill="#e0904f" text-anchor="end" font-weight="normal">l₂ = 0.25 m</text>
<text x="32.0" y="524.0" font-size="14" fill="#a7adb5" text-anchor="start" font-weight="normal">arrows: metres per radian, same scale as the arm</text>
<rect x="542" y="330" width="326" height="190" rx="10" fill="#22252a"/>
<text x="566.0" y="362.0" font-size="17" fill="#a7adb5" text-anchor="start" font-weight="bold">First order, small angle errors</text>
<text x="566.0" y="390.0" font-size="15" fill="#e9e7e3" text-anchor="start" font-weight="normal">δp ≈ r δ₁ ⊥ OP + l₂ δ₂ ⊥ link 2</text>
<text x="566.0" y="416.0" font-size="15" fill="#e9e7e3" text-anchor="start" font-weight="normal">|δp| ≤ r|δ₁| + l₂|δ₂|</text>
<text x="566.0" y="452.0" font-size="17" fill="#a7adb5" text-anchor="start" font-weight="bold">For δ = 1° (0.01745 rad)</text>
<text x="566.0" y="480.0" font-size="15" fill="#86abe2" text-anchor="start" font-weight="normal">shoulder: 0.539 × 0.01745 = 9.4 mm</text>
<text x="566.0" y="506.0" font-size="15" fill="#e0904f" text-anchor="start" font-weight="normal">elbow: 0.25 × 0.01745 = 4.4 mm</text>
</svg>
