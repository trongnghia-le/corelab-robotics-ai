<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" font-family="Inter, Arial, sans-serif" font-size="14">
<rect width="720" height="340" fill="#111827" rx="12"/>
<defs><marker id="o" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#f97316"/></marker>
<marker id="g" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#a3e635"/></marker></defs>
<g fill="#e5e7eb">
<text x="24" y="32" font-size="15" font-weight="bold">Gradient of f = x^2 + 2y^2 at (1, 1)</text>
<text x="400" y="32" font-size="15" font-weight="bold">Jacobian of g: R^3 to R^2</text>
<text x="24" y="320" font-size="13" fill="#38bdf8">level curves f = 1, 3, 6</text>
<text x="264" y="65" fill="#f97316">grad f = (2, 4)</text>
<text x="24" y="300" fill="#a3e635" font-size="13">green arrow: steepest descent, -grad f</text>
<text x="400" y="270" font-size="13">m outputs x n inputs: here 2 x 3</text>
<text x="408" y="226" font-size="13" fill="#38bdf8">row i = grad g_i^T</text>
<text x="452" y="108" font-size="13">dx1</text><text x="494" y="108" font-size="13">dx2</text><text x="536" y="108" font-size="13">dx3</text>
<text x="396" y="138" font-size="13">dg1</text><text x="396" y="174" font-size="13">dg2</text>
<text x="590" y="152" font-size="15">J dx = dg</text>
<text x="400" y="248" font-size="13" fill="#a3e635">g(x+dx) ~ g(x) + J dx</text>
</g>
<g stroke="#e5e7eb" stroke-width="1.2"><line x1="20" y1="175" x2="360" y2="175"/><line x1="190" y1="285" x2="190" y2="45"/></g>
<ellipse cx="190" cy="175" rx="52.0" ry="36.8" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.8"/><ellipse cx="190" cy="175" rx="90.1" ry="63.7" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.8"/><ellipse cx="190" cy="175" rx="127.4" ry="90.1" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.8"/>
<circle cx="242" cy="123" r="5" fill="#fff"/>
<line x1="242" y1="123" x2="270" y2="67" stroke="#f97316" stroke-width="3" marker-end="url(#o)"/>
<line x1="242" y1="123" x2="214" y2="179" stroke="#a3e635" stroke-width="3" marker-end="url(#g)"/>
<g fill="none" stroke="#e5e7eb" stroke-width="2"></g>
<g fill="#38bdf8" fill-opacity="0.25" stroke="#38bdf8" stroke-width="2"><rect x="440" y="116" width="126" height="30"/><rect x="440" y="150" width="126" height="30"/></g>
<g fill="none" stroke="#a3e635" stroke-width="2"><rect x="420" y="240" width="1" height="1"/></g>
</svg>