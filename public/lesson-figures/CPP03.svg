<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" font-family="Inter, Arial, sans-serif">
<rect width="760" height="340" fill="#111827" rx="12"/>
<text x="20" y="30" font-size="16" font-weight="bold" fill="#e5e7eb">Move transfers ownership: Buffer b = std::move(a)</text>
<text x="20" y="70" font-size="14" fill="#38bdf8" font-weight="bold">Before</text>
<rect x="20" y="85" width="170" height="60" rx="8" fill="none" stroke="#e5e7eb" stroke-width="2"/>
<text x="105" y="108" font-size="14" fill="#e5e7eb" text-anchor="middle">a</text>
<text x="105" y="130" font-size="13" fill="#e5e7eb" text-anchor="middle">data_ = A, size_ = 3</text>
<rect x="260" y="85" width="170" height="60" rx="8" fill="none" stroke="#e5e7eb" stroke-width="2" stroke-dasharray="5 4"/>
<text x="345" y="120" font-size="14" fill="#e5e7eb" text-anchor="middle">b (not yet built)</text>
<rect x="520" y="85" width="220" height="60" rx="8" fill="#1f2937" stroke="#a3e635" stroke-width="2"/>
<text x="630" y="108" font-size="14" fill="#a3e635" text-anchor="middle">heap block A</text>
<text x="630" y="130" font-size="13" fill="#e5e7eb" text-anchor="middle">[0.0, 1.0, 2.0]</text>
<path d="M190 115 H518" stroke="#38bdf8" stroke-width="2"/><path d="M510 109 L518 115 L510 121" fill="none" stroke="#38bdf8" stroke-width="2"/>
<text x="20" y="195" font-size="14" fill="#f97316" font-weight="bold">After (O(1): two pointer writes)</text>
<rect x="20" y="210" width="170" height="60" rx="8" fill="none" stroke="#e5e7eb" stroke-width="2"/>
<text x="105" y="233" font-size="14" fill="#e5e7eb" text-anchor="middle">a (moved-from)</text>
<text x="105" y="255" font-size="13" fill="#f97316" text-anchor="middle">data_ = nullptr, size_ = 0</text>
<rect x="260" y="210" width="170" height="60" rx="8" fill="none" stroke="#e5e7eb" stroke-width="2"/>
<text x="345" y="233" font-size="14" fill="#e5e7eb" text-anchor="middle">b (owner)</text>
<text x="345" y="255" font-size="13" fill="#e5e7eb" text-anchor="middle">data_ = A, size_ = 3</text>
<rect x="520" y="210" width="220" height="60" rx="8" fill="#1f2937" stroke="#a3e635" stroke-width="2"/>
<text x="630" y="233" font-size="14" fill="#a3e635" text-anchor="middle">heap block A</text>
<text x="630" y="255" font-size="13" fill="#e5e7eb" text-anchor="middle">[0.0, 1.0, 2.0]</text>
<path d="M430 240 H518" stroke="#38bdf8" stroke-width="2"/><path d="M510 234 L518 240 L510 246" fill="none" stroke="#38bdf8" stroke-width="2"/>
<text x="20" y="310" font-size="13" fill="#e5e7eb">Scope ends: ~b frees A once; ~a does delete[] nullptr, a no-op. Without nulling a, A is freed twice.</text>
</svg>
