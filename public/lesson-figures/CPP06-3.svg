<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="Inter, sans-serif">
<title>Fold direction changes a floating-point sum</title>
<desc>Pack (1, 1e16, -1e16): left fold gives 0, right fold gives 1, because doubles near 1e16 are spaced by 2 and 1e16+1 rounds to 1e16. Pack (1e16, -1e16, 1) swaps the results.</desc>
<defs><marker id="b3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a7adb5"/></marker></defs>
<rect width="900" height="500" rx="14" fill="#17181b"/>
<text x="32" y="44" font-size="22" font-weight="bold" fill="#e9e7e3">Fold direction changes a floating-point sum</text>
<rect x="32" y="64" width="410" height="250" rx="10" fill="#22252a"/>
<rect x="458" y="64" width="410" height="250" rx="10" fill="#22252a"/>
<rect x="32" y="338" width="836" height="130" rx="10" fill="#22252a"/>
<text x="52" y="96" font-size="17" font-weight="bold" fill="#e9e7e3">Left fold  (... + args)</text>
<text x="478" y="96" font-size="17" font-weight="bold" fill="#e9e7e3">Right fold  (args + ...)</text>
<text x="52" y="118" font-size="14" fill="#a7adb5">pack (1, 10¹⁶, −10¹⁶)</text>
<text x="478" y="118" font-size="14" fill="#a7adb5">pack (1, 10¹⁶, −10¹⁶)</text>
<rect x="52" y="134" width="170" height="44" rx="8" fill="#17181b" stroke="#3d4148" stroke-width="2"/>
<text x="66" y="162" font-size="15" fill="#e9e7e3">1 + 10¹⁶</text>
<line x1="222" y1="156" x2="266" y2="156" stroke="#a7adb5" stroke-width="2" marker-end="url(#b3)"/>
<rect x="270" y="134" width="160" height="44" rx="8" fill="#17181b" stroke="#e0c169" stroke-width="2"/>
<text x="284" y="162" font-size="15" font-weight="600" fill="#e0c169">10¹⁶</text>
<rect x="52" y="194" width="170" height="44" rx="8" fill="#17181b" stroke="#3d4148" stroke-width="2"/>
<text x="66" y="222" font-size="15" fill="#e9e7e3">10¹⁶ − 10¹⁶</text>
<line x1="222" y1="216" x2="266" y2="216" stroke="#a7adb5" stroke-width="2" marker-end="url(#b3)"/>
<rect x="270" y="194" width="160" height="44" rx="8" fill="#17181b" stroke="#6fc693" stroke-width="2"/>
<text x="284" y="222" font-size="15" font-weight="600" fill="#6fc693">0</text>
<text x="52" y="264" font-size="14" fill="#e0c169">step 1 is a tie: rounds to even, the 1 is lost</text>
<text x="52" y="296" font-size="15" font-weight="600" fill="#6fc693">result  0</text>
<rect x="478" y="134" width="170" height="44" rx="8" fill="#17181b" stroke="#3d4148" stroke-width="2"/>
<text x="492" y="162" font-size="15" fill="#e9e7e3">10¹⁶ − 10¹⁶</text>
<line x1="648" y1="156" x2="692" y2="156" stroke="#a7adb5" stroke-width="2" marker-end="url(#b3)"/>
<rect x="696" y="134" width="160" height="44" rx="8" fill="#17181b" stroke="#6fc693" stroke-width="2"/>
<text x="710" y="162" font-size="15" font-weight="600" fill="#6fc693">0</text>
<rect x="478" y="194" width="170" height="44" rx="8" fill="#17181b" stroke="#3d4148" stroke-width="2"/>
<text x="492" y="222" font-size="15" fill="#e9e7e3">1 + 0</text>
<line x1="648" y1="216" x2="692" y2="216" stroke="#a7adb5" stroke-width="2" marker-end="url(#b3)"/>
<rect x="696" y="194" width="160" height="44" rx="8" fill="#17181b" stroke="#6fc693" stroke-width="2"/>
<text x="710" y="222" font-size="15" font-weight="600" fill="#6fc693">1</text>
<text x="478" y="264" font-size="14" fill="#6fc693">the cancellation happens first, the 1 survives</text>
<text x="478" y="296" font-size="15" font-weight="600" fill="#6fc693">result  1</text>
<text x="52" y="368" font-size="17" font-weight="bold" fill="#e9e7e3">Why: doubles near 10¹⁶ are spaced by 2</text>
<line x1="280" y1="420" x2="800" y2="420" stroke="#a7adb5" stroke-width="2"/>
<circle cx="300" cy="420" r="6" fill="#86abe2"/>
<text x="300" y="448" font-size="15" text-anchor="middle" fill="#e9e7e3">10¹⁶</text>
<circle cx="520" cy="420" r="6" fill="#86abe2"/>
<text x="520" y="448" font-size="15" text-anchor="middle" fill="#e9e7e3">10¹⁶ + 2</text>
<circle cx="740" cy="420" r="6" fill="#86abe2"/>
<text x="740" y="448" font-size="15" text-anchor="middle" fill="#e9e7e3">10¹⁶ + 4</text>
<circle cx="410" cy="420" r="6" fill="#17181b" stroke="#e58a80" stroke-width="2"/>
<text x="410" y="398" font-size="14" text-anchor="middle" fill="#e58a80">10¹⁶ + 1: tie, rounds to even 10¹⁶</text>
<text x="52" y="424" font-size="14" fill="#86abe2">stored doubles</text>
<text x="852" y="368" font-size="14" text-anchor="end" fill="#a7adb5">pack 2 (10¹⁶, −10¹⁶, 1): left 1, right 0</text>
</svg>
