<text x="672" y="248" font-size="17" fill="#e9e7e3" text-anchor="start" font-weight="bold">Reading</text>
<text x="672" y="276" font-size="14" fill="#a7adb5" text-anchor="start">Flat part: complex roots,</text>
<text x="672" y="300" font-size="14" fill="#a7adb5" text-anchor="start">|r| = √β for every λ.</text>
<text x="672" y="324" font-size="14" fill="#a7adb5" text-anchor="start">Stable: 0 &lt; x &lt; 2(1+β);</text>
<text x="672" y="348" font-size="14" fill="#a7adb5" text-anchor="start">β = 4/9 reaches 2.89.</text>
<text x="672" y="372" font-size="14" fill="#a7adb5" text-anchor="start">Dots: μ = 1, L = 25</text>
<text x="672" y="396" font-size="14" fill="#a7adb5" text-anchor="start">at η* = 1/9.</text>
<text x="32" y="456" font-size="14" fill="#a7adb5" text-anchor="start">Computed from r² − (1 + β − x) r + β = 0 and ρ = max |r|. For κ = 25, plain GD is best at η = 1/13 with ρ = 12/13 = 0.923.</text>
<text x="32" y="478" font-size="14" fill="#a7adb5" text-anchor="start">Both extreme directions sit on the edges of the flat window: x = (1 − √β)² = 1/9 and (1 + √β)² = 25/9.</text>
