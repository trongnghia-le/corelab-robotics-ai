<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380">
<rect width="760" height="380" fill="#191b1f" rx="12"/>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#e5e7eb"/></marker></defs>
<text x="24" y="30" fill="#e5e7eb" font-size="16" text-anchor="start" font-family="Inter, Arial, sans-serif">Predict-correct loop and the noise-versus-lag trade-off</text>
<rect x="30" y="70" width="150" height="56" rx="6" fill="none" stroke="#53b2dd" stroke-width="2"/>
<text x="105.0" y="94.5" fill="#53b2dd" font-size="14" text-anchor="middle" font-family="Inter, Arial, sans-serif">predict</text>
<text x="105.0" y="111.5" fill="#53b2dd" font-size="14" text-anchor="middle" font-family="Inter, Arial, sans-serif">x⁻ = x + dt·v</text>
<rect x="240" y="70" width="150" height="56" rx="6" fill="none" stroke="#d97936" stroke-width="2"/>
<text x="315.0" y="94.5" fill="#d97936" font-size="14" text-anchor="middle" font-family="Inter, Arial, sans-serif">residual</text>
<text x="315.0" y="111.5" fill="#d97936" font-size="14" text-anchor="middle" font-family="Inter, Arial, sans-serif">r = z − x⁻</text>
<rect x="240" y="190" width="150" height="56" rx="6" fill="none" stroke="#9ccd4e" stroke-width="2"/>
<text x="315.0" y="215.0" fill="#9ccd4e" font-size="13" text-anchor="middle" font-family="Inter, Arial, sans-serif">correct</text>
<text x="315.0" y="231.0" fill="#9ccd4e" font-size="13" text-anchor="middle" font-family="Inter, Arial, sans-serif">x += α·r, v += (β/dt)·r</text>
<line x1="180" y1="98" x2="238" y2="98" stroke="#e5e7eb" stroke-width="2" marker-end="url(#a)"/>
<line x1="315" y1="126" x2="315" y2="188" stroke="#e5e7eb" stroke-width="2" marker-end="url(#a)"/>
<line x1="240" y1="218" x2="105" y2="218" stroke="#e5e7eb" stroke-width="2"/>
<line x1="105" y1="218" x2="105" y2="128" stroke="#e5e7eb" stroke-width="2" marker-end="url(#a)"/>
<text x="116" y="170" fill="#e5e7eb" font-size="13" text-anchor="start" font-family="Inter, Arial, sans-serif">previous (x, v)</text>
<text x="322" y="48" fill="#d97936" font-size="13" text-anchor="start" font-family="Inter, Arial, sans-serif">sensor z = x + noise</text>
<line x1="315" y1="54" x2="315" y2="68" stroke="#d97936" stroke-width="2" marker-end="url(#a)"/>
<text x="30" y="290" fill="#d97936" font-size="13" text-anchor="start" font-family="Inter, Arial, sans-serif">α, β large: trust sensor</text>
<text x="30" y="310" fill="#9ccd4e" font-size="13" text-anchor="start" font-family="Inter, Arial, sans-serif">α, β small: trust model</text>
<text x="30" y="350" fill="#e5e7eb" font-size="13" text-anchor="start" font-family="Inter, Arial, sans-serif">Error matrix Φ: tr = 2−α−β, det = 1−α</text>
<rect x="470" y="70" width="250" height="230" rx="0" fill="none" stroke="#70747b" stroke-width="2"/>
<text x="595.0" y="330" fill="#e5e7eb" font-size="13" text-anchor="middle" font-family="Inter, Arial, sans-serif">velocity noise RMSE (m/s)</text>
<text x="458" y="185.0" fill="#e5e7eb" font-size="13" text-anchor="end" font-family="Inter, Arial, sans-serif">lag</text>
<text x="458" y="201.0" fill="#e5e7eb" font-size="13" text-anchor="end" font-family="Inter, Arial, sans-serif">(m/s)</text>
<circle cx="491.4" cy="103.57142857142858" r="6" fill="#9ccd4e" stroke="#9ccd4e" stroke-width="2"/>
<circle cx="518.0" cy="257.3809523809524" r="6" fill="#53b2dd" stroke="#53b2dd" stroke-width="2"/>
<circle cx="571.2" cy="270.04761904761904" r="6" fill="#53b2dd" stroke="#53b2dd" stroke-width="2"/>
<circle cx="688.1" cy="280.0" r="6" fill="#d97936" stroke="#d97936" stroke-width="2"/>
<text x="503.4" y="107.57142857142858" fill="#9ccd4e" font-size="13" text-anchor="start" font-family="Inter, Arial, sans-serif">slow gains</text>
<text x="528.0" y="249.3809523809524" fill="#53b2dd" font-size="13" text-anchor="start" font-family="Inter, Arial, sans-serif">mid</text>
<text x="567.2" y="256.04761904761904" fill="#53b2dd" font-size="13" text-anchor="middle" font-family="Inter, Arial, sans-serif">fast</text>
<text x="678.1" y="266.0" fill="#d97936" font-size="13" text-anchor="end" font-family="Inter, Arial, sans-serif">raw difference</text>
<text x="476" y="86" fill="#e5e7eb" font-size="13" text-anchor="start" font-family="Inter, Arial, sans-serif">2.0</text>
<text x="714" y="294" fill="#e5e7eb" font-size="13" text-anchor="end" font-family="Inter, Arial, sans-serif">0.3</text>
</svg>