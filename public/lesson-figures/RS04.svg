<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" font-family="Inter, Arial, sans-serif">
<rect width="760" height="360" fill="#191b1f" rx="12"/>
<defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#e5e7eb"/></marker></defs>
<text x="20" y="30" fill="#e5e7eb" font-size="16" font-weight="bold">From raw measurements to a verified figure</text>
<g fill="none" stroke-width="2">
<rect x="20" y="55" width="150" height="56" rx="8" stroke="#53b2dd"/><rect x="20" y="130" width="150" height="56" rx="8" stroke="#53b2dd"/>
<rect x="215" y="90" width="150" height="56" rx="8" stroke="#d97936"/><rect x="410" y="90" width="150" height="56" rx="8" stroke="#9ccd4e"/>
<rect x="600" y="90" width="140" height="56" rx="8" stroke="#9ccd4e"/>
</g>
<g fill="#e5e7eb" font-size="14" text-anchor="middle">
<text x="95" y="80">raw data (CSV)</text><text x="95" y="100" font-size="12">never edited</text>
<text x="95" y="155">locked env + code</text><text x="95" y="175" font-size="12">lock file, git commit</text>
<text x="290" y="115">analysis script</text><text x="290" y="135" font-size="12">config + seeds</text>
<text x="485" y="115">results table</text><text x="485" y="135" font-size="12">mean, n per condition</text>
<text x="670" y="115">figure</text><text x="670" y="135" font-size="12">regenerated by script</text>
</g>
<g stroke="#e5e7eb" stroke-width="2" fill="none" marker-end="url(#ar)"><path d="M170 83 L213 108"/><path d="M170 158 L213 128"/><path d="M365 118 L408 118"/><path d="M560 118 L598 118"/></g>
<rect x="20" y="215" width="720" height="60" rx="8" fill="none" stroke="#d97936" stroke-width="2" stroke-dasharray="5 4"/>
<text x="30" y="240" fill="#d97936" font-size="14">MANIFEST.sha256: a SHA-256 for every box above (inputs, code, config, outputs)</text>
<text x="30" y="262" fill="#e5e7eb" font-size="13">verify first; any mismatch stops the run before a figure is trusted</text>
<text x="20" y="305" fill="#9ccd4e" font-size="14">Re-run check: |new - reported| &lt;= 1.96 * sqrt(2) * sigma / sqrt(n)</text>
<text x="20" y="328" fill="#e5e7eb" font-size="13">sigma = 2, n = 5 seeds gives a tolerance of 2.48; same seeds on the same machine should match exactly</text>
</svg>
