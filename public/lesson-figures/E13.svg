<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" font-family="Inter, Arial, sans-serif">
<rect width="760" height="340" fill="#111827" rx="12"/>
<text x="20" y="32" fill="#e5e7eb" font-size="16" font-weight="bold">Stages as gates, each followed by a check</text>
<g fill="none" stroke-width="2">
<rect x="20" y="55" width="80" height="44" rx="8" stroke="#38bdf8"/><rect x="130" y="55" width="80" height="44" rx="8" stroke="#38bdf8"/>
<rect x="240" y="55" width="80" height="44" rx="8" stroke="#38bdf8"/><rect x="350" y="55" width="80" height="44" rx="8" stroke="#38bdf8"/>
<rect x="460" y="55" width="80" height="44" rx="8" stroke="#38bdf8"/>
</g>
<g fill="#e5e7eb" font-size="14" text-anchor="middle"><text x="60" y="82">grasp</text><text x="170" y="82">lift</text><text x="280" y="82">move</text><text x="390" y="82">place</text><text x="500" y="82">release</text></g>
<g stroke="#e5e7eb" stroke-width="2"><path d="M100 77 L130 77"/><path d="M210 77 L240 77"/><path d="M320 77 L350 77"/><path d="M430 77 L460 77"/></g>
<g fill="#a3e635" font-size="13" text-anchor="middle"><text x="115" y="48">p</text><text x="225" y="48">p</text><text x="335" y="48">p</text><text x="445" y="48">p</text></g>
<path d="M170 105 L170 135 L60 135 L60 105" fill="none" stroke="#f97316" stroke-width="2" stroke-dasharray="5 4"/>
<text x="75" y="153" fill="#f97316" font-size="13">detected failure (prob d): retry, up to R times</text>
<text x="20" y="185" fill="#e5e7eb" font-size="13">undetected failure (1-d): silent, task fails later</text>
<text x="20" y="208" fill="#e5e7eb" font-size="13">end-to-end = product of true-success per stage</text>
<line x1="590" y1="290" x2="740" y2="290" stroke="#e5e7eb"/><line x1="590" y1="290" x2="590" y2="60" stroke="#e5e7eb"/>
<text x="600" y="318" fill="#e5e7eb" font-size="13">stages n (1 to 10)</text>
<text x="596" y="56" fill="#e5e7eb" font-size="13">task success</text>
<path d="M590 83 C620 120 660 170 740 210" fill="none" stroke="#f97316" stroke-width="3"/>
<path d="M590 65 C640 75 690 90 740 106" fill="none" stroke="#a3e635" stroke-width="3"/>
<text x="620" y="232" fill="#f97316" font-size="13">no recovery 0.35</text>
<text x="640" y="124" fill="#a3e635" font-size="13">d=0.8, R=3: 0.80</text>
<text x="20" y="262" fill="#e5e7eb" font-size="14">p = 0.9 per stage:</text>
<text x="20" y="284" fill="#f97316" font-size="14">0.9^10 = 0.349 without recovery</text>
<text x="20" y="306" fill="#a3e635" font-size="14">0.978^10 = 0.799 with d=0.8, R=3</text>
</svg>
