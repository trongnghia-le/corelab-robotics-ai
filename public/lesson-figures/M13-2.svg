<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="Inter, sans-serif">
<title>Convex and non-convex: the chord test</title>
<desc>Left: the chord of f(x) = x² between x = -1 and x = 2 lies above the graph at x = 0.5 (2.5 against 0.25). Right: the minimum-thrust set and the keep-out disk are not convex because a midpoint falls outside.</desc>
<rect width="900" height="520" rx="14" fill="#17181b"/>

