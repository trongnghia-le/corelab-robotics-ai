<text x="109.0" y="136.0" font-size="15" fill="#a7adb5" text-anchor="middle">max +155 °C</text>
<rect x="360.0" y="84.0" width="170.0" height="68.0" rx="10" fill="#22252a" stroke="#ae9ce6" stroke-width="1.5"/>
<text x="445.0" y="112.0" font-size="17" fill="#e9e7e3" text-anchor="middle" font-weight="bold">Housing</text>
<text x="445.0" y="136.0" font-size="15" fill="#a7adb5" text-anchor="middle">τw2 = 970 | 150 s</text>
<rect x="692.0" y="84.0" width="176.0" height="68.0" rx="10" fill="#22252a" stroke="#6fc693" stroke-width="1.5"/>
<text x="780.0" y="112.0" font-size="17" fill="#e9e7e3" text-anchor="middle" font-weight="bold">Ambient</text>
<text x="780.0" y="136.0" font-size="15" fill="#a7adb5" text-anchor="middle">22 °C</text>
<line x1="194.0" y1="118.0" x2="360.0" y2="118.0" stroke="#e0904f" stroke-width="2.5" marker-end="url(#HW14-3a)"/>
<line x1="530.0" y1="118.0" x2="692.0" y2="118.0" stroke="#e0904f" stroke-width="2.5" marker-end="url(#HW14-3a)"/>
<text x="277.0" y="94.0" font-size="15" fill="#e0904f" text-anchor="middle">Rth1 = 3.4 K/W</text>
<text x="277.0" y="148.0" font-size="15" fill="#a7adb5" text-anchor="middle">τw1 = 36 s</text>
<text x="615.0" y="94.0" font-size="15" fill="#e0904f" text-anchor="middle">Rth2 = 9.8 | 1.5 K/W</text>
<text x="611.0" y="148.0" font-size="15" fill="#a7adb5" text-anchor="middle">plastic | metal</text>
<text x="32.0" y="184.0" font-size="15" fill="#e9e7e3" text-anchor="start">ΔT = I²·Rhot·(Rth1 + Rth2),   Rhot = 1.63 · (1 + 0.004 · 133) = 2.50 Ω at 155 °C</text>
