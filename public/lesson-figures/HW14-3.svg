<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="Inter, sans-serif">
<title>Heat sets the continuous current</title>
<desc>Thermal chain winding to housing to ambient with the 3257 G 024 CR resistances, the continuous current for three mountings against the printed rated current 2.36 A, and the derating curve of the rated current against ambient temperature.</desc>
<defs><marker id="HW14-3a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#a7adb5"/></marker></defs>
<rect width="900" height="600" rx="14" fill="#17181b"/>
<text x="32.0" y="44.0" font-size="22" fill="#e9e7e3" text-anchor="start" font-weight="bold">Heat decides how long you may stay at a point</text>
<rect x="32.0" y="84.0" width="170.0" height="68.0" rx="10" fill="#22252a" stroke="#86abe2" stroke-width="1.5"/>
