<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 590" font-family="Inter, sans-serif">
<title>QoS compatibility: offered must be at least as strong as requested</title>
<desc>Two 2 by 2 matrices for reliability and durability, with the publisher&#x27;s offer on the rows and the subscription&#x27;s request on the columns; best-effort offered with reliable requested and volatile offered with transient-local requested are the failing cells. A number line shows an offered deadline of 0.2 s failing a request of 0.1 s and an offer of 0.04 s passing.</desc>
