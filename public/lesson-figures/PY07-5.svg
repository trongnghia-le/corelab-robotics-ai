<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 510" font-family="Inter, sans-serif">
<title>Bisecting 200 commits: 8 test runs find commit 137</title>
<desc>Eight rows, one per git bisect probe, over commits 1 to 200 on a linear scale: the interval that may contain the first bad commit halves each time, with probes 100 good, 150 bad, 125 good, 137 bad, 131 good, 134 good, 135 good, 136 good, so the first bad commit is 137.</desc>
<defs></defs>
<rect width="900" height="510" rx="14" fill="#17181b"/>
<text x="32" y="44" font-size="22" fill="#e9e7e3" text-anchor="start" font-weight="bold">Bisecting 200 commits: 8 test runs find commit 137</text>
<text x="32" y="80" font-size="15" fill="#a7adb5" text-anchor="start">bar = commits that can still be the first bad one</text>
<line x1="216" y1="132" x2="216" y2="422" stroke="#2c3036" stroke-width="1" stroke-linecap="round"/>
<text x="216" y="124" font-size="14" fill="#a7adb5" text-anchor="middle">1</text>
<line x1="375" y1="132" x2="375" y2="422" stroke="#2c3036" stroke-width="1" stroke-linecap="round"/>
<text x="375" y="124" font-size="14" fill="#a7adb5" text-anchor="middle">50</text>
<line x1="536" y1="132" x2="536" y2="422" stroke="#2c3036" stroke-width="1" stroke-linecap="round"/>
<text x="536" y="124" font-size="14" fill="#a7adb5" text-anchor="middle">100</text>
<line x1="698" y1="132" x2="698" y2="422" stroke="#2c3036" stroke-width="1" stroke-linecap="round"/>
<text x="698" y="124" font-size="14" fill="#a7adb5" text-anchor="middle">150</text>
<line x1="860" y1="132" x2="860" y2="422" stroke="#2c3036" stroke-width="1" stroke-linecap="round"/>
<text x="860" y="124" font-size="14" fill="#a7adb5" text-anchor="middle">200</text>
<line x1="656" y1="132" x2="656" y2="422" stroke="#e0904f" stroke-width="2" stroke-dasharray="6 4" stroke-linecap="round"/>
<text x="32" y="153" font-size="15" fill="#e9e7e3" text-anchor="start" font-weight="600">1  m = 100</text>
<text x="150" y="153" font-size="15" fill="#6fc693" text-anchor="start" font-weight="600">good</text>
<rect x="216" y="139" width="644" height="18" rx="3" fill="#2b2f35" stroke="#86abe2" stroke-width="1.5"/>
<circle cx="536" cy="148" r="6" fill="#6fc693" stroke="#e9e7e3" stroke-width="1.5"/>
<text x="32" y="189" font-size="15" fill="#e9e7e3" text-anchor="start" font-weight="600">2  m = 150</text>
<text x="150" y="189" font-size="15" fill="#e58a80" text-anchor="start" font-weight="600">bad</text>
<rect x="536" y="175" width="324" height="18" rx="3" fill="#2b2f35" stroke="#86abe2" stroke-width="1.5"/>
<circle cx="698" cy="184" r="6" fill="#e58a80" stroke="#e9e7e3" stroke-width="1.5"/>
<text x="32" y="225" font-size="15" fill="#e9e7e3" text-anchor="start" font-weight="600">3  m = 125</text>
<text x="150" y="225" font-size="15" fill="#6fc693" text-anchor="start" font-weight="600">good</text>
<rect x="536" y="211" width="162" height="18" rx="3" fill="#2b2f35" stroke="#86abe2" stroke-width="1.5"/>
<circle cx="617" cy="220" r="6" fill="#6fc693" stroke="#e9e7e3" stroke-width="1.5"/>
<text x="32" y="261" font-size="15" fill="#e9e7e3" text-anchor="start" font-weight="600">4  m = 137</text>
<text x="150" y="261" font-size="15" fill="#e58a80" text-anchor="start" font-weight="600">bad</text>
<rect x="617" y="247" width="81" height="18" rx="3" fill="#2b2f35" stroke="#86abe2" stroke-width="1.5"/>
<circle cx="656" cy="256" r="6" fill="#e58a80" stroke="#e9e7e3" stroke-width="1.5"/>
<text x="32" y="297" font-size="15" fill="#e9e7e3" text-anchor="start" font-weight="600">5  m = 131</text>
<text x="150" y="297" font-size="15" fill="#6fc693" text-anchor="start" font-weight="600">good</text>
<rect x="617" y="283" width="39" height="18" rx="3" fill="#2b2f35" stroke="#86abe2" stroke-width="1.5"/>
<circle cx="637" cy="292" r="6" fill="#6fc693" stroke="#e9e7e3" stroke-width="1.5"/>
<text x="32" y="333" font-size="15" fill="#e9e7e3" text-anchor="start" font-weight="600">6  m = 134</text>
<text x="150" y="333" font-size="15" fill="#6fc693" text-anchor="start" font-weight="600">good</text>
<rect x="637" y="319" width="19" height="18" rx="3" fill="#2b2f35" stroke="#86abe2" stroke-width="1.5"/>
<circle cx="646" cy="328" r="6" fill="#6fc693" stroke="#e9e7e3" stroke-width="1.5"/>
<text x="32" y="369" font-size="15" fill="#e9e7e3" text-anchor="start" font-weight="600">7  m = 135</text>
<text x="150" y="369" font-size="15" fill="#6fc693" text-anchor="start" font-weight="600">good</text>
<rect x="646" y="355" width="10" height="18" rx="3" fill="#2b2f35" stroke="#86abe2" stroke-width="1.5"/>
<circle cx="650" cy="364" r="6" fill="#6fc693" stroke="#e9e7e3" stroke-width="1.5"/>
<text x="32" y="405" font-size="15" fill="#e9e7e3" text-anchor="start" font-weight="600">8  m = 136</text>
<text x="150" y="405" font-size="15" fill="#6fc693" text-anchor="start" font-weight="600">good</text>
<rect x="650" y="391" width="6" height="18" rx="3" fill="#2b2f35" stroke="#86abe2" stroke-width="1.5"/>
<circle cx="653" cy="400" r="6" fill="#6fc693" stroke="#e9e7e3" stroke-width="1.5"/>
<text x="656" y="446" font-size="15" fill="#e0904f" text-anchor="middle" font-weight="bold">first bad commit: 137</text>
<text x="860" y="80" font-size="15" fill="#a7adb5" text-anchor="end">commit number</text>
<text x="32" y="480" font-size="15" fill="#e9e7e3" text-anchor="start">Model m = floor((lo + hi) / 2): 8 probes here; the bound is ceil(log2 199) = 8.</text>
</svg>
