<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="Inter, sans-serif">
<title>Cost of the whole gradient: reverse mode is flat in n</title>
<desc>Log-log plot of the cost of the gradient of an n-input sigmoid neuron, in units of one forward pass, for finite differences, forward mode and reverse mode, with counts at n=1000.</desc>
<defs><marker id="mml052" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs>
<rect width="900" height="520" rx="14" fill="#17181b"/>
<text x="32" y="44" font-size="22" fill="#e9e7e3" text-anchor="start" font-weight="bold">Cost of the whole gradient: reverse mode is flat in n</text>
<rect x="32" y="68" width="560" height="424" rx="8" fill="#22252a" stroke="#3d4148" stroke-width="1.5"/>
<text x="48" y="96" font-size="17" fill="#e9e7e3" text-anchor="start" font-weight="bold">Cost vs number of parameters n</text>
<rect x="100" y="130" width="456" height="300" fill="none" stroke="#3d4148" stroke-width="1.5"/>
<line x1="100" y1="130" x2="100" y2="430" stroke="#2c3036" stroke-width="1"/>
<text x="100.0" y="450" font-size="14" fill="#a7adb5" text-anchor="middle">1</text>
<line x1="252" y1="130" x2="252" y2="430" stroke="#2c3036" stroke-width="1"/>
<text x="252.0" y="450" font-size="14" fill="#a7adb5" text-anchor="middle">1e2</text>
<line x1="404" y1="130" x2="404" y2="430" stroke="#2c3036" stroke-width="1"/>
<text x="404.0" y="450" font-size="14" fill="#a7adb5" text-anchor="middle">1e4</text>
<line x1="556" y1="130" x2="556" y2="430" stroke="#2c3036" stroke-width="1"/>
<text x="556.0" y="450" font-size="14" fill="#a7adb5" text-anchor="middle">1e6</text>
<line x1="100" y1="430" x2="556" y2="430" stroke="#2c3036" stroke-width="1"/>
<text x="92" y="435.0" font-size="14" fill="#a7adb5" text-anchor="end">1</text>
<line x1="100" y1="344" x2="556" y2="344" stroke="#2c3036" stroke-width="1"/>
<text x="92" y="349.2857142857143" font-size="14" fill="#a7adb5" text-anchor="end">1e2</text>
<line x1="100" y1="259" x2="556" y2="259" stroke="#2c3036" stroke-width="1"/>
<text x="92" y="263.57142857142856" font-size="14" fill="#a7adb5" text-anchor="end">1e4</text>
<line x1="100" y1="173" x2="556" y2="173" stroke="#2c3036" stroke-width="1"/>
<text x="92" y="177.85714285714283" font-size="14" fill="#a7adb5" text-anchor="end">1e6</text>
<text x="328.0" y="474" font-size="15" fill="#a7adb5" text-anchor="middle">n (parameters)</text>
<text x="48" y="120" font-size="15" fill="#a7adb5" text-anchor="start">cost / one forward pass</text>
<polyline points="100,404 108,402 115,399 123,397 130,394 138,391 146,387 153,384 161,380 168,376 176,372 184,369 191,365 199,360 206,356 214,352 222,348 229,344 237,340 244,335 252,331 260,327 267,323 275,318 282,314 290,310 298,306 305,301 313,297 320,293 328,289 336,284 343,280 351,276 358,271 366,267 374,263 381,259 389,254 396,250 404,246 412,241 419,237 427,233 434,229 442,224 450,220 457,216 465,211 472,207 480,203 488,199 495,194 503,190 510,186 518,181 526,177 533,173 541,169 548,164 556,160" fill="none" stroke="#e08db5" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<polyline points="100,404 108,402 115,399 123,397 130,394 138,391 146,387 153,384 161,380 168,376 176,372 184,369 191,365 199,360 206,356 214,352 222,348 229,344 237,340 244,335 252,331 260,327 267,323 275,318 282,314 290,310 298,306 305,301 313,297 320,293 328,289 336,284 343,280 351,276 358,271 366,267 374,263 381,259 389,254 396,250 404,246 412,241 419,237 427,233 434,229 442,224 450,220 457,216 465,211 472,207 480,203 488,199 495,194 503,190 510,186 518,181 526,177 533,173 541,169 548,164 556,160" fill="none" stroke="#86abe2" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="8 8"/>
<polyline points="100,405 556,404" fill="none" stroke="#6fc693" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<text x="288.26121535869436" y="340.8922323122447" font-size="15" fill="#e08db5" text-anchor="start">finite differences 2(n+1)</text>
<text x="288.26121535869436" y="362.8922323122447" font-size="15" fill="#86abe2" text-anchor="start">forward mode ≈ 2(n+1)</text>
<text x="360.8782796704626" y="392.19742894308735" font-size="15" fill="#6fc693" text-anchor="start">reverse mode ≈ 4</text>
<circle cx="328" cy="289" r="5" fill="#e08db5" stroke="#e08db5" stroke-width="1"/>
<circle cx="328" cy="289" r="3" fill="#86abe2" stroke="#86abe2" stroke-width="1"/>
<circle cx="328" cy="404" r="5" fill="#6fc693" stroke="#6fc693" stroke-width="1"/>
<text x="316.0" y="293.5086825795729" font-size="14" fill="#a7adb5" text-anchor="end">n = 1000</text>
<rect x="616" y="68" width="252" height="424" rx="8" fill="#22252a" stroke="#3d4148" stroke-width="1.5"/>
<text x="632" y="96" font-size="17" fill="#e9e7e3" text-anchor="start" font-weight="bold">Counted on the graph</text>
<text x="632" y="122" font-size="14" fill="#a7adb5" text-anchor="start">sigmoid neuron, n inputs</text>
<text x="632" y="152" font-size="15" fill="#e9e7e3" text-anchor="start" font-weight="600">n = 1000 parameters:</text>
<text x="632" y="180" font-size="15" fill="#e08db5" text-anchor="start">finite diff.   2002</text>
<text x="632" y="204" font-size="15" fill="#86abe2" text-anchor="start">forward mode  2001</text>
<text x="632" y="228" font-size="15" fill="#6fc693" text-anchor="start">reverse mode  4.0</text>
<text x="632" y="252" font-size="14" fill="#a7adb5" text-anchor="start">(units: one forward pass)</text>
<line x1="632" y1="276" x2="852" y2="276" stroke="#3d4148" stroke-width="1.5" stroke-linecap="round"/>
<text x="632" y="306" font-size="15" fill="#e9e7e3" text-anchor="start" font-weight="600">Opposite case:</text>
<text x="632" y="330" font-size="15" fill="#e9e7e3" text-anchor="start">1 input, m = 1000</text>
<text x="632" y="352" font-size="15" fill="#e9e7e3" text-anchor="start">outputs in a chain</text>
<text x="632" y="382" font-size="15" fill="#86abe2" text-anchor="start">forward mode  3 000</text>
<text x="632" y="406" font-size="15" fill="#6fc693" text-anchor="start">reverse mode  3 003 000</text>
<text x="632" y="430" font-size="14" fill="#a7adb5" text-anchor="start">flops: one sweep per</text>
<text x="632" y="450" font-size="14" fill="#a7adb5" text-anchor="start">output, the chain is</text>
<text x="632" y="470" font-size="14" fill="#a7adb5" text-anchor="start">walked m times</text>
</svg>
