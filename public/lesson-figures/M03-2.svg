<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="Inter, sans-serif">
<title>One product, several readings</title>
<desc>The product of A=[[1,2,3],[4,5,6]] and B=[[1,0],[0,1],[1,1]] is [[4,5],[10,11]], read by entry, by column and as the sum of three outer products.</desc>
<defs></defs>
<rect width="900" height="500" rx="14" fill="#17181b"/>
<text x="32" y="44" font-size="22" fill="#e9e7e3" text-anchor="start" font-weight="bold">One product, several readings</text>
<rect x="32" y="64" width="836" height="200" rx="8" fill="#22252a" stroke="#3d4148" stroke-width="1.5"/>
<rect x="32" y="288" width="836" height="196" rx="8" fill="#22252a" stroke="#3d4148" stroke-width="1.5"/>
<text x="48" y="92" font-size="17" fill="#e9e7e3" text-anchor="start" font-weight="bold">Shapes: (2×3)(3×2) = 2×2</text>
<text x="520" y="92" font-size="17" fill="#e9e7e3" text-anchor="start" font-weight="bold">Entry and column readings</text>
<rect x="57" y="129" width="42" height="34" rx="3" fill="#6cc6ba" fill-opacity="0.28"/>
<rect x="101" y="129" width="42" height="34" rx="3" fill="#ae9ce6" fill-opacity="0.28"/>
<rect x="145" y="129" width="42" height="34" rx="3" fill="#e08db5" fill-opacity="0.28"/>
<text y="151" font-size="15" fill="#e9e7e3" text-anchor="middle"><tspan x="78">1</tspan><tspan x="122">2</tspan><tspan x="166">3</tspan></text>
<rect x="57" y="165" width="42" height="34" rx="3" fill="#6cc6ba" fill-opacity="0.28"/>
<rect x="101" y="165" width="42" height="34" rx="3" fill="#ae9ce6" fill-opacity="0.28"/>
<rect x="145" y="165" width="42" height="34" rx="3" fill="#e08db5" fill-opacity="0.28"/>
<text y="187" font-size="15" fill="#e9e7e3" text-anchor="middle"><tspan x="78">4</tspan><tspan x="122">5</tspan><tspan x="166">6</tspan></text>
<line x1="53" y1="128" x2="53" y2="200" stroke="#a7adb5" stroke-width="2" stroke-linecap="round"/>
<line x1="191" y1="128" x2="191" y2="200" stroke="#a7adb5" stroke-width="2" stroke-linecap="round"/>
<text x="205" y="186" font-size="22" fill="#a7adb5" text-anchor="middle">×</text>
<rect x="241" y="129" width="42" height="34" rx="3" fill="#6cc6ba" fill-opacity="0.28"/>
<rect x="285" y="129" width="42" height="34" rx="3" fill="#6cc6ba" fill-opacity="0.28"/>
<text y="151" font-size="15" fill="#e9e7e3" text-anchor="middle"><tspan x="262">1</tspan><tspan x="306">0</tspan></text>
<rect x="241" y="165" width="42" height="34" rx="3" fill="#ae9ce6" fill-opacity="0.28"/>
<rect x="285" y="165" width="42" height="34" rx="3" fill="#ae9ce6" fill-opacity="0.28"/>
<text y="187" font-size="15" fill="#e9e7e3" text-anchor="middle"><tspan x="262">0</tspan><tspan x="306">1</tspan></text>
<rect x="241" y="201" width="42" height="34" rx="3" fill="#e08db5" fill-opacity="0.28"/>
<rect x="285" y="201" width="42" height="34" rx="3" fill="#e08db5" fill-opacity="0.28"/>
<text y="223" font-size="15" fill="#e9e7e3" text-anchor="middle"><tspan x="262">1</tspan><tspan x="306">1</tspan></text>
<line x1="237" y1="128" x2="237" y2="236" stroke="#a7adb5" stroke-width="2" stroke-linecap="round"/>
<line x1="331" y1="128" x2="331" y2="236" stroke="#a7adb5" stroke-width="2" stroke-linecap="round"/>
<text x="356" y="186" font-size="22" fill="#a7adb5" text-anchor="middle">=</text>
<rect x="391" y="147" width="42" height="34" rx="3" fill="#3d4148" fill-opacity="0.35"/>
<rect x="435" y="147" width="42" height="34" rx="3" fill="#e0904f" fill-opacity="0.28"/>
<text y="169" font-size="15" fill="#e9e7e3" text-anchor="middle"><tspan x="412">4</tspan><tspan x="456">5</tspan></text>
<rect x="391" y="183" width="42" height="34" rx="3" fill="#3d4148" fill-opacity="0.35"/>
<rect x="435" y="183" width="42" height="34" rx="3" fill="#3d4148" fill-opacity="0.35"/>
<text y="205" font-size="15" fill="#e9e7e3" text-anchor="middle"><tspan x="412">10</tspan><tspan x="456">11</tspan></text>
<line x1="387" y1="146" x2="387" y2="218" stroke="#a7adb5" stroke-width="2" stroke-linecap="round"/>
<line x1="481" y1="146" x2="481" y2="218" stroke="#a7adb5" stroke-width="2" stroke-linecap="round"/>
<text x="122" y="120" font-size="14" fill="#a7adb5" text-anchor="middle">A: 2×3</text>
<text x="284" y="120" font-size="14" fill="#a7adb5" text-anchor="middle">B: 3×2</text>
<text x="434" y="138" font-size="14" fill="#a7adb5" text-anchor="middle">C: 2×2</text>
<text x="48" y="256" font-size="15" fill="#e0904f" text-anchor="start" font-weight="600">inner sizes match: 3 = 3</text>
<text x="520" y="128" font-size="15" fill="#e9e7e3" text-anchor="start">Entry: C₁₂ = (row 1 of A) · (column 2 of B)</text>
<text x="520" y="152" font-size="15" fill="#e0904f" text-anchor="start" font-weight="600">= 1·0 + 2·1 + 3·1 = 5</text>
<text x="520" y="184" font-size="15" fill="#e9e7e3" text-anchor="start">Column: column 1 of C = A (1, 0, 1)</text>
<text x="520" y="208" font-size="15" fill="#e9e7e3" text-anchor="start" font-weight="600">= (1+3, 4+6) = (4, 10)</text>
<text x="48" y="316" font-size="17" fill="#e9e7e3" text-anchor="start" font-weight="bold">Outer-product reading: AB is a sum of p = 3 pieces</text>
<rect x="57" y="353" width="42" height="34" rx="3" fill="#6cc6ba" fill-opacity="0.28"/>
<rect x="101" y="353" width="42" height="34" rx="3" fill="#6cc6ba" fill-opacity="0.28"/>
