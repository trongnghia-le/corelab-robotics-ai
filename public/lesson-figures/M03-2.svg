<line x1="147" y1="352" x2="147" y2="424" stroke="#a7adb5" stroke-width="2" stroke-linecap="round"/>
<text x="100" y="452" font-size="14" fill="#a7adb5" text-anchor="middle">k = 1: (1, 4)ᵀ(1, 0)</text>
