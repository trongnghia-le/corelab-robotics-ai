<rect x="281" y="353" width="42" height="34" rx="3" fill="#ae9ce6" fill-opacity="0.28"/>
<text y="375" font-size="15" fill="#e9e7e3" text-anchor="middle"><tspan x="258">0</tspan><tspan x="302">2</tspan></text>
<rect x="237" y="389" width="42" height="34" rx="3" fill="#ae9ce6" fill-opacity="0.28"/>
<rect x="281" y="389" width="42" height="34" rx="3" fill="#ae9ce6" fill-opacity="0.28"/>
<text y="411" font-size="15" fill="#e9e7e3" text-anchor="middle"><tspan x="258">0</tspan><tspan x="302">5</tspan></text>
<line x1="233" y1="352" x2="233" y2="424" stroke="#a7adb5" stroke-width="2" stroke-linecap="round"/>
<line x1="327" y1="352" x2="327" y2="424" stroke="#a7adb5" stroke-width="2" stroke-linecap="round"/>
<text x="280" y="452" font-size="14" fill="#a7adb5" text-anchor="middle">k = 2: (2, 5)ᵀ(0, 1)</text>
<rect x="417" y="353" width="42" height="34" rx="3" fill="#e08db5" fill-opacity="0.28"/>
<rect x="461" y="353" width="42" height="34" rx="3" fill="#e08db5" fill-opacity="0.28"/>
<text y="375" font-size="15" fill="#e9e7e3" text-anchor="middle"><tspan x="438">3</tspan><tspan x="482">3</tspan></text>
<rect x="417" y="389" width="42" height="34" rx="3" fill="#e08db5" fill-opacity="0.28"/>
<rect x="461" y="389" width="42" height="34" rx="3" fill="#e08db5" fill-opacity="0.28"/>
<text y="411" font-size="15" fill="#e9e7e3" text-anchor="middle"><tspan x="438">6</tspan><tspan x="482">6</tspan></text>
<line x1="413" y1="352" x2="413" y2="424" stroke="#a7adb5" stroke-width="2" stroke-linecap="round"/>
