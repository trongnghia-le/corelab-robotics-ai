<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" font-family="Inter, Arial, sans-serif" font-size="14">
<defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e5e7eb"/></marker><marker id="ao" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#f97316"/></marker></defs>
<rect width="720" height="340" fill="#111827" rx="12"/>

<text x="360" y="28" fill="#e5e7eb" font-size="16" text-anchor="middle" font-weight="bold">The Jacobian columns: tip velocity from each joint</text>
<line x1="250" y1="300" x2="310" y2="203" stroke="#38bdf8" stroke-width="5"/>
<line x1="310" y1="203" x2="293" y2="105" stroke="#a3e635" stroke-width="5"/>
<circle cx="250" cy="300" r="7" fill="#111827" stroke="#e5e7eb" stroke-width="2"/>
<circle cx="310" cy="203" r="7" fill="#111827" stroke="#e5e7eb" stroke-width="2"/>
<circle cx="293" cy="105" r="7" fill="#111827" stroke="#e5e7eb" stroke-width="2"/>
<text x="262" y="306" fill="#e5e7eb" font-size="13" text-anchor="start">base (q1)</text>
<text x="322" y="207" fill="#e5e7eb" font-size="13" text-anchor="start">elbow (q2)</text>
<text x="303" y="97" fill="#e5e7eb" font-size="13" text-anchor="start">tip</text>
<line x1="293" y1="105" x2="215" y2="88" stroke="#38bdf8" stroke-width="3" marker-end="url(#a)"/>
<line x1="293" y1="105" x2="254" y2="112" stroke="#a3e635" stroke-width="3" marker-end="url(#a)"/>
<line x1="293" y1="105" x2="176" y2="95" stroke="#f97316" stroke-width="3" marker-end="url(#ao)"/>
<text x="290" y="62" fill="#38bdf8" font-size="13" text-anchor="end">J col 1 (per unit q1dot)</text>
<text x="285" y="142" fill="#a3e635" font-size="13" text-anchor="end">J col 2 (per unit q2dot)</text>
<text x="120" y="86" fill="#f97316" font-size="13" text-anchor="middle">v = J qdot</text>
<rect x="430" y="60" width="260" height="240" fill="#1f2937" stroke="#38bdf8" stroke-width="2" rx="6"/>
<text x="446" y="88" fill="#e5e7eb" font-size="13" text-anchor="start">Each column is perpendicular to</text>
<text x="446" y="108" fill="#e5e7eb" font-size="13" text-anchor="start">the line from its joint to the tip:</text>
<text x="446" y="132" fill="#a3e635" font-size="14" text-anchor="start">p-dot = J(q) q-dot</text>
<text x="446" y="160" fill="#e5e7eb" font-size="13" text-anchor="start">J = [ -l1 s1 - l2 s12</text>
<text x="612" y="160" fill="#e5e7eb" font-size="13" text-anchor="start">-l2 s12 ]</text>
<text x="446" y="180" fill="#e5e7eb" font-size="13" text-anchor="start">      l1 c1 + l2 c12</text>
<text x="612" y="180" fill="#e5e7eb" font-size="13" text-anchor="start">l2 c12 ]</text>
<text x="446" y="208" fill="#f97316" font-size="14" text-anchor="start">det J = l1 l2 sin(q2)</text>
<text x="446" y="236" fill="#e5e7eb" font-size="13" text-anchor="start">q2 = 0 or pi: columns parallel,</text>
<text x="446" y="256" fill="#e5e7eb" font-size="13" text-anchor="start">no velocity along the arm.</text>
<text x="446" y="282" fill="#e5e7eb" font-size="13" text-anchor="start">Statics: tau = J^T F</text>
</svg>
