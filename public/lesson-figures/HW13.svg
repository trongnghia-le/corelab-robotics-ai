<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" font-family="Inter, sans-serif">
<title>Which motor family fits which job</title>
<desc>Matrix of eight motor families (rows) against nine robot jobs (columns). A filled dot marks a common first choice, a ring marks a possible choice with conditions. Judgement summarised from the decision table of the lesson.</desc>
<defs></defs>
<rect width="900" height="540" rx="14" fill="#17181b"/>
<text x="32" y="44" font-size="22" fill="#e9e7e3" text-anchor="start" font-weight="bold">Which motor family fits which job</text>
<text x="312" y="100" font-size="15" fill="#e9e7e3" text-anchor="middle" font-weight="600">Wheel</text>
<text x="376" y="84" font-size="15" fill="#e9e7e3" text-anchor="middle" font-weight="600">Arm</text>
<text x="376" y="102" font-size="15" fill="#e9e7e3" text-anchor="middle" font-weight="600">joint</text>
<text x="440" y="100" font-size="15" fill="#e9e7e3" text-anchor="middle" font-weight="600">Gripper</text>
<text x="504" y="100" font-size="15" fill="#e9e7e3" text-anchor="middle" font-weight="600">Gimbal</text>
<text x="568" y="84" font-size="15" fill="#e9e7e3" text-anchor="middle" font-weight="600">3D/CNC</text>
<text x="568" y="102" font-size="15" fill="#e9e7e3" text-anchor="middle" font-weight="600">axis</text>
<text x="632" y="84" font-size="15" fill="#e9e7e3" text-anchor="middle" font-weight="600">Drone</text>
<text x="632" y="102" font-size="15" fill="#e9e7e3" text-anchor="middle" font-weight="600">prop</text>
<text x="696" y="100" font-size="15" fill="#e9e7e3" text-anchor="middle" font-weight="600">Pan-tilt</text>
<text x="760" y="100" font-size="15" fill="#e9e7e3" text-anchor="middle" font-weight="600">Lift</text>
<text x="824" y="100" font-size="15" fill="#e9e7e3" text-anchor="middle" font-weight="600">Leg</text>
<rect x="32" y="116" width="824" height="38" rx="6" fill="#22252a"/>
<text x="44" y="140" font-size="15" fill="#e9e7e3" text-anchor="start">Brushed DC gearmotor</text>
<circle cx="312" cy="135" r="9" fill="#e0904f"/>
<circle cx="440" cy="135" r="8" fill="none" stroke="#e0904f" stroke-width="2.5"/>
<circle cx="760" cy="135" r="8" fill="none" stroke="#e0904f" stroke-width="2.5"/>
<text x="44" y="178" font-size="15" fill="#e9e7e3" text-anchor="start">BLDC outrunner / inrunner</text>
<circle cx="312" cy="173" r="8" fill="none" stroke="#86abe2" stroke-width="2.5"/>
<circle cx="376" cy="173" r="8" fill="none" stroke="#86abe2" stroke-width="2.5"/>
<circle cx="632" cy="173" r="9" fill="#86abe2"/>
<circle cx="824" cy="173" r="9" fill="#86abe2"/>
<rect x="32" y="192" width="824" height="38" rx="6" fill="#22252a"/>
<text x="44" y="216" font-size="15" fill="#e9e7e3" text-anchor="start">Gimbal BLDC (high R)</text>
<circle cx="504" cy="211" r="9" fill="#6fc693"/>
<circle cx="696" cy="211" r="9" fill="#6fc693"/>
<text x="44" y="254" font-size="15" fill="#e9e7e3" text-anchor="start">Hybrid stepper</text>
<circle cx="568" cy="249" r="9" fill="#e0c169"/>
<circle cx="696" cy="249" r="8" fill="none" stroke="#e0c169" stroke-width="2.5"/>
<circle cx="760" cy="249" r="8" fill="none" stroke="#e0c169" stroke-width="2.5"/>
<rect x="32" y="268" width="824" height="38" rx="6" fill="#22252a"/>
<text x="44" y="292" font-size="15" fill="#e9e7e3" text-anchor="start">Hobby RC servo</text>
<circle cx="376" cy="287" r="8" fill="none" stroke="#e08db5" stroke-width="2.5"/>
<circle cx="440" cy="287" r="9" fill="#e08db5"/>
<circle cx="696" cy="287" r="9" fill="#e08db5"/>
<text x="44" y="330" font-size="15" fill="#e9e7e3" text-anchor="start">Smart serial servo</text>
<circle cx="376" cy="325" r="9" fill="#6cc6ba"/>
<circle cx="440" cy="325" r="8" fill="none" stroke="#6cc6ba" stroke-width="2.5"/>
<circle cx="696" cy="325" r="8" fill="none" stroke="#6cc6ba" stroke-width="2.5"/>
<rect x="32" y="344" width="824" height="38" rx="6" fill="#22252a"/>
<text x="44" y="368" font-size="15" fill="#e9e7e3" text-anchor="start">AC servo + drive</text>
<circle cx="376" cy="363" r="9" fill="#ae9ce6"/>
<circle cx="568" cy="363" r="9" fill="#ae9ce6"/>
<circle cx="760" cy="363" r="8" fill="none" stroke="#ae9ce6" stroke-width="2.5"/>
<circle cx="824" cy="363" r="8" fill="none" stroke="#ae9ce6" stroke-width="2.5"/>
<text x="44" y="406" font-size="15" fill="#e9e7e3" text-anchor="start">Lead / ball screw axis</text>
<circle cx="568" cy="401" r="8" fill="none" stroke="#e58a80" stroke-width="2.5"/>
<circle cx="760" cy="401" r="9" fill="#e58a80"/>
<circle cx="52" cy="449" r="8" fill="#a7adb5"/>
<text x="70" y="454" font-size="15" fill="#a7adb5" text-anchor="start">common first choice</text>
<circle cx="340" cy="449" r="7" fill="none" stroke="#a7adb5" stroke-width="2.5"/>
<text x="358" y="454" font-size="15" fill="#a7adb5" text-anchor="start">possible, with conditions</text>
<text x="32" y="488" font-size="14" fill="#a7adb5" text-anchor="start">Author&#x27;s judgement summarised from the decision table in the lesson; the transmission is chosen separately.</text>
</svg>
