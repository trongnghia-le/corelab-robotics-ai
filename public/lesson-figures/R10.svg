<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" font-family="Inter, Arial, sans-serif">
<rect width="720" height="400" fill="#111827" rx="12"/>
<text x="24" y="30" fill="#e5e7eb" font-size="16" font-weight="bold">End-loaded cantilever bracket</text>
<rect x="30" y="70" width="22" height="120" fill="#374151" stroke="#e5e7eb"/>
<text x="41" y="210" fill="#e5e7eb" font-size="13" text-anchor="middle">wall</text>
<rect x="52" y="115" width="300" height="30" fill="#1f2937" stroke="#38bdf8" stroke-width="2"/>
<line x1="352" y1="60" x2="352" y2="112" stroke="#f97316" stroke-width="3"/><polygon points="346,104 358,104 352,116" fill="#f97316"/>
<text x="362" y="80" fill="#f97316" font-size="13">F = m g (1 + a)</text>
<line x1="52" y1="168" x2="352" y2="168" stroke="#e5e7eb"/><text x="202" y="186" fill="#e5e7eb" font-size="13" text-anchor="middle">L</text>
<text x="60" y="104" fill="#a3e635" font-size="13">root: M = F L (max)</text>
<polygon points="52,260 52,330 352,330" fill="#a3e635" fill-opacity="0.25" stroke="#a3e635"/>
<line x1="52" y1="330" x2="352" y2="330" stroke="#e5e7eb"/>
<text x="24" y="250" fill="#e5e7eb" font-size="13">bending moment M(x)</text>
<text x="330" y="350" fill="#e5e7eb" font-size="13" text-anchor="end">0 at tip</text>
<rect x="400" y="62" width="4" height="116" fill="#e5e7eb"/>
<polygon points="404,120 404,66 464,66" fill="#f97316" fill-opacity="0.7" stroke="#f97316"/>
<polygon points="400,120 400,174 340,174" fill="#38bdf8" fill-opacity="0.6" stroke="#38bdf8"/>
<text x="470" y="82" fill="#f97316" font-size="13">tension</text>
<text x="330" y="192" fill="#38bdf8" font-size="13" text-anchor="end">compression</text>
<text x="410" y="205" fill="#e5e7eb" font-size="13">sigma = M y / I, max at y = h/2</text>
<g fill="none" stroke="#e5e7eb"><rect x="420" y="250" width="280" height="120"/><line x1="420" y1="280" x2="700" y2="280"/><line x1="520" y1="250" x2="520" y2="370"/><line x1="610" y1="250" x2="610" y2="370"/></g>
<g fill="#e5e7eb" font-size="13"><text x="430" y="271">case</text><text x="530" y="271">F (N)</text><text x="620" y="271">FoS</text>
<text x="430" y="301">A static 1 g</text><text x="530" y="301">29</text><text x="620" y="301" fill="#a3e635">11.3</text>
<text x="430" y="326">B accel 4 g</text><text x="530" y="326">118</text><text x="620" y="326" fill="#a3e635">2.8</text>
<text x="430" y="351">C impact 10 g</text><text x="530" y="351">294</text><text x="620" y="351" fill="#f97316">1.13 (fail)</text></g>
<text x="560" y="240" fill="#e5e7eb" font-size="13" text-anchor="middle">h = 6 mm, target FoS 1.5</text>
</svg>
