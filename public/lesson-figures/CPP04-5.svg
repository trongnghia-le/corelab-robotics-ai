<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="Inter, sans-serif">
<title>Worked case 2: layout of a PID object and what slicing drops</title>
<desc>Memory layout of PID p (32 bytes: vptr at 0, id at 8, padding, kp at 16, ki at 24), its vtable slots and the sliced copy Controller c of 16 bytes whose vptr points to the Controller vtable, so c.compute(2.0) is 0.0 instead of 7.0.</desc>
<defs><marker id="ahCPP045enae9ce6" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1 L9 5 L1 9 z" fill="#ae9ce6"/></marker></defs>
<rect width="900" height="500" rx="14" fill="#17181b"/>
<text x="32" y="44" font-size="22" fill="#e9e7e3" text-anchor="start" font-weight="bold">Worked case 2: layout of a PID object and what slicing drops</text>
<text x="32" y="86" font-size="17" fill="#e9e7e3" text-anchor="start" font-weight="bold">PID p  (32 B)</text>
<rect x="32" y="104" width="208" height="46" rx="4" fill="#22252a" stroke="#ae9ce6" stroke-width="2"/>
<text x="136.0" y="133" font-size="15" fill="#ae9ce6" text-anchor="middle" font-weight="600">vptr</text>
<rect x="240" y="104" width="104" height="46" rx="4" fill="#22252a" stroke="#86abe2" stroke-width="2"/>
<text x="292.0" y="133" font-size="15" fill="#86abe2" text-anchor="middle" font-weight="600">id = 7</text>
<rect x="344" y="104" width="104" height="46" rx="4" fill="none" stroke="#a7adb5" stroke-width="2" stroke-dasharray="5 4"/>
<text x="396.0" y="133" font-size="15" fill="#a7adb5" text-anchor="middle" font-weight="600">pad</text>
<rect x="448" y="104" width="208" height="46" rx="4" fill="#22252a" stroke="#e0904f" stroke-width="2"/>
<text x="552.0" y="133" font-size="15" fill="#e0904f" text-anchor="middle" font-weight="600">kp = 3.0</text>
<rect x="656" y="104" width="208" height="46" rx="4" fill="#22252a" stroke="#e0904f" stroke-width="2"/>
<text x="760.0" y="133" font-size="15" fill="#e0904f" text-anchor="middle" font-weight="600">ki = 0.5</text>
<text x="32" y="172" font-size="14" fill="#a7adb5" text-anchor="middle">0</text>
<text x="240" y="172" font-size="14" fill="#a7adb5" text-anchor="middle">8</text>
<text x="448" y="172" font-size="14" fill="#a7adb5" text-anchor="middle">16</text>
<text x="656" y="172" font-size="14" fill="#a7adb5" text-anchor="middle">24</text>
<text x="864" y="172" font-size="14" fill="#a7adb5" text-anchor="middle">32</text>
<text x="32" y="194" font-size="14" fill="#a7adb5" text-anchor="start">byte offset</text>
<line x1="32" y1="208" x2="448" y2="208" stroke="#86abe2" stroke-width="2" stroke-linecap="round"/>
<text x="240" y="230" font-size="15" fill="#86abe2" text-anchor="middle" font-weight="600">Controller part: 16 B</text>
<line x1="448" y1="208" x2="864" y2="208" stroke="#e0904f" stroke-width="2" stroke-linecap="round"/>
<text x="656" y="230" font-size="15" fill="#e0904f" text-anchor="middle" font-weight="600">added by PID: 16 B</text>
<text x="32" y="282" font-size="17" fill="#e9e7e3" text-anchor="start" font-weight="bold">vtable of PID (slots)</text>
<rect x="32" y="298" width="250" height="28" rx="4" fill="#22252a" stroke="#a7adb5" stroke-width="1.5"/>
<text x="44" y="317" font-size="14" fill="#a7adb5" text-anchor="start">-1</text>
<text x="80" y="317" font-size="15" fill="#e9e7e3" text-anchor="start">typeinfo PID</text>
<rect x="32" y="332" width="250" height="28" rx="4" fill="#22252a" stroke="#a7adb5" stroke-width="1.5"/>
<text x="44" y="351" font-size="14" fill="#a7adb5" text-anchor="start">0</text>
<text x="80" y="351" font-size="15" fill="#e9e7e3" text-anchor="start">~PID (complete)</text>
<rect x="32" y="366" width="250" height="28" rx="4" fill="#22252a" stroke="#a7adb5" stroke-width="1.5"/>
<text x="44" y="385" font-size="14" fill="#a7adb5" text-anchor="start">1</text>
<text x="80" y="385" font-size="15" fill="#e9e7e3" text-anchor="start">~PID (deleting)</text>
<rect x="32" y="400" width="250" height="28" rx="4" fill="#22252a" stroke="#6fc693" stroke-width="1.5"/>
<text x="44" y="419" font-size="14" fill="#a7adb5" text-anchor="start">2</text>
<text x="80" y="419" font-size="15" fill="#6fc693" text-anchor="start" font-weight="600">PID::compute</text>
<path d="M136,150 V256 H300 V312" fill="none" stroke="#ae9ce6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M300,312 H284" fill="none" stroke="#ae9ce6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ahCPP045enae9ce6)"/>
<text x="316" y="270" font-size="14" fill="#ae9ce6" text-anchor="start">vptr</text>
<text x="520" y="282" font-size="17" fill="#e9e7e3" text-anchor="start" font-weight="bold">Controller c = p  (16 B)</text>
<rect x="520" y="298" width="112" height="46" rx="4" fill="#22252a" stroke="#ae9ce6" stroke-width="2"/>
<text x="576.0" y="327" font-size="15" fill="#ae9ce6" text-anchor="middle" font-weight="600">vptr</text>
<rect x="632" y="298" width="56" height="46" rx="4" fill="#22252a" stroke="#86abe2" stroke-width="2"/>
<text x="660.0" y="327" font-size="14" fill="#86abe2" text-anchor="middle" font-weight="600">id = 7</text>
<rect x="688" y="298" width="56" height="46" rx="4" fill="none" stroke="#a7adb5" stroke-width="2" stroke-dasharray="5 4"/>
<text x="716.0" y="327" font-size="14" fill="#a7adb5" text-anchor="middle" font-weight="600">pad</text>
<rect x="756" y="298" width="112" height="46" rx="4" fill="none" stroke="#e58a80" stroke-width="2" stroke-dasharray="5 4"/>
<text x="812" y="327" font-size="15" fill="#e58a80" text-anchor="middle" font-weight="600">kp, ki lost</text>
<text x="520" y="376" font-size="14" fill="#ae9ce6" text-anchor="start">vptr -&gt; Controller vtable</text>
<text x="520" y="396" font-size="15" fill="#e58a80" text-anchor="start" font-weight="600" font-family="ui-monospace, Menlo, Consolas, monospace">c.compute(2.0) = 0.0</text>
<text x="520" y="420" font-size="15" fill="#6fc693" text-anchor="start" font-weight="600" font-family="ui-monospace, Menlo, Consolas, monospace">r.compute(2.0) = 7.0</text>
<text x="520" y="442" font-size="14" fill="#a7adb5" text-anchor="start">r is a Controller&amp; bound to p</text>
<text x="32" y="470" font-size="14" fill="#a7adb5" text-anchor="start">3.0 * 2.0 + 0.5 * 2.0 = 7.0 through the PID vtable; the sliced copy runs Controller::compute.</text>
</svg>
