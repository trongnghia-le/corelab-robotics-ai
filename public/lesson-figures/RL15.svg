<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" font-family="Inter, Arial, sans-serif" font-size="14">
<rect width="760" height="440" fill="#191b1f" rx="12"/>
<text x="380" y="30" fill="#e5e7eb" font-size="16" text-anchor="middle">Why start near the goal: sparse reward on a 20-cell corridor</text>
<text x="190" y="62" fill="#e5e7eb" text-anchor="middle">P(random walk reaches goal in 60 steps)</text>
<line x1="60" y1="300" x2="330" y2="300" stroke="#e5e7eb"/><line x1="60" y1="80" x2="60" y2="300" stroke="#e5e7eb"/>
<g fill="#53b2dd">
<rect x="80" y="296" width="40" height="4"/>
<rect x="140" y="288" width="40" height="12"/>
<rect x="200" y="256" width="40" height="44"/>
<rect x="260" y="186" width="40" height="114"/>
</g>
<g fill="#e5e7eb" text-anchor="middle">
<text x="100" y="288">0.016</text><text x="160" y="280">0.053</text><text x="220" y="248">0.200</text><text x="280" y="178">0.519</text>
<text x="100" y="320">0</text><text x="160" y="320">5</text><text x="220" y="320">10</text><text x="280" y="320">15</text>
<text x="190" y="345">start cell</text>
</g>
<text x="560" y="62" fill="#e5e7eb" text-anchor="middle">Reverse curriculum, 2000-step budget</text>
<g stroke="#e5e7eb" stroke-width="2" fill="none">
<rect x="380" y="90" width="85" height="60"/><rect x="465" y="90" width="85" height="60"/><rect x="550" y="90" width="85" height="60"/><rect x="635" y="90" width="85" height="60"/>
</g>
<g fill="#d97936" text-anchor="middle">
<text x="422" y="116">stage 1</text><text x="507" y="116">stage 2</text><text x="592" y="116">stage 3</text><text x="677" y="116">stage 4</text>
</g>
<g fill="#e5e7eb" text-anchor="middle">
<text x="422" y="138">start 15</text><text x="507" y="138">start 10</text><text x="592" y="138">start 5</text><text x="677" y="138">start 0</text>
<text x="550" y="175">500 steps per stage, same total budget</text>
</g>
<text x="380" y="225" fill="#e5e7eb">Greedy success from cell 0 after 2000 steps (30 seeds):</text>
<g>
<text x="380" y="262" fill="#e5e7eb">fixed start 0</text><rect x="560" y="246" width="2" height="22" fill="#9ccd4e"/><text x="575" y="262" fill="#e5e7eb">0 / 30</text>
<text x="380" y="298" fill="#e5e7eb">mixed starts</text><rect x="560" y="282" width="6" height="22" fill="#9ccd4e"/><text x="575" y="298" fill="#e5e7eb">1 / 30</text>
<text x="380" y="334" fill="#e5e7eb">reverse curriculum</text><rect x="560" y="318" width="140" height="22" fill="#9ccd4e"/><text x="580" y="334" fill="#191b1f" font-weight="bold">29 / 30</text>
<text x="380" y="370" fill="#e5e7eb">curriculum never at 0</text><rect x="560" y="354" width="2" height="22" fill="#9ccd4e"/><text x="575" y="370" fill="#e5e7eb">0 / 30</text>
</g>
<text x="380" y="415" fill="#d97936" text-anchor="middle">The curriculum must end on the distribution you will be tested on</text>
</svg>
