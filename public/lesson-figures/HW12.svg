<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" font-family="Inter, Arial, sans-serif" role="img">
<title>Bring-up flowchart with the classic faults</title>
<desc>A vertical flow from power to reset and clock to comms to sensors to actuators at low power to the closed loop. Each stage names its check and a side branch lists the classic fault found there: brownout, floating input, missing common ground, wrong baud or level, blocking code, and I2C address conflict.</desc>
<rect width="760" height="480" fill="#191b1f" rx="12"/>
<text x="380" y="28" font-size="17" fill="#e5e7eb" text-anchor="middle" font-weight="bold">Bring-up: one stage at a time, power first, motors last</text>
<rect x="40" y="46" width="300" height="52" rx="8" fill="#272a2f" stroke="#d97936" stroke-width="2"/>
<text x="190.0" y="68.5" font-size="13" fill="#e5e7eb" text-anchor="middle" font-weight="bold">1 Power</text>
<text x="190.0" y="84.5" font-size="13" fill="#e5e7eb" text-anchor="middle">DMM: rails, no short, current limit</text>
<line x1="190" y1="98" x2="190" y2="116" stroke="#e5e7eb" stroke-width="2"/>
<polygon points="190,116 186.5,107.0 193.5,107.0" fill="#e5e7eb"/>
<rect x="40" y="116" width="300" height="52" rx="8" fill="#272a2f" stroke="#d97936" stroke-width="2"/>
<text x="190.0" y="138.6" font-size="13" fill="#e5e7eb" text-anchor="middle" font-weight="bold">2 Reset and clock</text>
<text x="190.0" y="154.6" font-size="13" fill="#e5e7eb" text-anchor="middle">boot banner, reset reason, LED rate</text>
<line x1="190" y1="168" x2="190" y2="186" stroke="#e5e7eb" stroke-width="2"/>
<polygon points="190,186 186.5,177.0 193.5,177.0" fill="#e5e7eb"/>
<rect x="40" y="186" width="300" height="52" rx="8" fill="#272a2f" stroke="#53b2dd" stroke-width="2"/>
<text x="190.0" y="208.6" font-size="13" fill="#e5e7eb" text-anchor="middle" font-weight="bold">3 Comms</text>
<text x="190.0" y="224.6" font-size="13" fill="#e5e7eb" text-anchor="middle">serial echo, baud, I2C scan</text>
<line x1="190" y1="238" x2="190" y2="256" stroke="#e5e7eb" stroke-width="2"/>
<polygon points="190,256 186.5,247.0 193.5,247.0" fill="#e5e7eb"/>
<rect x="40" y="256" width="300" height="52" rx="8" fill="#272a2f" stroke="#53b2dd" stroke-width="2"/>
<text x="190.0" y="278.6" font-size="13" fill="#e5e7eb" text-anchor="middle" font-weight="bold">4 Sensors</text>
<text x="190.0" y="294.6" font-size="13" fill="#e5e7eb" text-anchor="middle">WHO_AM_I, encoder by hand</text>
<line x1="190" y1="308" x2="190" y2="326" stroke="#e5e7eb" stroke-width="2"/>
<polygon points="190,326 186.5,317.0 193.5,317.0" fill="#e5e7eb"/>
<rect x="40" y="326" width="300" height="52" rx="8" fill="#272a2f" stroke="#9ccd4e" stroke-width="2"/>
<text x="190.0" y="348.6" font-size="13" fill="#e5e7eb" text-anchor="middle" font-weight="bold">5 Actuators</text>
<text x="190.0" y="364.6" font-size="13" fill="#e5e7eb" text-anchor="middle">wheel off the ground, 10 % duty</text>
<line x1="190" y1="378" x2="190" y2="396" stroke="#e5e7eb" stroke-width="2"/>
<polygon points="190,396 186.5,387.0 193.5,387.0" fill="#e5e7eb"/>
<rect x="40" y="396" width="300" height="52" rx="8" fill="#272a2f" stroke="#9ccd4e" stroke-width="2"/>
<text x="190.0" y="418.6" font-size="13" fill="#e5e7eb" text-anchor="middle" font-weight="bold">6 Loop and safety</text>
<text x="190.0" y="434.6" font-size="13" fill="#e5e7eb" text-anchor="middle">PI step, watchdog, E-stop</text>
<line x1="340" y1="72.0" x2="400" y2="72.0" stroke="#e5e7eb" stroke-width="2" stroke-dasharray="5 4"/>
<polygon points="400,72.0 391.0,75.5 391.0,68.5" fill="#e5e7eb"/>
<rect x="400" y="46" width="320" height="52" rx="8" fill="#272a2f" stroke="#e5e7eb" stroke-width="2" stroke-dasharray="5 4"/>
<text x="560.0" y="61.2" font-size="12" fill="#e5e7eb" text-anchor="middle" font-weight="bold">Brownout</text>
<text x="560.0" y="76.2" font-size="12" fill="#e5e7eb" text-anchor="middle">rail sags when the motor starts</text>
<text x="560.0" y="91.2" font-size="12" fill="#e5e7eb" text-anchor="middle">separate supply, bulk cap</text>
<line x1="340" y1="142.0" x2="400" y2="142.0" stroke="#e5e7eb" stroke-width="2" stroke-dasharray="5 4"/>
<polygon points="400,142.0 391.0,145.5 391.0,138.5" fill="#e5e7eb"/>
<rect x="400" y="116" width="320" height="52" rx="8" fill="#272a2f" stroke="#e5e7eb" stroke-width="2" stroke-dasharray="5 4"/>
<text x="560.0" y="131.2" font-size="12" fill="#e5e7eb" text-anchor="middle" font-weight="bold">Blocking code</text>
<text x="560.0" y="146.2" font-size="12" fill="#e5e7eb" text-anchor="middle">watchdog reset, loop too slow</text>
<text x="560.0" y="161.2" font-size="12" fill="#e5e7eb" text-anchor="middle">no delay(), measure loop time</text>
<line x1="340" y1="212.0" x2="400" y2="212.0" stroke="#e5e7eb" stroke-width="2" stroke-dasharray="5 4"/>
<polygon points="400,212.0 391.0,215.5 391.0,208.5" fill="#e5e7eb"/>
<rect x="400" y="186" width="320" height="52" rx="8" fill="#272a2f" stroke="#e5e7eb" stroke-width="2" stroke-dasharray="5 4"/>
<text x="560.0" y="201.2" font-size="12" fill="#e5e7eb" text-anchor="middle" font-weight="bold">Wrong baud or level</text>
<text x="560.0" y="216.2" font-size="12" fill="#e5e7eb" text-anchor="middle">garbage, 5 V into 3.3 V</text>
<text x="560.0" y="231.2" font-size="12" fill="#e5e7eb" text-anchor="middle">check divisor, shift levels</text>
<line x1="340" y1="282.0" x2="400" y2="282.0" stroke="#e5e7eb" stroke-width="2" stroke-dasharray="5 4"/>
<polygon points="400,282.0 391.0,285.5 391.0,278.5" fill="#e5e7eb"/>
<rect x="400" y="256" width="320" height="52" rx="8" fill="#272a2f" stroke="#e5e7eb" stroke-width="2" stroke-dasharray="5 4"/>
<text x="560.0" y="271.2" font-size="12" fill="#e5e7eb" text-anchor="middle" font-weight="bold">I2C address conflict</text>
<text x="560.0" y="286.2" font-size="12" fill="#e5e7eb" text-anchor="middle">two devices at 0x68</text>
<text x="560.0" y="301.2" font-size="12" fill="#e5e7eb" text-anchor="middle">AD0 pin, mux, second bus</text>
<line x1="340" y1="352.0" x2="400" y2="352.0" stroke="#e5e7eb" stroke-width="2" stroke-dasharray="5 4"/>
<polygon points="400,352.0 391.0,355.5 391.0,348.5" fill="#e5e7eb"/>
<rect x="400" y="326" width="320" height="52" rx="8" fill="#272a2f" stroke="#e5e7eb" stroke-width="2" stroke-dasharray="5 4"/>
<text x="560.0" y="341.2" font-size="12" fill="#e5e7eb" text-anchor="middle" font-weight="bold">No common ground</text>
<text x="560.0" y="356.2" font-size="12" fill="#e5e7eb" text-anchor="middle">floating input, ground bounce</text>
<text x="560.0" y="371.2" font-size="12" fill="#e5e7eb" text-anchor="middle">one star point, pull-up</text>
<line x1="340" y1="422.0" x2="400" y2="422.0" stroke="#e5e7eb" stroke-width="2" stroke-dasharray="5 4"/>
<polygon points="400,422.0 391.0,425.5 391.0,418.5" fill="#e5e7eb"/>
<rect x="400" y="396" width="320" height="52" rx="8" fill="#272a2f" stroke="#e5e7eb" stroke-width="2" stroke-dasharray="5 4"/>
<text x="560.0" y="411.2" font-size="12" fill="#e5e7eb" text-anchor="middle" font-weight="bold">Dead-man's switch</text>
<text x="560.0" y="426.2" font-size="12" fill="#e5e7eb" text-anchor="middle">link lost, motor keeps going</text>
<text x="560.0" y="441.2" font-size="12" fill="#e5e7eb" text-anchor="middle">timeout stops outputs</text>
<text x="380" y="466" font-size="12.5" fill="#e5e7eb" text-anchor="middle">A stage fails: stop, write down the evidence, change one thing, then re-run the checklist from that stage.</text>
</svg>
