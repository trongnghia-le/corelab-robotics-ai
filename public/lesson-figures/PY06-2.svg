<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="Inter, sans-serif">
<title>Forward mode fills columns, reverse mode fills rows</title>
<desc>The 2 by 2 Jacobian of the example with one forward pass giving a column and one reverse pass giving a row, and bars comparing the passes needed in two settings.</desc>
<defs></defs>
<rect width="900" height="500" rx="14" fill="#17181b"/>
<text x="32" y="44" font-size="22" fill="#e9e7e3" text-anchor="start" font-weight="bold">Forward mode fills columns, reverse mode fills rows</text>
<text x="32" y="92" font-size="17" fill="#e9e7e3" text-anchor="start" font-weight="bold">Jacobian of f(x) = (x₀x₁, sin x₀)</text>
<text x="32" y="114" font-size="14" fill="#a7adb5" text-anchor="start">at x = (1.2, 0.5)</text>
<rect x="150" y="170" width="120" height="180" rx="6" fill="#86abe2" fill-opacity="0.22"/>
<rect x="150" y="170" width="120" height="90" rx="0" fill="none" stroke="#3d4148" stroke-width="1.5"/>
<text x="210" y="221" font-size="17" fill="#e9e7e3" text-anchor="middle" font-weight="bold">0.5</text>
<rect x="270" y="170" width="120" height="90" rx="0" fill="none" stroke="#3d4148" stroke-width="1.5"/>
<text x="330" y="221" font-size="17" fill="#e9e7e3" text-anchor="middle" font-weight="bold">1.2</text>
<rect x="150" y="260" width="120" height="90" rx="0" fill="none" stroke="#3d4148" stroke-width="1.5"/>
<text x="210" y="311" font-size="17" fill="#e9e7e3" text-anchor="middle" font-weight="bold">0.3624</text>
<rect x="270" y="260" width="120" height="90" rx="0" fill="none" stroke="#3d4148" stroke-width="1.5"/>
<text x="330" y="311" font-size="17" fill="#e9e7e3" text-anchor="middle" font-weight="bold">0</text>
<rect x="151" y="261" width="238" height="88" rx="6" fill="none" stroke="#e0904f" stroke-width="3"/>
<text x="210" y="158" font-size="14" fill="#a7adb5" text-anchor="middle">∂/∂x₀</text>
<text x="330" y="158" font-size="14" fill="#a7adb5" text-anchor="middle">∂/∂x₁</text>
<text x="140" y="220" font-size="14" fill="#a7adb5" text-anchor="end">x₀x₁</text>
<text x="140" y="310" font-size="14" fill="#a7adb5" text-anchor="end">sin x₀</text>
<line x1="158.0" y1="380.0" x2="184.0" y2="380.0" stroke="#86abe2" stroke-width="4" stroke-linecap="round"/>
<text x="194" y="385" font-size="15" fill="#e9e7e3" text-anchor="start">forward pass, seed e₁ → column (0.5, 0.3624)</text>
<line x1="158.0" y1="408.0" x2="184.0" y2="408.0" stroke="#e0904f" stroke-width="4" stroke-linecap="round"/>
<text x="194" y="413" font-size="15" fill="#e9e7e3" text-anchor="start">reverse pass, seed e₂ → row (0.3624, 0)</text>
<text x="590" y="92" font-size="17" fill="#e9e7e3" text-anchor="start" font-weight="bold">Passes for a full Jacobian</text>
<line x1="650.0" y1="160.0" x2="650.0" y2="420.0" stroke="#a7adb5" stroke-width="1.5" stroke-linecap="round"/>
<line x1="650.0" y1="160.0" x2="650.0" y2="420.0" stroke="#2c3036" stroke-width="1" stroke-linecap="round"/>
<text x="650" y="438" font-size="14" fill="#a7adb5" text-anchor="middle">1</text>
<line x1="711.2" y1="160.0" x2="711.2" y2="420.0" stroke="#2c3036" stroke-width="1" stroke-linecap="round"/>
<text x="711" y="438" font-size="14" fill="#a7adb5" text-anchor="middle">10</text>
<line x1="772.4" y1="160.0" x2="772.4" y2="420.0" stroke="#2c3036" stroke-width="1" stroke-linecap="round"/>
<text x="772" y="438" font-size="14" fill="#a7adb5" text-anchor="middle">100</text>
<line x1="833.5" y1="160.0" x2="833.5" y2="420.0" stroke="#2c3036" stroke-width="1" stroke-linecap="round"/>
<text x="834" y="438" font-size="14" fill="#a7adb5" text-anchor="middle">1,000</text>
<text x="868" y="462" font-size="14" fill="#a7adb5" text-anchor="end">passes (log scale)</text>
<text x="658" y="172" font-size="15" fill="#e9e7e3" text-anchor="start" font-weight="600">Loss: n = 1,000, m = 1</text>
<rect x="650" y="184" width="183.529" height="26" rx="3" fill="#86abe2" fill-opacity="0.9"/>
<text x="826" y="203" font-size="15" fill="#17181b" text-anchor="end" font-weight="600">1,000</text>
<text x="642" y="203" font-size="14" fill="#a7adb5" text-anchor="end">forward</text>
<rect x="650" y="224" width="3" height="26" rx="3" fill="#e0904f" fill-opacity="0.9"/>
<text x="661" y="243" font-size="15" fill="#e9e7e3" text-anchor="start" font-weight="600">1</text>
<text x="642" y="243" font-size="14" fill="#a7adb5" text-anchor="end">reverse</text>
<text x="658" y="302" font-size="15" fill="#e9e7e3" text-anchor="start" font-weight="600">Simulator: n = 3, m = 500</text>
<rect x="650" y="314" width="29.1886" height="26" rx="3" fill="#86abe2" fill-opacity="0.9"/>
<text x="687" y="333" font-size="15" fill="#e9e7e3" text-anchor="start" font-weight="600">3</text>
<text x="642" y="333" font-size="14" fill="#a7adb5" text-anchor="end">forward</text>
<rect x="650" y="354" width="165.113" height="26" rx="3" fill="#e0904f" fill-opacity="0.9"/>
<text x="807" y="373" font-size="15" fill="#17181b" text-anchor="end" font-weight="600">500</text>
<text x="642" y="373" font-size="14" fill="#a7adb5" text-anchor="end">reverse</text>
</svg>
