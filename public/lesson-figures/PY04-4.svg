<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" font-family="Inter, sans-serif">
<title>Worked case: centering X = [[1, 2, 3], [4, 5, 6]]</title>
<desc>Top: feature means [2.5, 3.5, 4.5] (shape (3,)) subtract from each row. Bottom: row means [2, 5] need shape (2,1) so that each row loses its own mean.</desc>
