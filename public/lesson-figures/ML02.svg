<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" font-family="Inter, Arial, sans-serif" font-size="14">
<rect width="720" height="340" fill="#111827" rx="12"/>
<g fill="#e5e7eb">
<text x="24" y="30" font-size="15" font-weight="bold">Fit y = w x + b: minimise squared residuals</text>
<text x="384" y="30" font-size="15" font-weight="bold">Residual plot reveals a missing feature</text>
<text x="250" y="292" font-size="13">x</text><text x="30" y="70" font-size="13">y</text>
<text x="150" y="205" fill="#38bdf8" font-size="13">fitted line, w = 2, b = 1</text>
<text x="150" y="225" fill="#f97316" font-size="13">orange bars: residuals e_i</text>
<text x="150" y="245" fill="#a3e635" font-size="13">green: data</text>
<text x="40" y="318" font-size="13">gradient: dJ/dw = X^T e / N,  dJ/db = mean(e)</text>
<text x="660" y="190" font-size="13">x</text><text x="394" y="64" font-size="13">e</text>
<text x="440" y="82" fill="#f97316" font-size="13">U shape: the line misses curvature</text>
<text x="400" y="296" font-size="13" fill="#a3e635">data y = x^2 fitted with a line: add the x^2 feature</text>
<text x="404" y="318" font-size="13">a good fit has residuals with no pattern</text>
</g>
<g stroke="#e5e7eb" stroke-width="1.5"><line x1="50" y1="270" x2="260" y2="270"/><line x1="50" y1="270" x2="50" y2="70"/><line x1="420" y1="170" x2="680" y2="170"/><line x1="420" y1="250" x2="420" y2="90"/></g>
<line x1="40.0" y1="258.0" x2="260.0" y2="82.0" stroke="#38bdf8" stroke-width="3"/>
<line x1="50" y1="228" x2="50" y2="250" stroke="#f97316" stroke-width="2"/><circle cx="50" cy="228" r="5" fill="#a3e635"/><line x1="100" y1="226" x2="100" y2="210" stroke="#f97316" stroke-width="2"/><circle cx="100" cy="226" r="5" fill="#a3e635"/><line x1="150" y1="150" x2="150" y2="170" stroke="#f97316" stroke-width="2"/><circle cx="150" cy="150" r="5" fill="#a3e635"/><line x1="200" y1="148" x2="200" y2="130" stroke="#f97316" stroke-width="2"/><circle cx="200" cy="148" r="5" fill="#a3e635"/><line x1="250" y1="98" x2="250" y2="90" stroke="#f97316" stroke-width="2"/><circle cx="250" cy="98" r="5" fill="#a3e635"/>
<polyline points="420,120 475,195 530,220 585,195 640,120" fill="none" stroke="#f97316" stroke-width="2" stroke-dasharray="4 3"/><circle cx="420" cy="120" r="5" fill="#f97316"/><circle cx="475" cy="195" r="5" fill="#f97316"/><circle cx="530" cy="220" r="5" fill="#f97316"/><circle cx="585" cy="195" r="5" fill="#f97316"/><circle cx="640" cy="120" r="5" fill="#f97316"/>
</svg>