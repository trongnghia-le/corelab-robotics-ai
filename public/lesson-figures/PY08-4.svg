<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" font-family="Inter, sans-serif">
<title>Same seed, same stream, different offsets</title>
<desc>The generator with seed 7 produces the draws g1 = -0.058178, g2 = 0.080740, g3 = -0.010933 for three sensors. Iterating a set gives the order imu, gps, lidar under PYTHONHASHSEED=1 and imu, lidar, gps under PYTHONHASHSEED=3, so draws are assigned to different sensors and the result hashes differ; sorted order gives one result for every hash seed.</desc>
<defs></defs>
<rect width="900" height="450" rx="14" fill="#17181b"/>
<text x="32" y="44" font-size="22" fill="#e9e7e3" text-anchor="start" font-weight="bold">Same seed, same stream, different offsets</text>
<text x="32" y="84" font-size="15" fill="#a7adb5" text-anchor="start">stream of random.Random(7), same in all three runs: g1 = -0.058178, g2 = 0.080740, g3 = -0.010933</text>
<text x="32" y="184" font-size="15" fill="#e9e7e3" text-anchor="start" font-weight="600">loop order</text>
<text x="32" y="240" font-size="15" fill="#e9e7e3" text-anchor="start" font-weight="600">gets g1</text>
<text x="32" y="288" font-size="15" fill="#e9e7e3" text-anchor="start" font-weight="600">gets g2</text>
<text x="32" y="336" font-size="15" fill="#e9e7e3" text-anchor="start" font-weight="600">gets g3</text>
<text x="32" y="384" font-size="15" fill="#e9e7e3" text-anchor="start" font-weight="600">sha256 of result</text>
<rect x="214" y="110" width="210" height="22" rx="6" fill="none" stroke="none" stroke-width="0"/>
<rect x="432" y="110" width="210" height="22" rx="6" fill="none" stroke="none" stroke-width="0"/>
<rect x="650" y="110" width="210" height="22" rx="6" fill="none" stroke="none" stroke-width="0"/>
<rect x="214" y="100" width="210" height="46" rx="6" fill="#2b2f35" stroke="#3d4148" stroke-width="1.5"/>
<text x="319" y="122" font-size="15" fill="#e9e7e3" text-anchor="middle" font-weight="600">set(...)</text>
<text x="319" y="140" font-size="14" fill="#a7adb5" text-anchor="middle">PYTHONHASHSEED=1</text>
<text x="226" y="184" font-size="15" fill="#e9e7e3" text-anchor="start">imu, gps, lidar</text>
<rect x="214" y="214" width="210" height="40" rx="6" fill="#22252a" stroke="#86abe2" stroke-width="2"/>
<text x="226" y="240" font-size="15" fill="#86abe2" text-anchor="start" font-weight="600">imu</text>
<rect x="214" y="262" width="210" height="40" rx="6" fill="#22252a" stroke="#e0c169" stroke-width="2"/>
<text x="226" y="288" font-size="15" fill="#e0c169" text-anchor="start" font-weight="600">gps</text>
<rect x="214" y="310" width="210" height="40" rx="6" fill="#22252a" stroke="#6cc6ba" stroke-width="2"/>
<text x="226" y="336" font-size="15" fill="#6cc6ba" text-anchor="start" font-weight="600">lidar</text>
<text x="226" y="384" font-size="15" fill="#e9e7e3" text-anchor="start">0ed87f825838</text>
<rect x="434" y="100" width="210" height="46" rx="6" fill="#2b2f35" stroke="#3d4148" stroke-width="1.5"/>
<text x="539" y="122" font-size="15" fill="#e9e7e3" text-anchor="middle" font-weight="600">set(...)</text>
<text x="539" y="140" font-size="14" fill="#a7adb5" text-anchor="middle">PYTHONHASHSEED=3</text>
<text x="446" y="184" font-size="15" fill="#e9e7e3" text-anchor="start">imu, lidar, gps</text>
<rect x="434" y="214" width="210" height="40" rx="6" fill="#22252a" stroke="#86abe2" stroke-width="2"/>
<text x="446" y="240" font-size="15" fill="#86abe2" text-anchor="start" font-weight="600">imu</text>
<rect x="434" y="262" width="210" height="40" rx="6" fill="#22252a" stroke="#6cc6ba" stroke-width="2"/>
<text x="446" y="288" font-size="15" fill="#6cc6ba" text-anchor="start" font-weight="600">lidar</text>
<rect x="434" y="310" width="210" height="40" rx="6" fill="#22252a" stroke="#e0c169" stroke-width="2"/>
<text x="446" y="336" font-size="15" fill="#e0c169" text-anchor="start" font-weight="600">gps</text>
<text x="446" y="384" font-size="15" fill="#e9e7e3" text-anchor="start">b0c220eb2a2e</text>
<rect x="654" y="100" width="210" height="46" rx="6" fill="#2b2f35" stroke="#3d4148" stroke-width="1.5"/>
<text x="759" y="122" font-size="15" fill="#e9e7e3" text-anchor="middle" font-weight="600">sorted(...)</text>
<text x="759" y="140" font-size="14" fill="#a7adb5" text-anchor="middle">any seed</text>
<text x="666" y="184" font-size="15" fill="#e9e7e3" text-anchor="start">gps, imu, lidar</text>
<rect x="654" y="214" width="210" height="40" rx="6" fill="#22252a" stroke="#e0c169" stroke-width="2"/>
<text x="666" y="240" font-size="15" fill="#e0c169" text-anchor="start" font-weight="600">gps</text>
<rect x="654" y="262" width="210" height="40" rx="6" fill="#22252a" stroke="#86abe2" stroke-width="2"/>
<text x="666" y="288" font-size="15" fill="#86abe2" text-anchor="start" font-weight="600">imu</text>
<rect x="654" y="310" width="210" height="40" rx="6" fill="#22252a" stroke="#6cc6ba" stroke-width="2"/>
<text x="666" y="336" font-size="15" fill="#6cc6ba" text-anchor="start" font-weight="600">lidar</text>
<text x="666" y="384" font-size="15" fill="#e9e7e3" text-anchor="start">82abb5841065</text>
<text x="32" y="426" font-size="15" fill="#6fc693" text-anchor="start" font-weight="600">Only the sorted loop gives one hash for every PYTHONHASHSEED.</text>
</svg>
