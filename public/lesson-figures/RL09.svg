<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" font-family="Inter, Arial, sans-serif" font-size="14">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e5e7eb"/></marker></defs>
<rect width="760" height="420" fill="#191b1f" rx="12"/>
<text x="380" y="30" fill="#e5e7eb" font-size="16" text-anchor="middle">One-step actor-critic: one TD error feeds two updates</text>
<rect x="30" y="150" width="150" height="90" rx="10" fill="none" stroke="#e5e7eb" stroke-width="2"/>
<text x="105" y="190" fill="#e5e7eb" text-anchor="middle">Environment</text><text x="105" y="212" fill="#e5e7eb" text-anchor="middle">(robot + task)</text>
<rect x="300" y="60" width="170" height="80" rx="10" fill="none" stroke="#d97936" stroke-width="2.5"/>
<text x="385" y="92" fill="#d97936" text-anchor="middle">Actor</text><text x="385" y="116" fill="#e5e7eb" text-anchor="middle">policy pi(a | s; theta)</text>
<rect x="300" y="270" width="170" height="80" rx="10" fill="none" stroke="#53b2dd" stroke-width="2.5"/>
<text x="385" y="302" fill="#53b2dd" text-anchor="middle">Critic</text><text x="385" y="326" fill="#e5e7eb" text-anchor="middle">value V(s; w)</text>
<rect x="560" y="160" width="170" height="70" rx="10" fill="none" stroke="#9ccd4e" stroke-width="2.5"/>
<text x="645" y="188" fill="#9ccd4e" text-anchor="middle">TD error</text><text x="645" y="212" fill="#e5e7eb" text-anchor="middle">d = r + g V(s') - V(s)</text>
<line x1="300" y1="100" x2="180" y2="165" stroke="#e5e7eb" stroke-width="2" marker-end="url(#ar)"/>
<text x="150" y="118" fill="#e5e7eb">action a</text>
<line x1="150" y1="240" x2="300" y2="300" stroke="#e5e7eb" stroke-width="2" marker-end="url(#ar)"/>
<text x="70" y="290" fill="#e5e7eb">s, r, s'</text>
<line x1="470" y1="310" x2="560" y2="225" stroke="#e5e7eb" stroke-width="2" marker-end="url(#ar)"/>
<text x="500" y="300" fill="#e5e7eb">V(s), V(s')</text>
<line x1="600" y1="160" x2="470" y2="105" stroke="#9ccd4e" stroke-width="2.5" marker-end="url(#ar)"/>
<text x="480" y="78" fill="#9ccd4e">actor: theta += a d grad log pi</text>
<line x1="610" y1="230" x2="470" y2="320" stroke="#9ccd4e" stroke-width="2.5" marker-end="url(#ar)"/>
<text x="525" y="352" fill="#9ccd4e">critic: w += b d grad V</text>
<text x="380" y="395" fill="#e5e7eb" text-anchor="middle">If V is wrong, d is a biased advantage and the actor learns from the wrong signal</text>
</svg>
